# One-off removal of the two retained Email recovery copies and their
# StorageClasses, on the maintainer's decisions of 2026-11-13 ("Yes, delete
# them", #6041) and 2026-11-14 (the copy-based cutover closed #5578). Remove
# this workflow once a run has reported REMOVED for both copies.
#
# Each copy is identified only by its fixed name and verified before anything is
# deleted: its namespace carries the recovery labels, its single claim is bound
# to a volume of its own StorageClass, and no other volume uses that class. The
# serving mail claims must stay bound to different volumes before and after.
name: Remove Email Recovery Copies

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: Type remove-email-recovery-copies
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  remove:
    name: Remove the retained Email recovery copies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt main dispatch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_WORKFLOW_REF" != devantler-tech/platform/.github/workflows/remove-email-recovery-copies.yaml@refs/heads/main || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$CONFIRM" != remove-email-recovery-copies ]]; then
            echo 'EMAIL_RECOVERY_COPY_REMOVAL=REFUSED stage=dispatch' >&2
            exit 2
          fi

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"

      - name: Verify and remove both copies
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s' "$KUBE_CONFIG" >"$private_dir/kubeconfig"
          export KUBECONFIG="$private_dir/kubeconfig"
          k() { kubectl --context admin@prod --request-timeout=30s "$@" 2>>"$private_dir/client-errors"; }
          fail() { echo "EMAIL_RECOVERY_COPY_REMOVAL=REFUSED copy=$1 stage=$2" >&2; exit 2; }

          serving_volume() {
            local data
            data="$(k -n private-mail get pvc "$1" --ignore-not-found -o json)" || fail serving read
            if [[ -z "$data" ]]; then printf ABSENT; return; fi
            jq -er '.metadata.uid as $uid | select(($uid | type == "string" and length > 0) and .status.phase == "Bound" and (.spec.volumeName | startswith("pvc-"))) | "Bound/\(.spec.volumeName)/\($uid)"' <<<"$data" || fail serving binding
          }
          serving_before="$(serving_volume private-mail-data)" || fail serving read
          serving_before+=" $(serving_volume email-data-encrypted)" || fail serving read
          [[ "$serving_before" == Bound/pvc-* ]] || fail serving read

          read_required() {
            local file="$1"
            shift
            k get "$@" --ignore-not-found -o json >"$file" || fail "$copy" read
            jq -e '.metadata.uid | strings | select(length > 0)' "$file" >/dev/null || fail "$copy" missing-identity
          }

          # Validate both complete copies before the first delete, and retain the
          # same objects' UIDs for every conditional request and absence check.
          for copy in 41561215415 42818236850; do
            name="email-data-recovery-$copy"
            read_required "$private_dir/$copy-namespace.json" namespace "$name"
            jq -e --arg copy "$copy" '.metadata.labels["app.kubernetes.io/part-of"] == "email-data-recovery" and .metadata.labels["email.devantler.tech/data-recovery"] == $copy' "$private_dir/$copy-namespace.json" >/dev/null || fail "$copy" namespace-labels
            k -n "$name" get pvc -o json >"$private_dir/$copy-claims.json" || fail "$copy" claims
            jq -e '.items | length == 1 and .[0].metadata.name == "data"' "$private_dir/$copy-claims.json" >/dev/null || fail "$copy" claims
            volume="$(jq -er '.items[0].spec.volumeName | strings' "$private_dir/$copy-claims.json")" || fail "$copy" volume
            [[ "$volume" == pvc-* && "$serving_before" != *"$volume"* ]] || fail "$copy" volume
            read_required "$private_dir/$copy-pv.json" pv "$volume"
            jq -e --arg name "$name" '.spec.storageClassName == $name and .spec.claimRef.namespace == $name and .spec.claimRef.name == "data"' "$private_dir/$copy-pv.json" >/dev/null || fail "$copy" volume-binding
            k get pv -o json >"$private_dir/$copy-volumes.json" || fail "$copy" class-users
            jq -e --arg name "$name" --arg volume "$volume" '[.items[] | select(.spec.storageClassName == $name) | .metadata.name] == [$volume]' "$private_dir/$copy-volumes.json" >/dev/null || fail "$copy" class-users
            read_required "$private_dir/$copy-class.json" storageclass "$name"
            jq -e '.provisioner == "driver.longhorn.io"' "$private_dir/$copy-class.json" >/dev/null || fail "$copy" class
            read_required "$private_dir/$copy-backend.json" volumes.longhorn.io "$volume" -n longhorn-system
          done

          remove_owned() {
            local identity="$1" path="$2" timeout="$3" uid current deadline
            shift 3
            uid="$(jq -er '.metadata.uid' "$identity")" || fail "$copy" identity
            current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" read-before-delete
            # A controller may already have removed a captured Retain/backend
            # object. Only a successful NotFound read proves that absence.
            if [[ -z "$current" ]]; then return; fi
            [[ "$(jq -er '.metadata.uid' <<<"$current")" == "$uid" ]] || fail "$copy" replaced
            jq -n --arg uid "$uid" '{apiVersion:"v1",kind:"DeleteOptions",preconditions:{uid:$uid},propagationPolicy:"Foreground"}' >"$private_dir/delete-options.json"
            k delete --raw="$path" -f "$private_dir/delete-options.json" >"$private_dir/delete-result" || fail "$copy" conditional-delete
            deadline=$((SECONDS + timeout))
            while (( SECONDS < deadline )); do
              current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" read-after-delete
              if [[ -z "$current" ]]; then return; fi
              [[ "$(jq -er '.metadata.uid' <<<"$current")" == "$uid" ]] || fail "$copy" replaced
              sleep 2
            done
            fail "$copy" deletion-timeout
          }

          absent() {
            local current
            current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" verify-read
            [[ -z "$current" ]] || fail "$copy" verify-present
          }
          for copy in 41561215415 42818236850; do
            name="email-data-recovery-$copy"
            volume="$(jq -er '.metadata.name' "$private_dir/$copy-pv.json")"
            remove_owned "$private_dir/$copy-namespace.json" "/api/v1/namespaces/$name" 300 namespace "$name"
            remove_owned "$private_dir/$copy-pv.json" "/api/v1/persistentvolumes/$volume" 120 pv "$volume"
            remove_owned "$private_dir/$copy-backend.json" "/apis/longhorn.io/v1beta2/namespaces/longhorn-system/volumes/$volume" 300 volumes.longhorn.io "$volume" -n longhorn-system
            remove_owned "$private_dir/$copy-class.json" "/apis/storage.k8s.io/v1/storageclasses/$name" 60 storageclass "$name"
            absent namespace "$name"
            absent pv "$volume"
            absent volumes.longhorn.io "$volume" -n longhorn-system
            absent storageclass "$name"
            echo "EMAIL_RECOVERY_COPY_REMOVAL=REMOVED copy=$copy"
          done

          serving_after="$(serving_volume private-mail-data)" || fail serving read
          serving_after+=" $(serving_volume email-data-encrypted)" || fail serving read
          [[ "$serving_after" == "$serving_before" ]] || fail serving changed
          echo "EMAIL_RECOVERY_COPY_REMOVAL=COMPLETE serving=UNCHANGED"
