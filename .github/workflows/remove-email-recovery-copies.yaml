# One-off removal of the two retained Email recovery copies and their
# StorageClasses, on the maintainer's decisions of 2026-11-13 ("Yes, delete
# them", #6041) and 2026-11-14 (the copy-based cutover closed #5578). Remove
# this workflow once a run has reported REMOVED for both copies.
#
# Run 43674222442 removed the first copy's namespace and stopped at its volume,
# which stayed attached (#6041). The removal therefore resumes from any prefix
# of its order: namespace, volume, Longhorn volume, StorageClass. Every object
# is pinned by name and by the UID read after that run, and its source binding
# is verified before anything is deleted; a different UID or an out-of-order
# absence refuses. Volumes leave only through ordinary CSI detach: nothing here
# deletes a VolumeAttachment or removes a finalizer. The serving mail claims
# must stay bound to the same volumes before and after.
name: Remove Email Recovery Copies

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: Type remove-email-recovery-copies
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  remove:
    name: Remove the retained Email recovery copies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt main dispatch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_WORKFLOW_REF" != devantler-tech/platform/.github/workflows/remove-email-recovery-copies.yaml@refs/heads/main || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$CONFIRM" != remove-email-recovery-copies ]]; then
            echo 'EMAIL_RECOVERY_COPY_REMOVAL=REFUSED stage=dispatch' >&2
            exit 2
          fi

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"

      - name: Verify and remove both copies
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s' "$KUBE_CONFIG" >"$private_dir/kubeconfig"
          export KUBECONFIG="$private_dir/kubeconfig"
          k() { kubectl --context admin@prod --request-timeout=30s "$@" 2>>"$private_dir/client-errors"; }
          copy=serving
          fail() { echo "EMAIL_RECOVERY_COPY_REMOVAL=REFUSED copy=$1 stage=$2" >&2; exit 2; }

          serving_volume() {
            local data
            data="$(k -n private-mail get pvc "$1" --ignore-not-found -o json)" || fail serving read
            if [[ -z "$data" ]]; then printf ABSENT; return; fi
            jq -er '.metadata.uid as $uid | select(($uid | type == "string" and length > 0) and .status.phase == "Bound" and (.spec.volumeName | startswith("pvc-"))) | "Bound/\(.spec.volumeName)/\($uid)"' <<<"$data" || fail serving binding
          }
          serving_before="$(serving_volume private-mail-data)" || fail serving read
          serving_before+=" $(serving_volume email-data-encrypted)" || fail serving read
          [[ "$serving_before" == Bound/pvc-*" "Bound/pvc-* ]] || fail serving read

          # Reviewed identities, read after run 43674222442 (#6041): copy,
          # namespace UID ("-" when it must already be absent), claim UID,
          # volume, volume UID, Longhorn volume UID, StorageClass UID.
          identities=(
            "41561215415 - 97658b9b-8a22-4f02-8275-697bec198e46 pvc-ba88e988-bd96-4828-bf08-05054047af95 d04d4704-bb6c-436b-85a1-62ce3ec0899a 8d9c0f45-2337-4284-b67b-2f0a715151c6 80c442fe-9dcb-4bbb-99c0-919f39821c45"
            "42818236850 d3c5fc1d-43ef-45e6-a581-58de881875a2 fa4442ce-698b-46b2-a442-ba3ff2e48065 pvc-898b45a4-11cb-4075-9c25-6a3a6bbd9e57 01b86e2f-b35b-49bd-bcf9-ddc3c714cfaf 7fb51fcd-1ae0-49f1-9611-c06088ac506b 4886f450-1d12-4bb0-8ee4-f3313edaddd0"
          )
          load() {
            read -r copy namespace_uid claim_uid volume volume_uid backend_uid class_uid <<<"$1"
            [[ "$namespace_uid" != - ]] || namespace_uid=""
            name="email-data-recovery-$copy"
            [[ "$volume" == pvc-* && "$serving_before" != *"$volume"* ]] || fail "$copy" volume
          }

          # Only a successful NotFound read proves absence: kubectl prints
          # nothing for it, and any other failure refuses.
          read_object() {
            local file="$1"
            shift
            k get "$@" --ignore-not-found -o json >"$file" || fail "$copy" read
          }
          # Present with the pinned UID, or absent; any other UID refuses.
          present() {
            local file="$1" uid="$2" stage="$3" actual
            [[ -s "$file" ]] || return 1
            actual="$(jq -er '.metadata.uid | strings | select(length > 0)' "$file")" || fail "$copy" "$stage-identity"
            [[ -n "$uid" && "$actual" == "$uid" ]] || fail "$copy" "$stage-replaced"
          }
          attachments() {
            k get volumeattachments -o json >"$private_dir/attachments.json" || fail "$copy" attachments
            jq -er --arg volume "$volume" '[.items[] | select(.spec.source.persistentVolumeName == $volume)] | length' "$private_dir/attachments.json" || fail "$copy" attachments
          }
          class_users() {
            k get pv -o json >"$private_dir/volumes.json" || fail "$copy" class-users
            jq -e --arg name "$name" --arg volume "$volume" '[.items[] | select(.spec.storageClassName == $name) | .metadata.name] - [$volume] == []' "$private_dir/volumes.json" >/dev/null || fail "$copy" class-users
          }

          # Validate both copies before the first delete.
          for entry in "${identities[@]}"; do
            load "$entry"
            mkdir "$private_dir/$copy"
            read_object "$private_dir/$copy/namespace.json" namespace "$name"
            read_object "$private_dir/$copy/volume.json" pv "$volume"
            read_object "$private_dir/$copy/backend.json" volumes.longhorn.io "$volume" -n longhorn-system
            read_object "$private_dir/$copy/class.json" storageclass "$name"
            has_namespace=0 has_volume=0 has_backend=0 has_class=0
            if present "$private_dir/$copy/namespace.json" "$namespace_uid" namespace; then
              has_namespace=1
              jq -e --arg copy "$copy" '.metadata.labels["app.kubernetes.io/part-of"] == "email-data-recovery" and .metadata.labels["email.devantler.tech/data-recovery"] == $copy' "$private_dir/$copy/namespace.json" >/dev/null || fail "$copy" namespace-labels
              k -n "$name" get pvc -o json >"$private_dir/$copy/claims.json" || fail "$copy" claims
              jq -e --arg uid "$claim_uid" --arg volume "$volume" '.items | length == 1 and .[0].metadata.name == "data" and .[0].metadata.uid == $uid and .[0].spec.volumeName == $volume' "$private_dir/$copy/claims.json" >/dev/null || fail "$copy" claims
            fi
            if present "$private_dir/$copy/volume.json" "$volume_uid" volume; then
              has_volume=1
              jq -e --arg name "$name" --arg uid "$claim_uid" '.spec.storageClassName == $name and .spec.claimRef.namespace == $name and .spec.claimRef.name == "data" and .spec.claimRef.uid == $uid' "$private_dir/$copy/volume.json" >/dev/null || fail "$copy" volume-binding
            fi
            if present "$private_dir/$copy/backend.json" "$backend_uid" backend; then
              has_backend=1
              jq -e --arg name "$name" --arg volume "$volume" '.status.kubernetesStatus.namespace == $name and .status.kubernetesStatus.pvcName == "data" and .status.kubernetesStatus.pvName == $volume' "$private_dir/$copy/backend.json" >/dev/null || fail "$copy" backend-binding
            fi
            if present "$private_dir/$copy/class.json" "$class_uid" class; then
              has_class=1
              jq -e '.provisioner == "driver.longhorn.io"' "$private_dir/$copy/class.json" >/dev/null || fail "$copy" class
              class_users
            fi
            # Removal follows one order, so an object can be gone only after
            # every object before it.
            (( has_namespace <= has_volume && has_volume <= has_backend && has_backend <= has_class )) || fail "$copy" order
            # A copy whose claim is gone must already have detached.
            if (( ! has_namespace )); then
              attached="$(attachments)"
              (( attached == 0 )) || fail "$copy" detach-pending
              if (( has_backend )); then
                jq -e '.status.state == "detached"' "$private_dir/$copy/backend.json" >/dev/null || fail "$copy" backend-in-use
              fi
            fi
          done

          # Delete one pinned object and wait for a NotFound read. An object
          # already being deleted is only waited on, never forced.
          remove() {
            local stage="$1" uid="$2" path="$3" timeout="$4" current deadline
            shift 4
            current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" "$stage-read"
            if [[ -z "$current" ]]; then return 0; fi
            [[ -n "$uid" && "$(jq -er '.metadata.uid' <<<"$current")" == "$uid" ]] || fail "$copy" "$stage-replaced"
            if jq -e '.metadata.deletionTimestamp == null' <<<"$current" >/dev/null; then
              jq -n --arg uid "$uid" '{apiVersion:"v1",kind:"DeleteOptions",preconditions:{uid:$uid},propagationPolicy:"Foreground"}' >"$private_dir/delete-options.json"
              k delete --raw="$path" -f "$private_dir/delete-options.json" >"$private_dir/delete-result" || fail "$copy" "$stage-delete"
            fi
            deadline=$((SECONDS + timeout))
            while (( SECONDS < deadline )); do
              current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" "$stage-read"
              if [[ -z "$current" ]]; then return 0; fi
              [[ "$(jq -er '.metadata.uid' <<<"$current")" == "$uid" ]] || fail "$copy" "$stage-replaced"
              sleep 2
            done
            fail "$copy" "$stage-timeout"
          }
          absent() {
            local current
            current="$(k get "$@" --ignore-not-found -o json)" || fail "$copy" verify-read
            [[ -z "$current" ]] || fail "$copy" verify-present
          }

          for entry in "${identities[@]}"; do
            load "$entry"
            remove namespace "$namespace_uid" "/api/v1/namespaces/$name" 300 namespace "$name"
            # The volume goes once its CSI detach completes on its node.
            remove volume "$volume_uid" "/api/v1/persistentvolumes/$volume" 600 pv "$volume"
            attached="$(attachments)"
            (( attached == 0 )) || fail "$copy" detach-pending
            read_object "$private_dir/$copy/backend.json" volumes.longhorn.io "$volume" -n longhorn-system
            if [[ -s "$private_dir/$copy/backend.json" ]]; then
              jq -e '.status.state == "detached"' "$private_dir/$copy/backend.json" >/dev/null || fail "$copy" backend-in-use
            fi
            remove backend "$backend_uid" "/apis/longhorn.io/v1beta2/namespaces/longhorn-system/volumes/$volume" 300 volumes.longhorn.io "$volume" -n longhorn-system
            class_users
            remove class "$class_uid" "/apis/storage.k8s.io/v1/storageclasses/$name" 60 storageclass "$name"
            absent namespace "$name"
            absent pv "$volume"
            absent volumes.longhorn.io "$volume" -n longhorn-system
            absent storageclass "$name"
            echo "EMAIL_RECOVERY_COPY_REMOVAL=REMOVED copy=$copy"
          done

          copy=serving
          serving_after="$(serving_volume private-mail-data)" || fail serving read
          serving_after+=" $(serving_volume email-data-encrypted)" || fail serving read
          [[ "$serving_after" == "$serving_before" ]] || fail serving changed
          echo "EMAIL_RECOVERY_COPY_REMOVAL=COMPLETE serving=UNCHANGED"
