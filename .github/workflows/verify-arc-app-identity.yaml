name: Verify ARC App Identity

# Production proof is manual only. PRs run credential-free fixtures.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-arc-app-identity.yaml
      - scripts/verify-arc-app-identity/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      mode:
        description: "Check transport health or the existing App identity"
        required: true
        default: identity
        type: choice
        options: [identity, transport]
      confirm:
        description: "Type verify-arc-app-identity or verify-arc-app-transport for the selected mode"
        required: true
        type: string

permissions: {}
jobs:
  fixtures:
    name: Test ARC identity verifier without credentials
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: arc-identity-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise TLS and API negative controls
        run: |
          go test -race ./scripts/verify-arc-app-identity
          go vet ./scripts/verify-arc-app-identity

  identity:
    name: Verify selected ARC prerequisite
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      ARC_IDENTITY_CONFIRM: ${{ inputs.confirm }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Require protected invocation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          case "${MODE}:${CONFIRM}" in
            identity:verify-arc-app-identity | transport:verify-arc-app-transport) ;;
            *) exit 1 ;;
          esac

      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and build verifier without credentials
        run: |
          go test -race ./scripts/verify-arc-app-identity
          go build -o "${RUNNER_TEMP}/verify-arc-app-identity" ./scripts/verify-arc-app-identity

      - name: Require encrypted declared credential transport
        run: '"${RUNNER_TEMP}/verify-arc-app-identity" --preflight'

      - name: Restore existing protected kubeconfig
        id: kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config

      - name: Select stable production endpoint without publishing its details
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            if [[ "${MODE}" == transport ]]; then
              echo 'ARC_APP_TRANSPORT=HOLD_ENDPOINT'
            else
              echo 'ARC_APP_IDENTITY=HOLD_ENDPOINT'
            fi
            exit 1
          fi

      - name: Verify selected prerequisite without activation
        shell: bash
        run: |
          set -euo pipefail
          case "${MODE}" in
            identity) "${RUNNER_TEMP}/verify-arc-app-identity" --verify ;;
            transport) "${RUNNER_TEMP}/verify-arc-app-identity" --transport ;;
            *) exit 1 ;;
          esac

      - name: Remove restored kubeconfig
        if: ${{ always() && steps.kubeconfig.outcome == 'success' }}
        shell: bash
        run: rm -f ~/.kube/config
