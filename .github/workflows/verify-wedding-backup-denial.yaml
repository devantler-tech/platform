name: Verify Wedding Backup Denial

# Prove that the dedicated Wedding backup credential is refused by the shared
# backup destination (#3253). Shared recovery access is retired only after a
# successful run of this proof.
#
# DORMANT. There is no schedule and no pull_request trigger, and the operator
# must type an exact confirmation phrase, so an accidental dispatch does nothing.
#
# MAIN ONLY. `workflow_dispatch` accepts any branch, and this job holds the
# production kubeconfig. The prod environment already refuses non-main refs; the
# explicit check below fails fast and names the reason.
#
# ONE PROBE WRITE. Every access the proof makes to the shared destination with
# the dedicated credential is one that destination must refuse. Its only write
# is a run-owned probe object; unless that write was refused, the proof removes
# the probe object with the shared credential and fails. Beyond that removal,
# the shared credential only lists.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: verify-wedding-backup-denial"
        required: true
        type: string

permissions: {}

# The proof reads production state and both backup credentials. Serialize with
# every other production mutation so a deploy cannot change the wiring mid-run.
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  denial:
    name: 💒 Prove the shared destination refuses the dedicated credential
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read # checkout repository
    steps:
      # Inputs reach bash through env, never `${{ }}` inside run, so a crafted
      # value cannot inject shell.
      - name: 🛑 Require main and explicit confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${DISPATCH_REF}" != 'refs/heads/main' ]]; then
            printf 'Refusing to run from %s: dispatch this workflow from main.\n' "${DISPATCH_REF}" >&2
            exit 1
          fi
          if [[ "${CONFIRM}" != 'verify-wedding-backup-denial' ]]; then
            printf 'Refusing to run: the confirm input must be exactly "verify-wedding-backup-denial".\n' >&2
            printf 'The proof attempts a write to a production bucket that must be refused. Nothing has been touched.\n' >&2
            exit 1
          fi
          printf 'Confirmation accepted.\n'

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 🔑 Restore production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config

      - name: 🎯 Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh

      - name: 💒 Attempt shared-destination access with the dedicated credential
        shell: bash
        run: ./scripts/verify-wedding-backup-denial.sh --confirm
