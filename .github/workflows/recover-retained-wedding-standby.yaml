name: Recover Retained Wedding Standby

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recover-retained-wedding-standby.yaml
      - scripts/replace-wedding-standby/**
  merge_group:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: retain-volume-rebuild-completed-standby"
        required: true
        type: string
      cluster_uid:
        description: Current Wedding Cluster UID from an OIDC read
        required: true
        type: string
      pod_uid:
        description: Current completed join Pod UID from an OIDC read
        required: true
        type: string
      job_uid:
        description: Current completed join Job UID from an OIDC read
        required: true
        type: string
      claim_uid:
        description: Current detached original PVC UID from an OIDC read
        required: true
        type: string
      volume_uid:
        description: Current retained original PV UID from an OIDC read
        required: true
        type: string

permissions: {}

jobs:
  tests:
    name: 🛡️ Validate retained standby recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test bound observations and conditional recovery writes
        run: go test -race -count=1 -timeout=5m ./scripts/replace-wedding-standby

  repair:
    name: 💒 Retain old volume and rebuild the stalled standby
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      WEDDING_REPAIR_CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and separate explicit confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${CONFIRM}" == retain-volume-rebuild-completed-standby && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
      - name: 📑 Checkout reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current main recovery source
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 🔑 Restore production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config
      - name: 🎯 Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh
      - name: Quarantine retained storage and verify fresh healthy replacement
        shell: bash
        env:
          CLUSTER_UID: ${{ inputs.cluster_uid }}
          POD_UID: ${{ inputs.pod_uid }}
          JOB_UID: ${{ inputs.job_uid }}
          CLAIM_UID: ${{ inputs.claim_uid }}
          VOLUME_UID: ${{ inputs.volume_uid }}
        run: |
          set -euo pipefail
          go run ./scripts/replace-wedding-standby --execute --quarantine-completed-join --cluster-uid "${CLUSTER_UID}" --pod-uid "${POD_UID}" --job-uid "${JOB_UID}" --claim-uid "${CLAIM_UID}" --volume-uid "${VOLUME_UID}"
