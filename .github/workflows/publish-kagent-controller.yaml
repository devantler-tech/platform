---
name: Publish kagent controller

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-controller.yaml
      - scripts/kagent-controller/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-controller.yaml
      - scripts/kagent-controller/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/platform-kagent-controller
  IMAGE_TAG: 1.0.0-startup-${{ github.sha }}

jobs:
  verify:
    name: Verify scheduled startup and build the controller
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    outputs:
      archive_sha: ${{ steps.archive.outputs.sha }}
      image_id: ${{ steps.archive.outputs.image_id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned kagent release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kagent-dev/kagent
          ref: a08cde76ad6482dd758a4220b14213d79185ac30
          path: upstream
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: upstream/go/go.mod
          cache: false
      - name: Apply reviewed startup patch
        run: git -C upstream apply --index --unidiff-zero --whitespace=error-all "${GITHUB_WORKSPACE}/scripts/kagent-controller/scheduled-startup.patch"
      - name: Test dispatch, storage and lifecycle
        working-directory: upstream/go
        run: |
          set -euo pipefail
          envtest_minor="$(go list -m -f '{{ .Version }}' k8s.io/api | awk -F'[v.]' '{printf "1.%d", $3}')"
          export KUBEBUILDER_ASSETS
          KUBEBUILDER_ASSETS="$(go tool setup-envtest use "${envtest_minor}" --bin-dir "${RUNNER_TEMP}/kagent-envtest" -p path)"
          test -d "${KUBEBUILDER_ASSETS}"
          go test -p 3 -timeout 8m \
            ./core/internal/controller/scheduledrun ./core/internal/database \
            ./core/internal/service/session ./core/internal/grpcserver ./core/internal/substrate
      - name: Build and smoke-test the image
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          cp scripts/kagent-controller/Dockerfile scripts/kagent-controller/IMAGE-NOTICE upstream/LICENSE "${context}/"
          (
            cd upstream/go
            # kagent's chart checks that the binary reports the release of its harness catalog.
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -ldflags '-X github.com/kagent-dev/kagent/go/core/internal/version.Version=1.0.0 -X github.com/kagent-dev/kagent/go/core/internal/version.GitCommit=a08cde76ad6482dd758a4220b14213d79185ac30 -X github.com/kagent-dev/kagent/go/core/internal/version.SubstrateVersion=1.0.0' \
              -o "${context}/app" ./core/cmd/controller
          )
          docker build --platform linux/amd64 --tag "${IMAGE}:${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" "${context}"
          docker run --rm --network none "${IMAGE}:${IMAGE_TAG}" --help
          docker run --rm --network none --entrypoint /bin/sh "${IMAGE}:${IMAGE_TAG}" -ec 'test "$(id -u)" = 65532'
          docker run --rm -i --network none --entrypoint /bin/sh "${IMAGE}:${IMAGE_TAG}" -s \
            < scripts/kagent-controller/smoke-startup.sh
      - name: Archive the verified image
        id: archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker save --output "${RUNNER_TEMP}/kagent-controller.tar" "${IMAGE}:${IMAGE_TAG}"
          sha="$(sha256sum "${RUNNER_TEMP}/kagent-controller.tar" | cut -d ' ' -f 1)"
          image_id="$(docker image inspect --format '{{.Id}}' "${IMAGE}:${IMAGE_TAG}")"
          [[ "${sha}" =~ ^[a-f0-9]{64}$ && "${image_id}" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'sha=%s\nimage_id=%s\n' "${sha}" "${image_id}" >> "${GITHUB_OUTPUT}"
      - name: Upload the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kagent-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kagent-controller.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Sign the verified controller
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Download the verified image from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kagent-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kagent-verified
      - name: Check and load the verified image
        env:
          ARCHIVE_SHA: ${{ needs.verify.outputs.archive_sha }}
          IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ "${ARCHIVE_SHA}" =~ ^[a-f0-9]{64}$ && "${IMAGE_ID}" =~ ^sha256:[a-f0-9]{64}$ ]]
          file="${RUNNER_TEMP}/kagent-verified/kagent-controller.tar"
          printf '%s  %s\n' "${ARCHIVE_SHA}" "${file}" | sha256sum -c -
          docker load --input "${file}"
          test "$(docker image inspect --format '{{.Id}}' "${IMAGE}:${IMAGE_TAG}")" = "${IMAGE_ID}"
      - name: Set up Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, sign and verify the digest
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${IMAGE_TAG}"
          ref="$(docker image inspect --format '{{json .RepoDigests}}' "${IMAGE}:${IMAGE_TAG}" |
            jq -er --arg prefix "${IMAGE}@sha256:" 'map(select(startswith($prefix))) | if length == 1 then .[0] else error("ambiguous digest") end')"
          cosign sign --yes "${ref}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish-kagent-controller.yaml@refs/heads/main"
          cosign verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "${ref}"
          printf 'Published and verified: %s\n' "${ref}"
