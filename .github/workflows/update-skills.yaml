---
name: Update Agent Skills
"on":
  workflow_dispatch:
    inputs:
      unpin:
        description: >-
          Release every pinned skill (gh skill update --unpin). Use once after removing a
          hold from `pins`; the scheduled run never sets it.
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

# queue: single is the DELIBERATE choice here, not the unexamined default.
# This job converges .agents/skills to whatever upstream currently holds and
# opens/updates a PR, so the newest run always produces the correct end state
# and a dropped pending run loses nothing — the work is idempotent rather than
# event-carrying. Contrast the prod-deploy group, which is queue: max because
# each deploy is a distinct state transition that must actually happen.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
  queue: single

permissions: {}

jobs:
  update-agent-skills:
    permissions:
      contents: write
      pull-requests: write
    uses: devantler-tech/update-agent-skills-action/.github/workflows/update-agent-skills.yaml@31a0f0bf3fd4c8bd58ead01f5d182ea31ce17296 # v1.0.3
    with:
      dir: .agents/skills
      # These are development skills our own agents use, not skills the platform publishes.
      # Marking them internal after every update keeps `npx skills add devantler-tech/platform`
      # from offering them (devantler-tech/ksail#6221).
      mark-internal: true
      # No skill is held. To hold one at a reviewed upstream commit, add a `pins:` block naming
      # its tracking issue. Removing that block leaves the skill's pinned metadata in place, so
      # release it with one dispatch that sets `unpin`; the updater refuses both together.
      # The git-commit hold (devantler-tech/platform#5224) ended once upstream fixed it in
      # github/awesome-copilot#6261 (devantler-tech/agent-plugins#598).
      unpin: ${{ inputs.unpin == true }}
      # Create the update PR with a GitHub App token so it triggers this
      # repo's required CI (a PR opened with GITHUB_TOKEN does not), instead
      # of landing permanently blocked on missing required checks.
      use-app-token: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
