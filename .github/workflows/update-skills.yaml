name: Update Agent Skills
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

# queue: single is the DELIBERATE choice here, not the unexamined default.
# This job converges .agents/skills to whatever upstream currently holds and
# opens/updates a PR, so the newest run always produces the correct end state
# and a dropped pending run loses nothing — the work is idempotent rather than
# event-carrying. Contrast the prod-deploy group, which is queue: max because
# each deploy is a distinct state transition that must actually happen.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
  queue: single

permissions: {}

jobs:
  update-agent-skills:
    permissions:
      contents: write
      pull-requests: write
    uses: devantler-tech/actions/.github/workflows/update-agent-skills.yaml@759ff9b2526cd1b142b49c5dc1616118a1ef44d9 # v13.6.0
    with:
      dir: .agents/skills
      # These are development skills our own agents use, not skills the platform publishes.
      # Marking them internal after every update keeps `npx skills add devantler-tech/platform`
      # from offering them (devantler-tech/ksail#6221).
      mark-internal: true
      # Create the update PR with a GitHub App token so it triggers this
      # repo's required CI (a PR opened with GITHUB_TOKEN does not), instead
      # of landing permanently blocked on missing required checks.
      use-app-token: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
