name: Clean Up Orphan Generated VPAs
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Assess candidates or apply the preconditioned cleanup
        required: true
        default: assess
        type: choice
        options: [assess, apply]
      confirm:
        description: "Type exactly: cleanup-orphan-generated-vpas"
        required: true
        type: string
permissions: {}
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    permissions:
      contents: read
    env:
      VPA_CLEANUP_MODE: ${{ inputs.mode }}
      VPA_CLEANUP_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require the confirmed first-attempt main dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == devantler-tech/platform &&
             "${GITHUB_EVENT_NAME}" == workflow_dispatch &&
             "${GITHUB_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 &&
             "${VPA_CLEANUP_CONFIRM}" == cleanup-orphan-generated-vpas &&
             ( "${VPA_CLEANUP_MODE}" == assess || "${VPA_CLEANUP_MODE}" == apply ) ]]
      - name: Checkout the reviewed dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/vpa-cleanup-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vpa-cleanup-tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/vpa-cleanup-tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/vpa-cleanup-tools" >> "$GITHUB_PATH"
      - name: Restore production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config
      - name: Select the stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh >/dev/null
      - name: Assess or clean up proven orphan generated autoscalers
        shell: bash
        run: bash scripts/cleanup-orphan-generated-vpas.sh "${VPA_CLEANUP_MODE}"
