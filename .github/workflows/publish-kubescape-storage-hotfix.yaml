---
name: Publish Kubescape Storage Hotfix

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-kubescape-storage-hotfix.yaml
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sqlite-contention.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-scan-record-cleanup.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-metadata-repair.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-native-codec.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sbom-forward-codec.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-security-dependencies.patch
      - scripts/tests/test-kubescape-storage-hotfix.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-kubescape-storage-hotfix.yaml
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sqlite-contention.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-scan-record-cleanup.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-metadata-repair.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-native-codec.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sbom-forward-codec.patch
      - k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-security-dependencies.patch
      - scripts/tests/test-kubescape-storage-hotfix.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KUBESCAPE_STORAGE_SOURCE_COMMIT: b35788b68337134fc2514574cde1ba7f1225fd43
  IMAGE: ghcr.io/devantler-tech/platform-kubescape-storage
  IMAGE_TAG: v0.0.297-sqlite-contention.11-${{ github.sha }}
  PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sqlite-contention.patch
  CLEANUP_PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-scan-record-cleanup.patch
  SUMMARY_REPAIR_PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-metadata-repair.patch
  NATIVE_CODEC_PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-summary-native-codec.patch
  SBOM_CODEC_PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-sbom-forward-codec.patch
  DEPENDENCY_SECURITY_PATCH_PATH: k8s/bases/infrastructure/controllers/kubescape/storage-v0.0.297-security-dependencies.patch
  STORAGE_GO_VERSION: "1.26.10"
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify pinned source and patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Kubescape storage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubescape/storage
          ref: ${{ env.KUBESCAPE_STORAGE_SOURCE_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.STORAGE_GO_VERSION }}
          cache: false

      - name: Apply and test compatibility patch
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.KUBESCAPE_STORAGE_SOURCE_COMMIT }}
          HOTFIX_PATCH: ${{ github.workspace }}/${{ env.PATCH_PATH }}
          CLEANUP_PATCH: ${{ github.workspace }}/${{ env.CLEANUP_PATCH_PATH }}
          SUMMARY_REPAIR_PATCH: ${{ github.workspace }}/${{ env.SUMMARY_REPAIR_PATCH_PATH }}
          NATIVE_CODEC_PATCH: ${{ github.workspace }}/${{ env.NATIVE_CODEC_PATCH_PATH }}
          SBOM_CODEC_PATCH: ${{ github.workspace }}/${{ env.SBOM_CODEC_PATCH_PATH }}
          DEPENDENCY_SECURITY_PATCH: ${{ github.workspace }}/${{ env.DEPENDENCY_SECURITY_PATCH_PATH }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git apply --check "${CLEANUP_PATCH}"
          git apply "${CLEANUP_PATCH}"
          git apply --check "${SUMMARY_REPAIR_PATCH}"
          git apply "${SUMMARY_REPAIR_PATCH}"
          # Bind the exact preimage and result of the generated zero-context patch.
          test "$(git hash-object pkg/registry/file/summary_metadata_repair.go)" = 3f044057cba5614fdbcca8104f27cdb086641d29
          test "$(git hash-object pkg/registry/file/summary_metadata_repair_test.go)" = 5f0ee570bc1f758f0c2e4dcaae4ee7b5a4ce3717
          git apply --check --unidiff-zero "${NATIVE_CODEC_PATCH}"
          git apply --unidiff-zero "${NATIVE_CODEC_PATCH}"
          test "$(git hash-object pkg/registry/file/summary_metadata_repair.go)" = 8e0b39495ccf9d24de543443fec7169b36cadc5a
          test "$(git hash-object pkg/registry/file/summary_metadata_repair_test.go)" = 24ef7781d710ce92453fed46ec92b0dd52830f89
          test "$(git hash-object pkg/apis/softwarecomposition/syfttypes.go)" = 3c27c5a8d6b583a1b314619c56bf03d2958a13ca
          test "$(git hash-object pkg/apis/softwarecomposition/v1beta1/syfttypes.go)" = f9dd4f9c908002352e5e63990c9fb44303804879
          test "$(git hash-object pkg/apis/softwarecomposition/sourcemetadata/sourcemetadata.go)" = 84836b7818ac5812f4ffc1b41fba528f0c50c820
          git apply --check --unidiff-zero "${SBOM_CODEC_PATCH}"
          git apply --unidiff-zero "${SBOM_CODEC_PATCH}"
          test "$(git hash-object pkg/apis/softwarecomposition/syfttypes.go)" = 9543f961e697d8daa7ed54d1f42cb0b857f6f848
          test "$(git hash-object pkg/apis/softwarecomposition/v1beta1/syfttypes.go)" = ea67fc8f1979614888f32ab632e03b509b31530f
          test "$(git hash-object pkg/apis/softwarecomposition/sourcemetadata/sourcemetadata.go)" = 2d85a42091d0512b6d3ccb23e9044b426abb25f2
          test "$(git hash-object pkg/apis/softwarecomposition/packagemetadata/forward.go)" = 2414195cc561eeeb36770260d11d111472a9e2b8
          test "$(git hash-object pkg/apis/softwarecomposition/metadata_forward_compatibility_test.go)" = 7280eebef1916127dc21642e3f6663b19ca44a46
          test "$(git hash-object go.mod)" = 46719c0bae6a2f5ada53cb07c4f44380a142407e
          test "$(git hash-object go.sum)" = 2fc66f0552bb939c9331ab0228ad8c63be8b8ec3
          test "$(git hash-object build/Dockerfile)" = e57051966907363749904344c08679d79771c8a0
          git apply --check --unidiff-zero "${DEPENDENCY_SECURITY_PATCH}"
          git apply --unidiff-zero "${DEPENDENCY_SECURITY_PATCH}"
          test "$(git hash-object go.mod)" = a2c6f7d0c07f3f3254d3ec51f804174397c430ea
          test "$(git hash-object go.sum)" = ea04b6bd297b61ba4ffb84649a28da1692d49b85
          test "$(git hash-object build/Dockerfile)" = b38800dc24c63c9ba3abf6992a8d6a2bdaea91c5
          git diff --check
          go test -race ./pkg/apis/softwarecomposition/... ./pkg/registry/file

      - name: Audit both storage executables
        working-directory: upstream
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d "${RUNNER_TEMP}/kubescape-storage-audit.XXXXXX")"
          GOBIN="${audit_dir}" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "${audit_dir}/storage" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "${audit_dir}/migration" ./cmd/migration/main.go
          for binary in storage migration; do
            if "${audit_dir}/govulncheck" -mode=binary "${audit_dir}/${binary}" >"${audit_dir}/${binary}.log" 2>&1; then
              printf '%s binary audit: no matched affected functions\n' "${binary}"
            else
              audit_status=$?
              printf '%s binary audit failed (exit %d); reproduce with the pinned source and toolchain before publication\n' "${binary}" "${audit_status}" >&2
              exit "${audit_status}"
            fi
          done

      - name: Build compatibility image without publishing
        working-directory: upstream
        env:
          VERSION: ${{ env.IMAGE_TAG }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file build/Dockerfile \
            --build-arg "image_version=${VERSION}" \
            .

  publish:
    name: Publish and sign immutable image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Kubescape storage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubescape/storage
          ref: ${{ env.KUBESCAPE_STORAGE_SOURCE_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Reapply reviewed patch to exact source
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.KUBESCAPE_STORAGE_SOURCE_COMMIT }}
          HOTFIX_PATCH: ${{ github.workspace }}/${{ env.PATCH_PATH }}
          CLEANUP_PATCH: ${{ github.workspace }}/${{ env.CLEANUP_PATCH_PATH }}
          SUMMARY_REPAIR_PATCH: ${{ github.workspace }}/${{ env.SUMMARY_REPAIR_PATCH_PATH }}
          NATIVE_CODEC_PATCH: ${{ github.workspace }}/${{ env.NATIVE_CODEC_PATCH_PATH }}
          SBOM_CODEC_PATCH: ${{ github.workspace }}/${{ env.SBOM_CODEC_PATCH_PATH }}
          DEPENDENCY_SECURITY_PATCH: ${{ github.workspace }}/${{ env.DEPENDENCY_SECURITY_PATCH_PATH }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git apply --check "${CLEANUP_PATCH}"
          git apply "${CLEANUP_PATCH}"
          git apply --check "${SUMMARY_REPAIR_PATCH}"
          git apply "${SUMMARY_REPAIR_PATCH}"
          # Bind the exact preimage and result of the generated zero-context patch.
          test "$(git hash-object pkg/registry/file/summary_metadata_repair.go)" = 3f044057cba5614fdbcca8104f27cdb086641d29
          test "$(git hash-object pkg/registry/file/summary_metadata_repair_test.go)" = 5f0ee570bc1f758f0c2e4dcaae4ee7b5a4ce3717
          git apply --check --unidiff-zero "${NATIVE_CODEC_PATCH}"
          git apply --unidiff-zero "${NATIVE_CODEC_PATCH}"
          test "$(git hash-object pkg/registry/file/summary_metadata_repair.go)" = 8e0b39495ccf9d24de543443fec7169b36cadc5a
          test "$(git hash-object pkg/registry/file/summary_metadata_repair_test.go)" = 24ef7781d710ce92453fed46ec92b0dd52830f89
          test "$(git hash-object pkg/apis/softwarecomposition/syfttypes.go)" = 3c27c5a8d6b583a1b314619c56bf03d2958a13ca
          test "$(git hash-object pkg/apis/softwarecomposition/v1beta1/syfttypes.go)" = f9dd4f9c908002352e5e63990c9fb44303804879
          test "$(git hash-object pkg/apis/softwarecomposition/sourcemetadata/sourcemetadata.go)" = 84836b7818ac5812f4ffc1b41fba528f0c50c820
          git apply --check --unidiff-zero "${SBOM_CODEC_PATCH}"
          git apply --unidiff-zero "${SBOM_CODEC_PATCH}"
          test "$(git hash-object pkg/apis/softwarecomposition/syfttypes.go)" = 9543f961e697d8daa7ed54d1f42cb0b857f6f848
          test "$(git hash-object pkg/apis/softwarecomposition/v1beta1/syfttypes.go)" = ea67fc8f1979614888f32ab632e03b509b31530f
          test "$(git hash-object pkg/apis/softwarecomposition/sourcemetadata/sourcemetadata.go)" = 2d85a42091d0512b6d3ccb23e9044b426abb25f2
          test "$(git hash-object pkg/apis/softwarecomposition/packagemetadata/forward.go)" = 2414195cc561eeeb36770260d11d111472a9e2b8
          test "$(git hash-object pkg/apis/softwarecomposition/metadata_forward_compatibility_test.go)" = 7280eebef1916127dc21642e3f6663b19ca44a46
          test "$(git hash-object go.mod)" = 46719c0bae6a2f5ada53cb07c4f44380a142407e
          test "$(git hash-object go.sum)" = 2fc66f0552bb939c9331ab0228ad8c63be8b8ec3
          test "$(git hash-object build/Dockerfile)" = e57051966907363749904344c08679d79771c8a0
          git apply --check --unidiff-zero "${DEPENDENCY_SECURITY_PATCH}"
          git apply --unidiff-zero "${DEPENDENCY_SECURITY_PATCH}"
          test "$(git hash-object go.mod)" = a2c6f7d0c07f3f3254d3ec51f804174397c430ea
          test "$(git hash-object go.sum)" = ea04b6bd297b61ba4ffb84649a28da1692d49b85
          test "$(git hash-object build/Dockerfile)" = b38800dc24c63c9ba3abf6992a8d6a2bdaea91c5
          git diff --check

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compatibility image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./upstream/build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: image_version=${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            io.devantler.kubescape-storage.upstream-revision=${{ env.KUBESCAPE_STORAGE_SOURCE_COMMIT }}

      - name: Install checksum-verified supply-chain tools
        run: bash .github/scripts/setup-supply-chain-tools.sh

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-kubescape-storage-hotfix.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
