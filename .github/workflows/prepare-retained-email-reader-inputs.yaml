name: Prepare Retained Email Reader Inputs

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: prepare-retained-email-reader-inputs"
        required: true
        type: string

permissions: {}
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Preserve the fixed retained reader inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt main dispatch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_ACTIONS" != true || "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_WORKFLOW_REF" != devantler-tech/platform/.github/workflows/prepare-retained-email-reader-inputs.yaml@refs/heads/main || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$RUNNER_ENVIRONMENT" != github-hosted || "$CONFIRM" != prepare-retained-email-reader-inputs ]]; then
            printf '%s\n' 'EMAIL_READER_INPUT_CUSTODY=UNVERIFIED stage=dispatch restart=NOT_AUTHORIZED recovery=UNVERIFIED' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the repository Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the reviewed command before restoring credentials
        shell: bash
        run: go build -o "$RUNNER_TEMP/verify-email-data-recovery" ./scripts/verify-email-data-recovery

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/email-reader-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/email-reader-tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/email-reader-tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/email-reader-tools" >> "$GITHUB_PATH"

      - name: Copy and verify the exact retained inputs without pausing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          EMAIL_RETAINED_READER_UID: ${{ secrets.EMAIL_RETAINED_READER_UID }}
          EMAIL_RETAINED_CLAIM_UID: ${{ secrets.EMAIL_RETAINED_CLAIM_UID }}
          EMAIL_READER_INPUTS_CONFIRM: ${{ inputs.confirm }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          fail() { printf '%s\n' 'EMAIL_READER_INPUT_CUSTODY=UNVERIFIED stage=workspace restart=NOT_AUTHORIZED recovery=UNVERIFIED' >&2; exit 2; }
          [[ $(findmnt -n -o FSTYPE --target /dev/shm) == tmpfs ]] || fail
          private_dir="$(mktemp -d /dev/shm/email-reader-inputs.XXXXXXXX)"
          forward_pid=
          cleanup() {
            if [[ -n "$forward_pid" ]]; then
              kill "$forward_pid" 2>/dev/null || true
              wait "$forward_pid" 2>/dev/null || true
            fi
            rm -rf "$private_dir"
          }
          trap cleanup EXIT
          [[ -n "$KUBE_CONFIG" && ${#KUBE_CONFIG} -le 1048576 ]] || fail
          export KUBECONFIG="$private_dir/kubeconfig"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          unset KUBE_CONFIG
          # The helper sends GitHub's masking commands on stderr. Preserve
          # that stream so later native-client output remains redacted.
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            fail
          fi
          unset HCLOUD_TOKEN
          if ! ./scripts/verify-prod-recovery-source.sh "$GITHUB_SHA" > /dev/null 2>"$private_dir/source.log"; then fail; fi
          kc=(kubectl --context=admin@prod --request-timeout=20s)
          if ! "${kc[@]}" -n openbao get secret openbao-unseal -o jsonpath='{.data.root-token}' 2>"$private_dir/reader.log" |
              base64 --decode > "$private_dir/token" 2>"$private_dir/decode.log"; then fail; fi
          [[ -s "$private_dir/token" ]] || fail
          "${kc[@]}" -n openbao port-forward --address=127.0.0.1 service/openbao-active 38200:8200 > "$private_dir/forward.log" 2>&1 &
          forward_pid=$!
          ready=false
          for ((attempt=0; attempt<20; attempt++)); do
            kill -0 "$forward_pid" 2>/dev/null || fail
            if curl --disable --silent --fail --noproxy '*' --connect-timeout 1 --max-time 2 \
                http://127.0.0.1:38200/v1/sys/health > "$private_dir/health.json" 2>"$private_dir/health.log"; then
              if jq -e '.initialized==true and .sealed==false and .standby==false' "$private_dir/health.json" > /dev/null; then ready=true; break; fi
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || fail
          export EMAIL_READER_INPUTS_WORK_DIR="$private_dir"
          "$RUNNER_TEMP/verify-email-data-recovery" --prepare-reader-inputs
