# One-off replacement of the single Kubescape node-agent pod that is taken to
# hold Email recovery copy 42818236850's encrypted device open (#6041, #6327).
# The copy's claim and pod are gone and its volume is deleting, but the CSI
# driver cannot close its LUKS device ("still in use"), so the volume stays
# attached. That pod is the only one that watched the copy's reader pod up to
# its unmount; this is an inference, not node-level proof. Replacing the pod is
# therefore also the test: the run reports whether the ordinary detach
# followed. Remove this workflow once the copy has detached and been removed.
#
# Every object is pinned by name and by the UID read on 2026-11-15. The pod is
# deleted once, with a UID precondition, only while its DaemonSet is fully
# available at the pinned generation. The run then waits for a ready
# replacement from the same template on the same node, and for the ordinary
# CSI detach. Nothing here deletes a VolumeAttachment, edits a finalizer,
# restarts other pods or retries.
name: Replace Recovery Volume Holder

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: Type replace-recovery-volume-holder
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  replace:
    name: Replace the recovery volume's holder pod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt dispatch of current main
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_WORKFLOW_REF" != devantler-tech/platform/.github/workflows/replace-recovery-volume-holder.yaml@refs/heads/main || "$GITHUB_ACTOR" != devantler || "$GITHUB_RUN_ATTEMPT" != 1 || "$CONFIRM" != replace-recovery-volume-holder ]]; then
            echo 'RECOVERY_HOLDER_REPLACEMENT=REFUSED stage=dispatch' >&2
            exit 2
          fi
          latest="$(git ls-remote --exit-code https://github.com/devantler-tech/platform.git refs/heads/main)" || { echo 'RECOVERY_HOLDER_REPLACEMENT=REFUSED stage=current-main' >&2; exit 2; }
          [[ "$latest" == "$GITHUB_SHA"$'\trefs/heads/main' ]] || { echo 'RECOVERY_HOLDER_REPLACEMENT=REFUSED stage=current-main' >&2; exit 2; }

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"

      - name: Verify and replace the holder pod
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s' "$KUBE_CONFIG" >"$private_dir/kubeconfig"
          export KUBECONFIG="$private_dir/kubeconfig"
          k() { kubectl --context admin@prod --request-timeout=30s "$@" 2>>"$private_dir/client-errors"; }
          fail() { echo "RECOVERY_HOLDER_REPLACEMENT=REFUSED stage=$1" >&2; exit 2; }
          replacement_timeout=600
          detach_timeout=600

          # Reviewed identities, read on 2026-11-15 after run 43683087211.
          pod="node-agent-tbvw8"
          pod_uid="e8199e91-6ffe-4390-a269-12b7f8e13a20"
          node="prod-worker-1"
          daemon_set_uid="c90590f8-03c0-44d0-a06e-02dcf91439a9"
          generation="40"
          revision="797d57f68c"
          claim_namespace="email-data-recovery-42818236850"
          claim_uid="fa4442ce-698b-46b2-a442-ba3ff2e48065"
          volume="pvc-898b45a4-11cb-4075-9c25-6a3a6bbd9e57"
          volume_uid="01b86e2f-b35b-49bd-bcf9-ddc3c714cfaf"
          attachment="csi-b501cc5616bf0a961429f49e20f13940dc79989d4555eaeb836eef45dab94fa5"
          attachment_uid="c284cfa0-5f90-4130-93dd-f6f8d039e380"
          backend_uid="7fb51fcd-1ae0-49f1-9611-c06088ac506b"

          # Only a successful NotFound read proves absence: kubectl prints
          # nothing for it, and any other failure refuses.
          read_object() {
            local file="$1"
            shift
            k get "$@" --ignore-not-found -o json >"$private_dir/$file" || fail read
          }
          serving() {
            local name data out=""
            for name in private-mail-data email-data-encrypted; do
              data="$(k -n private-mail get pvc "$name" -o json)" || fail serving
              out+="$(jq -er '.metadata.uid as $uid | select(($uid | type == "string" and length > 0) and .status.phase == "Bound" and (.spec.volumeName | startswith("pvc-"))) | "\(.metadata.name)/\(.spec.volumeName)/\($uid) "' <<<"$data")" || fail serving
            done
            printf '%s' "$out"
          }
          attachments() {
            k get volumeattachments -o json >"$private_dir/attachments.json" || fail read
            jq -er --arg volume "$volume" '[.items[] | select(.spec.source.persistentVolumeName == $volume)] | length' "$private_dir/attachments.json" || fail read
          }
          daemon_set_healthy() {
            read_object daemon-set.json daemonset node-agent -n kubescape
            jq -e --arg uid "$daemon_set_uid" --argjson generation "$generation" '
              .metadata.uid == $uid and .metadata.generation == $generation
              and .status.observedGeneration == $generation
              and .status.desiredNumberScheduled > 0
              and .status.currentNumberScheduled == .status.desiredNumberScheduled
              and .status.numberReady == .status.desiredNumberScheduled
              and .status.updatedNumberScheduled == .status.desiredNumberScheduled
              and .status.numberAvailable == .status.desiredNumberScheduled
              and (.status.numberUnavailable // 0) == 0
              and (.status.numberMisscheduled // 0) == 0
              and .spec.updateStrategy.type == "RollingUpdate"' "$private_dir/daemon-set.json" >/dev/null
          }

          serving_before="$(serving)"

          # The affected copy: its claim's namespace is gone, its volume is
          # deleting and still bound to the pinned claim, and it is attached
          # only through the pinned attachment on the holder's node.
          read_object namespace.json namespace "$claim_namespace"
          [[ ! -s "$private_dir/namespace.json" ]] || fail consumer-present
          read_object volume.json pv "$volume"
          jq -e --arg uid "$volume_uid" --arg namespace "$claim_namespace" --arg claim "$claim_uid" '
            .metadata.uid == $uid and .metadata.deletionTimestamp != null
            and .spec.storageClassName == $namespace
            and .spec.claimRef.namespace == $namespace and .spec.claimRef.name == "data" and .spec.claimRef.uid == $claim' "$private_dir/volume.json" >/dev/null || fail volume
          read_object attachment.json volumeattachment "$attachment"
          jq -e --arg uid "$attachment_uid" --arg node "$node" --arg volume "$volume" '
            .metadata.uid == $uid and .spec.nodeName == $node and .spec.attacher == "driver.longhorn.io"
            and .spec.source.persistentVolumeName == $volume and .status.attached == true' "$private_dir/attachment.json" >/dev/null || fail attachment
          attached="$(attachments)"
          (( attached == 1 )) || fail attachment
          read_object backend.json volumes.longhorn.io "$volume" -n longhorn-system
          jq -e --arg uid "$backend_uid" --arg namespace "$claim_namespace" '
            .metadata.uid == $uid and .status.kubernetesStatus.namespace == $namespace
            and .status.kubernetesStatus.pvcName == "data"
            and ((.status.kubernetesStatus.lastPodRefAt // "") | length > 0)
            and ((.status.kubernetesStatus.lastPVCRefAt // "") | length > 0)' "$private_dir/backend.json" >/dev/null || fail backend

          # The holder: the pinned pod of the pinned DaemonSet on that node, at
          # the DaemonSet's current template, which is fully available.
          read_object pod.json pod "$pod" -n kubescape
          jq -e --arg uid "$pod_uid" --arg node "$node" --arg owner "$daemon_set_uid" --arg generation "$generation" --arg revision "$revision" '
            .metadata.uid == $uid and .metadata.deletionTimestamp == null and .spec.nodeName == $node
            and ([.metadata.ownerReferences[]? | select(.controller == true)] | length == 1 and .[0].kind == "DaemonSet" and .[0].name == "node-agent" and .[0].uid == $owner)
            and .metadata.labels["pod-template-generation"] == $generation
            and .metadata.labels["controller-revision-hash"] == $revision' "$private_dir/pod.json" >/dev/null || fail holder
          daemon_set_healthy || fail daemon-set

          # Still current main immediately before the only mutation.
          latest="$(git ls-remote --exit-code https://github.com/devantler-tech/platform.git refs/heads/main)" || fail current-main
          [[ "$latest" == "$GITHUB_SHA"$'\trefs/heads/main' ]] || fail current-main

          jq -n --arg uid "$pod_uid" '{apiVersion:"v1",kind:"DeleteOptions",preconditions:{uid:$uid}}' >"$private_dir/delete-options.json"
          k delete --raw="/api/v1/namespaces/kubescape/pods/$pod" -f "$private_dir/delete-options.json" >"$private_dir/delete-result" || fail delete
          echo "RECOVERY_HOLDER_REPLACEMENT=DELETED pod=$pod uid=$pod_uid"

          # The DaemonSet replaces it on the same node from the same template.
          replacement=""
          deadline=$((SECONDS + replacement_timeout))
          while (( SECONDS < deadline )); do
            k -n kubescape get pods -o json >"$private_dir/pods.json" || fail replacement-read
            replacement="$(jq -r --arg old "$pod_uid" --arg node "$node" --arg owner "$daemon_set_uid" --arg generation "$generation" --arg revision "$revision" '
              [.items[] | select(.spec.nodeName == $node and any(.metadata.ownerReferences[]?; .controller == true and .uid == $owner))] as $on_node
              | if ($on_node | map(select(.metadata.uid == $old)) | length) > 0 then ""
                else [$on_node[] | select(.metadata.deletionTimestamp == null
                    and .metadata.labels["pod-template-generation"] == $generation
                    and .metadata.labels["controller-revision-hash"] == $revision
                    and any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                  | "\(.metadata.name)/\(.metadata.uid)"] | if length == 1 then .[0] else "" end
                end' "$private_dir/pods.json")" || fail replacement-read
            if [[ -n "$replacement" ]] && daemon_set_healthy; then break; fi
            replacement=""
            sleep 5
          done
          [[ -n "$replacement" ]] || fail replacement-timeout
          echo "RECOVERY_HOLDER_REPLACEMENT=REPLACED replacement=$replacement"

          # The ordinary CSI detach: the attachment and the deleting volume go
          # on their own. Not following is a finding, not something to retry.
          deadline=$((SECONDS + detach_timeout))
          detached=0
          while (( SECONDS < deadline )); do
            attached="$(attachments)"
            read_object volume-after.json pv "$volume"
            if (( attached == 0 )) && [[ ! -s "$private_dir/volume-after.json" ]]; then detached=1; break; fi
            sleep 10
          done
          [[ "$(serving)" == "$serving_before" ]] || fail serving-changed
          if (( ! detached )); then
            echo "RECOVERY_HOLDER_REPLACEMENT=DETACH_NOT_OBSERVED volume=$volume attachments=$attached" >&2
            exit 3
          fi
          echo "RECOVERY_HOLDER_REPLACEMENT=COMPLETE volume=$volume detached=ORDINARY serving=UNCHANGED"
