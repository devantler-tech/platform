---
name: Observe Longhorn Migration Headroom

# Reads provider and Kubernetes migration capacity. Each operation reads the
# Hetzner account, so they keep HCLOUD_TOKEN. Guards, credential handling and
# cleanup live in prod-operation.yaml.
"on":
  # checkov:skip=CKV_GHA_7:Not a build. The typed confirmation is the interlock
  # prod-operation.yaml checks; it selects nothing but the fixed operation.
  workflow_dispatch:
    inputs:
      operation:
        description: Which read to run
        required: true
        type: choice
        options:
          - observe-longhorn-migration-headroom
          - observe-longhorn-provider-account
          - observe-longhorn-provider-ownership
      confirm:
        description: Type the selected operation name exactly
        required: true
        type: string

permissions: {}

jobs:
  observe:
    permissions:
      contents: read
    # The self-repository form ($/) fails the pinned actionlint 1.7.12.
    uses: ./.github/workflows/prod-operation.yaml # zizmor: ignore[self-repository]
    # The prod environment secrets reach the called job only when named here.
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    with:
      operation: ${{ inputs.operation }}
      confirm: ${{ inputs.confirm }}
      program: scripts/verify-longhorn-migration-headroom
      args: ${{ inputs.operation == 'observe-longhorn-provider-ownership' && 'account-ownership' || inputs.operation == 'observe-longhorn-provider-account' && 'account-census' || 'before-publish' }}
      hcloud-token: true
      timeout-minutes: 10
