---
name: Observe Longhorn Migration Headroom

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: observe-longhorn-migration-headroom"
        required: true
        type: string

permissions: {}

jobs:
  observe:
    name: Read provider and Kubernetes migration capacity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      LONGHORN_HEADROOM_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require confirmed first attempt on main
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          [[ "${LONGHORN_HEADROOM_CONFIRM}" == observe-longhorn-migration-headroom ]]
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test complete inventories and unsafe roster refusals
        run: go test -race -count=1 -timeout=3m ./scripts/verify-longhorn-migration-headroom
      - name: Install verified Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/longhorn-headroom-kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          sudo install "${kubectl_path}" /usr/local/bin/kubectl
      - name: Restore production kubeconfig in memory
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          credential_dir=$(mktemp -d /dev/shm/longhorn-headroom.XXXXXX)
          printf '%s' "${KUBE_CONFIG}" >"${credential_dir}/kubeconfig"
          printf 'KUBECONFIG=%s/kubeconfig\nLONGHORN_HEADROOM_CREDENTIAL_DIR=%s\n' "${credential_dir}" "${credential_dir}" >>"${GITHUB_ENV}"
      - name: Select stable production API endpoint
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh
      - name: Read migration headroom
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/verify-longhorn-migration-headroom before-publish
      - name: Require unchanged current main after observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
      - name: Remove runner credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LONGHORN_HEADROOM_CREDENTIAL_DIR:-}" =~ ^/dev/shm/longhorn-headroom\.[A-Za-z0-9]+$ ]]; then
            rm -rf -- "${LONGHORN_HEADROOM_CREDENTIAL_DIR}"
          fi
