name: Prepare Longhorn V2 Migration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prepare-longhorn-v2-node.yaml
      - scripts/migrate-longhorn-v2/**
      - internal/longhornmigration/**
  merge_group:
  workflow_dispatch:
    inputs:
      operation:
        description: The guarded migration step to run
        required: true
        type: choice
        options: [refresh-clients, benchmark-v1, benchmark-v2]
      confirm:
        description: "Type the exact confirmation documented for the selected operation"
        required: true
        type: string

permissions: {}

jobs:
  tests:
    name: Validate migration tool boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test complete observations and interrupted recovery
        run: go test -race -count=1 -timeout=5m ./scripts/migrate-longhorn-v2 ./internal/longhornmigration

  prepare:
    name: Run the selected guarded migration step
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prod
    permissions:
      contents: read
      actions: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      LONGHORN_V2_OPERATION: ${{ inputs.operation }}
      LONGHORN_V2_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require confirmed first attempt on main
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          case "${LONGHORN_V2_OPERATION}" in
            refresh-clients)
              [[ "${LONGHORN_V2_CONFIRM}" == refresh-longhorn-v2-clients ]]
              ;;
            benchmark-v1|benchmark-v2)
              [[ "${LONGHORN_V2_CONFIRM}" == benchmark-longhorn-storage ]]
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verified Talos client
        run: .github/scripts/setup-talosctl.sh
      - name: Install verified Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/longhorn-v2-kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          sudo install "${kubectl_path}" /usr/local/bin/kubectl
      - name: Restore production credentials in memory
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          TALOS_CONFIG: ${{ secrets.TALOS_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}" && test -n "${TALOS_CONFIG}"
          umask 077
          credential_dir=$(mktemp -d /dev/shm/longhorn-v2.XXXXXX)
          printf '%s' "${KUBE_CONFIG}" >"${credential_dir}/kubeconfig"
          printf '%s' "${TALOS_CONFIG}" >"${credential_dir}/talosconfig"
          printf 'KUBECONFIG=%s/kubeconfig\nTALOSCONFIG=%s/talosconfig\nLONGHORN_V2_CREDENTIAL_DIR=%s\n' "${credential_dir}" "${credential_dir}" "${credential_dir}" >>"${GITHUB_ENV}"
      - name: Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh
      - name: Run the confirmed migration preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Remove runner credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${LONGHORN_V2_CREDENTIAL_DIR:-}" && "${LONGHORN_V2_CREDENTIAL_DIR}" == /dev/shm/longhorn-v2.* ]]; then
            rm -rf -- "${LONGHORN_V2_CREDENTIAL_DIR}"
          fi
