---
name: Prepare Longhorn V2 Migration

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prepare-longhorn-v2-node.yaml
      - .github/scripts/select-longhorn-runtime-inventory-source.sh
      - scripts/tests/test-longhorn-runtime-inventory-source.sh
      - scripts/migrate-longhorn-v2/**
      - internal/longhornmigration/**
      - internal/longhorninventory/**
      - internal/namespaceinventory/**
      - go.mod
      - go.sum
  merge_group:
  workflow_dispatch:
    inputs:
      operation:
        description: The guarded migration step to run
        required: true
        type: choice
        options:
          [
            prepare-worker,
            prepare-unused-temporary-worker,
            prepare-retained-temporary-worker,
            refresh-clients,
            benchmark-v1,
            benchmark-v2,
            recover-unstarted-v1-benchmark,
            recover-bound-v1-benchmark,
            prepare-native-v1-seed,
            restore-native-v2-seed,
            resume-native-v2-seed-restore,
            resume-native-v2-reattach,
            reclaim-native-v2-seed,
            resume-native-v2-reclaim,
            inventory-replicas,
            inventory-storage-root,
            inventory-storage-layout,
            inventory-provider-volume-footprint,
            inventory-v1-runtime,
            inspect-host-memory,
            reboot-host-for-hugepages,
            observe-database,
            observe-v2-database-stream,
            observe-coroot-v2-keeper,
            observe-coroot-v2-clickhouse,
            migrate-coroot-keeper-v2,
            transfer-coroot-keeper-leadership-to-v2,
            migrate-openbao-v2-pair,
            resume-openbao-v2-pair,
            prove-database-v2-archive,
            resume-umami-archive-isolation,
            resume-umami-archive-data,
            observe-umami-v2-standby,
            observe-provider-cnpg-v2-standby,
            replace-umami-v2-standby,
            resume-retained-umami-v2-standby,
            switch-umami-primary-to-v2,
            recover-umami-standby-name,
            replace-wedding-v2-standby,
            resume-retained-wedding-v2-standby,
            recover-wedding-standby-name,
            switch-wedding-primary-to-v2,
            register-temporary-v2-storage,
            observe-retained-v2-capacity,
            repair-v1-reservation,
            reserve-v1-scratch,
            reserve-v1-backup-scratch,
            prepare-actual-budget-backup-scratch,
            retire-actual-budget-backup-scratch,
            backup-actual-budget-v1,
            restore-actual-budget-v2,
            resume-unstarted-actual-budget-v2,
            retry-rejected-actual-budget-v2,
            observe-detached-v1-source,
            retain-v1-source,
            retain-provider-source,
          ]
      node:
        description: Permanent worker or fixed temporary-worker selection for the chosen operation
        required: false
        type: choice
        default: no-target
        options:
          [
            no-target,
            prod-worker-1,
            prod-worker-2,
            prod-worker-3,
            temporary-v1-1,
            temporary-v1-2,
            temporary-v2-1,
          ]
      database:
        description: Fixed database for an archive recovery or migration observation; leave node unselected
        required: false
        type: choice
        default: no-target
        options:
          [
            no-target,
            coroot-db,
            umami-db,
            wedding-db,
            substrate-db,
            kagent-db,
            customer-identity-db,
            business-site-portal-db,
            portal-preview-db,
          ]
      confirm:
        description: "Type the exact confirmation documented for the selected operation"
        required: true
        type: string
      legacy_preparation_receipts:
        description: Optional SHA-256 proof of already prepared temporary V1 hosts for registration
        type: string

permissions: {}

# A first main-only manual run joins the ordinary production queue before its tests so a
# later deployment cannot overtake validation. PR and merge-group tests use
# independent groups. Current-main checks still reject an aged dispatch.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && 'prod-deploy' || format('longhorn-v2-validation-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
  queue: max

jobs:
  tests:
    name: Validate migration tool boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test queued read-only source selection
        run: bash scripts/tests/test-longhorn-runtime-inventory-source.sh
      - name: Test complete observations and interrupted recovery
        # The native admission and database restore fixtures share this bounded test job.
        run: go test -race -count=1 -timeout=7m ./scripts/migrate-longhorn-v2 ./internal/longhornmigration ./internal/longhorninventory ./internal/namespaceinventory

  prepare:
    name: Run the selected guarded migration step
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prod
    permissions:
      contents: read
      actions: read
    env:
      LONGHORN_V2_NODE: ${{ fromJSON(inputs.node == 'no-target' && '""' || toJSON(inputs.node || '')) }}
      LONGHORN_V2_DATABASE: ${{ fromJSON(inputs.database == 'no-target' && '""' || toJSON(inputs.database || '')) }}
      LONGHORN_V2_OPERATION: ${{ inputs.operation }}
      LONGHORN_V2_CONFIRM: ${{ inputs.confirm }}
      LONGHORN_V2_LEGACY_PREPARATION_RECEIPTS: ${{ inputs.legacy_preparation_receipts }}
    steps:
      - name: Require confirmed first attempt on main
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]] || exit 1
          case "${LONGHORN_V2_OPERATION}" in
            prepare-native-v1-seed)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" == prepare-longhorn-native-v1-seed ]]
              ;;
            restore-native-v2-seed)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" == restore-longhorn-native-v2-seed ]]
              ;;
            resume-native-v2-seed-restore)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-longhorn-native-v2-seed:[1-9][0-9]{0,18}$ ]]
              ;;
            resume-native-v2-reattach)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-longhorn-native-v2-reattach:[1-9][0-9]{0,18}:[1-9][0-9]{0,18}$ ]]
              ;;
            reclaim-native-v2-seed)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" =~ ^reclaim-longhorn-native-v2-seed:[1-9][0-9]{0,18}$ ]]
              ;;
            resume-native-v2-reclaim)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" =~ ^resume-longhorn-native-v2-reclaim:[1-9][0-9]{0,18}:[1-9][0-9]{0,18}$ ]]
              ;;
            inventory-v1-runtime)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" == inventory-v1-runtime ]]
              ;;
            observe-database)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" =~ ^(coroot-db|umami-db|wedding-db|substrate-db|kagent-db|customer-identity-db|business-site-portal-db|portal-preview-db)$ && "${LONGHORN_V2_CONFIRM}" == "observe-longhorn-v2-database-${LONGHORN_V2_DATABASE}" ]]
              ;;
            observe-v2-database-stream)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" =~ ^(substrate-db|kagent-db|portal-preview-db)$ &&
                 "${LONGHORN_V2_CONFIRM}" == "observe-v2-database-stream:${LONGHORN_V2_DATABASE}" ]]
              ;;
            observe-coroot-v2-keeper|observe-coroot-v2-clickhouse)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" == "${LONGHORN_V2_OPERATION}" ]]
              ;;
            migrate-coroot-keeper-v2)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^migrate-coroot-keeper-v2:[0-2]:[a-f0-9]{64}$ ]]
              ;;
            transfer-coroot-keeper-leadership-to-v2)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^transfer-coroot-keeper-leadership-to-v2:[0-2]:[a-f0-9]{64}$ ]]
              ;;
            migrate-openbao-v2-pair)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^migrate-openbao-v2-pair:openbao-[0-2]:[a-f0-9]{64}(:[1-9][0-9]{0,18})?$ ]]
              ;;
            resume-openbao-v2-pair)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-openbao-v2-pair:openbao-[0-2]:[a-f0-9]{64}:[1-9][0-9]{0,18}$ ]]
              ;;
            prove-database-v2-archive)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" =~ ^(coroot-db|umami-db|wedding-db|customer-identity-db|business-site-portal-db)$ &&
                 "${LONGHORN_V2_CONFIRM}" == "prove-longhorn-v2-database-archive-${LONGHORN_V2_DATABASE}" ]]
              ;;
            resume-umami-archive-isolation)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-umami-archive-isolation:[1-9][0-9]{0,18}$ ]]
              ;;
            resume-umami-archive-data)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-umami-archive-data:[1-9][0-9]{0,18}:[0-9a-f]{64}$ ]]
              ;;
            observe-umami-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^observe-umami-v2-standby:umami-db-[1-9][0-9]*:umami-db-[1-9][0-9]*$ ]]
              ;;
            observe-provider-cnpg-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" =~ ^(customer-identity-db|business-site-portal-db)$ &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^observe-provider-cnpg-v2-standby:${LONGHORN_V2_DATABASE}-[1-9][0-9]*$ ]]
              ;;
            replace-umami-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^replace-umami-v2-standby:umami-db-[1-9][0-9]*:umami-db-[1-9][0-9]*$ ]]
              ;;
            resume-retained-umami-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-retained-umami-v2-standby:umami-db-[1-9][0-9]*:[1-9][0-9]{0,18}:[0-9a-f]{40}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              ;;
            switch-umami-primary-to-v2)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^switch-umami-primary-to-v2:umami-db-[1-9][0-9]*:umami-db-[1-9][0-9]*$ ]]
              ;;
            switch-wedding-primary-to-v2)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == wedding-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^switch-wedding-primary-to-v2:wedding-db-[1-9][0-9]*:wedding-db-[1-9][0-9]*$ ]]
              ;;
            recover-umami-standby-name)
              run_re='[1-9][0-9]{0,18}'
              uid_re='[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == umami-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^recover-umami-standby-name:umami-db-[1-9][0-9]*:${run_re}:[0-9a-f]{40}:${uid_re}:${run_re}:[0-9a-f]{40}:${uid_re}(:${run_re})?$ ]]
              ;;
            replace-wedding-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == wedding-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^replace-wedding-v2-standby:wedding-db-[1-9][0-9]*:wedding-db-[1-9][0-9]*$ ]]
              ;;
            resume-retained-wedding-v2-standby)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == wedding-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-retained-wedding-v2-standby:wedding-db-[1-9][0-9]*:[1-9][0-9]{0,18}:[0-9a-f]{40}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              ;;
            recover-wedding-standby-name)
              run_re='[1-9][0-9]{0,18}'
              uid_re='[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_DATABASE}" == wedding-db &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^recover-wedding-standby-name:wedding-db-[1-9][0-9]*:${run_re}:[0-9a-f]{40}:${uid_re}:${run_re}:[0-9a-f]{40}:${uid_re}(:${run_re})?$ ]]
              ;;
            prepare-worker)
              [[ "${LONGHORN_V2_NODE}" =~ ^prod-worker-[123]$ && "${LONGHORN_V2_CONFIRM}" == "prepare-longhorn-v2-${LONGHORN_V2_NODE}" ]]
              ;;
            prepare-unused-temporary-worker)
              [[ "${LONGHORN_V2_NODE}" =~ ^temporary-v1-[12]$ && "${LONGHORN_V2_CONFIRM}" == "prepare-unused-longhorn-v2-${LONGHORN_V2_NODE}" ]]
              ;;
            prepare-retained-temporary-worker)
              [[ "${LONGHORN_V2_NODE}" == temporary-v2-1 && "${LONGHORN_V2_CONFIRM}" == prepare-retained-longhorn-v2-temporary-v2-1 ]]
              ;;
            inventory-replicas)
              [[ "${LONGHORN_V2_NODE}" =~ ^(prod-worker-[123]|temporary-v1-[12]|temporary-v2-1)$ && "${LONGHORN_V2_CONFIRM}" == "inventory-longhorn-replicas-${LONGHORN_V2_NODE}" ]]
              ;;
            inspect-host-memory)
              [[ "${LONGHORN_V2_NODE}" =~ ^prod-worker-[123]$ && "${LONGHORN_V2_CONFIRM}" == "inspect-longhorn-v2-host-memory-${LONGHORN_V2_NODE}" ]]
              ;;
            reboot-host-for-hugepages)
              [[ "${LONGHORN_V2_NODE}" =~ ^prod-worker-[123]$ && "${LONGHORN_V2_CONFIRM}" == "reboot-longhorn-v2-host-${LONGHORN_V2_NODE}" ]]
              ;;
            repair-v1-reservation)
              [[ "${LONGHORN_V2_NODE}" == prod-worker-1 && "${LONGHORN_V2_CONFIRM}" == repair-longhorn-v1-reservation ]]
              ;;
            reserve-v1-scratch)
              [[ "${LONGHORN_V2_NODE}" == prod-worker-1 && "${LONGHORN_V2_CONFIRM}" == reserve-longhorn-v1-scratch ]]
              ;;
            reserve-v1-backup-scratch)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" && "${LONGHORN_V2_CONFIRM}" == reserve-longhorn-v1-backup-scratch ]]
              ;;
            prepare-actual-budget-backup-scratch)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^prepare-actual-budget-backup-scratch:[0-9a-f]{64}$ ]]
              ;;
            retire-actual-budget-backup-scratch)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^retire-actual-budget-backup-scratch:[1-9][0-9]{0,18}$ ]]
              ;;
            backup-actual-budget-v1)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^backup-actual-budget-v1:[0-9a-f]{64}$ ]]
              ;;
            restore-actual-budget-v2)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^restore-actual-budget-v2:[1-9][0-9]{0,18}:[0-9a-f]{40}:[0-9a-f]{64}$ ]]
              ;;
            resume-unstarted-actual-budget-v2)
              run_re='[1-9][0-9]{0,18}'
              sha_re='[0-9a-f]{40}'
              uid_re='[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^resume-unstarted-actual-budget-v2:${run_re}:${sha_re}:[0-9a-f]{64}:${run_re}:${sha_re}:${uid_re}(:${run_re}:${sha_re}:${uid_re}:${uid_re})?$ ]]
              ;;
            retry-rejected-actual-budget-v2)
              run_re='[1-9][0-9]{0,18}'
              uid_re='[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^retry-rejected-actual-budget-v2:${run_re}:[0-9a-f]{40}:[0-9a-f]{64}:${run_re}:[0-9a-f]{40}:${uid_re}:${uid_re}$ ]]
              ;;
            observe-detached-v1-source)
              uid_re='[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^observe-detached-v1-source:pvc-${uid_re}$ ]]
              ;;
            retain-v1-source)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_CONFIRM}" =~ ^retain-longhorn-v1-source:[a-z0-9][-a-z0-9]*/[a-z0-9][-a-z0-9.]*:[0-9a-f]{64}$ ]]
              ;;
            retain-provider-source)
              [[ -z "${LONGHORN_V2_NODE}" && "${LONGHORN_V2_CONFIRM}" =~ ^retain-hetzner-source:(observability|openbao|kube-system|customer-identity|business-site)/[a-z0-9][-a-z0-9.]*:[0-9a-f]{64}$ ]]
              ;;
            inventory-storage-root)
              [[ "${LONGHORN_V2_NODE}" =~ ^(prod-worker-[123]|temporary-v1-[12]|temporary-v2-1)$ && "${LONGHORN_V2_CONFIRM}" == "inventory-longhorn-storage-root-${LONGHORN_V2_NODE}" ]]
              ;;
            inventory-storage-layout)
              [[ "${LONGHORN_V2_NODE}" =~ ^temporary-(v1-[12]|v2-1)$ && "${LONGHORN_V2_CONFIRM}" == "inventory-longhorn-storage-layout-${LONGHORN_V2_NODE}" ]]
              ;;
            inventory-provider-volume-footprint)
              [[ "${LONGHORN_V2_CONFIRM}" == inventory-provider-volume-footprint ]]
              ;;
            refresh-clients)
              [[ "${LONGHORN_V2_CONFIRM}" == refresh-longhorn-v2-clients ]]
              ;;
            benchmark-v1|benchmark-v2)
              [[ "${LONGHORN_V2_CONFIRM}" == benchmark-longhorn-storage ]]
              ;;
            recover-unstarted-v1-benchmark)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" == recover-unstarted-longhorn-v1-benchmark ]]
              ;;
            recover-bound-v1-benchmark)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" =~ ^recover-bound-longhorn-v1-benchmark:[1-9][0-9]{0,18}$ ]]
              ;;
            register-temporary-v2-storage)
              [[ -z "${LONGHORN_V2_NODE}" && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" == register-longhorn-v2-temporary-storage ]]
              ;;
            observe-retained-v2-capacity)
              [[ "${LONGHORN_V2_NODE}" == temporary-v2-1 && -z "${LONGHORN_V2_DATABASE}" &&
                 "${LONGHORN_V2_CONFIRM}" == observe-retained-v2-capacity:temporary-v2-1 ]]
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current main
        id: recovery-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${LONGHORN_V2_OPERATION}" == inventory-v1-runtime ]]; then
            source_sha="$(bash .github/scripts/select-longhorn-runtime-inventory-source.sh)"
            ./scripts/verify-prod-recovery-source.sh "${source_sha}"
            printf 'sha=%s\n' "${source_sha}" >>"${GITHUB_OUTPUT}"
            printf 'LONGHORN_RUNTIME_INVENTORY_SOURCE=BOUND sha=%s\n' "${source_sha}"
          else
            ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
          fi
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verified Talos client
        run: .github/scripts/setup-talosctl.sh
      - name: Install verified Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/longhorn-v2-kubectl"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          sudo install "${kubectl_path}" /usr/local/bin/kubectl
      - name: Restore production credentials in memory
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          TALOS_CONFIG: ${{ secrets.TALOS_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}" && test -n "${TALOS_CONFIG}"
          umask 077
          credential_dir=$(mktemp -d /dev/shm/longhorn-v2.XXXXXX)
          printf '%s' "${KUBE_CONFIG}" >"${credential_dir}/kubeconfig"
          printf '%s' "${TALOS_CONFIG}" >"${credential_dir}/talosconfig"
          printf 'KUBECONFIG=%s/kubeconfig\nTALOSCONFIG=%s/talosconfig\nLONGHORN_V2_CREDENTIAL_DIR=%s\n' "${credential_dir}" "${credential_dir}" "${credential_dir}" >>"${GITHUB_ENV}"
      - name: Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh
      - name: Run the confirmed migration preparation
        if: >-
          ${{ inputs.operation != 'benchmark-v1' && inputs.operation != 'recover-bound-v1-benchmark' &&
              inputs.operation != 'prepare-native-v1-seed' && inputs.operation != 'reclaim-native-v2-seed' &&
              inputs.operation != 'resume-native-v2-reclaim' && inputs.operation != 'recover-umami-standby-name' &&
              inputs.operation != 'recover-wedding-standby-name' && inputs.operation != 'migrate-coroot-keeper-v2' &&
              inputs.operation != 'migrate-openbao-v2-pair' && inputs.operation != 'resume-openbao-v2-pair' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LONGHORN_RUNTIME_INVENTORY_SOURCE: ${{ steps.recovery-source.outputs.sha }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Migrate the confirmed Coroot Keeper follower
        if: ${{ inputs.operation == 'migrate-coroot-keeper-v2' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Build the OpenBao quorum and delivery checks
        if: ${{ inputs.operation == 'migrate-openbao-v2-pair' || inputs.operation == 'resume-openbao-v2-pair' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          for tool in capture-openbao-replacement judge-openbao-health judge-openbao-quorum replace-openbao-pod; do
            go build -o "${RUNNER_TEMP}/bin/$tool" "./scripts/$tool"
          done
          image=$(kubectl --context=admin@prod --request-timeout=20s -n openbao get statefulset openbao -o json |
            jq -er '[.spec.template.spec.containers[]|select(.name=="openbao")|.image]|select(length==1)|.[0]')
          [[ "$image" =~ ^quay\.io/openbao/openbao:([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          printf 'OPENBAO_VERSION=%s\nOPENBAO_BIN=%s/bin\n' "${BASH_REMATCH[1]}" "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Migrate the confirmed OpenBao follower storage pair
        if: ${{ inputs.operation == 'migrate-openbao-v2-pair' || inputs.operation == 'resume-openbao-v2-pair' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Run the confirmed V1 scratch operation
        if: ${{ inputs.operation == 'benchmark-v1' || inputs.operation == 'prepare-native-v1-seed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Recover the confirmed bound V1 benchmark scratch
        if: ${{ inputs.operation == 'recover-bound-v1-benchmark' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Reclaim the verified disposable V2 restoration
        if: ${{ inputs.operation == 'reclaim-native-v2-seed' || inputs.operation == 'resume-native-v2-reclaim' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Recover the confirmed database standby claim name
        if: ${{ inputs.operation == 'recover-umami-standby-name' || inputs.operation == 'recover-wedding-standby-name' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./scripts/migrate-longhorn-v2
      - name: Remove runner credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${LONGHORN_V2_CREDENTIAL_DIR:-}" && "${LONGHORN_V2_CREDENTIAL_DIR}" == /dev/shm/longhorn-v2.* ]]; then
            rm -rf -- "${LONGHORN_V2_CREDENTIAL_DIR}"
          fi
