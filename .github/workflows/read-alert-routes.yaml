---
name: Read Alert Route Configuration

# Reads cluster configuration and both loaded Alertmanager configurations
# without exposing values. Guards, credential handling and cleanup live in
# prod-operation.yaml.
"on":
  # checkov:skip=CKV_GHA_7:Not a build. The typed confirmation is the interlock
  # prod-operation.yaml checks; it selects nothing but the fixed operation.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: read-alert-routes"
        required: true
        type: string

permissions: {}

jobs:
  observe:
    permissions:
      contents: read
    # The self-repository form ($/) fails the pinned actionlint 1.7.12.
    uses: ./.github/workflows/prod-operation.yaml # zizmor: ignore[self-repository]
    with:
      operation: read-alert-routes
      confirm: ${{ inputs.confirm }}
      program: scripts/read-alert-routes
      timeout-minutes: 15
