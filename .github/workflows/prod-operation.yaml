---
name: Production Operation

# The one entry point a dispatched production operation uses to reach the
# production credential (platform#6268). A caller is a thin workflow_dispatch
# wrapper that names its operation and a reviewed Go program under scripts/;
# this workflow owns every guard, the environment binding, the credential
# restore and the cleanup, so they are written and tested once.
#
# Guards, all before checkout:
# - dispatched on devantler-tech/platform, from refs/heads/main, first attempt
#   only (a re-run never reuses an earlier approval);
# - triggered by devantler;
# - on a GitHub-hosted runner;
# - the typed confirmation equals the operation name.
# The prod environment additionally admits only protected branches, and the
# reviewed revision must still be the tip of main before the credential is
# restored.
"on":
  workflow_call:
    inputs:
      operation:
        description: Operation name; the dispatcher must type it as confirmation.
        required: true
        type: string
      confirm:
        description: The dispatcher's typed confirmation.
        required: true
        type: string
      program:
        description: Reviewed Go program directory, for example scripts/read-alert-routes.
        required: true
        type: string
      args:
        description: Space-separated fixed arguments for the program (no shell evaluation).
        required: false
        type: string
        default: ""
      hcloud-token:
        description: Keep HCLOUD_TOKEN in the program's environment (provider reads).
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 15

permissions: {}

jobs:
  operate:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: prod
    permissions:
      contents: read
    # Shared with every deploy so an operation never runs during one.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      PROD_OPERATION: ${{ inputs.operation }}
      PROD_OPERATION_CONFIRM: ${{ inputs.confirm }}
      PROD_OPERATION_PROGRAM: ${{ inputs.program }}
      PROD_OPERATION_ARGS: ${{ inputs.args }}
    steps:
      - name: Require the confirmed first-attempt main dispatch by devantler
        shell: bash
        run: |
          set -euo pipefail
          name_pattern='^[a-z0-9]+(-[a-z0-9]+)*$'
          program_pattern='^scripts/[a-z0-9]+(-[a-z0-9]+)*$'
          args_pattern='^[a-z0-9 -]*$'
          [[ "${GITHUB_REPOSITORY}" == devantler-tech/platform &&
             "${GITHUB_EVENT_NAME}" == workflow_dispatch &&
             "${GITHUB_REF}" == refs/heads/main &&
             "${GITHUB_RUN_ATTEMPT}" == 1 &&
             "${GITHUB_ACTOR}" == devantler &&
             "${GITHUB_TRIGGERING_ACTOR}" == devantler &&
             "${RUNNER_ENVIRONMENT}" == github-hosted &&
             "${PROD_OPERATION}" =~ ${name_pattern} &&
             "${PROD_OPERATION_CONFIRM}" == "${PROD_OPERATION}" &&
             "${PROD_OPERATION_PROGRAM}" =~ ${program_pattern} &&
             "${PROD_OPERATION_ARGS}" =~ ${args_pattern} ]]

      - name: Checkout the reviewed dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"

      - name: Set up the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the reviewed program before restoring credentials
        shell: bash
        run: timeout 180s go build -mod=readonly -trimpath -o "${RUNNER_TEMP}/prod-operation" "./${PROD_OPERATION_PROGRAM}"

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/prod-operation-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/prod-operation-tools"
          install -m 0755 "${kubectl_path}" "${RUNNER_TEMP}/prod-operation-tools/kubectl"
          printf '%s\n' "${RUNNER_TEMP}/prod-operation-tools" >> "${GITHUB_PATH}"

      # The only step that sees a credential. The kubeconfig lives in memory and
      # is removed on exit; HCLOUD_TOKEN is dropped before the program runs
      # unless the caller declared a provider read.
      - name: Run the operation with the production credential
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          KEEP_HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          if [[ -z "${KUBE_CONFIG}" || ${#KUBE_CONFIG} -gt 1048576 ]]; then
            printf '%s\n' 'PROD_OPERATION=UNVERIFIED'
            exit 2
          fi
          credential_dir="$(mktemp -d /dev/shm/prod-operation.XXXXXX)"
          trap 'rm -rf "${credential_dir}"' EXIT
          export KUBECONFIG="${credential_dir}/kubeconfig"
          printf '%s' "${KUBE_CONFIG}" > "${KUBECONFIG}"
          unset KUBE_CONFIG
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            printf '%s\n' 'PROD_OPERATION=UNVERIFIED'
            exit 2
          fi
          if [[ "${KEEP_HCLOUD_TOKEN}" != true ]]; then
            unset HCLOUD_TOKEN
          fi
          unset KEEP_HCLOUD_TOKEN
          read -r -a operation_args <<<"${PROD_OPERATION_ARGS}"
          "${RUNNER_TEMP}/prod-operation" ${operation_args[@]+"${operation_args[@]}"}
