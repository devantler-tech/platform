---
name: Production Operation

# The one entry point a dispatched production operation uses to reach the
# production credential (platform#6268). A caller is a thin workflow_dispatch
# wrapper that names its operation and a reviewed Go program under scripts/;
# this workflow owns every guard, the environment binding, the credential
# restore and the cleanup, so they are written and tested once.
#
# Guards, all before checkout:
# - dispatched on devantler-tech/platform, from refs/heads/main, first attempt
#   only (a re-run never reuses an earlier approval);
# - triggered by devantler;
# - on a GitHub-hosted runner;
# - the typed confirmation equals the operation name.
# The prod environment additionally admits only protected branches, and the
# reviewed revision must still be the tip of main before the credential is
# restored. An operation queued behind a deploy of a newer main therefore
# stops STALE without touching production: dispatch it again.
"on":
  workflow_call:
    inputs:
      operation:
        description: Operation name; the dispatcher must type it as confirmation.
        required: true
        type: string
      confirm:
        description: The dispatcher's typed confirmation.
        required: true
        type: string
      program:
        description: Reviewed Go program directory, for example scripts/read-alert-routes.
        required: true
        type: string
      args:
        description: Space-separated fixed arguments for the program (no shell evaluation).
        required: false
        type: string
        default: ""
      hcloud-token:
        description: Keep HCLOUD_TOKEN in the program's environment (provider reads).
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 15
    # Held by the prod environment; each caller passes them on by name.
    secrets:
      KUBE_CONFIG:
        required: false
      HCLOUD_TOKEN:
        required: false

permissions: {}

jobs:
  operate:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: prod
    permissions:
      contents: read
    # Shared with every deploy so an operation never runs during one.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      PROD_OPERATION: ${{ inputs.operation }}
      PROD_OPERATION_CONFIRM: ${{ inputs.confirm }}
      PROD_OPERATION_PROGRAM: ${{ inputs.program }}
      PROD_OPERATION_ARGS: ${{ inputs.args }}
      # The operation's output is published only encrypted to this age key, because
      # this repository's Actions logs are public. It is the maintainer-held SOPS
      # recipient (.sops.yaml); read a run with
      # `go run ./scripts/read-prod-operation-output <run-id>`.
      PROD_OPERATION_RECIPIENT: age1rk6fs67kly3h4zux5za429z3grjtvs8vcunav4sa28pxk738najsk8wgs6
    steps:
      - name: Require the confirmed first-attempt main dispatch by devantler
        shell: bash
        run: |
          set -euo pipefail
          name_pattern='^[a-z0-9]+(-[a-z0-9]+)*$'
          program_pattern='^scripts/[a-z0-9]+(-[a-z0-9]+)*$'
          args_pattern='^[a-z0-9 -]*$'
          caller_pattern='^devantler-tech/platform/\.github/workflows/[a-z0-9]+(-[a-z0-9]+)*\.ya?ml@refs/heads/main$'
          refused=0
          # Every condition is checked and named, so a refusal says why.
          refuse() {
            printf '::error::refused: %s\n' "$1"
            refused=1
          }
          [[ "${GITHUB_REPOSITORY}" == devantler-tech/platform ]] || refuse 'not this repository'
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]] || refuse 'not a workflow_dispatch'
          [[ "${GITHUB_REF}" == refs/heads/main ]] || refuse 'not dispatched from main'
          [[ "${GITHUB_WORKFLOW_REF:-}" =~ ${caller_pattern} ]] || refuse 'caller is not a workflow on main in this repository'
          [[ "${GITHUB_RUN_ATTEMPT}" == 1 ]] || refuse 'a re-run never reuses an earlier approval'
          [[ "${GITHUB_ACTOR}" == devantler && "${GITHUB_TRIGGERING_ACTOR}" == devantler ]] || refuse 'not dispatched by devantler'
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || refuse 'not a GitHub-hosted runner'
          [[ "${PROD_OPERATION}" =~ ${name_pattern} ]] || refuse 'operation is not a plain name'
          [[ "${PROD_OPERATION_CONFIRM}" == "${PROD_OPERATION}" ]] || refuse 'the typed confirmation does not equal the operation name'
          [[ "${PROD_OPERATION_PROGRAM}" =~ ${program_pattern} ]] || refuse 'program is not a scripts/ directory'
          [[ "${PROD_OPERATION_ARGS}" =~ ${args_pattern} ]] || refuse 'arguments are not plain words'
          exit "${refused}"

      - name: Checkout the reviewed dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"

      - name: Set up the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the reviewed program before restoring credentials
        shell: bash
        run: timeout 180s go build -mod=readonly -trimpath -o "${RUNNER_TEMP}/prod-operation" "./${PROD_OPERATION_PROGRAM}"

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/prod-operation-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/prod-operation-tools"
          install -m 0755 "${kubectl_path}" "${RUNNER_TEMP}/prod-operation-tools/kubectl"
          printf '%s\n' "${RUNNER_TEMP}/prod-operation-tools" >> "${GITHUB_PATH}"

      - name: Install the repository-approved age encryption tool
        shell: bash
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          set -euo pipefail
          age_archive="${RUNNER_TEMP}/prod-operation-age.tar.gz"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" -o "${age_archive}"
          printf '%s  %s\n' "${AGE_SHA256}" "${age_archive}" | sha256sum --check
          tar -xzf "${age_archive}" -C "${RUNNER_TEMP}" age/age
          install -m 0755 "${RUNNER_TEMP}/age/age" "${RUNNER_TEMP}/prod-operation-tools/age"

      # The prod environment holds KUBE_CONFIG and HCLOUD_TOKEN. A called workflow
      # sees an environment secret only when its caller passes it on (callers name
      # both); otherwise it is an empty string, which the empty
      # check below refuses as UNVERIFIED before anything runs.
      # The only step that sees a credential. The kubeconfig lives in memory and
      # is removed on exit; HCLOUD_TOKEN is dropped before the program runs
      # unless the caller declared a provider read. The program's stdout and stderr
      # are captured in memory and published only as age ciphertext, so the public
      # log shows the exit status and nothing the program printed.
      - name: Run the operation with the production credential
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          KEEP_HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          if [[ -z "${KUBE_CONFIG}" || ${#KUBE_CONFIG} -gt 1048576 ]]; then
            printf '%s\n' 'PROD_OPERATION=UNVERIFIED'
            exit 2
          fi
          credential_dir="$(mktemp -d /dev/shm/prod-operation.XXXXXX)"
          trap 'rm -rf "${credential_dir}"' EXIT
          export KUBECONFIG="${credential_dir}/kubeconfig"
          printf '%s' "${KUBE_CONFIG}" > "${KUBECONFIG}"
          unset KUBE_CONFIG
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            printf '%s\n' 'PROD_OPERATION=UNVERIFIED'
            exit 2
          fi
          if [[ "${KEEP_HCLOUD_TOKEN}" != true ]]; then
            unset HCLOUD_TOKEN
          fi
          unset KEEP_HCLOUD_TOKEN
          read -r -a operation_args <<<"${PROD_OPERATION_ARGS}"
          # The program cannot write to the public step summary or step outputs,
          # and at most 4 MiB of what it prints is kept (a cut is recorded).
          output_cap=4194304
          set +e
          env -u GITHUB_STEP_SUMMARY -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STATE \
            "${RUNNER_TEMP}/prod-operation" ${operation_args[@]+"${operation_args[@]}"} 2>&1 |
            head -c "${output_cap}" >"${credential_dir}/output"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$(wc -c <"${credential_dir}/output")" -ge "${output_cap}" ]]; then
            printf '\n[output truncated at 4 MiB]\n' >>"${credential_dir}/output"
          fi
          printf 'PROD_OPERATION_EXIT=%s\n' "${status}"
          if ! age --encrypt --armor --recipient "${PROD_OPERATION_RECIPIENT}" \
            <"${credential_dir}/output" >"${credential_dir}/output.age"; then
            printf '%s\n' 'PROD_OPERATION=UNVERIFIED'
            exit 2
          fi
          printf '%s\n' '----- BEGIN PROD OPERATION OUTPUT -----'
          cat "${credential_dir}/output.age"
          printf '%s\n' '----- END PROD OPERATION OUTPUT -----'
          exit "${status}"
