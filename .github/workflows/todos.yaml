---
name: "TODOs"
"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  id-token: write # lets the shared to-do scanner prove its identity to the GitHub token broker (ADR 0020)

jobs:
  todos:
    uses: devantler-tech/.github/.github/workflows/scan-for-todo-comments.yaml@61d8f70f25d7d5deb8bd914136b329b5a59ff43b # v22.7.4
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
