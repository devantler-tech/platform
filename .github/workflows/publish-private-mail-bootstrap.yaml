name: Publish Private Mail Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-private-mail-bootstrap.yaml
      - scripts/private-mail-config/**
      - go.mod
      - go.sum
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-private-mail-bootstrap.yaml
      - scripts/private-mail-config/**
      - go.mod
      - go.sum

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/platform-private-mail-bootstrap
  IMAGE_TAG: v0.16.27-bootstrap-${{ github.sha }}

jobs:
  verify:
    name: Verify and build bootstrap without publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and build static initializer
        run: |
          set -euo pipefail
          go test -race ./scripts/private-mail-config
          mkdir -p "${RUNNER_TEMP}/private-mail-build"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "${RUNNER_TEMP}/private-mail-build/private-mail-bootstrap" ./scripts/private-mail-config
          cp scripts/private-mail-config/Dockerfile "${RUNNER_TEMP}/private-mail-build/Dockerfile"
          bash scripts/private-mail-config/stage-webui.sh "${RUNNER_TEMP}/private-mail-build"
          docker buildx build --platform linux/amd64 "${RUNNER_TEMP}/private-mail-build"

  publish:
    name: Publish and sign immutable bootstrap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build static initializer
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/private-mail-build"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "${RUNNER_TEMP}/private-mail-build/private-mail-bootstrap" ./scripts/private-mail-config
          cp scripts/private-mail-config/Dockerfile "${RUNNER_TEMP}/private-mail-build/Dockerfile"
          bash scripts/private-mail-config/stage-webui.sh "${RUNNER_TEMP}/private-mail-build"
      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bootstrap image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/private-mail-build
          file: ${{ runner.temp }}/private-mail-build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Install checksum-verified supply-chain tools
        run: bash .github/scripts/setup-supply-chain-tools.sh
      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-private-mail-bootstrap.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
