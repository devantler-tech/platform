---
name: Publish Email Bootstrap

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-private-mail-bootstrap.yaml
      - scripts/private-mail-config/**
      - go.mod
      - go.sum
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-private-mail-bootstrap.yaml
      - scripts/private-mail-config/**
      - go.mod
      - go.sum

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build bootstrap without publishing
    runs-on: ubuntu-latest
    strategy:
      matrix: &bootstrap_profiles
        include:
          - runtime: "0.16.27"
            server: v0.16.27@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
            cli: 1.0.13@sha256:9a1e07307d6f890a193322c4b737fc0868405f0f8486a19922cbf362f43884fd
            image: ghcr.io/devantler-tech/platform-private-mail-bootstrap
          - runtime: "1.0.3"
            server: v1.0.3@sha256:73c684a84c24f5b4206ec266a8deb8986fe44a9f623997e07f084388d943c8bd
            cli: 1.0.14@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
            image: ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate
    env: &build_inputs
      STALWART_RUNTIME: ${{ matrix.runtime }}
      STALWART_SERVER_PIN: ${{ matrix.server }}
      STALWART_CLI_PIN: ${{ matrix.cli }}
      IMAGE: ${{ matrix.image }}
      IMAGE_TAG: v${{ matrix.runtime }}-bootstrap-${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Email configuration tests
        run: go test -race ./scripts/private-mail-config
      - name: Build static initializer
        run: &stage_bootstrap |
          set -euo pipefail
          build_dir="${RUNNER_TEMP}/private-mail-build"
          dockerfile=scripts/private-mail-config/Dockerfile
          mkdir -p "${build_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "${build_dir}/private-mail-bootstrap" ./scripts/private-mail-config
          # Platform listeners bind unprivileged ports. Linux refuses to exec
          # the candidate with its upstream effective file capability and no capabilities.
          awk -v runtime="${STALWART_RUNTIME}" -v server="${STALWART_SERVER_PIN}" -v cli="${STALWART_CLI_PIN}" '
            /^FROM ghcr\.io\/stalwartlabs\/stalwart:[^ ]+$/ {
              print "FROM ghcr.io/stalwartlabs/stalwart:" server
              server_count++
              next
            }
            /^FROM ghcr\.io\/stalwartlabs\/cli:[^ ]+ AS cli$/ {
              print "FROM ghcr.io/stalwartlabs/cli:" cli " AS cli"
              cli_count++
              next
            }
            /^USER 0$/ && runtime == "1.0.3" && server_count == 1 {
              print
              print "RUN setcap -r /usr/local/bin/stalwart && capability=\"$(getcap /usr/local/bin/stalwart)\" && test -z \"$capability\""
              capability_count++
              next
            }
            { print }
            END {
              if (server_count != 1 || cli_count != 1 || (runtime == "1.0.3" && capability_count != 1)) exit 1
            }
          ' "${dockerfile}" > "${build_dir}/Dockerfile"
          if [[ "${STALWART_RUNTIME}" == '0.16.27' ]]; then
            cmp -s "${dockerfile}" "${build_dir}/Dockerfile"
          fi
          bash scripts/private-mail-config/stage-webui.sh "${build_dir}" "${STALWART_RUNTIME}"
      - name: Build the selected image locally
        run: docker buildx build --platform linux/amd64 --load --tag email-bootstrap-verify "${RUNNER_TEMP}/private-mail-build"
      - name: Verify candidate server and CLI in the built image
        if: matrix.runtime == '1.0.3'
        run: |
          set -euo pipefail
          isolated=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges)
          server=$(docker run "${isolated[@]}" --entrypoint /usr/local/bin/stalwart email-bootstrap-verify --version)
          cli=$(docker run "${isolated[@]}" --entrypoint /usr/local/bin/stalwart-cli email-bootstrap-verify --version)
          test "${server}" = "${STALWART_RUNTIME}"
          test "${cli}" = 'stalwart-cli 1.0.14'

  publish:
    name: Publish and sign immutable bootstrap
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: *bootstrap_profiles
    env: *build_inputs
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build static initializer
        run: *stage_bootstrap
      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bootstrap image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/private-mail-build
          file: ${{ runner.temp }}/private-mail-build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Install checksum-verified supply-chain tools
        run: bash .github/scripts/setup-supply-chain-tools.sh
      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-private-mail-bootstrap.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
