---
name: Delete Longhorn Client Journal

# One-off cleanup for #6472: deletes the journal ConfigMap the retired Longhorn
# client-maintenance tool left in production. The program holds while the tool
# is still on main and deletes only the tool's own completed journal, pinned to
# the object it read. Guards, credential handling and cleanup live in
# prod-operation.yaml. Remove this workflow and its program once a run reports
# DELETED or ABSENT.
"on":
  # checkov:skip=CKV_GHA_7:Not a build. The typed confirmation is the interlock
  # prod-operation.yaml checks; it selects nothing but the fixed operation.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: delete-longhorn-client-journal"
        required: true
        type: string

permissions: {}

jobs:
  delete:
    permissions:
      contents: read
    # The self-repository form ($/) fails the pinned actionlint 1.7.12.
    uses: ./.github/workflows/prod-operation.yaml # zizmor: ignore[self-repository]
    # The prod environment secrets reach the called job only when named here.
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    with:
      operation: delete-longhorn-client-journal
      confirm: ${{ inputs.confirm }}
      program: scripts/delete-longhorn-client-journal
      timeout-minutes: 15
