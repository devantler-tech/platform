---
name: Seed GitHub Broker Apps

# One-off (#6605): copies both botantler Apps' credentials from the
# organization's Actions secrets into OpenBao for the GitHub token broker
# (k8s/providers/hetzner/apps/github-broker). It writes through a PushSecret on
# the broker's own namespaced SecretStore, whose OpenBao role alone may write
# infrastructure/github/apps/botantler-1 and botantler-2. The follow-up that
# raises the broker to two replicas deletes this workflow and drops that
# write capability.
#
# Before any credential is read: dispatched on this repository from main, first
# attempt only, by devantler, on a GitHub-hosted runner, with the typed
# confirmation, and the revision must still be main. Each key must then prove it
# is its App's (reviewed App ID, and GET /app with a JWT it signs) before the
# cluster is touched. The temporary Secret and PushSecret are deleted on every
# exit. The run prints only status lines, never key material or kubectl output.
# It never calls the token broker.
"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: seed-github-broker-apps"
        required: true
        type: string

permissions: {}
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  seed:
    name: Seed the GitHub token broker's App credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt main dispatch by devantler
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_RUN_ATTEMPT" != 1 || "$GITHUB_ACTOR" != devantler || "$GITHUB_TRIGGERING_ACTOR" != devantler || "$RUNNER_ENVIRONMENT" != github-hosted || "$CONFIRM" != seed-github-broker-apps ]]; then
            printf '%s\n' 'GITHUB_BROKER_SEED=UNVERIFIED stage=admission' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"

      - name: Set up the repository Go version
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the reviewed key verifier before reading credentials
        shell: bash
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/verify-github-broker-apps" ./scripts/verify-github-broker-apps

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/github-broker-seed-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/github-broker-seed-tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/github-broker-seed-tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/github-broker-seed-tools" >> "$GITHUB_PATH"

      - name: Prove each key belongs to its App before touching the cluster
        shell: bash
        env:
          BOTANTLER_1_APP_ID: ${{ vars.APP_ID }}
          BOTANTLER_1_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          BOTANTLER_1_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          BOTANTLER_2_APP_ID: ${{ vars.APP_ID_2 }}
          BOTANTLER_2_CLIENT_ID: ${{ vars.APP_CLIENT_ID_2 }}
          BOTANTLER_2_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY_2 }}
        run: |
          set +x
          set -euo pipefail
          # The verifier prints one status line naming at most an App and a stage.
          status=0
          result="$("$RUNNER_TEMP/verify-github-broker-apps" 2>/dev/null)" || status=$?
          if [[ "$status" != 0 || "$result" != 'GITHUB_BROKER_APPS=VERIFIED apps=2' ]]; then
            if [[ "$result" =~ ^GITHUB_BROKER_APPS=UNVERIFIED\ app=botantler-[12]\ stage=[a-z]+$ ]]; then
              printf '%s\n' "$result" >&2
            fi
            printf '%s\n' 'GITHUB_BROKER_SEED=UNVERIFIED stage=verify' >&2
            exit 2
          fi
          printf '%s\n' "$result"

      - name: Push both credentials into OpenBao through the broker's SecretStore
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BOTANTLER_1_APP_ID: ${{ vars.APP_ID }}
          BOTANTLER_1_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          BOTANTLER_2_APP_ID: ${{ vars.APP_ID_2 }}
          BOTANTLER_2_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY_2 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          stage=private-workspace
          wrote=false
          fail() { printf 'GITHUB_BROKER_SEED=UNVERIFIED stage=%s\n' "$stage" >&2; exit 2; }
          [[ $(findmnt -n -o FSTYPE --target /dev/shm) == tmpfs ]] || fail
          private_dir="$(mktemp -d /dev/shm/github-broker-seed.XXXXXXXX)"
          # Runs on every exit: the temporary Secret and PushSecret must not
          # outlive the run, so a failed removal fails the run.
          cleanup() {
            local status=$?
            if [[ "$wrote" == true ]] && ! kubectl --context=admin@prod -n github-broker delete \
                pushsecret.external-secrets.io/github-broker-seed secret/github-broker-seed \
                --ignore-not-found --wait=true --timeout=60s >/dev/null 2>&1; then
              printf '%s\n' 'GITHUB_BROKER_SEED=UNVERIFIED stage=cleanup' >&2
              status=2
            fi
            rm -rf "$private_dir"
            if [[ "$status" == 0 ]]; then
              printf '%s\n' 'GITHUB_BROKER_SEED=PASS apps=2'
            fi
            exit "$status"
          }
          trap cleanup EXIT
          stage=app-ids
          [[ "$BOTANTLER_1_APP_ID" == 1025824 && "$BOTANTLER_2_APP_ID" == 4126012 ]] || fail
          stage=kubeconfig
          [[ -n "$KUBE_CONFIG" && ${#KUBE_CONFIG} -le 1048576 ]] || fail
          export KUBECONFIG="$private_dir/kubeconfig"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          unset KUBE_CONFIG
          stage=stable-api
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            fail
          fi
          unset HCLOUD_TOKEN
          stage=secret-store
          kubectl --context=admin@prod -n github-broker get secretstore.external-secrets.io/openbao >/dev/null 2>&1 || fail
          wrote=true
          stage=seed-secret
          # Server-side apply keeps the values out of a last-applied annotation.
          jq -n '{
            apiVersion: "v1",
            kind: "Secret",
            type: "Opaque",
            metadata: {name: "github-broker-seed", namespace: "github-broker"},
            stringData: {
              "botantler-1-app-id": env.BOTANTLER_1_APP_ID,
              "botantler-1-pem": env.BOTANTLER_1_PRIVATE_KEY,
              "botantler-2-app-id": env.BOTANTLER_2_APP_ID,
              "botantler-2-pem": env.BOTANTLER_2_PRIVATE_KEY
            }
          }' | kubectl --context=admin@prod apply --server-side --field-manager=seed-github-broker-apps -f - >/dev/null 2>&1 || fail
          unset BOTANTLER_1_PRIVATE_KEY BOTANTLER_2_PRIVATE_KEY
          stage=push-secret
          kubectl --context=admin@prod apply --server-side --field-manager=seed-github-broker-apps -f - >/dev/null 2>&1 <<'PUSHSECRET' || fail
          apiVersion: external-secrets.io/v1alpha1
          kind: PushSecret
          metadata:
            name: github-broker-seed
            namespace: github-broker
          spec:
            updatePolicy: Replace
            deletionPolicy: None
            secretStoreRefs:
              - name: openbao
                kind: SecretStore
            selector:
              secret:
                name: github-broker-seed
            data:
              - match:
                  secretKey: botantler-1-app-id
                  remoteRef:
                    remoteKey: infrastructure/github/apps/botantler-1
                    property: app_id
              - match:
                  secretKey: botantler-1-pem
                  remoteRef:
                    remoteKey: infrastructure/github/apps/botantler-1
                    property: pem
              - match:
                  secretKey: botantler-2-app-id
                  remoteRef:
                    remoteKey: infrastructure/github/apps/botantler-2
                    property: app_id
              - match:
                  secretKey: botantler-2-pem
                  remoteRef:
                    remoteKey: infrastructure/github/apps/botantler-2
                    property: pem
          PUSHSECRET
          stage=push
          kubectl --context=admin@prod -n github-broker wait --for=condition=Ready=true --timeout=180s \
            pushsecret.external-secrets.io/github-broker-seed >/dev/null 2>&1 || fail
          reason="$(kubectl --context=admin@prod -n github-broker get pushsecret.external-secrets.io/github-broker-seed \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].reason}' 2>/dev/null)" || fail
          [[ "$reason" == Synced ]] || fail
