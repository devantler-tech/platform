---
name: Observe Historical Longhorn Backups

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/observe-historical-longhorn-backups.yaml
      - scripts/observe-historical-longhorn-backups/**
      - internal/backupcatalogue/**
      - go.mod
      - go.sum
  merge_group:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: observe-historical-longhorn-backups"
        required: true
        type: string

permissions: {}

jobs:
  tests:
    name: Validate read-only catalogue boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test complete bindings, bounded reads and refusal paths
        run: go test -race -count=1 -timeout=5m ./internal/backupcatalogue ./scripts/observe-historical-longhorn-backups

  observe:
    name: Read historical repository metadata
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
      queue: max
    env:
      LONGHORN_CATALOGUE_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require confirmed first attempt on main
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          [[ "${LONGHORN_CATALOGUE_CONFIRM}" == observe-historical-longhorn-backups ]]
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require current main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-prod-recovery-source.sh "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verified Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="${RUNNER_TEMP}/longhorn-catalogue-kubectl"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 120 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "${kubectl_path}"
          printf '%s  %s\n' "${KUBECTL_SHA256}" "${kubectl_path}" | sha256sum --check
          sudo install "${kubectl_path}" /usr/local/bin/kubectl
      - name: Restore production kubeconfig in memory
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          credential_dir=$(mktemp -d /dev/shm/longhorn-catalogue.XXXXXX)
          printf '%s' "${KUBE_CONFIG}" >"${credential_dir}/kubeconfig"
          printf 'KUBECONFIG=%s/kubeconfig\nLONGHORN_CATALOGUE_CREDENTIAL_DIR=%s\n' "${credential_dir}" "${credential_dir}" >>"${GITHUB_ENV}"
      - name: Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh
      - name: Read both historical catalogues
        run: go run ./scripts/observe-historical-longhorn-backups
      - name: Remove runner credentials and temporary config
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LONGHORN_CATALOGUE_CREDENTIAL_DIR:-}" =~ ^/dev/shm/longhorn-catalogue\.[A-Za-z0-9]+$ ]]; then
            rm -rf -- "${LONGHORN_CATALOGUE_CREDENTIAL_DIR}"
          fi
