name: Protect Retained Backstage Storage

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROTECT BACKSTAGE STORAGE ONLY; only bound volume Delete policies become Retain
        required: true
        type: string
      deployed_revision:
        description: Exact accepted latest@sha256 revision verified through fresh production readback
        required: true
        type: string
      accepted_deployment_run:
        description: Successful normal CI or CD run that deployed the current main commit to prod
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  protect:
    name: Retain only the existing portal database backing volumes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preserve the accepted artifact-deployment record. Existing prod reviewers,
    # branch rules and secret protection still apply to this maintenance job.
    environment:
      name: prod
      deployment: false
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTAL_STORAGE_CONFIRM: ${{ inputs.confirmation }}
      PORTAL_STORAGE_REVISION: ${{ inputs.deployed_revision }}
      PORTAL_STORAGE_DEPLOYMENT_RUN: ${{ inputs.accepted_deployment_run }}
    steps:
      - name: Require the exact confirmed first main dispatch before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$GITHUB_REPOSITORY" == devantler-tech/platform ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == devantler-tech/platform/.github/workflows/protect-backstage-storage.yaml@refs/heads/main ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PORTAL_STORAGE_CONFIRM" == 'PROTECT BACKSTAGE STORAGE ONLY' ]]
          [[ "$PORTAL_STORAGE_REVISION" =~ ^latest@sha256:[0-9a-f]{64}$ ]]
          [[ "$PORTAL_STORAGE_DEPLOYMENT_RUN" =~ ^[1-9][0-9]{0,19}$ ]]

      - name: Checkout the exact reviewed dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the validated checkout to remain current main
        run: ./scripts/verify-prod-recovery-source.sh "$GITHUB_SHA"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require offline identity, race and patch-preservation controls
        env:
          PORTAL_STORAGE_REQUIRE_NATIVE_CONTROL: "1"
        run: go test -race -count=1 ./internal/portalstorage ./scripts/protect-backstage-storage

      - name: Authenticate the existing protected registry reader
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/portal-storage-registry
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null

      - name: Restore the established protected production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config

      - name: Select the stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh >/dev/null

      # No Secret or Helm payload is read; raw evidence remains in process memory.
      - name: Protect only the joined volumes and verify the retained database
        # The existing registry credential reads OCI-only provenance bundles;
        # no new credential is created and no shared permission is changed.
        env:
          PORTAL_STORAGE_GHCR_READER_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/portal-storage-registry
        run: go run ./scripts/protect-backstage-storage --execute
