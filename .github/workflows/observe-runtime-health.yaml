---
name: Observe Runtime Health Read Only

# Observation only: no object, alert, exception or configuration is changed.
# Guards, credential handling and cleanup live in prod-operation.yaml.
"on":
  # checkov:skip=CKV_GHA_7:Not a build. The typed confirmation is the interlock
  # prod-operation.yaml checks; it selects nothing but the fixed operation.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: observe-runtime-health"
        required: true
        type: string

permissions: {}

jobs:
  observe:
    permissions:
      contents: read
    # The self-repository form ($/) fails the pinned actionlint 1.7.12.
    uses: ./.github/workflows/prod-operation.yaml # zizmor: ignore[self-repository]
    # The prod environment secrets reach the called job only when named here.
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    with:
      operation: observe-runtime-health
      confirm: ${{ inputs.confirm }}
      program: scripts/observe-runtime-health
      timeout-minutes: 10
