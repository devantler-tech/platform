---
name: Observe Runtime Health Read Only

# Observation only: no object, alert, exception or configuration is changed.
# Guards, credential handling and cleanup live in prod-operation.yaml.
"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: observe-runtime-health"
        required: true
        type: string

permissions: {}

jobs:
  observe:
    permissions:
      contents: read
    uses: ./.github/workflows/prod-operation.yaml
    with:
      operation: observe-runtime-health
      confirm: ${{ inputs.confirm }}
      program: scripts/observe-runtime-health
      timeout-minutes: 10
