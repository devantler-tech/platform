name: Publish Automated Mail Sender

on:
  pull_request:
    branches: [main]
    paths: &source_paths
      - .github/workflows/publish-mail-submission.yaml
      - scripts/build-mail-submission-image.sh
      - scripts/mail-submission/**
      - third_party/go-smtp/**
      - go.mod
      - go.sum
      - .github/scripts/setup-supply-chain-tools.sh
      - .github/scripts/release-asset-download.sh
  push:
    branches: [main]
    paths: *source_paths

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/platform-mail-submission
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  verify:
    name: Verify automated mail distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      archive_sha: ${{ steps.build.outputs.archive_sha }}
      image_id: ${{ steps.build.outputs.image_id }}
      binary_sha: ${{ steps.build.outputs.binary_sha }}
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out reviewed platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up reviewed Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build and exercise exact distribution
        id: build
        run: bash scripts/build-mail-submission-image.sh "${IMAGE}:${IMAGE_TAG}"
      - name: Name the verified archive
        id: artifact
        run: printf 'name=mail-submission-image-%s-%s\n' "${GITHUB_RUN_ID:?}" "${GITHUB_RUN_ATTEMPT:?}" >> "${GITHUB_OUTPUT:?}"
      - name: Retain verified image without rebuilding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/mail-submission-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified automated mail bytes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out reviewed platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/mail-submission-verified
      - name: Check archive and native image identity
        env:
          ARCHIVE_SHA: ${{ needs.verify.outputs.archive_sha }}
          IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ "${ARCHIVE_SHA}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${ARCHIVE_SHA}" "${RUNNER_TEMP}/mail-submission-verified/mail-submission-image.tar" | sha256sum --check
          docker load --input "${RUNNER_TEMP}/mail-submission-verified/mail-submission-image.tar"
          test "$(docker image inspect --format '{{.Id}}' "${IMAGE}:${IMAGE_TAG}")" = "${IMAGE_ID}"
      - name: Install checksum-verified supply-chain tools
        run: bash .github/scripts/setup-supply-chain-tools.sh
      - name: Inventory verified distribution
        run: syft "docker:${IMAGE}:${IMAGE_TAG}" --output "cyclonedx-json=${RUNNER_TEMP}/mail-submission-sbom.json"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, sign and verify distribution
        env:
          ARCHIVE_SHA: ${{ needs.verify.outputs.archive_sha }}
          IMAGE_ID: ${{ needs.verify.outputs.image_id }}
          BINARY_SHA: ${{ needs.verify.outputs.binary_sha }}
        run: |
          set -euo pipefail
          [[ "${BINARY_SHA}" =~ ^[0-9a-f]{64}$ ]]
          docker push "${IMAGE}:${IMAGE_TAG}"
          digest_ref="$(docker image inspect --format '{{json .RepoDigests}}' "${IMAGE}:${IMAGE_TAG}" | jq -er --arg prefix "${IMAGE}@sha256:" 'map(select(startswith($prefix))) | if length == 1 then .[0] else error("ambiguous digest") end')"
          identity="https://github.com/devantler-tech/platform/.github/workflows/publish-mail-submission.yaml@refs/heads/main"
          cosign sign --yes "${digest_ref}"
          cosign verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${digest_ref}" > /dev/null
          jq -n --arg source "${GITHUB_SHA}" --arg archive "${ARCHIVE_SHA}" \
            --arg image "${IMAGE_ID}" --arg binary "${BINARY_SHA}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            '{sourceRevision:$source,verifiedArchiveSHA256:$archive,verifiedImageID:$image,binarySHA256:$binary,verificationRun:$run}' > "${RUNNER_TEMP}/mail-submission-provenance.json"
          cosign attest --yes --type cyclonedx --predicate "${RUNNER_TEMP}/mail-submission-sbom.json" "${digest_ref}"
          cosign attest --yes --type https://devantler.tech/attestations/mail-submission-build/v1 --predicate "${RUNNER_TEMP}/mail-submission-provenance.json" "${digest_ref}"
          for type in cyclonedx https://devantler.tech/attestations/mail-submission-build/v1; do
            cosign verify-attestation --type "${type}" --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${digest_ref}" > /dev/null
          done
          printf 'Published and verified: %s\n' "${digest_ref}"
