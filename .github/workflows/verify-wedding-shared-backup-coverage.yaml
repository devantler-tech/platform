name: Verify Wedding Shared Backup Coverage

# Prove that the dedicated Wedding backup bucket covers everything the stale copy
# of the catalogue in the shared backup bucket still holds (#4481). Removing
# that copy is irreversible, so the decision needs this evidence first.
#
# DORMANT. There is no schedule and no pull_request trigger, and the operator
# must type an exact confirmation phrase, so an accidental dispatch does nothing.
#
# MAIN ONLY. `workflow_dispatch` accepts any branch, and this job holds the
# production kubeconfig. The prod environment already refuses non-main refs; the
# explicit check below fails fast and names the reason.
#
# READ ONLY. The proof lists both buckets and reads the objects it has to hash.
# It never writes to or deletes from either bucket.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: verify-wedding-shared-backup-coverage"
        required: true
        type: string

permissions: {}

# The proof reads production state and two backup credentials. Serialize with
# every other production mutation so a deploy cannot change the wiring mid-run.
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  coverage:
    name: 💒 Prove the dedicated bucket covers the shared Wedding catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    permissions:
      contents: read # checkout repository
    steps:
      # Inputs reach bash through env, never `${{ }}` inside run, so a crafted
      # value cannot inject shell.
      - name: 🛑 Require main and explicit confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${DISPATCH_REF}" != 'refs/heads/main' ]]; then
            printf 'Refusing to run from %s: dispatch this workflow from main.\n' "${DISPATCH_REF}" >&2
            exit 1
          fi
          if [[ "${CONFIRM}" != 'verify-wedding-shared-backup-coverage' ]]; then
            printf 'Refusing to run: the confirm input must be exactly "verify-wedding-shared-backup-coverage".\n' >&2
            printf 'The proof starts pods beside two production backup credentials. Nothing has been touched.\n' >&2
            exit 1
          fi
          printf 'Confirmation accepted.\n'

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: 🔑 Restore production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config

      - name: 🎯 Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh

      - name: 💒 Compare the shared catalogue with the dedicated one
        shell: bash
        run: ./scripts/verify-wedding-shared-backup-coverage.sh --confirm
