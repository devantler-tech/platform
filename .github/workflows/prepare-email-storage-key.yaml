name: Prepare Email Storage Key

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: prepare-email-storage-key"
        required: true
        type: string

permissions: {}
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare the Email storage key after independent recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Require the confirmed first-attempt main dispatch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != devantler-tech/platform || "$GITHUB_RUN_ATTEMPT" != 1 || "$CONFIRM" != prepare-email-storage-key ]]; then
            printf '%s\n' 'EMAIL_STORAGE_KEY=UNVERIFIED' >&2
            exit 2
          fi

      - name: Check out the confirmed immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the repository Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the reviewed recovery reader before restoring credentials
        shell: bash
        run: go build -o "$RUNNER_TEMP/verify-openbao-recovery" ./scripts/openbao-backup-recovery

      - name: Install the repository-approved Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
        run: |
          set -euo pipefail
          kubectl_path="$RUNNER_TEMP/email-custody-kubectl"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 60 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$kubectl_path"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$kubectl_path" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/email-custody-tools"
          install -m 0755 "$kubectl_path" "$RUNNER_TEMP/email-custody-tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/email-custody-tools" >> "$GITHUB_PATH"

      - name: Prepare only after independent recovery succeeds
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          EMAIL_STORAGE_CONFIRM: ${{ inputs.confirm }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          stage=private-workspace
          fail() { printf 'EMAIL_STORAGE_KEY=UNVERIFIED stage=%s\n' "$stage" >&2; exit 2; }
          [[ $(findmnt -n -o FSTYPE --target /dev/shm) == tmpfs ]] || fail
          private_dir="$(mktemp -d /dev/shm/email-storage-key.XXXXXXXX)"
          proof_dir="$private_dir/recovery"
          mkdir -m 0700 "$proof_dir"
          forward_pid=''
          cleanup() {
            if [[ -n "$forward_pid" ]]; then
              kill "$forward_pid" 2>/dev/null || true
              wait "$forward_pid" 2>/dev/null || true
            fi
            rm -rf "$private_dir"
          }
          trap cleanup EXIT
          [[ -n "$KUBE_CONFIG" && ${#KUBE_CONFIG} -le 1048576 ]] || fail
          export KUBECONFIG="$private_dir/kubeconfig"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          unset KUBE_CONFIG
          stage=stable-api
          if ! ./scripts/use-prod-stable-api-endpoint.sh >/dev/null; then
            fail
          fi
          unset HCLOUD_TOKEN
          stage=live-connection
          kubectl --context=admin@prod -n openbao port-forward --address=127.0.0.1 service/openbao-active 38200:8200 > "$private_dir/forward.log" 2>&1 &
          forward_pid=$!
          ready=false
          for ((attempt=0; attempt<20; attempt++)); do
            kill -0 "$forward_pid" 2>/dev/null || fail
            if curl --disable --silent --fail --noproxy '*' --connect-timeout 1 --max-time 2 \
                http://127.0.0.1:38200/v1/sys/health > /dev/null 2>"$private_dir/health.log"; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || fail
          binary="$RUNNER_TEMP/verify-openbao-recovery"
          export OPENBAO_RECOVERY_DIR="$proof_dir"
          stage=collection
          if ! "$binary" collect-email > "$private_dir/collection-result" 2>"$private_dir/collection.log"; then fail; fi
          [[ $(cat "$private_dir/collection-result") == OPENBAO_BACKUP_INPUTS=PASS ]] || fail
          stage=image
          image=$("$binary" image) || fail
          if ! docker pull "$image" > "$private_dir/pull.log" 2>&1; then fail; fi
          stage=isolated-restore
          if ! bash scripts/run-openbao-backup-sandbox.sh verify-email "$proof_dir" "$binary" > "$private_dir/verification-result" 2>"$private_dir/verification.log"; then fail; fi
          [[ $(cat "$private_dir/verification-result") == 'OPENBAO_BACKUP_RESTORE=PASS records=3 version=2.6.3' ]] || fail
          stage='storage-key'
          kill -0 "$forward_pid" 2>/dev/null || fail
          if ! "$binary" seed-email-storage > "$private_dir/seed-result" 2>"$private_dir/seed.log"; then fail; fi
          stage='result-format'
          result=$(cat "$private_dir/seed-result")
          [[ "$result" =~ ^EMAIL_STORAGE_KEY=PREPARED\ state=(CREATED|EXISTING)\ recovered=false$ ]] || fail
          printf '%s\n' "$result"
