---
name: Publish kagent Claude Harness

# The Agentic Engineer's kagent lane runs on kagent's Claude Code harness
# with gh, jq, yq and curl added (scripts/kagent-claude-harness/Dockerfile,
# devantler-tech/monorepo#4867). Pull requests build it; main publishes and
# signs one immutable image, which the lane's Harness pins by digest.
"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-claude-harness.yaml
      - scripts/kagent-claude-harness/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-claude-harness.yaml
      - scripts/kagent-claude-harness/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/platform-kagent-claude-harness
  IMAGE_TAG: 1.0.0-rc3-${{ github.sha }}
  CONTEXT: scripts/kagent-claude-harness

jobs:
  build:
    name: Build without publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker buildx build --platform linux/amd64 "${CONTEXT}"

  publish:
    name: Publish and sign immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-kagent-claude-harness.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
