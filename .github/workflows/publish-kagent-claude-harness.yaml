---
name: Publish kagent Claude Harness

# The Agentic Engineer's kagent lane runs on kagent's Claude Code harness
# with gh, jq, yq, curl, GNU coreutils, Go and kubectl added
# (scripts/kagent-claude-harness/Dockerfile,
# devantler-tech/monorepo#4867). Pull requests build it; main publishes and
# signs one immutable image, which the lane's Harness pins by digest.
"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-claude-harness.yaml
      - scripts/kagent-claude-harness/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-kagent-claude-harness.yaml
      - scripts/kagent-claude-harness/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devantler-tech/platform-kagent-claude-harness
  IMAGE_TAG: 1.0.0-${{ github.sha }}
  CONTEXT: scripts/kagent-claude-harness

jobs:
  build:
    name: Build without publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker buildx build --platform linux/amd64 --load --tag kagent-claude-harness:pr "${CONTEXT}"

      # The image the harness runs: the wrapper is the `claude` on PATH, Claude
      # Code still answers through it, the tools are there, and the plugin carries
      # all of its agents and skills.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint /bin/sh kagent-claude-harness:pr -c '
            set -eu
            test "$(command -v claude)" = /usr/local/bin/claude
            claude --version
            for tool in gh jq yq curl git go kubectl; do command -v "${tool}"; done
            go version
            # A Go guard as the monorepo writes them builds offline: no toolchain or
            # module download, as in the sandbox. It runs with the PATH of the base
            # image and nothing else, as a run that gets none of the ENV set here would.
            guard=$(mktemp -d)
            printf "module guard\n\ngo 1.26.11\n" >"${guard}/go.mod"
            printf "package main\n\nimport \"os\"\n\nfunc main() { os.Exit(0) }\n" >"${guard}/main.go"
            bare="env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=${guard}"
            test "$(${bare} go env GOTOOLCHAIN)" = local
            (cd "${guard}" && ${bare} GOPROXY=off go build -o "${guard}/guard" . && "${guard}/guard")
            timeout --version | grep -q "GNU coreutils"
            date -u -d "7 days ago" +%s
            test "${KUBECONFIG}" = /opt/kagent-lane/kubeconfig
            test "$(kubectl config view -o jsonpath="{.contexts[*].context.cluster}")" = prod
            test "$(kubectl config view -o jsonpath="{.clusters[0].cluster.server}")" = \
              http://cluster-reader.agentic-engineer.svc.cluster.local:8001
            plugin=/opt/agent-plugins/agentic-engineering
            test -f "${plugin}/agents/agentic-engineer.agent.md"
            agents=$(find "${plugin}/agents" -name "*.agent.md" | wc -l)
            skills=$(find "${plugin}/skills" -name SKILL.md | wc -l)
            echo "plugin: ${agents} agents, ${skills} skills"
            test "${agents}" -ge 4
            test "${skills}" -ge 80
            test "$(id -u)" = 65532'

  publish:
    name: Publish and sign immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-kagent-claude-harness.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
