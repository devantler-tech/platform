name: Publish Coroot Node Agent Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-coroot-node-agent-hotfix.yaml
      - k8s/bases/infrastructure/coroot/CorootNodeAgent.Dockerfile
      - k8s/bases/infrastructure/coroot/node-agent-v1.38.1-alert-remediation.patch
      - scripts/tests/test-coroot-node-agent-hotfix.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-coroot-node-agent-hotfix.yaml
      - k8s/bases/infrastructure/coroot/CorootNodeAgent.Dockerfile
      - k8s/bases/infrastructure/coroot/node-agent-v1.38.1-alert-remediation.patch
      - scripts/tests/test-coroot-node-agent-hotfix.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COROOT_NODE_AGENT_SOURCE_TAG: v1.38.1
  COROOT_NODE_AGENT_SOURCE_COMMIT: e335bf21a4657e9c91f56945f726e28b5f56a589
  UPSTREAM_IMAGE: ghcr.io/coroot/coroot-node-agent:1.38.1@sha256:a1488ca3e541703fe4b4cdefeff2dae992cc9f45affd18f9f41e5b12a8016cae
  IMAGE: ghcr.io/devantler-tech/platform-coroot-node-agent
  IMAGE_TAG: v1.38.1-alerts.1-${{ github.sha }}
  PATCH_PATH: k8s/bases/infrastructure/coroot/node-agent-v1.38.1-alert-remediation.patch
  DOCKERFILE_PATH: k8s/bases/infrastructure/coroot/CorootNodeAgent.Dockerfile

jobs:
  verify:
    name: Verify pinned source and patch
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Coroot node-agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coroot/coroot-node-agent
          ref: ${{ env.COROOT_NODE_AGENT_SOURCE_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false

      - name: Install systemd development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsystemd-dev

      - name: Apply, test and build compatibility binary
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.COROOT_NODE_AGENT_SOURCE_COMMIT }}
          EXPECTED_SOURCE_TAG: ${{ env.COROOT_NODE_AGENT_SOURCE_TAG }}
          HOTFIX_PATCH: ${{ github.workspace }}/${{ env.PATCH_PATH }}
          VERSION: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          # The build stamps the module from this tag, so the binary names its release.
          git fetch --depth=1 origin "refs/tags/${EXPECTED_SOURCE_TAG}:refs/tags/${EXPECTED_SOURCE_TAG}"
          test "$(git rev-parse "refs/tags/${EXPECTED_SOURCE_TAG}^{commit}")" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git diff --check
          go test ./ebpftracer ./node ./logs
          CGO_ENABLED=1 go build -mod=readonly \
            -ldflags "-extldflags='-Wl,-z,lazy' -X 'github.com/coroot/coroot-node-agent/flags.Version=${VERSION}'" \
            -o coroot-node-agent .
          go version -m coroot-node-agent | grep -qE "^[[:space:]]+mod[[:space:]]+github.com/coroot/coroot-node-agent[[:space:]]+${EXPECTED_SOURCE_TAG}\+dirty([[:space:]]|\$)"

      - name: Refuse advisories the built binary reaches
        working-directory: upstream
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/coroot-node-agent-govulncheck.json"
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode binary -format json coroot-node-agent >"${report}"
          # A report that never listed the binary's modules examined nothing.
          jq -es 'any(.[]; (.SBOM.modules // []) | length > 0)' "${report}" >/dev/null
          # Public logs carry the counts only; advisory detail stays out of them.
          found="$(jq -s '[.[] | .finding.osv // empty] | unique | length' "${report}")"
          reached="$(jq -s '[.[] | select(.finding.trace[0].function != null) | .finding.osv] | unique | length' "${report}")"
          printf 'Advisories in shipped modules: %s; reached by the binary: %s\n' "${found}" "${reached}"
          test "${reached}" = 0

      - name: Build compatibility image without publishing
        working-directory: upstream
        env:
          DOCKERFILE: ${{ github.workspace }}/${{ env.DOCKERFILE_PATH }}
        run: docker buildx build --platform linux/amd64 --file "${DOCKERFILE}" .

  publish:
    name: Publish and sign immutable image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Coroot node-agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coroot/coroot-node-agent
          ref: ${{ env.COROOT_NODE_AGENT_SOURCE_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: false

      - name: Install systemd development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsystemd-dev

      - name: Reapply reviewed patch and build compatibility binary
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ env.COROOT_NODE_AGENT_SOURCE_COMMIT }}
          EXPECTED_SOURCE_TAG: ${{ env.COROOT_NODE_AGENT_SOURCE_TAG }}
          HOTFIX_PATCH: ${{ github.workspace }}/${{ env.PATCH_PATH }}
          VERSION: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          # The build stamps the module from this tag, so the binary names its release.
          git fetch --depth=1 origin "refs/tags/${EXPECTED_SOURCE_TAG}:refs/tags/${EXPECTED_SOURCE_TAG}"
          test "$(git rev-parse "refs/tags/${EXPECTED_SOURCE_TAG}^{commit}")" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git diff --check
          CGO_ENABLED=1 go build -mod=readonly \
            -ldflags "-extldflags='-Wl,-z,lazy' -X 'github.com/coroot/coroot-node-agent/flags.Version=${VERSION}'" \
            -o coroot-node-agent .
          go version -m coroot-node-agent | grep -qE "^[[:space:]]+mod[[:space:]]+github.com/coroot/coroot-node-agent[[:space:]]+${EXPECTED_SOURCE_TAG}\+dirty([[:space:]]|\$)"

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compatibility image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./k8s/bases/infrastructure/coroot/CorootNodeAgent.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            io.devantler.coroot-node-agent.upstream-revision=${{ env.COROOT_NODE_AGENT_SOURCE_COMMIT }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-coroot-node-agent-hotfix.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
