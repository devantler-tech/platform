name: Complete Backstage Retirement

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type COMPLETE BACKSTAGE RETIREMENT JOURNAL ONLY
        required: true
        type: string
      deployed_revision:
        description: Exact accepted latest@sha256 revision verified through fresh production readback
        required: true
        type: string
      accepted_deployment_run:
        description: Successful normal CI or CD run that deployed the current main commit to prod
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  complete:
    name: Remove only the terminal Backstage retirement journal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: prod
    permissions:
      actions: read
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTAL_RETIREMENT_CONFIRM: ${{ inputs.confirmation }}
      PORTAL_RETIREMENT_REVISION: ${{ inputs.deployed_revision }}
      PORTAL_RETIREMENT_DEPLOYMENT_RUN: ${{ inputs.accepted_deployment_run }}
    steps:
      - name: Require the exact confirmed first main dispatch before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$GITHUB_REPOSITORY" == devantler-tech/platform ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == devantler-tech/platform/.github/workflows/complete-backstage-retirement.yaml@refs/heads/main ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PORTAL_RETIREMENT_CONFIRM" == 'COMPLETE BACKSTAGE RETIREMENT JOURNAL ONLY' ]]
          [[ "$PORTAL_RETIREMENT_REVISION" =~ ^latest@sha256:[0-9a-f]{64}$ ]]
          [[ "$PORTAL_RETIREMENT_DEPLOYMENT_RUN" =~ ^[1-9][0-9]{0,19}$ ]]

      - name: Checkout the exact reviewed dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the validated checkout to remain current main
        run: ./scripts/verify-prod-recovery-source.sh "$GITHUB_SHA"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require race-tested terminal journal controls
        run: go test -race -count=1 ./scripts/retire-backstage-stateless

      - name: Install the verified credential-decryption tool
        shell: bash
        env:
          # renovate: datasource=github-releases depName=devantler-tech/ksail extractVersion=^v(?<version>.+)$
          KSAIL_VERSION: "7.202.58"
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-ksail.sh

      - name: Stage the existing protected production pull credential
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DOCKER_CONFIG: ${{ runner.temp }}/portal-retirement-registry
        run: |
          set -euo pipefail
          test -n "$SOPS_AGE_KEY"
          DOCKER_CONFIG="${DOCKER_CONFIG:?}"
          source scripts/ghcr-auth-lib.sh
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          decrypt_flux_ghcr_docker_config "$DOCKER_CONFIG/config.json"
          write_flux_ghcr_credentials "$DOCKER_CONFIG/config.json" "$DOCKER_CONFIG/validated.json"
          rm -f -- "$DOCKER_CONFIG/validated.json"

      - name: Install the checksum-verified Helm reader
        shell: bash
        env:
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://get.helm.sh/$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive"
          echo "$install_dir/linux-amd64" >> "$GITHUB_PATH"

      - name: Restore the established protected production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config

      - name: Select the stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh >/dev/null

      # The command proves the exact existing journal, receipt, completed
      # stateless cleanup, database health and retained bindings twice. Its one
      # write is an identity-tested removal of that journal annotation.
      - name: Complete the terminal retirement and verify Flux recovery
        env:
          HELM_DRIVER: secret
          DOCKER_CONFIG: ${{ runner.temp }}/portal-retirement-registry
        run: go run ./scripts/retire-backstage-stateless --complete

      - name: Remove only the temporary registry credential files
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/portal-retirement-registry
        run: |
          set -euo pipefail
          if [[ -d "$DOCKER_CONFIG" ]]; then
            rm -f -- "$DOCKER_CONFIG/config.json" "$DOCKER_CONFIG/validated.json"
            rmdir -- "$DOCKER_CONFIG"
          fi
