name: Retire Crossview and Headlamp Leftovers

# One approved retirement (#2496), dormant until an explicit main dispatch.
# Flux keeps prune-protected Namespaces, HelmReleases and claims after their
# manifests leave Git; this deletes exactly those Crossview and Headlamp
# leftovers once the removal is deployed. Source CI and the merge queue never
# execute this workflow.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: retire-crossview-headlamp-2496"
        required: true
        type: string

permissions: {}
concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  retirement:
    name: 🧹 Delete the retired UIs' protected leftovers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      contents: read
    env:
      RETIREMENT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require the approved first-attempt main dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == devantler-tech/platform && "${GITHUB_EVENT_NAME}" == workflow_dispatch &&
            "${GITHUB_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 &&
            "${RETIREMENT_CONFIRM}" == retire-crossview-headlamp-2496 ]]

      - name: 📑 Checkout the reviewed dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 🔑 Restore production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "${KUBE_CONFIG}"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" >~/.kube/config
          chmod 600 ~/.kube/config

      - name: 🎯 Select stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh

      - name: Prove the removal deployed, delete the leftovers and verify none remain
        run: bash scripts/retire-crossview-headlamp.sh
