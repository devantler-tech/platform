name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Verify tools
        run: |
          echo "--- kustomize ---"
          kustomize version
          echo "--- kubectl ---"
          kubectl version --client
          echo "--- Validate kustomize builds ---"
          kustomize build k8s/clusters/local/ > /dev/null
          kustomize build k8s/clusters/prod/ > /dev/null
          echo "All kustomize builds passed"
