name: Retire Backstage Stateless Resources

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RETIRE BACKSTAGE STATELESS ONLY; database, storage and credentials remain
        required: true
        type: string
      deployed_revision:
        description: Exact latest@sha256 revision from the accepted production deployment and fresh OIDC readback
        required: true
        type: string

permissions: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false
  queue: max

jobs:
  retire:
    name: Retire only the assessed stateless portal and retain all data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTAL_RETIREMENT_CONFIRM: ${{ inputs.confirmation }}
      PORTAL_RETIREMENT_REVISION: ${{ inputs.deployed_revision }}
    steps:
      - name: Require a confirmed first main dispatch before credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$PORTAL_RETIREMENT_CONFIRM" == 'RETIRE BACKSTAGE STATELESS ONLY' ]]
          [[ "$PORTAL_RETIREMENT_REVISION" =~ ^latest@sha256:[0-9a-f]{64}$ ]]

      - name: Checkout the exact reviewed dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current main and the committed source retirement
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-prod-recovery-source.sh "$GITHUB_SHA"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require the committed source retirement
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/mikefarah/yq/v4@v4.54.1
          bash scripts/tests/test-backstage-retirement.sh

      - name: Install the checksum-verified Helm reader
        shell: bash
        env:
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://get.helm.sh/$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive"
          echo "$install_dir/linux-amd64" >> "$GITHUB_PATH"

      - name: Validate read-only boundaries and actual pinned native uninstall behavior
        shell: bash
        env:
          PORTAL_REQUIRE_NATIVE_CONTROL: '1'
        run: |
          set -euo pipefail
          PORTAL_HELM_TEST_BIN="$(command -v helm)"
          export PORTAL_HELM_TEST_BIN
          go test -race -count=1 ./scripts/assess-backstage-retirement ./scripts/retire-backstage-stateless

      - name: Restore the established protected production kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG"
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config

      - name: Select the stable production API endpoint
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: ./scripts/use-prod-stable-api-endpoint.sh >/dev/null

      # Stored release and Secret payloads stay solely in bounded Go process
      # memory. No raw response, manifest or preservation snapshot is published.
      - name: Retire the stateless footprint and verify retained data identities
        env:
          HELM_DRIVER: secret
        run: go run ./scripts/retire-backstage-stateless --execute
