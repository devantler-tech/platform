name: Publish Unsigned Probe Image

# Publish the deliberately UNSIGNED negative control that
# probe-image-signature-enforcement.yaml needs (#3336).
#
# WHY THIS EXISTS. The probe has to show that a first-party image with no valid
# signature is REFUSED when a node pulls it. No such image exists: every
# first-party repository is signed, including the unsigned example #3101 was
# filed from. So this workflow makes one, on purpose, under a name nothing else
# uses:
#
#     ghcr.io/devantler-tech/unsigned-probe-throwaway
#
# It matches the `ghcr.io/devantler-tech/*` catch-all rule in
# talos/cluster/verify-first-party-images.yaml, and none of the three specific
# rules in front of it.
#
# WHAT KEEPS IT UNSIGNED. These are not conventions — each one is checked by
# scripts/guard-unsigned-probe-image-publisher.sh on every PR and merge group:
#   * no `id-token` permission, so keyless signing cannot get the OIDC token it
#     needs, whatever a step tries;
#   * no action other than the runner hardening step, and no secret other than
#     GITHUB_TOKEN, so no signing tool or signing key can be brought in;
#   * no signing or attestation tool named in any step;
#   * `workflow_dispatch` is the only trigger;
#   * the image name is referenced by nothing except this workflow, the probe
#     workflow's header, and the guard with its test, so no manifest or
#     workload can come to depend on it;
#   * no workflow in this repository runs on a package-publish event, so
#     publishing cannot start anything else here;
#   * `packages` is the only permission granted, and the last step still reads
#     the digest's signature tags and referrers, authenticated, and cannot
#     continue past a failure;
#   * the first step refuses to run unless dispatched from refs/heads/main, so
#     a dispatch aimed at another branch or tag builds and pushes nothing. A
#     dispatch runs the workflow file of the ref it targets, so this stops any
#     ref that still carries this reviewed file, not one whose copy deletes the
#     check; restricting who can dispatch is what covers that case.
# Nothing in this repository can stop someone signing the image by hand from
# outside it. That last step checks the published digest really is unsigned,
# so that case is caught on every run rather than assumed away. The package can
# stay private: the check reads it with this job's GITHUB_TOKEN, and nodes pull
# it with their registry credential.
#
# WHY FROM SCRATCH AND NOT A RETAGGED PUBLIC IMAGE. A retagged upstream image
# brings its own signatures and attestations with it. A single-file image built
# from nothing carries nothing but what this workflow writes.
#
# EVERY RUN PUBLISHES A NEW TAG (`run-<run id>-<attempt>`). The probe refuses a
# ref already cached on the node, because a cached image is never re-pulled and
# so never re-verified. A fresh tag per run is always a fresh ref.
#
# Running this is not a production change: it touches no node and no cluster
# object, and the image is used by nothing. Old tags can be deleted from the
# package page at any time.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-unsigned-probe-image:
    name: 🧪 Publish Unsigned Probe Image
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the throwaway image to GHCR
    env:
      IMAGE: ghcr.io/devantler-tech/unsigned-probe-throwaway
      TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # First, before anything is built, logged in to or pushed: a dispatch can
      # target any branch or tag, and only main is reviewed. The guard requires
      # this to stay the first step.
      - name: 🛑 Refuse unless dispatched from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            printf '::error::this workflow publishes only from refs/heads/main, not %s. Dispatch it from main.\n' "${GITHUB_REF}"
            exit 1
          fi

      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🏗️ Build a single-file image from scratch
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          printf 'Deliberately unsigned negative control for devantler-tech/platform#3336. Never run this.\n' \
            > "${context}/probe.txt"
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > "${context}/Dockerfile"
          # No provenance or SBOM: either would add a second manifest to the
          # push, which is not what the probe is asking about.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Deliberately unsigned negative control (platform#3336)" \
            --tag "${IMAGE}:${TAG}" \
            --load \
            "${context}"

      - name: 📦 Push without signing
        id: push
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          if [[ ! "${ref}" =~ ^ghcr\.io/devantler-tech/unsigned-probe-throwaway@sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::could not read the pushed digest (got %q)\n' "${ref}"
            exit 1
          fi
          docker logout ghcr.io
          printf 'digest=%s\n' "${ref#*@}" >> "${GITHUB_OUTPUT}"

      # Read with this job's own GITHUB_TOKEN. The package does not need to be
      # public: production nodes pull private first-party images with their
      # registry credential, so the probe reads it the same way.
      #
      # Every check fails closed. A missing digest, a token that cannot read the
      # image, a signature tag, a referrer, or any registry answer that is not a
      # clear "absent" stops the run. The digest's own manifest is read first
      # with the same token: once that returns 200, a 404 for a signature tag
      # means "no signature", not "no access".
      - name: 🔎 Confirm the published digest is unsigned
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::the push step did not report a digest (got %q); nothing can be checked\n' "${DIGEST:-}"
            exit 1
          fi
          repo="${IMAGE#ghcr.io/}"

          # The credential reaches curl on stdin, never on its command line.
          if ! token="$(printf 'user = "%s:%s"\n' "${GITHUB_ACTOR}" "${GHCR_TOKEN}" \
              | curl -fsS --config - "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
              | jq -er '.token')"; then
            printf '::error::could not get a pull token for %s with GITHUB_TOKEN\n' "${repo}"
            exit 1
          fi
          printf '::add-mask::%s\n' "${token}"

          # status <path> [accept] — prints the HTTP status of a GET, "000" on a transport failure.
          status() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: ${2:-application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json}" \
              "https://ghcr.io/v2/${repo}/$1" || printf '000'
          }

          code="$(status "manifests/${DIGEST}")"
          if [[ "${code}" != '200' ]]; then
            printf '::error::%s@%s is not readable with GITHUB_TOKEN (HTTP %s), so an absent signature could not be told apart from no access\n' \
              "${IMAGE}" "${DIGEST}" "${code}"
            exit 1
          fi

          # cosign stores a signature, attestation or SBOM under a tag derived
          # from the digest. Each must be definitely absent (404).
          hex="${DIGEST#sha256:}"
          for suffix in '' '.sig' '.att' '.sbom'; do
            code="$(status "manifests/sha256-${hex}${suffix}")"
            case "${code}" in
              404) ;;
              200)
                printf '::error::%s@%s has a sha256-%s%s artifact. This image must stay unsigned; publish a new tag and delete the signed one.\n' \
                  "${IMAGE}" "${DIGEST}" "${hex}" "${suffix}"
                exit 1
                ;;
              *)
                printf '::error::could not establish whether sha256-%s%s exists (HTTP %s); refusing to report the image as unsigned\n' \
                  "${hex}" "${suffix}" "${code}"
                exit 1
                ;;
            esac
          done

          # A signature can also be attached as an OCI referrer. A registry
          # without the referrers API answers 404, and the tag checks above
          # cover that case; any other answer than 200 or 404 fails closed.
          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${repo}/referrers/${DIGEST}" || printf '000')"
          case "${code}" in
            200)
              referrers="$(jq -er '.manifests | length' "${body}")"
              if [[ "${referrers}" != '0' ]]; then
                printf '::error::%s@%s has %s OCI referrer(s) attached. This image must stay unsigned.\n' "${IMAGE}" "${DIGEST}" "${referrers}"
                exit 1
              fi
              ;;
            404) ;;
            *)
              printf '::error::could not read referrers for %s@%s (HTTP %s); refusing to report the image as unsigned\n' \
                "${IMAGE}" "${DIGEST}" "${code}"
              exit 1
              ;;
          esac

          {
            printf '### Unsigned probe image published\n\n'
            printf 'Pass either ref as the unsigned_image input of Probe Image Signature Enforcement:\n\n'
            printf -- '- %s:%s\n' "${IMAGE}" "${TAG}"
            printf -- '- %s@%s\n' "${IMAGE}" "${DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
          printf 'Published unsigned image: %s:%s (%s)\n' "${IMAGE}" "${TAG}" "${DIGEST}"
