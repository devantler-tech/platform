name: Publish Unsigned Probe Image

# Publish the deliberately UNSIGNED negative control that
# probe-image-signature-enforcement.yaml needs (#3336).
#
# WHY THIS EXISTS. The probe has to show that a first-party image with no valid
# signature is REFUSED when a node pulls it. No such image exists: every
# first-party repository is signed, including the unsigned example #3101 was
# filed from. So this workflow makes one, on purpose, under a name nothing else
# uses:
#
#     ghcr.io/devantler-tech/unsigned-probe-throwaway
#
# It matches the `ghcr.io/devantler-tech/*` catch-all rule in
# talos/cluster/verify-first-party-images.yaml, and none of the three specific
# rules in front of it.
#
# WHAT KEEPS IT UNSIGNED. These are not conventions — each one is checked by
# scripts/guard-unsigned-probe-image-publisher.sh on every PR and merge group:
#   * no `id-token` permission, so keyless signing cannot get the OIDC token it
#     needs, whatever a step tries;
#   * no action other than runner hardening and checkout, and no secret other
#     than GITHUB_TOKEN, so no signing tool or signing key can be brought in;
#   * no signing or attestation tool named in any step;
#   * `workflow_dispatch` is the only trigger;
#   * the image name is referenced by nothing except this workflow, the probe
#     workflow's header, and the guard with its test, so no manifest or
#     workload can come to depend on it;
#   * no workflow in this repository runs on a package-publish event, so
#     publishing cannot start anything else here;
#   * the only permissions granted are `packages` and `contents: read`, and the
#     last step runs scripts/verify-image-unsigned.sh on the pushed digest,
#     authenticated, as its first command, and cannot be skipped or run past;
#   * the first step refuses to run unless dispatched from refs/heads/main, so
#     a dispatch aimed at another branch or tag builds and pushes nothing. A
#     dispatch runs the workflow file of the ref it targets, so this stops any
#     ref that still carries this reviewed file, not one whose copy deletes the
#     check; restricting who can dispatch is what covers that case.
# Nothing in this repository can stop someone signing the image by hand from
# outside it. The last step checks the published digest really is unsigned, and
# the probe runs the same check again just before its node pull, so a signature
# added in between is caught rather than misread as broken enforcement. The
# package can stay private: both checks read it with a GITHUB_TOKEN, and nodes
# pull it with their registry credential.
#
# WHY FROM SCRATCH AND NOT A RETAGGED PUBLIC IMAGE. A retagged upstream image
# brings its own signatures and attestations with it. A single-file image built
# from nothing carries nothing but what this workflow writes.
#
# EVERY RUN PUBLISHES A NEW IMAGE, tagged `run-<run id>-<attempt>`. The probe
# refuses a ref already cached on the node, because a cached image is never
# re-pulled and so never re-verified. Pass the probe the DIGEST ref the summary
# prints, not the tag: a tag can be moved to another image before the probe runs.
#
# Running this is not a production change: it touches no node and no cluster
# object, and the image is used by nothing. Old tags can be deleted from the
# package page at any time.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-unsigned-probe-image:
    name: 🧪 Publish Unsigned Probe Image
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the verification script
      packages: write # push the throwaway image to GHCR
    env:
      IMAGE: ghcr.io/devantler-tech/unsigned-probe-throwaway
      TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # First, before anything is checked out, built, logged in to or pushed: a
      # dispatch can target any branch or tag, and only main is reviewed. The
      # guard requires this to stay the first step.
      - name: 🛑 Refuse unless dispatched from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            printf '::error::this workflow publishes only from refs/heads/main, not %s. Dispatch it from main.\n' "${GITHUB_REF}"
            exit 1
          fi

      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Build a single-file image from scratch
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          printf 'Deliberately unsigned negative control for devantler-tech/platform#3336. Never run this.\n' \
            > "${context}/probe.txt"
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > "${context}/Dockerfile"
          # No provenance or SBOM: either would add a second manifest to the
          # push, which is not what the probe is asking about.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Deliberately unsigned negative control (platform#3336)" \
            --tag "${IMAGE}:${TAG}" \
            --load \
            "${context}"

      - name: 📦 Push without signing
        id: push
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          if [[ ! "${ref}" =~ ^ghcr\.io/devantler-tech/unsigned-probe-throwaway@sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::could not read the pushed digest (got %q)\n' "${ref}"
            exit 1
          fi
          docker logout ghcr.io
          printf 'digest=%s\n' "${ref#*@}" >> "${GITHUB_OUTPUT}"

      # scripts/verify-image-unsigned.sh fails this job on anything short of
      # "every signature location for the digest is empty": a missing or
      # malformed digest, a credential that cannot read the image, a signature,
      # attestation or SBOM tag, a referrer, or any unexpected registry answer.
      # Its behaviour is pinned by scripts/tests/test-verify-image-unsigned.sh,
      # and the guard requires it to be this step's first command.
      - name: 🔎 Confirm the published digest is unsigned
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/verify-image-unsigned.sh --image "${IMAGE}@${DIGEST}"
          {
            printf '### Unsigned probe image published\n\n'
            printf 'Pass this digest ref as the unsigned_image input of Probe Image Signature Enforcement:\n\n'
            printf -- '- %s@%s\n' "${IMAGE}" "${DIGEST}"
            printf '\nIt was also tagged %s, but pass the digest: a tag can be moved to another image before the probe runs.\n' "${TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
          printf 'Published unsigned image: %s@%s (tag %s)\n' "${IMAGE}" "${DIGEST}" "${TAG}"
