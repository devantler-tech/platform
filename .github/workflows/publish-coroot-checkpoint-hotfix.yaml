---
name: Publish Coroot Checkpoint Hotfix

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-coroot-checkpoint-hotfix.yaml
      - k8s/bases/infrastructure/coroot/coroot-v1.28.1-checkpoint-record.patch
      - k8s/bases/infrastructure/coroot/CorootCheckpoint.Dockerfile
      - k8s/bases/infrastructure/coroot/cluster-agent-v1.11.7-checkpoint-record.patch
      - k8s/bases/infrastructure/coroot/CorootClusterAgentCheckpoint.Dockerfile
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-coroot-checkpoint-hotfix.yaml
      - k8s/bases/infrastructure/coroot/coroot-v1.28.1-checkpoint-record.patch
      - k8s/bases/infrastructure/coroot/CorootCheckpoint.Dockerfile
      - k8s/bases/infrastructure/coroot/cluster-agent-v1.11.7-checkpoint-record.patch
      - k8s/bases/infrastructure/coroot/CorootClusterAgentCheckpoint.Dockerfile
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            repository: coroot/coroot
            source: 15137ef2f43e01d0a87245e44b937b25515e0afe
            patch: coroot-v1.28.1-checkpoint-record.patch
            dockerfile: CorootCheckpoint.Dockerfile
            image: platform-coroot
            version: v1.28.1-checkpoints.4
          - component: collector
            repository: coroot/coroot-cluster-agent
            source: 4291458563fa8ea55615e23e0f11412db79742b6
            patch: cluster-agent-v1.11.7-checkpoint-record.patch
            dockerfile: CorootClusterAgentCheckpoint.Dockerfile
            image: platform-coroot-cluster-agent
            version: v1.11.7-checkpoints.1
    env:
      IMAGE: ghcr.io/devantler-tech/${{ matrix.image }}
      IMAGE_TAG: ${{ matrix.version }}-${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact upstream release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source }}
          path: upstream
          persist-credentials: false

      - name: Apply reviewed release patch
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ matrix.source }}
          HOTFIX_PATCH: ${{ github.workspace }}/k8s/bases/infrastructure/coroot/${{ matrix.patch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git diff --check

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Build without publishing tested release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./k8s/bases/infrastructure/coroot/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: VERSION=${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            io.devantler.coroot-checkpoint.upstream-revision=${{ matrix.source }}

  # The server patch changes which ClickHouse partitions Coroot's space manager drops. Unit tests
  # model system.parts; this job runs the real cleanup path (the parts query, the per-disk
  # decision and DROP PARTITION) against ClickHouse 25.11.2, the release the Coroot operator
  # ran in production when this job was added (read from the live shard Pods on 2026-11-12).
  integration:
    name: Verify server space manager against ClickHouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLICKHOUSE_IMAGE: docker.io/clickhouse/clickhouse-server:25.11.2.24@sha256:dcd74ae94f16bee4bb61a44ab0fc4ff973d5bb42180e52fc82c4fe68cfe70cf6
      CLICKHOUSE_CONTAINER: coroot-space-manager-it-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact upstream release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coroot/coroot
          ref: 15137ef2f43e01d0a87245e44b937b25515e0afe
          path: upstream
          persist-credentials: false

      - name: Apply reviewed release patch
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: 15137ef2f43e01d0a87245e44b937b25515e0afe
          HOTFIX_PATCH: ${{ github.workspace }}/k8s/bases/infrastructure/coroot/coroot-v1.28.1-checkpoint-record.patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: upstream/go.mod
          cache: false

      - name: Start a disposable ClickHouse on loopback
        run: |
          set -euo pipefail
          docker run --detach --name "${CLICKHOUSE_CONTAINER}" \
            --env CLICKHOUSE_SKIP_USER_SETUP=1 \
            --publish 127.0.0.1:9000:9000 \
            "${CLICKHOUSE_IMAGE}" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "${CLICKHOUSE_CONTAINER}" clickhouse-client --query 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${CLICKHOUSE_CONTAINER}" 2>&1 | tail -n 50 >&2
          echo 'ClickHouse did not become ready within 120 seconds.' >&2
          exit 1

      - name: Run the space manager against ClickHouse
        working-directory: upstream
        env:
          CLICKHOUSE_ADDR: 127.0.0.1:9000
        run: |
          set -euo pipefail
          go test -count=1 -tags clickhouse_integration -run '^TestSpaceManagerIntegration' -v ./clickhouse/ | tee "${RUNNER_TEMP}/space-manager-integration.log"
          # A renamed test or a drifted build tag leaves `go test -run` with nothing to run and a
          # zero exit; require the named test itself to have run and passed.
          grep -Fx -- '--- PASS: TestSpaceManagerIntegrationKeepsTheNewestPartition' \
            <(sed -E 's/ \([0-9.]+s\)$//' "${RUNNER_TEMP}/space-manager-integration.log") >/dev/null ||
            { echo 'The ClickHouse space manager integration test did not run and pass.' >&2; exit 1; }

      - name: Remove the disposable ClickHouse
        if: always()
        run: docker rm --force "${CLICKHOUSE_CONTAINER}" >/dev/null 2>&1 || true

  publish:
    name: Publish and sign ${{ matrix.component }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            repository: coroot/coroot
            source: 15137ef2f43e01d0a87245e44b937b25515e0afe
            patch: coroot-v1.28.1-checkpoint-record.patch
            dockerfile: CorootCheckpoint.Dockerfile
            image: platform-coroot
            version: v1.28.1-checkpoints.4
          - component: collector
            repository: coroot/coroot-cluster-agent
            source: 4291458563fa8ea55615e23e0f11412db79742b6
            patch: cluster-agent-v1.11.7-checkpoint-record.patch
            dockerfile: CorootClusterAgentCheckpoint.Dockerfile
            image: platform-coroot-cluster-agent
            version: v1.11.7-checkpoints.1
    env:
      IMAGE: ghcr.io/devantler-tech/${{ matrix.image }}
      IMAGE_TAG: ${{ matrix.version }}-${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact upstream release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source }}
          path: upstream
          persist-credentials: false

      - name: Apply reviewed release patch
        working-directory: upstream
        env:
          EXPECTED_SOURCE_COMMIT: ${{ matrix.source }}
          HOTFIX_PATCH: ${{ github.workspace }}/k8s/bases/infrastructure/coroot/${{ matrix.patch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          git apply --check "${HOTFIX_PATCH}"
          git apply "${HOTFIX_PATCH}"
          git diff --check

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tested release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./upstream
          file: ./k8s/bases/infrastructure/coroot/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: VERSION=${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            io.devantler.coroot-checkpoint.upstream-revision=${{ matrix.source }}

      - name: Install checksum-verified supply-chain tools
        run: bash .github/scripts/setup-supply-chain-tools.sh

      - name: Sign and verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/devantler-tech/platform/.github/workflows/publish-coroot-checkpoint-hotfix.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          printf 'Published signed image: %s@%s\n' "${IMAGE}" "${DIGEST}"
