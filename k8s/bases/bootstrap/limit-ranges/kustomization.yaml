---
# Static CPU LimitRanges that must exist BEFORE the workloads they cover are admitted.
#
# WHY THE BOOTSTRAP LAYER AND NOT `infrastructure`. A LimitRange is applied by the
# built-in LimitRanger admission plugin at POD-ADMISSION time. It does not mutate
# pods that are already running, so a LimitRange that lands after its workloads
# states something untrue of them until an unrelated event recreates them.
#
# The layer graph is strictly ordered and every edge carries `wait: true`
# (k8s/clusters/base/flux-kustomization-*.yaml):
#
#     bootstrap  ->  infrastructure-controllers  ->  infrastructure  ->  apps
#
# Both covered populations are `infrastructure-controllers` resources — kube-system's
# cilium, coredns, metrics-server, tetragon, hubble, spire-agent, the hcloud ccm/csi
# and cluster-autoscaler; and kyverno's four controllers (admission, background,
# cleanup, reports). Holding either LimitRange in the `infrastructure` layer placed
# it a layer AFTER the pods it covers, so they were admitted uncapped and stayed
# uncapped until the next rollout. That is not a race those LimitRanges sometimes
# lost: the graph guarantees they lost every time, on every fresh cluster.
#
# Placing them here closes the window STRUCTURALLY rather than by timing:
# `infrastructure-controllers` declares `dependsOn: [bootstrap]` with `wait: true`,
# so it cannot begin reconciling until this layer is Ready. The guarantee comes from
# the dependency graph, not from the order in which kustomize-controller happens to
# apply kinds inside one Kustomization — Flux publishes no such intra-Kustomization
# ordering contract, so co-locating a LimitRange with its component would have been
# an assumption rather than a guarantee (#3525).
#
# WHY EACH NAMESPACE IS REACHABLE FROM HERE. A namespaced object cannot be applied
# into a namespace that does not exist yet, and this layer runs before most of them.
# - kube-system is created by Kubernetes itself at cluster init, so it is always
#   present.
# - kyverno's namespace is declared alongside this directory, in ../namespace-kyverno.yaml, precisely
#   so this LimitRange has a namespace to bind to. See that file for why the
#   namespace was moved out of its component and what that costs.
#
# This mirrors the reasoning already applied to `../priority-classes/`, which lives
# in this layer for exactly the same "must exist before the controllers reference it"
# reason.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-system.yaml
  - kyverno.yaml
