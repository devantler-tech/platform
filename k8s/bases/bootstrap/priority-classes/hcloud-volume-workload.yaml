# Storage scheduling tier for hcloud consumers and database instances.
#
# An hcloud consumer can only run on a static baseline worker, because its volume
# attaches to exactly one node and require-baseline-workers-for-hcloud-volumes
# pins its consumers there. Stateless pods are only nudged toward those same
# workers (prefer-baseline-nodes), so they can fill them. At equal priority the
# scheduler cannot make room, and the autoscaler cannot help because its nodes
# are not baseline workers: a volume-bound pod restarted into a full baseline
# stays Pending (platform#4031).
#
# One step above normal workloads (priority 0) lets the scheduler preempt a
# stateless pod from a baseline worker. The preempted pod reschedules wherever
# it fits, scaling an autoscaler node up if needed. Kept far below
# platform-critical and the system-* classes, so it never outranks platform
# infrastructure. Assigned by the prioritise-hcloud-volume-pods policy.
# CloudNativePG instances also share this tier through prioritise-database-pods:
# preemption must not displace a database in place of a stateless workload.
# The existing class name is retained so its deployed consumers do not change.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hcloud-volume-workload
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  hcloud volume consumers and database instances. Ranked just above normal
  workloads so stateless pods can make room without preempting a database,
  and far below platform-critical and the system-* classes.
