---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Namespace prune-protection (#3367): this base ships a HelmRelease whose chart may provision claims,
  # so its namespace must survive a speculative merge-group deploy that removes
  # it -- deleting a namespace cascades to its PVCs regardless of their own
  # annotation. Opt-in rather than blanket, so a STATELESS tenant's directory
  # removal still cascades and cleans itself up.
  - ../../components/namespace-prune-protection
resources:
  - namespace.yaml
  - external-secret.yaml
  - helm-release.yaml
  - helm-repository.yaml
  - cluster-role-binding.yaml
  - http-route.yaml
  - cilium-network-policy.yaml
