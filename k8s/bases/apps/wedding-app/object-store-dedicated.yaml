# The only Wedding archive. The tenant source selects this ObjectStore;
# the platform overlay preserves the mirrored database server identity.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wedding-db-dedicated
  namespace: wedding-app
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://wedding-db-backups/cnpg/wedding-db
    endpointURL: ${r2_endpoint}
    s3Credentials:
      accessKeyId:
        name: wedding-db-backup-r2-dedicated
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: wedding-db-backup-r2-dedicated
        key: SECRET_ACCESS_KEY
      region:
        name: wedding-db-backup-r2-dedicated
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
