---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The backup ExternalSecret stays platform-side: it projects the Wedding
  # backup credential from OpenBao via the ClusterSecretStore
  # (flux-system-applied), which a tenant SecretStore cannot reach. The tenant's
  # own CiliumNetworkPolicy (networkpolicy.yaml) and namespaced SecretStore live
  # in the tenant repo's deploy/.
  #
  # Wedding archives only through its dedicated identity and destination. The
  # shared platform backup credential is deliberately NOT projected into this
  # namespace: it can read every other consumer's backups. Shared access was
  # retired after a dedicated-only restore and an observed access denial (#3253).
  - external-secret-db-backup-dedicated.yaml
  - object-store-dedicated.yaml
  - external-secret-ghcr-auth.yaml
  - namespace.yaml
  - network-policy.yaml
  - role-binding.yaml
  - service-account.yaml
  - oci-repository.yaml
  - flux-kustomization.yaml
