---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Namespace prune-protection (#3367): this base holds a three-PVC CNPG `Cluster` (wedding-db) delivered by the TENANT's own artifact -- invisible to this repo's render,
  # so its namespace must survive a speculative merge-group deploy that removes
  # it -- deleting a namespace cascades to its PVCs regardless of their own
  # annotation. Opt-in rather than blanket, so a STATELESS tenant's directory
  # removal still cascades and cleans itself up.
  - ../../components/namespace-prune-protection
resources:
  # db-backup-external-secret stays platform-side: it projects the SHARED R2
  # backup credential from the infra OpenBao path via the ClusterSecretStore
  # (flux-system-applied), which a tenant SecretStore cannot reach. The tenant's
  # own CiliumNetworkPolicy (networkpolicy.yaml) and namespaced SecretStore now
  # live in the tenant repo's deploy/.
  - external-secret-db-backup.yaml
  - object-store.yaml
  - external-secret-ghcr-auth.yaml
  - namespace.yaml
  - network-policy.yaml
  - role-binding.yaml
  - service-account.yaml
  - oci-repository.yaml
  - flux-kustomization.yaml
