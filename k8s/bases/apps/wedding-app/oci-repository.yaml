---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: ksail
    platform.devantler.tech/tenant-source: "true"
  name: wedding-app
  namespace: wedding-app
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  url: oci://ghcr.io/devantler-tech/wedding-app/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # The subject is written from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. It accepts only the approved
      # publish-app.yaml revisions: the deployed artifact signer, this consumer's
      # current pin, and the latest actions release candidate.
      # It also accepts this consumer's own repository's release workflow on a
      # release tag (#6265), the signer once it moves off the shared publisher.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/(actions/\.github/workflows/publish-app\.yaml@ea4df9004d4ab43b6c9af5b0c5f55712f7211328|\.github/\.github/workflows/publish-app\.yaml@af042c540ce8db4d64add98c34b5c57691e0e812|wedding-app/\.github/workflows/[^/]+\.ya?ml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?)$'
