---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: ksail
  name: wedding-app
  namespace: wedding-app
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  url: oci://ghcr.io/devantler-tech/wedding-app/manifests
  secretRef:
    name: ghcr-auth
  verify:
    provider: cosign
    matchOIDCIdentity:
      # The subject is written from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. It accepts only the approved
      # publish-app.yaml revisions: the deployed artifact signer, this consumer's
      # current pin, and the latest actions release candidate.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@(3c3a6348b3e7aacc995ae49fc60032f95f70a779|be13607c908d9df5e392a8acd5d13fcf358202df)$'
