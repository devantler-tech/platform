# Project the bucket-scoped Wedding backup identity, the only backup credential
# in this namespace. It is independent of the shared platform backup credential,
# and the shared destination refuses it (#3253).
#
# This is a PLATFORM-side resource: reconciled by flux-system (the registration
# dir), never by the tenant ServiceAccount, so it may use the cluster-scoped
# openbao ClusterSecretStore. The restrict-tenant-secret-stores Kyverno policy
# carves out flux-system-applied ExternalSecrets while still blocking a tenant
# from pointing its OWN ExternalSecret at the ClusterSecretStore.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wedding-db-backup-r2-dedicated
  namespace: wedding-app
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wedding-db-backup-r2-dedicated
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
        REGION: "auto"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: apps/wedding-app/backup/r2
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: apps/wedding-app/backup/r2
        property: secret_access_key
