# Retained shared archive for Wedding recovery and rollback. The live database
# archives through wedding-db-dedicated. Keep this store and its credential
# available until a dedicated-only restore has proved the recovery boundary.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wedding-db
  namespace: wedding-app
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://${r2_bucket}/cnpg/wedding-db
    endpointURL: ${r2_endpoint}
    s3Credentials:
      accessKeyId:
        name: wedding-db-backup-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: wedding-db-backup-r2
        key: SECRET_ACCESS_KEY
      region:
        name: wedding-db-backup-r2
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
