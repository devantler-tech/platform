# OpenBao Database secrets engine: the blue login colour (`umami_blue`) of the
# blue/green Umami credential pair (#4107). Read by
# external-secret-db-blue.yaml (CNPG enforcement) and
# external-secret-db-rotated.yaml (the app's credential). Same auth role and
# endpoint as vault-dynamic-secret.yaml.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: umami-db-blue-static-cred
  namespace: umami
spec:
  path: "database/static-creds/umami-blue"
  method: GET
  provider:
    # openbao-active = unsealed Raft leader only; the plain `openbao` Service
    # also round-robins onto sealed-but-Ready standbys (503 "Vault is sealed").
    server: "http://openbao-active.openbao.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "umami-db-rotated"
        serviceAccountRef:
          name: "external-secrets"
