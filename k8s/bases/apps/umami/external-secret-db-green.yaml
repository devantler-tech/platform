# The `umami_green` login colour's OpenBao-rotated password (#4107). Phase 2
# declares it as that CNPG managed role's passwordSecret (cluster.yaml) so CNPG
# enforces the value OpenBao serves — the same enforcement the `umami` role has
# (see external-secret-db-rotated.yaml for why). It is synced from phase 1 so
# the Secret already exists when phase 2 references it. Only CNPG will read it;
# the app reads the active colour from umami-db-rotated. Only `username` and
# `password` are projected, so the Secret changes only on a real rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-db-green
  namespace: umami
spec:
  refreshInterval: 1m
  target:
    name: umami-db-green
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Make the CNPG operator react promptly when ESO syncs a rotated
          # password, instead of waiting for the next periodic reconcile.
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: umami-db-green-static-cred
