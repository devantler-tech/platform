# Declaratively provisions Umami "tenants" — one team per tenant — so teams,
# their websites, and (optionally) a shared customer login are managed in Git
# rather than created by hand in the Umami UI. Also rotates Umami's default
# admin password to the OpenBao-managed value.
#
# Model (TENANTS env): each entry is one team owning a set of websites, plus
# optional members (extra logins added to that team). Personal sites live on
# the `devantler-tech` team; each customer gets its own team + a read-only
# login so they can check only their own analytics.
#
# Idempotent and safe to re-run:
#   - admin password is rotated only when the managed value isn't already active;
#   - teams are matched by name (Umami does NOT enforce unique team names, so we
#     list-and-match rather than blindly create);
#   - websites are created under their team by id, or transferred into it if they
#     already exist as personal sites (GET by id first);
#   - member users are created only if missing (username is unique) and added to
#     their team only if not already a member. The OpenBao-backed member password
#     is a ONE-TIME BOOTSTRAP: the customer changes it on first login (Umami has no
#     SSO, so this is their real credential) and owns it thereafter — this Job
#     NEVER resets an existing user's password. Rotation is therefore the
#     customer's own (self-service) plus exception-only admin action on suspected
#     compromise / offboarding — NOT a schedule, so there is no credential to relay
#     on a cadence. Offboard by removing the member here (re-provisioning stops)
#     and deleting the user in the Umami admin UI.
#
# Why a CronJob (not a one-shot Job): provisioning targets an EXTERNAL system —
# the Umami HTTP API — that may be temporarily unavailable (Umami rolling, or
# crashlooping after a DB password rotation/failover). A one-shot Job fires once:
# if Umami is down in that window the run fails, and because the Job self-deletes
# (TTL) and only re-runs on a spec change, provisioning is silently never retried
# — which is exactly how Umami ended up with no teams/sites and the admin password
# left at its default. Running on a schedule makes this a self-healing reconcile
# loop: each tick re-asserts the desired tenants, converging within one interval
# once Umami is reachable, and picking up TENANTS edits automatically. The script
# is fully idempotent, so a steady-state tick is a fast no-op. `concurrencyPolicy:
# Forbid` prevents overlap, and `failedJobsHistoryLimit` keeps recent failures
# visible for debugging (the old TTL'd Job hid them). First provisioning lands
# within one interval of deploy; to apply immediately run
# `kubectl create job -n umami --from=cronjob/umami-provision-tenants umami-provision-now`.
#
# Reuses the Umami image (Node runtime, built-in fetch) so no extra image or
# curl/jq dependency is needed; pinned by digest per platform convention.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: umami-provision-tenants
  namespace: umami
  annotations:
    # UID 1001 is the umami image's own baked user, not a number picked here:
    # the image config sets `User: "nextjs"`, and that image's /etc/passwd
    # reads `nextjs:x:1001:65533`. The container reuses the umami image for its
    # Node runtime and runs out of its /app WORKDIR, so the UID that owns that
    # tree is the one to run as. Raising it above 10000 would break the match
    # the image asks for, and this workload is only deployed to the Hetzner
    # provider, so nothing in CI would catch it going wrong.
    checkov.io/skip1: CKV_K8S_40=UID 1001 is the umami image's baked `nextjs` user, which owns its /app WORKDIR
spec:
  schedule: "*/15 * * * *"
  # Never run two reconciles at once; a slow run (e.g. waiting on a down Umami)
  # simply skips the next tick and resumes on the one after.
  concurrencyPolicy: Forbid
  # Bounded look-back (< the 15m interval) so the controller never tries to
  # back-fill a long backlog of missed runs after an outage / apps-layer block.
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The */15 schedule IS the retry loop, so each run is a single attempt
      # (backoffLimit 0 + restartPolicy Never below): a failed run surfaces the
      # script's real error and the next tick retries it, instead of burning
      # in-Job retries against the deadline.
      backoffLimit: 0
      # Backstop for a hung run only. It sits comfortably above the script's
      # ~5m wait-for-Umami loop, so a normal "Umami unreachable" failure exits
      # with its real error well before this — never masquerading as
      # DeadlineExceeded.
      activeDeadlineSeconds: 420
      template:
        metadata:
          labels:
            app: umami-provision-tenants
        spec:
          # One attempt per scheduled run (paired with backoffLimit 0); the
          # CronJob schedule provides retries. A failed Job's pod is retained
          # (up to failedJobsHistoryLimit) for log inspection.
          restartPolicy: Never
          # Named explicitly so this field stays inside kustomize-controller's
          # server-side-apply fieldset. SSA prunes only fields a manager owns, so
          # an unowned `serviceAccountName` on the live CronJob is unreachable by
          # reconciliation and pins every Job to whatever subject it names — if
          # that account does not exist the controller cannot create the pod at
          # all, and the run fails on `DeadlineExceeded` rather than on anything
          # the script did. Declaring it keeps the value reconcilable.
          serviceAccountName: umami-provision-tenants
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: provision
              image: ghcr.io/umami-software/umami:3.1.0@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                # Restated at container level even though the pod securityContext
                # above already sets it: `validate-pod-security` autogenerates a
                # CronJob rule that reads this container path, while
                # `add-security-context` has no autogen rules, so a CronJob
                # template is validated but never mutated. Without this field the
                # manifest is admitted only while the live object is equally
                # non-compliant (the validate rules set
                # `allowExistingViolations: true`) — so the moment anything makes
                # the live CronJob compliant, this manifest stops being
                # appliable and wedges the apps Kustomization.
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # The script is `node -e` over HTTP only — it uses no filesystem API
              # at all — so /tmp is the sole writable path it could need, and the
              # Node runtime gets it from an emptyDir rather than a writable root.
              # The umami Deployment already runs this same image read-only with
              # exactly this mount; it additionally mounts /app/.next/cache, which
              # is the Next.js server's build cache and has no meaning here.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                # Both credentials arrive as files rather than environment
                # variables: an environment variable is readable by anything that
                # can read the process environment and is routinely copied into
                # crash dumps, child processes and diagnostic output, while a
                # mounted file is not. Each Secret gets its own directory named
                # after it, so the path itself says which Secret a value came
                # from.
                - name: umami-admin
                  mountPath: /secrets/umami-admin
                  readOnly: true
                - name: umami-ascoachingogvaner
                  mountPath: /secrets/umami-ascoachingogvaner
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  # CPU limit for kubescape C-0270; generous so the provisioning
                  # job never throttles.
                  cpu: 250m
                  memory: 128Mi
              env:
                - name: UMAMI_BASE
                  value: http://umami-umami.umami.svc.cluster.local
                # Declarative source of truth: one team per tenant, its websites, and
                # any extra member logins. The website UUIDs are the values hard-pinned
                # in each site's tracking script — adding a site = add an entry here +
                # reference the same id in that site's script. Adding a customer =
                # add a team with its website(s) + a member (and wire that member's
                # password via a new OpenBao generator/PushSecret/ExternalSecret).
                - name: TENANTS
                  value: |
                    [
                      {
                        "team": "devantler-tech",
                        "websites": [
                          { "id": "2f8d150e-c6f0-4a90-ab77-431c9ef9dc59", "name": "devantler.tech", "domain": "devantler.tech" },
                          { "id": "27f83d6b-8ce4-4239-9387-eabc7f57cd68", "name": "KSail Docs", "domain": "ksail.devantler.tech" },
                          { "id": "814417b8-13cd-427f-93b0-4aba673c511c", "name": "Wedding", "domain": "wedding.platform.devantler.tech" }
                        ]
                      },
                      {
                        "team": "ascoachingogvaner",
                        "websites": [
                          { "id": "5e76b00b-67e5-4aef-b4df-17fca43e9a33", "name": "AS - Coaching, vaner og ro", "domain": "ascoachingogvaner.dk" }
                        ],
                        "members": [
                          { "username": "ascoachingogvaner", "passwordFile": "umami-ascoachingogvaner/password", "accountRole": "view-only", "teamRole": "team-view-only" }
                        ]
                      }
                    ]
              command:
                - node
                - -e
                - |
                  const fs = require('fs');
                  const base = process.env.UMAMI_BASE;
                  // Credentials are mounted files (see volumeMounts). A path is
                  // resolved under SECRETS_DIR and may not escape it, so a
                  // TENANTS entry can only ever name a mounted credential.
                  // Returns null when the file is absent, which is the readable
                  // form of an `optional: true` Secret that has been removed.
                  const SECRETS_DIR = '/secrets';
                  const readSecretFile = (rel) => {
                    if (!rel || rel.startsWith('/') || rel.split('/').includes('..')) throw new Error('invalid secret file path: ' + rel);
                    try { return fs.readFileSync(SECRETS_DIR + '/' + rel, 'utf8'); }
                    catch (e) { if (e.code === 'ENOENT') return null; throw e; }
                  };
                  const newPw = readSecretFile('umami-admin/password');
                  if (!newPw) throw new Error('admin password file ' + SECRETS_DIR + '/umami-admin/password is missing or empty; the umami-admin Secret is required');
                  const tenants = JSON.parse(process.env.TENANTS);
                  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
                  const H = (t) => ({ 'content-type': 'application/json', ...(t ? { authorization: 'Bearer ' + t } : {}) });
                  const asArray = (j) => Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : []);
                  // A short-lived pod can race endpoint readiness or transient CNI
                  // convergence, so a one-shot fetch can intermittently throw
                  // `TypeError: fetch failed`. The ensureAuth loop below already
                  // absorbs that for login, but
                  // ensureTeam/ensureWebsite/ensureMember called fetch exactly once
                  // each -- a transient network error failed the whole run (observed:
                  // `fetch failed at async ensureTeam`). Retry thrown fetch errors;
                  // an HTTP error RESPONSE is returned untouched so every
                  // caller's existing !r.ok / status handling is preserved.
                  const fetchRetry = async (u, o) => {
                    for (let i = 0; ; i++) {
                      try { return await globalThis.fetch(u, o); }
                      catch (e) { if (i >= 4) throw e; await sleep(500 * (i + 1)); }
                    }
                  };
                  // Why each login attempt failed, for the retry-loop log line and the
                  // final error. Distinguishing rejected credentials (401) from a broken
                  // backend (500, e.g. Umami's DB password drifted -> Prisma P1000) from
                  // network unreachability matters: during the 2026-06-09 incident every
                  // run reported only 'could not authenticate after retries' while the
                  // real failure was the app 500ing on a stale DB password.
                  let lastLoginFailure = 'no attempt yet';
                  async function login(pw) {
                    try {
                      const r = await fetchRetry(base + '/api/auth/login', { method: 'POST', headers: H(), body: JSON.stringify({ username: 'admin', password: pw }) });
                      if (r.ok) return (await r.json()).token;
                      lastLoginFailure = r.status === 401
                        ? 'HTTP 401 (credentials rejected)'
                        : 'HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120);
                      return null;
                    } catch (e) { lastLoginFailure = 'network: ' + String((e && e.cause) || e).slice(0, 120); return null; }
                  }
                  async function ensureAuth() {
                    let token = await login(newPw);
                    if (token) return token;
                    const def = await login('umami');
                    if (!def) return null; // not ready yet
                    const r = await fetchRetry(base + '/api/me/password', { method: 'POST', headers: H(def), body: JSON.stringify({ currentPassword: 'umami', newPassword: newPw }) });
                    if (!r.ok) throw new Error('admin password rotation failed: ' + r.status + ' ' + (await r.text()));
                    console.log('rotated default admin password to the managed value');
                    return await login(newPw);
                  }
                  // Umami does not enforce unique team names, so match by name then create.
                  async function ensureTeam(token, name) {
                    const r = await fetchRetry(base + '/api/teams?pageSize=200', { headers: H(token) });
                    if (!r.ok) throw new Error('list teams failed: ' + r.status + ' ' + (await r.text()));
                    const existing = asArray(await r.json()).find((t) => t.name === name);
                    if (existing) return existing.id;
                    const c = await fetchRetry(base + '/api/teams', { method: 'POST', headers: H(token), body: JSON.stringify({ name }) });
                    if (!c.ok) throw new Error('create team ' + name + ' failed: ' + c.status + ' ' + (await c.text()));
                    console.log('team created:', name);
                    return (await c.json()).id;
                  }
                  async function ensureWebsite(token, s, teamId) {
                    const g = await fetchRetry(base + '/api/websites/' + s.id, { headers: H(token) });
                    // Umami returns 200 with a `null` body (NOT a 404) for a website id
                    // that doesn't exist yet, so a 2xx alone doesn't mean it's present —
                    // only treat it as existing when the body is a real website object,
                    // otherwise fall through to create. (Dereferencing the null body here
                    // is what crashed every run, leaving Umami with no websites.)
                    const w = g.ok ? await g.json() : null;
                    if (w && w.id) {
                      // Move a pre-existing personal site into its team.
                      if (w.teamId !== teamId) {
                        const t = await fetchRetry(base + '/api/websites/' + s.id + '/transfer', { method: 'POST', headers: H(token), body: JSON.stringify({ teamId }) });
                        if (!t.ok) throw new Error('transfer website ' + s.domain + ' failed: ' + t.status + ' ' + (await t.text()));
                        console.log('website moved to team:', s.domain);
                      }
                      // Reconcile name/domain so TENANTS stays the source of truth for an
                      // existing site too (Umami updates via POST to the website id) — e.g. a
                      // domain migration applies on the next tick instead of a hand-edit in
                      // the Umami UI. Guarded so a steady-state tick stays a no-op.
                      if (w.name !== s.name || w.domain !== s.domain) {
                        const u = await fetchRetry(base + '/api/websites/' + s.id, { method: 'POST', headers: H(token), body: JSON.stringify({ name: s.name, domain: s.domain }) });
                        if (!u.ok) throw new Error('update website ' + s.domain + ' failed: ' + u.status + ' ' + (await u.text()));
                        console.log('website updated:', s.domain);
                      } else {
                        console.log('website ok:', s.domain);
                      }
                      return;
                    }
                    const c = await fetchRetry(base + '/api/websites', { method: 'POST', headers: H(token), body: JSON.stringify({ id: s.id, name: s.name, domain: s.domain, teamId }) });
                    if (!c.ok) throw new Error('create website ' + s.domain + ' failed: ' + c.status + ' ' + (await c.text()));
                    console.log('website created:', s.domain);
                  }
                  async function findUserId(token, username) {
                    // List users via the admin endpoint: in Umami 3.x `/api/users`
                    // only handles POST (create); GET lives at `/api/admin/users`
                    // (paged + `search`, admin-gated). Hitting `/api/users` here
                    // returned 405 and aborted every member-provisioning run.
                    const r = await fetchRetry(base + '/api/admin/users?pageSize=200&search=' + encodeURIComponent(username), { headers: H(token) });
                    if (!r.ok) throw new Error('list users failed: ' + r.status + ' ' + (await r.text()));
                    const u = asArray(await r.json()).find((u) => u.username === username);
                    return u ? u.id : null;
                  }
                  async function ensureMember(token, teamId, m) {
                    // Resolve the member, creating it only if missing. The bootstrap
                    // password is read ONLY on the create path — once the user exists
                    // (and owns its own password after first login), m.passwordFile is
                    // never touched, so the bootstrap Secret can be removed after
                    // onboarding without breaking re-runs.
                    let userId = await findUserId(token, m.username);
                    if (userId) {
                      console.log('user exists:', m.username);
                    } else {
                      const password = readSecretFile(m.passwordFile);
                      if (!password) throw new Error('cannot create member ' + m.username + ': bootstrap password file ' + SECRETS_DIR + '/' + m.passwordFile + ' is missing or empty');
                      const c = await fetchRetry(base + '/api/users', { method: 'POST', headers: H(token), body: JSON.stringify({ username: m.username, password, role: m.accountRole || 'user' }) });
                      if (c.ok) {
                        userId = (await c.json()).id;
                        console.log('user created:', m.username);
                      } else {
                        const body = await c.text();
                        // Created by a racing run between our lookup and this POST: re-resolve.
                        if (c.status === 400 && /exist/i.test(body)) {
                          userId = await findUserId(token, m.username);
                          if (!userId) throw new Error('user ' + m.username + ' exists but id not resolvable');
                          console.log('user exists:', m.username);
                        } else {
                          throw new Error('create user ' + m.username + ' failed: ' + c.status + ' ' + body);
                        }
                      }
                    }
                    const role = m.teamRole || 'team-view-only';
                    const a = await fetchRetry(base + '/api/teams/' + teamId + '/users', { method: 'POST', headers: H(token), body: JSON.stringify({ userId, role }) });
                    if (a.ok) { console.log('member added:', m.username, '->', role); return; }
                    const ab = await a.text();
                    if (a.status === 400 && /member/i.test(ab)) { console.log('member ok:', m.username); return; }
                    throw new Error('add member ' + m.username + ' failed: ' + a.status + ' ' + ab);
                  }
                  (async () => {
                    let token = null;
                    for (let i = 0; i < 60 && !token; i++) {
                      token = await ensureAuth();
                      if (!token) { console.log('waiting for umami to be ready... (last login failure: ' + lastLoginFailure + ')'); await sleep(5000); }
                    }
                    if (!token) throw new Error('could not authenticate to umami after retries; last login failure: ' + lastLoginFailure);
                    for (const t of tenants) {
                      const teamId = await ensureTeam(token, t.team);
                      for (const s of (t.websites || [])) await ensureWebsite(token, s, teamId);
                      for (const m of (t.members || [])) await ensureMember(token, teamId, m);
                    }
                    console.log('umami tenant provisioning complete');
                  })().catch((e) => { console.error(String((e && e.stack) || e)); process.exit(1); });
          volumes:
            # Writable scratch for the Node runtime, so the container's own root
            # filesystem can stay immutable (readOnlyRootFilesystem above).
            # sizeLimit matches the umami Deployment's own /tmp (helm-release.yaml):
            # an unbounded emptyDir draws on the node's ephemeral storage, and this
            # pod holds no eviction-limiting ephemeral-storage request of its own.
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            # 288 is 0440: readable by root and by the pod's fsGroup (1001, set
            # above), rather than by anything else that lands in this pod. It
            # must carry the GROUP bit: kubelet owns secret-volume files
            # root:fsGroup, never uid:fsGroup, so an owner-only 0400 is
            # unreadable by the container's own non-root user.
            #
            # Written in DECIMAL deliberately. An unquoted `0440` is read as
            # octal 288 by Kubernetes' own parser (sigs.k8s.io/yaml, which is
            # YAML 1.1) and as decimal 440 — mode 0670 — by every YAML 1.2
            # reader, yq and kyaml included. The two disagree silently and
            # nothing validates the difference, so the literal that means the
            # same thing to both is the only safe one. Same convention as
            # cron-job-cnpg-degraded-alert.yaml and the coredns Deployment.
            - name: umami-admin
              secret:
                secretName: umami-admin
                defaultMode: 288
            # One-time BOOTSTRAP password for the AS - Coaching, vaner og ro
            # customer's read-only login, OpenBao-generated
            # (apps/umami/ascoachingogvaner) and referenced by the member's
            # `passwordFile` in TENANTS above. Read solely when first creating
            # the user; the customer changes it on first login and owns it
            # thereafter, so this value then sits inert (never re-applied).
            # optional so the Job still starts (and re-runs cleanly) if the
            # bootstrap Secret is removed once the customer owns their password —
            # the mount is then simply empty and readSecretFile returns null.
            - name: umami-ascoachingogvaner
              secret:
                secretName: umami-ascoachingogvaner
                optional: true
                defaultMode: 288
