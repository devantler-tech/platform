---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-dashboard
  namespace: umami
  annotations:
    # This is the browser-facing route, so it owns the Homepage tile. The
    # Flagger-owned collector route keeps its duplicate annotation disabled.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Umami
    gethomepage.dev/description: Privacy-first web analytics.
    gethomepage.dev/group: Analytics
    gethomepage.dev/icon: si-umami
    gethomepage.dev/href: https://analytics.${domain}
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=umami
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - analytics.${domain}
  rules:
    # The separate Flagger-owned HTTPRoute has longer path-prefix matches for
    # /script.js and /api/send, so collection stays public. Every other path,
    # including Umami's UI and login API, takes this SSO-protected catch-all.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
