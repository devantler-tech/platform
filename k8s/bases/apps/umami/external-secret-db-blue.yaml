# The `umami_blue` login colour's OpenBao-rotated password (#4107), declared
# as that CNPG managed role's passwordSecret (cluster.yaml) so CNPG enforces the
# value OpenBao serves — the same enforcement the `umami` role has (see
# external-secret-db-rotated.yaml for why). Only CNPG reads this Secret; the app
# reads the active colour from umami-db-active. Only `username` and
# `password` are projected, so the Secret changes only on a real rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-db-blue
  namespace: umami
spec:
  refreshInterval: 1m
  target:
    name: umami-db-blue
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Make the CNPG operator react promptly when ESO syncs a rotated
          # password, instead of waiting for the next periodic reconcile.
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: umami-db-blue-static-cred
