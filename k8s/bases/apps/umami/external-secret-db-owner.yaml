# The `umami` owner role's OpenBao-rotated password, declared as that CNPG
# managed role's passwordSecret (cluster.yaml). Until #4107 this was the app's
# own credential (umami-db-rotated); the app now logs in as a blue/green colour,
# and this Secret only keeps CNPG enforcing the owner role's password until the
# owner is retired to NOLOGIN.
#
# The generator returns {username, password, ttl, last_vault_rotation,
# rotation_period}; `ttl` decrements every refresh and would rewrite the Secret
# on every reconcile. Project ONLY `username` and `password`.
#
# Typed kubernetes.io/basic-auth because CNPG requires it of a passwordSecret.
# That wiring makes CNPG an ENFORCER of the OpenBao-rotated value inside
# PostgreSQL: CNPG's role synchronizer re-applies the role's password on (at
# least) every primary promotion — observed 2026-06-09 even with NO
# passwordSecret declared, when a promotion reset the `umami` role to the stale
# bootstrap password and broke the app for ~13h (28P01 / Prisma P1000). With
# CNPG applying THIS Secret, every re-application converges PostgreSQL to the
# value OpenBao serves.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-db-owner
  namespace: umami
spec:
  refreshInterval: 1m
  target:
    name: umami-db-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Make the CNPG operator react promptly when ESO syncs a rotated
          # password, instead of waiting for the next periodic reconcile.
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: umami-db-static-cred
