# The Umami app's database credential: the ACTIVE colour of the blue/green
# login pair (#4107). Rotating an OpenBao static role revokes its old password
# immediately, so with a single login every weekly rotation left the old pods
# answering 500 (28P01 / Prisma P1000) for ~80s until Reloader replaced them.
#
# Now there are two logins, `umami_blue` and `umami_green`. The active colour is
# whichever OpenBao rotated MOST RECENTLY (`last_vault_rotation`), and the
# weekly umami-db-rotation CronJob (openbao namespace) only ever rotates the
# OLDER, idle colour. A rotation therefore makes the idle colour active: this
# Secret switches to it, Reloader rolls the pods onto it, and pods still running
# on the previous colour keep a valid password for another week. No stored
# pointer is needed — the rotation time is the pointer, so a backstop rotation
# OpenBao fires on its own (rotation_period) flips the colour the same way.
#
# Both generators are read on every refresh and their keys prefixed `blue_` /
# `green_`; only `username` and `password` of the chosen colour are projected,
# so the Secret changes only when the active colour changes. On a tie (never in
# practice — the CronJob rotates one colour at a time) blue wins.
#
# This is a NEW Secret rather than a rewrite of umami-db-rotated, because the
# serving Flagger primary keeps the OLD pod spec (fixed username `umami`, password
# from umami-db-rotated, Reloader-annotated for that Secret) until the canary
# promotes. Rewriting umami-db-rotated to a colour's password would make Reloader
# restart that old-spec primary into `umami` + the colour's password (28P01).
# umami-db-rotated stays the `umami` owner credential, so the cut-over never
# changes a Secret the running primary depends on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-db-active
  namespace: umami
spec:
  refreshInterval: 1m
  target:
    name: umami-db-active
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      # Opt this Secret out of Flagger's config-tracking. Umami runs under a
      # Flagger Gateway API canary (canary.yaml); by default Flagger snapshots
      # every Secret/ConfigMap the workload references into a `<name>-primary`
      # copy that the PRIMARY (prod-serving) Deployment uses, refreshed ONLY on a
      # successful canary promotion. That breaks for an EXTERNALLY-ROTATED secret:
      # the live Secret updates but the `umami-db-active-primary` snapshot stays
      # frozen, so the primary keeps the old colour until that colour is rotated
      # a week later and then CrashLoopBackOffs on `28P01` — and if the canary
      # cannot promote the snapshot never refreshes. Disabling tracking makes the
      # primary reference the live `umami-db-active` Secret directly.
      metadata:
        annotations:
          flagger.app/config-tracking: "disabled"
      data:
        # `username` feeds DATABASE_URL through the DATABASE_USERNAME env var
        # (helm-release.yaml), so the app follows the colour switch.
        username: '{{ if gt (toDate "2006-01-02T15:04:05Z07:00" .green_last_vault_rotation).Unix (toDate "2006-01-02T15:04:05Z07:00" .blue_last_vault_rotation).Unix }}{{ .green_username }}{{ else }}{{ .blue_username }}{{ end }}'
        password: '{{ if gt (toDate "2006-01-02T15:04:05Z07:00" .green_last_vault_rotation).Unix (toDate "2006-01-02T15:04:05Z07:00" .blue_last_vault_rotation).Unix }}{{ .green_password }}{{ else }}{{ .blue_password }}{{ end }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: umami-db-blue-static-cred
      rewrite:
        - regexp:
            source: "(.*)"
            target: "blue_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: umami-db-green-static-cred
      rewrite:
        - regexp:
            source: "(.*)"
            target: "green_$1"
