---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Namespace prune-protection (#3367): this base holds live PVCs and a CNPG `Cluster` (umami-db),
  # so its namespace must survive a speculative merge-group deploy that removes
  # it -- deleting a namespace cascades to its PVCs regardless of their own
  # annotation. Opt-in rather than blanket, so a STATELESS tenant's directory
  # removal still cascades and cleans itself up.
  - ../../components/namespace-prune-protection
resources:
  # Namespace ownership lives in infrastructure-controllers/kyverno so the
  # namespaced background-controller grant exists before its ClusterPolicy.
  - service-account.yaml
  - service-account-provision-tenants.yaml
  - external-secret.yaml
  - external-secret-admin.yaml
  - external-secret-ascoachingogvaner.yaml
  - cluster.yaml
  - push-secret.yaml
  - vault-dynamic-secret.yaml
  - external-secret-db-rotated.yaml
  - external-secret-db-backup.yaml
  - object-store.yaml
  - scheduled-backup.yaml
  - helm-repository.yaml
  - helm-release.yaml
  # http-route.yaml removed — Flagger generates and owns Umami's HTTPRoute from
  # canary.yaml (Gateway API weighted canary).
  - canary.yaml
  - scaled-object.yaml
  - cilium-network-policy.yaml
  - pod-disruption-budget.yaml
  - role-provision-tenants.yaml
  - role-binding-provision-tenants.yaml
  - lease-provision-tenants.yaml
  - job.yaml
  - cron-job.yaml
replacements:
  - source:
      kind: CronJob
      name: umami-provision-tenants
      fieldPath: spec.jobTemplate.spec.template
    targets:
      - select:
          kind: Job
          name: umami-provision-tenants-bootstrap
        fieldPaths:
          - spec.template
