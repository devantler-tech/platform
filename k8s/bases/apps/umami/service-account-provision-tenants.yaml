# ServiceAccount for the tenant-provisioning CronJob and its bootstrap Job. It is
# declared — and named in the CronJob's pod spec — so that `serviceAccountName` is
# a field Flux owns. An unowned `serviceAccountName` cannot be reconciled away:
# server-side apply only prunes fields inside a manager's own fieldset, so a value
# that reached the live CronJob outside this repo survives every subsequent apply
# and pins the pod to a subject that may not exist. Naming the account here keeps
# the field in kustomize-controller's fieldset, so the declared value always wins.
#
# The account carries exactly one grant: the namespaced Role bound to it permits
# `get` and `update` on the single `umami-provision-tenants` Lease, which the
# scheduled and bootstrap provisioners use to serialise their runs. Everything
# else the provisioning script talks to is Umami's HTTP API, with credentials
# mounted from Secrets. No access to Secrets, workloads, or any other
# coordination object is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: umami-provision-tenants
  namespace: umami
# The two provisioner pods request the token explicitly at pod level, where it is
# needed for the Lease client. Keeping the account-level default off means a later
# pod that names this account and omits the pod-level field still gets no
# projected token — the safe behaviour is the default rather than something each
# consumer has to remember.
automountServiceAccountToken: false
