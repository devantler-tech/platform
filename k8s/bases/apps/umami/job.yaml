# Immediate, one-shot run of the scheduled Umami tenant provisioner.
#
# Kustomize copies the CronJob's complete jobTemplate into this Job so the
# bootstrap and scheduled paths cannot drift. The completed Job deliberately
# remains in the cluster: deleting it with a TTL would make Flux recreate it on
# every apps reconciliation. A force-enabled template change still replaces it
# and performs one fresh bootstrap against the new desired state.
apiVersion: batch/v1
kind: Job
metadata:
  name: umami-provision-tenants-bootstrap
  namespace: umami
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec: {}
