# Immediate, one-shot run of the scheduled Umami tenant provisioner.
#
# Kustomize copies the CronJob's complete jobTemplate into this Job so the
# bootstrap and scheduled paths cannot drift. The completed Job deliberately
# remains in the cluster: deleting it with a TTL would make Flux recreate it on
# every apps reconciliation. A force-enabled template change still replaces it
# and performs one fresh bootstrap against the new desired state.
apiVersion: batch/v1
kind: Job
metadata:
  name: umami-provision-tenants-bootstrap
  namespace: umami
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # KSail validates each raw manifest before Kustomize runs. Keep this source
  # object valid but inert; the replacement in kustomization.yaml overwrites
  # the complete spec with the CronJob's jobTemplate before Flux applies it.
  suspend: true
  template:
    metadata:
      annotations:
        checkov.io/skip1: CKV_K8S_8=inert source template is replaced before apply
        checkov.io/skip2: CKV_K8S_9=inert source template is replaced before apply
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: replaced-by-kustomize
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 1m
              memory: 1Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
