# The application image is private in GHCR. Project the platform-owned
# read-only credential into this namespace for kubelet pulls and Kyverno's
# first-party signature verifier. The value remains in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-auth
  namespace: data-product-controller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson # checkov:skip=CKV_SECRET_6:the value is read from OpenBao
      remoteRef:
        key: infrastructure/ghcr/auth
        property: dockerconfigjson
