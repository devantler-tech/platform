apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: data-product-controller
  namespace: data-product-controller
  annotations:
    security.devantler.tech/authorization-scope: isolated-chart
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 10m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: data-product-controller
  values:
    image:
      repository: ghcr.io/devantler-tech/data-product-controller
      tag: 2.4.8
      digest: sha256:c40aa8ba8696cb93766d216e4fe2db64b66006a79faa36faf6a3834bf8978f9f
      pullPolicy: IfNotPresent
    uiContract:
      enabled: true
      additionalHostOrigins:
        - https://product-ui.${domain}
    uiAppearance:
      enabled: true
    engineProviders:
      enabled: false
    provisionedSources:
      enabled: false
    httpSource:
      enabled: false
    composition:
      enabled: false
    dcatCatalog:
      enabled: false
    connectorReadiness:
      enabled: true
    contractReadiness:
      enabled: true
    contractProbe:
      enabled: false
    route:
      enabled: true
      host: data-products.${domain}
      parentRef:
        name: platform
        namespace: kube-system
        sectionName: https
    controller:
      replicas: 2
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    demoProduct:
      enabled: true
      publicBaseURL: https://harbour-data.${domain}
      replicas: 2
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: data-product-controller
            patch: |
              # Platform admission requires this on each container as well as
              # the Pod-level default supplied by the portable chart.
              - op: add
                path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
                value: true
              - op: add
                path: /spec/template/spec/imagePullSecrets
                value:
                  - name: ghcr-auth
              - op: add
                path: /spec/template/spec/topologySpreadConstraints
                value:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: data-product-controller
                        app.kubernetes.io/instance: data-product-controller
                        app.kubernetes.io/component: controller
          - target:
              kind: Deployment
              name: data-product-controller-harbour
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
                value: true
              - op: add
                path: /spec/template/spec/imagePullSecrets
                value:
                  - name: ghcr-auth
              - op: add
                path: /spec/template/spec/topologySpreadConstraints
                value:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: data-product-controller
                        app.kubernetes.io/instance: data-product-controller
                        app.kubernetes.io/component: harbour-product
          - target:
              kind: HTTPRoute
              name: data-product-controller
            patch: |
              $patch: delete
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: data-product-controller
                namespace: data-product-controller
          # Standard NetworkPolicy allows are additive with Cilium's rules.
          # Replace the chart's broad allows with component-scoped platform rules.
          - target:
              kind: NetworkPolicy
              name: data-product-controller
            patch: |
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: data-product-controller
                namespace: data-product-controller
          - target:
              kind: NetworkPolicy
              name: data-product-controller-harbour
            patch: |
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: data-product-controller-harbour
                namespace: data-product-controller
          # Helm owns registration after CRD installation, keeping clean rebuilds
          # independent of a pre-existing DataProduct API.
          - target:
              kind: DataProduct
              name: harbour-observations
            patch: |
              - op: replace
                path: /spec/id
                value: https://harbour-data.${domain}
              - op: replace
                path: /spec/outputs/0/url
                value: https://harbour-data.${domain}/api/observations
              - op: replace
                path: /spec/outputs/0/contractUrl
                value: https://harbour-data.${domain}/openapi.json
              - op: replace
                path: /spec/ui/url
                value: https://harbour-data.${domain}/ui
              - op: add
                path: /spec/connector
                value:
                  adapter: deployment/v1
                  resourceRef:
                    apiVersion: apps/v1
                    kind: Deployment
                    name: data-product-controller-harbour
              - op: add
                path: /spec/contractChecks
                value:
                  - output: observations
                    resourceRef:
                      apiVersion: apps/v1
                      kind: Deployment
                      name: data-product-controller-contract-probe
