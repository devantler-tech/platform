apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-product-controller-publisher-review
  namespace: data-product-controller
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: data-product-controller
      k8s:app.kubernetes.io/instance: data-product-controller
      k8s:app.kubernetes.io/component: publisher-review
  ingress:
    # The public host serves packaged assets without outbound connections.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress: []
