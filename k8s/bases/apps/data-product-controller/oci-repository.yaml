apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: data-product-controller
  namespace: data-product-controller
  annotations:
    security.devantler.tech/authorization-scope: isolated-chart
spec:
  interval: 10m
  url: oci://ghcr.io/devantler-tech/charts/data-product-controller
  ref:
    # v1.10.1. Pin the content digest so a moved registry tag cannot change the
    # chart Flux installs.
    digest: sha256:6c65cb158cb1290d29194d1f17488760f6e6a9a91dc798354717fe483b5687ac
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      # The chart is signed keylessly by its own repository's publish-chart.yaml,
      # run on a release tag (devantler-tech/data-product-controller#27). Only a
      # vX.Y.Z tag run of that workflow is trusted; a branch or pull request run is not.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/data-product-controller/\.github/workflows/publish-chart\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
