apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: data-product-controller
  namespace: data-product-controller
  annotations:
    security.devantler.tech/authorization-scope: isolated-chart
spec:
  interval: 10m
  url: oci://ghcr.io/devantler-tech/charts/khoist
  ref:
    # v9.0.12. Pin the content digest so a moved registry tag cannot change the
    # chart Flux installs.
    digest: sha256:806cbdd4513f8ef9593f5426f5c609669651b2a4fee5970af2b3bc0519be0341
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      # The chart is signed keylessly by its own repository's publish-chart.yaml,
      # run on a release tag (devantler-tech/khoist#27). Only a
      # vX.Y.Z tag run of that workflow is trusted; a branch or pull request run is not.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/khoist/\.github/workflows/publish-chart\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
