apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: data-product-controller
  namespace: data-product-controller
  annotations:
    security.devantler.tech/authorization-scope: isolated-chart
spec:
  interval: 10m
  url: oci://ghcr.io/devantler-tech/charts/data-product-controller
  ref:
    # v1.0.2. Pin the content digest so a moved registry tag cannot change the
    # chart Flux installs.
    digest: sha256:dd1bfb808253f9a52fdd383f95290215fdc14b6ecc959f7d507a03def8921bc7
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
