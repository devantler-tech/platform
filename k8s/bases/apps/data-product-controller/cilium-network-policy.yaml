apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-data-product-controller
  namespace: data-product-controller
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: data-product-controller
      k8s:app.kubernetes.io/instance: data-product-controller
      k8s:app.kubernetes.io/component: controller
  ingress:
    # Registry and descriptor metadata are available only after SSO.
    - fromEndpoints:
        - matchLabels:
            app: auth-proxy
            k8s:io.kubernetes.pod.namespace: oauth2-proxy
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
  egress:
    # The controller watches DataProducts and coordinates leader election.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Keep DNS available for controller-runtime and future standard-contract
    # integrations without allowing arbitrary data-plane egress.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
