apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-product-controller-registry
  namespace: data-product-controller
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Data Products
    gethomepage.dev/description: Discover and explore composable data products.
    gethomepage.dev/group: Analytics
    gethomepage.dev/icon: mdi-database-search
    gethomepage.dev/href: https://data-products.${domain}
    gethomepage.dev/pod-selector: app.kubernetes.io/component=controller
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - data-products.${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
