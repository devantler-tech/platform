---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: ksail
    platform.devantler.tech/tenant-source: "true"
  name: ascoachingogvaner
  namespace: ascoachingogvaner
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  url: oci://ghcr.io/devantler-tech/ascoachingogvaner/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Keyless-signed by this product's OWN release workflow, cd.yaml, on a strict
      # OCI-semver release tag (ADR 0017, #6265, #6306). The shared publisher, another
      # workflow or repository, a branch or a non-release tag does not match.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/ascoachingogvaner/\.github/workflows/cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
