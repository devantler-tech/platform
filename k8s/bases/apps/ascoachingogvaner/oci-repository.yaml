---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: ksail
  name: ascoachingogvaner
  namespace: ascoachingogvaner
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  url: oci://ghcr.io/devantler-tech/ascoachingogvaner/manifests
  secretRef:
    name: ghcr-auth
  verify:
    provider: cosign
    matchOIDCIdentity:
      # The subject is written from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. It accepts only the approved
      # publish-app.yaml revisions: the deployed artifact signer, this consumer's
      # current pin, and the latest actions release candidate.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@(a147ead8b8bc937fbfb1974e3698c7e32f95517d|3c3a6348b3e7aacc995ae49fc60032f95f70a779|df7fd4f83edade31c121a9de563d9a7b9b1f900d)$'
