apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-generated-bookkeeping
  namespace: private-mail
spec:
  refreshInterval: "0"
  target:
    name: private-mail-generated-bookkeeping
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: private-mail-bookkeeping
