apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: private-mail-bookkeeping
  namespace: private-mail
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: private-mail-generated-bookkeeping
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: infrastructure/email/bookkeeping
          property: password
