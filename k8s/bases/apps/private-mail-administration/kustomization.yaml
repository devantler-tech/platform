apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Administration bundle; production opts in with encrypted settings.
resources:
  - ../private-mail
  - password-maintainer.yaml
  - external-secret-generated-maintainer.yaml
  - push-secret-maintainer.yaml
  - external-secret-maintainer.yaml
  - password-agent.yaml
  - external-secret-generated-agent.yaml
  - push-secret-agent.yaml
  - external-secret-agent.yaml
  - certificate.yaml
  - http-route.yaml
patches:
