apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Administration bundle; production opts in with encrypted settings.
resources:
  - ../private-mail
  - password-maintainer.yaml
  - external-secret-generated-maintainer.yaml
  - push-secret-maintainer.yaml
  - external-secret-maintainer.yaml
  - password-agent.yaml
  - external-secret-generated-agent.yaml
  - push-secret-agent.yaml
  - external-secret-agent.yaml
  - external-secret-relay.yaml
  # The receiving aliases, from their single OpenBao source (#5481).
  - external-secret-aliases.yaml
  - certificate.yaml
  - http-route.yaml
patches:
  - path: patches/serve-after-initialization.yaml
  - path: patches/read-back-admin-password.yaml
  - path: patches/isolate-administration.yaml
images:
  - name: ghcr.io/devantler-tech/platform-private-mail-bootstrap
    # Signed main publication cec94ffd08af (Stalwart 0.16.27). Since the
    # serving b4253e8d38dc image it reads the maintainer's receiving aliases
    # from their OpenBao source (#6635); verifies SPF and reverse IP and
    # enforces DMARC on inbound SMTP behind the named load balancer (#6647);
    # and imports the pinned spam filter rules from the image, without the
    # shortened-link check (#6651). It also carries the inert history
    # importer subcommand (#6435) and Caddy 2.11.9 for the client proxy (#6565).
    digest: sha256:c00cd848d47cab10f60301facba02387cf34832f7d560cfaf206a008ed9e0ff9
