apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Administration bundle; production opts in with encrypted settings.
resources:
  - ../private-mail
  - password-maintainer.yaml
  - external-secret-generated-maintainer.yaml
  - push-secret-maintainer.yaml
  - external-secret-maintainer.yaml
  - password-agent.yaml
  - external-secret-generated-agent.yaml
  - push-secret-agent.yaml
  - external-secret-agent.yaml
  - external-secret-relay.yaml
  # The receiving aliases, from their single OpenBao source (#5481).
  - external-secret-aliases.yaml
  - certificate.yaml
  - http-route.yaml
patches:
  - path: patches/serve-after-initialization.yaml
  - path: patches/read-back-admin-password.yaml
  - path: patches/isolate-administration.yaml
images:
  - name: ghcr.io/devantler-tech/platform-private-mail-bootstrap
    # The Stalwart 0.16.27 bootstrap published and signed from 4bfd0e6e (the
    # merge of #6769) by Publish Email Bootstrap run 46155779256.
    #
    # That publication adds, to cec94ffd08af before it
    # (OpenBao aliases #6635, inbound checks #6647, pinned spam rules #6651,
    # the inert history importer #6435, Caddy 2.11.9 #6565): the --hostname
    # and --web-hostname flags, implicit-TLS submission with --hostname only,
    # uploads at the maintainer's own upload URL, and no POP3 or ManageSieve
    # in autoconfig. Adopted without flags, so it stores nothing the earlier
    # image refuses and a heal back to that image starts.
    digest: sha256:13bc123718ae246b5987e02a936228341bf8a511910df2b062bf289ec4be0e7a
