apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Administration bundle; production opts in with encrypted settings.
resources:
  - ../private-mail
  - password-maintainer.yaml
  - external-secret-generated-maintainer.yaml
  - push-secret-maintainer.yaml
  - external-secret-maintainer.yaml
  - password-agent.yaml
  - external-secret-generated-agent.yaml
  - push-secret-agent.yaml
  - external-secret-agent.yaml
  - external-secret-relay.yaml
  - certificate.yaml
  - http-route.yaml
patches:
  - path: patches/serve-after-initialization.yaml
  - path: patches/read-back-admin-password.yaml
  - path: patches/isolate-administration.yaml
images:
  - name: ghcr.io/devantler-tech/platform-private-mail-bootstrap
    # Signed main publication b4253e8d38dc with the secure Stalwart defaults
    # (#6261). Its only change from b9aeb4ed74a2, the SES relay route, is the
    # declared defaults and their read-back (docs/operations/email-secure-defaults.md).
    digest: sha256:7626ff9dffe3af11b9fc20ea303a0f2e55cdcb824e464185ddad0ce527cef55c
