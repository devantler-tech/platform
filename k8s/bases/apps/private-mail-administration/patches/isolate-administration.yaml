apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: private-mail
  namespace: private-mail
spec:
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # Recovery binds every interface. Deny also fences initialization and retries
  # if another namespace policy grants ingress to this endpoint.
  ingressDeny:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "18080"
              protocol: TCP
            - port: "1025"
              protocol: TCP
            - port: "1587"
              protocol: TCP
            - port: "1993"
              protocol: TCP
