apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: private-mail
  namespace: private-mail
spec:
  template:
    spec:
      $patch: replace
      serviceAccountName: private-mail
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: ghcr.io/devantler-tech/platform-private-mail-bootstrap
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions: {}
          volumeMounts:
            # The startup configuration is a file; leave the TLS directory
            # outside the read-only ConfigMap projection.
            - name: datastore
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: private-inputs
              mountPath: /etc/private-mail
              readOnly: true
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
            - name: initialization-temporary
              mountPath: /tmp
      containers:
        - name: private-mail
          image: ghcr.io/devantler-tech/platform-private-mail-bootstrap
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/stalwart"]
          args: ["--config", "/etc/stalwart/config.json"]
          ports:
            - name: management
              containerPort: 8080
          startupProbe:
            # Self-checks use the local process path; client-address security
            # state must not restart an otherwise healthy serving process.
            exec:
              command:
                - /usr/bin/env
                - -i
                - /bin/bash
                - --noprofile
                - --norc
                - -euo
                - pipefail
                - -c
                - |
                  code=$(/usr/bin/curl --disable --noproxy '*' --http1.1 \
                    --silent --show-error --output /dev/null --write-out '%{http_code}' \
                    --connect-timeout 1 --max-time 1 http://127.0.0.1:8080/healthz/live)
                  [[ "$code" == 200 ]]
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /usr/bin/env
                - -i
                - /bin/bash
                - --noprofile
                - --norc
                - -euo
                - pipefail
                - -c
                - |
                  code=$(/usr/bin/curl --disable --noproxy '*' --http1.1 \
                    --silent --show-error --output /dev/null --write-out '%{http_code}' \
                    --connect-timeout 1 --max-time 1 http://127.0.0.1:8080/healthz/ready)
                  [[ "$code" == 200 ]]
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /usr/bin/env
                - -i
                - /bin/bash
                - --noprofile
                - --norc
                - -euo
                - pipefail
                - -c
                - |
                  code=$(/usr/bin/curl --disable --noproxy '*' --http1.1 \
                    --silent --show-error --output /dev/null --write-out '%{http_code}' \
                    --connect-timeout 1 --max-time 1 http://127.0.0.1:8080/healthz/live)
                  [[ "$code" == 200 ]]
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions: {}
          volumeMounts:
            - name: datastore
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: datastore
          configMap:
            name: private-mail-datastore
        - name: data
          persistentVolumeClaim:
            claimName: private-mail-data
        - name: private-inputs
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: private-mail-settings
                  items:
                    - key: settings.json
                      path: settings.json
              - secret:
                  name: private-mail-admin
                  items:
                    - key: password
                      path: administrator-password
              - secret:
                  name: private-mail-maintainer
                  items:
                    - key: password
                      path: maintainer-password
              - secret:
                  name: private-mail-agent
                  items:
                    - key: password
                      path: agent-password
        - name: tls
          secret:
            secretName: private-mail-tls
            defaultMode: 0440
        - name: initialization-temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
