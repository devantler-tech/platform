apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: private-mail-maintainer
  namespace: private-mail
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: private-mail-generated-maintainer
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/private-mail/maintainer
          property: password
