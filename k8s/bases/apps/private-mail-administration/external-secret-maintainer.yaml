apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-maintainer
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: private-mail-maintainer
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: apps/private-mail/maintainer
        property: password
