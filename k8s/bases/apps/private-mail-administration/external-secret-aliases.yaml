# The mail server's receiving aliases, kept by the maintainer in OpenBao as
# their single source (#5481): a comma-separated list of the domain's other
# addresses. The setup mounts it as its maintainer-aliases input, which
# replaces any aliases the settings still carry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-aliases
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: private-mail-aliases
    creationPolicy: Owner
  data:
    - secretKey: aliases
      remoteRef:
        key: infrastructure/email/aliases
        property: aliases
