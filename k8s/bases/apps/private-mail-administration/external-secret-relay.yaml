# The send-only SES SMTP login for the outbound relay
# (docs/adr/email-outbound-relay.md). The platform-applied PushSecret in the aws
# namespace stores it at this one OpenBao key from the Crossplane access key;
# only the Email server's setup reads it, and nobody reads the values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-relay
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: private-mail-relay
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: infrastructure/email/ses-smtp
        property: username
    - secretKey: password
      remoteRef:
        key: infrastructure/email/ses-smtp
        property: password
