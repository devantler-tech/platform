apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: private-mail
  namespace: private-mail
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Email
    gethomepage.dev/description: Company email administration with Stalwart.
    gethomepage.dev/group: Email
    gethomepage.dev/icon: mdi-email-lock
    gethomepage.dev/href: https://mail.${domain}/admin
    gethomepage.dev/pod-selector: app=private-mail
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - mail.${domain}
  rules:
    - backendRefs:
        - name: private-mail
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
