apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-bookkeeping
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: private-mail-bookkeeping
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: infrastructure/email/bookkeeping
        property: password
