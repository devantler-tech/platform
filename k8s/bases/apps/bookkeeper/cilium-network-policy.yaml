apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookkeeper
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookkeeper
  egress:
    - toFQDNs:
        - matchName: mail.${domain}
        - matchName: api.numina.app
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: mail.${domain}
              - matchName: api.numina.app
