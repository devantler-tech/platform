apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookkeeper
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: bookkeeper
    creationPolicy: Owner
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  dataFrom:
    - extract:
        key: apps/bookkeeper/prod
