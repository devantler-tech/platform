---
# Namespaced workload/config reads for the Crossview backend. The built-in
# `view` role deliberately excludes Secrets and write/exec verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossview-view
  labels:
    app.kubernetes.io/name: crossview
    app.kubernetes.io/managed-by: ksail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: crossview-sa
    namespace: crossview
