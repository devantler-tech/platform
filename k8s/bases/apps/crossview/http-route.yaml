# Route for Crossview at crossview.${domain} — the authenticated replacement for
# the removed runtime-downloaded Headlamp plugin. Public traffic first passes
# through oauth2-proxy's maintainer-team gate and auth-proxy's Host router, then
# Crossview establishes its own Dex-backed application session.
#
# Prod/hetzner only in practice: Crossview is opt-in on the local Docker overlay,
# so this route renders only where the app is deployed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crossview
  namespace: crossview
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Crossview
    gethomepage.dev/description: Crossplane resource explorer.
    gethomepage.dev/group: Infrastructure as Code
    gethomepage.dev/icon: mdi-graph-outline
    gethomepage.dev/pod-selector: app.kubernetes.io/name=crossview,app.kubernetes.io/component=app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - crossview.${domain}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Auth-Request-Redirect
                value: https://crossview.${domain}/
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'"
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
