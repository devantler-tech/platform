apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-storage-key
  namespace: private-mail
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: email-storage
    kind: SecretStore
  target:
    name: email-storage-key
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
    template:
      engineVersion: v2
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      data:
        CRYPTO_KEY_VALUE: "{{ .CRYPTO_KEY_VALUE }}"
        CRYPTO_KEY_PROVIDER: secret
        CRYPTO_KEY_CIPHER: aes-xts-plain64
        CRYPTO_KEY_HASH: sha256
        CRYPTO_KEY_SIZE: "256"
        CRYPTO_PBKDF: argon2i
  data:
    - secretKey: CRYPTO_KEY_VALUE
      remoteRef:
        key: infrastructure/email/storage
        property: passphrase
