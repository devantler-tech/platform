apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: email-data-encrypted-v2
  namespace: private-mail
  labels:
    platform.devantler.tech/storage-stage: prepared
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: email-encrypted-v2
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
