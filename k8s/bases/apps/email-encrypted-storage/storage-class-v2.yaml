---
# The V2 replacement uses a new claim after the encrypted restore has been verified.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: email-encrypted-v2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  encrypted: "true"
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fsType: ext4
  dataLocality: disabled
  unmapMarkSnapChainRemoved: disabled
  dataEngine: v2
  backupTargetName: default
  csi.storage.k8s.io/node-stage-secret-name: email-storage-key
  csi.storage.k8s.io/node-stage-secret-namespace: private-mail
  csi.storage.k8s.io/node-publish-secret-name: email-storage-key
  csi.storage.k8s.io/node-publish-secret-namespace: private-mail
  csi.storage.k8s.io/node-expand-secret-name: email-storage-key
  csi.storage.k8s.io/node-expand-secret-namespace: private-mail
