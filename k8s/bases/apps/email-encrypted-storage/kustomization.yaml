apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The retained Email namespace must already exist. Production holds the key and
# the empty claim; no workload selects the claim until a reviewed cutover does.
resources:
  - secret-store.yaml
  - external-secret.yaml
  - storage-class.yaml
  - persistent-volume-claim.yaml
