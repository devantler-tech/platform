---
# The Devantler Tech icon files Homepage serves itself, so the front page no
# longer loads its icon from the GitHub avatar URL. helm-release.yaml mounts
# this ConfigMap at /app/public/images/devantler-tech, which Homepage serves at
# /images/devantler-tech/<key>; config-map.yaml points `favicon`, the PWA icons
# and the logo widget there.
#
# Every file is the Devantler Tech icon (a rounded green square with a dark
# "D"; devantler-tech/business-site public/favicon.png is the same icon at
# 256x256): icon-180.png for the tab and iOS home screen, icon-192.png and
# icon-512.png for installs, and icon.svg for the square logo widget.
# Homepage finds files in this folder when it starts, so a new key needs a pod
# restart; an edited file is served as soon as the kubelet refreshes the mount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-brand
  namespace: homepage
  annotations:
    # Mounted directly by the primary as well, like the homepage ConfigMap: a
    # tracked copy would only refresh on a canary promotion.
    flagger.app/config-tracking: "disabled"
data:
  icon.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><title>Devantler Tech</title><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BFF3C"/><stop offset="1" stop-color="#2CE00E"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/><path fill="#0A0D0B" fill-rule="evenodd" d="M180 128H250A128 128 0 0 1 250 384H134V174ZM204 198V314H250A58 58 0 0 0 250 198Z"/></svg>
binaryData:
  icon-180.png: 
  icon-192.png: 
  icon-512.png: 
