---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  annotations:
    # Opt out of Flagger's config tracking so edits hot-reload (see the volumes
    # in helm-release.yaml). Tracked, Flagger copies this ConfigMap to
    # `homepage-primary` and only refreshes that copy on a promotion, which also
    # rolls every pod — so an edit waited for a full canary analysis and a
    # restart, and reached nothing while a canary was failing.
    flagger.app/config-tracking: "disabled"
data:
  settings.yaml: |
    title: Platform
    # `favicon` also drives the iOS Add-to-Home-Screen icon: Homepage emits
    # <link rel="apple-touch-icon" sizes="180x180" href={favicon}> and has no
    # separate apple-touch-icon setting. At s=32 iOS upscaled a 32px image to
    # 180px, so the installed PWA tile was badly blurred. Request s=180 to match
    # the apple-touch-icon size exactly — a crisp, unscaled render (the avatar
    # tops out at 460x460 upstream) — which the browser also downsamples for the
    # tab favicon.
    favicon: https://avatars.githubusercontent.com/u/178524219?v=4&s=180
    # PWA manifest icons for the installed app. Without this the manifest falls
    # back to Homepage's own logo; point it at the DevantlerTech avatar so an
    # installed app stays on-brand. iOS uses the apple-touch-icon above for the
    # home-screen tile; these cover the web manifest (Android / desktop install /
    # splash). s=512 is capped to the avatar's native 460x460 — still far sharper
    # than the old 32px asset.
    pwa:
      icons:
        - src: https://avatars.githubusercontent.com/u/178524219?v=4&s=192
          type: image/jpeg
          sizes: 192x192
        - src: https://avatars.githubusercontent.com/u/178524219?v=4&s=512
          type: image/jpeg
          sizes: 512x512
    theme: dark
    # zinc, not slate: homepage's gray chrome (text, card fills, borders, and
    # the #__next page background) follows this `color` ramp. slate is a
    # ~47%-saturated blue and read as "too blue"; zinc (hue 240, ~6% saturation)
    # matches devantler.tech's low-saturation cool-gray ramp. See custom.css.
    color: zinc
    # No background.image — eliminates the cold-load white→image flash and
    # the cross-origin Unsplash dependency. The dark, flat backdrop is
    # painted from custom.css below; cardBlur is omitted because there is
    # no underlying image for backdrop-filter to blur.
    headerStyle: clean
    fullWidth: true
    statusStyle: dot
    iconStyle: gradient
    hideVersion: true
    # Disable Homepage's built-in GitHub release check. The cluster egress
    # NetworkPolicy (cilium-network-policy.yaml) intentionally allows no internet
    # access, so the check — GET api.github.com/repos/gethomepage/homepage/
    # releases, fired by the Version component — is dropped by Cilium and
    # hangs ~8s on the TCP connect timeout before failing, wasting an
    # event-loop slot on this single-threaded server. This is separate from
    # hideVersion (which only hides the footer display); hideVersion alone did
    # not stop the call in prod, so disable the check at its source. Gates the
    # useSWR("/api/releases") key in the Version component, so it holds even
    # if hideVersion is later set false to show the version again.
    disableUpdateCheck: true
    target: _blank
    # Layout order also controls render order on the page. Groups not listed
    # here still appear (Homepage falls back to alphabetical) but get a generic
    # icon AND sort below every listed group — bookmarks included — so an
    # undeclared group silently lands at the bottom of the page.
    #
    # The SERVICE groups below are enforced at admission by the Kyverno policy
    # cluster-policies/best-practices/restrict-homepage-service-groups.yaml: a
    # route annotated gethomepage.dev/enabled="true" may only name a group
    # declared here. Adding a service group means adding it there too, in the
    # same PR — that policy carries the matching allow-list. Homepage itself has
    # no way to filter discovery by group, which is why the binding lives in
    # admission rather than in this file.
    #
    # Still keep this in sync with the gethomepage.dev/group annotations on the
    # HTTPRoutes under k8s/bases/apps/** and k8s/**/infrastructure/** (incl.
    # provider overlays, e.g. Longhorn on Hetzner) and the service entries below
    # — and note tenant repositories carry their own routes, so a group can be
    # claimed from outside this repository.
    layout:
      Kubernetes:
        icon: si-talos-#FF7300
      Observability:
        # `coroot` is not in any icon set Homepage resolves; use an MDI icon.
        icon: mdi-chart-line
      # Right after Observability: Umami is the other "how is it doing" view,
      # for the sites rather than the cluster.
      Analytics:
        icon: si-umami
      Secrets Management:
        icon: mdi-key-chain
      # Policy and compliance posture: what is allowed to run, and how it scores.
      Governance:
        icon: mdi-scale-balance
      Diagnostics:
        icon: mdi-stethoscope
      Device Management:
        icon: mdi-cellphone-cog
      # Sits immediately before the two providers it declares: Crossplane
      # provisions the Hetzner cloud and the UniFi network, so "declare it" reads
      # ahead of "here is the provider console".
      Infrastructure as Code:
        # `crossplane` is not in simple-icons (verified 404); use an MDI icon, as
        # the Observability entry above already has to.
        icon: mdi-file-cog
      Cloud:
        icon: si-hetzner
      Network:
        icon: si-cloudflare
      # Devices in the home: heating and other IoT. Network gear stays under
      # Network, because a UniFi site is not tied to one physical location.
      Home:
        icon: mdi-home-automation
      Finance:
        icon: mdi-finance
      Data:
        icon: mdi-database-search
      # The company site first, then the client projects hosted for it.
      Business & Clients:
        icon: mdi-briefcase
      Products:
        icon: mdi-book-open-page-variant
      Email:
        icon: mdi-email-outline
      Personal:
        icon: mdi-web
      # Bookmark groups (bookmarks.yaml). Listing them here is what gives them a
      # real icon and a deterministic position; unlisted groups fall back to
      # alphabetical with a generic icon, which is why the bookmark rail used to
      # order itself differently from the way the groups actually relate. Their
      # names are deliberately distinct from the service groups above — Homepage
      # renders services and bookmarks as separate sections, so a shared name
      # paints the same heading twice with different contents under each.
      Internal Developer Platform:
        icon: mdi-hammer-wrench
      Code Quality & Security:
        icon: mdi-code-braces-box
      Supply Chain:
        icon: mdi-shield-search
      Package Registries:
        icon: mdi-package-variant-closed
      Marketplaces:
        icon: mdi-storefront-outline
      Learning & Reference:
        icon: mdi-school
      Streaming:
        icon: mdi-play-circle-outline
      Social Media:
        icon: mdi-account-group
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  widgets.yaml: |
    - logo:
        icon: https://avatars.githubusercontent.com/u/178524219?v=4&s=200
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hourCycle: h23
  services.yaml: |
    - Observability:
        - Healthchecks.io:
            icon: mdi-heart-pulse
            href: https://healthchecks.io/
            description: External heartbeat monitoring.
        # GitHub's org Insights, split into its two Actions views. They sit here
        # rather than in a bookmark group because Observability is a service
        # group, and a bookmark group may not reuse a service group's name.
        - GitHub Actions Usage:
            icon: si-githubactions-#2088FF
            href: https://github.com/orgs/devantler-tech/actions/metrics/usage
            description: Actions minutes by workflow, job, repository and runner.
        - GitHub Actions Performance:
            icon: si-githubactions-#2088FF
            href: https://github.com/orgs/devantler-tech/actions/metrics/performance
            description: Actions run times, queue times and failure rates.
        - GitHub Ruleset Dashboard:
            icon: si-github-#181717
            href: https://github.com/organizations/devantler-tech/settings/rules/dashboard
            description: Organization-wide rule evaluation trends and bypasses.
        - GitHub Ruleset Insights:
            icon: si-github-#181717
            href: https://github.com/organizations/devantler-tech/settings/rules/insights
            description: Detailed rule evaluations across organization repositories.
    - Governance:
        - GitHub Rulesets:
            icon: si-github-#181717
            href: https://github.com/organizations/devantler-tech/settings/rules
            description: Organization-wide repository rules.
        - GitHub Repository Properties:
            icon: si-github-#181717
            href: https://github.com/organizations/devantler-tech/settings/custom-properties
            description: Organization-wide repository metadata.
        - GitHub Audit Log:
            icon: si-github-#181717
            href: https://github.com/organizations/devantler-tech/settings/audit-log
            description: Organization activity and configuration history.
    - Cloud:
        - Hetzner Cloud:
            icon: hetzner
            href: https://console.hetzner.cloud/projects
            description: Hetzner Cloud infrastructure provider.
    - Network:
        - Cloudflare:
            icon: cloudflare
            href: https://dash.cloudflare.com
            description: Central hub for managing public networking, e.g. FQDN and DNS.
        - UniFi:
            icon: unifi
            href: https://unifi.ui.com
            description: Central hub for managing on-prem UniFi network infrastructure.
    # Devices in the home. The link carries no installation number on purpose:
    # this repository is public, and StokerCloud shows a boiler's data to anyone
    # who knows its number. Log in there instead.
    - Home:
        - StokerCloud:
            icon: mdi-water-boiler
            href: https://stokercloud.dk/v3/
            description: NBE pellet boiler monitoring and control.
    # External money consoles. Actual Budget joins this group from its own
    # HTTPRoute's gethomepage.dev annotations (k8s/bases/apps/actual-budget).
    - Finance:
        - Stripe:
            icon: si-stripe-#635BFF
            href: https://dashboard.stripe.com
            description: Payments, invoices and payouts.
        - Enable Banking:
            icon: mdi-bank-outline
            href: https://enablebanking.com
            description: Open-banking connections and consents.
    # The business site and the product documentation sites are served by
    # GitHub Pages, not this cluster, so they are listed statically. Business &
    # Clients holds the company site followed by the client projects, which are
    # discovered from gethomepage.dev annotations on tenant HTTPRoutes; Products
    # holds one documentation site per product. Personal sites are discovered the
    # same way. The KSail operator running in this cluster stays under
    # Kubernetes, from its own route.
    - Business & Clients:
        # Homepage sorts a group by weight, then name. Discovered services weigh
        # 0 by default and static ones 100, 200, …, so without this the client
        # projects would sort ahead of the company site.
        - devantler.tech:
            icon: mdi-web
            href: https://devantler.tech
            description: Business site — products, services, guides and documentation.
            weight: -1
    - Products:
        - KSail Docs:
            icon: https://ksail.devantler.tech/favicon.svg
            href: https://ksail.devantler.tech
            description: One CLI to spin up Kubernetes clusters and run them with GitOps.
        - KHoist Docs:
            icon: https://khoist.devantler.tech/brand/khoist-mark.svg
            href: https://khoist.devantler.tech
            description: Publish, discover and compose reusable data products through standard APIs.
    # Analytics is populated dynamically from the gethomepage.dev annotations on
    # Umami's Flagger-generated HTTPRoute (k8s/bases/apps/umami/canary.yaml,
    # spec.service.apex.annotations).
  # Bookmarks are grouped by WHAT YOU GO THERE TO DO, matching how services.yaml
  # and the settings.yaml layout already group by function (Governance, Cloud,
  # Network, Finance, …) rather than by vendor. A console that serves several
  # purposes is therefore split into its specific product views, each in the
  # group for that purpose, never collected under a vendor group: GitHub's repos,
  # pull requests and project board sit under Internal Developer Platform, its
  # security overview under Code Quality & Security, its Packages under Package
  # Registries, and its Actions metrics under the Observability service group.
  #
  # Group names are deliberately DISTINCT from the service group names in
  # settings.yaml (Governance, Kubernetes, Finance, …). Homepage renders services
  # and bookmarks as separate sections, so reusing a name paints the same heading
  # twice on one page with different contents under each.
  bookmarks.yaml: |
    - Internal Developer Platform:
        - DevantlerTech:
            - icon: github-light
              href: https://github.com/devantler-tech
        - Repositories:
            - icon: mdi-source-repository-multiple
              href: https://github.com/orgs/devantler-tech/repositories
        - Pull Requests:
            - icon: mdi-source-pull
              href: https://github.com/pulls
        - Project Board:
            - icon: si-github-#181717
              href: https://github.com/orgs/devantler-tech/projects/5/views/1
        # No brand colour: Simple Icons' GitHub Copilot hex is #000000, which
        # vanishes on the dark backdrop; uncoloured, it takes the theme gradient.
        - Copilot Agents:
            - icon: si-githubcopilot
              href: https://github.com/copilot/agents
        # mdi, not si-githubcodespaces: Simple Icons has no Codespaces slug (404).
        - Codespaces:
            - icon: mdi-cloud-braces
              href: https://github.com/codespaces
    - Code Quality & Security:
        - Codecov:
            - icon: si-codecov-#F01F7A
              href: https://app.codecov.io
        - CodeRabbit:
            - icon: si-coderabbit-#FF570A
              href: https://app.coderabbit.ai
        - GitHub Security:
            - icon: si-github-#181717
              href: https://github.com/orgs/devantler-tech/security/overview
        - GitHub Code Quality:
            - icon: si-github-#181717
              href: https://github.com/orgs/devantler-tech/security/quality
        - Codex Findings:
            - icon: si-openai-#412991
              href: https://chatgpt.com/codex/cloud/security/findings
    - Supply Chain:
        # mdi, not si-stepsecurity: Simple Icons carries no `stepsecurity` slug
        # (nor does dashboard-icons), so the si- form 404s at the CDN and renders
        # as a blank tile. Homepage resolves icons in the browser at render time,
        # so a wrong slug fails silently rather than at deploy.
        - StepSecurity:
            - icon: mdi-shield-check-outline
              href: https://app.stepsecurity.io
        # si-renovate, not si-renovatebot: both resolve today, but they are
        # different marks — `renovatebot.svg` is titled "RenovateBot" (the old
        # branding) and `renovate.svg` is titled "Renovate", which is the brand's
        # current name and the one Simple Icons lists. This is a branding
        # correction, not a fix for a blank icon.
        - Renovate:
            - icon: si-renovate-#007fa0
              href: https://developer.mend.io
    # Registries for every kind of package the portfolio consumes or publishes:
    # container images, Helm charts, NuGet packages and AI agent skills.
    - Package Registries:
        - GitHub Packages:
            - icon: si-github-#181717
              href: https://github.com/orgs/devantler-tech/packages
        - Docker Hub:
            - icon: docker
              href: https://hub.docker.com
        - ArtifactHUB:
            - icon: si-artifacthub-#417598
              href: https://artifacthub.io
        - NuGet:
            - icon: si-nuget-#1088d6
              href: https://www.nuget.org
        - skills.sh:
            - icon: mdi-certificate-outline
              href: https://skills.sh
    - Marketplaces:
        - GitHub Marketplace:
            - icon: si-github-#181717
              href: https://github.com/marketplace
    - Learning & Reference:
        - KodeKloud:
            - icon: mdi-school-outline
              href: https://kodekloud.com
        - Killercoda:
            - icon: mdi-console
              href: https://killercoda.com
    - Streaming:
        - YouTube:
            - icon: si-youtube-#FF0000
              href: https://youtube.com
        - Netflix:
            - icon: si-netflix-#E50914
              href: https://netflix.com
        - Gramaton:
            - icon: mdi-movie-open-play-outline
              href: https://gramaton.io
    - Social Media:
        - Reddit:
            - icon: si-reddit-#FF4500
              href: https://reddit.com
  docker.yaml: ""
  # Unused, but required: this ConfigMap is Homepage's read-only config
  # directory, and Homepage exits at boot if any file it expects is missing
  # (helm-release.yaml). Keep a key here for every file in Homepage's
  # src/skeleton.
  proxmox.yaml: ""
  # Theme: mirror https://devantler.tech. That site is Astro Starlight with the
  # stock dark palette — a gray ramp at hue 224 but only ~6-14% saturation, i.e.
  # a near-neutral, faintly-cool dark — and the accent swapped to a "Matrix"
  # neon green (--sl-color-accent #39ff14, high #7aff6e). Cards are frosted glass
  # that glow green and lift on hover; section accents and selection are green.
  # Reproduced purely in CSS — no background.image, because (a) the cluster
  # egress NetworkPolicy blocks external assets and (b) a remote image caused a
  # cold-load flash.
  #
  # Two levers carry the look:
  #   1. color:zinc (settings.yaml) — homepage's gray chrome (text, card fills,
  #      borders, and the #__next page background, all `theme-*` / --color-*
  #      driven) follows the `color` ramp. slate is ~47%-saturated blue and read
  #      as "too blue"; zinc (hue 240, ~6% saturation) is the closest match to
  #      devantler's low-saturation cool gray, so this de-blues the page at once.
  #   2. The CSS below — a flat backdrop at devantler's exact hsl(224,10%,10%)
  #      plus the green accent layer (borders / glow / underlines / selection).
  # cardBlur stays unset: the theme already paints a translucent fill
  # (dark:bg-white/5 ≈ devantler's glass), so the glass look comes from a faint
  # border + glow here, not backdrop-filter (nothing high-frequency to blur).
  # gethomepage hooks: #__next + html/body (page bg), .service-card, .bookmark,
  # .service-group-name / .bookmark-group-name, #information-widgets, scoped to
  # #layout-groups / #services / #bookmarks so they beat the chart's utilities.
  custom.css: |
    :root {
      --dt-accent: #39ff14;                     /* Matrix neon green */
      --dt-accent-high: #7aff6e;                /* lighter, more legible green */
      --dt-glow-subtle: rgba(57, 255, 20, 0.10);
      --dt-card-border: rgba(255, 255, 255, 0.10);
      --dt-card-border-hover: rgba(57, 255, 20, 0.45);
    }

    /* Page backdrop. Homepage paints the VISIBLE page background on #__next
       (the Next.js root, height:100%) via `background-color: rgb(var(--bg-color))`,
       where dark-theme --bg-color = color-800 of the `color` setting. That rule
       carries ID specificity, so it sits above a plain `body {}` background —
       which is why the earlier html/body auras here were never seen. Match
       devantler.tech's flat backdrop by painting its exact --sl-color-bg,
       hsl(224, 10%, 10%) (a near-neutral dark with a faint cool tint — not the
       saturated slate-800 the chart shipped), on #__next too. The `body #__next`
       selector outranks the chart's grouped rule regardless of stylesheet order.
       Flat, no auras — devantler's body background is flat. */
    html,
    body,
    body #__next {
      background-color: hsl(224, 10%, 10%);
      background-image: none;
    }

    /* Neon-green text selection + keyboard focus ring, matching devantler.tech. */
    ::selection {
      background: rgba(57, 255, 20, 0.25);
    }
    *:focus-visible {
      outline: 2px solid var(--dt-accent);
      outline-offset: 2px;
    }

    /* Pack whole groups into independent responsive columns. Homepage's flex
       rows otherwise reserve the tallest group's height for every neighbour.
       Reading and keyboard order follow the configured order down each column;
       18rem columns naturally become a single column on narrow screens. */
    #layout-groups,
    #services,
    #bookmarks {
      display: block;
      column-width: 18rem;
      column-gap: 0;
    }
    #layout-groups > .services-group,
    #layout-groups > .bookmark-group,
    #services > .services-group,
    #bookmarks > .bookmark-group {
      display: inline-block;
      width: 100%;
      break-inside: avoid;
      vertical-align: top;
      margin-bottom: 0.5rem;
    }

    /* Service & bookmark cards: the theme already paints a translucent glass
       fill; add a faint border at rest and a green glow + lift on hover —
       devantler's card interaction. Scoped to the group containers so these
       override the chart's Tailwind utilities regardless of stylesheet order. */
    #layout-groups .service-card,
    #services .service-card,
    #layout-groups .bookmark > a,
    #bookmarks .bookmark > a {
      border: 1px solid var(--dt-card-border);
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }
    #layout-groups .service-card:hover,
    #services .service-card:hover,
    #layout-groups .bookmark > a:hover,
    #bookmarks .bookmark > a:hover {
      border-color: var(--dt-card-border-hover);
      box-shadow:
        0 4px 24px var(--dt-glow-subtle),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }
    /* Nudge the title toward the lighter green on hover (devantler link hover). */
    #layout-groups .service-card:hover .service-name,
    #services .service-card:hover .service-name,
    #layout-groups .bookmark > a:hover .bookmark-name,
    #bookmarks .bookmark > a:hover .bookmark-name {
      color: var(--dt-accent-high);
    }

    /* Section headers: keep the theme's light-gray text (as devantler's h2s do)
       and add a short green accent underline — a calmer take on devantler's
       gradient <hr> dividers. */
    .service-group-name,
    .bookmark-group-name {
      padding-bottom: 0.3rem;
      background-image: linear-gradient(to right, var(--dt-accent), transparent);
      background-size: 2.75rem 2px;
      background-position: 0 100%;
      background-repeat: no-repeat;
    }

    /* Top widgets bar: a hairline separator under the widgets. The logo sat on a
       hard 16px green halo that read as a glowing ring; drop it and instead
       feather the logo's own edges into the dark backdrop with a soft radial
       mask, so the near-black badge dissolves into hsl(224,10%,10%) and reads as
       a subtle, understated mark rather than a green-rimmed sticker. The mask
       stays fully opaque across the emblem (inner ~65%) and only fades the flat
       black margin and corners, so no logo detail is dimmed. */
    #information-widgets {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.85rem;
      margin-bottom: 0.25rem;
    }
    #information-widgets img {
      border-radius: 12px;
      -webkit-mask-image: radial-gradient(circle, #000 65%, transparent 100%);
              mask-image: radial-gradient(circle, #000 65%, transparent 100%);
    }

    /* Thin, dark scrollbar with a green thumb. */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(57, 255, 20, 0.30) transparent;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(57, 255, 20, 0.25);
      border: 2px solid transparent;
      border-radius: 9999px;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(57, 255, 20, 0.45);
      background-clip: content-box;
    }

    /* Respect reduced-motion: the only transitions are card hovers. */
    @media (prefers-reduced-motion: reduce) {
      #layout-groups .service-card,
      #services .service-card,
      #layout-groups .bookmark > a,
      #bookmarks .bookmark > a {
        transition: none;
      }
    }
  custom.js: ""
