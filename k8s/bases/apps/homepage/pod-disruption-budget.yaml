apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homepage
  namespace: homepage
spec:
  # maxUnavailable: 1 is the platform-wide drain-safe PDB pattern (issue #1880).
  # Homepage is a Flagger target like umami: the selector keys on
  # app.kubernetes.io/instance (NOT /name) because Flagger's default
  # --selector-labels derives app.kubernetes.io/name=homepage-primary on the
  # primary Deployment that serves traffic, while instance=homepage stays intact
  # on its pods. The disruption controller sums the scales of every controller
  # this selector matches (homepage-primary + the source Deployment, which
  # Flagger keeps at 0 between rollouts), so maxUnavailable: 1 permits exactly
  # one eviction at the steady state and stays 1-at-a-time during a rollout.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: homepage
