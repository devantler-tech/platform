apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: private-mail-admin
  namespace: private-mail
spec:
  # Recreating the generator's cache must never rotate a durable administrator.
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: private-mail-generated-admin
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/private-mail/admin
          property: password
