apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: private-mail
  namespace: private-mail
spec:
  endpointSelector:
    matchLabels:
      app: private-mail
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: private-mail
            app: private-mail-setup
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # Preparation has no outbound mail, remote lookup or telemetry dependency.
  # Deny takes precedence over additive namespace grants such as allow-dns.
  egressDeny:
    - toEntities:
        - all
  egress: []
