apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: private-mail
  namespace: private-mail
  labels:
    # A single management-only preparation instance owns its local datastore.
    # Public mail activation must separately establish its availability model.
    platform.devantler.tech/replica-floor: exempt
  # Resource-scoped Checkov dispositions. The overlay patches carry their own, numbered after these
  # so the merged object keeps every reason. The Trivy counterparts are in .trivyignore.yaml.
  annotations:
    checkov.io/skip1: "CKV_K8S_40=UID 2000 is the stalwart user baked into the digest-pinned Stalwart image (stalwart:x:2000:2000), which also owns the mail store"
    checkov.io/skip2: "CKV_K8S_25=NET_BIND_SERVICE must stay in the bounding set for the Stalwart binary's effective file capability to execute; every other capability is dropped"
    checkov.io/skip3: "CKV_K8S_35=Stalwart's recovery mode takes its administrator credential from the STALWART_RECOVERY_ADMIN environment variable"
spec:
  serviceName: private-mail
  replicas: 1
  selector:
    matchLabels:
      app: private-mail
  template:
    metadata:
      labels:
        app: private-mail
    spec:
      serviceAccountName: private-mail
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: private-mail
          image: ghcr.io/stalwartlabs/stalwart:v0.16.27@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/stalwart/config.json"]
          env:
            - name: STALWART_RECOVERY_MODE
              value: "1"
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: private-mail-admin
                  key: credential
            - name: STALWART_RECOVERY_MODE_PORT
              value: "8080"
          ports:
            - name: management
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz/live
              port: management
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Required by the upstream binary's effective file capability,
              # even when recovery mode binds only the unprivileged port.
              add: [NET_BIND_SERVICE]
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions: {}
          volumeMounts:
            - name: datastore
              mountPath: /etc/stalwart
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: datastore
          configMap:
            name: private-mail-datastore
        - name: data
          persistentVolumeClaim:
            claimName: private-mail-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
