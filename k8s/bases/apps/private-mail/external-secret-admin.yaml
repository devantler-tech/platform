apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: private-mail-admin
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: private-mail-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credential: '{{ printf "admin:%s" .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: infrastructure/email/admin
        property: password
