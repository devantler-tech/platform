apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately absent from bases/apps/kustomization.yaml (#5288).
# This preparation bundle serves only the internal recovery API, never mail.
resources:
  - ../private-mail-storage/
  - password-admin.yaml
  - external-secret-generated-admin.yaml
  - push-secret-admin.yaml
  - external-secret-admin.yaml
  - config-map.yaml
  - service-account.yaml
  - stateful-set.yaml
  - service.yaml
  - pod-disruption-budget.yaml
  - cilium-network-policy.yaml
patches:
  # A serving consumer must wait for binding, including during activation.
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: private-mail-data
      namespace: private-mail
    patch: |-
      - op: remove
        path: /metadata/labels/platform.devantler.tech~1storage-stage
