# The github-config app's source + sync — the same delivery pattern as every
# other app/tenant (cosign-verified OCI artifact → namespace-scoped
# Kustomization), but the artifact carries Crossplane managed resources (the
# org's desired GitHub state) instead of a workload. The desired state lives in
# devantler-tech/.github under deploy/ and is published as a signed artifact by
# that repo's cd.yaml on v* tags.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: github-config
  namespace: github-config
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  # .github is an invalid OCI path component (leading dot), so the artifact is
  # published under the `github-config` name — see devantler-tech/.github cd.yaml.
  # No secretRef: the package is public (non-secret org config), so it is pulled
  # anonymously — the tenant needs no GHCR pull credential.
  url: oci://ghcr.io/devantler-tech/github-config/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Keyless-signed by the shared publish-manifests workflow that .github's
      # cd.yaml calls. Signing runs INSIDE that workflow, so the cosign OIDC
      # subject is that workflow's path, NOT .github's own cd.yaml — same
      # convention as the publish-app.yaml-signed app artifacts.
      #
      # The ref part accepts only a 40-hex commit SHA or a release tag, so an
      # artifact signed from a floating ref (e.g. @main) does not verify.
      # Consumers pin the workflow by SHA, so only the SHA branch is exercised
      # today; the tag branch is kept so a tag-pinned caller also verifies.
      # cosign's keyless attestation verification rejects MULTIPLE identity
      # entries outright ("unsupported: multiple identities are not supported at
      # this time"), so any future alternation must stay inside one subject
      # regex.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/actions/\.github/workflows/publish-manifests\.yaml@([0-9a-f]{40}|refs/tags/v.+)$'
