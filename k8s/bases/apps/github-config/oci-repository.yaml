# The github-config app's source + sync — the same delivery pattern as every
# other app/tenant (cosign-verified OCI artifact → namespace-scoped
# Kustomization), but the artifact carries Crossplane managed resources (the
# org's desired GitHub state) instead of a workload. The desired state lives in
# devantler-tech/.github under deploy/ and is published as a signed artifact by
# that repo's cd.yaml on v* tags.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: github-config
  namespace: github-config
  labels:
    app.kubernetes.io/managed-by: ksail
    platform.devantler.tech/tenant-source: "true"
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  # .github is an invalid OCI path component (leading dot), so the artifact is
  # published under the `github-config` name — see devantler-tech/.github cd.yaml.
  # No secretRef: the package is public (non-secret org config), so it is pulled
  # anonymously — the tenant needs no GHCR pull credential.
  url: oci://ghcr.io/devantler-tech/github-config/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Generated from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. Accept the deployed artifact
      # signer and this consumer's current publish-workflow pin in one identity.
      # Regeneration updates the pair and the approved set in the same PR.
      # Its own-release alternative is narrower than the other consumers' (#6265,
      # devantler-tech/.github#926): exactly .github's cd.yaml on a release tag.
      # devantler-tech/.github hosts the shared reusable publishers, and a tag of a
      # reusable workflow carries that repository's identity whoever calls it, so
      # no other workflow file there is trusted, and .github's CI keeps cd.yaml
      # uncallable.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/(actions/\.github/workflows/publish-manifests\.yaml@(1d726483facb9340655489913f609082677be8f5|ea4df9004d4ab43b6c9af5b0c5f55712f7211328)|\.github/\.github/workflows/publish-manifests\.yaml@(f33622708f9f25a32acb46cc419007e18a3223b3|d70d50665465117f01104313e53057374a96a1a3)|\.github/\.github/workflows/cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?)$'
