---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-config
  namespace: github-config
  labels:
    app.kubernetes.io/managed-by: ksail
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 1m
  timeout: 5m
  retryInterval: 2m
  path: .
  prune: true
  # Applying the signed artifact must succeed, but asynchronous GitHub API
  # operations (including manual repository bootstrap) cannot gate app delivery.
  # Crossplane's Synced condition is monitored by crossplane-sync-alert instead.
  wait: false
  # Immutable conflicts require an operator plan; individual Jobs opt into recreation.
  force: false
  # Runs as the app SA: the GitHub managed resources are applied with only the
  # namespace-scoped authority in rbac.yaml. This Kustomization is itself applied
  # by the `apps` Flux Kustomization; it must NOT dependsOn it (deadlock) — it
  # retries benignly until the provider (infrastructure layer) has established
  # the namespaced CRDs.
  serviceAccountName: github-config
  sourceRef:
    kind: OCIRepository
    name: github-config
  targetNamespace: github-config
