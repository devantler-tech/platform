---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: data-product-controller-contract-probe
      namespace: data-product-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: data-product-controller-contract-probe
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: storage.platform.devantler.tech/migration-pool
                          operator: In
                          values: [v1, v2]
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
                        - key: ksail.io/autoscaled
                          operator: DoesNotExist
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: storage.platform.devantler.tech/migration-pool
                          operator: In
                          values: [v1, v2]
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: data-product-controller
                        app.kubernetes.io/instance: data-product-controller
                        app.kubernetes.io/component: contract-probe
