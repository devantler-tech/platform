---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../longhorn-v2-engine-settings/
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn
        namespace: longhorn-system
      spec:
        values:
          dataEngineMode: v2-only
