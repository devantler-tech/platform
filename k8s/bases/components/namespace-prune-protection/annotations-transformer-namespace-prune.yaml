---
# Protects a Namespace from Flux garbage collection.
#
# WHY THIS IS SEPARATE FROM THE PVC/HelmRelease TRANSFORMER.
#
# #3168 protects persistent state from a SPECULATIVE production deploy: the merge
# queue applies a PR's removals to prod before it merges, and a PVC deletionTimestamp
# survives queue eviction, so re-publishing main cannot un-delete it. Namespace
# protection is part of that because deleting a namespace cascades to its PVCs
# REGARDLESS of the PVC's own annotation -- it is what makes the PVC annotation real.
#
# That reasoning is about DATA. A namespace holding no persistence has none to lose,
# and blanket-protecting it means removing a tenant from Git can never delete it: Flux
# drops it from inventory and leaves it running. Measured on `doggy-countdown` (#3367),
# whose site served for a day after its manifests were removed.
#
# So this is OPT-IN. A base that owns persistence includes it; a stateless tenant does
# not, and removing that tenant's directory cascades on its own.
#
# 🔴 STATEFULNESS CANNOT BE DERIVED FROM THIS REPOSITORY'S RENDER, WHICH IS WHY THE
#    OPT-IN IS EXPLICIT RATHER THAN COMPUTED.
#
# A tenant's workload arrives from its OWN OCI artifact, so the platform renders only
# its plumbing. `wedding-app` renders no PVC, no HelmRelease and no CNPG Cluster here,
# yet its namespace holds a three-PVC Postgres cluster owned by a CNPG `Cluster` that
# lives in the tenant repo. A rule that inferred "stateless" from this repo's manifests
# would therefore strip protection from the namespace holding the wedding database.
# `scripts/tests/test-pvc-prune-safety.sh` closes that gap by checking LIVE PVCs.
apiVersion: builtin
kind: AnnotationsTransformer
metadata:
  name: namespace-prune-protection
annotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
fieldSpecs:
  - kind: Namespace
    path: metadata/annotations
    create: true
