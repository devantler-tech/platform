---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - oci-repository.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn
        namespace: longhorn-system
      spec:
        chart: null
        chartRef:
          kind: OCIRepository
          name: longhorn-platform
        values:
          dataEngineMode: v1-capable
          image:
            longhorn:
              manager:
                registry: ghcr.io
                repository: devantler-tech/platform-longhorn-manager
                tag: v1.13.0-platform.8@sha256:9fb91fe656c76f7e12a07413d8e4370ff5b2733291d388edb6882728b6424ce0
          longhornManager:
            updateStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 1
