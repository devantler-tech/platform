# Lets the observability detector read the one watched Umami CronJob and the Jobs
# it created. Read-only: get on that CronJob by name, list on Jobs in this
# namespace (Jobs cannot be filtered by owner server-side). No pods, no logs, no
# secrets, no write verb.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-failure-alert
  namespace: umami
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
    resourceNames:
      - umami-provision-tenants
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - list
