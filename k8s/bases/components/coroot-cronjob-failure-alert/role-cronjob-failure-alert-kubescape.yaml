# Lets the observability detector read the Kubescape host-data cleanup CronJob
# and the Jobs it created. Read-only and resource-name scoped where Kubernetes
# supports it; Jobs require namespace-wide list for owner-reference filtering.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-failure-alert
  namespace: kubescape
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
    resourceNames:
      - kubescape-hostdata-cleanup
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - list
