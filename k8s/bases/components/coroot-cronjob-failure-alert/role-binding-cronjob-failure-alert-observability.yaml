# Grants the detector read-only access to the watched observability CronJob and
# its Jobs. The subject is explicit and singular.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-failure-alert
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronjob-failure-alert
subjects:
  - kind: ServiceAccount
    name: cronjob-failure-alert
    namespace: observability
