# Grants the observability detector read-only access to the watched Umami
# CronJob and its Jobs. The cross-namespace subject is explicit and singular.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-failure-alert
  namespace: umami
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronjob-failure-alert
subjects:
  - kind: ServiceAccount
    name: cronjob-failure-alert
    namespace: observability
