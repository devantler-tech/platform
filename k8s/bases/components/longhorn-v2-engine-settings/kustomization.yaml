---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../longhorn-platform-runtime/
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn
        namespace: longhorn-system
      spec:
        values:
          defaultSettings:
            v1DataEngine: false
            v2DataEngine: true
          persistence:
            createStorageClass: false
