---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: ksail-operator
      namespace: ksail-operator
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: ksail-operator
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ksail-operator
            spec:
              template:
                spec:
                  affinity:
                    # Keep old and new operator replicas apart while the
                    # storage runtime needs temporary memory headroom.
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - topologyKey: kubernetes.io/hostname
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/component: operator
                              app.kubernetes.io/instance: ksail-operator
                              app.kubernetes.io/name: ksail-operator
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: kubernetes.io/hostname
                                operator: NotIn
                                values: [prod-worker-2, prod-worker-3]
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: crossplane-sync-exporter
      namespace: observability
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crossplane-sync-exporter
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: prod-worker-1
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: policy-reporter
      namespace: policy-reporter
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: policy-reporter
      spec:
        values:
          ui:
            # Keep both dashboards available while their replicas move off
            # the workers that need memory for the V2 instance managers.
            updateStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: storage.platform.devantler.tech/migration-pool
                          operator: In
                          values: [v1, v2]
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
                        - key: ksail.io/autoscaled
                          operator: DoesNotExist
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: storage.platform.devantler.tech/migration-pool
                          operator: In
                          values: [v1, v2]
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: policy-reporter-ui
                    topologyKey: kubernetes.io/hostname
