---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: ksail-operator
      namespace: ksail-operator
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: ksail-operator
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ksail-operator
            spec:
              template:
                spec:
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: kubernetes.io/hostname
                                operator: NotIn
                                values: [prod-worker-2, prod-worker-3]
