# Tenant RGD (#1932) — the KRO ResourceGraphDefinition that expands a
# small typed `Tenant` declaration into the full platform-side control-plane
# skeleton every tenant otherwise hand-copies (namespace, Flux-impersonated SA +
# RoleBinding, cosign-verified OCIRepository, impersonating Kustomization,
# default-deny NetworkPolicy), with optional
# external-dns RBAC and SOPS decryption behind `includeWhen` toggles.
#
# STATIC SECURITY GATE (#3055): scripts/scan-rgd-templates.sh extracts every
# spec.resources[].template as a first-class Kubernetes manifest and runs the full Trivy
# misconfiguration policy set without the repository ignorefile. Per-resource, per-cause findings
# and complete resource-graph and committed-instance digests are ratcheted in
# scripts/rgd-template-static-scan-baseline.tsv; explicit placement and image policies run too.
# scripts/tests/test-rgd-template-static-scan.sh proves discovery, cause, privilege, resource, and
# namespace regressions are rejected on pull requests, exact merge-group revisions, direct pushes to
# main, and manual production dispatches. Each RGD must be the only document in its file and opt out
# of Flux substitution. Discovery includes YAML plus every readable local file referenced by a
# Kustomize build, regardless of suffix; remote resources fail closed. Kustomize builds and Flux
# Kustomization CRs may consume this graph and its instances but may not patch, transform (including
# custom var references), replace, or override the substitution opt-out anywhere in `k8s`: the
# scanner rejects inline/path-backed mutations, ambiguous selectors, and post-render Flux patches.
# Never exclude this directory when adding a template.
#
# Onboarding a tenant becomes a ~5-line `Tenant` CR instead of a ~7-file copy:
#
#   apiVersion: kro.run/v1alpha1
#   kind: Tenant
#   metadata: { name: ascoachingogvaner }
#   spec:
#     name: ascoachingogvaner
#     externalDns: true
#
# The OCIRepository URL (oci://ghcr.io/devantler-tech/<name>/manifests) and the
# cosign OIDC subject (the tenant's own repository's release workflow on a
# release tag) are platform invariants — derived from the tenant name — so they
# are templated/fixed here rather than re-declared per tenant. Add an override
# field only if a future tenant diverges from the convention.
#
# A tenant follows its own signed release tags (ADR 0019, monorepo#5094): the
# source takes the newest stable release, so it reaches production without a
# platform change. The fixed range preserves the installed Tenant API shape.
#
# Lands in the `infrastructure` layer (which `dependsOn` infrastructure-controllers
# where the KRO controller installs the RGD CRD) — a CR of an RGD-defined kind
# cannot share a Flux Kustomization with the controller that installs its CRD.
# Pre-1.0 KRO (v1alpha1): keep render-diffable; the `Tenant` instances arrive in
# the local-first pilot (step 3 of #1932), not here.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: tenant.kro.run
  labels:
    app.kubernetes.io/managed-by: ksail
  annotations:
    # Exempt from Flux postBuild envsubst. The `infrastructure` Kustomization
    # runs variable substitution (substituteFrom variables-base/variables-cluster),
    # which would try to expand this RGD's KRO `${...}` CEL expressions as Flux
    # variables and fail ("envsubst error: variable substitution failed: missing
    # closing brace"). Every `${...}` below is a KRO expression resolved by the
    # kro controller at instance time — this resource needs no Flux variables —
    # so substitution is disabled for it wholesale.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  schema:
    apiVersion: v1alpha1
    kind: Tenant
    scope: Namespaced
    # Nested types for the optional multi-tenancy guardrails (#2522). Each
    # carries its own `enabled` toggle rather than relying on CEL `has()`
    # presence-detection on the parent object — this mirrors the RGD's own
    # already-live `externalDns`/`sops` boolean-toggle pattern (and kro's own
    # documented convention, e.g. `schema.spec.ingress.enabled`) instead of an
    # unproven pattern, since KRO's structural-schema defaulting is guaranteed
    # to materialise a nested boolean default even when the tenant omits the
    # parent field entirely, but `has()` on a whole optional object is not
    # exercised anywhere else in this file.
    types:
      TenantSource:
        # Retired pin fields. KRO refuses a Tenant API update that removes a field the
        # installed API still has, so they stay in the schema, unchanged. The graph
        # reads neither, and the `source` validation below refuses any value but empty.
        digest: 'string | default="" maxLength=71 pattern="^$|^sha256:[0-9a-f]{64}$"'
        publisherRevision: 'string | default="" maxLength=40 pattern="^$|^[0-9a-f]{40}$"'
        # An active application cannot be switched off through this control.
        reconcileApplication: 'boolean | default=true validation="self || !oldSelf"'
      TenantResourceQuota:
        enabled: boolean | default=false
        # Total across all pods in the namespace (both request AND limit —
        # kept as one pair per field to keep the CR small; split into
        # separate requests/limits inputs only if a tenant needs the nuance).
        cpu: string | default="4"
        memory: string | default="4Gi"
        pods: string | default="20"
      TenantLimitRange:
        enabled: boolean | default=false
        # Per-container defaults applied to any Pod that does not set its own
        # requests/limits — the standard Kubernetes LimitRange `default` /
        # `defaultRequest` pair.
        defaultCPU: string | default="500m"
        defaultMemory: string | default="512Mi"
        defaultRequestCPU: string | default="100m"
        defaultRequestMemory: string | default="128Mi"
    spec:
      # Tenant name — used verbatim as the namespace, ServiceAccount,
      # OCIRepository/Kustomization name, and as the repository the release
      # signature must come from. Required. The graph validates it as a DNS
      # label itself (#6306) instead of relying on the Namespace it also names.
      # The description makes KRO install the rule: its compatibility check
      # ignores a CEL rule alone (platform#6535).
      name: >-
        string | description="A DNS label: lowercase letters, digits and hyphens, at most 63 characters." validation="size(self) <= 63 && self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
      # The tenant runs its own external-dns instance (e.g. ascoachingogvaner's
      # simply.com zone) and needs the privileged cross-namespace reads granted
      # by the tenant-external-dns ClusterRoles.
      externalDns: boolean | default=false
      # The tenant's Flux Kustomization decrypts SOPS-encrypted manifests from
      # its artifact (e.g. wedding-app). Requires a `sops-age` Secret in the
      # tenant namespace, applied separately — secret material is NEVER inlined
      # into a Tenant spec.
      sops: boolean | default=false
      # Opt-in own-namespace WebApp reconciliation. Admission also binds the
      # parent and generated child ownership; no existing tenant opts in here.
      webApp: boolean | default=false
      # The releases the tenant follows. Trust comes from the signature, not a
      # pin: the source accepts only the tenant's own release workflow on a
      # release tag (ADR 0017, ADR 0019).
      # Publish the new meaning in the API schema. KRO v0.10.0 detects the
      # description change and updates the CRD in both directions. Its default
      # comparison does not detect an isolated change to a CEL rule.
      source: >-
        TenantSource | default={} description="Follows signed stable releases. Legacy pin fields must be empty."
        validation="(!has(self.digest) || self.digest == '') && (!has(self.publisherRevision) || self.publisherRevision == '')"
      # Standard multi-tenancy guardrails (#1932 follow-up #2522): a
      # namespace-wide ResourceQuota and a per-container default LimitRange.
      # Both default to `enabled: false` — no behaviour change for existing
      # tenants until a tenant opts in.
      resourceQuota: TenantResourceQuota
      limitRange: TenantLimitRange
  resources:
    # Admission reserves the preview name and prevents it from adopting a
    # namespace. The preview can fetch its signed source without application
    # or DNS authority while its private routing is prepared.
    # --- Core skeleton --------------------------------------------------
    - id: tenantNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "${schema.metadata.name == schema.spec.name + '-dev' ? schema.metadata.name : schema.spec.name}"
          labels:
            app.kubernetes.io/managed-by: kro
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
    - id: serviceAccount
      includeWhen:
        - ${schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        automountServiceAccountToken: false
    - id: roleBinding
      includeWhen:
        - ${schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          # Scoped tenant namespace-admin role (aggregated from *-tenant-edit
          # pieces) — like the built-in `edit` but WITHOUT pods/exec, so tenants
          # do not trip Kubescape C-0002. See cluster-roles/tenant-edit.yaml.
          kind: ClusterRole
          name: tenant-edit
        subjects:
          - kind: ServiceAccount
            name: ${serviceAccount.metadata.name}
            namespace: ${tenantNamespace.metadata.name}
    - id: webAppBinding
      includeWhen:
        - ${schema.spec.webApp && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: tenant-webapp-edit
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: tenant-webapp-edit
        subjects:
          - kind: ServiceAccount
            name: ${serviceAccount.metadata.name}
            namespace: ${tenantNamespace.metadata.name}
    # Default-deny NetworkPolicy mirroring the runtime Kyverno-generated
    # CiliumNetworkPolicy, so the static Kubescape scan sees the namespace as
    # network-restricted (C-0054). Behaviourally redundant with the runtime
    # default-deny (per-workload allow CiliumNetworkPolicies still apply
    # additively), so it adds no new restriction at runtime.
    # Kyverno owns `default-deny` in every namespace. Keep the constructor's
    # independent floor under a distinct name so its managed metadata cannot
    # fight Kyverno's synchronized resource on every reconciliation.
    - id: defaultDeny
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: tenant-default-deny
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
            - Egress
    # --- Optional multi-tenancy guardrails (#2522) -------------------------
    # Namespace-wide ResourceQuota, gated on `resourceQuota.enabled` (default
    # false — omitted ⇒ no behaviour change for existing tenants). Combines
    # requests and limits into one value per resource so the CR stays small;
    # split into separate inputs only if a tenant needs the extra nuance.
    - id: resourceQuota
      includeWhen:
        - ${schema.spec.resourceQuota.enabled}
      template:
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          hard:
            requests.cpu: ${schema.spec.resourceQuota.cpu}
            requests.memory: ${schema.spec.resourceQuota.memory}
            limits.cpu: ${schema.spec.resourceQuota.cpu}
            limits.memory: ${schema.spec.resourceQuota.memory}
            pods: ${schema.spec.resourceQuota.pods}
    # Per-container default requests/limits, gated on `limitRange.enabled`
    # (default false). Applies only to a Container that omits its own
    # requests/limits — an explicit workload spec always wins.
    - id: limitRange
      includeWhen:
        - ${schema.spec.limitRange.enabled}
      template:
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          limits:
            - type: Container
              default:
                cpu: ${schema.spec.limitRange.defaultCPU}
                memory: ${schema.spec.limitRange.defaultMemory}
              defaultRequest:
                cpu: ${schema.spec.limitRange.defaultRequestCPU}
                memory: ${schema.spec.limitRange.defaultRequestMemory}
    - id: ociRepository
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        spec:
          interval: 1m
          ref:
            semver: ">=0.0.0"
            # Stable releases only (`X.Y.Z`).
            semverFilter: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          url: oci://ghcr.io/devantler-tech/${schema.spec.name}/manifests
          verify:
            provider: cosign
            matchOIDCIdentity:
              # Keyless-signed by the workflow the tenant releases from, in its
              # OWN repository, devantler-tech/<spec.name>, on a strict
              # OCI-semver release tag (ADR 0017, #6265; ADR 0019; #6306): its
              # `cd.yaml` by convention, and `publish-runtime.yaml` for
              # business-site, the one tenant that releases from another
              # workflow. Any other workflow file of the repository does not
              # match.
              # Release tags cannot be moved or deleted, only the release
              # process may create one, and the publish action signs only tags
              # on `main`. The repository is the tenant name because the
              # artifact URL above is oci://ghcr.io/devantler-tech/<name>/…: a
              # tenant publishes from the repository its package is named
              # after. The name is regex-escaped (`.` and `-`). The graph
              # validates it as a DNS label (the `name` field above), so no
              # other regex metacharacter can reach the subject. Another
              # repository, the shared publisher, a branch or a non-release tag
              # does not match. cosign's keyless
              # verification rejects MULTIPLE identity entries outright, so any
              # future alternation must stay inside one subject regex.
              - issuer: '^https://token\.actions\.githubusercontent\.com$'
                subject: '${"^https://github\\.com/devantler-tech/" + schema.spec.name.replace(".", "\\.").replace("-", "\\-") + "/\\.github/workflows/" + (schema.spec.name == "business-site" ? "publish-runtime" : "cd") + "\\.yaml@refs/tags/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$"}'
    # --- Flux Kustomization (one of two variants by `sops`) ---------------
    # The impersonating Kustomization that reconciles the tenant's own artifact
    # under its namespaced SA (bound to the `tenant-edit` role). Two variants because the SOPS `decryption`
    # block is a field of the Kustomization spec (not a separable resource) and
    # must be present ONLY for SOPS tenants — a `decryption.secretRef: sops-age`
    # on a tenant with no `sops-age` Secret would wedge reconciliation.
    - id: kustomization
      includeWhen:
        - ${schema.spec.source.reconcileApplication && !schema.spec.sops && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
          annotations:
            ksail.devantler.tech/reconcile-exclude: "true"
        spec:
          interval: 1m
          timeout: 5m
          retryInterval: 2m
          path: .
          prune: true
          wait: true
          force: false
          # A tenant that ships a CNPG database (wedding-app does) would
          # otherwise fail this Kustomization for the whole of any rolling
          # update — CNPG rolls every instance on an operator, barman-cloud
          # sidecar, or PostgreSQL image change, all routine Renovate bumps —
          # and a tenant health-check failure evicts every PR from the merge
          # queue. Same "the database is SERVING" gate as the cluster-level
          # `apps`/`infrastructure` Kustomizations; see the rationale there.
          healthCheckExprs:
            - apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary) && status.currentPrimary != ''
          serviceAccountName: ${serviceAccount.metadata.name}
          sourceRef:
            kind: OCIRepository
            name: ${ociRepository.metadata.name}
          targetNamespace: ${tenantNamespace.metadata.name}
    - id: kustomizationSops
      includeWhen:
        - ${schema.spec.source.reconcileApplication && schema.spec.sops && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ${schema.spec.name}
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
          annotations:
            ksail.devantler.tech/reconcile-exclude: "true"
        spec:
          interval: 1m
          timeout: 5m
          retryInterval: 2m
          path: .
          prune: true
          wait: true
          force: false
          # A tenant that ships a CNPG database (wedding-app does) would
          # otherwise fail this Kustomization for the whole of any rolling
          # update — CNPG rolls every instance on an operator, barman-cloud
          # sidecar, or PostgreSQL image change, all routine Renovate bumps —
          # and a tenant health-check failure evicts every PR from the merge
          # queue. Same "the database is SERVING" gate as the cluster-level
          # `apps`/`infrastructure` Kustomizations; see the rationale there.
          healthCheckExprs:
            - apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary) && status.currentPrimary != ''
          serviceAccountName: ${serviceAccount.metadata.name}
          sourceRef:
            kind: OCIRepository
            name: ${ociRepository.metadata.name}
          targetNamespace: ${tenantNamespace.metadata.name}
          decryption:
            provider: sops
            secretRef:
              name: sops-age
    # --- external-dns RBAC (only when the tenant runs external-dns) -------
    # Privileged cross-namespace reads a tenant's `tenant-edit` RoleBinding cannot
    # self-grant: HTTPRoutes (own namespace), the shared Gateway (kube-system),
    # and Namespaces (cluster-wide informer). Capabilities live in the
    # tenant-external-dns / tenant-external-dns-global ClusterRoles
    # (infrastructure/cluster-roles/). The tenant creates the `external-dns` SA
    # itself in its own artifact; only these bindings are platform territory.
    - id: externalDnsHttproutes
      includeWhen:
        - ${schema.spec.externalDns && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.spec.name}-external-dns
          namespace: ${tenantNamespace.metadata.name}
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: tenant-external-dns
        subjects:
          - kind: ServiceAccount
            name: external-dns
            namespace: ${tenantNamespace.metadata.name}
    - id: externalDnsGateway
      includeWhen:
        - ${schema.spec.externalDns && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.spec.name}-external-dns
          namespace: kube-system
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: tenant-external-dns
        subjects:
          - kind: ServiceAccount
            name: external-dns
            namespace: ${tenantNamespace.metadata.name}
    - id: externalDnsNamespaces
      includeWhen:
        - ${schema.spec.externalDns && schema.metadata.name != schema.spec.name + '-dev'}
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: ${schema.spec.name}-external-dns
          labels:
            app.kubernetes.io/managed-by: kro
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: tenant-external-dns-global
        subjects:
          - kind: ServiceAccount
            name: external-dns
            namespace: ${tenantNamespace.metadata.name}
