---
# The Devantler Tech icon for the Policy Reporter UI. helm-release.yaml mounts
# each key with subPath over the file of the same name the UI ships in
# /var/run/ko/ui, which it serves at /<key>:
#   - logo.png, the square logo in the top bar: the icon at 180x180, byte for
#     byte devantler-tech-icon-180.png (docs/brand.md);
#   - favicon.ico, the tab icon: the icon at 32, 64 and 180 px, each a PNG.
# The UI's own ui.logo.path setting is not used: v2.9.1 drops it from the
# config it sends the browser, which then always loads ./logo.png.
#
# A pod keeps the subPath copy it started with, so a change here must also
# change ui.podAnnotations platform.devantler.tech/brand-sha256 in
# helm-release.yaml (the sha256 of the new logo.png) to restart the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-reporter-brand
  namespace: policy-reporter
binaryData:
  favicon.ico: 
  logo.png: 
