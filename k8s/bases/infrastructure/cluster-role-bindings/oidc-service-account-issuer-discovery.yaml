# Lets the maintainer read the service-account issuer's discovery document and
# public keys. The kagent lane's Anthropic federation trusts those keys inline,
# so they are re-registered from this read after the cluster's signing key
# changes (docs/dr/crypto-custody.md). The built-in role grants only those two
# read-only URLs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-service-account-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "oidc:${admin_email}"
