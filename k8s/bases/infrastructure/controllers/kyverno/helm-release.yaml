apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
    helm.toolkit.fluxcd.io/helm-test: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
  # Kyverno 1.19.2 leaves its successful migration Job behind: the chart comments out
  # that hook's deletion policy but still deletes its service account, so the Job names
  # an account that no longer exists and misleads posture scans (#5491). Delete it on
  # success only, so a failed migration keeps its diagnostics. Hooks reach this patch
  # only through the combined strategy, which is named because the default can change.
  postRenderStrategy: combined
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: batch
              version: v1
              kind: Job
              name: kyverno-migrate-resources
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1hook-delete-policy
                value: before-hook-creation,hook-succeeded
  # https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
  values:
    # --- reports-controller memory growth (Coroot "memory leak") --------------
    # The reports-controller's memory scales with the number of (Cluster)PolicyReports
    # it holds and aggregates. The slow, unbounded growth Coroot flags is the
    # background scanner emitting one report per live resource for EVERY resource
    # in the cluster -- because the chart ships `--skipResourceFilters=true`
    # (features.backgroundScan.skipResourceFilters), so background scan IGNORES
    # config.resourceFilters and reports on everything, including extremely
    # high-churn ephemeral objects (leader-election Leases renewing every few
    # seconds across cilium/flux/kyverno/cert-manager/KEDA/flagger/cnpg/operators,
    # plus the controller's own report kinds). See kyverno/kyverno#13335 / #11746.
    #
    # Fix (root cause, not a limit bump): make background scan HONOR the resource
    # filters, then exclude the highest-churn kinds. This is safe for enforcement
    # because skipResourceFilters only affects BACKGROUND SCAN reporting --
    # ADMISSION-time validation (pod-security, etc.) is unaffected, and we do NOT
    # filter Pod/Deployment/etc., so those still get background-scan reports.
    #
    # For the reports/background controllers, cut report VOLUME (the root-cause
    # lever for the slow growth here) rather than bumping a limit. NB: Kyverno
    # controllers are NOT VPA-managed -- Kyverno excludes its own namespace from
    # auto-vpa to avoid an eviction deadlock -- so the admission controller is
    # given an explicit limit below (see the admissionController.container.resources block
    # and the OOM incident it documents); the chart default proved too low.
    features:
      # Preserve producer severity for every controller; colored text lets a
      # resource kind such as "Alert" promote an informational notice to fatal.
      logging:
        format: json
      backgroundScan:
        # Honor config.resourceFilters during background scans (chart default is
        # true = filters skipped = report-per-resource for everything). With this
        # false, the chart's default filters (Event, ReplicaSet, EphemeralReport,
        # the kyverno namespace, ...) plus the additions below actually suppress
        # background-scan reports for those kinds; the entries dropped under
        # resourceFiltersExclude below (Node, and the three Kubernetes system
        # namespaces) are scanned.
        skipResourceFilters: false
    config:
      # These three virtual review APIs are already in the chart's resourceFilters.
      # Skip their no-op webhook round trip before Kyverno handles the request:
      # discovery of aggregated APIs can itself need delegated authorization.
      # Keep other review types and same-named resources in other groups in scope.
      matchConditions:
        - name: exclude-already-filtered-auth-reviews
          expression: >-
            !((request.resource.group == "authentication.k8s.io" &&
            request.resource.resource == "tokenreviews") ||
            (request.resource.group == "authorization.k8s.io" &&
            request.resource.resource in ["subjectaccessreviews", "selfsubjectaccessreviews"]))
      # Additive (chart `concat`s this onto its ~80-entry default resourceFilters
      # -- nothing default is lost, and it stays correct across chart upgrades).
      # Exclude high-churn kinds that have ZERO matching policy in this repo, so
      # nothing is lost by skipping them in background scan:
      resourceFiltersInclude:
        # Leader-election leases churn every few seconds cluster-wide -- the
        # dominant driver of the slow report growth.
        - "[Lease,*,*]"
        # The reports-controller's own output/intermediate report kinds: stop it
        # background-scanning (and re-reacting to) the reports it writes.
        - "[PolicyReport,*,*]"
        - "[ClusterPolicyReport,*,*]"
        - "[AdmissionReport,*,*]"
        - "[ClusterAdmissionReport,*,*]"
        - "[BackgroundScanReport,*,*]"
        - "[ClusterBackgroundScanReport,*,*]"
      # Subtractive (chart drops these entries from its default resourceFilters).
      # Resource filters match on the KIND STRING alone -- no API group -- so the
      # default `[Node,*,*]` entry also swallowed Longhorn's nodes.longhorn.io
      # "Node" CRs and silently disabled BOTH halves of the autoscale-node
      # storage drain (restrict-storage-to-baseline-workers admission rule +
      # drain-autoscale-node-storage retrofit): the background controller
      # enumerated the autoscale Node CRs and tried to create retrofit URs, but
      # rejected every one at engine/internal/match.go with "configuration
      # resource filters doesn't match resource" (observed live 2026-07-02 at
      # -v=4; #2392). Dropping the entry also lets policies match core v1 Nodes:
      # the prod-only label-baseline-workers / label-existing-baseline-workers
      # policies match `v1/Node` named prod-worker-* (with failurePolicy Ignore,
      # so a Kyverno outage never blocks Node registration). Node traffic stays
      # small — kubelet heartbeats go to the `nodes/status` subresource, and the
      # subresource filter `[Node/?*,*,*]` is untouched.
      #
      # The three Kubernetes system namespaces are dropped too, so background
      # scans report on them again (#4234): without this, no Kyverno policy has
      # evaluated anything in them since background scans started honouring the
      # filters. The webhooks' namespaceSelector still skips kube-system.
      # kube-public and kube-node-lease remain in admission scope: the bootstrap
      # Role in kube-public matches Enforce audit-privileged-rbac; node Leases
      # stay resource-filtered above. Other kinds can match other admission rules.
      # See docs/policy-reports.md for the recorded coverage/admission decision.
      # Every generate or mutate-existing policy excludes these three
      # namespaces explicitly, so nothing is created or changed in them.
      # `[*/*,kyverno,*]` stays: add-default-deny and add-default-limitrange do not
      # exclude kyverno, so dropping it would generate a default-deny policy in
      # Kyverno's own namespace and a LimitRange colliding with the Flux-owned one.
      resourceFiltersExclude:
        - "[Node,*,*]"
        - "[*/*,kube-system,*]"
        - "[*/*,kube-public,*]"
        - "[*/*,kube-node-lease,*]"
    # Restricted PSS baseline: kyverno's mutation policies exclude the kyverno namespace,
    # so we must set pod-level seccompProfile + runAsNonRoot via chart values.
    admissionController:
      replicas: ${kyverno_admission_replicas:=2}
      # Structured severity keeps colored trace flag values containing "error"
      # from becoming error events in Coroot, without reducing verbosity.
      featuresOverride:
        logging:
          format: json
          verbosity: 2
      # Explicit resources = the COLD-START FLOOR. Kyverno's global resourceFilters
      # exclude ns/kyverno from auto-vpa, so the admission controller was long left
      # on the chart-default limits.memory: 384Mi, which OOMKilled (exit 137) under
      # image-verification + policy-evaluation load; because the
      # verify-image-signatures webhooks are failurePolicy: Fail, the dead
      # controller then rejected every Pod/Deployment/Job CREATE cluster-wide (e.g.
      # ksail-operator FailedCreate -> stuck HelmRelease upgrade) until it
      # recovered. It is now ALSO VPA-managed via a static VPA in
      # providers/hetzner/infrastructure/vertical-pod-autoscalers/ (auto-vpa still can't reach
      # this namespace), which right-sizes it at steady state; these values remain
      # as the safe baseline a fresh pod starts on before VPA has a recommendation
      # (the 1Gi memory limit keeps that window well above the 384Mi OOM
      # threshold). The static admission VPA manages requests only and caps its
      # memory request at 1Gi, so recommendations cannot replace or exceed this
      # authored limit. In-place resize avoids routine eviction; replicas: 2
      # preserve availability while the PDB limits voluntary disruption to one
      # replica. The 1Gi limit above is the OOM safety boundary.
      container:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      rbac:
        clusterRole:
          extraResources:
            # Read only the owning WebApp for deletion admission. No mutation,
            # list/watch, Secret or other application-data authority is added.
            - apiGroups: ["kro.run"]
              resources: ["webapps"]
              verbs: ["get"]
            # The auto-vpa GeneratingPolicies generate VPA objects for every
            # Deployment, StatefulSet and DaemonSet. Kyverno needs RBAC on the
            # target resource type for generation to work.
            - apiGroups:
                - autoscaling.k8s.io
              resources:
                - verticalpodautoscalers
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            # The add-default-deny ClusterPolicy generates CiliumNetworkPolicy
            # objects in every namespace.
            - apiGroups:
                - cilium.io
              resources:
                - ciliumnetworkpolicies
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      podDisruptionBudget:
        enabled: true
        # Stays minAvailable: 1: ksail bootstrap-installs kyverno (ksail.yaml
        # policyEngine: Kyverno) with its default minAvailable PDB before Flux,
        # and the chart itself refuses to render both fields. Drain-safe at the
        # 2-replica admission floor. Exempt from validate-pdb-drain-safe.
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: kyverno
    backgroundController:
      replicas: ${kyverno_background_replicas:=1}
      # The chart auto-enables this controller's PDB whenever replicas > 1 and
      # defaults it to minAvailable: 1 -- the exact shape validate-pdb-drain-safe
      # flags. Pin the drain-safe house pattern (#1880/#1882) instead. The
      # explicit `minAvailable: null` is REQUIRED: Helm deep-merges these values
      # onto the chart defaults, so setting only maxUnavailable leaves the
      # default minAvailable: 1 in place and the chart's kyverno.pdb.spec helper
      # hard-fails the whole upgrade ("Cannot set both .minAvailable and
      # .maxUnavailable"); null deletes the default key at value coalescing.
      # At the local/CI default of 1 replica the chart renders no PDB at all.
      podDisruptionBudget:
        minAvailable: null
        maxUnavailable: 1
      # Coroot flagged the 2-replica background controller as co-located on a
      # single node (not resilient to node failure). Soft spread (same idiom as
      # admissionController above) lands the replicas on different nodes when
      # possible; ScheduleAnyway never blocks scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: background-controller
              app.kubernetes.io/instance: kyverno
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      rbac:
        clusterRole:
          extraResources:
            - apiGroups:
                - autoscaling.k8s.io
              resources:
                - verticalpodautoscalers
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - cilium.io
              resources:
                - ciliumnetworkpolicies
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            # disable-default-sa-automount mutates existing `default` SAs
            # in every namespace.
            - apiGroups:
                - ""
              resources:
                - serviceaccounts
              verbs:
                - get
                - list
                - watch
                - update
                - patch
    reportsController:
      replicas: ${kyverno_reports_replicas:=1}
      # The chart auto-enables this PDB whenever replicas > 1, defaulting to
      # minAvailable: 1. Flip it to the drain-safe house pattern
      # (maxUnavailable: 1, #1880/#1882); minAvailable must be nulled because
      # the chart refuses to render both fields. Unlike the admission
      # controller's PDB, this one is not ksail-bootstrap-owned, so there is
      # no server-side-apply conflict.
      podDisruptionBudget:
        minAvailable: null
        maxUnavailable: 1
      # Coroot flagged the 2-replica reports controller as co-located on a
      # single node. Soft spread (admissionController idiom) prefers a second
      # node; ScheduleAnyway never blocks scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: reports-controller
              app.kubernetes.io/instance: kyverno
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Changing this value rolls the reports controller pods through GitOps.
      # A reports controller that spent a long time failing on missing RBAC can
      # stay up but stop producing PolicyReports after the permission is fixed
      # (#3760). Bump the value to force a clean restart; never restart it by
      # hand, which Flux cannot see or record.
      podAnnotations:
        platform.devantler.tech/restart-generation: "1"
    cleanupController:
      replicas: ${kyverno_cleanup_replicas:=1}
      # Same drain-safe PDB flip as the reportsController above.
      podDisruptionBudget:
        minAvailable: null
        maxUnavailable: 1
      # Coroot flagged the 2-replica cleanup controller as co-located on a
      # single node. Soft spread (admissionController idiom) prefers a second
      # node; ScheduleAnyway never blocks scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
              app.kubernetes.io/instance: kyverno
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    crds:
      migration:
        # The released CLI image predates the Go 1.26.10 certificate-verification fix. This
        # build keeps its migration implementation, identity and arguments (#5542). Kyverno's
        # own webhooks skip this namespace, so the Talos pull rule is what requires this
        # image's signer on main; verify-app-images does not see this Pod.
        image:
          registry: ghcr.io
          repository: devantler-tech/platform-kyverno-migrate
          tag: v1.19.2-migration.1-eed5caab082e10a1ee7c02ac636b66f257c4cfb3@sha256:ee142d6feae09ff8970286261a17ce6f6e9eb0c848a601db31c78933a189ef42
        # The kyverno-migrate-resources post-upgrade hook job sets seccompProfile
        # only at the container level; our require-seccomp-profile ClusterPolicy
        # checks pod-level securityContext, so set it here too (chart default is {})
        # to keep the hook pod compliant and stop background-scan PolicyViolations.
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
