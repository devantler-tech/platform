# Namespace-scoped permission for Kyverno's background controller.
#
# The propagate-reloader-to-flagger-primary ClusterPolicy (cluster-policies, the
# next Flux layer) uses mutateExisting to patch one annotation onto Umami's
# Flagger primary Deployment. Kyverno checks this grant at policy admission, so
# the namespace and grant ship with infrastructure-controllers one layer before
# the policy. The apps layer must not co-own the Namespace.
#
# Keep this permission pinned to the one generated Deployment that currently
# needs the workaround. Kubernetes RBAC cannot limit patch/update to metadata
# annotations, so granting write on every Deployment would let a compromised
# background-controller token mutate arbitrary workload pod templates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno:background-controller:mutate-umami-primary
  namespace: umami
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - umami-umami-primary
    verbs:
      - get
      - update
      - patch
