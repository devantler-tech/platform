# Bind only Kyverno's background-controller ServiceAccount to the namespaced
# Umami mutation grant. A ClusterRole aggregation label would make the same
# resourceNames rule effective in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno:background-controller:mutate-umami-primary
  namespace: umami
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno:background-controller:mutate-umami-primary
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
