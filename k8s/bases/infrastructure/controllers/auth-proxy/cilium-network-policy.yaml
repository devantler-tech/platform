---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-auth-proxy
  namespace: oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app: auth-proxy
  ingress:
    # Authenticated traffic from oauth2-proxy
    - fromEndpoints:
        - matchLabels:
            app: oauth2-proxy
            k8s:io.kubernetes.pod.namespace: oauth2-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Longhorn UI and API: authenticated read traffic only. The path includes
    # the complete query string, so duplicate/extra action parameters fail
    # closed. These POST handlers only list or retrieve existing resources.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
            app: longhorn-ui
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              # HCM normalizes the scheme to HTTP on this plaintext hop.
              # Restore HTTPS only inside these existing Longhorn grants.
              # GET downloads can mutate Longhorn (support-bundle downloads
              # delete the bundle). Admit only the audited API read paths.
              - method: "^(GET|HEAD)$"
                path: '^/([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/[A-Za-z0-9_~-]+([.][A-Za-z0-9_~-]+)*[.](html|js|css|json|map|ico)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/[A-Za-z0-9_~-]+([.][A-Za-z0-9_~-]+)*[.](svg|png|jpe?g|gif|webp|woff2?|ttf|eot)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/(static|assets|fonts|images)/[A-Za-z0-9_-]+([./][A-Za-z0-9_-]+)*([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1(/(apiversions(/v1)?|schemas(/[A-Za-z0-9_-]+)?))?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/supportbundles/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/(settings|volumes|nodes|events|disktags|nodetags)(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/(engineimages|instancemanagers)(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/((backup)?backingimages|recurringjobs)(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/(snapshotgroups|orphans|shardgroups|shards)(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/(backup(targets|volumes)|system(backups|restores))(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/(volumeattachments)(/[A-Za-z0-9][A-Za-z0-9_.-]*)?/?([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(settings|volumes|nodes|events)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(engineimages|instancemanagers)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/((backup)?backingimages)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(backup(targets|volumes|s))([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(recurringjobs|snapshotgroups|orphans)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(shard(groups|s)|volumeattachments)([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^(GET|HEAD)$"
                path: '^/v1/ws(/[0-9]+(ms|s|m|h)?)?/(system(backups|restores))([?].*)?$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^POST$"
                path: '^/v1/volumes/[A-Za-z0-9][A-Za-z0-9_.-]*[?]action=(snapshotList|snapshotGet|snapshotCRList|snapshotCRGet|recurringJobList)$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
              - method: "^POST$"
                path: '^/v1/backupvolumes/[A-Za-z0-9][A-Za-z0-9_.-]*[?]action=(backupList|backupListByVolume|backupGet)$'
                headerMatches:
                  - name: X-Forwarded-Proto
                    value: https
                    mismatch: REPLACE
    # Registry requests have passed the maintainer-team SSO gate.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data-product-controller
            k8s:app.kubernetes.io/name: data-product-controller
            k8s:app.kubernetes.io/instance: data-product-controller
            k8s:app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
    # Actual Budget upstream (personal finance app; Service actual-budget-actualbudget :5006).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: actual-budget
      toPorts:
        - ports:
            - port: "5006"
              protocol: TCP
    # Homepage upstream
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Hubble UI upstream (kube-system; Service hubble-ui :80 -> pod :8081).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # KSail operator UI upstream (ksail-operator Service :8080).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ksail-operator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Coroot UI upstream (metrics/logs/traces/profiles/alerts).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Policy Reporter UI upstream (policy-reporter-ui Service :8080). Prod-only;
    # inert on local/CI where the policy-reporter namespace has no pods.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-reporter
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # OpenBao UI/API upstream. The public HTTPRoute points at oauth2-proxy,
    # then auth-proxy forwards only authenticated requests to OpenBao.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Umami browser UI after oauth2-proxy has authenticated the request.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: umami
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
