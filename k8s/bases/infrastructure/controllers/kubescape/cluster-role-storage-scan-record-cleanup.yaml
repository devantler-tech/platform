---
# Lets Kubescape storage ask whether one scanned object still exists, so its
# cleanup can remove the scan record of a deleted object (#3697). The patched
# storage image reads a single named object's metadata and removes the record
# only when the API server answers that the object does not exist; a refused
# read keeps the record.
#
# `get` only: nothing is listed, watched or changed. Secrets are deliberately
# absent, because RBAC cannot grant an existence check on a Secret without
# also granting its contents. Their scan records are kept.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescape-storage-scan-record-cleanup
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - podtemplates
      - serviceaccounts
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs: ["get"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumclusterwidenetworkpolicies
      - ciliumnetworkpolicies
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - csistoragecapacities
      - storageclasses
    verbs: ["get"]
