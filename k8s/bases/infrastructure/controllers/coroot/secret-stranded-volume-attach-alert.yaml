# The Slack incoming-webhook the detector posts to, injected by Flux substitution
# from the per-cluster SOPS secret — the same `alertmanager_webhook_url` every
# other bespoke check delivers through. Unset (local/CI) it defaults to the
# reserved example.invalid host, which the script matches explicitly and skips.
---
apiVersion: v1
kind: Secret
metadata:
  name: stranded-volume-attach-alert-webhook
  namespace: observability
type: Opaque
stringData:
  url: ${alertmanager_webhook_url:=https://example.invalid/no-slack-configured}
