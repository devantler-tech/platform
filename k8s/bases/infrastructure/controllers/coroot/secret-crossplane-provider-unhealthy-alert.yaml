# Slack incoming-webhook for the crossplane-provider-unhealthy-alert CronJob. It
# is the same ${alertmanager_webhook_url} the cnpg-degraded-alert Secret carries,
# held in a Secret rather than inline env for the same reasons (see
# secret-cnpg-degraded-alert.yaml).
#
# The inline default keeps `ksail workload validate` (which has no SOPS access)
# building and leaves local/CI inert.
---
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-provider-unhealthy-alert-webhook
  namespace: observability
type: Opaque
stringData:
  url: ${alertmanager_webhook_url:=https://example.invalid/no-slack-configured}
