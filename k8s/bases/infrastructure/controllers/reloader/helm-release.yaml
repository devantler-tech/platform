apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
  labels:
    helm.toolkit.fluxcd.io/helm-test: enabled
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: reloader
  # https://github.com/stakater/Reloader/blob/master/deployments/kubernetes/chart/reloader/values.yaml
  values:
    reloader:
      readOnlyRootFileSystem: true
      reloadStrategy: annotations
      enableHA: true
      deployment:
        replicas: ${reloader_replicas:=2}
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        # Replicas of the same revision must occupy separate nodes. Scoping
        # by pod-template-hash lets a one-replica installation roll in place.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                matchLabelKeys:
                  - pod-template-hash
                labelSelector:
                  matchLabels:
                    app: reloader-reloader
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                app: reloader-reloader
        labels:
          provider: stakater
          group: com.stakater.platform
      podDisruptionBudget:
        enabled: true
        # Drain-safe PDB pattern (#1880/#1882): maxUnavailable: 1 keeps the
        # node drainable at any replica count, including a one-replica local
        # installation. With one replica, minAvailable: 1 permits no voluntary
        # evictions and makes its node undrainable.
        maxUnavailable: 1
