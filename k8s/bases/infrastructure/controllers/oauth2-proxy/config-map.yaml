96.86 64.66 497.95 67.66Q499.04 70.67 501.21 72.45Q503.39 74.19 506.68 74.19Q508.42 74.19 509.84 73.68Q511.29 73.17 512.37 72.23Q513.50 71.29 514.26 69.95Q515.02 68.61 515.38 66.97L524.19 68.82Q523.54 71.87 521.98 74.26Q520.46 76.65 518.14 78.35Q515.85 80.02 512.92 80.93Q510.02 81.83 506.61 81.83M540.06 57.26L540.06 81.00L530.64 81.00L530.64 27.00L539.92 27.00L539.92 50.49L538.94 50.49Q540.64 45.23 543.94 42.62Q547.24 39.98 552.20 39.98Q556.37 39.98 559.49 41.75Q562.64 43.53 564.34 46.93Q566.08 50.34 566.08 55.23L566.08 81.00L556.62 81.00L556.62 56.68Q556.62 52.62 554.52 50.30Q552.42 47.98 548.72 47.98Q546.22 47.98 544.27 49.07Q542.31 50.16 541.19 52.26Q540.06 54.33 540.06 57.26"/></svg>
      </div>
      <p class="status">{{.StatusCode}}</p>
      <h1>{{.Title}}</h1>
      {{ if .Message }}
      <p class="message">{{.Message}}</p>
      {{ end }}
      {{ if .Redirect }}
      <div class="actions">
        <form method="GET" action="{{.Redirect}}">
          <button type="submit" class="secondary">Go back</button>
        </form>
        <form method="GET" action="{{.ProxyPrefix}}/sign_in">
          <input type="hidden" name="rd" value="{{.Redirect}}">
          <button type="submit" class="primary">Sign in</button>
        </form>
      </div>
      {{ end }}
      {{ if .RequestID }}
      <p class="request-id">Request ID: <code>{{.RequestID}}</code></p>
      {{ end }}
    </main>
    {{ if eq .Footer "-" }}
    {{ else if eq .Footer "" }}
    {{ else }}
    <footer>{{.Footer}}</footer>
    {{ end }}
    </body>
    </html>
    {{end}}
