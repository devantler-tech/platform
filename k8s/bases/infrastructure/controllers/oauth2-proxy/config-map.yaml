---
# oauth2-proxy's error page in the Devantler Tech look. The proxy shows it when
# it turns someone away (403), when a login fails or gets out of step, and when
# an app behind it does not answer (502). The sign-in page is never shown
# (skip_provider_button), so this is the only page of its own anyone sees.
#
# helm-release.yaml mounts this ConfigMap at /etc/oauth2_proxy/templates and
# points custom_templates_dir there. oauth2-proxy reads the template once, when
# it starts, so the reloader annotation in helm-release.yaml restarts it after a
# change here. A template that fails to parse stops the proxy from starting;
# scripts/oauth2-proxy-error-page/error_page_test.go parses and renders this one
# the way oauth2-proxy does, for 403, 500 and 502, on every pull request.
# Keep everything inside {{define "error.html"}}: text outside it, even an HTML
# comment, is a second definition that oauth2-proxy refuses at startup.
#
# There is no sign_in.html here, so the proxy logs "Could not load file
# .../sign_in.html ... will use default template" at error level on each start.
# That line is expected and harmless.
#
# The template is upstream's own error.html (pkg/app/pagewriter, v7.15.6) with
# the same fields and the same Go back / Sign in forms, restyled. The page links
# to nothing outside itself: the styles are inline, the wordmark is the Dex
# theme's logo.svg inlined byte for byte, and the tab icon is the brand icon as
# a data: URL. The test fails when either copy drifts from its source.
#
# Every colour pair clears WCAG AA (4.5:1) on its background.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-templates
  namespace: oauth2-proxy
data:
  error.html: |
    {{define "error.html"}}
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{.StatusCode}} {{.Title}} · Devantler Tech</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,">
    <style>
      :root {
        color-scheme: dark;
        /* The Dex theme's palette: devantler.tech's dark backdrop and neon green. */
        --dt-bg: hsl(224, 10%, 10%);
        --dt-card: hsl(224, 10%, 13%);
        --dt-card-border: rgba(255, 255, 255, 0.12);
        --dt-accent: #39ff14;
        --dt-accent-high: #7aff6e;
        --dt-ink: #0a0d0b;
        --dt-fg: rgba(255, 255, 255, 0.92);
        --dt-fg-muted: rgba(255, 255, 255, 0.68);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background-color: var(--dt-bg);
        color: var(--dt-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 32rem;
        padding: 2.5rem 2rem;
        background-color: var(--dt-card);
        border: 1px solid var(--dt-card-border);
        border-radius: 16px;
        box-shadow: 0 0 48px rgba(57, 255, 20, 0.08);
        text-align: center;
      }
      .logo {
        width: min(100%, 18rem);
        margin: 0 auto 2rem;
      }
      .logo svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .status {
        margin: 0;
        color: var(--dt-accent);
        font-size: clamp(4rem, 20vw, 6rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      h1 {
        margin: 0.5rem 0 1rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .message {
        margin: 0;
        color: var(--dt-fg-muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      .actions form {
        flex: 1 1 10rem;
        margin: 0;
      }
      button {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--dt-accent);
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background-color: var(--dt-accent);
        color: var(--dt-ink);
      }
      .primary:hover {
        background-color: var(--dt-accent-high);
        border-color: var(--dt-accent-high);
      }
      .secondary {
        background-color: transparent;
        color: var(--dt-accent);
      }
      .secondary:hover {
        background-color: rgba(57, 255, 20, 0.1);
      }
      button:focus-visible {
        outline: 2px solid var(--dt-accent);
        outline-offset: 2px;
      }
      .request-id {
        margin: 2rem 0 0;
        color: var(--dt-fg-muted);
        font-size: 0.8125rem;
      }
      code {
        color: var(--dt-fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }
      footer {
        margin-top: 1.5rem;
        color: var(--dt-fg-muted);
        font-size: 0.8125rem;
      }
    </style>
    </head>
    <body>
    <main>
      <div class="logo" role="img" aria-label="Devantler Tech">
    <svg xmlns="http://www.w3.org/2000/svg" width="573" height="108" viewBox="0 0 573 108"><title>Devantler Tech</title><g transform="scale(.210937)"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BFF3C"/><stop offset="1" stop-color="#2CE00E"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/><path fill="#0A0D0B" fill-rule="evenodd" d="M180 128H250A128 128 0 0 1 250 384H134V174ZM204 198V314H250A58 58 0 0 0 250 198Z"/></g><path fill="#F1F5F1" d="M135.90 81.83Q129.78 81.83 125.36 79.26Q120.97 76.69 118.58 72.01Q116.23 67.34 116.23 60.99Q116.23 54.73 118.54 50.01Q120.90 45.30 125.18 42.66Q129.49 39.98 135.29 39.98Q138.98 39.98 142.32 41.17Q145.69 42.37 148.26 44.87Q150.87 47.37 152.32 51.25Q153.81 55.09 153.81 60.42L153.81 63.39L120.68 63.39L120.68 56.97L149.13 56.97L144.71 58.86Q144.71 55.45 143.66 52.88Q142.61 50.27 140.51 48.82Q138.44 47.37 135.32 47.37Q132.21 47.37 130.03 48.85Q127.86 50.30 126.70 52.77Q125.58 55.20 125.58 58.20L125.58 62.63Q125.58 66.47 126.88 69.11Q128.18 71.76 130.54 73.10Q132.90 74.44 136.01 74.44Q138.08 74.44 139.75 73.86Q141.45 73.24 142.68 72.08Q143.91 70.89 144.53 69.19L153.19 70.96Q152.21 74.22 149.86 76.69Q147.50 79.12 143.95 80.49Q140.43 81.83 135.90 81.83M171.75 81.00L156.67 40.48L166.75 40.48L174.14 62.52Q175.44 66.39 176.39 70.31Q177.33 74.22 178.31 78.25L175.95 78.25Q176.97 74.22 177.87 70.31Q178.81 66.39 180.08 62.52L187.44 40.48L197.44 40.48L182.29 81.00L171.75 81.00M213.50 81.83Q209.65 81.83 206.57 80.46Q203.49 79.04 201.72 76.32Q199.94 73.61 199.94 69.62Q199.94 66.18 201.21 63.93Q202.52 61.68 204.69 60.34Q206.90 59.00 209.65 58.31Q212.41 57.62 215.38 57.33Q218.90 56.94 221.11 56.65Q223.32 56.36 224.33 55.70Q225.38 55.05 225.38 53.67L225.38 53.49Q225.38 51.50 224.59 50.12Q223.79 48.71 222.19 47.98Q220.64 47.22 218.32 47.22Q215.96 47.22 214.22