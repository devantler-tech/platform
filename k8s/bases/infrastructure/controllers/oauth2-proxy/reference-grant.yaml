---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-oauth2-proxy-backends
  namespace: oauth2-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: backstage
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: homepage
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: observability
    # The OpenBao UI HTTPRoute (openbao) backends to the oauth2-proxy Service so
    # vault.${domain} is reached through SSO. Without this entry Gateway API
    # refuses the cross-namespace backendRef (ResolvedRefs=False /
    # RefNotPermitted) and the route stops forwarding altogether.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openbao
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: opencost
    # The Policy Reporter UI HTTPRoute (policy-reporter) backends to the
    # oauth2-proxy Service for SSO. Prod-only (the app ships only via the hetzner
    # overlay); inert on local/CI where the policy-reporter namespace has no HTTPRoute.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: policy-reporter
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
