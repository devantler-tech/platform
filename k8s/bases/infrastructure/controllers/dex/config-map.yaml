binaryData:
  # The Devantler Tech icon (a rounded green square with a dark "D"), byte for
  # byte the devantler.tech favicon (256x256 PNG, devantler-tech/business-site
  # public/favicon.png). Dex links it as the page icon. Both files are served
  # from the cluster and never fetched from another site.
  favicon.png: 
