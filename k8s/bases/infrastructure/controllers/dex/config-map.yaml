# The Devantler Tech theme for Dex's sign-in pages: the devantler.tech dark
# palette, the green orb logo and neon-green accents.
#
# Dex reads a theme from `<frontend.dir>/themes/<frontend.theme>/`, so the
# HelmRelease mounts this ConfigMap at /srv/dex/web/themes/devantler-tech and
# points frontend.dir at /srv/dex/web, where the Dex image ships its templates
# and static files. Dex serves these files from disk on each request, so a change
# here reaches the pages once the kubelet refreshes the mount, without a restart.
#
# scripts/tests/test-dex-theme-mount.sh checks that the theme Dex is told to use
# is the directory this ConfigMap is mounted at, and that it holds every file the
# pages link to.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-theme
  namespace: dex
data:
  # Every colour pair below clears WCAG AA: text 4.5:1, input outlines 3:1.
  styles.css: |
    /* Devantler Tech theme for Dex: the devantler.tech dark palette, the green orb
       logo and neon-green accents. Dex's own static/main.css sets the layout; this
       file only overrides the theme classes its templates use. */
    .theme-body {
      /* devantler.tech's flat page backdrop, as the platform homepage paints it. */
      --dt-bg: hsl(224, 10%, 10%);
      --dt-accent: #39ff14;
      --dt-accent-high: #7aff6e;
      --dt-accent-low: #0a2e14;
      --dt-card-border: rgba(255, 255, 255, 0.12);
      --dt-glow: rgba(57, 255, 20, 0.3);
      --dt-fg: rgba(255, 255, 255, 0.92);
      --dt-fg-muted: rgba(255, 255, 255, 0.68);
      /* Input outlines need 3:1 against the page, which the card border does not reach. */
      --dt-input-border: rgba(255, 255, 255, 0.4);

      /* Read by Dex's shared stylesheet on the signed-in home page. */
      --dex-fg: var(--dt-fg);
      --dex-fg-muted: var(--dt-fg-muted);
      --dex-border: var(--dt-card-border);
      --dex-accent: var(--dt-accent);

      background-color: var(--dt-bg);
      color: var(--dt-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    ::selection {
      background: rgba(57, 255, 20, 0.25);
    }

    /* One visible focus ring everywhere, in place of Dex's blue one. */
    .theme-body a:focus-visible,
    .theme-body button:focus-visible,
    .theme-body input:focus-visible,
    .theme-body .dex-btn:focus-visible {
      outline: 2px solid var(--dt-accent);
      outline-offset: 2px;
    }

    /* Text links: the bright green clears 13:1 against the page. Buttons that are
       links keep their own colours below. */
    .theme-body a:not(.dex-btn) {
      color: var(--dt-accent-high);
    }

    .theme-body a:not(.dex-btn):hover {
      color: var(--dt-accent);
    }

    /* Header: the orb and the name, as on devantler.tech. */
    .theme-navbar {
      background-color: var(--dt-bg);
      border-bottom: 1px solid var(--dt-card-border);
      height: 64px;
      padding: 0 16px;
    }

    .theme-navbar__logo-wrap {
      align-items: center;
      display: flex;
      gap: 12px;
      height: 100%;
    }

    .theme-navbar__logo {
      filter: drop-shadow(0 0 6px var(--dt-glow));
      height: 36px;
      width: 36px;
    }

    .theme-navbar__logo-wrap::after {
      color: var(--dt-fg);
      content: "Devantler Tech";
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .dex-container {
      color: var(--dt-fg);
    }

    .theme-panel {
      background: linear-gradient(180deg, rgba(10, 46, 20, 0.45), rgba(10, 46, 20, 0.12));
      border: 1px solid var(--dt-card-border);
      border-radius: 12px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      padding: 32px;
    }

    .theme-heading {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      margin-top: 0;
    }

    /* Connector buttons (GitHub): light label on the dark green, so the name
       reads at 12:1; the connector's own icon tile stays as Dex draws it. */
    .theme-btn-provider {
      background-color: var(--dt-accent-low);
      border: 1px solid var(--dt-glow);
      color: var(--dt-fg);
      max-width: 100%;
      width: 260px;
    }

    .theme-btn-provider:hover {
      border-color: var(--dt-accent);
      box-shadow: 0 0 20px var(--dt-glow);
      color: #fff;
    }

    /* Primary actions: dark text on the neon green, 13:1. */
    .theme-btn--primary,
    .theme-btn--success {
      background-color: var(--dt-accent);
      border: none;
      color: var(--dt-bg);
      font-weight: 600;
    }

    .theme-btn--primary {
      min-width: 200px;
      padding: 8px 16px;
    }

    .theme-btn--success {
      width: 260px;
    }

    .theme-btn--primary:hover,
    .theme-btn--success:hover {
      background-color: var(--dt-accent-high);
      box-shadow: 0 0 20px var(--dt-glow);
      color: var(--dt-bg);
    }

    .theme-form-row {
      display: block;
      margin: 16px auto;
    }

    .theme-form-input {
      background-color: var(--dt-bg);
      border: 1px solid var(--dt-input-border);
      border-radius: 8px;
      color: var(--dt-fg);
      display: block;
      font-size: 14px;
      height: 40px;
      line-height: 1.5;
      margin: auto;
      padding: 8px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      width: 260px;
    }

    .theme-form-input::placeholder {
      color: var(--dt-fg-muted);
    }

    .theme-form-input:focus,
    .theme-form-input:active {
      border-color: var(--dt-accent);
      box-shadow: 0 0 0 3px var(--dt-glow);
      color: #fff;
      outline: none;
    }

    .theme-form-label {
      color: var(--dt-fg);
      font-size: 14px;
      font-weight: 500;
      margin: 4px auto;
      position: relative;
      text-align: left;
      width: 260px;
    }

    .theme-link-back {
      margin-top: 12px;
    }

    .theme-link-back a {
      color: var(--dt-accent-high);
    }

    .theme-remember-me {
      align-items: center;
      cursor: pointer;
      display: flex;
      font-size: 14px;
      gap: 8px;
      margin: 4px auto;
      width: 260px;
    }

    .theme-remember-me input {
      accent-color: var(--dt-accent);
    }

    .dex-subtle-text,
    .dex-list {
      color: var(--dt-fg-muted);
    }

    .dex-separator {
      border: 0;
      border-top: 1px solid var(--dt-card-border);
    }

    /* Dex's white-on-red box is 4.2:1; a dark red tint with the same red edge
       keeps the warning and brings the text above 4.5:1. */
    .dex-error-box {
      background-color: rgba(229, 56, 59, 0.16);
      border: 1px solid #e5383b;
      color: #fff;
    }

    * {
      scrollbar-color: rgba(57, 255, 20, 0.3) transparent;
      scrollbar-width: thin;
    }

    @media (prefers-reduced-motion: reduce) {
      .dex-btn,
      .theme-form-input {
        transition: none;
      }

      .dex-btn:active {
        transform: none;
      }
    }
binaryData:
  # The green orb, byte for byte the devantler.tech favicon (256x256 PNG, from
  # devantler-tech/business-site public/favicon.png). Dex links it as the page
  # icon, and frontend.logoURL shows the same file in the header, so the logo is
  # served from the cluster and never fetched from another site.
  favicon.png: 
