# Production reconciles this scoped release in Flux inventory. The organization
# pool stays unreferenced; activation is separate. See docs/operations/arc-runners.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    platform.devantler.tech/arc-recovery: drain-only
  labels:
    helm.toolkit.fluxcd.io/crds: enabled
spec:
  suspend: false
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: arc-controller
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  values:
    fullnameOverride: arc-controller
    replicaCount: 1
    serviceAccount:
      name: arc-controller
    flags:
      logLevel: info
      logFormat: json
      watchSingleNamespace: arc-runners
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
