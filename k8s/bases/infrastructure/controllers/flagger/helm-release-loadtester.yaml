apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flagger-system
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: loadtester
      version: 0.39.0
      sourceRef:
        kind: HelmRepository
        name: flagger
  # https://github.com/fluxcd/flagger/blob/main/charts/loadtester/values.yaml
  #
  # The load-tester is the webhook target Flagger calls during a canary to run
  # acceptance (smoke) tests and generate load so Coroot has request traffic to
  # measure. Used by the onboarded canaries (umami and homepage); see
  # docs/progressive-delivery.md for the onboarding recipe.
  values:
    # Flagger's canary checks should survive one worker outage. The loadtester
    # is stateless, so keep a second endpoint on a different node (platform#4104).
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: loadtester
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      # The chart only renders minAvailable, which reintroduces the drain
      # deadlock class guarded by validate-pdb-drain-safe. Keep its PDB off and
      # declare the platform-owned maxUnavailable PDB beside this release.
      enabled: false

    # Restricted PSA — the chart ships hardening disabled by default, so set it
    # explicitly at both the pod and container level.
    securityContext:
      enabled: true
      context:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
    podSecurityContext:
      enabled: true
      context:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # With only two eligible workers, required cross-node affinity prevents a
  # third surge pod from scheduling. Retire one old pod before replacing it;
  # the remaining replica stays available throughout the rollout.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: flagger-loadtester
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: flagger-loadtester
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxUnavailable: 1
                    maxSurge: 0
