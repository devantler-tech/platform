apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # JSON encoding preserves the existing PEM and the original ARC keys.
        provider-credentials: >-
          {"owner":"devantler-tech","app_auth":[{"id":{{ .github_app_id | toJson }},"installation_id":{{ .github_app_installation_id | toJson }},"pem_file":{{ .github_app_private_key | toJson }}}]}
  data:
    - secretKey: github_app_id
      remoteRef:
        key: infrastructure/arc/github-app
        property: app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: infrastructure/arc/github-app
        property: installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: infrastructure/arc/github-app
        property: pem
