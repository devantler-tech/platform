apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: arc-runners
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  provider:
    vault:
      server: "https://openbao-arc.openbao.svc.cluster.local:8204"
      caProvider:
        type: ConfigMap
        name: arc-openbao-ca
        key: ca.crt
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "arc-secret-reader"
          serviceAccountRef:
            name: "arc-secret-reader"
