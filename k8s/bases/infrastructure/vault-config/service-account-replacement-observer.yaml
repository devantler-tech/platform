# Identity of the read-only OpenBao replacement preflight (#5836). No workload
# runs as it: the protected `Replace OpenBao Server` workflow mints one
# short-lived token for it per run. OpenBao's `openbao-replacement-observer`
# Kubernetes-auth role (vault-config) binds to exactly this SA and grants only
# the Raft configuration read and revoking its own token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-replacement-observer
  namespace: openbao
automountServiceAccountToken: false
