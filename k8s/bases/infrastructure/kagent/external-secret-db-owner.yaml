# The kagent_owner_user login, which creates kagent's tables and runs its migrations.
# Generated once in-cluster: CNPG sets the role's password from this Secret
# (cluster.yaml), and the kagent controller reads the connection string
# from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db-owner
  namespace: kagent
spec:
  refreshInterval: "0"
  target:
    name: kagent-db-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG reads a managed role's password from a basic-auth Secret.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kagent_owner_user
        password: "{{ .password }}"
        ownerConnectionString: "postgres://kagent_owner_user:{{ .password }}@kagent-db-rw.kagent.svc:5432/kagent?sslmode=require"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kagent-db-owner
