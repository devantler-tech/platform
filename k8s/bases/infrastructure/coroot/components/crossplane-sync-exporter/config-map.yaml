              help: "Crossplane managed resource condition status (1 = True, 0 = False)."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    condition: [type]
                    reason: [reason]
                  valueFrom: [status]
        - groupVersionKind:
