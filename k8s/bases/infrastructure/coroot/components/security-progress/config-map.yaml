                        "w": 6,
                        "h": 4
                      }
                    },
                    {
                      "name": "Controls behind excluded or unknown outcomes",
                      "description": "Up to 30 control/status groups outside passed and failed. Investigate the report's reason before treating an exception, skip or unknown as an intentional decision. Source results may not incorporate the platform's exception surfaces.",
                      "source": {
                        "metrics": {
                          "queries": [
                            {
                              "datasource": "",
                              "query": "(topk(30, sum by (control, severity, status) (platform_security_posture_results{status!~\"passed|failed\"}))) and on() ((min(platform_security_collection_success{surface=\"kubescape\"}) == 1) and on() (time() - min(platform_security_snapshot_timestamp_seconds{surface=\"kubescape\"}) >= 0) and on() (time() - min(platform_security_snapshot_timestamp_seconds{surface=\"kubescape\"}) < 900))",
                              "legend": "{{control}} / {{severity}} / {{status}}",
                              "color": ""
                            }
                          ]
                        }
                      },
                      "widget": {
                        "chart": {
                          "display": "line",
                          "stacked": false
                        }
                      },
                      "box": {
                        "x": 6,
                        "y": 0,
                        "w": 6,
                        "h": 4
                      }
                    }
                  ],
                  "collapsed": false
                }
              ]
            }
          }
        ]
    kubescape-unscanned-namespaces.tsv: |
        # Reviewed list of namespaces the in-cluster Kubescape scan does NOT cover (#3215).
        #
        # Checked by scripts/guard-kubescape-scan-scope.sh against the operator's
        # `.spec.values.excludeNamespaces` in
        # k8s/bases/infrastructure/controllers/kubescape/helm-release.yaml. The two must hold exactly
        # the same namespaces, so a namespace can only leave scan coverage through a change that also
        # adds a row here, with a reason, for review.
        #
        # A namespace listed here produces no posture result at all. That is NOT the same as passing:
        # no control is evaluated there, and the posture score reads the same as if it were clean.
        #
        # One tab-separated row per namespace:
        #   <namespace>	<why it is not scanned>
        kubescape	The scanner's own namespace. Excluded by the chart default; its four operator Deployments are measured by neither the in-cluster scan nor the CI scan, which never renders the HelmRelease (#3215).
        kube-system	Control-plane and CNI workloads that Talos and KSail install. Excluded by the chart default, so exceptions and opt-ins here change no posture result (#3919, #3923).
        kube-public	Holds only the cluster-info ConfigMap and no workloads. Excluded by the chart default.
        kube-node-lease	Holds only node heartbeat Leases and no workloads. Excluded by the chart default.
        kubeconfig	Not present on this platform. Kept to match the chart default the cluster already runs.
        gmp-system	Google Managed Prometheus. Not present on this platform. Kept to match the chart default.
        gmp-public	Google Managed Prometheus. Not present on this platform. Kept to match the chart default.
    metrics.jq: |
        # Data reduction only: input snapshots stay inside the collector's emptyDir.
        # No scan, exception, security gate or issue is changed by this exporter.
        def metric($name; $labels; $value):
          if ($value | type) != "number" or $value < 0 then error("invalid metric value") else
          $name + (if ($labels | length) == 0 then "" else
            "{" + ($labels | to_entries | map(.key + "=" + (.value | tostring | tojson)) | join(",")) + "}" end)
          + " " + ($value | tostring) end;
        def list: if (.items | type) == "array" then .items else error("missing List") end;
        def digest: capture("(?<digest>sha256:[0-9a-f]{64})$").digest;
        def scope_key: [.kind, .namespace, .name] | join("/");

        if .mode == "policy" then
          ([.policy, .cluster_policy] | map(list) | add
            | [ .[] as $report | $report.results[]?
              | if (.source | type) != "string" then error("missing policy source") else . end
              | select(.source == "kyverno" or (.source | startswith("Kyverno")))
              | if (.source | IN("kyverno","KyvernoGeneratingPolicy","KyvernoMutatingPolicy","KyvernoValidatingPolicy") | not)
                then error("unsupported Kyverno policy source") else . end | . as $r
              | ($r.rule // (if $r.source != "kyverno" then "(policy)" else null end)) as $rule
              | (if ($r.resources | length) > 0 then $r.resources[] else $report.scope end) as $resource
              | if ($resource.kind | type) != "string" or ($resource.name | type) != "string" or
                   ($r.policy | type) != "string" or ($rule | type) != "string" or
                   ([$r.result] | inside(["pass","fail","warn","error","skip"]) | not)
                then error("unrecognized policy result") else
                {source:$r.source,policy:$r.policy,rule:$rule,namespace:($resource.namespace // $report.metadata.namespace // "_"),
                 kind:$resource.kind,name:$resource.name,status:$r.result,severity:($r.severity // $r.properties.severity // "unknown" | ascii_downcase),
                 at:($r.timestamp.seconds // 0)} end ]
            | group_by([.source,.policy,.rule,.namespace,.kind,.name])
            | map((map(.at) | max) as $at | map(select(.at == $at)) | unique
              | if (map(.status) | unique | length) > 1 then error("conflicting policy reports") else .[0] end)
          ) as $results
          | if ($results | length) == 0 then error("no policy evidence") else
            (["pass","fail","warn","error","skip"][] as $status
              | metric("platform_security_policy_total"; {status:$status}; ([$results[] | select(.status == $status)] | length))),
            ($results | group_by([.source,.policy,.rule,.namespace,.status,.severity])[]
              | .[0] as $r | metric("platform_security_policy_results"; ($r | {source,policy,rule,namespace,status,severity}); length)),
            ($results[] | select(.status != "pass")
              | metric("platform_security_policy_finding"; {source,policy,rule,namespace,kind,name,status,severity}; 1))
          end
        elif .mode == "kubescape" then . as $input
          | if ($input.vulnerability | list | length) == 0 or ($input.vulnerability_stored | list | length) == 0
            then error("missing vulnerability input collection") else . end
          | ($input.coverage_report | split("\n") | map(select(startswith("COVERAGE ")))
            | map(capture("^COVERAGE (?<surface>posture|vulnerability|runtime) (?<values>.*)$")
              | .surface as $surface | .values | split(" ") | map(capture("^(?<state>[a-z]+)=(?<value>[0-9]+)$")
                | {surface:$surface,state,value:(.value|tonumber)})) | add) as $coverage
          | if (["posture","vulnerability","runtime"] - ([$coverage[].surface] | unique) | length) != 0 or
               any($coverage[]; .state == "expected" and .value == 0)
            then error("incomplete coverage report") else
          ($input.workloads | list | map(select(.metadata.namespace as $ns | $input.unscanned | index($ns) == null))
            | map({kind,namespace:.metadata.namespace,name:.metadata.name} | scope_key)) as $expected
          | ([$input.posture | list[] | .metadata.labels as $l
              | {kind:$l["kubescape.io/workload-kind"],namespace:$l["kubescape.io/workload-namespace"],name:$l["kubescape.io/workload-name"]} as $scope
              | select(($scope | scope_key) as $key | $expected | index($key) != null)
              | (.spec.controls // {}) | if type != "object" then error("invalid posture controls") else . end
              | to_entries[] | .key as $control | .value
              | if (.status.status | type) != "string" then error("missing posture status") else
                {control:$control,severity:(.severity.severity // "unknown" | ascii_downcase),
                 status:(if .status.status != "failed" and
                   ((.status.subStatus | IN("exception","excepted")) or any(.rules[]?; (.appliedIgnoreRules | length) > 0))
                   then "accepted" else .status.status end)} + $scope end]
              | unique) as $posture
          | ([$input.pods | list[] | select(.metadata.namespace as $ns | $input.unscanned | index($ns) == null)
              | select(any(.metadata.ownerReferences[]?; .kind == "Job") | not) | . as $pod
              | if .status.phase == "Running" then
                  (.status.containerStatuses[]?,
                    (.status.initContainerStatuses[]? | . as $status | select(any($pod.spec.initContainers[]?; .name == $status.name and .restartPolicy == "Always"))),
                    (.status.ephemeralContainerStatuses[]? | select(.state.running != null)))
                elif .status.phase == "Pending" then
                  .status.initContainerStatuses[]? | . as $status | select(.state.running != null and any($pod.spec.initContainers[]?; .name == $status.name and .restartPolicy == "Always"))
                else empty end | .imageID | digest] | unique) as $images
          | ($input.vulnerability | list | map({key:(.metadata.namespace+"/"+.metadata.name),value:.metadata.resourceVersion}) | from_entries) as $listed
          | ([$input.vulnerability_stored | list[] | .metadata.annotations as $a
              | select($listed[.metadata.namespace+"/"+.metadata.name] == .metadata.resourceVersion)
              | ($a["kubescape.io/image-id"] | digest) as $digest
              | select($images | index($digest) != null)
              | ($a["kubescape.io/timestamp"] | tonumber) as $at
              | select($at <= $input.now and $input.now - $at <= 604800)
              | if (.spec.severities | type) != "object" or (.spec.severities | length) == 0 or
                   (all(.spec.severities[]; type == "object" and has("all") and
                     (.all | type == "number" and . >= 0 and floor == .)) | not) or
                   ((.spec.severities | keys) - ["critical","high","medium","low","negligible","unknown"] | length) != 0
                then error("missing vulnerability severities") else
                {image:$digest,image_ref:$a["kubescape.io/image-id"],at:$at,
                 severities:(.spec.severities | with_entries(.value = {all:.value.all}))} end]
              | group_by(.image) | map((map(.at) | max) as $at | map(select(.at == $at))
                | if (map(.severities) | unique | length) > 1 then error("conflicting current vulnerability summaries")
                  else sort_by(.image_ref) | .[0] end)) as $vulnerabilities
          |
            ($coverage[] | metric("platform_security_coverage"; {surface,state}; .value)),
            metric("platform_security_posture_freshness_observable"; {}; 0),
            metric("platform_security_runtime_delivery_verified"; {}; 0),
            (if ($posture | length) > 0 then
              (["passed","failed","skipped","accepted","unknown"] + [$posture[].status] | unique)[] as $status
              | metric("platform_security_posture_total"; {status:$status}; ([$posture[] | select(.status == $status)] | length))
              else empty end),
            ($posture | group_by([.control,.severity,.status])[] | .[0] as $r
              | metric("platform_security_posture_results"; ($r | {control,severity,status}); length)),
            ($posture[] | select(.status != "passed") | metric("platform_security_posture_finding"; {control,severity,status,namespace,kind,name}; 1)),
            (if ($vulnerabilities | length) > 0 then ["critical","high","medium","low","negligible","unknown"][] as $severity
              | ($vulnerabilities | map(.severities[$severity].all // 0) | add) as $total
              | metric("platform_security_vulnerabilities"; {severity:$severity,context:"full"}; $total) else empty end),
            ($vulnerabilities[] | . as $v | ["critical","high","medium","low","negligible","unknown"][] as $severity
              | metric("platform_security_vulnerability_image"; {image:$v.image_ref,severity:$severity,context:"full"}; ($v.severities[$severity].all // 0)))
          end
        else error("unknown collection mode") end
    prometheus.yml: |
        # Source extension keeps KSail from treating this application config as a manifest.
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        remote_write:
          - url: http://coroot-prometheus.observability.svc.cluster.local.:9090/api/v1/write
        scrape_configs:
          - job_name: coroot-security-progress
            static_configs:
              - targets: [127.0.0.1:8080]
    reconcile.sh: "#!/bin/sh\n# Coroot v1.22.2's API owns persistence; this job owns only the three named\n# dashboards carrying the marker below. Source: coroot/coroot api/api.go,\n# api/forms/forms.go, db/dashboards.go at tag v1.22.2.\nset -eu\n\nCOROOT_URL=$${COROOT_URL:-http://coroot-coroot.observability.svc.cluster.local.:8080}\nCOROOT_PROJECT=$${COROOT_PROJECT:-platform}\nDASHBOARDS_FILE=$${DASHBOARDS_FILE:-/config/dashboards.json}\nCOROOT_CONNECT_TIMEOUT=$${COROOT_CONNECT_TIMEOUT:-5}\nCOROOT_REQUEST_TIMEOUT=$${COROOT_REQUEST_TIMEOUT:-30}\n\nowner='> \U0001F916 Generated by the Agentic Engineer\n\nManaged by platform GitOps: coroot-security-progress/v1.\n'\n\nfail() {\n  echo \"ERROR: $*\" >&2\n  exit 1\n}\n\n# Private response bodies never reach logs. No POST is automatically retried:\n# create is not idempotent when the server commits but its response is lost.\n# The next scheduled run re-discovers the named dashboard instead.\nrequest() {\n  method=$1\n  path=$2\n  expected=$3\n  body=$${4:-}\n  if [ \"$method\" = POST ]; then\n    code=$(curl --silent --show-error --max-time \"$COROOT_REQUEST_TIMEOUT\" \\\n      --connect-timeout \"$COROOT_CONNECT_TIMEOUT\" --output \"$tmp/response\" \\\n      --write-out '%{http_code}' --request POST --header 'content-type: application/json' \\\n      --data-binary \"$body\" \"$${COROOT_URL%/}$path\") || fail \"$method request failed\"\n  else\n    code=$(curl --silent --show-error --max-time \"$COROOT_REQUEST_TIMEOUT\" \\\n      --connect-timeout \"$COROOT_CONNECT_TIMEOUT\" --output \"$tmp/response\" \\\n      --write-out '%{http_code}' \"$${COROOT_URL%/}$path\") || fail \"$method request failed\"\n  fi\n  [ \"$code\" = \"$expected\" ] || fail \"$method returned HTTP $code; expected $expected\"\n}\n\ntmp=$(mktemp -d)\ntrap 'rm -rf \"$tmp\"' EXIT HUP INT TERM\n\n# Validate the complete desired set before any API writes. The input cannot\n# expand ownership to an arbitrary operator dashboard by changing a name.\njq -e --arg owner \"$owner\" '\n  type == \"array\" and length > 0\n  and ([.[].name] | length == (unique | length))\n  and all(.[];\n    (.name == \"Platform security progress\" or\n     .name == \"Kyverno remaining policy findings\" or\n     .name == \"Kubescape remediation progress\")\n    and (.description | type == \"string\" and startswith($owner))\n    and (.config | type == \"object\")\n    and (.config.groups | type == \"array\")\n  )' \"$DASHBOARDS_FILE\" >/dev/null || fail 'invalid or unowned dashboard definitions'\n\nrequest GET /api/user 200\npid=$(jq -er --arg name \"$COROOT_PROJECT\" '\n  [.projects[]? | select(.name == $name)]\n  | if length == 1 and (.[0].id | type == \"string\" and length > 0)\n    then .[0].id else error(\"project missing or ambiguous\") end\n' \"$tmp/response\") || fail 'project discovery failed or was ambiguous'\nproject_path=$(printf '%s' \"$pid\" | jq -sRr @uri)\ncollection=\"/api/project/$project_path/dashboards\"\n\nread_list() {\n  request GET \"$collection\" 200\n  jq -e '.data | type == \"array\" and all(.[];\n    (.id | type == \"string\" and length > 0) and\n    (.name | type == \"string\") and (.description | type == \"string\"))' \\\n    \"$tmp/response\" >/dev/null || fail 'dashboard list unavailable or invalid'\n  cp \"$tmp/response\" \"$tmp/list\"\n}\n\n# Refuse all collisions before provisioning any of the requested dashboards.\n# A same-name operator dashboard is never adopted, even when its config matches.\ncheck_ownership() {\n  jq -e --arg owner \"$owner\" --slurpfile desired \"$DASHBOARDS_FILE\" '\n    .data as $live | all($desired[0][];\n      .name as $name | [$live[] | select(.name == $name)] as $matches\n      | ($matches | length) <= 1\n        and all($matches[]; .description | startswith($owner)))\n  ' \"$tmp/list\" >/dev/null || fail 'dashboard name is duplicated or owned by someone else'\n}\n\nread_list\ncheck_ownership\ncount=$(jq length \"$DASHBOARDS_FILE\")\nindex=0\nwhile [ \"$index\" -lt \"$count\" ]; do\n  jq --argjson index \"$index\" '.[$index]' \"$DASHBOARDS_FILE\" >\"$tmp/desired\"\n  name=$(jq -r .name \"$tmp/desired\")\n  # Rebind ownership before each write sequence in case another actor changed\n  # the catalogue after preflight. CronJob concurrencyPolicy forbids self races.\n  read_list\n  check_ownership\n  id=$(jq -r --arg name \"$name\" '.data[] | select(.name == $name) | .id' \"$tmp/list\")\n  if [ -z \"$id\" ]; then\n    body=$(jq -c '{action:\"create\",name,description}' \"$tmp/desired\")\n    request POST \"$collection\" 201 \"$body\"\n    id=$(cat \"$tmp/response\")\n    [ -n \"$id\" ] || fail 'create returned an empty dashboard id'\n    read_list\n    check_ownership\n    jq -e --arg id \"$id\" --arg name \"$name\" \\\n      '[.data[] | select(.name == $name)] | length == 1 and .[0].id == $id' \\\n      \"$tmp/list\" >/dev/null || fail 'created dashboard was not found by its owned name and id'\n  fi\n  dashboard_path=$(printf '%s' \"$id\" | jq -sRr @uri)\n  endpoint=\"$collection/$dashboard_path\"\n  request GET \"$endpoint\" 200\n  jq -e --arg id \"$id\" --arg name \"$name\" '\n    .data | type == \"object\" and .id == $id and .name == $name\n      and (.config | type == \"object\")\n  ' \"$tmp/response\" >/dev/null || fail 'dashboard detail unavailable or does not match its owned identity'\n  cp \"$tmp/response\" \"$tmp/current\"\n\n  # In v1.22.2 detail GET does not load description; compare against the list.\n  if ! jq -e --arg id \"$id\" --slurpfile desired \"$tmp/desired\" \\\n    'any(.data[]; .id == $id and .description == $desired[0].description)' \\\n    \"$tmp/list\" >/dev/null; then\n    body=$(jq -c '{action:\"update\",name,description}' \"$tmp/desired\")\n    request POST \"$endpoint\" 200 \"$body\"\n  fi\n  if ! jq -e --slurpfile desired \"$tmp/desired\" \\\n    '.data.config == $desired[0].config' \"$tmp/current\" >/dev/null; then\n    # DashboardForm embeds db.Dashboard flat. A nested dashboard object or a\n    # metadata-only update silently leaves the persisted configuration unchanged.\n    body=$(jq -c '{name,config}' \"$tmp/desired\")\n    request POST \"$endpoint\" 200 \"$body\"\n  fi\n\n  # A 200 alone is not convergence: a warming project may return context/null.\n  request GET \"$endpoint\" 200\n  jq -e --arg id \"$id\" --slurpfile desired \"$tmp/desired\" \\\n    '.data.id == $id and .data.name == $desired[0].name and .data.config == $desired[0].config' \\\n    \"$tmp/response\" >/dev/null || fail 'dashboard configuration did not persist'\n  read_list\n  check_ownership\n  jq -e --arg id \"$id\" --slurpfile desired \"$tmp/desired\" \\\n    'any(.data[]; .id == $id and .name == $desired[0].name and .description == $desired[0].description)' \\\n    \"$tmp/list\" >/dev/null || fail 'dashboard metadata did not persist'\n  echo \"Dashboard reconciled: $name\"\n  index=$((index + 1))\ndone\n"
kind: ConfigMap
metadata:
    name: coroot-security-progress
    namespace: observability
