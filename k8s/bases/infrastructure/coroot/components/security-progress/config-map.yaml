# Generated by go run ./scripts/generate-coroot-security-config; DO NOT EDIT.
apiVersion: v1
data:
    bind-project-metrics.sh: |
        #!/bin/sh
        # Coroot scopes queries against a shared Prometheus by its database project ID.
        # Discover that ID on every snapshot so restores and project recreation recover.
        set -eu
        base=$${COROOT_URL:-http://coroot-coroot.observability.svc.cluster.local.:8080}
        project=$${COROOT_PROJECT:-platform}
        project_response=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 15 \
          "$${base%/}/api/user") || {
          echo 'Coroot project binding is unknown' >&2
          exit 1
        }
        project_id=$(printf '%s' "$${project_response}" |
          jq -er --arg name "$${project}" '
            .projects | select(type == "array")
            | [.[] | select(.name == $name) | .id]
            | select(length == 1) | .[0]
            | select(type == "string" and test("^[A-Za-z0-9_-]{1,128}$"))
          ' 2>/dev/null) || {
          echo 'Coroot project binding is unknown' >&2
          exit 1
        }
        # ID validation above makes this an inert label value. Never copy credentials,
        # API response bodies or project names into the metrics stream.
        awk -v project="$${project_id}" '
          /^[[:space:]]*#/ || /^[[:space:]]*$/ { print; next }
          /^[A-Za-z_:][A-Za-z0-9_:]*\{/ {
            if ($0 ~ /[{,]coroot_project_id=/) exit 1
            sub(/\{/, "{coroot_project_id=\"" project "\",")
            print; next
          }
          /^[A-Za-z_:][A-Za-z0-9_:]*[[:space:]]/ {
            sub(/[[:space:]]/, "{coroot_project_id=\"" project "\"} ")
            print; next
          }
          { exit 1 }
        '
    check-kubescape-result-coverage.sh: |
        #!/usr/bin/env bash
        #
        # Compare the live Kubescape result objects against the set of objects that SHOULD have one,
        # per surface, and fail on every missing or stale result (#4262, part of #3156).
        #
        # The expected sets are defined in docs/kubescape-result-coverage.md. In short:
        #
        #   posture        every Deployment, StatefulSet, DaemonSet and CronJob in a scanned namespace
        #                  has a workloadconfigurationscan that carries control results.
        #   vulnerability  every image a long-lived regular container, init sidecar, or ephemeral
        #                  container is running (keyed by image digest, not by container count) has a
        #                  vulnerabilitymanifestsummary scanned within --vuln-max-age-days.
        #                  Every listed summary must also agree with its stored object: a summary whose
        #                  listed (metadata-row) resourceVersion differs from the stored one is SPLIT,
        #                  and the storage server refuses every later update of it, so it can only go
        #                  stale (#4263).
        #   runtime        every running ReplicaSet, StatefulSet revision and DaemonSet revision has BOTH
        #                  an applicationprofile and a networkneighborhood, each `completed/complete`.
        #                  A profile still learning inside its learning period is PENDING, not a failure.
        #
        # A scanned namespace is every live namespace not listed in
        # scripts/kubescape-unscanned-namespaces.tsv, the same reviewed list the scan-scope guard ties to
        # the operator's excludeNamespaces.
        #
        # READ-ONLY. It issues only `kubectl get`. Every result object is read through the aggregated
        # storage API, which strips `.spec` on a LIST, so control results are read back by NAME.
        #
        # FAIL CLOSED. An empty or failed read of any input is UNKNOWN (exit 2), never a clean pass: an
        # empty result collection and an empty expected set both compare "clean" against nothing.
        #
        # Usage:
        #   check-kubescape-result-coverage.sh [--context <kube-context>] [--vuln-max-age-days N]
        #   check-kubescape-result-coverage.sh --from-dir <dir> --now <epoch-seconds> [...]
        #
        # --from-dir evaluates previously captured JSON instead of reading a cluster (used by the tests);
        # the directory holds the files named in INPUTS below, each a Kubernetes `List`.
        #
        # Output: one line per problem on stdout (MISSING / STALE / SPLIT / PARTIAL / EMPTY), PENDING and
        # ORPHAN lines for information, then one COVERAGE line per surface.
        #
        # Exit codes:
        #   0  every expected object has a current result
        #   1  at least one result is missing, stale or split; each is named
        #   2  cannot check: bad usage, a failed or empty read, or unparseable input

        set -uo pipefail

        die() {
          printf 'check-kubescape-result-coverage: %s\n' "$*" >&2
          exit 2
        }

        repo_root="$(cd "$(dirname "$${BASH_SOURCE[0]}")/.." && pwd)" ||
          die "could not resolve the repository root"

        context=''
        cache_dir=''
        from_dir=''
        snapshot_dir=''
        now=''
        vuln_max_age_days=7
        reviewed="$${repo_root}/scripts/kubescape-unscanned-namespaces.tsv"

        need_value() {
          [ "$#" -ge 2 ] && [ -n "$${2-}" ] || die "$1 needs a value"
        }

        while [ "$#" -gt 0 ]; do
          case "$1" in
          --context) need_value "$@" && context="$2" && shift 2 ;;
          --cache-dir) need_value "$@" && cache_dir="$2" && shift 2 ;;
          --from-dir) need_value "$@" && from_dir="$2" && shift 2 ;;
          --snapshot-dir) need_value "$@" && snapshot_dir="$2" && shift 2 ;;
          --now) need_value "$@" && now="$2" && shift 2 ;;
          --vuln-max-age-days) need_value "$@" && vuln_max_age_days="$2" && shift 2 ;;
          --reviewed-list) need_value "$@" && reviewed="$2" && shift 2 ;;
          *) die "unknown argument: $1" ;;
          esac
        done

        case "$${vuln_max_age_days}" in '' | *[!0-9]*) die "--vuln-max-age-days must be a whole number" ;; esac
        # Normalize leading zeroes without arithmetic: Bash treats them as octal, and an arbitrarily long
        # digit string can overflow before the later days-to-seconds multiplication is reached.
        leading_zeros="$${vuln_max_age_days%%[!0]*}"
        vuln_max_age_days="$${vuln_max_age_days#"$${leading_zeros}"}"
        [ -n "$${vuln_max_age_days}" ] || vuln_max_age_days=0
        readonly MAX_SAFE_VULN_AGE_DAYS=106751991167300 # floor(INT64_MAX / 86400)
        if [ "$${#vuln_max_age_days}" -gt "$${#MAX_SAFE_VULN_AGE_DAYS}" ] ||
          { [ "$${#vuln_max_age_days}" -eq "$${#MAX_SAFE_VULN_AGE_DAYS}" ] &&
            [ "$${vuln_max_age_days}" -gt "$${MAX_SAFE_VULN_AGE_DAYS}" ]; }; then
          die "--vuln-max-age-days exceeds the safe range"
        fi
        case "$${now}" in *[!0-9]*) die "--now must be epoch seconds" ;; esac
        command -v jq >/dev/null 2>&1 || die "jq is required but not installed"
        [ -f "$${reviewed}" ] || die "reviewed unscanned-namespace list not found: $${reviewed}"

        # namespaces.json      kubectl get namespaces
        # workloads.json       kubectl get deployments,statefulsets,daemonsets,cronjobs -A
        # pods.json            kubectl get pods -A
        # posture.json         workloadconfigurationscans, each read back BY NAME (spec intact)
        # posture-list.json    kubectl get workloadconfigurationscans -A  (names only; spec is stripped)
        # vulnerability.json   kubectl get vulnerabilitymanifestsummaries -A
        # vulnerability-stored.json  the same summaries, each read back BY NAME (stored object)
        # profiles.json        kubectl get applicationprofiles -A
        # neighborhoods.json   kubectl get networkneighborhoods -A
        readonly INPUTS='namespaces workloads pods posture-list posture vulnerability vulnerability-stored profiles neighborhoods'

        # Only workload kinds carry a posture result the expected set can ask for; the other ~2500 stored
        # objects (Secrets, RBAC, Services, ...) are never read back, which keeps a live run to a few calls.
        readonly POSTURE_KINDS='.items[] | select(.metadata.labels["kubescape.io/workload-kind"] | IN("Deployment", "StatefulSet", "DaemonSet", "CronJob"))'

        work="$(mktemp -d)" || die "could not create a temporary directory"
        trap 'rm -rf "$${work}"' EXIT

        kc() {
          [ -z "$${cache_dir}" ] || set -- --cache-dir "$${cache_dir}" "$@"
          [ -z "$${context}" ] || set -- --context "$${context}" "$@"
          kubectl "$@"
        }

        fetch() {
          local name="$1"
          shift
          kc get "$@" -o json >"$${work}/$${name}.json" 2>"$${work}/$${name}.err" ||
            die "reading $${name} failed: $(head -c 300 "$${work}/$${name}.err")"
        }

        if [ -n "$${from_dir}" ]; then
          for name in $${INPUTS}; do
            [ -f "$${from_dir}/$${name}.json" ] || die "--from-dir is missing $${name}.json"
            cp "$${from_dir}/$${name}.json" "$${work}/$${name}.json" || die "could not copy $${name}.json"
          done
        else
          command -v kubectl >/dev/null 2>&1 || die "kubectl is required but not installed"
          fetch namespaces namespaces
          fetch workloads deployments,statefulsets,daemonsets,cronjobs -A
          fetch pods pods -A
          fetch posture-list workloadconfigurationscans -A
          fetch vulnerability vulnerabilitymanifestsummaries -A
          fetch profiles applicationprofiles -A
          fetch neighborhoods networkneighborhoods -A

          # A LIST of this aggregated API is served from each object's metadata row: it returns
          # `.spec.controls` as null on every posture object, which reads exactly like "no control
          # results", and it cannot show whether that row still agrees with the stored object. A GET naming
          # several objects reads the stored objects, so read back by name, one namespace and at most 50
          # names per call.
          # read_back_by_name <resource> <list-input> <output-input> <jq-selector>
          read_back_by_name() {
            local resource="$1" list="$2" out="$3" selector="$4"
            printf '{"items":[]}\n' >"$${work}/$${out}.json"
            jq -r "$${selector} | [.metadata.namespace, .metadata.name] | @tsv" "$${work}/$${list}.json" |
              sort | awk -F'\t' '
                $1 != ns || n == 50 { if (line != "") print line; ns = $1; n = 0; line = $1 }
                { line = line "\t" $2; n++ }
                END { if (line != "") print line }' >"$${work}/batches" ||
              die "could not group $${out} objects for reading by name"
            while IFS=$'\t' read -r -a batch; do
              [ "$${#batch[@]}" -ge 2 ] || continue
              kc -n "$${batch[0]}" get "$${resource}" "$${batch[@]:1}" -o json >"$${work}/batch.json" \
                2>"$${work}/batch.err" || die "reading $${out} objects in $${batch[0]} failed: $(head -c 300 "$${work}/batch.err")"
              if ! jq -s '{items: (.[0].items + (.[1].items // [.[1]]))}' "$${work}/$${out}.json" "$${work}/batch.json" \
                >"$${work}/$${out}.next" || ! mv "$${work}/$${out}.next" "$${work}/$${out}.json"; then
                die "could not merge $${out} objects read from $${batch[0]}"
              fi
            done <"$${work}/batches"
          }
          read_back_by_name workloadconfigurationscans posture-list posture "$${POSTURE_KINDS}"
          read_back_by_name vulnerabilitymanifestsummaries vulnerability vulnerability-stored '.items[]'
        fi

        # A live collection can overlap a new vulnerability result. Freeze the implicit evaluation time
        # only after every read finishes so a result created during collection cannot look future-dated.
        # Tests pass --now explicitly and retain their deterministic clock.
        if [ -z "$${now}" ]; then
          now="$(date +%s)" || die "could not read the evaluation time"
          case "$${now}" in '' | *[!0-9]*) die "the evaluation time is not epoch seconds" ;; esac
        fi

        for name in $${INPUTS}; do
          jq -e '.items | type == "array"' "$${work}/$${name}.json" >/dev/null 2>&1 ||
            die "$${name}.json is not a Kubernetes List"
        done
        for name in namespaces workloads pods posture-list vulnerability profiles neighborhoods; do
          [ "$(jq '.items | length' "$${work}/$${name}.json")" -gt 0 ] ||
            die "$${name} read back empty; an empty read is UNKNOWN, never clean"
        done
        listed="$(jq "[$${POSTURE_KINDS}] | length" "$${work}/posture-list.json")"
        read_back="$(jq '.items | length' "$${work}/posture.json")"
        [ "$${listed}" = "$${read_back}" ] ||
          die "posture objects: $${listed} listed but $${read_back} read back by name"
        listed="$(jq '.items | length' "$${work}/vulnerability.json")"
        read_back="$(jq '.items | length' "$${work}/vulnerability-stored.json")"
        [ "$${listed}" = "$${read_back}" ] ||
          die "vulnerability summaries: $${listed} listed but $${read_back} read back by name"
        # A split is judged by comparing two versions, so an object without one cannot be judged.
        unversioned="$(jq -r -s '
          [ .[].items[] | select((.metadata.resourceVersion // "") == "")
            | "\(.metadata.namespace)/\(.metadata.name)" ] | unique | join(", ")
        ' "$${work}/vulnerability.json" "$${work}/vulnerability-stored.json")" ||
          die "could not validate vulnerability summary versions"
        [ -z "$${unversioned}" ] || die "vulnerability summary has no resourceVersion: $${unversioned}"

        # The reviewed list: one `<namespace><TAB><reason>` row per unscanned namespace, `#` comments.
        unscanned="$(awk -F'\t' '/^[[:space:]]*#/ || NF == 0 { next } { print $1 }' "$${reviewed}" |
          jq -R . | jq -sc .)" || die "could not parse $${reviewed}"
        [ "$(jq 'length' <<<"$${unscanned}")" -gt 0 ] || die "$${reviewed} lists no namespaces"

        # A pod can be Running before every configured regular container has appeared in
        # containerStatuses. Treating only the statuses that happen to exist as the expected set would
        # make that container, and its image, disappear from the coverage denominator.
        missing_container_statuses="$(jq -r --argjson unscanned "$${unscanned}" '
          [ .items[]
            | .metadata.namespace as $ns
            | select($unscanned | index($ns) == null)
            | select(.status.phase == "Running")
            | select(any(.metadata.ownerReferences[]?; .kind == "Job") | not)
            | . as $pod
            | [ .status.containerStatuses[]?.name ] as $regular
            | [ .status.initContainerStatuses[]?.name ] as $init
            | ( .spec.containers[]?
                | select(.name as $name | $regular | index($name) == null)
                | "\($pod.metadata.namespace)/\($pod.metadata.name) container=\(.name)" ),
              ( .spec.initContainers[]?
                | select(.restartPolicy == "Always")
                | select(.name as $name | $init | index($name) == null)
                | "\($pod.metadata.namespace)/\($pod.metadata.name) init-sidecar=\(.name)" )
          ] | unique | join(", ")
        ' "$${work}/pods.json")" || die "could not validate running container statuses"
        [ -z "$${missing_container_statuses}" ] ||
          die "running pod is missing long-lived container status: $${missing_container_statuses}"

        # StatefulSet and DaemonSet runtime objects are keyed by controller-revision-hash. Omitting a
        # pod whose label is briefly missing would make the runtime expected set look complete.
        missing_runtime_revisions="$(jq -r --argjson unscanned "$${unscanned}" '
          [ .items[]
            | .metadata.namespace as $ns
            | select($unscanned | index($ns) == null)
            | select(.status.phase == "Running")
            | . as $pod
            | (.metadata.ownerReferences // [] | map(select(.controller == true)) | first) as $owner
            | select($owner.kind == "StatefulSet" or $owner.kind == "DaemonSet")
            | select((.metadata.labels["controller-revision-hash"] // "") == "")
            | "\($pod.metadata.namespace)/\($pod.metadata.name) controller=\($owner.kind)/\($owner.name)"
          ] | unique | join(", ")
        ' "$${work}/pods.json")" || die "could not validate runtime revision identities"
        [ -z "$${missing_runtime_revisions}" ] ||
          die "running managed pod has no controller revision: $${missing_runtime_revisions}"

        # A future or malformed pod start time makes an incomplete runtime result look PENDING until the
        # skewed time plus the learning period has elapsed. Runtime age is trustworthy only when its
        # selected start is no later than the post-read evaluation clock.
        bad_runtime_start_times="$(jq -r --argjson unscanned "$${unscanned}" --argjson now "$${now}" '
          [ .items[]
            | .metadata.namespace as $ns
            | select($unscanned | index($ns) == null)
            | select(.status.phase == "Running")
            | . as $pod
            | (.metadata.ownerReferences // [] | map(select(.controller == true)) | first) as $owner
            | select($owner.kind | IN("ReplicaSet", "StatefulSet", "DaemonSet"))
            | (.status.startTime // .metadata.creationTimestamp) as $raw
            | ($raw | if type == "string" then (sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601?) else null end) as $at
            | select($at == null or $at > $now)
            | "\($pod.metadata.namespace)/\($pod.metadata.name) start=\($raw // "<missing>")"
          ] | unique | join(", ")
        ' "$${work}/pods.json")" || die "could not validate runtime start times"
        [ -z "$${bad_runtime_start_times}" ] ||
          die "running managed pod has an invalid or future start time: $${bad_runtime_start_times}"

        # The namespace label is part of a posture result's identity, but Kubernetes namespace scope is
        # authoritative. A corrupt label must not let an object in one namespace satisfy another.
        bad_posture_identities="$(jq -r '
          [ .items[]
            | .metadata.labels as $labels
            | $labels["kubescape.io/workload-kind"] as $kind
            | $labels["kubescape.io/workload-namespace"] as $label_namespace
            | $labels["kubescape.io/workload-name"] as $name
            | select(
                ($kind | type) != "string" or $kind == "" or
                ($label_namespace | type) != "string" or $label_namespace == "" or
                ($name | type) != "string" or $name == "" or
                $label_namespace != (.metadata.namespace // ""))
            | "\(.metadata.namespace // "<missing>")/\(.metadata.name) " +
              "kind=\($kind // "<missing>") namespace=\($label_namespace // "<missing>") name=\($name // "<missing>")"
          ] | unique | join(", ")
        ' "$${work}/posture.json")" || die "could not validate posture result identities"
        [ -z "$${bad_posture_identities}" ] ||
          die "posture result identity is incomplete or disagrees with metadata namespace: $${bad_posture_identities}"

        # Kubescape publishes controls as an object keyed by control ID. jq's length also accepts arrays
        # and strings, so validate the collection type before a malformed nonempty value can look current.
        bad_posture_controls="$(jq -r '
          [ .items[]
            | .spec.controls as $controls
            | select($controls != null and ($controls | type) != "object")
            | "\(.metadata.namespace)/\(.metadata.name) type=\($controls | type)"
          ] | unique | join(", ")
        ' "$${work}/posture.json")" || die "could not validate posture control collections"
        [ -z "$${bad_posture_controls}" ] ||
          die "posture result has non-object controls: $${bad_posture_controls}"

        # A label-derived workload identity must be unique. Letting jq's object merge pick the last result
        # makes list order decide whether an empty duplicate is visible.
        duplicate_posture_identities="$(jq -r '
          [ .items[]
            | .metadata.labels as $labels
            | "\($labels["kubescape.io/workload-kind"])/\($labels["kubescape.io/workload-namespace"])/\($labels["kubescape.io/workload-name"])"
          ] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")
        ' "$${work}/posture.json")" || die "could not validate posture result uniqueness"
        [ -z "$${duplicate_posture_identities}" ] ||
          die "duplicate posture result identity: $${duplicate_posture_identities}"

        # A future scan time makes age negative and would otherwise look permanently current until the
        # wall clock catches up. Missing and malformed times are equally unusable as freshness evidence.
        bad_vulnerability_times="$(jq -r --argjson now "$${now}" '
          [ .items[]
            | .metadata.annotations["kubescape.io/timestamp"] as $raw
            | ($raw | tonumber?) as $at
            | select($at == null or $at < 0 or $at > $now)
            | "\(.metadata.namespace)/\(.metadata.name) timestamp=\($raw // "<missing>")"
          ] | unique | join(", ")
        ' "$${work}/vulnerability.json")" || die "could not validate vulnerability timestamps"
        [ -z "$${bad_vulnerability_times}" ] ||
          die "vulnerability result timestamp is invalid or in the future: $${bad_vulnerability_times}"

        # Only an absent learning-period label defaults to 24h. A present value outside the supported
        # number-plus-s/m/h format is corrupt input, not permission to silently substitute the default.
        bad_learning_periods="$(jq -r -s '
          [ .[].items[]
            | .metadata.labels["kubescape.io/learning-period"] as $period
            | select($period != null)
            | select(($period | type) != "string" or ($period | test("^[0-9]+[smh]$") | not))
            | "\(.metadata.namespace)/\(.metadata.name)=\($period)"
          ] | unique | join(", ")
        ' "$${work}/profiles.json" "$${work}/neighborhoods.json")" ||
          die "could not validate runtime learning periods"
        [ -z "$${bad_learning_periods}" ] ||
          die "runtime result has malformed learning period: $${bad_learning_periods}"

        # An unidentified running image cannot simply disappear from the expected set. If at least one
        # other image has a digest, silently dropping this container would make the coverage denominator
        # smaller and could turn a real gap into a clean result.
        unknown_images="$(jq -r --argjson unscanned "$${unscanned}" '
          def restartable_init_statuses:
            [ . as $pod
              | .status.initContainerStatuses[]?
              | . as $status
              | select(any($pod.spec.initContainers[]?;
                  .name == $status.name and .restartPolicy == "Always")) ];
          def long_lived_statuses:
            if .status.phase == "Running" then
              [ .status.containerStatuses[]? ] + restartable_init_statuses +
              [ .status.ephemeralContainerStatuses[]? | select(.state.running != null) ]
            elif .status.phase == "Pending" then
              [ restartable_init_statuses[] | select(.state.running != null) ]
            else [] end;
          [ .items[]
            | .metadata.namespace as $ns
            | select($unscanned | index($ns) == null)
            | select(any(.metadata.ownerReferences[]?; .kind == "Job") | not)
            | . as $pod
            | long_lived_statuses[]
            | select((.imageID // "") | test("sha256:[0-9a-f]{64}$") | not)
            | "\($pod.metadata.namespace)/\($pod.metadata.name) container=\(.name)"
          ] | unique | join(", ")
        ' "$${work}/pods.json")" || die "could not validate running image identities"
        [ -z "$${unknown_images}" ] || die "running image identity has no SHA-256 digest: $${unknown_images}"

        jq -n -r \
          --argjson unscanned "$${unscanned}" \
          --argjson now "$${now}" \
          --argjson vuln_max_age "$((vuln_max_age_days * 86400))" \
          --slurpfile namespaces "$${work}/namespaces.json" \
          --slurpfile workloads "$${work}/workloads.json" \
          --slurpfile pods "$${work}/pods.json" \
          --slurpfile posture "$${work}/posture.json" \
          --slurpfile vulnerability "$${work}/vulnerability.json" \
          --slurpfile vulnerability_stored "$${work}/vulnerability-stored.json" \
          --slurpfile profiles "$${work}/profiles.json" \
          --slurpfile neighborhoods "$${work}/neighborhoods.json" \
          -f /dev/stdin >"$${work}/report" <<'JQ' || die "evaluating the captured objects failed"
        def in_scope: .metadata.namespace as $ns | $unscanned | index($ns) == null;
        def epoch: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
        def digest: capture("(?<d>sha256:[0-9a-f]{64})$").d // null;
        def restartable_init_statuses:
          [ . as $pod
            | .status.initContainerStatuses[]?
            | . as $status
            | select(any($pod.spec.initContainers[]?;
                .name == $status.name and .restartPolicy == "Always")) ];
        def long_lived_statuses:
          if .status.phase == "Running" then
            [ .status.containerStatuses[]? ] + restartable_init_statuses +
            [ .status.ephemeralContainerStatuses[]? | select(.state.running != null) ]
          elif .status.phase == "Pending" then
            [ restartable_init_statuses[] | select(.state.running != null) ]
          else [] end;

        # ---- posture --------------------------------------------------------------------------------
        ( [ $workloads[0].items[] | select(in_scope)
            | select(.kind | IN("Deployment", "StatefulSet", "DaemonSet", "CronJob"))
            | "\(.kind)/\(.metadata.namespace)/\(.metadata.name)" ] | unique ) as $want
        | ( [ $posture[0].items[] | . as $o | .metadata.labels as $l
              | { key: "\($l["kubescape.io/workload-kind"])/\($l["kubescape.io/workload-namespace"])/\($l["kubescape.io/workload-name"])",
                  controls: (($o.spec.controls // {}) | length) } ] ) as $have
        | ( $have | map({ (.key): .controls }) | add // {} ) as $controls
        | ( [ $want[] | select($controls[.] == null) | "MISSING posture \(.)" ] ) as $missing
        | ( [ $want[] | select($controls[.] == 0) | "EMPTY posture \(.) no control results" ] ) as $empty
        | ( [ $have[].key | select(test("^(Deployment|StatefulSet|DaemonSet|CronJob)/"))
              | select(. as $k | $want | index($k) == null) | "ORPHAN posture \(.)" ] | unique ) as $orphan
        | ($missing + $empty)[], $orphan[],
          "COVERAGE posture expected=\($want | length) current=\($want | length - ($missing + $empty | length)) missing=\($missing | length) empty=\($empty | length) orphan=\($orphan | length)",

        # ---- vulnerability --------------------------------------------------------------------------
        ( [ $pods[0].items[] | select(in_scope)
            | select(any(.metadata.ownerReferences[]?; .kind == "Job") | not)
            | long_lived_statuses[] | { digest: (.imageID | digest), image: .image } ]
          | map(select(.digest != null)) | unique_by(.digest) ) as $images
        | ( [ $vulnerability[0].items[] | .metadata.annotations as $a
              | { digest: (($a["kubescape.io/image-id"] // "") | digest),
                  at: (($a["kubescape.io/timestamp"] // "0") | tonumber) } ]
          | map(select(.digest != null)) | group_by(.digest) | map({ (.[0].digest): (map(.at) | max) }) | add // {} ) as $scanned_at
        | ( [ $images[] | select($scanned_at[.digest] == null) | "MISSING vulnerability \(.image) \(.digest)" ] ) as $missing
        | ( [ $images[] | select($scanned_at[.digest] != null and ($now - $scanned_at[.digest]) > $vuln_max_age)
              | "STALE vulnerability \(.image) \(.digest) scanned \($scanned_at[.digest] | todate)" ] ) as $stale
        | ( $vulnerability_stored[0].items
            | map({ ("\(.metadata.namespace)/\(.metadata.name)"): .metadata.resourceVersion }) | add // {} ) as $stored_version
        | ( [ $vulnerability[0].items[] | "\(.metadata.namespace)/\(.metadata.name)" as $k
              | select($stored_version[$k] != .metadata.resourceVersion)
              | "SPLIT vulnerability \($k) listed=\(.metadata.resourceVersion) stored=\($stored_version[$k] // "absent")" ]
          | unique ) as $split
        | ($missing + $stale + $split)[],
          "COVERAGE vulnerability expected=\($images | length) current=\($images | length - ($missing + $stale | length)) missing=\($missing | length) stale=\($stale | length) split=\($split | length)",

        # ---- runtime --------------------------------------------------------------------------------
        ( [ $pods[0].items[] | select(in_scope) | select(.status.phase == "Running")
            | . as $p | (.metadata.ownerReferences // [] | map(select(.controller == true)) | first) as $o
            | select($o != null)
            | if $o.kind == "ReplicaSet" then "replicaset-\($o.name)"
              elif $o.kind == "StatefulSet" then "statefulset-\($p.metadata.labels["controller-revision-hash"] // "")"
              elif $o.kind == "DaemonSet" then "daemonset-\($o.name)-\($p.metadata.labels["controller-revision-hash"] // "")"
              else empty end
            | select(test("-$") | not)
            | { key: "\($p.metadata.namespace)/\(.)", since: ($p.status.startTime // $p.metadata.creationTimestamp | epoch) } ]
          | group_by(.key) | map({ key: .[0].key, since: (map(.since) | min) }) ) as $want
        | ( def index_of($list): [ $list[0].items[] | { key: "\(.metadata.namespace)/\(.metadata.name)",
                value: { status: (.metadata.annotations["kubescape.io/status"] // ""),
                         completion: (.metadata.annotations["kubescape.io/completion"] // ""),
                         period: (.metadata.labels["kubescape.io/learning-period"] // "24h") } } ] | from_entries;
            { ap: index_of($profiles), nn: index_of($neighborhoods) } ) as $idx
        | def seconds: capture("^(?<n>[0-9]+)(?<u>[smh])$") as $c
            | ($c.n | tonumber) * ({ s: 1, m: 60, h: 3600 }[$c.u]);
          ( [ $want[] | . as $w | [ "ap", "nn" ][] as $kind | $idx[$kind][$w.key] as $r
              | { key: $w.key, since: $w.since,
                  kind: ({ ap: "applicationprofile", nn: "networkneighborhood" }[$kind]), r: $r } ] ) as $checks
        | ( [ $checks[] | select(.r == null) | "MISSING runtime \(.key) \(.kind)" ] ) as $missing
        | ( [ $checks[] | select(.r != null and .r.status == "completed" and .r.completion != "complete")
              | "PARTIAL runtime \(.key) \(.kind) completion=\(.r.completion)" ] ) as $partial
        | ( [ $checks[] | select(.r != null and .r.status != "completed")
              | select(($now - .since) > ((.r.period | seconds) // 86400))
              | "STALE runtime \(.key) \(.kind) status=\(.r.status) past its \(.r.period) learning period" ] ) as $stale
        | ( [ $checks[] | select(.r != null and .r.status != "completed")
              | select(($now - .since) <= ((.r.period | seconds) // 86400))
              | "PENDING runtime \(.key) \(.kind) status=\(.r.status) still learning" ] ) as $pending
        | ( [ $missing[], $partial[], $stale[] | capture("^[A-Z]+ runtime (?<k>[^ ]+)").k ] | unique ) as $failed
        | ($missing + $partial + $stale)[], $pending[],
          "COVERAGE runtime expected=\($want | length) current=\($want | length - ($failed | length) - ([ $pending[] | capture("^PENDING runtime (?<k>[^ ]+)").k ] - $failed | unique | length)) failing=\($failed | length) missing=\($missing | length) partial=\($partial | length) stale=\($stale | length) pending=\($pending | length)"
        JQ

        cat "$${work}/report"
        for surface in posture vulnerability runtime; do
          line="$(grep "^COVERAGE $${surface} " "$${work}/report")" || die "no $${surface} result was computed"
          case "$${line}" in *' expected=0 '*) die "$${surface}: the expected set is empty; that is UNKNOWN, never clean" ;; esac
        done
        # Optional, private, short-lived input handoff for the security-progress exporter.
        # Publish only after every input and denominator was validated. Exit 1 still has
        # valid evidence of gaps; exit 2 must never leave a usable snapshot behind.
        if [ -n "$${snapshot_dir}" ]; then
          [ -d "$${snapshot_dir}" ] && [ -z "$(ls -A "$${snapshot_dir}")" ] ||
            die "--snapshot-dir must name an existing empty directory"
          for name in $${INPUTS}; do
            cp "$${work}/$${name}.json" "$${snapshot_dir}/$${name}.json" || die "could not export $${name}"
          done
          cp "$${work}/report" "$${snapshot_dir}/report.txt" || die "could not export coverage report"
        fi
        if grep -qE '^(MISSING|STALE|SPLIT|PARTIAL|EMPTY) ' "$${work}/report"; then
          exit 1
        fi
        exit 0
    collector.sh: |
        #!/usr/bin/env bash
        # A failed collection replaces the previous snapshot with explicit unknowns.
        set -uo pipefail
        config_dir="$${CONFIG_DIR:-/config}"
        coverage_check="$${COVERAGE_CHECK:-/config/check-kubescape-result-coverage.sh}"
        reviewed_list="$${REVIEWED_LIST:-/config/kubescape-unscanned-namespaces.tsv}"
        metrics_dir="$${METRICS_DIR:-/metrics}"
        interval="$${COLLECTION_INTERVAL_SECONDS:-300}"
        case "$${interval}" in '' | *[!0-9]* | 0) exit 2 ;; esac
        case "$${1:-}" in '' | --once) ;; *) exit 2 ;; esac
        mkdir -p "$${metrics_dir}" || exit 2
        # Keep the projected credential in its file. Neither credentials nor kubeconfig
        # contents are printed, and only this container receives the token volume.
        if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
          export KUBECONFIG=/tmp/security-progress-kubeconfig
          umask 077
          cat >"$${KUBECONFIG}" <<'YAML'
        apiVersion: v1
        kind: Config
        clusters:
          - name: cluster
            cluster:
              server: https://kubernetes.default.svc
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        users:
          - name: collector
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        contexts:
          - name: cluster
            context:
              cluster: cluster
              user: collector
        current-context: cluster
        YAML
        fi

        collect() (
          set -euo pipefail
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$${snapshot}"' EXIT
          now="$(date +%s)"
          # Isolate the two sources. One unavailable API must not hide the other source.
          if kubectl --cache-dir=/tmp/security-progress-kubectl --request-timeout=30s get policyreports.wgpolicyk8s.io -A -o json >"$${snapshot}/policy.json" &&
            kubectl --cache-dir=/tmp/security-progress-kubectl --request-timeout=30s get clusterpolicyreports.wgpolicyk8s.io -o json >"$${snapshot}/cluster-policy.json" &&
            jq -n --slurpfile policy "$${snapshot}/policy.json" --slurpfile cluster "$${snapshot}/cluster-policy.json" \
              '{mode:"policy",policy:$policy[0],cluster_policy:$cluster[0]}' |
            jq -er -f "$${config_dir}/metrics.jq" >"$${snapshot}/policy.prom"; then
            cat "$${snapshot}/policy.prom"
            printf 'platform_security_collection_success{surface="policy"} 1\n'
          else
            printf 'platform_security_collection_success{surface="policy"} 0\n'
            printf 'policy collection is unknown\n' >&2
          fi
          printf 'platform_security_snapshot_timestamp_seconds{surface="policy"} %s\n' "$${now}"

          mkdir "$${snapshot}/kubescape"
          rc=0
          timeout 240 bash "$${coverage_check}" --cache-dir /tmp/security-progress-kubectl --snapshot-dir "$${snapshot}/kubescape" --reviewed-list "$${reviewed_list}" \
            >"$${snapshot}/coverage.log" 2>&1 || rc=$?
          if [ "$${rc}" -le 1 ] && (
            cd "$${snapshot}/kubescape"
            jq -n --argjson now "$(date +%s)" \
              --slurpfile workloads workloads.json --slurpfile pods pods.json --slurpfile posture posture.json \
              --slurpfile vulnerability vulnerability.json --slurpfile stored vulnerability-stored.json \
              --rawfile report report.txt --rawfile excluded "$${reviewed_list}" \
              '{mode:"kubescape",now:$now,workloads:$workloads[0],pods:$pods[0],posture:$posture[0],
                vulnerability:$vulnerability[0],vulnerability_stored:$stored[0],coverage_report:$report,
                unscanned:($excluded | split("\n") | map(select(length > 0 and (startswith("#")|not)) | split("\t")[0]))}' |
              jq -er -f "$${config_dir}/metrics.jq" >"$${snapshot}/kubescape.prom"
          ); then
            cat "$${snapshot}/kubescape.prom"
            printf 'platform_security_collection_success{surface="kubescape"} 1\n'
          else
            printf 'platform_security_collection_success{surface="kubescape"} 0\n'
            printf 'kubescape collection is unknown\n' >&2
          fi
          printf 'platform_security_snapshot_timestamp_seconds{surface="kubescape"} %s\n' "$(date +%s)"
        )

        while :; do
          # Atomic replacement; a reader can never scrape half a collection. Count
          # series from the old snapshot disappear immediately when their source fails.
          if collect | sh "$${config_dir}/bind-project-metrics.sh" >"$${metrics_dir}/.next"; then
            :
          else
            printf 'platform_security_collection_success{surface="policy"} 0\nplatform_security_collection_success{surface="kubescape"} 0\n' \
              >"$${metrics_dir}/.next"
          fi
          mv "$${metrics_dir}/.next" "$${metrics_dir}/metrics" || exit 2
          [ "$${1:-}" != --once ] || break
          sleep "$${interval}"
        done
