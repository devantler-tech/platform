---
# ZITADEL's master key (apps/customer-identity/external-secret-masterkey.yaml).
# Create-only: once OpenBao holds a key, a regenerated in-cluster value never
# replaces it, so a rebuilt cluster that restores OpenBao keeps the key its
# restored database was encrypted with (docs/dr/crypto-custody.md).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-customer-identity-zitadel-masterkey
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-customer-identity-zitadel-masterkey
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/customer-identity/zitadel
          property: masterkey
