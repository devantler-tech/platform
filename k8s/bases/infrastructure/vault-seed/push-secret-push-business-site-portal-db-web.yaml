---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-business-site-portal-db-web
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-business-site-portal-db-web
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/business-site/portal-db
          property: web-password
