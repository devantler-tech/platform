---
# The portal's client secret at the customer Dex: read by Dex
# (apps/customer-identity/external-secret-dex-portal-client.yaml) and by the
# business-site portal. Create-only, so both keep the same value across a
# rebuilt cluster that restores OpenBao.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-customer-identity-portal-client
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-customer-identity-portal-client
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/customer-identity/portal-client
          property: client-secret
