---
# Read-back probe for the shared GHCR seed
# ----------------------------------------
# Reads infrastructure/ghcr/auth back out of OpenBao through the same
# ClusterSecretStore the `ghcr-auth` consumers use, into a flux-system Secret the
# production deploy bridge reads. It is the only read-only way to see what
# OpenBao holds right now: the consumers refresh hourly, so after an OpenBao raft
# restore they can keep the correct value while the seed itself is stale.
#
# scripts/refresh-flux-ghcr-auth.sh skips its fences and writes only when this
# probe is Ready, refreshed within two intervals, and equal to the Git/SOPS
# credential. Anything else (including this probe not existing yet) sends the
# bridge down its full fenced transaction, which force-syncs seed-ghcr. Keep the
# interval in step with GHCR_SEED_PROBE_REFRESH_SECONDS in that script.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-seed-probe
  namespace: flux-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-seed-probe
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson  # checkov:skip=CKV_SECRET_6:names the key in the synced Secret; the value lives in OpenBao
      remoteRef:
        key: infrastructure/ghcr/auth
        property: dockerconfigjson
