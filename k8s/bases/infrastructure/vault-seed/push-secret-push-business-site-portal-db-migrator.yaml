---
# The portal database's migration and web passwords
# (apps/business-site/external-secret-portal-db-logins.yaml, and the web one
# also in the portal's settings). Create-only, so a rebuilt cluster that
# restores OpenBao keeps the passwords its restored database uses.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-business-site-portal-db-migrator
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-business-site-portal-db-migrator
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/business-site/portal-db
          property: migrator-password
