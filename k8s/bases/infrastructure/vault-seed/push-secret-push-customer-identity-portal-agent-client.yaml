# Native generation and durable custody, separate from the browser client.
# Create-only preserves the restored OpenBao credential after a cluster rebuild.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-customer-identity-portal-agent-client
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-customer-identity-portal-agent-client
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/customer-identity/portal-agent-client
          property: client-secret
