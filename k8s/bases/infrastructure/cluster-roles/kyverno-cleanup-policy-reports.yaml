# Lets the Kyverno cleanup controller read and delete namespaced policy
# reports, which the prune-stale-policy-reports (#2573) and
# prune-unscanned-namespace-policy-reports (#3155) DeletingPolicies require.
# The label aggregates this role into the cleanup controller's chart-managed
# ClusterRole. Scoped to policyreports only, the one resource those policies
# match; cluster-scoped reports are not granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:cleanup-controller:policy-reports
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports]
    verbs: [get, list, watch, delete]
