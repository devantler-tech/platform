# Aggregate ClusterRole that extends the scoped `tenant-edit` ClusterRole with
# limited Cilium network-policy verbs, so a self-service tenant can create
# additive CiliumNetworkPolicy allow-lists in its namespace without receiving
# write access to platform-maintained policies.
#
# The `add-default-deny` Kyverno policy generates deny-all + allow-dns
# CiliumNetworkPolicies in every namespace. This role protects those existing
# objects from tenant update, patch, or delete, but Cilium combines matching
# allow rules: a tenant-created permissive policy can still widen traffic until
# admission constraints land (platform#3150). `create` remains here solely for
# self-service additive allow-lists. Tenants cannot manage cluster-wide policy
# resources.
#
# This role is intentionally NOT aggregated into the built-in `edit` role.
# Grants only the NAMESPACED `ciliumnetworkpolicies` — never the cluster-scoped
# `ciliumclusterwidenetworkpolicies`, which remain platform territory.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-tenant-edit
  labels:
    devantler.tech/aggregate-to-tenant-edit: "true"
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
    verbs:
      - get
      - list
      - watch
      - create
