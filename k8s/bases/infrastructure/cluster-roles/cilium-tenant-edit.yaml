# Aggregate ClusterRole that extends the scoped `tenant-edit` ClusterRole with
# limited Cilium network-policy verbs, so a self-service tenant can create
# additive CiliumNetworkPolicy allow-lists in its namespace without receiving
# write access to platform-maintained policies.
#
# The platform keeps the security FLOOR regardless: the `add-default-deny`
# Kyverno policy generates deny-all + allow-dns CiliumNetworkPolicies in every
# namespace. Those generated policies, plus platform-owned tenant allow-lists,
# are part of the namespace security boundary — so tenants may only layer ALLOWs
# on top, scoped to their own namespace. They cannot update, patch, or delete an
# existing policy such as `default-deny`, and cannot manage cluster-wide policy
# resources.
#
# This role is intentionally NOT aggregated into the built-in `edit` role.
# Grants only the NAMESPACED `ciliumnetworkpolicies` — never the cluster-scoped
# `ciliumclusterwidenetworkpolicies`, which remain platform territory.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-tenant-edit
  labels:
    devantler.tech/aggregate-to-tenant-edit: "true"
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
    verbs:
      - get
      - list
      - watch
      - create
