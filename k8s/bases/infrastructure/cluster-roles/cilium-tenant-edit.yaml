# Aggregate ClusterRole that extends the scoped `tenant-edit` ClusterRole with
# Cilium network-policy reconciliation verbs, so a self-service tenant can own
# the allow-lists in its deployment artifact.
#
# Flux impersonates the tenant ServiceAccount and uses server-side apply plus
# pruning, so PATCH and DELETE are required for this self-service workflow.
# These verbs also let a tenant change any namespaced CiliumNetworkPolicy, and
# Cilium combines matching allow rules, so RBAC alone does not make the
# namespace boundary hold. Admission does: the
# `restrict-tenant-network-policies` ClusterPolicy requires every tenant ingress
# source and egress destination to carry a real constraint, refuses the broad
# `all`/`world`/`cluster` entities and the world-equivalent CIDRs, and reserves
# the generated `default-deny` and `allow-dns` names — so these verbs stay
# self-service without being able to dissolve the generated floor.
#
# This role is intentionally NOT aggregated into the built-in `edit` role.
# Grants only the NAMESPACED `ciliumnetworkpolicies` — never the cluster-scoped
# `ciliumclusterwidenetworkpolicies`, which remain platform territory.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-tenant-edit
  labels:
    devantler.tech/aggregate-to-tenant-edit: "true"
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
