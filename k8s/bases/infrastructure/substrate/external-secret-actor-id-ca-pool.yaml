# Signs actor X.509 identities; mounted by the Substrate API server.
#
# Substrate reads a CA pool as JSON in the Secret's "pool" key: each CA's
# PKCS#8 key and DER certificate, base64-encoded, plus the CA that signs.
# A PEM body is that base64 text between its armour lines, so the template
# strips the armour and whitespace. ID "1" matches upstream's installer.
# The Secret also carries the CA as tls.crt/tls.key, as upstream's does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: substrate-ca-sources
  target:
    name: actor-id-ca-pool
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        pool: >-
          {"CAs":[{"ID":"1","SigningKeyPKCS8":"{{ index . "tls.key" | filterPEM "PRIVATE KEY" | replace "-----BEGIN PRIVATE KEY-----" "" | replace "-----END PRIVATE KEY-----" "" | nospace }}","RootCertificateDER":"{{ index . "tls.crt" | filterPEM "CERTIFICATE" | replace "-----BEGIN CERTIFICATE-----" "" | replace "-----END CERTIFICATE-----" "" | nospace }}"}],"ActiveForSigning":"1"}
        tls.crt: '{{ index . "tls.crt" }}'
        tls.key: '{{ index . "tls.key" }}'
  dataFrom:
    - extract:
        key: substrate-actor-id-ca
