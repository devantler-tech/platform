# The RustFS snapshot store's keys, generated once in-cluster
# (refreshInterval "0"). atelet reads them as AWS credentials; the control
# plane release renders them into RustFS (valuesFrom in
# helm-release-control-plane.yaml). The access key is a name, not a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: ate-system
spec:
  refreshInterval: "0"
  target:
    name: rustfs-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: substrate-snapshots
        AWS_SECRET_ACCESS_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: rustfs-secret-key
