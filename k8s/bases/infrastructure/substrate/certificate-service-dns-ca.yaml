# Signs the service DNS certificates of Substrate's servers (service-dns-ca-pool).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: substrate-service-dns-ca
  namespace: podcertificate-controller-system
spec:
  secretName: substrate-service-dns-ca
  commonName: substrate-service-dns-ca
  isCA: true
  usages:
    - cert sign
    - crl sign
    - digital signature
  # A long-lived root, renewed by cert-manager. rotationPolicy Never keeps the
  # key across renewals, so the pool keeps signing with, and trusting, the
  # same key and nothing it signed is invalidated.
  duration: 87600h
  privateKey:
    algorithm: Ed25519
    # Substrate's pool format stores PKCS#8 keys.
    encoding: PKCS8
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: substrate-self-signed
