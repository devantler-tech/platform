# Reads the cert-manager CA Secrets in this namespace through the Kubernetes
# API, so the CA-pool ExternalSecrets can template them into Substrate's
# format. Nothing leaves the namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: substrate-ca-sources
  namespace: podcertificate-controller-system
spec:
  provider:
    kubernetes:
      remoteNamespace: podcertificate-controller-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: substrate-ca-reader
