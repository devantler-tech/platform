# The coroot_monitor login, which Coroot's cluster-agent uses to read substrate-db's
# statistics (cluster.yaml). Generated once in-cluster: CNPG sets the role's
# password from this Secret, and the scrape annotations name it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-coroot-monitor
  namespace: ate-system
spec:
  refreshInterval: "0"
  target:
    name: substrate-db-coroot-monitor
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG reads a managed role's password from a basic-auth Secret.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coroot_monitor
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: substrate-db-coroot-monitor
