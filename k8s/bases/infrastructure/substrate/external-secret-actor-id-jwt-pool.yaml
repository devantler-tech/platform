# The key the Substrate API server signs actor JWTs with, in Substrate's JWT
# authority pool format: each authority's ID, algorithm and base64 PKCS#8 key.
# Only the cert-manager key is used; its certificate is a by-product.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-jwt-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: substrate-ca-sources
  target:
    name: actor-id-jwt-pool
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pool: >-
          {"Authorities":[{"ID":"1","Algorithm":"ES256","SigningKeyPKCS8":"{{ index . "tls.key" | filterPEM "PRIVATE KEY" | replace "-----BEGIN PRIVATE KEY-----" "" | replace "-----END PRIVATE KEY-----" "" | nospace }}"}],"ActiveForSigning":"1"}
  dataFrom:
    - extract:
        key: substrate-actor-id-jwt
