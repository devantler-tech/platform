# The public half of actor-id-ca-pool, which components that verify actor
# identities mount. Upstream's installer derives it the same way.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-certs
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: substrate-ca-sources
  target:
    name: actor-id-ca-certs
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.crt: '{{ index . "tls.crt" | filterPEM "CERTIFICATE" }}'
  dataFrom:
    - extract:
        key: substrate-actor-id-ca
