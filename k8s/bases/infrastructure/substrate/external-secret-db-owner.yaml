# The substrate_owner_user login, which creates Substrate's tables and runs its migrations. Generated once in-cluster:
# CNPG sets the role's password from this Secret (cluster.yaml), and the
# Substrate API server reads the connection string from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-owner
  namespace: ate-system
spec:
  refreshInterval: "0"
  target:
    name: substrate-db-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG reads a managed role's password from a basic-auth Secret.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: substrate_owner_user
        password: "{{ .password }}"
        ownerConnectionString: "postgres://substrate_owner_user:{{ .password }}@substrate-db-rw.ate-system.svc:5432/substrate?sslmode=require"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: substrate-db-owner
