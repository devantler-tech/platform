---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-podcert
  namespace: ate-system
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m0s
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: substrate-podcert
  # The certificate controller is one per cluster and independent of the
  # application release, as upstream installs it. It runs here rather than in
  # upstream's podcertificate-controller-system: its chart hard-codes an empty
  # pod securityContext, which the pod-security policy refuses outside the
  # namespaces exempt for host access, and this one already is for atelet. It signs from the
  # service-dns, pod-identity and postgres CA pools that ExternalSecrets build
  # in this namespace (external-secret-*-ca-pool.yaml); its pod waits for them.
  # The defaults already name the Substrate API server's namespace and service
  # account as the only PostgreSQL client-certificate requester; this install
  # uses password logins, so nothing requests one.
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
