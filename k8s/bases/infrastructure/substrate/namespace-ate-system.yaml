# Substrate is the sandbox runtime under kagent 1.0's agent harnesses
# (devantler-tech/platform#5892). This namespace holds its control plane, the
# atelet node agent and the in-cluster RustFS snapshot store. atelet runs as
# root with host paths and a few capabilities, so the namespace enforces the
# privileged Pod Security level and is on the infrastructure exclusion lists of
# the Kyverno pod-security policies and the Kubescape exceptions.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
