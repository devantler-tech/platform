# Deletes a PolicyReport in a namespace Kyverno no longer evaluates at all, once
# nothing has written to it for a day (#3155).
#
# The chart's default resource filters exclude the kube-system, kube-public,
# kube-node-lease and kyverno namespaces from admission, and since the reports
# controller honours those filters in background scans too
# (`skipResourceFilters: false`, #2134), nothing evaluates resources there. No
# report in those namespaces is created or rewritten: on prod on 2026-09-27, all
# 64 of them carried results from 2026-06-17, the last scan before #2134 rolled
# out, while 56 kube-system pods created since then had no report at all. What
# they show is a snapshot from June, not a current result: the one failing
# result left on the platform is one of them, for a workload whose policy has
# exempted it since August.
#
# prune-stale-policy-reports deliberately leaves these reports alone, because in
# a scanned namespace a report with no recent result may hold results only
# admission writes. That reasoning does not apply where admission writes nothing
# either, so this policy removes them. It stays safe if coverage ever returns:
# a report holding any result from the last 24 hours (24 scan intervals) is
# never deleted, so a namespace that is scanned again keeps its reports, and a
# namespace dropped from the list below simply keeps its old reports.
apiVersion: policies.kyverno.io/v1beta1
kind: DeletingPolicy
metadata:
  name: prune-unscanned-namespace-policy-reports
spec:
  schedule: "47 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [wgpolicyk8s.io]
        apiVersions: [v1alpha2]
        resources: [policyreports]
  conditions:
    - name: in-unevaluated-namespace
      expression: >-
        object.metadata.namespace in
        ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno']
    - name: not-written-for-a-day
      expression: >-
        !object.?results.orValue([]).exists(r,
          has(r.timestamp) && has(r.timestamp.seconds) &&
          timestamp(int(r.timestamp.seconds)) >= time.now() - duration('24h'))
