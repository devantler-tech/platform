---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: audit-privileged-rbac
  annotations:
    policies.kyverno.io/title: Restrict Privileged RBAC
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: >-
      Rejects Roles and ClusterRoles that grant wildcard administration or
      effective bind, escalate, or impersonate permissions, including grants
      expressed through wildcard verbs, unless the object is one of the
      reviewed identities excluded below.
spec:
  # Enforced at admission (platform#3486). The name stays audit-privileged-rbac so
  # its reports and references stay continuous.
  #
  # Every exclusion is a reviewed object that legitimately needs such a grant, and
  # each is an exact identity: ClusterRoles by name, Roles by namespace AND name.
  # A different object therefore cannot borrow an exclusion by reusing a name in
  # another namespace or as another kind. scripts/tests/test-audit-privileged-rbac.sh
  # pins this policy's whole shape and the list, so an exclusion is a reviewed change
  # to that test too.
  #
  # The excluded names are set by the charts and releases that create them. A chart
  # change that renames one of these roles, or adds a new privileged role, is refused
  # at admission; because Flux dry-runs through the same webhook, that fails the
  # whole Kustomization until the new role is reviewed here.
  # scripts/tests/test-chart-rendered-rbac-policy.sh renders those charts at their
  # pinned versions and applies this policy to their RBAC in CI, so such a change
  # fails its own pull request first.
  #
  # Coverage limit: Kyverno's own resource filters skip kube-system, kube-public,
  # kube-node-lease, kyverno, and Kyverno's controller roles for every policy, so a
  # privileged grant created there is not evaluated in any mode.
  background: true
  rules:
    - name: privileged-rules
      match:
        any:
          - resources:
              kinds:
                - rbac.authorization.k8s.io/v1/Role
                - rbac.authorization.k8s.io/v1/ClusterRole
      # Reviewed exclusions, each an exact kind|namespace|name identity (namespace is
      # empty for a ClusterRole). They are a false precondition rather than an
      # `exclude` so the background scan records a current `skip` for an accepted
      # role; an `exclude` records nothing, which left a role's earlier warning in
      # its report after it was accepted (docs/policy-reports.md). The values carry
      # no `*` or `?`, which Kyverno would treat as wildcards.
      # The key falls back to request.oldObject because a DELETE request carries no
      # request.object; without it a reviewed role would lose its exclusion on delete.
      preconditions:
        all:
          - key: >-
              {{ request.object.kind || request.oldObject.kind || '' }}|{{ request.object.metadata.namespace || request.oldObject.metadata.namespace || '' }}|{{ request.object.metadata.name || request.oldObject.metadata.name || '' }}
            operator: AnyNotIn
            value:
              # Kubernetes built-ins. The API server bootstraps them, and the
              # clusterrole aggregation controller rewrites the aggregated rules.
              - ClusterRole||admin
              - ClusterRole||cluster-admin
              - ClusterRole||edit
              - ClusterRole||system:aggregate-to-edit
              - ClusterRole||system:controller:clusterrole-aggregation-controller
              # Crossplane core. The RBAC manager creates and binds provider roles.
              - ClusterRole||crossplane
              - ClusterRole||crossplane-rbac-manager
              - ClusterRole||crossplane:system:aggregate-to-crossplane
              # KRO. The controller, and the platform's tenant
              # ResourceGraphDefinition role, which binds the ClusterRoles each
              # tenant is provisioned with.
              - ClusterRole||kro-tenant-rgd
              - ClusterRole||kro:controller
              # KSail operator. Creates and binds the RBAC of the clusters it
              # manages. This is the broadest grant excluded here: bind and
              # escalate on every RBAC resource.
              - ClusterRole||ksail-operator
              # Longhorn storage controller.
              - ClusterRole||longhorn-role
              - Role|longhorn-system|longhorn
              # Velero server. Restores arbitrary namespaced objects in its
              # namespace.
              - Role|velero|velero-server
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !has(object.rules) || type(object.rules) == null_type || object.rules.all(rule,
                  !(has(rule.apiGroups) && has(rule.resources) && (
                    ('*' in rule.apiGroups && '*' in rule.resources && '*' in rule.verbs) ||
                    (('*' in rule.apiGroups || 'rbac.authorization.k8s.io' in rule.apiGroups) &&
                     ((('*' in rule.verbs || 'bind' in rule.verbs) &&
                       ('*' in rule.resources || 'roles' in rule.resources || 'clusterroles' in rule.resources)) ||
                      (('*' in rule.verbs || 'escalate' in rule.verbs) &&
                       ('*' in rule.resources || 'roles' in rule.resources ||
                        (object.kind == 'ClusterRole' && 'clusterroles' in rule.resources))))) ||
                    (('*' in rule.apiGroups || '' in rule.apiGroups) &&
                     ('*' in rule.resources || 'serviceaccounts' in rule.resources ||
                      (object.kind == 'ClusterRole' && ('users' in rule.resources || 'groups' in rule.resources))) &&
                     ('*' in rule.verbs || 'impersonate' in rule.verbs)) ||
                    (object.kind == 'ClusterRole' &&
                     ('*' in rule.apiGroups || 'authentication.k8s.io' in rule.apiGroups) &&
                     rule.resources.exists(resource, resource == '*' || resource == 'uids' ||
                       resource.startsWith('userextras/') || resource.startsWith('*/')) &&
                     ('*' in rule.verbs || 'impersonate' in rule.verbs))
                  )))
              message: >-
                Wildcard administration, RBAC bind/escalate, and identity
                impersonation grants are rejected unless the object is a
                reviewed exclusion in the audit-privileged-rbac policy.
