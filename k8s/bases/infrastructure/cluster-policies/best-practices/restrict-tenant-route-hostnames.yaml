# Confines each self-service tenant to its OWN approved hostnames and blocks any
# claim on an arbitrary subdomain of the shared wildcard platform Gateway.
#
# Why: tenants are granted edit on HTTPRoute (see
# cluster-roles/gateway-tenant-edit.yaml) so they can publish their own app. Every
# tenant HTTPRoute attaches to the same platform Gateway, whose listener carries a
# wildcard certificate, and Gateway API resolves `spec.hostnames` with no RBAC of
# its own. Without this guard a compromised or over-broadly signed tenant artifact
# could claim any hostname the wildcard covers — including another tenant's — and
# transparently serve or intercept its traffic. Omitting `hostnames` is the same
# escalation in its strongest form: a route with no hostnames matches EVERY
# hostname on the listener.
#
# Coverage: every namespace bound to the tenant-edit ClusterRole gets a validation.
# Three namespaces reconcile tenant-controlled routes today — wedding-app,
# ascoachingogvaner and business-site — and each has its own allow-list below,
# because tenant hostnames are not derivable from the namespace name
# (wedding-app serves wedding.*, ascoachingogvaner serves an apex customer
# domain). Each list is that tenant's own declared set from its
# deploy/httproute.yaml, covering the production hostname and the *.platform.lan
# name used on local/dev clusters where the tenant declares one. business-site
# declares its staging host in deploy/webapp.yaml and its public and portal
# names in deploy/http-route-public.yaml and http-route-portal.yaml
# (platform#6177). The apex and www keep their GitHub Pages DNS records until a
# separate cutover, so admitting them here changes no live traffic before it.
#
# Fail-closed for anything NOT listed: the final validation denies every HTTPRoute in a
# ksail tenant namespace that has no allow-list above, so a newly onboarded
# tenant cannot publish until its hostnames are added here — a visible, reviewable
# edit. That is the same allow-list-not-deny-list posture as the two sibling
# tenant policies (restrict-tenant-issuer-refs, restrict-tenant-secret-stores),
# and it is why a tenant added without an allow-list fails loudly at admission instead of
# silently inheriting the wildcard.
#
# Platform carve-out: the policy targets only resources applied by a TENANT — i.e.
# by the impersonated tenant ServiceAccount (each tenant's deploy Kustomization
# sets spec.serviceAccountName: <tenant>). Resources the PLATFORM ships into a
# tenant namespace are reconciled by the apps-layer Flux Kustomization, which sets
# NO serviceAccountName and therefore applies as flux-system's own
# kustomize-controller SA — excluded below. The discriminator is the applying
# identity, which a tenant cannot forge. This mirrors
# restrict-tenant-secret-stores.yaml so all three tenant boundaries share one rule.
#
# Because the exclusion matches on request.userInfo, the policy is admission-only
# (background: false); every escalation is a create/update that passes through
# admission, so enforcement is unaffected. DELETE is deliberately excluded:
# removing a route cannot claim a hostname, and retired tenant resources must
# remain removable after their allow-list entry is gone.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-route-hostnames
  annotations:
    policies.kyverno.io/title: Restrict Tenant Route Hostnames
    policies.kyverno.io/category: Multi-Tenancy, Gateway API
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Restricts HTTPRoute hostnames in every tenant namespace to that tenant's
      approved hostnames, so tenant-controlled manifests cannot claim arbitrary
      platform wildcard subdomains — or another tenant's hostname — on the shared
      Gateway. A ksail tenant namespace with no allow-list is denied every
      hostname rather than inheriting the wildcard.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  # Admission-only: the exclusion matches on request.userInfo (the applying
  # ServiceAccount), which is unavailable during background scans. Every
  # escalation path is a create/update that passes through admission, so
  # enforcement is fully preserved.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    # Both allow-listed namespaces carry this label too, which
    # scripts/tests/test-tenant-route-hostname-boundary.sh pins: the selector is
    # the one boundary for all three validations below.
    namespaceSelector:
      matchExpressions:
        - key: app.kubernetes.io/managed-by
          operator: In
          values: [ksail, kro]
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: not-platform-applied
      expression: >-
        request.userInfo.username != 'system:serviceaccount:flux-system:kustomize-controller'
  variables:
    - name: hostnames
      expression: "object.spec.?hostnames.orValue([])"
  # Omitting hostnames makes the route match every hostname on the listener,
  # which is equivalent to claiming the platform wildcard, so an empty list is
  # denied. CEL's `in` compares each hostname as text (#4527): a wildcard hostname
  # covering an approved name is not itself on the list.
  validations:
    - expression: >-
        object.metadata.namespace != 'wedding-app' ||
        (size(variables.hostnames) > 0 &&
        variables.hostnames.all(h, h in ['wedding.platform.devantler.tech', 'wedding.platform.lan']))
      message: >-
        wedding-app HTTPRoutes must set spec.hostnames and may only use
        wedding.platform.devantler.tech or wedding.platform.lan. Omitting
        hostnames claims every hostname on the shared platform Gateway listener.
    - expression: >-
        object.metadata.namespace != 'ascoachingogvaner' ||
        (size(variables.hostnames) > 0 &&
        variables.hostnames.all(h, h in ['ascoachingogvaner.dk', 'www.ascoachingogvaner.dk', 'ascoachingogvaner.platform.lan']))
      message: >-
        ascoachingogvaner HTTPRoutes must set spec.hostnames and may only use
        ascoachingogvaner.dk, www.ascoachingogvaner.dk or
        ascoachingogvaner.platform.lan. Omitting hostnames claims every hostname
        on the shared platform Gateway listener.
    # The KRO controller renders this route from the tenant-owned WebApp, so
    # the allow-list applies to it exactly as to a tenant-applied route.
    - expression: >-
        object.metadata.namespace != 'business-site' ||
        (size(variables.hostnames) > 0 &&
        variables.hostnames.all(h, h in ['business-site.platform.devantler.tech', 'devantler.tech', 'www.devantler.tech', 'portal.devantler.tech']))
      message: >-
        business-site HTTPRoutes must set spec.hostnames and may only use
        business-site.platform.devantler.tech, devantler.tech,
        www.devantler.tech or portal.devantler.tech. Omitting hostnames claims
        every hostname on the shared platform Gateway listener.
    # Catch-all: any ksail tenant namespace without an allow-list above. This is
    # what makes onboarding fail loudly instead of silently unrestricted, the
    # exact gap that once left this policy covering only wedding-app while other
    # tenants shared the same wildcard Gateway.
    - expression: "object.metadata.namespace in ['wedding-app', 'ascoachingogvaner', 'business-site']"
      message: >-
        This tenant namespace has no approved hostnames. Add an allow-list
        validation for it to the restrict-tenant-route-hostnames ValidatingPolicy
        (naming the hostnames this tenant may serve) before publishing an
        HTTPRoute on the shared platform Gateway.
