# Confines each self-service tenant to its OWN approved hostnames and blocks any
# claim on an arbitrary subdomain of the shared wildcard platform Gateway.
#
# Why: tenants are granted edit on HTTPRoute (see
# cluster-roles/gateway-tenant-edit.yaml) so they can publish their own app. Every
# tenant HTTPRoute attaches to the same platform Gateway, whose listener carries a
# wildcard certificate, and Gateway API resolves `spec.hostnames` with no RBAC of
# its own. Without this guard a compromised or over-broadly signed tenant artifact
# could claim any hostname the wildcard covers — including another tenant's — and
# transparently serve or intercept its traffic. Omitting `hostnames` is the same
# escalation in its strongest form: a route with no hostnames matches EVERY
# hostname on the listener.
#
# Coverage: every namespace bound to the tenant-edit ClusterRole gets a rule.
# Three namespaces reconcile tenant-controlled manifests as a tenant
# ServiceAccount today — wedding-app, ascoachingogvaner and doggy-countdown — and
# each has its own allow-list below, because tenant hostnames are not derivable
# from the namespace name (wedding-app serves wedding.*, doggy-countdown serves
# simba.*, ascoachingogvaner serves an apex customer domain). Each list is that
# tenant's own declared set from its deploy/httproute.yaml, covering the
# production hostname and the *.platform.lan name used on local/dev clusters
# where the tenant declares one.
#
# Fail-closed for anything NOT listed: the final rule denies every HTTPRoute in a
# ksail tenant namespace that has no allow-list rule above, so a newly onboarded
# tenant cannot publish until its hostnames are added here — a visible, reviewable
# edit. That is the same allow-list-not-deny-list posture as the two sibling
# tenant policies (restrict-tenant-issuer-refs, restrict-tenant-secret-stores),
# and it is why a tenant added without a rule fails loudly at admission instead of
# silently inheriting the wildcard.
#
# Platform carve-out: every rule targets only resources applied by a TENANT — i.e.
# by the impersonated tenant ServiceAccount (each tenant's deploy Kustomization
# sets spec.serviceAccountName: <tenant>). Resources the PLATFORM ships into a
# tenant namespace are reconciled by the apps-layer Flux Kustomization, which sets
# NO serviceAccountName and therefore applies as flux-system's own
# kustomize-controller SA — excluded below. The discriminator is the applying
# identity, which a tenant cannot forge. This mirrors
# restrict-tenant-secret-stores.yaml so all three tenant boundaries share one rule.
#
# Because the excludes match on request.userInfo, the policy is admission-only
# (background: false); every escalation is a create/update that passes through
# admission, so enforcement is unaffected.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-tenant-route-hostnames
  annotations:
    policies.kyverno.io/title: Restrict Tenant Route Hostnames
    policies.kyverno.io/category: Multi-Tenancy, Gateway API
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/minversion: 1.9.0
    policies.kyverno.io/description: >-
      Restricts HTTPRoute hostnames in every tenant namespace to that tenant's
      approved hostnames, so tenant-controlled manifests cannot claim arbitrary
      platform wildcard subdomains — or another tenant's hostname — on the shared
      Gateway. A ksail tenant namespace with no allow-list rule is denied every
      hostname rather than inheriting the wildcard.
spec:
  validationFailureAction: Enforce
  # Admission-only: the exclude blocks match on request.userInfo (the applying
  # ServiceAccount), which is unavailable during background scans. Every
  # escalation path is a create/update that passes through admission, so
  # enforcement is fully preserved.
  background: false
  rules:
    - name: wedding-app-approved-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - wedding-app
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
      validate:
        message: >-
          wedding-app HTTPRoutes must set spec.hostnames and may only use
          wedding.platform.devantler.tech or wedding.platform.lan. Omitting
          hostnames claims every hostname on the shared platform Gateway listener.
        deny:
          conditions:
            any:
              # Omitting hostnames makes the route match every hostname on the
              # listener, which is equivalent to claiming the platform wildcard.
              - key: "{{ length(request.object.spec.hostnames || `[]`) }}"
                operator: Equals
                value: 0
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - wedding.platform.devantler.tech
                  - wedding.platform.lan
    - name: ascoachingogvaner-approved-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - ascoachingogvaner
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
      validate:
        message: >-
          ascoachingogvaner HTTPRoutes must set spec.hostnames and may only use
          ascoachingogvaner.dk, www.ascoachingogvaner.dk or
          ascoachingogvaner.platform.lan. Omitting hostnames claims every hostname
          on the shared platform Gateway listener.
        deny:
          conditions:
            any:
              - key: "{{ length(request.object.spec.hostnames || `[]`) }}"
                operator: Equals
                value: 0
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - ascoachingogvaner.dk
                  - www.ascoachingogvaner.dk
                  - ascoachingogvaner.platform.lan
    - name: doggy-countdown-approved-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - doggy-countdown
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
      validate:
        message: >-
          doggy-countdown HTTPRoutes must set spec.hostnames and may only use
          simba.platform.devantler.tech. Omitting hostnames claims every hostname
          on the shared platform Gateway listener.
        deny:
          conditions:
            any:
              - key: "{{ length(request.object.spec.hostnames || `[]`) }}"
                operator: Equals
                value: 0
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - simba.platform.devantler.tech
    # Catch-all: any ksail tenant namespace without an allow-list rule above. This
    # is what makes onboarding fail loudly instead of silently unrestricted — the
    # exact gap that left this policy covering only wedding-app while
    # ascoachingogvaner and doggy-countdown shared the same wildcard Gateway.
    - name: unlisted-tenant-namespace-has-no-approved-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: ksail
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kustomize-controller
                namespace: flux-system
          # The namespaces handled by the allow-list rules above.
          - resources:
              namespaces:
                - wedding-app
                - ascoachingogvaner
                - doggy-countdown
      validate:
        message: >-
          This tenant namespace has no approved hostnames. Add an allow-list rule
          for it to the restrict-tenant-route-hostnames ClusterPolicy (naming the
          hostnames this tenant may serve) before publishing an HTTPRoute on the
          shared platform Gateway.
        deny: {}
