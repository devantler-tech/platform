# Confines self-service tenants to their OWN namespaced SecretStore and blocks
# any reference to the shared cluster-scoped ClusterSecretStore or its broad
# OpenBao auth role.
#
# Why: tenants are granted edit on ExternalSecret/PushSecret/SecretStore (see
# cluster-roles/external-secrets-tenant-edit.yaml) so they can manage their own
# OpenBao-backed secrets. Referencing a ClusterSecretStore needs no RBAC on the
# store object, and the shared ClusterSecretStore/openbao authenticates as the
# `external-secrets` SA/role (broad infra + seed-write policies). Without this
# guard a tenant could point an ExternalSecret/PushSecret at the shared store,
# or create a namespaced SecretStore that reuses the shared OpenBao
# `external-secrets` role, and read/write OpenBao keys outside its own
# apps/<tenant>/* prefix — a privilege-escalation path. A tenant must instead
# create its own namespaced SecretStore authenticating via a tenant-scoped Vault
# role and its own ServiceAccount token.
#
# Scope: only ksail-generated tenant namespaces (labelled
# app.kubernetes.io/managed-by: ksail) — currently ascoachingogvaner and
# wedding-app, plus any future tenant — so platform/infra namespaces that
# legitimately use the ClusterSecretStore (actual-budget, fleetdm, openbao,
# cert-manager, external-dns, flux-system, velero, …) are unaffected.
#
# Platform carve-out: the deny targets only resources applied by a TENANT —
# i.e. by the impersonated tenant ServiceAccount (the tenant's deploy/
# Kustomization sets spec.serviceAccountName: <tenant>). Resources the PLATFORM
# ships inside a tenant's registration dir (k8s/bases/apps/<tenant>/) are
# reconciled by the apps-layer Flux Kustomization, which sets NO
# serviceAccountName and therefore applies as flux-system's own
# kustomize-controller SA — excluded below. This lets the platform place a
# trusted `ghcr-auth` ExternalSecret (backed by the shared ClusterSecretStore,
# reading only infrastructure/ghcr/auth) in a tenant namespace for the image-pull
# credential, while a tenant still cannot point its OWN ExternalSecret/PushSecret
# at the ClusterSecretStore. The discriminator is the applying identity, which a
# tenant cannot forge (it cannot make flux-system's SA apply its manifests).
# The initial business-site Tenant also needs its controller-created pull
# secret. Only the authenticated KRO actor, fixed destination/read/template and
# complete controller-supplied ownership tuple qualify. KRO is not excluded from
# the policy. The instance UID is attribution, not an independently fetched
# parent identity; this grants no arbitrary key, tenant or deletion authority.
# Because the exclusion matches on request.userInfo, the policy is
# admission-only (background: false); every escalation is a create/update that
# passes through admission, so enforcement is unaffected.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-secret-stores
  annotations:
    policies.kyverno.io/title: Restrict Tenant SecretStores
    policies.kyverno.io/category: Security, External Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: SecretStore, ExternalSecret, PushSecret
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Blocks tenant-applied SecretStore resources in ksail tenant namespaces
      from reusing the shared OpenBao `external-secrets` role or defaulting to
      the External Secrets controller token, and blocks ExternalSecret and
      PushSecret resources from referencing the cluster-scoped
      ClusterSecretStore (top-level store ref or per-entry sourceRef
      overrides). Tenants must use their own namespaced SecretStore, which
      authenticates via a tenant-scoped Vault role limited to
      secret/data/apps/<tenant>/*, preserving per-tenant isolation.
      Platform-authored resources (applied by flux-system's
      kustomize-controller) are excluded, so the platform-managed `ghcr-auth`
      pull-secret ExternalSecret may still use the shared ClusterSecretStore.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  # Admission-only: the exclusion matches on request.userInfo (the applying
  # ServiceAccount), which is unavailable during background scans. Every
  # escalation path is a create/update that passes through admission, so
  # enforcement is fully preserved.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: ksail
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretstores", "externalsecrets", "pushsecrets"]
  matchConditions:
    # Platform carve-out: the tenant registration dir is reconciled by the
    # apps-layer Flux Kustomization as flux-system's own kustomize-controller
    # SA (no impersonation). A tenant's deploy/ artifact is applied as its
    # impersonated tenant SA, so it stays subject to every validation.
    - name: not-platform-applied
      expression: >-
        request.userInfo.username != 'system:serviceaccount:flux-system:kustomize-controller'
  variables:
    - name: kro
      expression: "request.userInfo.username == 'system:serviceaccount:kro-system:kro'"
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
    - name: oldLabels
      expression: "oldObject == null ? {} : oldObject.?metadata.?labels.orValue({})"
    - name: sameReservedLabels
      expression: >-
        variables.labels.filter(k, k.startsWith('kro.run/') || k.startsWith('applyset.kubernetes.io/')).all(k,
          k in variables.oldLabels && variables.labels[k] == variables.oldLabels[k]) &&
        variables.oldLabels.filter(k, k.startsWith('kro.run/') || k.startsWith('applyset.kubernetes.io/')).all(k,
          k in variables.labels && variables.labels[k] == variables.oldLabels[k])
    - name: sameOwnership
      expression: >-
        ['kro.run/instance-id', 'kro.run/instance-name', 'kro.run/instance-namespace',
        'kro.run/instance-group', 'kro.run/instance-version', 'kro.run/instance-kind',
        'kro.run/node-id', 'applyset.kubernetes.io/part-of'].all(k,
          k in variables.labels && k in variables.oldLabels && variables.labels[k] == variables.oldLabels[k])
    - name: target
      expression: "object.spec.?target.orValue({})"
    - name: template
      expression: "variables.target.?template.orValue({})"
    - name: data
      expression: "object.spec.?data.orValue([])"
    - name: kroGhcrAuth
      expression: >-
        variables.kro && object.apiVersion == 'external-secrets.io/v1' && object.kind == 'ExternalSecret' &&
        request.namespace == 'business-site' && object.metadata.namespace == 'business-site' &&
        object.metadata.name == 'ghcr-auth' &&
        variables.labels[?'app.kubernetes.io/managed-by'].orValue('') == 'ksail' &&
        variables.labels[?'kro.run/instance-name'].orValue('') == 'business-site' &&
        variables.labels[?'kro.run/instance-namespace'].orValue('') == 'flux-system' &&
        variables.labels[?'kro.run/instance-group'].orValue('') == 'kro.run' &&
        variables.labels[?'kro.run/instance-version'].orValue('') == 'v1alpha1' &&
        variables.labels[?'kro.run/instance-kind'].orValue('') == 'Tenant' &&
        variables.labels[?'kro.run/node-id'].orValue('') == 'ghcrAuth' &&
        variables.labels[?'kro.run/instance-id'].orValue('').matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') &&
        variables.labels[?'applyset.kubernetes.io/part-of'].orValue('') != '' &&
        (request.operation == 'CREATE' || (oldObject != null && variables.sameOwnership)) &&
        object.spec.all(k, k in ['refreshInterval', 'refreshPolicy', 'secretStoreRef', 'target', 'data']) &&
        object.spec.?refreshInterval.orValue('') in ['1h', '1h0m0s'] &&
        object.spec.?refreshPolicy.orValue('Periodic') == 'Periodic' &&
        object.spec.?secretStoreRef.orValue({}) == {'name':'openbao', 'kind':'ClusterSecretStore'} &&
        variables.target.all(k, k in ['name', 'creationPolicy', 'deletionPolicy', 'template']) &&
        variables.target.?name.orValue('') == 'ghcr-auth' &&
        variables.target.?creationPolicy.orValue('Owner') == 'Owner' &&
        variables.target.?deletionPolicy.orValue('Retain') == 'Retain' &&
        variables.template.all(k, k in ['engineVersion', 'mergePolicy', 'type', 'data', 'metadata']) &&
        variables.template.?engineVersion.orValue('v2') == 'v2' &&
        variables.template.?mergePolicy.orValue('Replace') == 'Replace' &&
        variables.template.?type.orValue('') == 'kubernetes.io/dockerconfigjson' &&
        variables.template.?metadata.orValue({}).size() == 0 &&
        variables.template.?data.orValue({}) == {'.dockerconfigjson':'{{ .dockerconfigjson }}'} &&
        variables.data.size() == 1 &&
        variables.data[0].all(k, k in ['secretKey', 'remoteRef']) &&
        variables.data[0].?secretKey.orValue('') == 'dockerconfigjson' &&
        variables.data[0].?remoteRef.orValue({}).all(k, k in ['key', 'property', 'conversionStrategy', 'decodingStrategy', 'metadataPolicy']) &&
        variables.data[0].?remoteRef.?key.orValue('') == 'infrastructure/ghcr/auth' &&
        variables.data[0].?remoteRef.?property.orValue('') == 'dockerconfigjson' &&
        variables.data[0].?remoteRef.?conversionStrategy.orValue('Default') == 'Default' &&
        variables.data[0].?remoteRef.?decodingStrategy.orValue('None') == 'None' &&
        variables.data[0].?remoteRef.?metadataPolicy.orValue('None') == 'None'
    - name: vaultRole
      expression: object.spec.?provider.?vault.?auth.?kubernetes.?role.orValue('')
    - name: serviceAccountName
      expression: object.spec.?provider.?vault.?auth.?kubernetes.?serviceAccountRef.?name.orValue('')
    # An unset or empty namespace means the SecretStore's own namespace.
    - name: serviceAccountNamespace
      expression: >-
        object.spec.?provider.?vault.?auth.?kubernetes.?serviceAccountRef.?namespace.orValue('') == ''
        ? request.namespace
        : object.spec.provider.vault.auth.kubernetes.serviceAccountRef.namespace
    - name: storeRefKinds
      expression: >-
        object.kind == 'ExternalSecret'
        ? [object.spec.?secretStoreRef.?kind.orValue('')] +
          object.spec.?data.orValue([]).map(d, d.?sourceRef.?storeRef.?kind.orValue('')) +
          object.spec.?dataFrom.orValue([]).map(d, d.?sourceRef.?storeRef.?kind.orValue(''))
        : object.kind == 'PushSecret'
        ? object.spec.?secretStoreRefs.orValue([]).map(r, r.?kind.orValue(''))
        : []
  validations:
    # A SecretStore without Vault Kubernetes auth is out of this check's scope.
    - expression: >-
        object.kind != 'SecretStore' || variables.vaultRole == '' ||
        (variables.vaultRole != 'external-secrets' &&
        variables.serviceAccountName != '' &&
        variables.serviceAccountNamespace == request.namespace)
      message: >-
        Tenant SecretStores using Vault Kubernetes auth must use a
        tenant-scoped Vault role and an explicit ServiceAccountRef in the
        tenant namespace. Reusing the shared external-secrets Vault role or
        defaulting to the External Secrets controller token is forbidden.
    - expression: "object.kind != 'ExternalSecret' || !('ClusterSecretStore' in variables.storeRefKinds) || variables.kroGhcrAuth"
      message: >-
        Tenant ExternalSecrets must reference a namespaced SecretStore
        (kind: SecretStore), not the shared ClusterSecretStore. Create a
        SecretStore in this namespace that authenticates via your
        tenant-scoped Vault role.
    - expression: "object.kind != 'ExternalSecret' || variables.kro || variables.sameReservedLabels"
      message: Non-controller writers must preserve reserved ExternalSecret ownership labels.
    - expression: "object.kind != 'PushSecret' || !('ClusterSecretStore' in variables.storeRefKinds)"
      message: >-
        Tenant PushSecrets must reference a namespaced SecretStore
        (kind: SecretStore), not the shared ClusterSecretStore. Create a
        SecretStore in this namespace that authenticates via your
        tenant-scoped Vault role.
