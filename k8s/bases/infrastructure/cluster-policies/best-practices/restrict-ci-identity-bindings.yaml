---
# Admission-time guard for the EKS CI cluster identity (platform#6270).
#
# The aws/aws service account reconciles the AWS tenant, which owns the EKS CI
# cluster and its IAM role. Its Kubernetes reach is exactly one RoleBinding:
# aws/aws-managed-resources -> Role aws-managed-resources. This policy refuses
# every other RoleBinding or ClusterRoleBinding that grants to that service
# account, or to its namespace's service-account group, and pins the approved
# binding's role and subjects. It holds at runtime whatever path writes the
# binding (Flux, KRO, a generating policy, a human), and the same policy runs
# offline in CI against the rendered production overlays.
#
# Widening the identity is a reviewed change to the approved list below.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-ci-identity-bindings
  annotations:
    policies.kyverno.io/title: Restrict CI Identity Bindings
    policies.kyverno.io/category: Security, RBAC
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: RoleBinding, ClusterRoleBinding
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Refuses any RoleBinding or ClusterRoleBinding that grants to the aws/aws
      service account (the EKS CI cluster identity) or to the
      system:serviceaccounts:aws group, except the approved
      aws/aws-managed-resources RoleBinding to the Role of the same name with
      that service account as its only subject.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings", "clusterrolebindings"]
  variables:
    - name: bindingNamespace
      expression: "object.metadata.?namespace.orValue('')"
    # A ServiceAccount subject without a namespace means the binding's own.
    - name: grantsCiIdentity
      expression: >-
        object.?subjects.orValue([]).exists(s,
        (s.kind == 'ServiceAccount' && s.name == 'aws' &&
        s.?namespace.orValue(variables.bindingNamespace) == 'aws') ||
        (s.kind == 'Group' && s.name == 'system:serviceaccounts:aws'))
    - name: isApprovedBinding
      expression: >-
        object.kind == 'RoleBinding' &&
        variables.bindingNamespace == 'aws' &&
        object.metadata.name == 'aws-managed-resources' &&
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
        object.roleRef.kind == 'Role' &&
        object.roleRef.name == 'aws-managed-resources' &&
        size(object.?subjects.orValue([])) == 1 &&
        object.subjects[0].kind == 'ServiceAccount' &&
        object.subjects[0].name == 'aws' &&
        object.subjects[0].?namespace.orValue('aws') == 'aws'
  validations:
    - expression: "!variables.grantsCiIdentity || variables.isApprovedBinding"
      message: >-
        Only the aws/aws-managed-resources RoleBinding to the Role
        aws-managed-resources may grant to the EKS CI identity (aws/aws), and
        only to that service account. Widening it is a reviewed change to
        restrict-ci-identity-bindings.yaml.
