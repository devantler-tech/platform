# Flags Deployments and StatefulSets running fewer than 2 replicas, so the
# drain-safe maxUnavailable: 1 PDBs (validate-pdb-drain-safe / #1882) actually
# preserve availability: 2 replicas + topology spread (spread-pods) keep one pod
# serving through a node drain. 1 is a single point of failure that the PDB
# can't protect. 2 is the deliberate cost/availability floor here -- it rides out
# a node drain (not a concurrent second failure); stronger 3-replica HA is opt-in
# per workload via the cluster config, not mandated by this floor.
#
# Audit, not Enforce: .spec.replicas is owned by KEDA (request-rate autoscaling),
# Flagger (canary primaries) and leader-election operators -- mutating it would fight
# those controllers and cause perpetual drift, and doubling every singleton would
# strain this cluster's memory budget at once. This surfaces single-replica
# workloads in Kyverno's PolicyReports for a human to raise (or exempt)
# deliberately.
#
# Exemptions (a replica floor is *wrong*, not missing, for these) are part of the
# validation expression, so an exempt workload gets a current `pass` result.
# Neither a narrower match scope nor a false matchCondition writes a result,
# so either could leave an older `fail` in place after the exemption is added
# (#2573). See docs/policy-reports.md for the regression test and rollout check.
#
# Exemption categories:
#   * the opt-out label platform.devantler.tech/replica-floor: exempt on the
#     workload OR its pod template -- the durable, self-documenting escape hatch
#     for any new singleton / scale-to-zero / operator-managed workload;
#   * Flagger primaries (*-primary) and the scaled-to-0 canary sources -- Flagger
#     owns their replica count;
#   * namespaces whose workloads genuinely can't run 2: velero (chart hardcodes
#     replicas: 1, no leader election), flux controllers and coroot
#     (observability), and kubescape (the operator + kubescape/kubevuln/storage/
#     gateway scanner control-plane are all single-replica by design, off every
#     serving path; the node-agent is a DaemonSet the floor never matches), plus
#     crossplane-system (external-state single-writer controllers whose provider
#     Deployment names carry changing ProviderRevision hashes);
#   * single-replica-only controllers: external-dns (chart has no replicaCount;
#     >1 = duplicate Cloudflare writes), origin-ca-issuer (disabled) and
#     flagger-loadtester (ephemeral per-canary test helper);
#   * lean leader-election controllers: VPA recommender/updater and kyverno
#     reports/cleanup -- off every serving path, so they default to a single
#     replica (a SPOF here only delays reconciliation/reporting, never user
#     traffic); prod gives them a warm standby, but the floor must not force it.
#
# The other leader-election controllers that USED to be exempt (cloudnative-pg,
# reloader, trust-manager, hcloud CCM/CSI, snapshot-controller, kyverno
# background, flagger) opt in to 2+ replicas for HA instead of opting out.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-replica-floor
  annotations:
    policies.kyverno.io/title: Validate Replica Floor
    policies.kyverno.io/category: Best Practices, High Availability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Flags Deployments and StatefulSets running fewer than 2 replicas so their
      drain-safe PDBs actually preserve availability. Workloads that are
      intentionally singleton, scale-to-zero or controller-managed opt out with
      the platform.devantler.tech/replica-floor: exempt label.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  variables:
    # Durable opt-out on the workload itself.
    - name: workloadExempt
      expression: >-
        object.metadata.?labels[?'platform.devantler.tech/replica-floor'].orValue('') == 'exempt'
    # Durable opt-out on the pod template (charts expose podLabels more
    # widely than top-level workload labels).
    - name: templateExempt
      expression: >-
        object.spec.?template.?metadata.?labels[?'platform.devantler.tech/replica-floor'].orValue('') == 'exempt'
    # Whole namespaces whose controllers are intentionally singleton or
    # controller-managed: Velero has no leader election; Flux, Coroot and
    # Kubescape controllers sit off serving paths; Crossplane reconcilers
    # are external-state single writers. Crossplane is exempt by namespace
    # because provider Deployment names include a changing revision hash.
    - name: namespaceExempt
      expression: >-
        object.metadata.?namespace.orValue('') in [
          'velero', 'flux-system', 'observability', 'kubescape',
          'crossplane-system']
    # Flagger owns replica counts for generated *-primary Deployments.
    - name: flaggerPrimary
      expression: >-
        object.metadata.name.matches('^.+-primary$')
    # Named exemptions, one list per reason: single-replica apps/UIs and paused
    # Flagger canary sources; single-writer or ephemeral controllers (DNS,
    # disabled issuer, canary load generator); lean leader-election controllers
    # whose outage delays only an idempotent loop (production may still opt
    # them into HA); and components single by design from the June 2026 HA
    # sweep -- SPIRE needs an external datastore for real HA, CNPG-I exposes
    # its gRPC readiness endpoint only on the elected leader.
    - name: namedExempt
      expression: >-
        object.metadata.name in [
          'actual-budget-actualbudget', 'fleet', 'whoami',
          'hubble-ui', 'longhorn-ui', 'homepage', 'umami-umami'] ||
        object.metadata.name in [
          'external-dns', 'origin-ca-issuer', 'flagger-loadtester'] ||
        object.metadata.name in [
          'vertical-pod-autoscaler-vpa-recommender',
          'vertical-pod-autoscaler-vpa-updater',
          'kyverno-reports-controller', 'kyverno-cleanup-controller'] ||
        object.metadata.name in [
          'cluster-autoscaler-hetzner-cluster-autoscaler',
          'keda-operator-metrics-apiserver', 'longhorn-driver-deployer',
          'spire-server', 'plugin-barman-cloud']
    - name: exempt
      expression: >-
        variables.workloadExempt || variables.templateExempt ||
        variables.namespaceExempt || variables.flaggerPrimary ||
        variables.namedExempt
    # An unset replica count defaults to 1; an explicit 0 stays 0.
    - name: replicas
      expression: object.spec.?replicas.orValue(1)
  validations:
    - expression: "variables.exempt || variables.replicas >= 2"
      messageExpression: >-
        object.kind + " '" + object.metadata.name + "' runs " +
        string(variables.replicas) + " replica(s); the platform HA floor is 2
        so its maxUnavailable: 1 PDB keeps it available through a node drain
        (see #1882). If it is intentionally singleton, scale-to-zero or
        controller-managed, add the label
        'platform.devantler.tech/replica-floor: exempt'."
