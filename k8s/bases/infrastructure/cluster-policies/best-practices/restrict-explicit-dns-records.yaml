---
# The CRD source is watched cluster-wide by the existing ExternalDNS writer.
# Tenant edit permissions must not become a second way to claim hostnames.
# Keep this allow-list independent of labels and applying identity: only records
# in the owning product's tenant namespace with the approved shape may pass.
# Deploy and verify this boundary BEFORE enabling the CRD source.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-explicit-dns-records
  annotations:
    policies.kyverno.io/title: Restrict Explicit DNS Records
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: DNSEndpoint
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Limits explicit ExternalDNS records to the owning product's namespace and
      the approved DNS-only documentation CNAME. Tenant labels do not grant DNS
      ownership. New records require a reviewed allow-list change.
spec:
  validationActions:
    - Deny
  # Admission-only, as before: every record reaches the cluster through a
  # create or update, and an UPDATE is judged on the new object, so an invalid
  # record is never grandfathered (including server-side apply).
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["externaldns.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["dnsendpoints"]
  variables:
    # dyn() lets one map literal hold strings, a number and lists: CEL
    # otherwise types a map literal by its first value and refuses the rest.
    - name: approvedEndpoints
      expression: >-
        [
          {
            "dnsName": dyn("khoist.devantler.tech"),
            "recordType": dyn("CNAME"),
            "recordTTL": dyn(300),
            "targets": dyn(["devantler-tech.github.io"]),
            "providerSpecific": dyn([{"name": "cloudflare/proxied", "value": "false"}])
          }
        ]
  validations:
    # CEL equality compares the complete endpoint list, field by field and
    # without wildcard matching: extra targets, endpoints, routing fields or
    # provider settings cannot slip through, and a missing list never matches.
    - expression: >-
        object.metadata.namespace == 'data-product-controller' &&
        object.?spec.?endpoints.orValue([]) == variables.approvedEndpoints
      message: >-
        Explicit DNS records require platform ownership and an approved
        endpoint, target, record type and DNS-only provider configuration.
