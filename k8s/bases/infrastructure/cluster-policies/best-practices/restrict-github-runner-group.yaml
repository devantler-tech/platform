# The GitHub tenant can manage only the KSail analysis runner group. The
# organization's existing App already grants runner management; this policy
# confines the new managed-resource surface without changing that App.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-github-runner-group
  annotations:
    policies.kyverno.io/title: Restrict GitHub Analysis Runner Group
    policies.kyverno.io/category: Security, GitHub
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: RunnerGroup
    policies.kyverno.io/minversion: 1.13.0
spec:
  background: false
  rules:
    - name: ksail-only-runner-group
      match:
        any:
          - resources:
              kinds:
                - actions.github.m.upbound.io/*/RunnerGroup
              namespaces:
                - github-config
              operations: [CREATE, UPDATE]
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          The analysis runner group must be ksail-code-quality, use the existing
          default ProviderConfig, and select only KSail. initProvider overrides,
          default or organization-wide groups, and additional repositories are refused.
        deny:
          conditions:
            all:
              # JMESPath compares literal names and the complete numeric set;
              # Kyverno wildcard-aware string operators cannot express this boundary.
              - key: "{{ request.object.metadata.name == 'ksail-code-quality' && request.object.spec.forProvider.name == 'ksail-code-quality' && request.object.spec.forProvider.visibility == 'selected' && request.object.spec.forProvider.selectedRepositoryIds == `[737584922]` && request.object.spec.forProvider.allowsPublicRepositories == `true` && request.object.spec.forProvider.restrictedToWorkflows == `false` && not_null(request.object.spec.forProvider.selectedWorkflows, `[]`) == `[]` && not_null(request.object.spec.initProvider, `{}`) == `{}` && request.object.spec.providerConfigRef.name == 'default' && not_null(request.object.spec.providerConfigRef.kind, 'ProviderConfig') == 'ProviderConfig' }}"
                operator: Equals
                value: false
    - name: tenant-cannot-rebind-group
      match:
        any:
          - resources:
              kinds:
                - actions.github.m.upbound.io/*/RunnerGroup
              namespaces:
                - github-config
              operations: [CREATE, UPDATE]
      # The provider records the identity it creates. Tenant writes may retain
      # that identity, but cannot adopt or redirect a different existing group.
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: provider-upjet-github-*
                namespace: crossplane-system
      context:
        - name: externalName
          variable:
            jmesPath: request.object.metadata.annotations."crossplane.io/external-name"
            default: ""
        - name: previousExternalName
          variable:
            jmesPath: request.oldObject.metadata.annotations."crossplane.io/external-name"
            default: ""
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: >-
          Only the provider may establish the runner group's remote identity.
          The tenant may leave it unset or preserve the existing identity.
        deny:
          conditions:
            all:
              - key: "{{ externalName == '' || externalName == previousExternalName }}"
                operator: Equals
                value: false
