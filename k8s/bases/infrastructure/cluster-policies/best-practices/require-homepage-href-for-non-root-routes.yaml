# Keeps every Homepage card pointing at the service's front page.
#
# Why: unless a route sets gethomepage.dev/href, Homepage builds the card link
# itself, from the route's first hostname plus the path of its FIRST rule's
# FIRST match (spec.rules[0].http.paths[0].path for an Ingress). Rule order is
# routing-neutral in the Gateway API, where the most specific match wins
# whatever its position, so nothing in a route reads as wrong when a narrow
# rule is listed first. Homepage is the only consumer of that order, and it
# fails silently: the card still renders, healthy, and links somewhere else.
#
# That is how the Coroot card broke. platform#5881 put an `Exact /mcp` rule
# (the agents' MCP endpoint, which bypasses SSO) ahead of the catch-all, so the
# card linked to /mcp, and a browser without a bearer token got Coroot's 401
# "unauthorized" instead of the UI. A RegularExpression first path or a route
# without hostnames is worse: Homepage builds no link at all.
#
# So a route that opts into the dashboard may leave the link to Homepage only
# when the derived link is the site root; any other route must name its link
# explicitly with gethomepage.dev/href. The API server defaults an omitted rule
# list, match list or path to `PathPrefix /`, so an omitted one reads as the
# root here as well.
#
# Scope: every namespace, platform and tenant routes alike, with background
# scanning on so existing drift surfaces in the PolicyReports. CREATE and
# UPDATE only, never DELETE, so a route can always be removed (#4732).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-homepage-href-for-non-root-routes
  annotations:
    policies.kyverno.io/title: Require Homepage Href For Non-Root Routes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: HTTPRoute, Ingress
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Requires every route that opts into Homepage discovery
      (gethomepage.dev/enabled: "true") to set gethomepage.dev/href unless the
      link Homepage would derive from it is the site root, so reordering a
      route's rules cannot silently move its dashboard card to a sub-path.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      # HTTPRoute is what this platform uses. Ingress is Homepage's other
      # discovery source and is included so a future Ingress cannot bypass the
      # guard, the same scope as restrict-homepage-service-groups.
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: opted-into-homepage
      expression: >-
        object.metadata.?annotations.orValue({})[?'gethomepage.dev/enabled'].orValue('') == 'true'
  variables:
    # Homepage treats an empty href as absent, so this does too.
    - name: href
      expression: >-
        object.metadata.?annotations.orValue({})[?'gethomepage.dev/href'].orValue('')
    # https://<hostnames[0]><rules[0].matches[0].path.value>, and no link at all
    # without a hostname or for a RegularExpression path.
    - name: httpRouteLinksToRoot
      expression: >-
        size(object.spec.?hostnames.orValue([])) > 0 &&
        (
          size(object.spec.?rules.orValue([])) == 0 ||
          size(object.spec.rules[0].?matches.orValue([])) == 0 ||
          (
            object.spec.rules[0].matches[0].?path.?value.orValue('/') == '/' &&
            object.spec.rules[0].matches[0].?path.?type.orValue('PathPrefix') != 'RegularExpression'
          )
        )
    # <scheme>://<rules[0].host><rules[0].http.paths[0].path>; an Ingress has no
    # defaulting here, so a missing host or path yields a broken link.
    - name: ingressLinksToRoot
      expression: >-
        size(object.spec.?rules.orValue([])) > 0 &&
        object.spec.rules[0].?host.orValue('') != '' &&
        size(object.spec.rules[0].?http.?paths.orValue([])) > 0 &&
        object.spec.rules[0].http.paths[0].?path.orValue('') == '/'
  validations:
    - expression: >-
        variables.href != '' ||
        (object.kind == 'HTTPRoute' ? variables.httpRouteLinksToRoot : variables.ingressLinksToRoot)
      message: >-
        A route with gethomepage.dev/enabled="true" must set
        gethomepage.dev/href unless its first hostname and its first rule's
        first path already form the site root. Homepage builds the card link
        from exactly those two fields, so a route whose first rule matches a
        sub-path (such as an /mcp or /api bypass) sends the card there, and a
        RegularExpression path or a missing hostname leaves the card with no
        link at all.
