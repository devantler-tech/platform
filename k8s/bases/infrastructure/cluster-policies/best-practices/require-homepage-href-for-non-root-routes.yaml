# Keeps every Homepage card pointing at the service's front page.
#
# Why: unless a route sets gethomepage.dev/href, Homepage builds the card link
# itself, from the route's first hostname plus the path of its FIRST rule's
# FIRST match. Rule order is routing-neutral in the Gateway API, where the most
# specific match wins whatever its position, so nothing in a route reads as
# wrong when a narrow rule is listed first. Homepage is the only consumer of
# that order, and it fails silently: the card still renders, healthy, and links
# somewhere else.
#
# That is how the Coroot card broke. platform#5881 put an `Exact /mcp` rule
# (the agents' MCP endpoint, which bypasses SSO) ahead of the catch-all, so the
# card linked to /mcp, and a browser without a bearer token got Coroot's 401
# "unauthorized" instead of the UI. A RegularExpression first path or a route
# without hostnames is worse: Homepage builds no link at all.
#
# So a route that opts into the dashboard may leave the link to Homepage only
# when the derived link is the site root; any other route must name its link
# explicitly with gethomepage.dev/href. The API server defaults an omitted rule
# list, match list or path to `PathPrefix /`, so an omitted one reads as the
# root here as well.
#
# Scope: HTTPRoutes in every namespace, platform and tenant alike, with
# background scanning on so existing drift surfaces in the PolicyReports.
# CREATE and UPDATE only, never DELETE, so a route can always be removed
# (#4732). Ingress is deliberately not matched: neither this repository nor the
# cluster serves one, and the tenant role grants only HTTPRoutes. Reading an
# Ingress's link needs its `http` field, and `ksail workload validate` skips
# any policy whose expressions name `http` (it cannot tell the field from the
# CEL http library), so covering Ingress would cost the offline evaluation that
# lets a pull request fail on a violating route before admission does.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-homepage-href-for-non-root-routes
  annotations:
    policies.kyverno.io/title: Require Homepage Href For Non-Root Routes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Requires every HTTPRoute that opts into Homepage discovery
      (gethomepage.dev/enabled: "true") to set gethomepage.dev/href unless the
      link Homepage would derive from it is the site root, so reordering a
      route's rules cannot silently move its dashboard card to a sub-path.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: opted-into-homepage
      expression: >-
        object.metadata.?annotations.orValue({})[?'gethomepage.dev/enabled'].orValue('') == 'true'
  variables:
    # Homepage treats an empty href as absent, so this does too.
    - name: href
      expression: >-
        object.metadata.?annotations.orValue({})[?'gethomepage.dev/href'].orValue('')
    # https://<hostnames[0]><rules[0].matches[0].path.value>, and no link at all
    # without a hostname or for a RegularExpression path. A wildcard first
    # hostname (`*.example.com`) yields a link no browser can open. The API
    # server defaults only an OMITTED rule list or match list; an explicitly
    # empty one stays empty, and Homepage then fails reading `[0]` of it, so
    # omitted reads as the root and empty does not.
    - name: linksToRoot
      expression: >-
        size(object.spec.?hostnames.orValue([])) > 0 &&
        !object.spec.hostnames[0].startsWith('*') &&
        (
          !object.spec.?rules.hasValue() ||
          (
            size(object.spec.rules) > 0 &&
            (
              !object.spec.rules[0].?matches.hasValue() ||
              (
                size(object.spec.rules[0].matches) > 0 &&
                object.spec.rules[0].matches[0].?path.?value.orValue('/') == '/' &&
                object.spec.rules[0].matches[0].?path.?type.orValue('PathPrefix') != 'RegularExpression'
              )
            )
          )
        )
  validations:
    - expression: >-
        variables.href != '' || variables.linksToRoot
      message: >-
        An HTTPRoute with gethomepage.dev/enabled="true" must set
        gethomepage.dev/href unless its first hostname and its first rule's
        first path already form the site root. Homepage builds the card link
        from exactly those two fields, so a route whose first rule matches a
        sub-path (such as an /mcp or /api bypass) sends the card there, and a
        missing or wildcard hostname, a RegularExpression path, or an
        explicitly empty rule or match list leaves the card with no usable
        link.
