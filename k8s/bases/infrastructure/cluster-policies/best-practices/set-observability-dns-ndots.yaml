# Coroot's operator emits one- and two-dot relative service names. ndots:1
# sends those names to upstream DNS before searching cluster domains. ndots:3
# keeps these lookups in the cluster while still trying fully qualified service
# names and three-dot object-store names without search-path amplification.
#
# Keep the mutation deliberately narrow: only Coroot-owned pods and the CNPG
# Cluster backing Coroot receive a resolver override. CNPG retains ndots:1;
# its same-namespace service and object-store lookups are unchanged. Other
# workloads retain the Kubernetes default until their lookup behavior is measured. This changes lookup
# order only; it does not alter the DNS server, search domains, or network
# policy. The option is applied at Pod admission; the Coroot and CNPG manifests
# carry rollout tokens so changed pods are recreated declaratively.
# Match CREATE only: adding dnsConfig to an
# existing Pod during an unrelated metadata UPDATE would violate Kubernetes Pod
# immutability and can block the owning controller's reconciliation.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: set-observability-dns-ndots
  annotations:
    policies.kyverno.io/title: Resolve Observability Names Without Upstream Leakage
    policies.kyverno.io/category: Observability, Reliability
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Keeps Coroot's relative service lookups inside cluster DNS while avoiding
      search-path amplification for fully qualified names. Preserves the
      database's existing resolver behavior.
spec:
  background: false
  rules:
    - name: set-coroot-dns-ndots
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaces:
                - observability
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: coroot
                  app.kubernetes.io/managed-by: coroot-operator
      # PodDNSConfig.options is an atomic list in Kyverno's strategic merge.
      # All current operator-generated targets omit it; if a future target
      # authors resolver options, preserve that explicit contract rather than
      # replacing the whole list behind the operator's back.
      preconditions:
        all:
          - key: "{{ request.object.spec.dnsConfig.options || `[]` }}"
            operator: Equals
            value: []
      mutate:
        patchStrategicMerge:
          spec:
            dnsConfig:
              options:
                - name: ndots
                  value: "3"
    - name: set-coroot-db-dns-ndots
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaces:
                - observability
              selector:
                matchLabels:
                  cnpg.io/cluster: coroot-db
      preconditions:
        all:
          - key: "{{ request.object.spec.dnsConfig.options || `[]` }}"
            operator: Equals
            value: []
      mutate:
        patchStrategicMerge:
          spec:
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
