---
# Ownership metadata backported from devantler-tech/kyverno-policies
# policies/best-practices/auto-vpa-generating-policy.yaml at
# 8a36995dcf62df42448f494e024681533ebbe48a (#5408).
# Keep this consumer's existing <name>-deployment naming and namespace exclusion.
# The upstream required-UID expression is inlined so the existing closed producer
# contract still permits no CEL variables. Sizing and update modes are unchanged.
# Both consumer-discovery guards pin the complete resulting expression.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: auto-vpa-deployment
  annotations:
    policies.kyverno.io/title: Auto VPA for Deployments (GeneratingPolicy)
    policies.kyverno.io/category: Autoscaling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Generates a recommendation-bounded VerticalPodAutoscaler for each Deployment.
      GeneratingPolicy form of the classic auto-vpa rule of the same name.
spec:
  # Parity with the classic rules' `synchronize: true` + `generateExisting: true`:
  # on GeneratingPolicy both live under spec.evaluation and default to false, so
  # omitting them would silently drop behavior the classic policy guarantees.
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
    # PLATFORM ADDITION (the only change from the catalog file): prod ships
    # static VPAs for the controllers in these namespaces
    # (k8s/providers/hetzner/infrastructure/vertical-pod-autoscalers/), so a
    # generated one would put a second VPA on each of those pods.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
  generate:
    # Every value is dyn(): CEL infers a map's value type from its first entry, so a
    # resource literal mixing strings with nested maps fails to compile without it.
    # Fields read off `object` are dyn and need string() before concatenation.
    - expression: >-
        generator.Apply(
          string(object.metadata.namespace),
          [
            {
              "apiVersion": dyn("autoscaling.k8s.io/v1"),
              "kind": dyn("VerticalPodAutoscaler"),
              "metadata": dyn({
                "name": dyn(string(object.metadata.name) + "-deployment"),
                "namespace": dyn(string(object.metadata.namespace)),
                "ownerReferences": dyn([{
                  "apiVersion": "apps/v1",
                  "kind": "Deployment",
                  "name": string(object.metadata.name),
                  "uid": string([object.metadata.uid].filter(uid, type(uid) == string && size(uid) > 0)[0])
                }])
              }),
              "spec": dyn({
                "targetRef": dyn({
                  "apiVersion": "apps/v1",
                  "kind": "Deployment",
                  "name": string(object.metadata.name)
                }),
                "updatePolicy": dyn({"updateMode": "InPlaceOrRecreate"}),
                "resourcePolicy": dyn({
                  "containerPolicies": [
                    {
                      "containerName": dyn("*"),
                      "controlledResources": dyn(["cpu", "memory"]),
                      "controlledValues": dyn("RequestsAndLimits"),
                      "minAllowed": dyn({"cpu": "50m", "memory": "64Mi"}),
                      "maxAllowed": dyn({"cpu": "3", "memory": "6Gi"})
                    }
                  ]
                })
              })
            }
          ]
        )
