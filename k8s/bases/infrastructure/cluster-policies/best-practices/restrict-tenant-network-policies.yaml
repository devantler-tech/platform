# Keeps a tenant namespace's isolation boundary intact regardless of what the
# tenant submits as a CiliumNetworkPolicy.
#
# Why: Cilium network policy is ADDITIVE allow-listing — the effective allow-set
# for an endpoint is the union across every policy selecting it, and traffic is
# permitted if at least one rule matches. A namespace therefore holds its
# generated `default-deny` floor only for as long as no policy beside it opens
# everything back up. Tenants hold create/update/patch/delete on namespaced
# ciliumnetworkpolicies (see cluster-roles/cilium-tenant-edit.yaml), which is the
# point of self-service allow-lists, so RBAC alone cannot close this: the whole
# grant would have to go. Admission is the right layer — the tenant keeps
# self-service, and the shapes that dissolve the boundary are refused.
#
# What counts as boundary-dissolving, and why each shape is listed:
#   * A source/destination EndpointSelector that does not PIN A VALUE. The
#     empty spellings — `{}`, `matchLabels: {}`, `matchExpressions: []`, both
#     fields empty — are the obvious cases, but presence is not constraint: a
#     nonempty `matchExpressions` using `Exists` against a label every endpoint
#     carries (`k8s:io.kubernetes.pod.namespace`) matches cluster-wide, and so
#     does `NotIn` against the tenant's own namespace. The check is therefore a
#     WHITELIST OF OPERATORS — a selector counts as constrained only if it has
#     `matchLabels`, or a `matchExpressions` entry whose operator is `In` — so
#     `Exists`, `DoesNotExist` and `NotIn` are refused by default rather than
#     enumerated.
#   * A source/destination EndpointSelector whose KEYS name something the
#     namespace boundary exists to hold out. A selector can be non-empty and
#     use only whitelisted operators and still reach the same broad target an
#     entity or a CIDR is refused for, because Cilium exposes three things as
#     ordinary selectable labels: reserved identities (`reserved:world`,
#     `reserved:host`, …), the pod namespace (`k8s:io.kubernetes.pod.namespace`
#     and the `io.cilium.k8s.namespace.labels.` prefix — a selector is scoped
#     to the policy's own namespace only while it carries no namespace key, so
#     naming one overrides that scoping), and the cluster name
#     (`io.cilium.k8s.policy.cluster`, the selector spelling of `cluster-mesh`).
#     A key with no source prefix defaults to `any:`, which matches a label
#     from EVERY source — reserved included — so the bare names (`world`,
#     `host`, …) and the explicit `any:` spelling are refused alongside the
#     `reserved:` one. A tenant label that happens to share a reserved name is
#     written `k8s:cluster`: the prefix pins the source, so it can only ever
#     match a pod label. Both `matchLabels` keys and `matchExpressions` keys are
#     read, so the `In` form cannot smuggle a key the map form refuses. The
#     carve-outs mirror the entity whitelist exactly: `reserved:kube-apiserver`
#     on both sides, and `reserved:ingress` on the INGRESS side only.
#   * Any entity but `kube-apiserver` — plus, on the INGRESS side only, `ingress`,
#     the narrow identity Cilium gives traffic that has already passed the shared
#     Gateway, which tenant-authored HTTPRoute workloads legitimately name.
#     Cilium's entity vocabulary is open-ended: `all`, `world` and `cluster` are
#     the obvious ones, but `remote-node` reaches host-networked workloads and
#     `cluster-mesh` reaches meshed clusters — so the check is a WHITELIST of the
#     entities a namespaced workload legitimately names, not a list of broad ones.
#   * Node selectors and provider groups (`fromNodes`/`toNodes` and
#     `fromGroups`/`toGroups`). Nodes belong to the host network, and provider
#     groups resolve external infrastructure into CIDRs without passing the
#     literal-CIDR checks below. Neither field has a tenant use case within the
#     namespace boundary, so field presence is refused, even when empty or null
#     beside an otherwise valid rule. Enabling node selection or a provider
#     integration must not silently activate previously admitted tenant rules.
#   * Any CIDR prefix shorter than /16. `0.0.0.0/0` and `::/0` are only the
#     shortest spellings of "everything": `0.0.0.0/1` plus `128.0.0.0/1` covers
#     the same ground. A prefix-length floor refuses every such split at once.
#     The floor is PER ENTRY and cannot bound an aggregate — every /16 in turn
#     still unions to an address family — so it is paired with a DENY-LIST of
#     these protected address ranges: private, CGNAT,
#     loopback, link-local (cloud metadata), benchmarking, multicast and
#     reserved blocks for IPv4, and ::/8 (every IPv4-embedding spelling), 6to4,
#     ULA, link-local, site-local and multicast for IPv6. That is the boundary
#     this policy holds: the cluster's own address space — the node network,
#     the pod network and the Service CIDR all live in 10/8 — the host, and the
#     metadata endpoint. Any set that covers an address family contains one of
#     those blocks and is refused. This is not an IANA global-reachability
#     classifier: documentation ranges, for example, are outside this list.
#     What the deny-list does NOT bound is a set
#     of individually public entries covering most of the public internet;
#     that is the reach `toFQDNs` with a fixed suffix already grants, it stays
#     outside the namespace floor, and bounding it needs a per-namespace quota
#     on policy objects rather than a condition on one. A CIDRSet entry must
#     carry a literal `cidr`: `cidrGroupRef`/`cidrGroupSelector` name a
#     cluster-scoped CiliumCIDRGroup neither the floor nor the deny-list can
#     read, so they are refused outright — even beside a literal `cidr`, since
#     Cilium applies every populated source in an entry.
#   * A rule with no layer-3 stanza at all. Cilium's port-only rules permit
#     every source (or destination) on the named port, so `toPorts` alone is
#     allow-all wearing a layer-4 costume — the selector whitelist above never
#     sees it, because there is no selector to inspect.
#   * A `toFQDNs` matchPattern whose labels are ALL wildcards. The literal `*`
#     is only the shortest such spelling: `*.*` and `*.*.*` name a destination
#     in form only too, and a short list of them covers essentially every
#     practical public name. The check refuses the whole shape (`*`, `*.*`,
#     `*.*.*`, …) rather than the one catch-all, so a fixed suffix is required
#     somewhere in the pattern. A `matchName` is an exact name and unaffected.
#   * A `toServices` reference without the policy's explicit namespace. Cilium
#     treats an omitted or empty Service namespace as ANY namespace, for both
#     named Services and Service selectors. A fixed name or label alone therefore
#     reaches foreign Service backends without passing the toEndpoints guard.
#     Every populated reference must pin the policy namespace, including when
#     both reference forms occur in one entry. Other namespaces and empty forms
#     are refused; ordinary references set `namespace` to their own namespace.
#   * Rules placed under the plural `specs` container instead of `spec`.
#     CiliumNetworkPolicy accepts either, and every condition here reads
#     `spec`, so rules under `specs` reach admission unexamined whatever they
#     contain. The container is refused outright — the WHITELIST form — rather
#     than mirroring each condition across both paths, which would re-open the
#     boundary the first time a future condition is added to one path only.
#
# What is deliberately NOT restricted: a top-level `endpointSelector: {}`. That
# scopes the rule to all of the tenant's OWN pods, which is the tenant's call and
# reaches nothing outside the namespace — the generated `allow-dns` policy uses
# exactly that shape. Only the rules' sources and destinations are constrained.
#
# Opting out: a tenant policy setting `enableDefaultDeny: false` is refused. It
# is unverified whether that field can actually subtract the whitelist mode the
# generated floor establishes — Cilium documents rule effects as cumulative but
# does not state the interaction, and this repository does not run a cluster to
# settle it. A tenant allow-list has no reason to set it either way, so the
# ambiguity is resolved fail-closed rather than left open.
#
# Ownership: the generated `default-deny`, `allow-dns` and `allow-cnpg-operator`
# names are reserved.
# Without this a tenant would simply PATCH the generated floor into a permissive
# body, leaving the object present and the namespace open.
#
# The business-site staging hold additionally reserves one exact name in its
# exact namespace, including DELETE, without depending on namespace labels.
# Reserved names refuse tenant UPDATE even when an old platform-authored body
# already fails that rule for the tenant identity.
# Existing ordinary policies can predate this guard. A metadata-only UPDATE
# keeps the same identity and singular spec, so it adds no network access and
# remains admissible while those policies are migrated (#5823). CREATE and any
# changed invalid spec remain refused. Reserved names, plural specs and the
# exact staging hold are checked independently of this compatibility case.
#
# General scope and carve-outs: generated tenant namespaces (labelled
# app.kubernetes.io/managed-by: ksail or kro), plus the exact staging hold above,
# so other platform CiliumNetworkPolicies are untouched. Two applying identities are excluded — flux-system's
# kustomize-controller, which applies what the PLATFORM ships into a tenant
# namespace, and kyverno's background-controller, which is what actually creates
# and re-synchronises the generated default-deny, allow-dns and
# allow-cnpg-operator objects. Without the second exclusion this policy
# would refuse the very floor it exists to protect.
# The discriminator is the applying identity, which a tenant cannot forge.
# Because the exclusions match on request.userInfo the policy is admission-only
# (background disabled); every escape is a request passing through admission,
# so enforcement is unaffected.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-network-policies
  annotations:
    policies.kyverno.io/title: Restrict Tenant Network Policies
    policies.kyverno.io/category: Security, Networking
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: CiliumNetworkPolicy
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Blocks tenant-applied CiliumNetworkPolicy resources in ksail tenant
      namespaces from dissolving the generated default-deny floor: every
      ingress source and egress destination selector must carry a real
      constraint and may not name a reserved identity, another namespace or
      another cluster by label key, node selectors and provider groups are refused,
      only `kube-apiserver` (and `ingress` on the
      ingress side) may be named as an entity, CIDR entries shorter than /16
      or inside the protected address ranges listed above are refused and every CIDRSet entry
      must carry a literal cidr and name no CiliumCIDRGroup, and the generated `default-deny`,
      `allow-dns` and `allow-cnpg-operator` names are reserved. Service references must explicitly name
      the policy's own namespace. Ordinary additive allow-lists are
      unaffected, as are policies applied by flux-system's kustomize-controller
      or generated by kyverno's background-controller.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  # Admission-only: the exclusions match on request.userInfo (the applying
  # ServiceAccount), which is unavailable during background scans.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      # DELETE is here for the reserved names only: without it a tenant could
      # remove the generated floor. Every other check reads the submitted body,
      # which a DELETE does not have, so it accepts.
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ciliumnetworkpolicies"]
  matchConditions:
    # A selector on the whole policy would make the exact rollout hold depend
    # on mutable namespace labels. Preserve the original rule's OR scope here.
    - name: tenant-namespace-or-exact-staging-hold
      expression: >-
        namespaceObject.?metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('') in ['ksail', 'kro'] ||
        (request.namespace == 'business-site' && request.name == 'business-site-staging-hold')
    - name: not-platform-applied
      expression: >-
        request.userInfo.username != 'system:serviceaccount:flux-system:kustomize-controller'
    - name: not-generated-by-kyverno
      expression: >-
        request.userInfo.username != 'system:serviceaccount:kyverno:kyverno-background-controller'
  variables:
    - name: isTenantNamespace
      expression: >-
        namespaceObject.?metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('') in ['ksail', 'kro']
    - name: isDelete
      expression: "request.operation == 'DELETE'"
    - name: isUnchangedPolicyUpdate
      expression: >-
        request.operation == 'UPDATE' && oldObject != null && object != null &&
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        has(object.spec) && has(oldObject.spec) && object.spec == oldObject.spec
    - name: policyName
      expression: "variables.isDelete ? oldObject.metadata.name : object.metadata.name"
    - name: spec
      expression: "variables.isDelete ? dyn({}) : object.?spec.orValue(dyn({}))"
    - name: ingress
      expression: "variables.spec.?ingress.orValue([])"
    - name: egress
      expression: "variables.spec.?egress.orValue([])"
    # A selector key naming a reserved identity, another namespace or another
    # cluster. Keys are matched in all three source spellings: `reserved:`/`k8s:`,
    # the explicit `any:`, and no prefix at all (which Cilium defaults to `any:`).
    - name: broadSelectorKey
      expression: >-
        '^(reserved:|(any:)?(unknown|host|world|world-ipv4|world-ipv6|unmanaged|health|init|remote-node|kube-apiserver|ingress|cluster|cluster-mesh|all|none)$|(k8s:|any:)?io[.]kubernetes[.]pod[.]namespace$|(k8s:|any:)?io[.]cilium[.]k8s[.](namespace[.]labels[.]|policy[.]cluster$))'
    # Refuse on PREFIX LENGTH, not on prefix text: `0.0.0.0/1` plus `128.0.0.0/1`
    # covers an address family while matching neither literal. A bare address
    # carries no `/` and is unaffected.
    - name: shortPrefix
      expression: "'^[^/]*/0*([0-9]|1[0-5])$'"
    # The protected ranges from the header, read from the address text. The floor
    # above refuses every entry shorter than /16, so each remaining entry is either
    # inside one of these blocks or disjoint from it: the leading octets (or
    # hextets) decide, and no CIDR arithmetic is needed. IPv4: 0/8, 10/8, 172.16/12,
    # 192.168/16, 100.64/10, 127/8, 169.254/16, 198.18/15, 224/4 and 240/4. IPv6:
    # ::/8, 2002::/16, fc00::/7, fe80::/10, fec0::/10 and ff00::/8.
    - name: protectedRange
      expression: >-
        '(?i)^((0|10|127)[.]|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.]|169[.]254[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|192[.]168[.]|198[.]1[89][.]|(22[4-9]|2[3-5][0-9])[.]|0*[0-9a-f]?[0-9a-f]?:|2002:|f[cd][0-9a-f][0-9a-f]:|fe[89a-f][0-9a-f]:|ff[0-9a-f][0-9a-f]:)'

    # ── Ingress ──────────────────────────────────────────────────────────────
    - name: fromEndpoints
      expression: "variables.ingress.map(rule, rule.?fromEndpoints.orValue([])).flatten()"
    # WHITELIST OF OPERATORS: a selector counts as constrained only with
    # matchLabels or an `In` expression, so every empty spelling and every other
    # operator fails the same way.
    - name: fromEndpointsConstrained
      expression: >-
        variables.fromEndpoints.all(selector,
        size(selector.?matchLabels.orValue({})) > 0 ||
        selector.?matchExpressions.orValue([]).exists(item, item.?operator.orValue('') == 'In'))
    # Both forms are read, so the `In` form cannot smuggle a key the map form
    # refuses. Carved out, mirroring the entity whitelist: `kube-apiserver` and,
    # on this side only, `ingress`, each in its reserved/bare/`any:` spelling.
    - name: fromEndpointKeysAllowed
      expression: >-
        variables.fromEndpoints.map(selector,
        selector.?matchLabels.orValue({}).map(key, key) +
        selector.?matchExpressions.orValue([]).map(item, item.?key.orValue(''))).flatten()
        .all(key, !key.matches(variables.broadSelectorKey) ||
        key in ['reserved:kube-apiserver', 'kube-apiserver', 'any:kube-apiserver',
        'reserved:ingress', 'ingress', 'any:ingress'])
    # A rule with no layer-3 stanza permits every source on its port. An empty
    # stanza names nothing, so it does not count.
    - name: ingressRulesNameSources
      expression: >-
        variables.ingress.all(rule,
        ['fromEndpoints', 'fromCIDR', 'fromCIDRSet', 'fromEntities', 'fromNodes', 'fromGroups']
        .exists(field, field in rule && rule[field] != null && size(rule[field]) > 0))
    # The fields themselves are refused, even empty or null beside a valid source.
    - name: ingressOmitsNodesAndGroups
      expression: "variables.ingress.all(rule, !('fromNodes' in rule) && !('fromGroups' in rule))"
    - name: fromEntitiesAllowed
      expression: >-
        variables.ingress.map(rule, rule.?fromEntities.orValue([])).flatten()
        .all(entity, entity in ['kube-apiserver', 'ingress'])
    - name: fromCIDRSets
      expression: "variables.ingress.map(rule, rule.?fromCIDRSet.orValue([])).flatten()"
    # Every CIDRSet entry must carry a literal cidr and name no CiliumCIDRGroup:
    # Cilium applies every populated source in an entry, so a group beside a cidr
    # still grants the group's ranges.
    - name: fromCIDRSetsLiteral
      expression: >-
        variables.fromCIDRSets.all(entry, 'cidr' in entry && entry.cidr != null &&
        !('cidrGroupRef' in entry) && !('cidrGroupSelector' in entry))
    - name: fromAddressesAllowed
      expression: >-
        (variables.ingress.map(rule, rule.?fromCIDR.orValue([])).flatten() +
        variables.fromCIDRSets.filter(entry, 'cidr' in entry && entry.cidr != null).map(entry, entry.cidr))
        .all(address, !address.matches(variables.shortPrefix) && !address.matches(variables.protectedRange))

    # ── Egress ───────────────────────────────────────────────────────────────
    - name: toEndpoints
      expression: "variables.egress.map(rule, rule.?toEndpoints.orValue([])).flatten()"
    - name: toEndpointsConstrained
      expression: >-
        variables.toEndpoints.all(selector,
        size(selector.?matchLabels.orValue({})) > 0 ||
        selector.?matchExpressions.orValue([]).exists(item, item.?operator.orValue('') == 'In'))
    # `reserved:ingress` is a SOURCE identity and has no egress case.
    - name: toEndpointKeysAllowed
      expression: >-
        variables.toEndpoints.map(selector,
        selector.?matchLabels.orValue({}).map(key, key) +
        selector.?matchExpressions.orValue([]).map(item, item.?key.orValue(''))).flatten()
        .all(key, !key.matches(variables.broadSelectorKey) ||
        key in ['reserved:kube-apiserver', 'kube-apiserver', 'any:kube-apiserver'])
    - name: egressRulesNameDestinations
      expression: >-
        variables.egress.all(rule,
        ['toEndpoints', 'toCIDR', 'toCIDRSet', 'toEntities', 'toNodes', 'toGroups', 'toServices', 'toFQDNs']
        .exists(field, field in rule && rule[field] != null && size(rule[field]) > 0))
    - name: egressOmitsNodesAndGroups
      expression: "variables.egress.all(rule, !('toNodes' in rule) && !('toGroups' in rule))"
    # Every label a wildcard (`*`, `*.*`, …) names no destination. A matchName is
    # an exact name and unaffected.
    - name: toFQDNsNameADestination
      expression: >-
        variables.egress.map(rule, rule.?toFQDNs.orValue([])).flatten()
        .all(fqdn, !fqdn.?matchPattern.orValue('').matches('^[*]([.][*])*$'))
    - name: toEntitiesAllowed
      expression: >-
        variables.egress.map(rule, rule.?toEntities.orValue([])).flatten()
        .all(entity, entity == 'kube-apiserver')
    - name: toCIDRSets
      expression: "variables.egress.map(rule, rule.?toCIDRSet.orValue([])).flatten()"
    - name: toCIDRSetsLiteral
      expression: >-
        variables.toCIDRSets.all(entry, 'cidr' in entry && entry.cidr != null &&
        !('cidrGroupRef' in entry) && !('cidrGroupSelector' in entry))
    - name: toAddressesAllowed
      expression: >-
        (variables.egress.map(rule, rule.?toCIDR.orValue([])).flatten() +
        variables.toCIDRSets.filter(entry, 'cidr' in entry && entry.cidr != null).map(entry, entry.cidr))
        .all(address, !address.matches(variables.shortPrefix) && !address.matches(variables.protectedRange))
    - name: toServices
      expression: "variables.egress.map(rule, rule.?toServices.orValue([])).flatten()"
    # Cilium resolves a selected Service's backends into endpoint selectors, so an
    # unconstrained reference reaches arbitrary backends without passing the
    # toEndpoints whitelist.
    - name: toServicesNameSomething
      expression: >-
        variables.toServices.all(service,
        service.?k8sService.?serviceName.orValue('') != '' ||
        size(service.?k8sServiceSelector.?selector.?matchLabels.orValue({})) > 0 ||
        service.?k8sServiceSelector.?selector.?matchExpressions.orValue([])
        .exists(item, item.?operator.orValue('') == 'In'))
    # Cilium treats an empty Service namespace as a wildcard, not as the policy's
    # namespace. Each populated reference is compared on its own, so a local one
    # cannot hide a foreign one beside it.
    - name: toServicesStayInNamespace
      expression: >-
        variables.toServices.all(service,
        (!('k8sService' in service) || service.k8sService.?namespace.orValue('') == request.namespace) &&
        (!('k8sServiceSelector' in service) || service.k8sServiceSelector.?namespace.orValue('') == request.namespace))
  validations:
    - expression: >-
        !variables.isTenantNamespace || variables.isUnchangedPolicyUpdate ||
        variables.fromEndpointsConstrained && variables.fromEndpointKeysAllowed &&
        variables.ingressRulesNameSources && variables.ingressOmitsNodesAndGroups &&
        variables.fromEntitiesAllowed && variables.fromCIDRSetsLiteral && variables.fromAddressesAllowed
      message: >-
        Every ingress source in a tenant CiliumNetworkPolicy must be
        constrained. fromNodes and fromGroups are outside the tenant namespace
        boundary and must be omitted. A fromEndpoints selector with no matchLabels and no
        matchExpressions allows all sources; a selector key naming a reserved
        identity (`reserved:host`, or its bare/`any:` spelling), another
        namespace (`k8s:io.kubernetes.pod.namespace`,
        `io.cilium.k8s.namespace.labels.*`) or another cluster
        (`io.cilium.k8s.policy.cluster`) reaches the same broad source — pin a
        tenant label with the `k8s:` prefix instead, and name the post-Gateway
        identity as `reserved:ingress` or `fromEntities: [ingress]`; only
        `kube-apiserver` and the post-Gateway `ingress` identity may be named
        as an entity; and a CIDR prefix shorter than /16 — or a CIDR inside
        private, cluster, link-local, loopback or multicast space, or a
        CIDRSet entry naming a CiliumCIDRGroup, with or without a literal cidr beside it —
        reaches outside this
        namespace. A rule with only toPorts and no source at all allows every
        source on that port. Cilium unions allow rules, so one unconstrained
        source removes this namespace's isolation regardless of the generated
        default-deny.
    - expression: >-
        !variables.isTenantNamespace || variables.isUnchangedPolicyUpdate ||
        variables.toEndpointsConstrained && variables.toEndpointKeysAllowed &&
        variables.egressRulesNameDestinations && variables.egressOmitsNodesAndGroups &&
        variables.toFQDNsNameADestination && variables.toEntitiesAllowed &&
        variables.toCIDRSetsLiteral && variables.toAddressesAllowed &&
        variables.toServicesNameSomething && variables.toServicesStayInNamespace
      message: >-
        Every egress destination in a tenant CiliumNetworkPolicy must be
        constrained. toNodes and toGroups are outside the tenant namespace
        boundary and must be omitted. A toEndpoints selector with no matchLabels and no
        matchExpressions allows all destinations; a selector key naming a
        reserved identity (`reserved:world`, or its bare/`any:` spelling),
        another namespace (`k8s:io.kubernetes.pod.namespace`,
        `io.cilium.k8s.namespace.labels.*`) or another cluster
        (`io.cilium.k8s.policy.cluster`) reaches the same broad destination —
        pin a tenant label with the `k8s:` prefix instead; `kube-apiserver` is
        the only entity a tenant may name; and a CIDR prefix shorter than /16
        — or a CIDR inside private, cluster, link-local, loopback or multicast
        space, or a CIDRSet entry naming a CiliumCIDRGroup, with or without a
        literal cidr beside it — reaches outside this
        namespace, as do a rule with only toPorts, a toFQDNs pattern of `*`,
        and a toServices entry that names no service or does not explicitly
        set namespace to this policy's own namespace. An omitted or empty
        Service namespace matches Services across namespaces.
        Name the destinations this workload actually needs.
    - expression: >-
        !variables.isTenantNamespace || variables.isUnchangedPolicyUpdate ||
        variables.spec.?enableDefaultDeny.?ingress.orValue(true) != false &&
        variables.spec.?enableDefaultDeny.?egress.orValue(true) != false
      message: >-
        A tenant CiliumNetworkPolicy must not set enableDefaultDeny to false.
        The namespace's whitelist mode is what the generated default-deny
        establishes; opting out of it is never something a tenant allow-list
        needs to do.
    - expression: >-
        !(variables.isTenantNamespace && variables.policyName in ['default-deny', 'allow-dns', 'allow-cnpg-operator']) &&
        !(request.namespace == 'business-site' && variables.policyName == 'business-site-staging-hold')
      message: >-
        `default-deny`, `allow-dns` and `allow-cnpg-operator` are generated and
        re-synchronised by the
        platform (cluster-policies/best-practices/add-default-deny.yaml) and
        are reserved names. `business-site-staging-hold` in `business-site`
        is also a platform-owned rollout control. Add your allow-list as a separate policy — Cilium
        unions allow rules, so a policy of your own is additive and does not
        need to replace the floor.
    # CiliumNetworkPolicy accepts EITHER a single `spec` or a plural `specs` list.
    # Every check above reads `spec`, so a rule under `specs` is invisible to them.
    # Refusing the container is preferred over mirroring every check across both
    # paths, which re-opens the boundary the first time one is added to one path.
    - expression: "!variables.isTenantNamespace || variables.isDelete || size(object.?specs.orValue([])) == 0"
      message: >-
        A tenant CiliumNetworkPolicy must carry its rules under `spec`, not the
        plural `specs` container. Every boundary check in this policy reads
        `spec`, so rules hidden under `specs` would reach admission unexamined.
        Move the rules into `spec`; a policy needing several rule sets can be
        split into several policies, which Cilium unions anyway.
