# Pins which GitHub team a github-config Team object reconciles, for the whole
# life of the object (#3144).
#
# restrict-github-team-management binds spec.forProvider.name to the object
# name, but the provider finds the remote team by the numeric ID in the
# crossplane.io/external-name annotation, not by name. Whoever can write that
# annotation can point the allow-listed object `admins` at any team in the
# organization, and every TeamMembership and TeamRepository that references
# `admins` by name then acts on that team through the org-admin provider.
#
# Measured on prod (2026-10-05), the annotation has two legitimate writers:
#
# - the provider itself, which records the ID of a team it has just created
#   (`admins`: the annotation's field owner is the provider);
# - the github-config artifact, which adopts a team that already exists by
#   stating its ID (`maintainers`: Observe-only, field owner is the applier).
#   The same path recovers both teams after a rebuild.
#
# So neither "never set it" nor "only the provider sets it" holds. The first
# validation accepts, from anyone but the provider, exactly three cases: no
# annotation, the value the object already carries, or the approved identity of
# that object name. Everything else is a foreign team and is refused on create
# and on update alike.
#
# The approved identities live HERE and are not read from the github-config
# artifact, for the reason the member allow-list gives: that artifact is the
# input this policy constrains. A team that is deleted and created again gets a
# new ID; the provider's own write of it is admitted, the object keeps working
# because an unchanged value is always accepted, and the entry below is then
# updated in a reviewed change so the new ID can be used for recovery.
#
# The provider is exempt because the ID of a team it has just created cannot be
# known in advance. Its ServiceAccount is named after the provider package
# revision (provider-upjet-github-<revision>, read from the running pod), so
# the name changes with every provider upgrade and is matched by prefix.
# Creating a ServiceAccount in crossplane-system is a platform-level
# permission, so the prefix cannot be claimed from a tenant namespace. It would
# also cover another package whose name starts the same way, should one ever
# be installed there.
#
# Admission-only, because the exemption is on the writing identity, which a
# background scan does not have.
#
# An update is judged like a create: unlike the ClusterPolicy default, nothing
# here admits an update because the object ALREADY failed. That would be a way
# round the policy: a team the provider created anew carries an identity that is
# not approved yet, so its object "already fails" when judged alone, and every
# later change to its identity would be waved through. An unchanged value is
# accepted by the expressions below instead, which is the only tolerance needed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-github-team-external-identity
  annotations:
    policies.kyverno.io/title: Restrict GitHub Team External Identity
    policies.kyverno.io/category: Security, GitHub
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Team, TeamMembership, TeamRepository
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Refuses a github-config Team whose crossplane.io/external-name is set or
      changed to anything other than the approved numeric identity of that team,
      so an allow-listed Team object cannot be pointed at a different GitHub
      team after it was admitted, and a TeamMembership or TeamRepository whose
      crossplane.io/external-name disagrees with the team and the user or
      repository the object declares, so a compliant-looking membership or
      grant cannot stand for another one. The provider's own records are
      exempt.
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["team.github.m.upbound.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["teams", "teamrepositories", "teammemberships"]
  matchConditions:
    - name: in-github-config
      expression: "object.metadata.?namespace.orValue('') == 'github-config'"
    - name: not-written-by-the-provider
      expression: >-
        !request.userInfo.username.startsWith('system:serviceaccount:crossplane-system:provider-upjet-github-')
  variables:
    - name: externalName
      expression: "object.metadata.?annotations[?'crossplane.io/external-name'].orValue('')"
    # On a create there is no previous object, and no previous identity to keep.
    - name: previousExternalName
      expression: >-
        oldObject == null || !has(oldObject.metadata) ? '' :
        oldObject.metadata.?annotations[?'crossplane.io/external-name'].orValue('')
    - name: subjectField
      expression: "object.kind == 'TeamRepository' ? 'repository' : 'username'"
    - name: teamRef
      expression: "object.?spec.?forProvider.?teamIdRef.?name.orValue('')"
    - name: subject
      expression: "object.?spec.?forProvider[?variables.subjectField].orValue('')"
    - name: initSubject
      expression: "object.?spec.?initProvider[?variables.subjectField].orValue('')"
    - name: previousTeamRef
      expression: "oldObject == null || !has(oldObject.metadata) ? '' : oldObject.?spec.?forProvider.?teamIdRef.?name.orValue('')"
    - name: previousSubject
      expression: "oldObject == null || !has(oldObject.metadata) ? '' : oldObject.?spec.?forProvider[?variables.subjectField].orValue('')"
    # A membership or repository grant has a stored identity of its own:
    # "<team id>:<username>" or "<team id>:<repository>" (#4518). Read from the
    # released sources of the provider version prod runs (provider-upjet-github
    # v0.20.0, terraform-provider-github v6.13.0, upjet v2.2.0):
    #
    # - a repository grant is read, updated and removed by that stored identity
    #   alone, so a grant object that satisfies every rule in
    #   restrict-github-team-management could change or remove the access of a
    #   different team than the one it references;
    # - a membership refuses an update when its stored identity names another
    #   team or user, but its removal acts on what was read through that
    #   identity.
    #
    # So the stored identity has to agree with what the object itself declares.
    # From anyone but the provider it may be absent, exactly what the object
    # already carries while it keeps referencing the same team and the same
    # repository or user, or the approved identity of the referenced team
    # followed by the declared repository or user. The two team identities are
    # the ones the Team validation approves, repeated here for the reason given at
    # the top of this file: a change of one is a change of both expressions.
    #
    # "Unchanged" covers the team reference and the repository or user as well
    # as the identity, so an object cannot keep an identity while being
    # re-declared to stand for something else. The provider records identities
    # in exactly the approved shape (measured on prod 2026-10-05: all 49
    # memberships and grants), so the artifact's routine re-apply passes either
    # way.
    #
    # The team reference is compared on its own and the team identity is a
    # literal prefix, so no value can borrow a separator to look like another
    # pair. An empty repository or username is never an approved identity, and
    # one stated under initProvider is not compared here, so it may not accompany
    # a stored identity at all (no object on prod states one: measured
    # 2026-10-05).
    - name: grantIdentityAccepted
      expression: >-
        (variables.externalName == '' &&
        (variables.previousExternalName == '' ||
        (variables.teamRef == variables.previousTeamRef && variables.subject == variables.previousSubject))) ||
        (variables.initSubject == '' &&
        ((variables.externalName == variables.previousExternalName &&
        variables.teamRef == variables.previousTeamRef && variables.subject == variables.previousSubject) ||
        (variables.subject != '' &&
        ((variables.teamRef == 'admins' && variables.externalName == '18573307:' + variables.subject) ||
        (variables.teamRef == 'maintainers' && variables.externalName == '17046606:' + variables.subject)))))
  # CEL compares these strings literally: an identity of "*" matches nothing, and
  # a later value cannot count as "unchanged" from a pattern. Name and identity
  # are checked as a pair, so the approved identity of one team cannot be used
  # on the other object.
  validations:
    - expression: >-
        object.kind != 'Team' ||
        variables.externalName == '' ||
        variables.externalName == variables.previousExternalName ||
        object.metadata.name + '/' + variables.externalName in ['admins/18573307', 'maintainers/17046606']
      message: >-
        The crossplane.io/external-name of a github-config Team may only be
        left unset, left unchanged, or set to the approved numeric identity of
        that team. Adopting a team under a new identity is a reviewed change
        to restrict-github-team-external-identity.yaml.
    - expression: "object.kind != 'TeamRepository' || variables.grantIdentityAccepted"
      message: >-
        The crossplane.io/external-name of a github-config TeamRepository may
        only be left unset, removed or left unchanged while its team reference
        and repository stay as they were, or set to the approved numeric identity of the referenced
        team followed by a colon and spec.forProvider.repository. A stored
        identity cannot be combined with spec.initProvider.repository. To point an
        object at another team or repository, delete it and create it again.
    - expression: "object.kind != 'TeamMembership' || variables.grantIdentityAccepted"
      message: >-
        The crossplane.io/external-name of a github-config TeamMembership may
        only be left unset, removed or left unchanged while its team reference
        and username stay as they were, or set to the approved numeric identity of the referenced
        team followed by a colon and spec.forProvider.username. A stored
        identity cannot be combined with spec.initProvider.username. To point an
        object at another team or username, delete it and create it again.
