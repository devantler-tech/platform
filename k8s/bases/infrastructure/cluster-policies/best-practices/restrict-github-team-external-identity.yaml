# Pins which GitHub team a github-config Team object reconciles, for the whole
# life of the object (#3144).
#
# restrict-github-team-management binds spec.forProvider.name to the object
# name, but the provider finds the remote team by the numeric ID in the
# crossplane.io/external-name annotation, not by name. Whoever can write that
# annotation can point the allow-listed object `admins` at any team in the
# organization, and every TeamMembership and TeamRepository that references
# `admins` by name then acts on that team through the org-admin provider.
#
# Measured on prod (2026-10-05), the annotation has two legitimate writers:
#
# - the provider itself, which records the ID of a team it has just created
#   (`admins`: the annotation's field owner is the provider);
# - the github-config artifact, which adopts a team that already exists by
#   stating its ID (`maintainers`: Observe-only, field owner is the applier).
#   The same path recovers both teams after a rebuild.
#
# So neither "never set it" nor "only the provider sets it" holds. The rule
# below accepts, from anyone but the provider, exactly three cases: no
# annotation, the value the object already carries, or the approved identity of
# that object name. Everything else is a foreign team and is refused on create
# and on update alike.
#
# The approved identities live HERE and are not read from the github-config
# artifact, for the reason the member allow-list gives: that artifact is the
# input this policy constrains. A team that is deleted and created again gets a
# new ID; the provider's own write of it is admitted, the object keeps working
# because an unchanged value is always accepted, and the entry below is then
# updated in a reviewed change so the new ID can be used for recovery.
#
# The provider is exempt because the ID of a team it has just created cannot be
# known in advance. Its ServiceAccount is named after the provider package
# revision (provider-upjet-github-<revision>, read from the running pod), so
# the name changes with every provider upgrade and is matched by prefix.
# Creating a ServiceAccount in crossplane-system is a platform-level
# permission, so the prefix cannot be claimed from a tenant namespace.
#
# Admission-only (background: false), because the exemption is on the writing
# identity, which a background scan does not have.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-github-team-external-identity
  annotations:
    policies.kyverno.io/title: Restrict GitHub Team External Identity
    policies.kyverno.io/category: Security, GitHub
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Team
    policies.kyverno.io/minversion: 1.13.0
    policies.kyverno.io/description: >-
      Refuses a github-config Team whose crossplane.io/external-name is set or
      changed to anything other than the approved numeric identity of that team,
      so an allow-listed Team object cannot be pointed at a different GitHub
      team after it was admitted. The provider's own record of a team it
      created is exempt.
spec:
  background: false
  rules:
    - name: teams-external-name-is-an-approved-identity
      match:
        any:
          - resources:
              kinds:
                - team.github.m.upbound.io/*/Team
              operations:
                - CREATE
                - UPDATE
              namespaces:
                - github-config
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: provider-upjet-github-*
                namespace: crossplane-system
      context:
        - name: externalName
          variable:
            jmesPath: request.object.metadata.annotations."crossplane.io/external-name"
            default: ""
        - name: previousExternalName
          variable:
            jmesPath: request.oldObject.metadata.annotations."crossplane.io/external-name"
            default: ""
      validate:
        failureAction: Enforce
        # Kyverno admits an update by default when the object ALREADY failed the
        # rule before it. Here that would be a way round the rule: a team the
        # provider created anew carries an identity that is not approved yet, so
        # its object "already fails" when judged alone, and every later change
        # to its identity would be waved through. An unchanged value is accepted
        # by the conditions below instead, which is the only tolerance needed.
        allowExistingViolations: false
        message: >-
          The crossplane.io/external-name of a github-config Team may only be
          left unset, left unchanged, or set to the approved numeric identity of
          that team. Adopting a team under a new identity is a reviewed change
          to restrict-github-team-external-identity.yaml.
        deny:
          conditions:
            all:
              - key: "{{ externalName }}"
                operator: NotEquals
                value: ""
              - key: "{{ externalName }}"
                operator: NotEquals
                value: "{{ previousExternalName }}"
              # Name and identity are checked as a pair, so the approved
              # identity of one team cannot be used on the other object.
              - key: "{{ request.object.metadata.name }}/{{ externalName }}"
                operator: AnyNotIn
                value:
                  - admins/18573307
                  - maintainers/17046606
