---
# The three independently tested guards replace the corresponding legacy rules
# without changing the source writer, resource scope or denial outcomes. Keep
# the legacy ClusterPolicy deployed until all three replacements are Ready;
# Flux's apply/prune ordering alone does not establish webhook readiness.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-unifi-management-policies
  annotations:
    policies.kyverno.io/title: Restrict UniFi Management Policies
    policies.kyverno.io/category: Crossplane
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Record, Client, TrafficRoute
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Refuses source-applied UniFi resources whose management policies can
      delete the managed network object. Controller and operator identities
      remain outside this admission-only guard.
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [dns.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [records]
      - apiGroups: [vpn.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [clients]
      - apiGroups: [route.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [trafficroutes]
  matchConditions:
    - name: unifi-source
      expression: >-
        request.namespace == 'unifi' &&
        request.userInfo.username == 'system:serviceaccount:unifi:unifi'
  variables:
    # Preserve JMESPath's existing conservative default for missing, null AND
    # empty lists. An empty list must not become a way around this guard.
    - name: managementPolicies
      expression: >-
        has(object.spec) && has(object.spec.managementPolicies) &&
        object.spec.managementPolicies != null && object.spec.managementPolicies.size() > 0
        ? object.spec.managementPolicies : ['*']
  validations:
    # CEL membership compares literal strings; '*' is not a pattern here.
    - expression: >-
        !('*' in variables.managementPolicies) && !('Delete' in variables.managementPolicies)
      message: >-
        UniFi managed resources applied from devantler-tech/unifi may not use
        Delete or "*" management policies; a missing, null or empty list keeps
        the conservative "*" default.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-unifi-observe-only
  annotations:
    policies.kyverno.io/title: Restrict UniFi Observe-Only Resources
    policies.kyverno.io/category: Crossplane
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Record, Client, TrafficRoute
    policies.kyverno.io/minversion: 1.17.0
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [dns.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [records]
      - apiGroups: [vpn.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [clients]
      - apiGroups: [route.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [trafficroutes]
  matchConditions:
    - name: unifi-source
      expression: >-
        request.namespace == 'unifi' &&
        request.userInfo.username == 'system:serviceaccount:unifi:unifi'
    - name: observe-only
      expression: >-
        object.metadata.?annotations.orValue({})[?'platform.devantler.tech/unifi-management'].orValue('')
        == 'observe-only'
  validations:
    - expression: >-
        has(object.spec) && has(object.spec.managementPolicies) &&
        object.spec.managementPolicies == ['Observe']
      message: >-
        A UniFi managed resource annotated
        platform.devantler.tech/unifi-management: observe-only must have
        spec.managementPolicies exactly ["Observe"].
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-unifi-prune-management-policies
  annotations:
    policies.kyverno.io/title: Restrict UniFi Prune Management Policies
    policies.kyverno.io/category: Crossplane
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Record, Client, TrafficRoute
    policies.kyverno.io/minversion: 1.17.0
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [dns.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [records]
      - apiGroups: [vpn.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [clients]
      - apiGroups: [route.unifi.m.crossplane.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [trafficroutes]
  matchConditions:
    - name: unifi-source
      expression: >-
        request.namespace == 'unifi' &&
        request.userInfo.username == 'system:serviceaccount:unifi:unifi'
  variables:
    # DELETE must judge the stored object, including an object removed before
    # Flux has ever applied its retention patch. It has no incoming object.
    - name: managementPolicies
      expression: >-
        has(oldObject.spec) && has(oldObject.spec.managementPolicies) &&
        oldObject.spec.managementPolicies != null && oldObject.spec.managementPolicies.size() > 0
        ? oldObject.spec.managementPolicies : ['*']
  validations:
    - expression: >-
        !('*' in variables.managementPolicies) && !('Delete' in variables.managementPolicies)
      message: >-
        The unifi ServiceAccount may only delete a UniFi managed resource whose
        stored management policies exclude Delete and "*". Apply its retention
        policy first or retire the object deliberately as a platform operator.
