# Mutates pods to apply security best-practices that kubescape checks:
# - seccompProfile: RuntimeDefault (C-0055 Linux hardening) — pod + container
# - allowPrivilegeEscalation: false (C-0016)
# - readOnlyRootFilesystem: true (C-0017)
# - drop ALL capabilities (C-0055)
# - runAsNonRoot: true (C-0013) — pod + container
# - runAsUser: 1000 + runAsGroup: 1000 (C-0013/C-0211 non-root user+group) — pod level
# - fsGroup: 1000 + fsGroupChangePolicy: OnRootMismatch (C-0211) — pod level
# - seLinuxOptions: {level: s0} (C-0211 CIS-5.7.3) — containers + initContainers
# - hostUsers: false — only in namespaces that explicitly opt in after userns
#   validation
#
# Together these complete the security context kubescape's CIS-5.7.3 (C-0211) checks
# (non-root-containers, set-fsgroup-value, set-fsgroupchangepolicy-value,
# set-seLinuxOptions). Why each is safe to inject cluster-wide:
# - runAsUser and runAsGroup are injected TOGETHER at the POD level, and only there.
#   A pod-level runAsGroup with NO runAsUser yields the OCI user string ":1000",
#   which containerd rejects ("user group \"1000\" is specified without user") so the
#   pod sandbox never starts. Injecting runAsGroup alone did exactly that to homepage
#   (its chart sets runAsUser only at the CONTAINER level) and to tofu-controller's
#   tf-runner. Pairing a matching runAsUser:1000 keeps the pod-level user+group
#   complete so the sandbox always builds. Both use +(key) conditional anchors: a
#   chart that sets its own pod-level value keeps it, and a container that sets its
#   own runAsUser still overrides this pod-level default for that container (so e.g.
#   homepage's container keeps runAsUser:1000, auth-proxy keeps 65532, etc.).
# - EXEMPTIONS — images with a baked-in non-1000 UID and no chart-set runAsUser must
#   NOT be forced to 1000 (cert-manager / trust-manager / origin-ca-issuer = 65532,
#   keda = 65532, opencost = 1001; tofu-controller tf-runner takes its UID from its
#   runnerPodTemplate). They are excluded from add-pod-security-context and handled by
#   add-imageuid-pod-security-context below, which supplies pod-level seccomp,
#   runAsNonRoot, fsGroup and fsGroupChangePolicy but NEITHER runAsUser NOR runAsGroup
#   — so they keep their image UID and their sandbox still builds (no group without
#   user). Add a namespace here only when a workload genuinely cannot run as 1000;
#   the default (forced 1000:1000) is the more hardened posture.
# - fsGroup uses a conditional anchor, so any workload that sets its own (every
#   PVC-mounting workload in scope does) keeps it; only stateless pods get the
#   default, where it governs emptyDir/projected-volume ownership harmlessly.
# - seLinuxOptions is a no-op on this AppArmor cluster — runc ignores SELinux labels
#   when SELinux isn't the active LSM (verified: Cilium already ships one and a probe
#   pod ran fine) — but CIS-5.7.3 requires it and it is correct defense-in-depth on
#   any SELinux node. level: s0 is the default non-privileged MCS level (not Cilium's
#   spc_t, which is for privileged pods).
#
# Uses +(key) to never overwrite values explicitly set by Helm charts.
# Excluded namespaces require elevated privileges by design.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-security-context
  annotations:
    policies.kyverno.io/title: Security Context Defaults
    policies.kyverno.io/category: Pod Security, Best Practices
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Mutates all pods to set security best-practice defaults using
      conditional anchors so explicit chart values are never overwritten.
spec:
  rules:
    # User namespaces are default-off and enabled per namespace only after the
    # workload and its volume types have been validated on the real-kernel
    # Hetzner provider. The local Docker provider stays opted out because Talos
    # runs nested there and idmapped-mount support is not guaranteed. A
    # conditional anchor preserves an explicit workload choice.
    - name: add-user-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/user-namespaces: enabled
      # CNPG-managed pods (instances and their initdb/join jobs, all labelled
      # cnpg.io/cluster) stay on host user namespaces even in an opted-in
      # namespace: their Longhorn PVCs would need idmapped-mount support,
      # which is unvalidated (#1807 sequences stateful workloads last). This
      # lets mixed namespaces (stateless app + CNPG database) opt in safely.
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            +(hostUsers): false
    - name: add-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only. Without this, Kyverno also mutates pod UPDATEs;
              # pod spec is immutable, so for any pod created while the
              # policy/webhook wasn't active yet (fresh-cluster bring-up
              # ordering) EVERY later update — including OpenBao's
              # service-registration label patches — is rejected with
              # HTTP 422 "pod updates may not change fields other than
              # image...". That froze openbao-active at zero endpoints and
              # broke every system test from 2026-06-10 (#1990 probe output).
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
          # Workloads with an image-baked non-1000 UID and no chart-set runAsUser
          # (cert-manager/trust-manager/origin-ca-issuer = 65532, keda = 65532,
          # opencost = 1001). Forcing pod-level runAsUser:1000 would override their
          # image UID; instead they are handled by add-imageuid-pod-security-context
          # below, which omits runAsUser/runAsGroup so they keep their UID and the
          # sandbox still builds.
          - resources:
              namespaces:
                - cert-manager
                - keda
                - opencost
          # tofu-controller runner pods take their UID from their runnerPodTemplate
          # and ship no image-baked UID; same handling as the namespaces above.
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: tofu-controller
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
              +(runAsNonRoot): true
              +(runAsUser): 1000
              +(runAsGroup): 1000
              +(fsGroup): 1000
              +(fsGroupChangePolicy): OnRootMismatch
    - name: add-container-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same immutability rationale as above.
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(readOnlyRootFilesystem): true
                      +(runAsNonRoot): true
                      +(capabilities):
                        drop:
                          - ALL
                      +(seccompProfile):
                        type: RuntimeDefault
                      +(seLinuxOptions):
                        level: s0
          - list: "request.object.spec.initContainers[]"
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(readOnlyRootFilesystem): true
                      +(runAsNonRoot): true
                      +(capabilities):
                        drop:
                          - ALL
                      +(seccompProfile):
                        type: RuntimeDefault
                      +(seLinuxOptions):
                        level: s0
    # Pods exempt from the pod-level runAsUser/runAsGroup injection in
    # add-pod-security-context (image-baked non-1000 UIDs: cert-manager, keda,
    # opencost; and tofu-controller runner pods) still must satisfy the rest of
    # C-0211 at the pod level. tofu-controller does NOT propagate its
    # runnerPodTemplate's pod-level securityContext to the created runner pod, and
    # the excluded namespaces' charts do not all set these either, so re-supply them
    # here — everything the pod rule injects EXCEPT the sandbox-sensitive
    # runAsUser/runAsGroup: seccompProfile + runAsNonRoot + fsGroup +
    # fsGroupChangePolicy. These pods keep their image UID; the sandbox builds because
    # neither runAsUser nor runAsGroup is set at the pod level (no group without user).
    - name: add-imageuid-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same immutability rationale as the rules above.
              operations:
                - CREATE
              selector:
                matchLabels:
                  app.kubernetes.io/created-by: tofu-controller
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaces:
                - cert-manager
                - keda
                - opencost
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(seccompProfile):
                type: RuntimeDefault
              +(runAsNonRoot): true
              +(fsGroup): 1000
              +(fsGroupChangePolicy): OnRootMismatch
    # The twelve namespaces excluded from add-pod-security-context and
    # add-container-security-context are excluded because their workloads need
    # elevated PRIVILEGE. That rationale covers runAsUser/runAsGroup/fsGroup and
    # the container hardening fields — it does not cover fsGroupChangePolicy or
    # seLinuxOptions, which are not privilege fields:
    # - fsGroupChangePolicy only governs ownership-relabel behaviour when the
    #   kubelet applies an fsGroup to a volume. It grants nothing.
    # - seLinuxOptions {level: s0} is the default non-privileged MCS level and is
    #   a no-op on this AppArmor cluster (runc ignores SELinux labels when SELinux
    #   is not the active LSM), retained as CIS-5.7.3 defense-in-depth.
    # Excluding them cost both controls across the whole excluded population:
    # measured against live prod specs 2026-08-29, 210/210 pods in those twelve
    # namespaces have no fsGroupChangePolicy and 189/210 have at least one
    # container with no seLinuxOptions.
    #
    # DEFAULT-OFF. This rule is gated on an explicit namespace opt-in label, the
    # same mechanism add-user-namespaces uses, so merging it changes nothing until
    # a namespace is labelled. Roll out one namespace at a time.
    #
    # Deliberately NOT injected here: fsGroup. It is a group field, so supplying it
    # is exactly the privilege change the exclusion exists to prevent. The
    # consequence is recorded rather than hidden — where a pod sets no fsGroup
    # (119 of the 210 measured), fsGroupChangePolicy has no runtime effect at all
    # and only satisfies the control. That inertness is the point: this rule can
    # change a pod's declared posture without changing how it runs.
    #
    # Neither field carries the runAsGroup-without-runAsUser coupling documented
    # above, so no pod sandbox can fail to build on account of this rule.
    - name: add-baseline-context-optin-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              # CREATE only — same pod-spec immutability rationale as the rules
              # above; existing pods pick this up when they are next recreated.
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context: enabled
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(fsGroupChangePolicy): OnRootMismatch
    # A pod-level seLinuxOptions that EXISTS but carries no `level` is the one
    # shape neither rule above closes, and both still report success. The
    # container foreach below deliberately skips it — a container-level object
    # REPLACES the pod-level struct wholesale, so writing `level` there would
    # discard the operator's sibling fields — and the pod rule above fills only
    # fsGroupChangePolicy. Every container with no override therefore inherits
    # `{user: system_u}` with no level, and the promised C-0211 field is never
    # supplied. Measured 2026-08-30: `velero/podlevel-partial` came back with
    # its containers inheriting a level-less object.
    #
    # Fill the missing leaf at POD scope, where it is free: the `+(level)`
    # anchor preserves every sibling, and one write covers all containers and
    # initContainers that do not override.
    #
    # The precondition scopes this to pods that ALREADY carry a pod-level
    # object, so it never creates one where the author set none — that shape is
    # the container rule's, and creating a pod-level object here would silently
    # move ownership between rules and change the `plain` case.
    - name: add-baseline-context-optin-pod-selinux-level
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context: enabled
      preconditions:
        all:
          - key: "{{ request.object.spec.securityContext.seLinuxOptions || '' }}"
            operator: NotEquals
            value: ''
          - key: "{{ request.object.spec.securityContext.seLinuxOptions.level || '' }}"
            operator: Equals
            value: ''
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              seLinuxOptions:
                +(level): s0
    # The anchor is on the LEAF (`+(level)`), not the whole object. Anchoring
    # `+(seLinuxOptions)` would fire only when the object is entirely absent, so a
    # container carrying some other SELinux field with no `level` would be reported
    # as mutated while `level` stayed unset — measured 2026-08-29: such a container
    # came back `{user: system_u}`. The leaf anchor fills the missing field and
    # preserves siblings. `tests/add-baseline-context` pins all three states; do not
    # collapse this back to an object-level anchor.
    - name: add-baseline-context-optin-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  pod-security.devantler.tech/baseline-context: enabled
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            # A container-level seLinuxOptions REPLACES the pod-level struct wholesale
            # (kubelet DetermineEffectiveSecurityContext), so injecting `level` into a
            # container that has none would discard the pod's ENTIRE SELinux identity for
            # that container — measured 2026-08-29: a pod declaring
            # `{user: system_u, level: s9}` came back with the container on `{level: s0}`,
            # losing both the operator's level and its user. Inject only when the pod sets
            # no SELinux options at all, or when the container already overrides them.
            preconditions:
              any:
                - key: "{{ request.object.spec.securityContext.seLinuxOptions || '' }}"
                  operator: Equals
                  value: ''
                - key: "{{ element.securityContext.seLinuxOptions || '' }}"
                  operator: NotEquals
                  value: ''
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    securityContext:
                      seLinuxOptions:
                        +(level): s0
          - list: "request.object.spec.initContainers[]"
            # A container-level seLinuxOptions REPLACES the pod-level struct wholesale
            # (kubelet DetermineEffectiveSecurityContext), so injecting `level` into a
            # container that has none would discard the pod's ENTIRE SELinux identity for
            # that container — measured 2026-08-29: a pod declaring
            # `{user: system_u, level: s9}` came back with the container on `{level: s0}`,
            # losing both the operator's level and its user. Inject only when the pod sets
            # no SELinux options at all, or when the container already overrides them.
            preconditions:
              any:
                - key: "{{ request.object.spec.securityContext.seLinuxOptions || '' }}"
                  operator: Equals
                  value: ''
                - key: "{{ element.securityContext.seLinuxOptions || '' }}"
                  operator: NotEquals
                  value: ''
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    securityContext:
                      seLinuxOptions:
                        +(level): s0
