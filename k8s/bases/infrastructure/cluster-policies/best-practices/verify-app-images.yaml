---
# All first-party images share one IVPOL because Kyverno v1.18.2 replaces the
# image-verification outcomes annotation rather than merging it when multiple
# fine-grained mutating webhooks run. Splitting the app/provider and KSail
# identities across timeout-bearing IVPOLs therefore makes the later webhook
# erase the earlier policy's result and fail-closes validation with
# "policy not evaluated". Keep the identities in separate attestors and CEL
# filters inside this one policy so each image class remains independently
# constrained while slow, cold signature lookups get the 30-second budget.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-app-images
  annotations:
    policies.kyverno.io/title: Verify First-Party Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires keyless cosign signatures from the matching devantler-tech
      release pipeline on first-party container images at Pod admission:
      each product's own release workflow for app images, the platform's
      dedicated compatibility-image publishers, each Crossplane provider's own
      package workflow, KSail's publish-ksail-analysis-runner.yaml workflow, the mail bootstrap publisher,
      the dedicated customer identity, Dex, kagent controller, automated mail sender and Longhorn
      migration publishers,
      and KSail's release workflow.
      Each class is verified only against its own identity;
      third-party images admit unverified.
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  # Keyless verification can need more than the default 10s while GHCR or the
  # Sigstore trust root is cold. Kyverno caps admission webhook timeouts at 30s.
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchImageReferences:
    # The expression variable for image references is `ref`. Keep KSail in a
    # separate matcher so the app expression cannot route it to publishapp.
    - expression: >-
        ref.startsWith('ghcr.io/devantler-tech/') &&
        !ref.startsWith('ghcr.io/devantler-tech/ksail')
    - glob: ghcr.io/devantler-tech/ksail*
  validationConfigurations:
    required: true
    verifyDigest: false
    mutateDigest: false
  attestors:
    - name: publishapp
      cosign:
        keyless:
          # A first-party repository's OWN release workflow on a release tag
          # (ADR 0017, #6265): the products sign with a composite action from
          # their own workflow, so the Fulcio subject names their repository.
          # The shared reusable publishers are no longer accepted at any
          # revision (#6266). The repository is one path segment (no `/`) that
          # starts with a letter or digit, so the `.github` repository is
          # excluded: it hosts reusable workflows, and a reusable workflow
          # carries its host's identity whoever calls it. The workflow file
          # sits directly in .github/workflows/, and the tag is the same strict
          # OCI-semver grammar as the ksail cd.yaml identity below (pre-releases
          # included, nothing after it). Every other first-party name matches,
          # `actions` included: a repository created under that name would be a
          # first-party repository like any other, and the deleted publisher's
          # commit-pinned identities stay refused.
          # This verifier binds a signature to the first-party organisation,
          # not to one product: the per-tenant manifest source binds each
          # product to its own repository, and its signed manifests pin the
          # image digests.
          # Keep this to exactly ONE identity
          # entry: the IVPOL engine verifies cosign v3 bundles through
          # sigstore-go, which rejects more than one identity per verification
          # ("unsupported: multiple identities are not supported at this
          # time" — sigstore/cosign pkg/cosign/verify.go), so a second entry
          # fail-closes EVERY image this attestor gates (observed live
          # 2026-07-04: wedding-app v1.14.1 denied at admission for hours,
          # wedging the whole merge queue). Express any additional accepted
          # form as an alternation inside this one regex.
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/[A-Za-z0-9][A-Za-z0-9_.-]*/\.github/workflows/[^/]+\.ya?ml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
    # The Kubescape storage compatibility image is produced inside this
    # repository rather than by a product release workflow: its publisher
    # checks out one immutable upstream storage commit, applies the reviewed
    # timeout patch, tests it, and signs only from main. Keep this identity in a
    # separate attestor and route only the exact storage repository to it; adding
    # the identity to publishapp would let this one-off workflow satisfy
    # verification for every ordinary first-party app image.
    - name: publishkubescapestorage
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kubescape-storage-hotfix\.yaml@refs/heads/main$
    # The two agent compatibility images follow the same reviewed, main-only
    # publisher contract as storage, but each workflow has a distinct Fulcio
    # identity. Keep each in its own attestor and exact-repository route so no
    # one-off workflow can satisfy another first-party image class.
    - name: publishkubescapenodeagent
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kubescape-node-agent-hotfix\.yaml@refs/heads/main$
    - name: publishcorootnodeagent
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-coroot-node-agent-hotfix\.yaml@refs/heads/main$
    # Only the two checkpoint compatibility repositories use this publisher.
    - name: publishcorootcheckpoint
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-coroot-checkpoint-hotfix\.yaml@refs/heads/main$
    - name: publishlonghornretirement
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-longhorn-v1-retirement\.yaml@refs/heads/main$
    - name: publishlonghornv2
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-longhorn-v2-only\.yaml@refs/heads/main$
    # The reports-controller repair is signed only by its dedicated publisher.
    - name: publishkyvernoreports
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kyverno-reports-hotfix\.yaml@refs/heads/main$
    # The patched migration runtime is signed only by its dedicated publisher.
    - name: publishkyvernomigrate
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kyverno-migration-runtime\.yaml@refs/heads/main$
    # The patched background controller is signed only by its dedicated publisher.
    - name: publishkyvernobackground
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kyverno-background-hotfix\.yaml@refs/heads/main$
    - name: publishksailanalysis
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/ksail/\.github/workflows/publish-ksail-analysis-runner\.yaml@refs/heads/main$
    # Only the serving and staged mail bootstrap repositories accept their
    # dedicated main publisher.
    - name: publishprivatemail
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-private-mail-bootstrap\.yaml@refs/heads/main$
    # The private scripted zone trial has its own repository-owned release
    # workflow. This attestor is used only for that exact image repository.
    - name: publishwarzone
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/world-at-ruin/\.github/workflows/server-cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
    # The retained original identity image has a business-site-owned main-only
    # publisher. Its signature cannot satisfy any other image class.
    - name: publishcustomeridentity
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/business-site/\.github/workflows/publish-identity\.yaml@refs/heads/main$
    # The source-built Dex distribution has its own main-only publisher. Its
    # signature cannot satisfy any other image class (platform#5811).
    - name: publishdexsecurity
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-dex-security-image\.yaml@refs/heads/main$
    - name: publishkagentcontroller
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-kagent-controller\.yaml@refs/heads/main$
    # The automated company sender has its own main-only publisher. Its
    # signature cannot satisfy any other image class (platform#5400).
    - name: publishmailsubmission
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/platform/\.github/workflows/publish-mail-submission\.yaml@refs/heads/main$
    # Crossplane provider packages (provider-upjet-*): the crossplane-contrib
    # reusable publish workflow they use cannot sign, so each provider repo
    # attaches the keyless signature in its own publish-provider-package.yml
    # follow-up job (provider-upjet-unifi#12), which is the workflow identity
    # Fulcio certifies. Their package-runtime Deployments run the package
    # image itself, so without this identity every devantler-tech provider
    # pod is denied at admission (observed on prod 2026-07-02:
    # provider-upjet-unifi stuck 0/1, the whole UniFi Crossplane migration
    # stalled). Kept as a SEPARATE attestor, verified only against
    # provider-upjet-* images in the validations below — folding it into
    # publishapp would let a provider-workflow signature satisfy
    # verification for ANY app image (identities within one attestor are
    # OR'd per image).
    # The ref is pinned to release tags: publish-provider-package.yml rejects
    # any non-tag ref before it checks anything out, so a v* tag is the sole
    # legitimate signing ref. Pinning it rejects a package signed from an
    # arbitrary branch, which an unconstrained ref accepts.
    # The tag grammar mirrors the publisher's `scripts/release-version.sh` OCI-semver
    # grammar, spelled out here rather than deferred to it: this verifier is the
    # independent half of that pair, so it must not inherit its boundary from the
    # repository it verifies.
    # A trailing `.+` after the version would accept refs/tags/v1latest and
    # refs/tags/v1.0.0/../evil, which are tags only in shape.
    # DELIBERATE DIFFERENCE from the publisher, pinned by the inventory test: that script also
    # caps the tag at 128 characters (the OCI tag-length limit); this expression does not.
    # RE2 has no lookahead, so a joint length bound across the version components cannot be
    # expressed without bounding each part separately, and a bound set too tight would REJECT a
    # legitimate release — breaking admission of a real image, which is strictly worse than
    # admitting an identity that cannot exist. An over-length tag is not a valid OCI reference,
    # so no signature can carry one.
    - name: publishprovider
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/provider-upjet-[a-z0-9-]+/\.github/workflows/publish-provider-package\.yml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
    # ksail images are signed by ksail's OWN release pipeline (cd.yaml). The
    # ref is pinned to the release-tag GRAMMAR, not merely to `v*`: cd.yaml
    # signs on any `v*` tag push and checks nothing about the tag itself, so a
    # `v.+` ref clause would accept refs/tags/vanything and refs/tags/v/../evil,
    # which are tags in shape only. Same OCI-semver grammar and same DELIBERATE
    # no-length-cap difference as the provider identity above; kept
    # byte-identical to the Talos ImageVerificationConfig rule by the inventory
    # test. The publisher's own check is tracked at devantler-tech/ksail#6895.
    - name: ksailcd
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/devantler-tech/ksail/\.github/workflows/cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$
  validations:
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('ghcr.io/devantler-tech/') &&
          !image.startsWith('ghcr.io/devantler-tech/ksail') &&
          !image.startsWith('ghcr.io/devantler-tech/provider-upjet-') &&
          image != 'ghcr.io/devantler-tech/world-at-ruin/zone' &&
          !image.startsWith('ghcr.io/devantler-tech/world-at-ruin/zone:') &&
          !image.startsWith('ghcr.io/devantler-tech/world-at-ruin/zone@') &&
          image != 'ghcr.io/devantler-tech/business-site-identity' &&
          !image.startsWith('ghcr.io/devantler-tech/business-site-identity:') &&
          !image.startsWith('ghcr.io/devantler-tech/business-site-identity@') &&
          image != 'ghcr.io/devantler-tech/platform-dex' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-dex:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-dex@') &&
          image != 'ghcr.io/devantler-tech/platform-kagent-controller' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kagent-controller:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kagent-controller@') &&
          image != 'ghcr.io/devantler-tech/platform-longhorn-instance-manager' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-longhorn-instance-manager:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-longhorn-instance-manager@') &&
          image != 'ghcr.io/devantler-tech/platform-longhorn-manager' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-longhorn-manager:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-longhorn-manager@') &&
          image != 'ghcr.io/devantler-tech/platform-kubescape-storage' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage@') &&
          image != 'ghcr.io/devantler-tech/platform-kubescape-node-agent' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-node-agent:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kubescape-node-agent@') &&
          image != 'ghcr.io/devantler-tech/platform-coroot-node-agent' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot-node-agent:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot-node-agent@') &&
          image != 'ghcr.io/devantler-tech/platform-coroot' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot@') &&
          image != 'ghcr.io/devantler-tech/platform-coroot-cluster-agent' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot-cluster-agent:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-coroot-cluster-agent@') &&
          image != 'ghcr.io/devantler-tech/platform-kyverno-reports' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-reports:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-reports@') &&
          image != 'ghcr.io/devantler-tech/platform-kyverno-migrate' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-migrate:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-migrate@') &&
          image != 'ghcr.io/devantler-tech/platform-kyverno-background' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-background:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-kyverno-background@') &&
          image != 'ghcr.io/devantler-tech/platform-private-mail-bootstrap' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap@') &&
          image != 'ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate@') &&
          image != 'ghcr.io/devantler-tech/platform-mail-submission' &&
          !image.startsWith('ghcr.io/devantler-tech/platform-mail-submission:') &&
          !image.startsWith('ghcr.io/devantler-tech/platform-mail-submission@') &&
          image != 'ghcr.io/devantler-tech/ksail-analysis-runner' &&
          !image.startsWith('ghcr.io/devantler-tech/ksail-analysis-runner:') &&
          !image.startsWith('ghcr.io/devantler-tech/ksail-analysis-runner@'))
        .map(image, verifyImageSignatures(image, [attestors.publishapp]))
        .all(e, e > 0)
      message: >-
        first-party app image is not signed by its first-party repository's
        own release workflow on a release tag (keyless cosign)
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-private-mail-bootstrap' ||
          image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap@') ||
          image == 'ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate' ||
          image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-private-mail-bootstrap-candidate@'))
        .map(image, verifyImageSignatures(image, [attestors.publishprivatemail]))
        .all(e, e > 0)
      message: >-
        mail bootstrap image is not signed by its main-only publisher;
        other first-party images retain their existing signer.
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/business-site-identity' ||
          image.startsWith('ghcr.io/devantler-tech/business-site-identity:') ||
          image.startsWith('ghcr.io/devantler-tech/business-site-identity@'))
        .map(image, verifyImageSignatures(image, [attestors.publishcustomeridentity]))
        .all(e, e > 0)
      message: >-
        customer identity image is not signed by its main-only original
        publisher; other first-party images retain their existing signer.
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-dex' ||
          image.startsWith('ghcr.io/devantler-tech/platform-dex:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-dex@'))
        .map(image, verifyImageSignatures(image, [attestors.publishdexsecurity]))
        .all(e, e > 0)
      message: >-
        Dex image is not signed by the platform repository's dedicated
        main-branch publisher (keyless cosign)
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-kagent-controller' ||
          image.startsWith('ghcr.io/devantler-tech/platform-kagent-controller:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-kagent-controller@'))
        .map(image, verifyImageSignatures(image, [attestors.publishkagentcontroller]))
        .all(e, e > 0)
      message: >-
        kagent controller image requires its dedicated main-branch signature
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-mail-submission' ||
          image.startsWith('ghcr.io/devantler-tech/platform-mail-submission:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-mail-submission@'))
        .map(image, verifyImageSignatures(image, [attestors.publishmailsubmission]))
        .all(e, e > 0)
      message: >-
        automated mail sender image is not signed by its main-only publisher;
        other first-party images retain their existing signer.
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/world-at-ruin/zone' ||
          image.startsWith('ghcr.io/devantler-tech/world-at-ruin/zone:') ||
          image.startsWith('ghcr.io/devantler-tech/world-at-ruin/zone@'))
        .map(image, verifyImageSignatures(image, [attestors.publishwarzone]))
        .all(e, e > 0)
      message: >-
        World at Ruin zone image is not signed by its server-cd stable release
        workflow; other first-party images retain their existing signer.
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-kubescape-storage' ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-storage@'))
        .map(image, verifyImageSignatures(image, [attestors.publishkubescapestorage]))
        .all(e, e > 0)
      message: >-
        Kubescape storage compatibility image is not signed by the platform
        repository's dedicated main-branch publisher (keyless cosign)
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-kubescape-node-agent' ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-node-agent:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-kubescape-node-agent@'))
        .map(image, verifyImageSignatures(image, [attestors.publishkubescapenodeagent]))
        .all(e, e > 0)
      message: >-
        Kubescape node-agent compatibility image is not signed by the platform
        repository's dedicated main-branch publisher (keyless cosign)
    - expression: |-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image,
          image == 'ghcr.io/devantler-tech/platform-coroot-node-agent' ||
          image.startsWith('ghcr.io/devantler-tech/platform-coroot-node-agent:') ||
          image.startsWith('ghcr.io/devantler-tech/platform-coroot-node-agent@'))
