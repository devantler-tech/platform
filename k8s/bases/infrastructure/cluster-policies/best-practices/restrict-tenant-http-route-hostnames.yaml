# Tenant GitOps service accounts may create HTTPRoutes in their own namespaces,
# but they must not be able to claim arbitrary hosts on the shared Gateway.
# Keep this allow-list in platform config so a compromised tenant artifact cannot
# intercept another platform hostname under the wildcard Gateway certificate.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-tenant-http-route-hostnames
  annotations:
    policies.kyverno.io/title: Restrict Tenant HTTPRoute Hostnames
    policies.kyverno.io/category: Multi-Tenancy, Gateway API, Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Requires tenant-managed HTTPRoutes to declare hostnames and confines each
      tenant namespace to its approved public hostnames. This prevents tenant
      OCI artifacts from attaching routes for other platform services to the
      shared hostname-less Gateway listener.
spec:
  validationFailureAction: Enforce
  # Uses admission request context, so it cannot run as a background scan.
  background: false
  rules:
    - name: restrict-wedding-app-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - wedding-app
      validate:
        message: "wedding-app HTTPRoutes may only use approved wedding-app hostnames."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: Equals
                value: []
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - wedding.platform.devantler.tech
                  - wedding.platform.lan
    - name: restrict-ascoachingogvaner-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - ascoachingogvaner
      validate:
        message: "ascoachingogvaner HTTPRoutes may only use approved ascoachingogvaner hostnames."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: Equals
                value: []
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - ascoachingogvaner.dk
                  - www.ascoachingogvaner.dk
                  - ascoachingogvaner.platform.lan
    - name: restrict-doggy-countdown-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaces:
                - doggy-countdown
      validate:
        message: "doggy-countdown HTTPRoutes may only use approved doggy-countdown hostnames."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: Equals
                value: []
              - key: "{{ request.object.spec.hostnames || `[]` }}"
                operator: AnyNotIn
                value:
                  - simba.platform.devantler.tech
    # Default-deny for any OTHER tenant namespace.
    #
    # The rules above are an allow-list keyed by namespace NAME, which is
    # fail-OPEN: a tenant with no rule of its own is not restricted at all, and
    # nothing signals that. doggy-countdown sat in exactly that state — an
    # active tenant, bound to `tenant-edit` (so able to create HTTPRoutes) and
    # matched by no rule, therefore free to claim any hostname on the shared
    # wildcard listener. Adding its rule fixes that one tenant; this rule fixes
    # the CLASS, so onboarding the next tenant cannot silently reopen it.
    #
    # Scope: `app.kubernetes.io/managed-by: ksail` is the tenant-namespace label
    # (the same selector restrict-tenant-issuer-refs and
    # restrict-tenant-secret-stores use). It is carried by tenant namespaces
    # only — the platform's own app namespaces (actual-budget, homepage,
    # whoami, backstage, headlamp …) do not have it, so their platform-authored
    # HTTPRoutes are untouched.
    #
    # Onboarding a tenant that serves HTTP now REQUIRES adding a rule above with
    # its approved hostnames. That is the intended cost: the failure is a loud,
    # immediate admission denial naming the fix, not a silent gap.
    - name: restrict-unlisted-tenant-hostnames
      match:
        any:
          - resources:
              kinds:
                - HTTPRoute
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: ksail
      exclude:
        any:
          - resources:
              namespaces:
                - wedding-app
                - ascoachingogvaner
                - doggy-countdown
      validate:
        message: >-
          This tenant namespace has no approved hostname allow-list, so its
          HTTPRoutes are denied by default. Add a rule for it to
          restrict-tenant-http-route-hostnames naming its approved hostnames.
        deny: {}
