# Validates that pods in non-infrastructure namespaces comply with
# Pod Security Standards (restricted profile). Works in tandem with
# the add-security-context mutation policy:
# - Mutation injects defaults for empty fields (conditional anchors)
# - This policy blocks explicitly insecure overrides at admission
#
# DELIBERATE ASYMMETRY — validated at the controller, mutated only at the pod
# (#3160). This policy judges the pod templates of Deployment,
# StatefulSet, DaemonSet, Job, CronJob, ReplicaSet and ReplicationController
# as well as Pods, while
# add-security-context matches Pod with CREATE only and generates no autogen
# rules (except its opt-in controller counterparts). So a controller template
# is VALIDATED as stored but NEVER MUTATED: the mutation fills empty fields in
# the pods the controller creates, not in the template this policy checks.
# The consequence for authors: a manifest in this repository must declare
# every field validated here explicitly in its pod template (including
# container-level runAsNonRoot, see umami's CronJob). An update is judged
# like a create: a live object that is equally non-compliant does not
# grandfather the change, so a template that relies on the mutation is refused
# when Flux applies it (#3160).
# Why keep the split rather than close it:
# - Controllers stay matched here so a non-compliant template is refused when
#   Flux applies it, loudly, on the Kustomization. Validating only Pods would
#   admit the controller and fail its pods inside the ReplicaSet/Job, where
#   nothing reports the denial to the GitOps pipeline.
# - Autogen stays OFF on the mutation because the mutate rules are CREATE-only
#   for pod-spec immutability (see add-security-context), and mutating a stored
#   template changes its hash and rolls the workload at whatever moment its
#   owner next writes it. That is only done per namespace, behind the
#   baseline-context-controllers opt-in.
#
# Addresses kubescape controls: C-0013, C-0016, C-0055, C-0057
#
# NOTE: readOnlyRootFilesystem is NOT validated because several charts
# intentionally set it to false (homepage and actual-budget)
# and PSS restricted does not require it. It is enforced via HelmRelease
# values where possible and the mutation policy adds it as a default.
#
# Exclusions are namespace-scoped only. Local-path-provisioner helper pods run
# in the provisioner's own namespace — `local-path-storage` under kind, or
# `kube-system` under k3s — and both are already excluded below, so they need
# no name-based entry. A name-only exclusion would be spoofable by any pod that
# adopts the same name in any namespace.
#
# The controller kinds are matched directly rather than through Kyverno's
# generated pod-controller rules, which at Kyverno 1.19 do not cover
# ReplicationController. `podSpec` below picks the pod spec out of each kind.

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-pod-security
  annotations:
    policies.kyverno.io/title: Validate Pod Security (PSS Restricted)
    policies.kyverno.io/category: Pod Security, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Validates that pods and the pod templates of workload controllers
      comply with Pod Security Standards restricted profile. Blocks
      explicitly insecure overrides that the mutation policy's conditional
      anchors would skip.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: not-infrastructure-namespace
      expression: >-
        !(object.metadata.?namespace.orValue('') in [
          'kube-system', 'kube-public', 'kube-node-lease', 'flux-system',
          'longhorn-system', 'local-path-storage', 'kubescape', 'kubevirt',
          'cdi', 'observability', 'velero', 'chaos-mesh'])
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    # Every container the pod declares: regular, init and ephemeral.
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: allowedSeccompTypes
      expression: "['RuntimeDefault', 'Localhost']"
  validations:
    # The drop list must name ALL and nothing else. An empty list drops
    # nothing, so it keeps the runtime's default capabilities (#5149).
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          c.?securityContext.?privileged.orValue(false) == false &&
          c.?securityContext.?runAsNonRoot.orValue(false) == true &&
          c.?securityContext.?capabilities.?drop.hasValue() &&
          c.securityContext.capabilities.drop.size() > 0 &&
          c.securityContext.capabilities.drop.all(d, d == 'ALL'))
      message: >-
        All containers must set allowPrivilegeEscalation=false,
        privileged=false (or unset), runAsNonRoot=true, and drop
        ALL capabilities.
    - expression: >-
        variables.podSpec.?securityContext.?seccompProfile.?type.orValue('')
        in variables.allowedSeccompTypes
      message: "Pod must use seccomp profile RuntimeDefault or Localhost."
    - expression: >-
        variables.containers.all(c,
          !c.?securityContext.?seccompProfile.hasValue() ||
          c.securityContext.seccompProfile.?type.orValue('')
          in variables.allowedSeccompTypes)
      message: >-
        Container seccomp profile must be RuntimeDefault or Localhost
        when set. Containers inherit the pod-level seccomp profile
        unless explicitly overridden.
