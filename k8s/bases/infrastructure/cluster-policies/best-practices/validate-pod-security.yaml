# Validates that pods in non-infrastructure namespaces comply with
# Pod Security Standards (restricted profile). Works in tandem with
# the add-security-context mutation policy:
# - Mutation injects defaults for empty fields (conditional anchors)
# - This policy blocks explicitly insecure overrides at admission
#
# DELIBERATE ASYMMETRY — validated at the controller, mutated only at the pod
# (#3160). Kyverno autogenerates this policy's rules for Deployment,
# StatefulSet, DaemonSet, Job and CronJob pod templates, while
# add-security-context matches Pod with CREATE only and generates no autogen
# rules (except its opt-in controller counterparts). So a controller template
# is VALIDATED as stored but NEVER MUTATED: the mutation fills empty fields in
# the pods the controller creates, not in the template this policy checks.
# The consequence for authors: a manifest in this repository must declare
# every field validated here explicitly in its pod template (including
# container-level runAsNonRoot, see umami's CronJob). Relying on the mutation
# works only while Kyverno's default allowExistingViolations grandfathers a
# live object that is equally non-compliant, and it wedges the Kustomization
# the moment the live object becomes compliant (the 2026-08-15 merge-queue
# wedge in #3160).
# Why keep the split rather than close it:
# - Autogen stays ON here so a non-compliant template is refused when Flux
#   applies it, loudly, on the Kustomization. Validating only Pods would admit
#   the controller and fail its pods inside the ReplicaSet/Job, where nothing
#   reports the denial to the GitOps pipeline.
# - Autogen stays OFF on the mutation because the mutate rules are CREATE-only
#   for pod-spec immutability (see add-security-context), and mutating a stored
#   template changes its hash and rolls the workload at whatever moment its
#   owner next writes it. That is only done per namespace, behind the
#   baseline-context-controllers opt-in.
#
# Addresses kubescape controls: C-0013, C-0016, C-0055, C-0057
#
# NOTE: readOnlyRootFilesystem is NOT validated because several charts
# intentionally set it to false (homepage and actual-budget)
# and PSS restricted does not require it. It is enforced via HelmRelease
# values where possible and the mutation policy adds it as a default.
#
# Exclusions are namespace-scoped only. Local-path-provisioner helper pods run
# in the provisioner's own namespace — `local-path-storage` under kind, or
# `kube-system` under k3s — and both are already excluded below, so they need
# no name-based entry. A name-only exclusion would be spoofable by any pod that
# adopts the same name in any namespace.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-pod-security
  annotations:
    policies.kyverno.io/title: Validate Pod Security (PSS Restricted)
    policies.kyverno.io/category: Pod Security, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.13.0
    policies.kyverno.io/description: >-
      Validates that pods comply with Pod Security Standards restricted
      profile. Blocks explicitly insecure overrides that the mutation
      policy's conditional anchors would skip.
spec:
  background: true
  rules:
    - name: validate-container-security
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
      validate:
        failureAction: Enforce
        message: >-
          All containers must set allowPrivilegeEscalation=false,
          privileged=false (or unset), runAsNonRoot=true, and drop
          ALL capabilities.
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
    - name: require-seccomp-profile
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
      validate:
        failureAction: Enforce
        message: "Pod must use seccomp profile RuntimeDefault or Localhost."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: "RuntimeDefault | Localhost"
    - name: deny-container-seccomp-unconfined
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - longhorn-system
                - local-path-storage
                - kubescape
                - kubevirt
                - cdi
                - observability
                - velero
                - chaos-mesh
      validate:
        failureAction: Enforce
        message: >-
          Container seccomp profile must be RuntimeDefault or Localhost
          when set. Containers inherit the pod-level seccomp profile
          unless explicitly overridden.
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
            =(initContainers):
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
            =(ephemeralContainers):
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
