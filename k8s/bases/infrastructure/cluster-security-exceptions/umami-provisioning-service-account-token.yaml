---
# The scheduled and bootstrap provisioners coordinate through one named Lease.
# Their Role grants only get/update on that Lease, but the Kubernetes client
# still needs the pod's service-account token. Keep C-0034 scoped to these two
# batch workloads so every other workload in the umami namespace remains visible.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: umami-provisioning-service-account-token
spec:
  reason: >-
    The Umami scheduled and bootstrap provisioners need their service-account
    token to coordinate through the single umami-provision-tenants Lease. Their
    namespaced Role permits only get and update on that named Lease.
  posture:
    - controlID: C-0034
      action: ignore
  match:
    resources:
      - apiGroup: batch
        kind: CronJob
        name: ^umami-provision-tenants$
      - apiGroup: batch
        kind: Job
        name: ^umami-provision-tenants-bootstrap$
