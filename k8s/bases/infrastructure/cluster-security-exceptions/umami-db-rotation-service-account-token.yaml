---
# The weekly Umami blue/green rotation CronJob (openbao/umami-db-rotation, #4107)
# logs in to OpenBao with its pod's service-account token: the token IS the `jwt`
# for `auth/kubernetes/login`. Its OpenBao role binds only this ServiceAccount
# and grants only the two colours' static-role metadata reads and rotate-role
# calls, and the ServiceAccount has no Kubernetes RBAC at all. Keep C-0034 scoped
# to this one CronJob so every other workload in the openbao namespace remains
# visible.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: umami-db-rotation-service-account-token
spec:
  reason: >-
    The Umami database-login rotation CronJob needs its service-account token
    to authenticate to OpenBao's Kubernetes auth method. Its OpenBao role
    permits only reading the two login colours' rotation metadata and rotating
    them, and the ServiceAccount holds no Kubernetes RBAC.
  posture:
    - controlID: C-0034
      action: ignore
  match:
    resources:
      - apiGroup: batch
        kind: CronJob
        name: ^umami-db-rotation$
