---
# Exempt image signature verification cluster-wide (kubescape C-0237).
# First-party images (ghcr.io/devantler-tech/*) ARE cosign-signed and verified
# — at Pod admission by Kyverno's verify-app-images ImageValidatingPolicy,
# at the node pull layer by Talos ImageVerificationConfig, and on OCI manifest
# artifacts by Flux's cosign verification. Third-party chart images
# (Cilium, Longhorn, Coroot, registry.k8s.io, …) are not all signed or verified
# at admission, so this cluster-wide control —
# which scans every workload image ref — remains exempted.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: image-verification
  annotations:
    # Cluster-wide on purpose: C-0237 scans every workload image reference, and
    # unsigned third-party chart images are spread across every namespace. The
    # narrower posture is tracked as first-party pull enforcement (#2856), not
    # as a scope on this exception.
    platform.devantler.tech/cluster-wide: declared
spec:
  reason: >-
    First-party images (ghcr.io/devantler-tech/*) are cosign-signed and
    verified at Pod admission by Kyverno's verify-app-images policy, at the
    Talos containerd pull layer (ImageVerificationConfig), and at the Flux
    OCI source layer. Third-party chart images are not all signed or verified
    at admission, so this cluster-wide control still fails on unsigned workload images.
  posture:
    - controlID: C-0237
      action: ignore
