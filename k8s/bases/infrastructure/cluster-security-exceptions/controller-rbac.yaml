---
# Exempt controllers and middleware that legitimately need broad RBAC.
# Infrastructure controllers (Flux, Kyverno, cert-manager, CNPG, Velero,
# KEDA, Coroot, KubeVirt, CDI, Longhorn) and platform middleware
# (headlamp cluster dashboard, homepage service discovery, fleetdm device
# management, dex identity, oauth2-proxy auth, opencost cost monitoring,
# reloader config watcher) all require cluster-wide read or read/write
# access to function correctly.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: controller-rbac
spec:
  reason: >-
    Infrastructure controllers and platform middleware require broad RBAC
    to manage their target resources cluster-wide. This includes GitOps
    (Flux), policy engines (Kyverno), certificate managers (cert-manager),
    database operators (CNPG), backup controllers (Velero), autoscalers
    (KEDA), observability (Coroot/opencost), virtualisation (KubeVirt,
    CDI), storage (Longhorn), cluster dashboards (headlamp), service
    discovery (homepage), device management (fleetdm), identity (dex),
    auth proxies (oauth2-proxy), and config watchers (reloader).
  posture:
    - controlID: C-0053
      action: ignore
    - controlID: C-0037
      action: ignore
    - controlID: C-0031
      action: ignore
    - controlID: C-0063
      action: ignore
    - controlID: C-0035
      action: ignore
    # NOTE: four RBAC-object controls are handled by explicit kind+name
    # `match.resources` CRs rather than by this CR's namespaceSelector, because
    # Kubescape anchors their findings on the Role/ClusterRole/binding object
    # and a cluster-scoped binding carries no namespace to select on:
    #   - C-0187 (wildcard RBAC, CIS-5.1.3) -> wildcard-rbac.yaml
    #   - C-0015 (list Kubernetes secrets)  -> secret-reader-rbac.yaml
    #   - C-0007 (delete-capable roles)     -> delete-rbac.yaml
    #   - C-0002 (exec into container)      -> exec-into-container-rbac.yaml
    #
    # The six controls listed in THIS CR do not all share that limitation, and
    # three of them are load-bearing on the gating scan. Measured 2026-08-15 by
    # running the CI scan twice, identical but for this one policy (ksail
    # 7.178.20, `--framework nsa,mitre`):
    #
    #   C-0053   10 findings with this CR, 23 without  -> suppresses 13
    #   C-0037    0 findings with this CR,  3 without  -> suppresses 3
    #   C-0031    0 findings with this CR,  1 without  -> suppresses 1
    #   C-0063 / C-0035 / C-0188:  0 findings in BOTH arms. These are KEPT, and the
    #     null result is not evidence against them: they sit outside NSA-CISA and
    #     MITRE, so this scan never evaluates them. Proof that "no change" does not
    #     mean "no effect" here — C-0037 also has a zero baseline, yet dropping it
    #     moves it 0 -> 3, while dropping these three moves nothing at all. That
    #     difference is the signature of a control the gate cannot see, not of a
    #     redundant exception. They do govern real findings on the surfaces that do
    #     evaluate them, so removing them on this scan's silence would strip a
    #     justified exception. Re-decide only if they come under a gated framework.
    #
    # So do NOT migrate these six to kind+name CRs on the assumption that a
    # namespaceSelector cannot reach them: dropping this CR adds 17 findings to
    # the posture gate. C-0053's residual 10 are all tenant-namespace
    # ServiceAccounts, none of them in the selector below, so they are correctly
    # left flagged rather than evidence that this CR is incomplete.
    #
    # To re-verify:
    #   go run ./scripts/generate-kubescape-exceptions -o /tmp/base.json
    #   jq '[.[] | select(.name != "controller-rbac")]' /tmp/base.json >/tmp/b.json
    #   ksail workload scan --framework nsa,mitre --exceptions /tmp/base.json \
    #     --compliance-threshold 0 --format sarif -o /tmp/arm-with.sarif
    #   ksail workload scan --framework nsa,mitre --exceptions /tmp/b.json \
    #     --compliance-threshold 0 --format sarif -o /tmp/arm-without.sarif
    #   # then compare per control:
    #   jq -r '[.runs[].results[].ruleId] | group_by(.)[] | "\(length)\t\(.[0])"' /tmp/arm-*.sarif
    #
    # Read the effect off THIS scan only. The kubescape-operator's stored scan
    # resources apply no exceptions at all — their appliedIgnoreRules is empty —
    # so a count taken there says nothing about whether an exception works
    # (#2823). Headlamp is fixed at the root (SA scoped to read-only
    # cluster-reader); Flux and Velero are exempted by-design in
    # wildcard-rbac.yaml.
    - controlID: C-0188
      action: ignore
  match:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - flux-system
            - kyverno
            - cert-manager
            - cnpg-system
            - velero
            - keda
            - observability
            - kubescape
            - vertical-pod-autoscaler
            - kubevirt
            - cdi
            - longhorn-system
            - external-dns
            - oauth2-proxy
            - headlamp
            - kubelet-serving-cert-approver
            - opencost
            - reloader
            - dex
            - fleetdm
            - homepage
