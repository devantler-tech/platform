---
# The part of the "add-security-context" mutation exemption that cannot yet be
# scoped to the namespaces that mutation actually runs in.
#
# pod-security-mutations.yaml narrows C-0013, C-0016 and C-0055 to the mutated set,
# because every workload that narrowing exposes is either covered by another
# exception or already passes. C-0211 does not have that property, so it stays
# cluster-wide here until its residual population has a fix behind it.
#
# C-0013 LEFT THIS FILE on 2026-09-09 (#3223). It was held here by one measured gap:
# tofu-controller, the sixth flux-system workload, which had no runAsGroup at
# container or pod level. That workload was retired in #3480 (closed 2026-09-08), so
# the gap closed by deletion rather than by setting a uid on a controller already on
# its way out, and flux-system's five remaining workloads pass C-0013 genuinely —
# verified live per workload on the subStatus discriminator this file documents. The
# narrowing and that evidence are recorded in pod-security-mutations.yaml.
#
# fail-open-warning:BEGIN — every spec.posture controlID must be named below.
# 🔴 DO NOT RE-VERIFY ANY CONTROL IN THIS FILE ON workloadconfigurationscans ALONE —
# THAT SURFACE FAILS OPEN FOR EVERY CONTROL THIS EXCEPTION SUPPRESSES. The hazard is a
# property of the exception rather than of one control, so anything added under
# spec.posture below inherits it. Kubescape writes status: passed together with
# subStatus: "w/exceptions" and a populated appliedIgnoreRules on each suppressed
# control, so reading .spec.controls[<id>].status.status reports a gate as clearable
# when nothing behind it has been fixed. Scan status measured 2026-09-02 on the one
# control listed below:
#
#   * C-0211 — 35 of 35 scanned workloads read passed with subStatus "w/exceptions",
#     each carrying appliedIgnoreRules: [pod-security-mutations-unscoped/C-0211]. Against
#     the stored specs (measured 2026-09-25, below) every workload in the population
#     passes the two universal gaps while twelve still miss privilege-adjacent fields,
#     and status alone cannot tell those apart: it reads "passed" on all of them.
#
# The discriminator is subStatus plus a populated appliedIgnoreRules, never status,
# and it does discriminate: on one such workload the same scan carries 53 controls
# passed with an EMPTY subStatus and 3 failed with appliedIgnoreRules null, so
# "w/exceptions" is a real signal and not a constant. `fixPath` is NOT a discriminator
# either: it is a static hint from the rule definition and is populated identically on
# workloads that genuinely pass. Verify against the live stored workload spec, which is
# independent of both the scanner and this exception.
# fail-open-warning:END
#
# C-0211 — CIS-5.7.3, and it is a twelve-rule control rather than the three-field
# check its name suggests. The rules this exception suppresses include
# non-root-containers, set-fsgroup-value, set-fsgroupchangepolicy-value and
# set-seLinuxOptions, alongside rules that C-0016 and C-0055 also carry. No other
# exception covers it in the excluded namespaces: neither infrastructure-privileged
# nor the name-scoped kubescape-privileged lists C-0211.
#
# Its population is every workload in the four excluded namespaces that are actually
# scanned — flux-system, longhorn-system, observability and velero — 38 of them:
# 16 Deployments, 6 DaemonSets, 13 CronJobs and 3 StatefulSets. (CronJobs are scanned
# and carry a verdict; Jobs are not, so the ephemeral backup and heartbeat Jobs in
# these namespaces are out of scope.) Per namespace: flux-system 5, longhorn-system
# 10, observability 21, velero 2. Measured 2026-09-25 against the live PROD stored
# specs, which is the surface Kubescape reads. The population changes as workloads are
# added and removed, so re-count it rather than adjusting an old total.
#
# All 38 pass the two universal gaps. Each carries a pod-level
# `securityContext.fsGroupChangePolicy` (read under `jobTemplate` for the CronJobs),
# and an effective `seLinuxOptions` object reaches every container, init containers
# included — "effective" meaning the container's own seLinuxOptions where it sets
# them and the pod-level object otherwise. The test is object PRESENCE, not a
# populated `level`: the objects in this population are empty (`seLinuxOptions: {}`),
# so a `level`-based test would report every workload as failing.
#
# C-0211 still cannot be narrowed, because the two universal gaps were never all of
# it. Twelve of the 38 still miss an effective `runAsGroup` or `runAsNonRoot` (pod
# level, or set on every container): in longhorn-system the four CSI sidecars, the
# driver deployer and the longhorn-manager, engine-image and longhorn-csi-plugin
# DaemonSets; in observability coroot-operator, coroot-node-agent and
# audit-log-forwarder-agent; and velero/node-agent. flux-system passes both at
# container level. These are privilege-adjacent fields on workloads
# that run with elevated privileges by design, which is why the namespaces are
# excluded from add-security-context in the first place. Narrowing C-0211 now would
# surface them with no fix behind them — lowering the score to absorb a gap rather
# than closing it — so it stays cluster-wide.
#
# The per-namespace opt-in labels do not change this. add-baseline-context-optin-*
# mutates pods at admission and leaves the stored spec untouched. The families that
# reach the stored spec, add-baseline-context-optin-controllers* and
# add-baseline-context-optin-cronjobs*, are gated on the `baseline-context-controllers`
# label, which is deliberately applied in NO namespace (tests/add-baseline-context pins
# that empty inventory). The universal gaps closed through template-level changes
# instead. These counts are prod-only and the local overlay opts in to a different
# namespace set, so re-measure rather than inheriting them.
#
# node-agent and storage are NOT in that population. Both live in `kubescape`, whose
# workloads the operator's own excludeNamespaces drops from scanning: neither has a
# workloadconfigurationscan object at all, so there is no verdict to un-suppress and
# narrowing cannot change their result — unscanned is not the same as passing. Do not
# read the 384 scan objects sitting in that namespace as evidence it is scanned; they
# are the cluster-scoped results (ClusterRoleBindings, ServiceAccounts, node and
# control-plane info) that Kubescape stores there, and none of them is a workload.
# The name is shared but the workload is not: velero/node-agent is a different
# DaemonSet, and it IS in the population.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: pod-security-mutations-unscoped
  annotations:
    # Cluster-wide, and knowingly wider than its own rationale: in the twelve
    # namespaces "add-security-context" excludes, nothing injects these fields.
    # C-0211 is retained rather than narrowed on an unmeasured guess — sized
    # 2026-09-25, with the narrowing tracked on #3522. C-0013 was narrowed
    # out on 2026-09-09 (#3223) once #3480 removed the one workload that
    # failed it.
    platform.devantler.tech/cluster-wide: declared
spec:
  reason: >-
    Kyverno mutate policy "add-security-context" injects runAsNonRoot, runAsUser,
    runAsGroup and fsGroupChangePolicy at pod admission. The Deployment spec does
    not contain them and Kubescape scans the stored spec, not the live pod. This
    control remains cluster-wide because narrowing it is blocked on evidence rather
    than on expressiveness: of the 38 scanned workloads the mutation does not reach,
    12 still miss an effective runAsGroup or runAsNonRoot in their stored spec
    (measured 2026-09-25 against live PROD); narrowing is tracked on #3522.
  posture:
    - controlID: C-0211
      action: ignore
