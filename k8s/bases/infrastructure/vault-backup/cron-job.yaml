# Daily OpenBao raft snapshot to the vault-snapshots PVC (newest 14 kept),
# plus a health/seal-status check. Until 2026-06-10 this job ONLY did the
# health check despite its name — when the vault was wiped that day there
# was no snapshot to restore from. A raft snapshot pairs with the
# openbao-unseal Secret: restore via
#   bao operator raft snapshot restore <file>
# then unseal with the key that was current when the snapshot was taken
# (docs/dr/openbao-raft-ha-migration.md). The vault-config Job performs
# this restore automatically when it finds an uninitialized cluster, a
# surviving openbao-unseal Secret AND a snapshot on the PVC (docs/dr/
# openbao.md).
# Authenticates via Kubernetes auth (vault-snapshot role).
#
# Pod layout: the snapshot runs as an initContainer and the off-cluster
# mirror as the main container, so the upload only ever runs after a NEW
# snapshot succeeded (containers in one pod run in parallel; init -> main
# gives strict ordering). The mirror copies the PVC's snapshots to the
# S3 backup target (Cloudflare R2 in prod, in-cluster MinIO locally) —
# Velero's file-system backup CANNOT carry this PVC off-cluster, because
# FSB only backs up volumes mounted by RUNNING pods and nothing mounts
# this PVC outside the CronJob's own brief run. Without the mirror, a
# full-cluster loss would also lose every raft snapshot.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: openbao
  annotations:
    checkov.io/skip1: "CKV_K8S_38=the snapshot container reads its SA JWT to log in via OpenBao Kubernetes auth"
    # Only the snapshot container runs UID 100, and that IS the openbao image's
    # baked identity: the image carries `openbao:x:100:1000` in its own
    # /etc/passwd (the same pinned digest vault-config reads), which
    # runAsUser/runAsGroup restate. The pod default is the high, unprivileged
    # 65532, so the mirror container — `minio/mc`, which bakes no identity of
    # its own and mounts /snapshots readOnly — takes that rather than a UID
    # chosen for openbao.
    #
    # The mirror still reads the snapshot through supplementary group 1000:
    # fsGroup adds that group to every container, while only the openbao
    # snapshot container selects its image-defined primary GID 1000. The
    # snapshot script chmods the file 0640 after writing it. Access therefore
    # does not depend on a low pod-wide primary GID or the volume's setgid bit.
    #
    # UID 100 is not remapped. The openbao namespace carries no
    # `pod-security.devantler.tech/user-namespaces: enabled` label, so the
    # add-user-namespaces rule does not match and hostUsers stays on; 100 is a
    # host UID, now scoped to the single container whose image defines it.
    checkov.io/skip2: "CKV_K8S_40=UID 100 is the openbao image's baked `openbao:x:100:1000` user, which runAsUser/runAsGroup restate; only the snapshot container runs it and the pod default is 65532"
spec:
  schedule: "30 3 * * *"
  # Pin the cron evaluation to UTC instead of inheriting kube-controller-manager's
  # local TZ: the 03:30 slot is sequenced after the velero-daily-full backup
  # window (02:17 UTC).
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # Snapshot data has its own 14-copy retention on the PVC and R2. Keep only
  # the latest successful Kubernetes Job for diagnostics so completed pods from
  # an obsolete template do not keep producing background-policy events after a
  # scheduling guard is fixed. Failed Jobs retain the broader diagnostic window.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      # Backstop for a hung run: the bao auth/status/snapshot-save calls have no
      # client-side timeout and can hang forever on a half-open connection, and
      # the PVC can wedge attaching — with concurrencyPolicy: Forbid a run that
      # never finishes would silently block every future daily snapshot. 30m is
      # ~10x a slow run including the OnFailure retries; on expiry the Job fails
      # and the next day's schedule gets a clean start.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: vault-snapshot
        spec:
          serviceAccountName: vault-snapshot
          # Only the authenticating snapshot container receives a short-lived
          # projected token. The tool installer and remote mirror need no identity.
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          # The full restricted-PSS context is set explicitly (not left to the
          # add-security-context Kyverno mutation) so the pod stays hardened
          # even when created before the webhook is active on fresh bring-up.
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots
            # R2 credentials synced by ESO (external-secret.yaml). Optional:
            # on a fresh cluster the mirror container skips with a log line
            # until the sync lands; the local snapshot is unaffected.
            - name: r2-credentials
              secret:
                secretName: vault-snapshot-r2
                optional: true
            - name: mc-config
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            - name: mirror-tools
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            - name: kubernetes-identity
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3600
          initContainers:
            - name: install-mirror-tools
              image: docker.io/library/busybox:1.38.0-musl@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
              command: ["/bin/sh", "-ec", "cp /bin/busybox /tools/busybox; /tools/busybox --install -s /tools"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 8Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              volumeMounts:
                - name: mirror-tools
                  mountPath: /tools
            - name: snapshot
              image: quay.io/openbao/openbao:2.5.3@sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806
              securityContext:
                # UID 100 is the openbao image's own baked identity (`openbao:x:100:1000`
                # in its /etc/passwd) — see the checkov.io/skip2 rationale. Only this
                # container overrides the pod's high defaults; the mirror takes
                # 65532:65532 and reads through fsGroup 1000 as a supplementary group.
                runAsUser: 100
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  # kubescape C-0270/C-0271; generous for the raft snapshot step.
                  cpu: 250m
                  memory: 256Mi
              env:
                # openbao-active = unsealed Raft leader only. Snapshots must be
                # taken from the leader — against the plain `openbao` Service
                # this round-robins across all pods and fails spuriously when
                # it lands on a sealed-but-Ready standby.
                - name: BAO_ADDR
                  value: http://openbao-active.openbao.svc.cluster.local:8200
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: kubernetes-identity
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
              command:
                - /bin/sh
                - -ec
                - |
                  # Authenticate via Kubernetes auth
                  JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  VAULT_TOKEN=$(bao write -field=token auth/kubernetes/login \
                    role=vault-snapshot \
                    jwt="$JWT")
                  export BAO_TOKEN="$VAULT_TOKEN"

                  # Check vault health and seal status
                  echo "Checking OpenBao health..."
                  STATUS=$(bao status -format=json)
                  echo "$STATUS"

                  if echo "$STATUS" | grep -q '"sealed": true'; then
                    echo "ERROR: Vault is sealed!"
                    exit 1
                  fi
                  echo "Vault is unsealed and healthy."

                  # Backfill: widen EVERY snapshot on the shared PVC, not only the one this
                  # run creates. #3246 made new snapshots 0640, but retention keeps the
                  # newest 14, so every snapshot taken before it is still 0600 — readable
                  # only by its owner. The mirror runs `mc mirror` over the WHOLE directory,
                  # so it can need to open any of them. The mirror now runs as the pod's high
                  # UID and reads them through group 1000 instead of ownership. Widening them
                  # here, while the snapshot container still owns them, preserves that access;
                  # a warning rather than a hard failure means a single odd file
                  # cannot take the nightly backup down.
                  widened=0
                  for EXISTING in /snapshots/openbao-*.snap; do
                    [ -e "$EXISTING" ] || continue
                    chmod 0640 "$EXISTING" && widened=$((widened + 1)) ||
                      echo "WARNING: could not widen $EXISTING; the mirror may be unable to read it"
                  done
                  # Positive evidence: a silent loop cannot be told apart from one that matched nothing.
                  echo "Widened $widened snapshot(s) on the shared PVC to 0640."

                  SNAP="/snapshots/openbao-$(date -u +%Y%m%d-%H%M%S).snap"
                  echo "Saving raft snapshot to $SNAP..."
                  bao operator raft snapshot save "$SNAP"
                  # The mirror opens the snapshot as GROUP: fsGroup 1000 gives it
                  # supplementary membership while its primary identity stays 65532:65532.
                  # The snapshot container alone uses OpenBao's image UID/GID 100:1000. An explicit chmod,
                  # NOT a umask: umask can only clear permission bits, so it cannot
                  # widen the 0600 `bao` creates the file with. The 0640 mode decouples
                  # mirror access from the image-defined owner UID.
                  chmod 0640 "$SNAP"
                  ls -l "$SNAP"

                  # Retention: keep the newest 14 snapshots
                  ls -1t /snapshots/openbao-*.snap 2>/dev/null | tail -n +15 | while read -r OLD; do
                    echo "Pruning $OLD"
                    rm -f "$OLD"
                  done
                  echo "Snapshot complete."
          containers:
            - name: mirror
              image: quay.io/minio/aistor/mc:RELEASE.2026-03-12T04-18-55Z@sha256:6c33dc0fbf65c362be95003cd010ed95a41c556500833ea139f86de40c4c4e9f
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: REQUIRE_REMOTE_SNAPSHOT
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  # CPU limit for kubescape C-0270; generous for the mc mirror.
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                - name: r2-credentials
                  mountPath: /r2
                  readOnly: true
                - name: mc-config
                  mountPath: /tmp/.mc
                - name: mirror-tools
                  mountPath: /tools
                  readOnly: true
              command:
                - /tools/sh
                - -euc
                - |
                  set -o pipefail
                  umask 077
                  fail() {
                    printf 'VAULT_SNAPSHOT_REMOTE=FAIL stage=%s\n' "$1" >&2
                    exit 1
                  }
                  case "$REQUIRE_REMOTE_SNAPSHOT" in true|false) ;; *) fail configuration ;; esac
                  [ -d "$MC_CONFIG_DIR" ] || fail configuration
                  if [ ! -s /r2/access_key_id ] || [ ! -s /r2/secret_access_key ]; then
                    if [ "$REQUIRE_REMOTE_SNAPSHOT" = true ]; then
                      fail credentials
                    fi
                    printf '%s\n' 'VAULT_SNAPSHOT_REMOTE=UNSEEDED'
                    exit 0
                  fi
                  mc alias set backup "${r2_endpoint}" \
                    "$(cat /r2/access_key_id)" "$(cat /r2/secret_access_key)" \
                    > /dev/null 2>"$MC_CONFIG_DIR/error" || fail authentication
                  remote="backup/${r2_bucket}/openbao-snapshots"
                  # Copy-only: never remove remote history because a local volume is empty.
                  mc mirror --overwrite /snapshots/ "$remote/" \
                    > /dev/null 2>"$MC_CONFIG_DIR/error" || fail upload
                  verified=0
                  for snapshot in /snapshots/openbao-*.snap; do
                    [ -e "$snapshot" ] || continue
                    [ -f "$snapshot" ] && [ -s "$snapshot" ] && [ ! -L "$snapshot" ] || fail source
                    name=$(/tools/basename "$snapshot") || fail source
                    /tools/sha256sum < "$snapshot" > "$MC_CONFIG_DIR/expected.sha256" || fail local_hash
                    # Hash an actual GET, not object metadata or an upload acknowledgement.
                    # pipefail also rejects a GET that emits a full body before returning error.
                    if ! mc cat "$remote/$name" 2>"$MC_CONFIG_DIR/error" |
                        /tools/sha256sum > "$MC_CONFIG_DIR/actual.sha256"; then
                      fail readback
                    fi
                    /tools/cmp -s "$MC_CONFIG_DIR/expected.sha256" "$MC_CONFIG_DIR/actual.sha256" || fail integrity
                    verified=$((verified + 1))
                  done
                  [ "$verified" -gt 0 ] || fail source
                  # Retention runs only after upload AND byte-for-byte readback succeeded.
                  mc rm --recursive --force --older-than 14d "$remote/" \
                    > /dev/null 2>"$MC_CONFIG_DIR/error" || fail retention
                  printf 'VAULT_SNAPSHOT_REMOTE=VERIFIED count=%s\n' "$verified"
