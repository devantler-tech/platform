apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: arc-ksail-analysis
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "arc-ksail-app"
          serviceAccountRef:
            name: "arc-ksail-app"
