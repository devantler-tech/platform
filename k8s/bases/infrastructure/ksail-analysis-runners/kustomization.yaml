apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configurations:
  - kustomizeconfig
configMapGenerator:
  - name: ksail-arc-job-metrics
    namespace: arc-ksail-analysis
    files:
      - job-metrics.sh
    options:
      immutable: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
resources:
  - oci-repository.yaml
  - helm-release.yaml
  - external-secret.yaml
  - secret-store.yaml
  - service-account.yaml
  - cilium-network-policy-runner.yaml
