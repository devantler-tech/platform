# Active, uncalibrated analysis-only pool. Do not route managed analysis here until
# the registration, isolation, toolchain and capacity gates in the runbook pass.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ksail-analysis-runners
  namespace: arc-ksail-analysis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: false
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: ksail-analysis-runners
  values:
    # Use the controller's built-in scaler defaults for the bounded analysis pool.
    # ARC 0.15's optional tuning object is absent from the public CRD catalog.
    # null is explicitly supported by the pinned chart's values schema.
    listenerConfig: null
    githubConfigUrl: https://github.com/devantler-tech/ksail
    githubConfigSecret: arc-ksail-app
    runnerScaleSetName: ksail-code-quality
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller
    template:
      metadata:
        labels:
          platform.devantler.tech/arc-role: runner
      spec:
        automountServiceAccountToken: false
        nodeSelector:
          platform.devantler.tech/ksail-analysis: enabled
        tolerations:
          - key: platform.devantler.tech/ksail-analysis
            operator: Equal
            value: enabled
            effect: NoSchedule
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: runner-home
            emptyDir:
              sizeLimit: 40Gi
          - name: runner-tmp
            emptyDir:
              sizeLimit: 2Gi
          - name: runner-metrics
            configMap:
              name: ksail-arc-job-metrics
              defaultMode: 365 # 0555: executable, read-only job hook.
              items:
                - key: job-metrics.sh
                  path: job-metrics.sh
        initContainers:
          - name: init-runner-home
            image: ghcr.io/devantler-tech/ksail-analysis-runner@sha256:1ab01644fd6f67e0b1ab0b456e10b78f58be92ac67e5e06d103cd8c12bbb119b
            command: ["/bin/sh", "-ec", "cp -R /home/runner/. /runner-data/"]
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "1"
                memory: 512Mi
                ephemeral-storage: 4Gi
            volumeMounts:
              - name: runner-home
                mountPath: /runner-data
        containers:
          - name: runner
            image: ghcr.io/devantler-tech/ksail-analysis-runner@sha256:1ab01644fd6f67e0b1ab0b456e10b78f58be92ac67e5e06d103cd8c12bbb119b
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_HOOK_JOB_COMPLETED
                value: /etc/ksail-arc-metrics/job-metrics.sh
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: runner-home
                mountPath: /home/runner
              - name: runner-tmp
                mountPath: /tmp
              - name: runner-metrics
                mountPath: /etc/ksail-arc-metrics
                readOnly: true
            resources:
              requests:
                cpu: "3"
                memory: 12Gi
                ephemeral-storage: 32Gi
              limits:
                cpu: 3500m
                memory: 14Gi
                ephemeral-storage: 48Gi
    listenerTemplate:
      metadata:
        labels:
          platform.devantler.tech/arc-role: listener
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 512Mi
