# Inactive, uncalibrated analysis-only pool. Do not route a workflow here until
# the registration, isolation, toolchain and capacity gates in the runbook pass.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ksail-analysis-runners
  namespace: arc-ksail-analysis
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  suspend: true
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: ksail-analysis-runners
  values:
    githubConfigUrl: https://github.com/devantler-tech/ksail
    githubConfigSecret: arc-ksail-app
    runnerScaleSetName: ksail-code-quality
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller
    template:
      metadata:
        labels:
          platform.devantler.tech/arc-role: runner
      spec:
        automountServiceAccountToken: false
        nodeSelector:
          platform.devantler.tech/ksail-analysis: enabled
        tolerations:
          - key: platform.devantler.tech/ksail-analysis
            operator: Equal
            value: enabled
            effect: NoSchedule
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: "3"
                memory: 12Gi
                ephemeral-storage: 32Gi
              limits:
                cpu: 3500m
                memory: 14Gi
                ephemeral-storage: 48Gi
    listenerTemplate:
      metadata:
        labels:
          platform.devantler.tech/arc-role: listener
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 512Mi
