# TODO: Rework CoreDNS deployment into a helm-release
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
  annotations:
    deployment.kubernetes.io/revision: "1"
    configmap.reloader.stakater.com/reload: "coredns"
    # The Corefile enables the `kubernetes cluster.local` plugin, which serves
    # cluster DNS by watching Services, Endpoints and Pods through the API
    # server. Without the token CoreDNS cannot resolve any in-cluster name.
    checkov.io/skip1: CKV_K8S_38=CoreDNS resolves cluster DNS by watching Services/Endpoints via the API server
    # CoreDNS must serve cluster DNS on port 53. The pinned non-root image's
    # binary carries the file capability, so the container needs only this one
    # capability in its bounding set and drops every other capability below.
    checkov.io/skip2: CKV_K8S_25=CoreDNS requires only NET_BIND_SERVICE in its bounding set to serve DNS on port 53
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: kube-dns
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        k8s-app: kube-dns
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - kube-dns
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - args:
            - -conf
            - /etc/coredns/Corefile
          image: registry.k8s.io/coredns/coredns:v1.14.3@sha256:884b72dd6d2f7d367902af420605e0288dffedb0516ce29330423ae3f8f5c6fa
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          name: coredns
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 170Mi
            requests:
              cpu: 100m
              memory: 70Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/coredns
              name: config-volume
              readOnly: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      # 65532 is the distroless nonroot identity the pinned image already runs as
      # (v1.14.3, sha256:884b72dd…: `User: "nonroot:nonroot"`, and its /etc/passwd
      # maps `nonroot` to 65532:65532). Stating it here makes the manifest declare
      # the identity rather than inherit it, which is also what checkov CKV_K8S_40
      # asks for — the check reads the spec, not the image.
      #
      # Binding :53 as non-root works because the capability comes from a file
      # capability on the /coredns binary, which an unprivileged process retains
      # as long as NET_BIND_SERVICE is in the container's bounding set — added on
      # the container above. Ambient capabilities are not required, and this is
      # observable rather than inferred: the prod cluster's own CoreDNS runs the
      # same image family with no runAsUser (so, the same nonroot 65532), the same
      # `add: [NET_BIND_SERVICE] / drop: [ALL]`, and serves :53 as a ready kube-dns
      # endpoint.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: coredns
      serviceAccountName: coredns
      # Required: the `kubernetes` plugin in the Corefile watches Services,
      # Endpoints and Pods through the API server to answer cluster DNS.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: Corefile
                path: Corefile
            name: coredns
          name: config-volume
