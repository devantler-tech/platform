---
# Create the `platform-backups` bucket used by Velero/CNPG as a one-shot
# Job after MinIO comes up. Uses the MinIO client image.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: minio
  annotations:
    # `mc` accepts credentials as command-line arguments or environment
    # variables; it has no documented file-based credential input. Reading a
    # mounted file in the shell and passing the value to `mc alias set` would
    # move the credential from the environment to the process argv, which is no
    # less readable -- so it would satisfy the scanner without improving
    # anything. Hand-writing mc's own config.json is the only file-based route
    # and depends on an internal format this repository cannot verify: platform
    # CI is static validation with no full-cluster system test, so a broken
    # bucket-creation Job would surface only when someone next ran the local
    # backup test-bed. Scoped to this resource and this check only.
    checkov.io/skip1: CKV_K8S_35=the mc client has no documented file-based credential input, and the alternatives move the value to argv rather than out of process state
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      # The bucket-creation Job runs the mc client only; it never calls the
      # Kubernetes API, so it needs no ServiceAccount token (kubescape C-0034).
      automountServiceAccountToken: false
      # UID 65532 rather than a low one (checkov CKV_K8S_40). Nothing here
      # constrains the UID: the mc image declares no `User` at all, so it would
      # run as root unedited, and its /etc/passwd has no entry for the UID this
      # ran under before — the client is already running unmapped and does not
      # care. Its only volume is a `mc-config` emptyDir carrying no `fsGroup`,
      # so no UID owns it, and `MC_CONFIG_DIR` points mc's state there rather
      # than at a home directory that would have to exist.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: rootPassword
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio.minio.svc.cluster.local:9000 \
                    "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing local/platform-backups
              mc ls local/
      volumes:
        - name: mc-config
          emptyDir: {}
