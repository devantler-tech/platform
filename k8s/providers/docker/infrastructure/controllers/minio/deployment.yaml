---
# Local-only SeaweedFS stand-in for Cloudflare R2, retaining the minio:9000
# S3 endpoint used by Velero and CNPG. Single replica, ephemeral
# emptyDir storage -- backups themselves are throw-away here; what
# matters is that the backup/restore flow runs end-to-end.
#
# Production backups use Cloudflare R2. This component serves disposable storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  annotations:
    # This script contains shell parameter expansion, not Flux variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      # The S3 server never calls the Kubernetes API, so it has
      # no use for a mounted ServiceAccount token (kubescape C-0034).
      automountServiceAccountToken: false
      # fsGroup makes only the data and temporary emptyDirs writable. The
      # distribution's ownership-changing entrypoint is not invoked.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              access=$(cat /etc/minio-credentials/rootUser)
              password=$(cat /etc/minio-credentials/rootPassword)
              case "$access" in ''|*[!A-Za-z0-9_+=/-]*) exit 1;; esac
              case "$password" in ''|*[!A-Za-z0-9_+=/-]*) exit 1;; esac
              test "${#access}" -ge 3
              test "${#access}" -le 64
              test "${#password}" -ge 8
              test "${#password}" -le 128
              test "$(wc -c </etc/minio-credentials/rootUser)" -eq "${#access}"
              test "$(wc -c </etc/minio-credentials/rootPassword)" -eq "${#password}"
              printf '{"identities":[{"name":"fixture","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$access" "$password" >/tmp/s3.json
              unset access password
              exec /usr/bin/weed -logtostderr=true server -dir=/data -filer -s3 \
                -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0 \
                -s3.port=9000 -s3.port.grpc=19000 -s3.config=/tmp/s3.json -s3.iam=false \
                -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false \
                -master.volumeSizeLimitMB=64 -volume.max=4
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # The shell's printf builtin generates one private identity file from
          # required, JSON-safe mounted keys. Empty/malformed keys stop startup;
          # credential bytes never enter environment variables or process argv.
          # Internal HTTP APIs bind loopback; Cilium permits only S3 HTTP
          # ingress from Pod peers, blocking the additional management gRPC port.
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: root-credentials
              mountPath: /etc/minio-credentials
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: root-credentials
          secret:
            secretName: minio-root-credentials
