---
# Local-only stand-in for Cloudflare R2 so Velero + CNPG exercise the
# exact same S3 code path in CI as in prod. Single replica, ephemeral
# emptyDir storage -- backups themselves are throw-away here; what
# matters is that the backup/restore flow runs end-to-end.
#
# The archived community build is temporary and receives no security updates.
# It serves disposable test storage only; production backups use Cloudflare R2.
# Replacement: https://github.com/devantler-tech/platform/issues/4326.
# Keep the 2025.4.22 release: the later 2025.7.23 build rejects Velero's
# ordinary S3 access keys with strict 32-character SigV4 validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      # minio is a pure S3 server and never calls the Kubernetes API, so it has
      # no use for a mounted ServiceAccount token (kubescape C-0034).
      automountServiceAccountToken: false
      # Invoke the server binary directly, without the distribution's setup
      # wrapper. fsGroup makes the data and temporary emptyDirs writable by the
      # high unprivileged UID even though the image declares UID 1001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: docker.io/bitnamilegacy/minio:2025.4.22-debian-12-r1@sha256:d7cd0e172c4cc0870f4bdc3142018e2a37be9acf04d68f386600daad427e0cab
          command:
            - /opt/bitnami/minio/bin/minio
          args:
            - server
            - /data
            - --console-address
            - :9001
            - --certs-dir
            - /tmp/certs
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Root credentials are read from the mounted Secret rather than passed
          # as environment variables (checkov CKV_K8S_35). MinIO resolves the
          # *_FILE form by reading the file's contents at startup; these two
          # variables carry a path, not a credential, so nothing sensitive is
          # left in the process environment. The unsuffixed MINIO_ROOT_USER /
          # MINIO_ROOT_PASSWORD take precedence when set, so they must stay
          # absent for the file form to be used at all.
          env:
            - name: MINIO_ROOT_USER_FILE
              value: /etc/minio-credentials/rootUser
            - name: MINIO_ROOT_PASSWORD_FILE
              value: /etc/minio-credentials/rootPassword
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: root-credentials
              mountPath: /etc/minio-credentials
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: root-credentials
          secret:
            secretName: minio-root-credentials
