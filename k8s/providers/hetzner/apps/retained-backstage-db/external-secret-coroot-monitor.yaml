# The retained Cluster already manages this dedicated pg_monitor role. Restore
# its dependency without restoring the retired application or changing its user.
# CreatedOnce avoids periodic rotation; CNPG and Coroot consume the same Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-db-coroot-monitor
  namespace: backstage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-db-coroot-monitor
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coroot_monitor
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-db-coroot-monitor
