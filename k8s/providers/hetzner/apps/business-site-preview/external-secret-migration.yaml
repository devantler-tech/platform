apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-dev-migration
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: business-site-preview
    kind: SecretStore
  target:
    name: business-site-dev-migration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: "postgres://portal_preview_migrator:{{ .password | urlquery }}@portal-preview-db-rw.business-site-dev.svc.cluster.local:5432/portal_preview?sslmode=verify-full&sslrootcert=/run/portal-migration/ca.crt"
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site-dev/portal-migrator
        property: password
    - secretKey: ca
      remoteRef:
        key: apps/business-site-dev/portal-db-ca
        property: ca
