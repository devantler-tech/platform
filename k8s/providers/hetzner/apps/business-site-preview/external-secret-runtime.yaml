apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-dev-runtime
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: business-site-preview
    kind: SecretStore
  target:
    name: business-site-dev-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        company-disclosure: Preview address
        portal-client-secret: "{{ .client_secret }}"
        portal-database-ca: "{{ .ca }}"
        portal-settings: |
          PORTAL_DATABASE_URL=postgres://portal_preview_web:{{ .password | urlquery }}@portal-preview-db-rw.business-site-dev.svc.cluster.local:5432/portal_preview?sslmode=verify-full&sslrootcert=/run/webapp-inputs/portal-database-ca
          PORTAL_OIDC_ISSUER=https://login.devantler.tech
          PORTAL_OIDC_CLIENT_ID=business-site-preview
          PORTAL_CALLBACK_URL=https://dev.devantler.tech/callback
          PORTAL_CLIENT_SECRET_PROJECTION_FILE=/run/webapp-inputs/portal-client-secret
          PORTAL_IDENTITY_PROFILE=preview
          PORTAL_OPERATOR_SUBJECTS=CiRjM2JjNGNjNS00NDNmLTRjODYtODRhZS01MTZlMzYyOTY0NTESEGN1c3RvbWVyLXppdGFkZWw
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site-dev/portal-web
        property: password
    - secretKey: client_secret
      remoteRef:
        key: apps/business-site-dev/oidc
        property: client-secret
    - secretKey: ca
      remoteRef:
        key: apps/business-site-dev/portal-db-ca
        property: ca
