# The source-only preview Tenant owns this signed release source.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: business-site-preview
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 1m
  retryInterval: 2m
  timeout: 5m
  path: ./dev
  serviceAccountName: business-site-preview-deployer
  sourceRef:
    kind: OCIRepository
    name: business-site
  targetNamespace: business-site-dev
  wait: true
  prune: true
  force: false
