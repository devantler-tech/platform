apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-preview-db-web
  namespace: business-site-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: business-site-preview
    kind: SecretStore
  target:
    name: portal-preview-db-web
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: ""
      data:
        username: portal_preview_web
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site-dev/portal-web
        property: password
