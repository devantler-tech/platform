apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: business-site-preview-deployer
  namespace: business-site-dev
rules:
  - apiGroups: [kro.run]
    resources: [webapps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
