apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-preview-db-coroot-monitor
  namespace: business-site-dev
spec:
  refreshInterval: "0"
  target:
    name: portal-preview-db-coroot-monitor
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coroot_monitor
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: portal-preview-db-coroot-monitor
