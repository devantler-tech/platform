# Publish the CNPG-generated public certificate for verified client TLS.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: portal-preview-db-ca
  namespace: business-site-dev
spec:
  refreshInterval: 10m
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: portal-preview-db-ca
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: apps/business-site-dev/portal-db-ca
          property: ca
