apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portal-preview-db
  namespace: business-site-dev
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-system-trixie
  instances: 1
  priorityClassName: hcloud-volume-workload
  env:
    - name: PLATFORM_DATABASE_PRIORITY_CLASS
      value: hcloud-volume-workload
  # The fictional workspace can go offline while its only pod drains.
  enablePDB: false
  enableSuperuserAccess: false
  storage:
    size: 2Gi
    storageClass: longhorn-wffc
  certificates:
    serverAltDNSNames:
      - portal-preview-db-rw.business-site-dev.svc.cluster.local
  inheritedMetadata:
    annotations:
      coroot.com/postgres-scrape: "true"
      coroot.com/postgres-scrape-port: "5432"
      coroot.com/postgres-scrape-credentials-secret-name: portal-preview-db-coroot-monitor
      coroot.com/postgres-scrape-credentials-secret-username-key: username
      coroot.com/postgres-scrape-credentials-secret-password-key: password
      coroot.com/postgres-scrape-param-sslmode: require
  postgresql:
    parameters:
      pg_stat_statements.track: all
  bootstrap:
    initdb:
      database: portal_preview
      owner: portal_preview_migrator
      secret:
        name: portal-preview-db-migrator
      postInitApplicationSQL:
        - REVOKE CREATE ON SCHEMA public FROM PUBLIC
  managed:
    roles:
      - name: portal_preview_migrator
        ensure: present
        login: true
        passwordSecret:
          name: portal-preview-db-migrator
      - name: portal_preview_web
        ensure: present
        login: true
        inherit: false
        passwordSecret:
          name: portal-preview-db-web
      - name: coroot_monitor
        ensure: present
        login: true
        inRoles:
          - pg_monitor
        passwordSecret:
          name: portal-preview-db-coroot-monitor
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
