apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: portal-preview-db
  namespace: business-site-dev
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: portal-preview-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: business-site
            app.kubernetes.io/name: business-site
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: business-site
            app.kubernetes.io/name: business-site-practice-migration
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
