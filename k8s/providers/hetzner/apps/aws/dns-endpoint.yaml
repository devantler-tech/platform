# Company Email's Amazon SES DNS records (platform#5481), published DNS-only by
# the platform's external-dns. These are new names, so each has one owner: the
# MAIL FROM domain's MX and SPF records, so that SPF aligns with the mailbox
# domain for DMARC, and the identity's three Easy DKIM CNAMEs, whose tokens
# come from the EmailIdentity's status. The mailbox domain's own SPF and DMARC
# records are not managed here. restrict-explicit-dns-records admits exactly
# this endpoint list in this namespace and under this name.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: company-mail-ses
  namespace: aws
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  endpoints:
    - dnsName: bounce.devantler.tech
      recordTTL: 300
      recordType: MX
      targets:
        - 10 feedback-smtp.eu-central-1.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: bounce.devantler.tech
      recordTTL: 300
      recordType: TXT
      targets:
        - v=spf1 include:amazonses.com ~all
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: svxhyimgvhbtlrpbuivbx6ievcg5iwiw._domainkey.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - svxhyimgvhbtlrpbuivbx6ievcg5iwiw.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: frps4kqaz6dyvptmesuiwlaendicjq5v._domainkey.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - frps4kqaz6dyvptmesuiwlaendicjq5v.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: caa46ibjaox7qooavcfri6ha3xbxxjld._domainkey.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - caa46ibjaox7qooavcfri6ha3xbxxjld.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
