# Copies the business site's SES SMTP credential into OpenBao under the
# business site's own prefix, where its tenant reads it through its dedicated
# role. Platform-applied, so it may use the shared store, which holds an
# exact-key grant for this one record. Replace keeps OpenBao equal to the
# current key; a missing or incomplete connection Secret writes nothing.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: business-site-smtp-credentials
  namespace: aws
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: business-site-smtp-credentials
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: apps/business-site/smtp
          property: username
    - match:
        secretKey: attribute.ses_smtp_password_v4
        remoteRef:
          remoteKey: apps/business-site/smtp
          property: password
