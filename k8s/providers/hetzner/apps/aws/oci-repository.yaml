# The aws tenant's source — the same delivery pattern as github-config
# (cosign-verified OCI artifact → namespace-scoped Kustomization), carrying the
# devantler-tech/aws repo's deploy/ artifact: the declarative AWS state
# (Crossplane managed resources; IAM kinds arrive with platform#2326). The
# artifact is published as a signed OCI image by that repo's cd.yaml on v* tags.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: aws
  namespace: aws
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  # No secretRef: the package is public (non-secret desired-state config, no
  # credentials — those live in OpenBao), so it is pulled anonymously.
  url: oci://ghcr.io/devantler-tech/aws/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Generated from scripts/publish-workflow-approved-revisions.tsv by
      # scripts/write-publish-workflow-matchers.sh. Accept the deployed artifact
      # signer and this consumer's current publish-workflow pin in one identity.
      # Regeneration updates the pair and the approved set in the same PR.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/(actions/\.github/workflows/publish-manifests\.yaml@(b089a1b041cb86af22cdc57de58a4d7d258dcc32|1d726483facb9340655489913f609082677be8f5|673611e71b2b5d3f1f626ec32bc73e3dc56da221)|\.github/\.github/workflows/publish-manifests\.yaml@2fa404276b0ce5c0527683b080e39045045c4e42)$'
