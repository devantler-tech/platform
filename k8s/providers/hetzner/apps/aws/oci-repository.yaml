# The aws tenant's source — the same delivery pattern as github-config
# (cosign-verified OCI artifact → namespace-scoped Kustomization), carrying the
# devantler-tech/aws repo's deploy/ artifact: the declarative AWS state
# (Crossplane managed resources; IAM kinds arrive with platform#2326). The
# artifact is published as a signed OCI image by that repo's cd.yaml on v* tags.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: aws
  namespace: aws
  labels:
    app.kubernetes.io/managed-by: ksail
    platform.devantler.tech/tenant-source: "true"
spec:
  interval: 1m
  ref:
    semver: ">=1.0.0"
  # No secretRef: the package is public (non-secret desired-state config, no
  # credentials — those live in OpenBao), so it is pulled anonymously.
  url: oci://ghcr.io/devantler-tech/aws/manifests
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Keyless-signed by a workflow directly in .github/workflows/ of this product's
      # OWN repository on a strict OCI-semver release tag (ADR 0017, #6265). The shared
      # publisher, another repository, a branch or a non-release tag does not match.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/aws/\.github/workflows/[^/]+\.ya?ml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
