# Copies company Email's SES SMTP credential into OpenBao, where the Email
# server reads it. Platform-applied, so it may use the shared store, which holds
# an exact-key grant for this one record. Replace keeps OpenBao equal to the
# current key; a missing or incomplete connection Secret writes nothing.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: email-smtp-credentials
  namespace: aws
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: email-smtp-credentials
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: infrastructure/email/ses-smtp
          property: username
    - match:
        secretKey: attribute.ses_smtp_password_v4
        remoteRef:
          remoteKey: infrastructure/email/ses-smtp
          property: password
