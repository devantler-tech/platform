# The Crossview chart uses the upstream postgres image directly rather than
# CloudNativePG, so its monitoring role and extension must be initialized by the
# image entrypoint. The script runs only for a fresh data directory; Crossview's
# database was ephemeral before #3319; after the durable-storage migration the
# same script initializes only a genuinely fresh claim. psql imports the
# password from the process environment so the credential never appears in the
# command line or this public ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crossview-postgres-coroot-monitor-init
  namespace: crossview
data:
  init-coroot-monitor.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    # Annotation-based Coroot targets always connect to the postgres
    # maintenance database, so the extension must exist there.
    psql \
      --username "$POSTGRES_USER" \
      --dbname postgres \
      --no-psqlrc \
      --set=ON_ERROR_STOP=1 <<'SQL'
    \getenv coroot_monitor_password COROOT_MONITOR_PASSWORD
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    SELECT format(
      'CREATE ROLE coroot_monitor LOGIN PASSWORD %L',
      :'coroot_monitor_password'
    )
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'coroot_monitor'
    ) \gexec
    ALTER ROLE coroot_monitor LOGIN PASSWORD :'coroot_monitor_password';
    GRANT pg_monitor TO coroot_monitor;

    -- This durable marker distinguishes the new PVC-backed cluster from the
    -- outgoing ephemeral cluster during the one-time cutover. The Crossview
    -- app's init container waits for it before allowing the app process to
    -- recreate its schema. Because docker-entrypoint-initdb.d runs only for an
    -- empty data directory, the marker cannot appear on the outgoing cluster.
    CREATE SCHEMA IF NOT EXISTS platform_bootstrap;
    CREATE TABLE IF NOT EXISTS platform_bootstrap.gates (
      name text PRIMARY KEY,
      completed_at timestamptz NOT NULL DEFAULT clock_timestamp()
    );
    INSERT INTO platform_bootstrap.gates (name)
    VALUES ('durable-storage-v1')
    ON CONFLICT (name) DO NOTHING;
    SQL
