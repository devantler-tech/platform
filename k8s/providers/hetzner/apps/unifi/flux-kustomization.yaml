---
# Applies the UniFi Managed Resources from the devantler-tech/unifi GitRepository
# into this namespace, AS the namespace-scoped `unifi` ServiceAccount (so the MRs
# are created with only the authority granted in role.yaml). It is itself applied
# by the `apps` Flux Kustomization; it must NOT dependsOn it (deadlock) — it
# retries benignly until the provider (infrastructure layer) has established the
# namespaced unifi CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi
  namespace: unifi
  labels:
    app.kubernetes.io/managed-by: ksail
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 1m
  timeout: 5m
  retryInterval: 2m
  path: ./
  # Flux stays authoritative for this tree like every other Kustomization: a
  # resource removed from devantler-tech/unifi is deleted from the cluster.
  prune: true
  wait: true
  serviceAccountName: unifi
  sourceRef:
    kind: GitRepository
    name: unifi
  targetNamespace: unifi
  # The live UniFi objects are retained at the resource layer instead. Every
  # managed resource is applied without the Delete management policy, so a
  # source compromise or an accidental removal deletes only the Kubernetes
  # object, never the network object behind it. (Namespaced Crossplane v2
  # managed resources have no deletionPolicy; leaving out Delete is its Orphan
  # form.) Deleting a live UniFi object therefore stays a deliberate act in UniFi.
  #
  # The two patches split every managed resource by one annotation, so each gets
  # exactly one of them and the source can only ever narrow what Crossplane may
  # do. A resource being adopted (docs/unifi-management.md) is annotated
  # observe-only and gets ["Observe"]; every other resource gets every policy but
  # Delete. A source-declared managementPolicies is replaced either way, because
  # a strategic-merge patch replaces a custom resource's list wholesale.
  #
  # The group regex is anchored by kustomize and matches every managed-resource
  # group the provider serves (dns., vpn., route., ... .unifi.m.crossplane.io),
  # including groups it adds later, but not the provider's own configuration
  # group unifi.m.crossplane.io.
  patches:
    - target:
        group: '.+\.unifi\.m\.crossplane\.io'
        annotationSelector: platform.devantler.tech/unifi-management!=observe-only
      patch: |
        apiVersion: unifi.m.crossplane.io/v1alpha1
        kind: ManagedResource
        metadata:
          name: retain-live-unifi-object
        spec:
          managementPolicies:
            - Observe
            - Create
            - Update
            - LateInitialize
    - target:
        group: '.+\.unifi\.m\.crossplane\.io'
        annotationSelector: platform.devantler.tech/unifi-management=observe-only
      patch: |
        apiVersion: unifi.m.crossplane.io/v1alpha1
        kind: ManagedResource
        metadata:
          name: observe-adopted-unifi-object
        spec:
          managementPolicies:
            - Observe
