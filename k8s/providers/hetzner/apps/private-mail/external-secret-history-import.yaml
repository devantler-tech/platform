# The existing provider's sign-in and the domain's address inventory for the
# one-time history copy (#5481). The maintainer keeps them at
# `infrastructure/icloud` so other services can reuse the same sign-in. The
# destination password is mounted from the existing private-mail-maintainer
# Secret, so no second copy of it is made.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-history-import
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: email-history-import
    kind: SecretStore
  target:
    name: email-history-import
    creationPolicy: Owner
  data:
    - secretKey: source-username
      remoteRef:
        key: infrastructure/icloud
        property: username
    - secretKey: source-password
      remoteRef:
        key: infrastructure/icloud
        property: password
    - secretKey: addresses
      remoteRef:
        key: infrastructure/icloud
        property: addresses
