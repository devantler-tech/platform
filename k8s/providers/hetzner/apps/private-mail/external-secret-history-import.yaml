# The existing provider's sign-in for the one-time history copy (#5481). The
# maintainer keeps it at `infrastructure/apple/icloud`, so other services can
# reuse it. The domain's address inventory is not a provider credential, so it
# comes from the encrypted email-history-import-addresses Secret instead, and
# the destination password from the existing private-mail-maintainer Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-history-import
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: email-history-import
    kind: SecretStore
  target:
    name: email-history-import
    creationPolicy: Owner
  data:
    - secretKey: source-username
      remoteRef:
        key: infrastructure/apple/icloud
        property: username
    - secretKey: source-password
      remoteRef:
        key: infrastructure/apple/icloud
        property: password
