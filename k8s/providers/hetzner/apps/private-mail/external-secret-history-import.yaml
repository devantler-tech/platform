# The two sign-ins for the one-time history copy (#5481). The maintainer keeps
# the existing provider's at `infrastructure/apple/icloud`, so other services
# can reuse it, and the app password for the new mailbox at
# `infrastructure/email/history-import`: the account has two-factor sign-in,
# so its own password cannot sign in over IMAP. The app password can be
# revoked once the copy is done. The domain's address inventory is not a
# credential, so it comes from the encrypted email-history-import-addresses
# Secret instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-history-import
  namespace: private-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: email-history-import
    kind: SecretStore
  target:
    name: email-history-import
    creationPolicy: Owner
  data:
    - secretKey: source-username
      remoteRef:
        key: infrastructure/apple/icloud
        property: username
    - secretKey: source-password
      remoteRef:
        key: infrastructure/apple/icloud
        property: password
    - secretKey: destination-password
      remoteRef:
        key: infrastructure/email/history-import
        property: password
