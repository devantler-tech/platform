# Keep the verified configuration and the original mount path of the V2 store.
- op: test
  path: /spec/template/spec/initContainers/0/name
  value: configure
- op: test
  path: /spec/template/spec/containers/1/name
  value: private-mail
- op: move
  from: /spec/template/spec/containers/1
  path: /spec/template/spec/containers/0
- op: test
  path: /spec/template/spec/initContainers/0/volumeMounts/0/name
  value: datastore
- op: test
  path: /spec/template/spec/containers/0/volumeMounts/0/name
  value: datastore
- op: replace
  path: /spec/template/spec/initContainers/0/volumeMounts/0/name
  value: serving-storage
- op: replace
  path: /spec/template/spec/containers/0/volumeMounts/0/name
  value: serving-storage
- op: test
  path: /spec/template/spec/initContainers/0/volumeMounts/1/name
  value: data
- op: replace
  path: /spec/template/spec/initContainers/0/volumeMounts/1
  value:
    name: v2-data
    mountPath: /var/lib/stalwart-v2
- op: test
  path: /spec/template/spec/containers/0/volumeMounts/1/name
  value: data
- op: replace
  path: /spec/template/spec/containers/0/volumeMounts/1
  value:
    name: v2-data
    mountPath: /var/lib/stalwart-v2
- op: test
  path: /spec/template/spec/volumes/0/name
  value: data
- op: test
  path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
  value: email-data-encrypted-v2
- op: replace
  path: /spec/template/spec/volumes/0/name
  value: v2-data
- op: add
  path: /spec/template/spec/volumes/0
  value:
    name: serving-storage
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
