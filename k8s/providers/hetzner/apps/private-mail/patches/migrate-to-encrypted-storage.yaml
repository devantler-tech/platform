# Copies the original mail store onto the encrypted claim once, before setup
# and serving start (#5387). The StatefulSet stops the old server before this
# Pod starts, so the copy is consistent. The original is mounted read-only. A
# copy that differs from it, by entry type, mode, path or file checksum, stops
# the Pod with the original untouched; later starts skip the copy.
- op: add
  path: /spec/template/spec/initContainers/0
  value:
    name: migrate-storage
    image: ghcr.io/devantler-tech/platform-private-mail-bootstrap
    imagePullPolicy: IfNotPresent
    command: ["/usr/bin/sh", "-c"]
    args:
      - |
        set -eu
        source=/var/lib/private-mail-original
        target=/var/lib/stalwart
        marker="$target/.private-mail-storage-migrated"
        refuse() { echo "Email storage migration refused: $1; the original is untouched." >&2; exit 1; }
        if [ -e "$marker" ]; then
          echo "Email storage is on the encrypted volume; the original is untouched."
          exit 0
        fi
        [ -d "$source/data" ] || refuse "the original volume holds no store"
        # An unmarked target is an interrupted earlier copy: clear only the target.
        find "$target" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
        find "$source" -mindepth 1 -maxdepth 1 ! -name lost+found -exec cp -a -t "$target" {} +
        # Directory sizes are excluded: ext4 never shrinks a directory.
        inventory() {
          (cd "$1" && find . -path ./lost+found -prune -o ! -name . -printf '%y %m %p %l\n') >"$2.entries"
          (cd "$1" && find . -path ./lost+found -prune -o -type f -print0) >"$2.files"
          LC_ALL=C sort -o "$2.entries" "$2.entries"
          LC_ALL=C sort -z -o "$2.files" "$2.files"
          (cd "$1" && xargs -0r sha256sum <"$2.files") >"$2.sums"
        }
        inventory "$source" /tmp/original
        inventory "$target" /tmp/encrypted
        [ -s /tmp/original.sums ] || refuse "the original store has no files"
        [ "$(sha256sum </tmp/original.entries)" = "$(sha256sum </tmp/encrypted.entries)" ] || refuse "the copied entries differ"
        [ "$(sha256sum </tmp/original.sums)" = "$(sha256sum </tmp/encrypted.sums)" ] || refuse "the copied files differ"
        sync
        printf 'copied %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$marker.tmp"
        mv "$marker.tmp" "$marker"
        sync
        echo "Email storage copied onto the encrypted volume and verified; the original is untouched."
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
      seLinuxOptions: {}
    volumeMounts:
      - name: data
        mountPath: /var/lib/stalwart
      - name: legacy-data
        mountPath: /var/lib/private-mail-original
        readOnly: true
      - name: initialization-temporary
        mountPath: /tmp
