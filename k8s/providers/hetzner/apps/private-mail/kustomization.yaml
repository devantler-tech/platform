apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../bases/apps/private-mail-proxy-identity
  # The mail store is encrypted at rest; its key comes from OpenBao (#5387).
  - ../../../../bases/apps/email-encrypted-storage
  - secret-settings.enc.yaml
  # The one-time mailbox history copy (#5481): a suspended template the
  # dispatched operation starts, and the only endpoints it may reach.
  - cron-job-history-import.yaml
  - cilium-network-policy-history-import.yaml
  # The mail server's own load balancer for SMTP, submission and IMAPS (#5481);
  # submission is served on 587 and, with implicit TLS, on 465.
  - service.yaml
  # Its DNS-only host, mail.devantler.tech.
  - dns-endpoint.yaml
  # Inputs for the one-time mailbox history copy from the existing provider
  # (#5481): its sign-in through a scoped OpenBao role, and the domain's
  # address inventory as an encrypted Secret. Removed with the importer.
  - service-account-history-import.yaml
  - secret-store-history-import.yaml
  - external-secret-history-import.yaml
  - secret-history-import-addresses.enc.yaml
patches:
  # Production has retained credential custody. Never infer a fresh installation
  # from missing records while an older backup is being restored.
  - path: patches/disable-admin-credential-seeding.yaml
  - path: patches/disable-maintainer-credential-seeding.yaml
  - path: patches/disable-agent-credential-seeding.yaml
  # Serve from the verified encrypted V2 claim while retaining the original PVC.
  - path: patches/serve-from-encrypted-storage.yaml
  # The server now consumes the encrypted claim, so deployment must wait for it
  # to bind instead of treating it as prepared storage.
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: email-data-encrypted
      namespace: private-mail
    patch: |-
      - op: remove
        path: /metadata/labels/platform.devantler.tech~1storage-stage
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: email-data-encrypted-v2
      namespace: private-mail
    patch: |-
      - op: remove
        path: /metadata/labels/platform.devantler.tech~1storage-stage
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: private-mail
      namespace: private-mail
    path: patches/route-serving-storage.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: private-mail
      namespace: private-mail
    path: patches/select-mail-store.yaml
  # The mail listeners trust PROXY headers from their own load balancer only.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: private-mail
      namespace: private-mail
    path: patches/trust-mail-load-balancer.yaml
  # The server's public names: mail.devantler.tech for mail, and its web host.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: private-mail
      namespace: private-mail
    path: patches/name-mail-server.yaml
  # SMTP, both submission ports and IMAPS are reachable from their own load
  # balancer only.
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: private-mail
      namespace: private-mail
    path: patches/admit-mail-load-balancer.yaml
  # The one-time history copy writes into the mailbox over IMAPS (#5481).
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: private-mail
      namespace: private-mail
    path: patches/admit-history-import.yaml
  # The public mail hostname, for submission and IMAPS clients (#5481).
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: private-mail
      namespace: private-mail
    path: patches/certify-mail-hostname.yaml
# The selector uses the same signed setup image as the server. A parent image
# transformer does not pin a container added here.
replacements:
  - source:
      kind: StatefulSet
      name: private-mail
      namespace: private-mail
      fieldPath: spec.template.spec.containers.[name=private-mail].image
    targets:
      - select:
          kind: StatefulSet
          name: private-mail
          namespace: private-mail
        fieldPaths:
          - spec.template.spec.initContainers.[name=select-mail-store].image
