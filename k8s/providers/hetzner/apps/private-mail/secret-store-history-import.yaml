# Reads only the existing mail provider's sign-in, through its own namespaced
# OpenBao role (#5481). The shared External Secrets role cannot read it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: email-history-import
  namespace: private-mail
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: email-history-import
          serviceAccountRef:
            name: email-history-import
