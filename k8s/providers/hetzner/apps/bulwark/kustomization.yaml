# Bulwark, the webmail for the company mailbox (#6662): launched dark, with no
# route. Production only, as a third-party app (ADR 0016).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service-account.yaml
  - password.yaml
  - external-secret.yaml
  - config-map.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - cilium-network-policy.yaml
