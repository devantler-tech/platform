# Bulwark's session secret, generated once in-cluster and never refreshed. It
# signs and encrypts remembered sign-ins and the server's record of when each
# session started, which the 12-hour maximum is checked against. Without one,
# Bulwark would generate its own on the scratch volume, and every restart would
# sign everyone out. A new one (after a rebuild) only signs everyone out once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark
  namespace: bulwark
spec:
  refreshInterval: "0"
  target:
    name: bulwark
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        session-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bulwark
