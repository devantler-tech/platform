# Public, because GitHub-hosted runners call it. octo-sts authenticates every
# exchange itself: it verifies the caller's OIDC token and grants only what a
# reviewed trust policy names. Callers use this hostname as the octo-sts
# `domain`, which is also the default token audience.
#
# The platform's own deploy and recovery workflows must never call this host
# (ADR 0020): scripts/guard-github-broker-independence.sh enforces it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-broker
  namespace: github-broker
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - sts.${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
      backendRefs:
        - name: github-broker
          port: 80
