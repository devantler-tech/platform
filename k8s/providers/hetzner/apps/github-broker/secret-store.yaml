# Reaches the two App credentials and nothing else. It does not use the shared
# `openbao` ClusterSecretStore, which reaches every infrastructure and app path.
# The `github-broker` OpenBao role (k8s/bases/infrastructure/vault-config/job.yaml)
# carries only `infra-github-broker`: read on
# secret/infrastructure/github/apps/botantler-1 and botantler-2.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: github-broker
spec:
  provider:
    vault:
      # openbao-active = unsealed Raft leader only; the plain `openbao` Service
      # also round-robins onto sealed-but-Ready standbys (503 "Vault is sealed").
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "github-broker"
          serviceAccountRef:
            name: "github-broker"
