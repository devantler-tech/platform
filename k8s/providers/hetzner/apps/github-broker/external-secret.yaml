# Both botantler Apps' credentials, and the broker's App configuration built
# from them. The private keys exist only in OpenBao and in this Secret.
#
# OpenBao paths (each with properties `app_id` and `pem`), seeded with
# placeholders by the vault-config Job and filled from the organization's App
# secrets by the one-off seed-github-broker-apps workflow:
#   secret/infrastructure/github/apps/botantler-1
#   secret/infrastructure/github/apps/botantler-2
# The Secret refreshes hourly; the broker reads its keys only at startup.
#
# config.yaml is octo-sts's APP_CONFIG_FILE (pkg/appconfig, v0.14.4): one
# organization served by both Apps, each reading its key from a file. octo-sts
# sends each exchange to the installation with the most rate limit left. A
# trust policy can pin one App by its app_name. A placeholder or malformed
# app_id renders as 0, which octo-sts refuses at startup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-broker-apps
  namespace: github-broker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: github-broker-apps
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          orgs:
            - name: devantler-tech
              apps:
                - app_id: {{ .botantler1AppId | trim | int64 }}
                  app_name: botantler-1
                  private_key_file: /etc/github-broker/apps/botantler-1.pem
                - app_id: {{ .botantler2AppId | trim | int64 }}
                  app_name: botantler-2
                  private_key_file: /etc/github-broker/apps/botantler-2.pem
        botantler-1.pem: "{{ .botantler1Pem }}"
        botantler-2.pem: "{{ .botantler2Pem }}"
  data:
    - secretKey: botantler1AppId
      remoteRef:
        key: infrastructure/github/apps/botantler-1
        property: app_id
    - secretKey: botantler1Pem
      remoteRef:
        key: infrastructure/github/apps/botantler-1
        property: pem
    - secretKey: botantler2AppId
      remoteRef:
        key: infrastructure/github/apps/botantler-2
        property: app_id
    - secretKey: botantler2Pem
      remoteRef:
        key: infrastructure/github/apps/botantler-2
        property: pem
