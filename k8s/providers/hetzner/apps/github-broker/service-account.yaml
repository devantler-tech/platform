# The broker's identity. Its pods mount no token: they never call the
# Kubernetes API. The namespaced SecretStore authenticates to OpenBao as this
# account, through the dedicated `github-broker` role, which may read only the
# two App credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-broker
  namespace: github-broker
automountServiceAccountToken: false
