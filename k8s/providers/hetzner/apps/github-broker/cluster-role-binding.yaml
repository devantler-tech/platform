# Lets the broker verify this cluster's service-account tokens: octo-sts
# fetches the issuer's discovery document and public keys without credentials,
# like any OIDC relying party. The built-in role grants read on exactly
# /.well-known/openid-configuration and /openid/v1/jwks, which hold public keys
# only.
#
# The API server must also accept anonymous requests for these two paths.
# Talos turns anonymous authentication off by default, so until it is enabled
# for them this binding grants nothing, and service-account token exchanges
# fail at discovery while GitHub Actions exchanges work.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-unauthenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
