---
# Disposable production-only measurement of the subordinate UID/GID mapping a
# user-namespaced pod receives in the `headlamp` namespace (#2651, acceptance
# criterion 5). It runs in headlamp's own namespace and is scheduled onto the
# node serving headlamp, so it exercises the same admission path and the same
# kubelet as the workload under test.
#
# Why this shape, and not a more direct read of headlamp's own containers:
#
# - `hostUsers` is a POD-level field, so both headlamp containers necessarily
#   share one user namespace. The open question is therefore not per-container;
#   it is whether this cluster's kubelet honours `hostUsers: false` at all, or
#   silently leaves the pod in the host user namespace. A pod that asks for the
#   same thing, in the same namespace, on the same node discriminates exactly
#   that failure mode.
# - Reading `/proc/self/uid_map` inside headlamp needs `exec`, which the
#   maintaining agent's runtime hard-denies and which nobody should hold
#   standing access to for a verification.
# - Inferring the mapping from file ownership on the plugins PVC does NOT work:
#   when the CSI driver supports idmapped mounts the on-disk ownership is left
#   unshifted and the mapping is applied at mount time, so an unshifted reading
#   is ambiguous between "idmapped" and "no user namespace". That probe would
#   produce false negatives, so it is deliberately not used.
#
# What this proves: a pod in the `headlamp` namespace, with headlamp's exact
# runAsUser/runAsGroup identity, on headlamp's node, receives a non-identity
# subordinate mapping. What it does not prove: the specific range assigned to
# the headlamp pod, which differs per pod by design.
#
# The component is deliberately omitted from the parent kustomization until a
# short-lived activation PR, matching userns-longhorn-smoke (#2619). Activate,
# capture the completed Job's logs onto #2651, then remove the component again
# (#2858).
#
# How the result is reported, and why it is not the exit status: the apps Flux
# Kustomization runs `wait: true` with no explicit healthChecks, so kstatus
# evaluates every applied resource and a Job reporting Failed takes the whole
# apps layer not-Ready. The identity map is precisely this probe's designed
# negative result, so an assertion carried by the exit status would let the
# diagnostic wedge the layer it is measuring — which is what kept the
# measurement parked. The container therefore always exits 0 and reports a
# `USERNS-PROBE-VERDICT=` line instead. Nothing consumes the Job's status; the
# log is the deliverable, and the verdict is strictly richer than an exit code
# because it separates a measured identity map from an unreadable one.
#
# Residual risk, stated rather than implied: an infrastructure failure that
# never lets the container run — an image pull failure, or exceeding
# activeDeadlineSeconds — still fails the Job and still blocks the layer. That
# is true of every resource in this overlay and is not specific to the probe;
# what this shape removes is the probe's own negative result as a cause.
apiVersion: batch/v1
kind: Job
metadata:
  name: userns-headlamp-mapping-probe
  namespace: headlamp
  labels:
    app.kubernetes.io/name: userns-headlamp-mapping-probe
    app.kubernetes.io/component: user-namespace-probe
spec:
  # Deliberately no ttlSecondsAfterFinished: the TTL controller deletes the Job
  # AND its pod, and the pod's log is the entire deliverable here. The component
  # is removed by hand once that log is recorded on #2651 (#2858), which is the
  # cleanup path — a TTL would race it and could destroy the measurement.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: userns-headlamp-mapping-probe
        app.kubernetes.io/component: user-namespace-probe
    spec:
      # Explicit rather than inherited: the headlamp namespace is not opted into
      # the namespace-label Kyverno rule (headlamp takes an exact-target values
      # patch instead), so nothing would supply this value.
      hostUsers: false
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Co-locate with the headlamp pod. User-namespace support is a kubelet and
      # node-level capability, so the measurement is only about headlamp's
      # runtime if it is taken on headlamp's node. Expressed as affinity rather
      # than a pinned nodeName so it follows the workload across rollouts.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: headlamp
                  app.kubernetes.io/instance: headlamp
              topologyKey: kubernetes.io/hostname
      securityContext:
        # headlamp's own identity, so the probe runs the way headlamp does rather
        # than as an arbitrary user. It does NOT determine what is measured: an
        # idmap is a property of the pod's user namespace, so /proc/self/uid_map
        # reads identically for every process in it whatever UID that process is.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: read-id-maps
          image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            # Deliberately NOT `-ec`. Under `-e` a field assignment whose
            # command substitution fails — `x="$(… | awk …)"` — aborts the
            # script with that command's status, before any verdict is printed.
            # That is a non-zero exit, so the Job reports Failed and takes the
            # apps layer not-Ready: exactly the outcome this probe's shape
            # exists to prevent, reachable without any bad reading. The script
            # handles its own error paths explicitly instead, and an empty or
            # unparsed field lands on INDETERMINATE, which is the honest result.
            - -c
          args:
            - |
              set -u

              # The reading is reported as a VERDICT LINE and this container
              # always exits 0. The Job is applied into the `apps` Flux
              # Kustomization, which runs `wait: true` with no explicit
              # healthChecks, so kstatus evaluates every applied resource and a
              # Job reporting Failed takes the whole apps layer not-Ready. The
              # identity map is this probe's designed negative result, so
              # asserting it through the exit status would let the diagnostic
              # wedge the layer it is measuring. Nothing consumes the Job's
              # status; the log is the deliverable, and a verdict line carries
              # strictly more than an exit code — it separates "measured, and
              # the mapping is the identity map" from "could not read it".
              #
              # The two path variables are a test seam so the shipped script can
              # be driven against fixtures. The manifest deliberately sets no
              # `env`, so in-cluster the defaults are the only values used.
              uid_map_path="${USERNS_PROBE_UID_MAP:-/proc/self/uid_map}"
              gid_map_path="${USERNS_PROBE_GID_MAP:-/proc/self/gid_map}"

              verdict() {
                printf 'USERNS-PROBE-VERDICT=%s %s\n' "$1" "$2"
                exit 0
              }

              uid_map="$(cat "$uid_map_path" 2>/dev/null || true)"
              gid_map="$(cat "$gid_map_path" 2>/dev/null || true)"

              printf 'running-as=%s:%s\n' "$(id -u)" "$(id -g)"
              printf 'uid_map:\n%s\n' "$uid_map"
              printf 'gid_map:\n%s\n' "$gid_map"

              if [ -z "$uid_map" ] || [ -z "$gid_map" ]; then
                verdict INDETERMINATE 'reason=empty-or-unreadable-id-map'
              fi

              # A /proc/<pid>/uid_map line is "<container-start> <host-start>
              # <length>". Read the host-start column of the first line.
              uid_host_start="$(printf '%s\n' "$uid_map" | awk 'NR == 1 { print $2 }')"
              gid_host_start="$(printf '%s\n' "$gid_map" | awk 'NR == 1 { print $2 }')"
              uid_length="$(printf '%s\n' "$uid_map" | awk 'NR == 1 { print $3 }')"
              gid_length="$(printf '%s\n' "$gid_map" | awk 'NR == 1 { print $3 }')"

              # Reject a non-numeric field BEFORE any arithmetic test. `[ x -gt
              # 0 ]` on a non-integer is an error, and an errored test inside an
              # `if` fails OPEN — which would report a pass for a reading that
              # was never understood.
              for field in "$uid_host_start" "$gid_host_start" "$uid_length" "$gid_length"; do
                case "$field" in
                  '' | *[!0-9]*)
                    verdict INDETERMINATE 'reason=non-numeric-id-map-field'
                    ;;
                esac
              done

              details="uid_host_start=$uid_host_start gid_host_start=$gid_host_start"
              details="$details uid_length=$uid_length gid_length=$gid_length"

              # The acceptance criterion: a non-zero subordinate range on BOTH
              # maps. A pod left in the host user namespace reports the identity
              # map "0 0 4294967295"; the host-start comparisons already reject
              # it, and the width is checked separately so a future kernel
              # reporting a non-zero-based full-width map cannot pass.
              if [ "$uid_host_start" -gt 0 ] && [ "$gid_host_start" -gt 0 ] &&
                [ "$uid_length" -lt 4294967295 ] && [ "$gid_length" -lt 4294967295 ]; then
                verdict NON-IDENTITY "$details"
              fi

              verdict IDENTITY-MAP "$details"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
