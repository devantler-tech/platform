apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookkeeper-dev
resources:
  - ../../../../bases/apps/bookkeeper
patches:
  - target:
      kind: SecretStore
      name: openbao
    patch: |
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: bookkeeper-dev
  - target:
      kind: ExternalSecret
      name: bookkeeper
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: apps/bookkeeper/dev
  - target:
      kind: HelmRelease
      name: bookkeeper
    patch: |
      - op: replace
        path: /spec/values/schedule
        value: "30 6 * * *"
