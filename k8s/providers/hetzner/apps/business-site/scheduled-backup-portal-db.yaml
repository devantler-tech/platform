# The daily base backup of business-site-portal-db to its R2 object store
# (object-store-portal-db.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: business-site-portal-db-daily
  namespace: business-site
spec:
  # 6-field CNPG cron: 03:45 UTC daily.
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: business-site-portal-db
