# Publishes the portal database's CA certificate (public trust material, not a
# secret) to OpenBao apps/business-site/portal-db-ca, where the portal's
# projected Secret reads it (external-secret-runtime.yaml).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: business-site-portal-db-ca
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: business-site-portal-db-server
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: apps/business-site/portal-db-ca
          property: ca
