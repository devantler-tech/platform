# Platform-applied, additive to the tenant's own policies. The portal's web pods:
# their database, the customer Dex's public name (discovery, token exchange),
# ZITADEL's public name (the operator page's service account, which creates and
# deactivates customers) and the mail sender's SES SMTP endpoint (STARTTLS on
# 587) for the portal's emails.
# The migration job has its own, narrower policy
# (cilium-network-policy-portal-migration.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: business-site-portal-egress
  namespace: business-site
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: business-site
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: business-site-portal-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: business-site-dev
            cnpg.io/cluster: portal-preview-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: login.devantler.tech
        - matchName: accounts.devantler.tech
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: email-smtp.eu-central-1.amazonaws.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
