# The portal database's two logins (cluster-portal-db.yaml). Both passwords
# are generated once into OpenBao apps/business-site/portal-db by
# infrastructure/vault-seed (create-only), because the portal's own projected
# Secret (external-secret-runtime.yaml) is assembled from OpenBao and cannot
# read Kubernetes Secrets. CNPG reads the basic-auth pair; the migration job
# reads `database-url`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-migrator
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: business-site-portal-db-migrator
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: portal_migrator
        password: "{{ .password }}"
        database-url: "postgres://portal_migrator:{{ .password }}@business-site-portal-db-rw.business-site.svc:5432/portal?sslmode=verify-full&sslrootcert=/run/portal-migration/ca.crt"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site/portal-db
        property: migrator-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-web
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: business-site-portal-db-web
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: portal_web
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site/portal-db
        property: web-password
