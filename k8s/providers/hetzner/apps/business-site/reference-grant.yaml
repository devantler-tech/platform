# Lets the shared platform Gateway (kube-system) terminate TLS for the
# devantler.tech listeners with the platform-issued certificate.yaml Secret.
# Gateway API refuses a cross-namespace certificateRef without this grant
# (ResolvedRefs=False / RefNotPermitted). It names that one Secret only.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: platform-gateway-devantler-tech-tls
  namespace: business-site
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kube-system
  to:
    - group: ""
      kind: Secret
      name: devantler-tech-tls
