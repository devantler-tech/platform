---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: business-site-portal-db-coroot-monitor
  namespace: business-site
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Coroot's read-only monitoring login (pg_monitor only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-coroot-monitor
  namespace: business-site
spec:
  refreshInterval: "0"
  target:
    name: business-site-portal-db-coroot-monitor
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coroot_monitor
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: business-site-portal-db-coroot-monitor
