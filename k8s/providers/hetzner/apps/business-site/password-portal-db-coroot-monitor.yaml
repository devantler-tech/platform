# Generates the password of Coroot's read-only monitoring login
# (external-secret-portal-db-coroot-monitor.yaml).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: business-site-portal-db-coroot-monitor
  namespace: business-site
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
