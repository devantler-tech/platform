# The business-site WebApp's one projected Secret, assembled on the platform
# side because the WebApp has no environment variables and projects a single
# Secret (/run/webapp-inputs). It carries the public company disclosure and,
# for the portal, its settings file, its Dex client secret, its database CA
# and the send-only SES credential of the site's mail sender (platform#5400),
# which the portal uses for order confirmations and withdrawal receipts
# (business-site#21). The package selects it in its WebApp; until then nothing
# reads it, and the portal sends nothing while its flags are off.
#
# portal-settings is the portal's on/off switch (business-site deploy/README.md,
# "Portal settings and invitations"). Sign-in is on, invite-only, since the
# maintainer chose to switch it on (business-site#302): the five dependency keys
# (the portal database as portal_web over verified TLS, the customer Dex as
# issuer and its business-portal client) and the production identity profile
# with portal-identity enabled. No billing key is set, so orders and payments
# stay off. With these settings the web pods check their database login,
# grants and the migrated schema, and discover the customer Dex, before they
# serve, so the public site now depends on both. The pods read the file only at
# startup: a change here reaches them with the next rollout. To switch sign-in
# off, remove PORTAL_IDENTITY_PROFILE and PORTAL_IDENTITY_FLAG, or every key.
# The directory client is prepared below but remains off until the supporting
# application and its seventh token projection are deployed and verified. Its
# temporary template control is changed only through a reviewed Git activation.
# Retire that control after acceptance as tracked by platform#6445.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-runtime
  namespace: business-site
spec:
  refreshInterval: 1h
  target:
    name: business-site-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        company-disclosure: "{{ .company_disclosure }}"
        portal-settings: |
          {{ $portalCustomerDirectoryEnabled := false }}
          # Portal sign-in is on, invite-only (business-site#302).
          PORTAL_DATABASE_URL=postgres://portal_web:{{ .portal_web_password | urlquery }}@business-site-portal-db-rw.business-site.svc:5432/portal?sslmode=verify-full&sslrootcert=/run/webapp-inputs/portal-database-ca
          PORTAL_OIDC_ISSUER=https://login.devantler.tech
          PORTAL_OIDC_CLIENT_ID=business-portal
          PORTAL_CALLBACK_URL=https://portal.devantler.tech/callback
          PORTAL_CLIENT_SECRET_PROJECTION_FILE=/run/webapp-inputs/portal-client-secret
          PORTAL_IDENTITY_PROFILE=production
          PORTAL_IDENTITY_FLAG={"defaultVariant":"on","variants":[{"name":"on","value":true}]}
          # Requires the released support runtime and both published privacy notices.
          PORTAL_SUPPORT_FLAG={"defaultVariant":"on","variants":[{"name":"on","value":true}]}
          PORTAL_UPSTREAM_END_SESSION_URL=https://accounts.devantler.tech/oidc/v1/end_session
          PORTAL_UPSTREAM_CLIENT_ID=399712320588158469
          {{ if $portalCustomerDirectoryEnabled }}
          PORTAL_ZITADEL_URL=https://accounts.devantler.tech
          PORTAL_ZITADEL_ORG_ID={{ .portal_zitadel_org_id }}
          PORTAL_ZITADEL_TOKEN_PROJECTION_FILE=/run/webapp-inputs/portal-zitadel-token
          {{ end }}
          # The isolated ZITADEL operator linked to GitHub. The portal checks
          # this exact broker subject and its current operator membership.
          PORTAL_OPERATOR_SUBJECTS=CiRjM2JjNGNjNS00NDNmLTRjODYtODRhZS01MTZlMzYyOTY0NTESEGN1c3RvbWVyLXppdGFkZWw
        portal-client-secret: "{{ .portal_client_secret }}"
        portal-zitadel-token: "{{ .portal_zitadel_token }}"
        portal-database-ca: "{{ .portal_database_ca }}"
        smtp-username: "{{ .smtp_username }}"
        smtp-password: "{{ .smtp_password }}"
  data:
    # Produced together by the identity setup and copied by its PushSecret.
    # The shared store already has an exact-record grant in vault-config.
    - secretKey: portal_zitadel_token
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/portal-zitadel
        property: token
    - secretKey: portal_zitadel_org_id
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/portal-zitadel
        property: org-id
    # The tenant's own owner-maintained disclosure, read through its own
    # namespaced store exactly as the package's disclosure ExternalSecret does.
    - secretKey: company_disclosure
      sourceRef:
        storeRef:
          name: openbao
          kind: SecretStore
      remoteRef:
        key: apps/business-site/public-disclosure
        property: company-disclosure
    - secretKey: portal_client_secret
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/customer-identity/portal-client
        property: client-secret
    - secretKey: portal_database_ca
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/portal-db-ca
        property: ca
    # The portal database's runtime login, as external-secret-portal-db-web.yaml
    # reads it for CNPG.
    - secretKey: portal_web_password
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/portal-db
        property: web-password
    # The mail sender's SES SMTP credential, read the same way as ZITADEL's
    # zitadel-smtp: From no-reply@devantler.tech only.
    - secretKey: smtp_username
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/smtp
        property: username
    - secretKey: smtp_password
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/smtp
        property: password
