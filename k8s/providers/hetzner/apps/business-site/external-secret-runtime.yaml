# The business-site WebApp's one projected Secret, assembled on the platform
# side because the WebApp has no environment variables and projects a single
# Secret (/run/webapp-inputs). It carries the public company disclosure and,
# for the portal, its settings file, its Dex client secret and its database
# CA. The package selects it in its WebApp; until then nothing reads it.
#
# portal-settings is the portal's on/off switch. While sign-in is off it holds
# no settings, so the public site never depends on the portal database or the
# customer Dex. Switching on is a reviewed change to this template that adds
# the settings and the production activation profile (business-site#302).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-runtime
  namespace: business-site
spec:
  refreshInterval: 1h
  target:
    name: business-site-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        company-disclosure: "{{ .company_disclosure }}"
        portal-settings: |
          # Portal sign-in is off (business-site#302).
        portal-client-secret: "{{ .portal_client_secret }}"
        portal-database-ca: "{{ .portal_database_ca }}"
  data:
    # The tenant's own owner-maintained disclosure, read through its own
    # namespaced store exactly as the package's disclosure ExternalSecret does.
    - secretKey: company_disclosure
      sourceRef:
        storeRef:
          name: openbao
          kind: SecretStore
      remoteRef:
        key: apps/business-site/public-disclosure
        property: company-disclosure
    - secretKey: portal_client_secret
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/customer-identity/portal-client
        property: client-secret
    - secretKey: portal_database_ca
      sourceRef:
        storeRef:
          name: openbao
          kind: ClusterSecretStore
      remoteRef:
        key: apps/business-site/portal-db-ca
        property: ca
