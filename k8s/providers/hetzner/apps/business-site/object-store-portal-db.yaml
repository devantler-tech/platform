# Off-cluster backups for business-site-portal-db: WAL archiving plus the
# daily base backup below, 30 days of point-in-time recovery.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: business-site-portal-db
  namespace: business-site
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://${r2_bucket}/cnpg/business-site-portal-db
    endpointURL: ${r2_endpoint}
    s3Credentials:
      accessKeyId:
        name: business-site-portal-db-backup-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: business-site-portal-db-backup-r2
        key: SECRET_ACCESS_KEY
      region:
        name: business-site-portal-db-backup-r2
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: business-site-portal-db-daily
  namespace: business-site
spec:
  # 6-field CNPG cron: 03:45 UTC daily.
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: business-site-portal-db
