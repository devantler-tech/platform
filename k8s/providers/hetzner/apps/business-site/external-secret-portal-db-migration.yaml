# The portal migration job's inputs, in the shape business-site's
# server/MIGRATIONS.md requires. The business-site package ships the job beside
# its WebApp, on the release's own image, and mounts this Secret read-only at
# /run/portal-migration (mode 0400), which the URI's sslrootcert names:
# - database-url: the migration login (portal_migrator, password generated into
#   OpenBao apps/business-site/portal-db by infrastructure/vault-seed) over
#   verified TLS to the portal database (cluster-portal-db.yaml);
# - ca.crt: the database's CA certificate, public trust material published to
#   OpenBao by push-secret-portal-db-ca.yaml. The job never references the
#   cert-manager CA Secret, which also holds the CA's private key.
# The job's pods carry app.kubernetes.io/name: business-site-portal-migration,
# which cilium-network-policy-portal-db.yaml admits on 5432 and
# cilium-network-policy-portal-egress.yaml lets reach the database and DNS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-migration
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: business-site-portal-db-migration
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: "postgres://portal_migrator:{{ .password | urlquery }}@business-site-portal-db-rw.business-site.svc:5432/portal?sslmode=verify-full&sslrootcert=/run/portal-migration/ca.crt"
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site/portal-db
        property: migrator-password
    - secretKey: ca
      remoteRef:
        key: apps/business-site/portal-db-ca
        property: ca
