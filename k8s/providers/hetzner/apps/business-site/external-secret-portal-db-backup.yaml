# R2 credentials for business-site-portal-db's Barman Cloud backups, from the
# shared backup key in OpenBao infrastructure/backup/r2.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-backup-r2
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: business-site-portal-db-backup-r2
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
        REGION: "auto"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: infrastructure/backup/r2
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: infrastructure/backup/r2
        property: secret_access_key
