kind: Tenant
metadata:
  name: business-site
  namespace: flux-system
spec:
  name: business-site
  externalDns: false
  sops: false
  webApp: true
  source:
    digest: sha256:5d0832526d3fcb256952365b57318d3b7ad4ed1fbe4521f5e8b2c4fb2f4ec9fc
    publisherRevision: a76d5df9371cf712a8f60307fde060825a34cf35
