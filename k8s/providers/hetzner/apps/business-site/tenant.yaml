# The tenant follows its own signed releases (ADR 0019, monorepo#5094): Flux
# takes the newest stable business-site release signed by the repository's own
# release workflow, so a release goes live with no platform change. The package
# carries the WebApp, its network policy, budget and runtime inputs, the portal
# schema migration Job and the daily retention CronJob, which both read the
# business-site-portal-db-migration Secret (#6372). It serves devantler.tech and
# www (moved off GitHub Pages on 2026-11-15, #6177) and portal.devantler.tech,
# plus the business-site.platform.devantler.tech staging name. Portal sign-in is
# on, invite-only (#6389); payments stay off.
#
# For release recovery, see docs/TENANTS.md.
apiVersion: kro.run/v1alpha1
kind: Tenant
metadata:
  name: business-site
  namespace: flux-system
spec:
  name: business-site
  externalDns: false
  sops: false
  webApp: true
  source:
    reconcileApplication: true
