# WebApp at business-site.platform.devantler.tech, its network policy, budget
# and disclosure input — while the platform-owned staging hold still denies
# gateway traffic. Portal identity and payments stay off, and devantler.tech
# keeps pointing at GitHub Pages until the DNS cutover.
apiVersion: kro.run/v1alpha1
kind: Tenant
metadata:
  name: business-site
  namespace: flux-system
spec:
  name: business-site
  externalDns: false
  sops: false
  webApp: true
  source:
    digest: sha256:083a2dcf9c5ab6d517a4da0c4d4641b6316ad45c2dd0e00976ad8bdbca3b4c85
    publisherRevision: a76d5df9371cf712a8f60307fde060825a34cf35
    reconcileApplication: true
