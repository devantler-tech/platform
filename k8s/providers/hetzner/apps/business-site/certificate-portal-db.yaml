# Ten-year CA and its server certificate for business-site-portal-db
# (cluster-portal-db.yaml). The server Secret also carries the CA's ca.crt,
# which is what clients trust: the portal (through OpenBao, see
# push-secret-portal-db-ca.yaml) and the migration job.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: business-site-portal-db-ca
  namespace: business-site
spec:
  isCA: true
  commonName: business-site-portal-db-ca
  secretName: business-site-portal-db-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: business-site-portal-db-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: business-site-portal-db-server
  namespace: business-site
spec:
  secretName: business-site-portal-db-server
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - business-site-portal-db-rw
    - business-site-portal-db-rw.business-site
    - business-site-portal-db-rw.business-site.svc
    - business-site-portal-db-r
    - business-site-portal-db-r.business-site
    - business-site-portal-db-r.business-site.svc
    - business-site-portal-db-ro
    - business-site-portal-db-ro.business-site
    - business-site-portal-db-ro.business-site.svc
  issuerRef:
    name: business-site-portal-db-ca
    kind: Issuer
    group: cert-manager.io
