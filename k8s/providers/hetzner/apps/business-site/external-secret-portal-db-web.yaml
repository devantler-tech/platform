# The portal database's runtime login, portal_web (cluster-portal-db.yaml). Its
# password comes from OpenBao apps/business-site/portal-db, like the migration
# login's (external-secret-portal-db-migrator.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-site-portal-db-web
  namespace: business-site
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: business-site-portal-db-web
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: portal_web
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: apps/business-site/portal-db
        property: web-password
