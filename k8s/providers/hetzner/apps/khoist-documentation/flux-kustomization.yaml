apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: khoist-documentation
  namespace: data-product-controller
  labels:
    app.kubernetes.io/managed-by: ksail
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 1m
  timeout: 5m
  retryInterval: 2m
  path: ./documentation
  prune: true
  wait: true
  force: false
  serviceAccountName: khoist-documentation
  targetNamespace: data-product-controller
  sourceRef:
    kind: OCIRepository
    name: khoist-documentation
  dependsOn:
    - name: infrastructure
      namespace: flux-system
