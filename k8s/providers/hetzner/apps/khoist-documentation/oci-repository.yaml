apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: khoist-documentation
  namespace: data-product-controller
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  interval: 1m
  url: oci://ghcr.io/devantler-tech/data-product-controller/manifests
  ref:
    digest: sha256:b9b5ff9e0cedf1305528e058708e9729eed9aa39a5dcdd967b7e74197264fe65
  # The artifact is public; verification needs no registry credential.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/actions/\.github/workflows/publish-app\.yaml@ea4df9004d4ab43b6c9af5b0c5f55712f7211328$'
