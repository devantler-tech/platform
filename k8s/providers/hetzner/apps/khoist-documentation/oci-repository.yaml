apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: khoist-documentation
  namespace: data-product-controller
  labels:
    app.kubernetes.io/managed-by: ksail
    platform.devantler.tech/tenant-source: "true"
spec:
  interval: 1m
  # The KHoist release's manifests artifact; the Kustomization applies only its
  # documentation/ directory. Releases up to v6.0.1 used the pre-rename
  # data-product-controller name, which no longer receives releases.
  url: oci://ghcr.io/devantler-tech/khoist/manifests
  # Follows KHoist's own signed release tags (ADR 0019, monorepo#5094): the
  # newest stable `X.Y.Z` release, checked every minute, with no platform change
  # per release. An emergency pin is one exact stable version, `semver: "X.Y.Z"`,
  # in a reviewed pull request.
  ref:
    semver: ">=0.0.0"
    semverFilter: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  # The artifact is public; verification needs no registry credential.
  verify:
    provider: cosign
    matchOIDCIdentity:
      # Keyless-signed by a workflow directly in .github/workflows/ of KHoist's
      # OWN repository on a strict OCI-semver release tag (ADR 0017, ADR 0019):
      # the same grammar as the Tenant graph. Release tags cannot be moved or
      # deleted, and the publish action signs only tags on `main`. The shared
      # publisher, another repository, a branch or a non-release tag does not
      # match.
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/khoist/\.github/workflows/[^/]+\.ya?ml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
