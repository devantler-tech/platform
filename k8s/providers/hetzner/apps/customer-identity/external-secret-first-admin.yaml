# One-time initial password for the instance's first administrator, the
# maintainer (helm-release.yaml FirstInstance). ZITADEL uses it only when it
# creates the instance and forces a change at the first sign-in, where MFA
# enrolment is also required. Read it once with an administrator kubeconfig:
#   kubectl -n customer-identity get secret zitadel-first-admin -o jsonpath='{.data.password}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-first-admin
  namespace: customer-identity
spec:
  refreshInterval: "0"
  target:
    name: zitadel-first-admin
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zitadel-first-admin
