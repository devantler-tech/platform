# DNS-01 certificate for the customer identity names: ZITADEL
# (accounts.devantler.tech) and the portal's customer Dex
# (login.devantler.tech, next change). The Gateway listeners read it through
# reference-grant.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customer-identity
  namespace: customer-identity
spec:
  secretName: customer-identity-tls
  dnsNames:
    - accounts.devantler.tech
    - login.devantler.tech
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
