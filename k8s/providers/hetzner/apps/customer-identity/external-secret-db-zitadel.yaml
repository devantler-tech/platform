# The `zitadel` database owner login. Generated once in-cluster: CNPG creates
# the role and the database with it (cluster.yaml), and ZITADEL reads the same
# password (helm-release.yaml). ZITADEL's state lives in this database and its
# off-cluster backup, so a regenerated password is only a rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-identity-db-zitadel
  namespace: customer-identity
spec:
  refreshInterval: "0"
  target:
    name: customer-identity-db-zitadel
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG reads a role's password from a basic-auth Secret.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: zitadel
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: customer-identity-db-zitadel
