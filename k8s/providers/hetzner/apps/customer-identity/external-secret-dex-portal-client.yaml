# The portal's client secret at the customer Dex (static client
# `business-portal`). Generated once into OpenBao by infrastructure/vault-seed;
# the business-site portal reads the same entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-dex-portal-client
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: customer-dex-portal-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: apps/customer-identity/portal-client
        property: client-secret
