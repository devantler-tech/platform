# Let Coroot's cluster-agent (observability namespace) reach the
# customer-identity-db instances on 5432 for its Postgres integration
# (cluster.yaml). Additive: it admits only the cluster-agent, and only to the
# database pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coroot-postgres-scrape
  namespace: customer-identity
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: customer-identity-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/managed-by: coroot-operator
            app.kubernetes.io/part-of: coroot
            app.kubernetes.io/component: coroot-cluster-agent
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
