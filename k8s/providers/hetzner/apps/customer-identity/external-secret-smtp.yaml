# ZITADEL's mail login: the business site's send-only Amazon SES credential
# (platform#5400), read from OpenBao apps/business-site/smtp through the shared
# store, so no one types it into ZITADEL's console. ZITADEL copies it into its
# own SMTP provider when it creates the instance (helm-release.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-smtp
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: apps/business-site/smtp
        property: username
    - secretKey: password
      remoteRef:
        key: apps/business-site/smtp
        property: password
