# The customer Dex's confidential client in ZITADEL (connector
# `customer-zitadel`, business-site#302). The setup CronJob
# (cron-job-setup.yaml) creates the client in ZITADEL and writes its ID and
# secret here, for the portal's customer Dex to read. A PushSecret keeps a copy
# in OpenBao (push-secret-dex-zitadel-client.yaml).
#
# Flux only creates this placeholder (ssa: IfNotPresent) and never overwrites
# the values the CronJob writes. While it holds the placeholder, nothing can
# sign in through the client.
#
# Not a real secret (literally "PLACEHOLDER"), so it is committed in plaintext,
# like the Velero placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: customer-dex-zitadel-client
  namespace: customer-identity
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  client-id: PLACEHOLDER
  client-secret: PLACEHOLDER  # checkov:skip=CKV_SECRET_6:literal placeholder; the setup CronJob writes the real value
