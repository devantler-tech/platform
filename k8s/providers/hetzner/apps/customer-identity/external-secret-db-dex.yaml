# The customer Dex's database login, owner of `customer_dex` only
# (database-dex.yaml). Generated once in-cluster; CNPG sets the role's password
# from it (cluster.yaml) and Dex reads it (helm-release-dex.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-identity-db-dex
  namespace: customer-identity
spec:
  refreshInterval: "0"
  target:
    name: customer-identity-db-dex
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: customer_dex
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: customer-identity-db-dex
