# Lets the shared platform Gateway (kube-system) terminate TLS for the customer
# identity listeners with certificate.yaml's Secret, and nothing else.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: platform-gateway-customer-identity-tls
  namespace: customer-identity
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kube-system
  to:
    - group: ""
      kind: Secret
      name: customer-identity-tls
