---
# The Devantler Tech logo for ZITADEL's label policy (accounts.devantler.tech
# and its emails). The setup CronJob (cron-job-setup.yaml) owns that policy and
# uploads these files whenever they change or an upload elsewhere replaced them:
#   - logo-light.png and logo-dark.png: the wordmark ("[D]evantlerTech") for
#     light and dark backgrounds;
#   - icon.png: the square icon (a rounded green square with a dark "D"),
#     512 px, for light and dark alike.
# PNG rather than SVG, because email clients do not show SVG images. The vector
# source and every other copy are listed in docs/brand.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-branding
  namespace: customer-identity
binaryData:
  icon.png: 
  logo-dark.png: 
  logo-light.png: 
