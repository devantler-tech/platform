apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-dex-preview-client
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: business-site-preview-dex
    kind: SecretStore
  target:
    name: customer-dex-preview-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: apps/business-site-dev/oidc
        property: client-secret
