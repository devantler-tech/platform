# Coroot's read-only monitoring login for customer-identity-db (pg_monitor only,
# no access to ZITADEL's data). Read only by the scrape annotations in cluster.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-identity-db-coroot-monitor
  namespace: customer-identity
spec:
  refreshInterval: "0"
  target:
    name: customer-identity-db-coroot-monitor
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coroot_monitor
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: customer-identity-db-coroot-monitor
