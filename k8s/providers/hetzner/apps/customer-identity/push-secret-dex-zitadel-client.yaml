# Keeps OpenBao apps/customer-identity/dex-zitadel-client equal to the client
# the setup CronJob wrote (secret-dex-zitadel-client.yaml), as `client-id` and
# `client-secret`. Platform-applied, so it may use the shared store, which
# holds an exact-key grant for this one record (vault-config). Nothing reads
# the copy back: after a rebuild the CronJob issues a new secret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: customer-dex-zitadel-client
  namespace: customer-identity
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 10m
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: customer-dex-zitadel-client
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: apps/customer-identity/dex-zitadel-client
          property: client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: apps/customer-identity/dex-zitadel-client
          property: client-secret
