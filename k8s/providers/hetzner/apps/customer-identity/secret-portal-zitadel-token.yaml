# The personal access token of ZITADEL's business-portal service account, which
# the portal's operator page uses to create, read and deactivate customers. Flux
# creates it once with a placeholder (IfNotPresent) and never overwrites it; the
# setup CronJob (cron-job-setup.yaml) proves the token on every run and writes a
# new one, with its ID as token-id, when it is missing, the placeholder or
# refused, or has fewer than 30 of its 90 days left.
# The same setup keeps org-id equal to its proved Customers organization.
# push-secret-portal-zitadel-token.yaml copies it to OpenBao for the portal.
apiVersion: v1
kind: Secret
metadata:
  name: business-portal-zitadel-token
  namespace: customer-identity
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  token: PLACEHOLDER  # checkov:skip=CKV_SECRET_6:literal placeholder; the setup CronJob writes the real value
