# R2 credentials for customer-identity-db's Barman Cloud backups
# (object-store.yaml). The shared backup key from OpenBao
# infrastructure/backup/r2, the same one Velero and umami-db use; CNPG reads
# s3Credentials only from the Cluster's own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-identity-db-backup-r2
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: customer-identity-db-backup-r2
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
        REGION: "auto"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: infrastructure/backup/r2
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: infrastructure/backup/r2
        property: secret_access_key
