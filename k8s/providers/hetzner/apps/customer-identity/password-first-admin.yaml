---
# Meets ZITADEL's password policy (helm-release.yaml: at least 14 characters
# with upper and lower case, a digit and a symbol).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zitadel-first-admin
  namespace: customer-identity
spec:
  length: 32
  digits: 6
  symbols: 4
  symbolCharacters: "-_.!"
  noUpper: false
  allowRepeat: true
