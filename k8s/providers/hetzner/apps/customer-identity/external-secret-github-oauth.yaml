# The devantler-tech org's public "Devantler Tech" GitHub App, used only for
# sign-in, through which customers may sign in to ZITADEL with GitHub (OpenBao
# apps/customer-identity/github-oauth, stored by the maintainer). Only the
# setup CronJob mounts it, to keep the Customers organization's GitHub
# identity provider configured (cron-job-setup.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-oauth
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/customer-identity/github-oauth
        property: client-id
    - secretKey: client-secret  # checkov:skip=CKV_SECRET_6:names the key in the synced Secret; the value lives in OpenBao
      remoteRef:
        key: apps/customer-identity/github-oauth
        property: client-secret
