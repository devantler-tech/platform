# The platform Dex's shared client secret (OpenBao infrastructure/oidc/dex),
# which ZITADEL presents when it signs its administrator in with GitHub through
# that Dex. Only the setup CronJob mounts it, to keep ZITADEL's identity
# provider configured (cron-job-setup.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-dex-client
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: platform-dex-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret  # checkov:skip=CKV_SECRET_6:names the key in the synced Secret; the value lives in OpenBao
      remoteRef:
        key: infrastructure/oidc/dex
        property: client-secret
