# ZITADEL's master key: it encrypts the signing keys and secrets stored in the
# database, so the database is unusable without it. Generated once into OpenBao
# by infrastructure/vault-seed (create-only), which makes OpenBao its custody
# of record: a rebuilt cluster restores OpenBao first and gets the same key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: apps/customer-identity/zitadel
        property: masterkey
