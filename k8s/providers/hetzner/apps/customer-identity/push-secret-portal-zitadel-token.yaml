# Keeps OpenBao apps/business-site/portal-zitadel equal to the business-portal
# service account's token that the setup CronJob wrote
# (secret-portal-zitadel-token.yaml), as `token`. The business-site runtime
# ExternalSecret reads it from there for the portal's operator page.
# Platform-applied, so it may use the shared store, which holds an exact-key
# grant for this one record (vault-config). A new token replaces the old one at
# the next refresh.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: business-portal-zitadel-token
  namespace: customer-identity
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 10m
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: business-portal-zitadel-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: apps/business-site/portal-zitadel
          property: token
