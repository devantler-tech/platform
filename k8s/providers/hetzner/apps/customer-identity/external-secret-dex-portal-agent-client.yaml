# The machine client's own credential, generated and retained by vault-seed.
# Projected only into customer Dex; the portal verifies signed JWTs using JWKS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-dex-portal-agent-client
  namespace: customer-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: customer-dex-portal-agent-client
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: apps/customer-identity/portal-agent-client
        property: client-secret
