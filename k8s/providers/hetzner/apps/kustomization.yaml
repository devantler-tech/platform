---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/apps/
  # Platform-owned administration; public mail remains separately gated.
  - private-mail/
  # The product owns deploy/documentation; this production-only tenant registers
  # the signed source and an identity limited to its DNS endpoint resources.
  - khoist-documentation/
  # Fetch/verify the exact reviewed publication only; no tenant application.
  - business-site/
  # Prod-only tenant: the UniFi network managed declaratively through Crossplane
  # Managed Resources (providers/hetzner/apps/unifi/). Lives in the hetzner apps
  # overlay because its provider and the controller API it reaches are
  # Hetzner-only. Reconciled by the shared `apps` Flux Kustomization like any
  # tenant.
  - unifi/
  # Prod-only tenant: AWS-as-code via the upbound Crossplane family providers
  # (providers/hetzner/apps/aws/ — platform#2325). Credential plumbing only for
  # now (namespace, SecretStore, bootstrap-IAM ExternalSecret, ProviderConfig);
  # the devantler-tech/aws repo sync lands in a follow-up increment. Hetzner-only
  # because Crossplane (and the provider packages) are prod-only.
  - aws/
  # Owner-only scripted zone trial; public packages need no registry credential fanout.
  - world-at-ruin/
  # Default-off disposable proof for user namespaces + Longhorn idmapped mounts
  # (platform#2599). Activate in a short-lived PR by uncommenting this resource,
  # capture the completed Job's logs, then remove it again so its generic
  # ephemeral PVC and Longhorn volume are garbage-collected.
  # - userns-longhorn-smoke/
  # Prod-only Coroot Postgres integrations for platform-owned databases:
  # the Cluster patches below configure CNPG annotations, roles and extensions.
  # Additive CiliumNetworkPolicies let only the observability cluster-agent
  # scrape each database on 5432.
  # coroot-db needs none — it is intra-namespace to the agent and already
  # covered by the base allow-coroot policy. The wedding-app TENANT owns its own
  # equivalent in its repo's deploy/ (cluster.yaml + networkpolicy.yaml), since
  # tenant DB instrumentation is tenant self-description, not a platform patch.
  - umami/cilium-network-policy.yaml
  - umami/password-coroot-monitor.yaml
  - umami/external-secret-coroot-monitor.yaml
components:
  - ../../../bases/components/annotations-transformers
  # Platform-wide HelmRelease drift detection (mode: enabled) — see
  # bases/components/helmrelease-drift-detection.
  - ../../../bases/components/helmrelease-drift-detection
  - ../../../bases/components/helmrelease-flux-defaults
  # Stateful user-namespace pilot, active for verification (#3604). The runtime
  # verdict is recorded on #3604; rollback removes this one reference, retaining
  # data. Making the setting permanent is a separate change (#3605).
  - actual-budget/components/user-namespaces
# Strategic-merge patch files self-identify (apiVersion/kind/name/namespace), so
# they need only a path — no redundant `target:` selector. JSON6902 patches have
# no embedded identity and keep an explicit target.
patches:
  # Request a controlled CNPG rollout for the existing platform databases.
  # Pod priority is immutable: CREATE admission alone cannot protect them.
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: umami-db
    patch: |
      - op: add
        path: /spec/priorityClassName
        value: hcloud-volume-workload
      # CNPG 1.30.1 compares container environments, but not priorityClassName.
      # This stable marker rolls every old template, regardless of creation time.
      - op: add
        path: /spec/env
        value:
          - name: PLATFORM_DATABASE_PRIORITY_CLASS
            value: hcloud-volume-workload
  # fleetdm disabled 2026-06-03 (see bases/apps/kustomization.yaml). Its
  # prod-only HelmRelease patch (timeout + MySQL primary service address +
  # hcloud storageClass) and the providers/hetzner/apps/fleetdm/ dir were
  # removed with the app: an unreferenced patch fragment is schema-validated
  # standalone by `ksail workload validate`, and a partial HelmRelease (no
  # spec.interval) fails. Restore the patch from git history if re-enabling.
  - path: wedding-app/patches/flux-kustomization-protect-wedding-db.yaml
  # Prod-only Coroot Postgres integration for the in-repo CNPG DBs (strategic
  # merge: inheritedMetadata scrape annotations + pg_stat_statements params).
  # These self-identify, so no target.
  - path: umami/patches/enable-coroot-monitoring.yaml
  # umami's dedicated pg_monitor role is a JSON6902 append onto the existing
  # managed.roles list (so it doesn't replace / desync the OpenBao-rotation enforcer); a
  # JSON6902 patch has no embedded identity, so it keeps an explicit target.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: umami-db
      namespace: umami
    path: umami/patches/grant-pg-monitor.yaml
  # User namespaces (hostUsers: false) — enabled for the proven prod apps. These
  # namespace-label patches opt proven-stateless workloads into the
  # add-security-context Kyverno rule. Local/CI stays out, and so do stateful
  # workloads apart from the Actual Budget pilot component above; in mixed
  # namespaces (umami) the rule itself excludes the
  # CNPG database pods via their cnpg.io/cluster label.
  - path: whoami/patches/enable-user-namespaces.yaml
  - path: homepage/patches/enable-user-namespaces.yaml
