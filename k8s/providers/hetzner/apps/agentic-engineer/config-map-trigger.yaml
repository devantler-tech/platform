# The daily run's trigger. It sends the run message over kagent's A2A API,
# polls the task, and cancels it at the run's time limit: with one Opus run a
# day, wall-clock time is the per-run spend cap, below the Anthropic
# workspace's monthly limit. The message ID is per day, so a retried trigger
# continues the same run instead of starting a second one.
#
# The current message is the canary (devantler-tech/monorepo#4869): it proves
# the model, GitHub and Git paths and changes nothing. The full engineering
# run replaces it once the canary has passed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trigger
  namespace: agentic-engineer
data:
  message.txt: |
    Canary run. Change nothing: create no branch, commit, issue, comment or
    pull request.
    1. Name the model you are running as.
    2. Run `git -c http.extraHeader='Authorization: Basic kagent-credential-injected' ls-remote https://github.com/devantler-tech/monorepo.git HEAD`
       and report the commit it prints.
    3. Shallow-clone that repository the same way and report the first line of
       its AGENTS.md.
    4. Report which of the commands gh, curl, jq and yq exist in your sandbox.
    Reply with a short report of each step and anything that failed.
  trigger.sh: |
    #!/bin/sh
    set -eu
    endpoint=http://kagent-controller.kagent.svc.cluster.local:8083/agents/agentic-engineer/agentic-engineer
    run_id="run-$(date -u +%Y%m%d)"
    deadline=$(( $(date +%s) + RUN_LIMIT_SECONDS ))
    poll="${POLL_SECONDS:-30}"
    message="${MESSAGE_FILE:-/etc/trigger/message.txt}"
    rpc() { # [max seconds, default 60]
      curl -sS --fail-with-body --max-time "${1:-60}" -H 'content-type: application/json' \
        -H 'A2A-Version: 1.0' -H 'X-User-Id: agentic-engineer-scheduler' \
        --data-binary @- "$endpoint"
    }
    get_task() { # [max seconds]
      jq -n --arg id "$id" '{jsonrpc: "2.0", id: "get", method: "GetTask", params: {id: $id}}' | rpc "$@"
    }
    # Seconds left before the run limit; the watch loop never waits past it.
    remaining() {
      echo $(( deadline - $(date +%s) ))
    }
    # An unreadable response is an unknown state, never a reason to stop
    # watching a task that may still be running.
    task_state() {
      printf '%s' "$task" | jq -r '.result.status.state // "unknown"' 2>/dev/null || echo unknown
    }
    # A state the task does not leave on its own: the run has ended.
    terminal() {
      case "$1" in
        *COMPLETED|*FAILED|*CANCELED|*REJECTED|*INPUT_REQUIRED|*AUTH_REQUIRED) return 0 ;;
      esac
      return 1
    }
    task=$(jq -n --arg id "$run_id" --rawfile text "$message" \
      '{jsonrpc: "2.0", id: $id, method: "SendMessage", params: {
         message: {messageId: $id, role: "ROLE_USER", parts: [{text: $text}]},
         configuration: {returnImmediately: true}}}' | rpc)
    id=$(printf '%s' "$task" | jq -er '.result.task.id // .result.id') || {
      echo "no task id in response: $task" >&2
      exit 1
    }
    echo "started $run_id as task $id"
    state=""
    # Each wait and each GetTask is bounded by the time left, so a stalled
    # reply near the limit cannot delay the cancel. The cancel and its
    # confirmation below keep their own timeout.
    while [ "$(remaining)" -gt 0 ]; do
      wait=$(remaining)
      if [ "$wait" -gt "$poll" ]; then wait=$poll; fi
      sleep "$wait"
      left=$(remaining)
      if [ "$left" -lt 1 ]; then break; fi
      task=$(get_task "$left") || continue
      state=$(task_state)
      if terminal "$state"; then break; fi
    done
    if ! terminal "$state"; then
      # The run limit is the per-run spend cap, so a cancel counts only once
      # GetTask shows the task has stopped. A failed or ignored cancel fails
      # the Job (exit 2) instead of reporting a capped run.
      echo "run limit reached in state $state; cancelling"
      attempt=0
      while [ "$attempt" -lt 3 ] && ! terminal "$state"; do
        attempt=$((attempt + 1))
        jq -n --arg id "$id" '{jsonrpc: "2.0", id: "cancel", method: "CancelTask", params: {id: $id}}' | rpc >/dev/null ||
          echo "CancelTask attempt $attempt failed" >&2
        sleep "$poll"
        task=$(get_task) || continue
        state=$(task_state)
      done
      if ! terminal "$state"; then
        echo "cancellation not confirmed after $attempt attempts: task $id is still $state and may still be spending" >&2
        exit 2
      fi
      echo "cancelled at the run limit; the task is now $state"
      state=CANCELED_AT_LIMIT
    fi
    echo "final state: $state"
    printf '%s' "$task" | jq -r '[.result.artifacts[]?.parts[]?.text, .result.status.message.parts[]?.text] | map(select(. != null)) | join("\n")' | tail -c 4000
    case "$state" in *COMPLETED) exit 0 ;; *) exit 1 ;; esac
