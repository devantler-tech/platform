# kagent's Claude Code harness on this namespace's gVisor WorkerPool. Suspended
# sandboxes snapshot to Substrate's in-cluster RustFS store.
#
# GH_TOKEN is a placeholder, not a credential: gh sends it in the
# Authorization header and Substrate's gateway replaces it with a GitHub App
# installation token (egress-policy-github.yaml).
#
# KUBECONFIG names the image's kubeconfig, which points kubectl at the lane's
# read-only cluster view (deployment-cluster-reader.yaml). The image sets it
# too; it is set here as well because the Harness, not the image, decides the
# sandbox's environment.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude
  namespace: agentic-engineer
spec:
  claude: {}
  # The lane's own harness image, pinned by digest as kagent requires: kagent's
  # Claude harness plus the engineer's tools and the whole agentic-engineering
  # plugin (scripts/kagent-claude-harness, devantler-tech/monorepo#4867, #4868).
  # Main publishes and signs it; move this pin after each publish.
  workload:
    image: ghcr.io/devantler-tech/platform-kagent-claude-harness@sha256:e872d3425cde823d814df64f7d7fca767415e1e87e9b3d1906532590e8e6adb5
  substrate:
    workerPoolRef:
      name: agentic-engineer
    snapshotPolicy:
      location: gs://ate-snapshots/agentic-engineer/
  env:
    - name: GH_TOKEN
      value: kagent-credential-injected
    - name: KUBECONFIG
      value: /opt/kagent-lane/kubeconfig
