# The lane store's one credential, generated once in-cluster. The store checks
# it from the htpasswd key, and Substrate's egress gateway sends it from the
# basic key, so the agent only ever sends a placeholder
# (egress-policy-lane-store.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lane-store
  namespace: agentic-engineer
spec:
  refreshInterval: "0"
  target:
    name: lane-store
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: '{{ htpasswd "agentic-engineer" .password "bcrypt" }}'
        basic: '{{ printf "agentic-engineer:%s" .password | b64enc }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: lane-store
