# The workload identity the Anthropic federation rule trusts
# (system:serviceaccount:kagent-credentials:anthropic-federation). Its token is
# projected with the https://api.anthropic.com audience into the proxy pod
# only; the default API token is never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anthropic-federation
  namespace: kagent-credentials
automountServiceAccountToken: false
