# Only the daily trigger reaches kagent's A2A API. The agent itself processes
# untrusted content, so its worker pods get no direct path to the controller.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-agentic-engineer-trigger
  namespace: agentic-engineer
spec:
  endpointSelector:
    matchLabels:
      app: agentic-engineer-trigger
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
