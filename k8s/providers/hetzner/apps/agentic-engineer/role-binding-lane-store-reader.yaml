# Binds the lane store reader Role to the maintainer alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lane-store-reader
  namespace: agentic-engineer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lane-store-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "oidc:${admin_email}"
