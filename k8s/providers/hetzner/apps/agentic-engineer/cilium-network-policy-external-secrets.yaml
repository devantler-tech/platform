# The External Secrets controller mints the lane's GitHub App installation
# token (github-access-token.yaml) by calling the GitHub API itself. Its base
# policy allows only the Kubernetes API, DNS and OpenBao, so without this the
# token request times out and the lane gets no GitHub credential. Only the
# controller pods, only api.github.com, only HTTPS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-external-secrets-github-api
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toFQDNs:
        - matchName: "api.github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # rules.dns activates Cilium's DNS proxy for these pods, so the toFQDNs
    # rule above can learn the addresses api.github.com resolves to.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: "api.github.com"
              - matchPattern: "*.cluster.local"
