# kagent requires an API key Secret for an Anthropic model. The real
# credential is the federated token the Anthropic proxy injects, and the proxy
# drops whatever key the gateway sends, so this random value is never valid.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-placeholder
  namespace: agentic-engineer
spec:
  refreshInterval: "0"
  target:
    name: model-placeholder
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: model-placeholder
