# The organisation, workspace, service account and federation rule IDs the
# token exchange names. They are identifiers, not credentials, but stay in
# OpenBao with the rest of the lane's configuration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-federation
  namespace: kagent-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: anthropic-federation
    creationPolicy: Owner
  data:
    - secretKey: ORGANIZATION_ID
      remoteRef:
        key: apps/kagent/anthropic-federation
        property: organization_id
    - secretKey: WORKSPACE_ID
      remoteRef:
        key: apps/kagent/anthropic-federation
        property: workspace_id
    - secretKey: SERVICE_ACCOUNT_ID
      remoteRef:
        key: apps/kagent/anthropic-federation
        property: service_account_id
    - secretKey: FEDERATION_RULE_ID
      remoteRef:
        key: apps/kagent/anthropic-federation
        property: federation_rule_id
