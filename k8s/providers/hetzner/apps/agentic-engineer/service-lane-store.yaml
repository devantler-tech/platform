# The authenticated WebDAV store the agent reaches through Substrate's egress
# gateway (egress-policy-lane-store.yaml).
apiVersion: v1
kind: Service
metadata:
  name: lane-store
  namespace: agentic-engineer
spec:
  selector:
    app.kubernetes.io/name: lane-store
  ports:
    - name: http
      port: 8080
      targetPort: webdav
      protocol: TCP
