# Worker pods talk only to Substrate (its egress gateway carries the agent's
# traffic; its router and API server reach the workers), and the trigger only
# to kagent's A2A API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-agentic-engineer
  namespace: agentic-engineer
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ate-system
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
