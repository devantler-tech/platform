# The Agentic Engineer's kagent lane (devantler-tech/monorepo#4866): its Agent,
# Harness, model and egress policies, and the Substrate WorkerPool whose gVisor
# worker pods run the agent. The worker pods run as root with SYS_ADMIN and an
# unconfined seccomp profile for the gVisor sandbox they host, so the namespace
# enforces the privileged Pod Security level and is on the platform's
# pod-security exclusion lists. The agent itself runs inside the sandbox.
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-engineer
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
