# Mints the lane's Anthropic access tokens. The Anthropic federation rule
# trusts exactly one subject, this namespace's anthropic-federation service
# account, so only pods here can exchange a cluster identity for model access.
apiVersion: v1
kind: Namespace
metadata:
  name: kagent-credentials
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
