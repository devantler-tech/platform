# The Devantler Tech Engineering GitHub App's private key, which only the
# installation-token generator below reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: agentic-engineer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: github-app
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: apps/kagent
        property: github-app
