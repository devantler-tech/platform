# The installation token in the two forms Substrate's gateway injects
# (egress-policy-github.yaml): as a bearer token for the REST and GraphQL
# APIs, and as HTTP Basic credentials for Git over HTTPS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: agentic-engineer
spec:
  refreshInterval: 30m
  target:
    name: github-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
        basic: '{{ printf "x-access-token:%s" .token | b64enc }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: devantler-tech-engineering
