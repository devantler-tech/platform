# The identity of the lane's read-only view of the cluster (deployment-cluster-reader.yaml). It may
# only get and list what the engineer's live-health check reads (cluster-role- and
# role-agentic-engineer-cluster-reader.yaml): no Secrets, no ConfigMaps, no logs, no writes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-reader
  namespace: agentic-engineer
