apiVersion: v1
kind: ResourceQuota
metadata:
  name: zone-trial
  namespace: world-at-ruin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "1"
    limits.memory: "512Mi"
    pods: "2"
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
