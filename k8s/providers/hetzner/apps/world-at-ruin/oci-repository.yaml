apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: world-at-ruin
  namespace: world-at-ruin
spec:
  interval: 1m
  url: oci://ghcr.io/devantler-tech/world-at-ruin/zone-manifests
  ref:
    # Audited private trial; a new release requires a fresh artifact/profile audit.
    digest: sha256:41734486d53261dcc8a75bdd7736b003f09b471f3d660806f5c631abe9d4e0d8
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/world-at-ruin/\.github/workflows/server-cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
