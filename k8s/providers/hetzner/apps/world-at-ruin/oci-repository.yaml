apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: world-at-ruin
  namespace: world-at-ruin
spec:
  interval: 1m
  url: oci://ghcr.io/devantler-tech/world-at-ruin/zone-manifests
  ref:
    # Earlier packages include a standard NetworkPolicy that tenant-edit cannot apply.
    semver: ">=0.115.1"
    semverFilter: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/devantler-tech/world-at-ruin/\.github/workflows/server-cd\.yaml@refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
