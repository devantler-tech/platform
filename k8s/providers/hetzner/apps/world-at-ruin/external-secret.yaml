# Registry auth is platform-owned; the tenant never sees the shared store identity.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-auth
  namespace: world-at-ruin
  labels:
    app.kubernetes.io/managed-by: ksail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson # checkov:skip=CKV_SECRET_6:the value lives in OpenBao
      remoteRef:
        key: infrastructure/ghcr/auth
        property: dockerconfigjson
