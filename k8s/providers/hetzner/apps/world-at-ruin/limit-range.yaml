apiVersion: v1
kind: LimitRange
metadata:
  name: zone-trial
  namespace: world-at-ruin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "64Mi"
