apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: world-at-ruin
  namespace: world-at-ruin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-edit
subjects:
  - kind: ServiceAccount
    name: world-at-ruin
    namespace: world-at-ruin
