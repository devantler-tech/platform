apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: world-at-ruin
  namespace: world-at-ruin
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 1m
  timeout: 5m
  retryInterval: 2m
  path: .
  prune: true
  force: false
  wait: true
  serviceAccountName: world-at-ruin
  targetNamespace: world-at-ruin
  sourceRef:
    kind: OCIRepository
    name: world-at-ruin
