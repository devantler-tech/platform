---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-actualbudget-data-v2
  namespace: actual-budget
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-v2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
