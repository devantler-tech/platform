# Business Site v3.21.0 preview overlay (source bdbb0d3fc52de0491ca53462a607a794717a17c3).
# Verified manifests package: sha256:892773128c6a2d18aded9f0cd8997790362b7567d1ba7839fc60c2d8d737cf14.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: business-site-dev-migration
  namespace: business-site-dev
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-site-dev-migration
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --migrate
            - --migration-database-projection
            - /run/portal-migration/database-url
            - --runtime-role
            - portal_preview_web
          image: ghcr.io/devantler-tech/business-site@sha256:213e54051c764b86e5feeffdc919d6d427af758add01f9c94e137708a9b15f4e
          name: migrate
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /run/portal-migration
              name: migration
              readOnly: true
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: migration
          secret:
            defaultMode: 256
            items:
              - key: database-url
                path: database-url
              - key: ca.crt
                path: ca.crt
            secretName: business-site-dev-migration
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: tmp
