# Business Site v3.29.0 practice migration (source 26a49c9bced65814ad20d1e79bf0aa7fcd6b201b).
# Verified manifests package: sha256:f78a705ae700ed5b3624f207a576b0b94a9d3c11a1ac6222bb3fdbae528961dc.
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: business-site-dev-migration
  namespace: business-site-dev
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-site-dev-migration
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --migrate
            - --migration-database-projection
            - /run/portal-migration/database-url
            - --runtime-role
            - portal_preview_web
          image: ghcr.io/devantler-tech/business-site@sha256:99890e993b361ec904931afeefe8646838f3c549dee0d8bec15d618c75f80bd8
          name: migrate
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /run/portal-migration
              name: migration
              readOnly: true
            - mountPath: /tmp
              name: tmp
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: migration
          secret:
            defaultMode: 256
            items:
              - key: database-url
                path: database-url
              - key: ca.crt
                path: ca.crt
            secretName: business-site-dev-migration
        - emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          name: tmp
