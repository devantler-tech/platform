# Business Site v3.21.0 preview overlay (source bdbb0d3fc52de0491ca53462a607a794717a17c3).
# Verified manifests package: sha256:892773128c6a2d18aded9f0cd8997790362b7567d1ba7839fc60c2d8d737cf14. Update both workloads together.
apiVersion: kro.run/v1alpha1
kind: WebApp
metadata:
  name: business-site-dev
  namespace: business-site-dev
spec:
  args:
    - --public
    - /app/public
    - --listen
    - 0.0.0.0:8080
    - --company-disclosure-projection
    - /run/webapp-inputs/disclosure
    - --public-host
    - devantler.tech
    - --portal-host
    - dev.devantler.tech
    - --portal-settings-projection
    - /run/webapp-inputs/portal-settings
  cpuLimit: 500m
  cpuRequest: 10m
  host: dev.devantler.tech
  image: ghcr.io/devantler-tech/business-site@sha256:213e54051c764b86e5feeffdc919d6d427af758add01f9c94e137708a9b15f4e
  memoryLimit: 256Mi
  memoryRequest: 64Mi
  name: business-site-dev
  port: 8080
  probePath: /healthz
  readOnlyRootFilesystem: true
  replicas: 1
  runAsGroup: 65532
  runAsUser: 65532
  secretProjections:
    - items:
        - key: company-disclosure
          path: disclosure
        - key: portal-settings
          path: portal-settings
        - key: portal-client-secret
          path: portal-client-secret
        - key: portal-database-ca
          path: portal-database-ca
      secretName: business-site-dev-runtime
