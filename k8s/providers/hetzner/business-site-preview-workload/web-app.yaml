# Business Site v3.19.0 preview overlay (source 5f6913e40811e6d9b6ac3d8e92e87002a9b8a6eb).
# Verified manifests package: sha256:791059e07d91311b6a900e2687f56e67bdc70b718e8766041a70fe8eb5866d13. Update both workloads together.
apiVersion: kro.run/v1alpha1
kind: WebApp
metadata:
  name: business-site-dev
  namespace: business-site-dev
spec:
  args:
    - --public
    - /app/public
    - --listen
    - 0.0.0.0:8080
    - --company-disclosure-projection
    - /run/webapp-inputs/disclosure
    - --public-host
    - devantler.tech
    - --portal-host
    - dev.devantler.tech
    - --portal-settings-projection
    - /run/webapp-inputs/portal-settings
  cpuLimit: 500m
  cpuRequest: 10m
  host: dev.devantler.tech
  image: ghcr.io/devantler-tech/business-site@sha256:5db6b9151405cf68b493414d3c6c5f18810de8e799a780e6a256bc47552ca31a
  memoryLimit: 256Mi
  memoryRequest: 64Mi
  name: business-site-dev
  port: 8080
  probePath: /healthz
  readOnlyRootFilesystem: true
  replicas: 1
  runAsGroup: 65532
  runAsUser: 65532
  secretProjections:
    - items:
        - key: company-disclosure
          path: disclosure
        - key: portal-settings
          path: portal-settings
        - key: portal-client-secret
          path: portal-client-secret
        - key: portal-database-ca
          path: portal-database-ca
      secretName: business-site-dev-runtime
