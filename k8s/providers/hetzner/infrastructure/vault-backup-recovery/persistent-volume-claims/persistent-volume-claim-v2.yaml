---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots-recovery-v2
  namespace: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn-v2
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
