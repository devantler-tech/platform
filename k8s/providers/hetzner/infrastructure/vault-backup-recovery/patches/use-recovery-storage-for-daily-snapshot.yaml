apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: openbao
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots-recovery
          containers:
            - name: mirror
              env:
                - name: REQUIRE_REMOTE_SNAPSHOT
                  value: "true"
