---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots-recovery
  namespace: openbao
  labels:
    # No consumer is switched until this retained claim is owned by main.
    platform.devantler.tech/storage-stage: prepared
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: hcloud
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
