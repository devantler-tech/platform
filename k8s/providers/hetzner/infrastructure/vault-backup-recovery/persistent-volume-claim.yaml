---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots-recovery
  namespace: openbao
  labels:
    backup.platform.devantler.tech/volume-data: independently-mirrored
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: hcloud
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
