apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-wedding-backup-denial
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wedding-backup-denial
      app.kubernetes.io/managed-by: verify-wedding-backup-denial
  egress:
    - toFQDNs:
        - matchPattern: "*.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
