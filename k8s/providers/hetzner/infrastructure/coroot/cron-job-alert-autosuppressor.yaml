# Auto-suppressor for genuinely by-design Coroot alerts.
#
# A few recurring Coroot alerts are NOT bugs in our workloads, they are correct
# behaviour that Coroot surfaces as an error. There is nothing to fix in the
# workload, the control plane, or the platform, so the honest action is a NARROW,
# auditable suppression of just those alerts. Coroot has no declarative per-alert
# or per-pattern exemption (the Coroot CR only has the all-or-nothing
# `disableBuiltinAlerts`; alerting-rule selectors are inclusive-only with no
# negation, and per-alert suppression lives only in the coroot-db Postgres). So
# this CronJob re-asserts the suppressions through the API on a schedule, the same
# self-healing pattern as cron-job-custom-cloud-pricing.yaml: it survives a DR
# restore / coroot-db rebuild and never needs a manual UI click. The in-cluster
# API bypasses oauth2-proxy and is Admin (authAnonymousRole=Admin on the CR), so
# no credential is needed.
#
# The exemption list IS this script (every entry is reviewed via PR). Each entry
# is deliberately narrow and is documented with WHY it is by-design. Never add a
# broad `new-log-patterns` exemption based only on the detail view's Sample field:
# Coroot groups weakly-equal raw patterns under one alert fingerprint, so Sample
# is only a representative and can change while the alert id stays the same. The
# exceptions below are pinned to already-observed alert ids AND revalidate each
# representative on every run; if one changes, the job automatically reopens the
# alert instead of continuing to hide a neighboring pattern.
#
#   1. extensions-host-failed-conns - the `network-tcp-connections` ("failed to
#      connect to N upstream services") warning on `_:Unknown:extensions`. This is
#      NOT a Kubernetes workload: Coroot groups the Talos host-level processes it
#      sees via eBPF but cannot map to a pod into per-node "Unknown" apps, and
#      `extensions` is the Talos system-extension service group (siderolabs/
#      iscsi-tools etc., one instance per node - see spec.cluster.talos.extensions
#      in ksail.prod.yaml).
#      Its failed connections are benign host noise: (a) stale/transient iSCSI
#      (port 3260) sessions to targets Coroot cannot map (`external:3260`) during
#      normal Longhorn volume churn - Longhorn itself stays healthy/attached - and
#      (b) low-rate host->ksail-operator connects that don't complete while
#      ksail-operator is itself fully healthy and reachable (verified: kubelet
#      health probes to it are FORWARDED with zero Cilium drops). Nothing in a Talos
#      host extension is fixable via a manifest, and a genuine storage fault would
#      still surface via Longhorn volume health and the instance-manager apps' own
#      SLOs, so this host-app connectivity signal is the least-actionable place to
#      lose. Scoped to rule_id + the single app id.
#
#   2. kubelet-static-pod-probes - the sibling `network-tcp-connections` warning
#      on `_:Unknown:kubelet`, but ONLY while its complete active-upstream set is
#      kube-scheduler + kube-controller-manager. These are the kubelet's HTTPS
#      health probes against the Talos static pods: three schedulers each have a
#      10s liveness and readiness probe (0.6/s total), and three controller
#      managers each have a 10s liveness probe (0.3/s total). All six pods stay
#      Ready while Coroot classifies the short probe connections as failures.
#      SAFETY: the alert detail is read before suppression and every chart series
#      with a positive sample must be one of those exact two names. Any new active
#      upstream keeps the alert visible, even though Coroot reuses the same alert
#      fingerprint for all kubelet TCP failures.
#
#   3. auto-vpa-write-conflict - Kyverno's auto-vpa generate rule and the VPA
#      controller can update the same generated VPA resourceVersion at once.
#      Kubernetes rejects the stale write, Kyverno retries from the latest object,
#      and the VPA remains present and current. Only that exact optimistic-lock
#      message and the exact ClusterPolicy/auto-vpa/PolicyError labels qualify;
#      authorization, validation, and all other policy errors remain visible.
#
#   4. flux-status-context-canceled - the production image-verification handoff
#      intentionally restarts kustomize-controller after suspending reconciliation,
#      terminating in-flight status writes. A canceled status write is retried by
#      the replacement leader and does not describe the Kustomization's health.
#      Only Kustomization Progressing/HealthCheckFailed events from
#      kustomize-controller with the two exact cancellation message shapes qualify;
#      timeouts, apply errors, and dependency failures remain visible.
#
#   5. crossview-monitor-secret-create-race - Coroot and External Secrets can race
#      to create the generated crossview-postgres-coroot-monitor Secret during a
#      database roll. The loser reports AlreadyExists, then the ExternalSecret
#      immediately reaches Ready/SecretSynced and continues owning the target.
#      Only that exact object, reason, source, and AlreadyExists message qualify;
#      forbidden, refresh, provider, and all other ExternalSecret errors remain.
#
#   6. cilium-dns-search-expansion - Cilium's DNS proxy aggregates resolver
#      attempts from every workload into the Cilium DaemonSet application. The
#      observed NXDOMAINs are Kubernetes search-list candidates (including the
#      synthetic `.search_path_suffix` form) followed by successful canonical
#      lookups; the same report shows DNS latency and server errors healthy. This
#      exempts only dns-nxdomain-errors on that exact application. Cilium DNS
#      server errors, latency, and NXDOMAINs attributed to any other app remain.
#
#   7. replicaset-consistency-requeue - Kubernetes 1.36's
#      StaleControllerConsistencyReplicaSet guard intentionally refuses to act
#      until its informer has observed the resourceVersion the controller just
#      wrote, then rate-limits and requeues the ReplicaSet. Production shows the
#      exact upstream message during rapid rollouts and every affected Deployment
#      converges. Coroot can group weakly-equal patterns, so this is bound to the
#      one existing alert id plus its exact app/rule/message shape. A changed
#      representative is automatically REOPENED on the next run.
#
#   8. historical-alertmanager-dns-record - alert wge5tiucp7k5 contains two DNS
#      server errors last updated 2026-08-27. The current Alertmanager pod has no
#      DNS or error recurrence. Suppress only that immutable record (id, app,
#      rule, and timestamps); a future Alertmanager DNS alert gets a new id and
#      remains visible.
#
#   9. kubelet-sandbox-resize-unimplemented - Talos' kubelet asks containerd
#      2.2.7 to update pod-sandbox resources, and the runtime returns the CRI
#      `Unimplemented` status. Live logs across every worker show only that exact
#      unsupported optional call, with no restart or unavailable pod. Pin the
#      exemption to the one Coroot fingerprint and its exact representative;
#      other kubelet/runtime errors remain visible.
#
#  10. kubelet-removed-container-cleanup - kubelet can discover that containerd
#      already removed a terminated container between its status lookup and
#      deletion pass. The paired production messages contain CRI `NotFound`, then
#      kubelet continues volume cleanup; all nodes and workloads remain Ready.
#      Pin both representative messages to their existing fingerprints. A
#      different cleanup error automatically reopens either alert.
#
#  11. apiserver-client-cancel - clients canceled read-only requests while the
#      protected deployment polled convergence. The API server reports the
#      cancellation as a non-Status error even though the client has already
#      gone away. Current `/readyz?verbose` passes every check, Flux converged,
#      and etcd retained quorum. Pin the exact context-canceled fingerprint; a
#      different representative automatically becomes visible.
#
#  12. apiserver-millisecond-post-timeout - after those canceled GETs, the
#      handler completed only a few milliseconds after the response timeout.
#      This exemption requires the existing fingerprint, GET, null result, and
#      a millisecond (never second) tail. Writes, slower completions, and every
#      other API-server log pattern remain visible.
#
# PROD-ONLY: Coroot alerting (the Slack webhook) is wired only in the hetzner
# overlay, so this lives here, not in the base.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coroot-alert-autosuppressor
  namespace: observability
spec:
  # Every 15m: an exempted alert still fires its first notification when it opens,
  # then this suppresses it within one interval so it stops re-notifying. The
  # schedule IS the retry loop (backoffLimit 0 + restartPolicy Never).
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Backstop for a hung run; well above the worst-case curl retry budget.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: coroot-alert-autosuppressor
        spec:
          restartPolicy: Never
          # No Kubernetes API access is needed (HTTP-only to the Coroot service).
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            # fsGroupChangePolicy and seLinuxOptions are the two non-privilege C-0211
            # fields the cluster-wide add-security-context mutation cannot supply
            # here: observability is excluded from it, and the namespace opt-in
            # mutates the running POD, while Kubescape scores the STORED workload
            # spec (#3239). Writing them into the template is the only route that
            # moves both surfaces. Values match add-security-context.yaml.
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: autosuppressor
              # curl + jq, digest-pinned (same image as custom-cloud-pricing).
              # observability is exempt from disallow-latest-tag.
              image: docker.io/badouralix/curl-jq:latest@sha256:1e7c0284e24572ace7170df9fc91f15fd3b79ebf056d4dde17244d5d74bbfabc
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                # CIS-5.7.3 (C-0211); a documented no-op on this AppArmor cluster.
                seLinuxOptions: {}
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  BASE="http://coroot-coroot.observability.svc.cluster.local:8080"
                  # This short-lived pod can race endpoint readiness or transient
                  # CNI convergence, so retry connection/setup errors.
                  RETRY="-sS --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused --max-time 30"

                  # Resolve the operator-created 'platform' project id (a random
                  # NanoId, so match by name) - robust to response-shape changes.
                  PID=$(curl $RETRY "$BASE/api/user" | jq -r '[.. | objects | select(.name=="platform" and has("id")) | .id] | first // empty')
                  [ -n "$PID" ] || { echo "ERROR: could not resolve 'platform' project id"; exit 1; }

                  # The default list is the firing-alert surface. Do NOT request
                  # include_resolved here: production has >31k historical records,
                  # so a 500-row history page can omit old-but-still-firing alerts.
                  ALERTS=$(curl $RETRY "$BASE/api/project/$PID/alerts?limit=500")

                  # Pinned weak-equality log fingerprints need direct reads so
                  # their suppressed records remain available for revalidation
                  # without depending on list ordering or history pagination.
                  PINNED_LOG_ALERTS=$(
                    for id in \
                      to3d0cyc7cnn \
                      tww9bz3fo4je \
                      9qrrrlq3eooh \
                      7f3auk0cezgo \
                      h9q7onv4l20i \
                      0konif35mxxn; do
                      curl $RETRY "$BASE/api/project/$PID/alerts/$id"
                    done | jq -s '{data: {alerts: map(.data // empty)}}'
                  )
                  ALERTMANAGER_DNS_ALERT=$(curl $RETRY "$BASE/api/project/$PID/alerts/wge5tiucp7k5")
                  ids=""
                  reopen_ids=""

                  # Exemption 1 - Talos host system-extension group benign failed
                  # TCP connections (see header entry 1). Coroot-synthesised non-k8s
                  # host app, so a genuine fault surfaces elsewhere (Longhorn volume
                  # health, instance-manager SLOs), not here.
                  for id in $(printf '%s' "$ALERTS" | jq -r '.data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and .rule_id=="network-tcp-connections"
                               and ((.application_id // "") | endswith(":_:Unknown:extensions")))
                      | .id'); do
                    ids="$ids $id"; echo "match extensions-host-failed-conns: $id"
                  done

                  # Exemption 2 - kubelet health probes to the static scheduler
                  # and controller-manager pods. Refuse the exemption if ANY
                  # other upstream has a positive sample in the failed-TCP chart.
                  for id in $(printf '%s' "$ALERTS" | jq -r '.data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and .rule_id=="network-tcp-connections"
                               and ((.application_id // "") | endswith(":_:Unknown:kubelet")))
                      | .id'); do
                    active=$(curl $RETRY "$BASE/api/project/$PID/alerts/$id" | jq -c '
                      [.data.widgets[]? | .chart?
                       | select(.title=="Failed TCP connections, per second")
                       | .series[]?
                       | select(.data | any(.[]?; type=="number" and . > 0))
                       | .name] | unique | sort')
                    if [ "$active" = '["→kube-controller-manager","→kube-scheduler"]' ]; then
                      ids="$ids $id"; echo "match kubelet-static-pod-probes: $id"
                    else
                      echo "keep kubelet TCP alert visible; active upstreams: $active"
                    fi
                  done

                  # Exemption 3 - a generated VPA optimistic-lock race. Coroot's
                  # Kubernetes-event Labels detail is newline-delimited and
                  # sorted; require the complete exact label set before checking
                  # the narrow retryable message shape.
                  for id in $(printf '%s' "$ALERTS" | jq -r '
                      def details: (.details // [] | map({key: .name, value: .value}) | from_entries);
                      def labels($d): ($d.Labels | split("\n") | map(capture("^(?<key>[^=]+)=\"(?<value>.*)\"$")) | from_entries);
                      .data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and .rule_id=="kubernetes-events")
                      | details as $d
                      | labels($d) as $l
                      | select(($l | keys | sort) == ["cluster","kind","name","reason"]
                               and $l.cluster=="platform"
                               and $l.kind=="ClusterPolicy"
                               and $l.name=="auto-vpa"
                               and $l.reason=="PolicyError"
                               and ($d["Event message"] | startswith("policy auto-vpa/generate-vpa-for-"))
                               and ($d["Event message"] | contains("Operation cannot be fulfilled on verticalpodautoscalers.autoscaling.k8s.io"))
                               and ($d["Event message"] | endswith("the object has been modified; please apply your changes to the latest version and try again")))
                      | .id'); do
                    ids="$ids $id"; echo "match auto-vpa-write-conflict: $id"
                  done

                  # Exemption 4 - canceled Flux Kustomization status writes from
                  # the intentional credential-handoff controller restart.
                  for id in $(printf '%s' "$ALERTS" | jq -r '
                      def details: (.details // [] | map({key: .name, value: .value}) | from_entries);
                      def labels($d): ($d.Labels | split("\n") | map(capture("^(?<key>[^=]+)=\"(?<value>.*)\"$")) | from_entries);
                      .data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and .rule_id=="kubernetes-events")
                      | details as $d
                      | labels($d) as $l
                      | select(($l | keys | sort) == ["cluster","kind","name","namespace","reason","source"]
                               and $l.cluster=="platform"
                               and $l.kind=="Kustomization"
                               and $l.namespace=="flux-system"
                               and ($l.reason=="Progressing" or $l.reason=="HealthCheckFailed")
                               and $l.source=="kustomize-controller"
                               and (($d["Event message"] == "failed to update status: context canceled")
                                    or ($d["Event message"]
                                      | test("^unable to update the healthy status to progressing: \\[.*fieldManager=gotk-kustomize-controller.*context canceled, context canceled\\]$"))))
                      | .id'); do
                    ids="$ids $id"; echo "match flux-status-context-canceled: $id"
                  done

                  # Exemption 5 - the exact ExternalSecret target-creation race
                  # during Crossview PostgreSQL reconciliation.
                  for id in $(printf '%s' "$ALERTS" | jq -r '
                      def details: (.details // [] | map({key: .name, value: .value}) | from_entries);
                      def labels($d): ($d.Labels | split("\n") | map(capture("^(?<key>[^=]+)=\"(?<value>.*)\"$")) | from_entries);
                      .data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and .rule_id=="kubernetes-events")
                      | details as $d
                      | labels($d) as $l
                      | select(($l | keys | sort) == ["cluster","kind","name","namespace","reason","source"]
                               and $l.cluster=="platform"
                               and $l.kind=="ExternalSecret"
                               and $l.name=="crossview-postgres-coroot-monitor"
                               and $l.namespace=="crossview"
                               and $l.reason=="UpdateFailed"
                               and $l.source=="external-secrets"
                               and $d["Event message"]=="secrets \"crossview-postgres-coroot-monitor\" already exists")
                      | .id'); do
                    ids="$ids $id"; echo "match crossview-monitor-secret-create-race: $id"
                  done

                  # Exemption 6 - Kubernetes resolver search-list candidates
                  # observed by Cilium's cluster-wide DNS proxy. Preserve every
                  # other DNS check and every other application's NXDOMAINs.
                  for id in $(printf '%s' "$ALERTS" | jq -r '.data.alerts[]
                      | select(.suppressed==false and .resolved_at==null
                               and .rule_id=="dns-nxdomain-errors"
                               and ((.application_id // "") | endswith(":kube-system:DaemonSet:cilium")))
                      | .id'); do
                    ids="$ids $id"; echo "match cilium-dns-search-expansion: $id"
                  done

                  # Exemptions 7 and 9-12 - exact weak-equality log fingerprints.
                  # Every ID and current representative must qualify; a changed
                  # representative is reopened below instead of remaining hidden.
                  for id in $(printf '%s' "$PINNED_LOG_ALERTS" | jq -r '
                      def details: (.details // [] | map({key: .name, value: .value}) | from_entries);
                      def consistency_sample($s):
                        ($s | test("^E[0-9]{4} [0-9:.]+ +1 replica_set\\.go:640\\] "))
                        and ($s | contains("\"Unhandled Error\" err=\"sync \\\""))
                        and ($s | contains("\" failed with read version: "))
                        and ($s | test(" is not as new as written version: [0-9]+ for group resource replicasets\\.apps\" logger=\"UnhandledError\"$"));
                      def pinned_log_sample:
                        details as $d
                        | (.rule_id=="new-log-patterns")
                        and (
                          (.id=="to3d0cyc7cnn"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-controller-manager"))
                           and consistency_sample($d.Sample // ""))
                          or
                          (.id=="tww9bz3fo4je"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and ($d.Sample // "")=="UpdatePodSandboxResources from runtime service failed")
                          or
                          (.id=="9qrrrlq3eooh"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and (($d.Sample // "") | test("^ContainerStatus for \\\"[0-9a-f]{64}\\\" failed$")))
                          or
                          (.id=="7f3auk0cezgo"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and ($d.Sample // "")=="DeleteContainer returned error")
                          or
                          (.id=="h9q7onv4l20i"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-apiserver"))
                           and (($d.Sample // "") | test("^E[0-9]{4} [0-9:.]+ +1 status\\.go:71\\] "))
                           and (($d.Sample // "") | contains("apiserver received an error that is not an metav1.Status"))
                           and (($d.Sample // "") | contains("errors.errorString{s:\\\"context canceled\\\"}: context canceled"))
                           and (($d.Sample // "") | endswith("\" logger=\"UnhandledError\"")))
                          or
                          (.id=="0konif35mxxn"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-apiserver"))
                           and (($d.Sample // "") | test("^E[0-9]{4} [0-9:.]+ +1 timeout\\.go:140\\] "))
                           and (($d.Sample // "") | contains("\"Post-timeout activity\" logger=\"UnhandledError\""))
                           and (($d.Sample // "") | test(" timeElapsed=\"[0-9.]+ms\" method=\"GET\" path=\"/apis/[^\"]+\" result=null$")))
                        );
                      .data.alerts[]
                      | select(.suppressed==false and .resolved_at==null and pinned_log_sample)
                      | .id'); do
                    case "$id" in
                      to3d0cyc7cnn) reason="replicaset-consistency-requeue" ;;
                      tww9bz3fo4je) reason="kubelet-sandbox-resize-unimplemented" ;;
                      9qrrrlq3eooh|7f3auk0cezgo) reason="kubelet-removed-container-cleanup" ;;
                      h9q7onv4l20i) reason="apiserver-client-cancel" ;;
                      0konif35mxxn) reason="apiserver-millisecond-post-timeout" ;;
                    esac
                    ids="$ids $id"; echo "match $reason: $id"
                  done

                  for id in $(printf '%s' "$PINNED_LOG_ALERTS" | jq -r '
                      def details: (.details // [] | map({key: .name, value: .value}) | from_entries);
                      def consistency_sample($s):
                        ($s | test("^E[0-9]{4} [0-9:.]+ +1 replica_set\\.go:640\\] "))
                        and ($s | contains("\"Unhandled Error\" err=\"sync \\\""))
                        and ($s | contains("\" failed with read version: "))
                        and ($s | test(" is not as new as written version: [0-9]+ for group resource replicasets\\.apps\" logger=\"UnhandledError\"$"));
                      def pinned_log_sample:
                        details as $d
                        | (.rule_id=="new-log-patterns")
                        and (
                          (.id=="to3d0cyc7cnn"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-controller-manager"))
                           and consistency_sample($d.Sample // ""))
                          or
                          (.id=="tww9bz3fo4je"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and ($d.Sample // "")=="UpdatePodSandboxResources from runtime service failed")
                          or
                          (.id=="9qrrrlq3eooh"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and (($d.Sample // "") | test("^ContainerStatus for \\\"[0-9a-f]{64}\\\" failed$")))
                          or
                          (.id=="7f3auk0cezgo"
                           and ((.application_id // "") | endswith(":_:Unknown:init"))
                           and ($d.Sample // "")=="DeleteContainer returned error")
                          or
                          (.id=="h9q7onv4l20i"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-apiserver"))
                           and (($d.Sample // "") | test("^E[0-9]{4} [0-9:.]+ +1 status\\.go:71\\] "))
                           and (($d.Sample // "") | contains("apiserver received an error that is not an metav1.Status"))
                           and (($d.Sample // "") | contains("errors.errorString{s:\\\"context canceled\\\"}: context canceled"))
                           and (($d.Sample // "") | endswith("\" logger=\"UnhandledError\"")))
                          or
                          (.id=="0konif35mxxn"
                           and ((.application_id // "") | endswith(":kube-system:StaticPods:kube-apiserver"))
                           and (($d.Sample // "") | test("^E[0-9]{4} [0-9:.]+ +1 timeout\\.go:140\\] "))
                           and (($d.Sample // "") | contains("\"Post-timeout activity\" logger=\"UnhandledError\""))
                           and (($d.Sample // "") | test(" timeElapsed=\"[0-9.]+ms\" method=\"GET\" path=\"/apis/[^\"]+\" result=null$")))
                        );
                      .data.alerts[]
                      | select(.suppressed==true and (pinned_log_sample | not))
                      | .id'); do
                    reopen_ids="$reopen_ids $id"; echo "reopen changed pinned log pattern: $id"
                  done

                  # Exemption 8 - only the old, non-recurring Alertmanager record.
                  # Exact timestamps prevent this clause from becoming a rule-level
                  # DNS exemption if Coroot ever reuses or migrates identifiers.
                  for id in $(printf '%s' "$ALERTMANAGER_DNS_ALERT" | jq -r '.data
                      | select(.id=="wge5tiucp7k5" and .suppressed==false and .resolved_at==null
                               and .rule_id=="dns-server-errors"
                               and ((.application_id // "") | endswith(":kubescape:StatefulSet:alertmanager"))
                               and .opened_at==1787841164000
                               and .updated_at==1787846982000)
                      | .id'); do
                    ids="$ids $id"; echo "match historical-alertmanager-dns-record: $id"
                  done

                  reopen_n=$(echo $reopen_ids | wc -w)
                  if [ "$reopen_n" -gt 0 ]; then
                    payload=$(printf '%s\n' $reopen_ids | jq -R . | jq -s '{ids: .}')
                    curl $RETRY -X POST -H 'Content-Type: application/json' -d "$payload" "$BASE/api/project/$PID/alerts/reopen" >/dev/null \
                      && echo "reopened $reopen_n changed exemption(s)"
                  fi

                  n=$(echo $ids | wc -w)
                  if [ "$n" -gt 0 ]; then
                    payload=$(printf '%s\n' $ids | jq -R . | jq -s '{ids: .}')
                    curl $RETRY -X POST -H 'Content-Type: application/json' -d "$payload" "$BASE/api/project/$PID/alerts/suppress" >/dev/null \
                      && echo "suppressed $n by-design alert(s)"
                  else
                    echo "no by-design alerts to suppress"
                  fi
