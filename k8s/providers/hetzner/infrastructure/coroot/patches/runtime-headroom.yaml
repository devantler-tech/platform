apiVersion: apps/v1
kind: Deployment
metadata:
  name: coroot-security-progress
  namespace: observability
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [prod-worker-1]
              - matchExpressions:
                  - key: storage.platform.devantler.tech/migration-pool
                    operator: In
                    values: [v2]
