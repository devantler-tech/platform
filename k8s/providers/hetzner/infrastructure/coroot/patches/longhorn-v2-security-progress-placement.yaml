---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coroot-security-progress
  namespace: observability
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [prod-worker-1, prod-worker-2]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: storage.platform.devantler.tech/migration-pool
                    operator: In
                    values: [v2]
