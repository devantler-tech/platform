# The alerter compares node names with the declared autoscaler pools. It lists
# nodes and nothing else: it cannot cordon, drain, delete or read any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stranded-autoscaler-node-alerter
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
