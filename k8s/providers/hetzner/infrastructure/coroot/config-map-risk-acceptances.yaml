# Reviewed Coroot availability-risk acceptances for platform#3812.
#
# This is an allowlist, not a snapshot of everything Coroot currently reports.
# Each entry binds one application identity (without Coroot's generated cluster
# id) to one exact risk key and records why adding replicas would cost more or
# make the workload less safe without improving its declared recovery objective.
# The reconciler dismisses only these pairs. A newly named workload, a new risk
# type, or a new application therefore stays active for investigation.
#
# The three remediated workloads are deliberately absent: Alertmanager and the
# Longhorn CSI snapshotter get warm replicas, while Origin CA Issuer is disabled.
# crossview-postgres is also absent: its unreplicated-database CRITICAL remains
# visible until platform#3319 delivers and verifies durable storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coroot-risk-acceptances
  namespace: observability
data:
  risks.json: |
    [
      {
        "application": "actual-budget:Deployment:actual-budget-actualbudget",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: RWO SQLite data; pod rescheduling and restore meet its recovery objective"
      },
      {
        "application": "backstage:Deployment:backstage",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: single-writer state and migration safety; rescheduling meets its recovery objective"
      },
      {
        "application": "kube-system:Deployment:cluster-autoscaler-hetzner-cluster-autoscaler",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: control-loop singleton off the serving path; workloads continue on existing nodes"
      },
      {
        "application": "observability:Deployment:coroot-cluster-agent",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: duplicate cluster agents would double-ingest telemetry; the Coroot server remains HA"
      },
      {
        "application": "observability:Deployment:coroot-operator",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: reconciler is off the serving path; Kubernetes restarts it from retained desired state"
      },
      {
        "application": "observability:Deployment:coroot-prometheus",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: embedded metrics store has no deduplicating HA pair; Coroot server and database remain HA"
      },
      {
        "application": "crossplane-system:Deployment:crossplane",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: single external-state reconciler avoids concurrent writes; managed workloads keep serving"
      },
      {
        "application": "crossplane-system:Deployment:crossplane-rbac-manager",
        "category": "Availability",
        "type": "single-instance-app",
        "reason": "platform#3812: single RBAC reconciler avoids concurrent writes and is off the workload serving path"
