---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: set-longhorn-benchmark-retirement-context
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Longhorn benchmark retirement runtime
    policies.kyverno.io/category: Storage
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Preserve the host runtime identity for the temporary, already privileged
      Longhorn instance manager that retires benchmark scratch.
spec:
  background: false
  failurePolicy: Fail
  rules:
    - name: use-host-runtime-identity
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [longhorn-system]
              names: ["instance-manager-*"]
              operations: [CREATE]
              selector:
                matchLabels:
                  longhorn.io/component: instance-manager
      preconditions:
        all:
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: Equals
            value: longhorn-service-account
          - key: "{{ length(request.object.metadata.ownerReferences || `[]`) }}"
            operator: Equals
            value: 1
          - key: "{{ request.object.metadata.ownerReferences[0].apiVersion || '' }}"
            operator: Equals
            value: longhorn.io/v1beta2
          - key: "{{ request.object.metadata.ownerReferences[0].kind || '' }}"
            operator: Equals
            value: InstanceManager
          - key: "{{ request.object.metadata.ownerReferences[0].name || '' }}"
            operator: Equals
            value: "{{ request.object.metadata.name }}"
          - key: "{{ request.object.metadata.ownerReferences[0].controller || `false` }}"
            operator: Equals
            value: true
          - key: "{{ length(request.object.spec.containers) }}"
            operator: Equals
            value: 1
          - key: "{{ request.object.spec.containers[0].name || '' }}"
            operator: Equals
            value: instance-manager
          - key: "{{ request.object.spec.containers[0].image || '' }}"
            operator: Equals
            value: ghcr.io/devantler-tech/platform-longhorn-instance-manager:v1.13.0-retirement.1-725bb1d09517c84f8b73ff2c0cf175421df351f1-1@sha256:93cfc83d8bab91f9b6fbffe20bf9bdaca28e877d91d7b740cae003bf6853059f
          - key: "{{ request.object.spec.containers[0].securityContext.privileged || `false` }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): instance-manager
                securityContext:
                  +(runAsUser): 0
                  +(runAsGroup): 0
                  +(runAsNonRoot): false
