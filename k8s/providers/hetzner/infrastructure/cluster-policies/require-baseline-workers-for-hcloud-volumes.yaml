# Prod-only: refuse any Pod that mounts an hcloud volume unless it is pinned to
# the static baseline workers.
#
# WHY: an hcloud block volume attaches to exactly one node and is not
# force-detached when that node departs. A volume on an autoscaler node is
# stranded the moment the autoscaler reclaims the node; on 2026-07-01 a
# stranded OpenBao volume wedged the prod merge queue for ~9h (#2363).
#
# WHY AT ADMISSION: the per-workload guards (scripts/tests/
# test-hcloud-baseline-worker-affinity.sh) cover the consumers that exist
# today, but only the ones that test knows by name. The next chart that
# requests an hcloud PVC, and any workload rendered from a HelmRelease that CI
# never sees as a Pod, would be exposed with nothing to catch it (#3287). This
# policy checks every Pod the Kyverno webhook sees.
#
# WHAT COUNTS AS GUARDED: a Pod that sets spec.nodeName bypasses the scheduler,
# so nodeSelector and affinity do not apply to it. Such a Pod is guarded only
# when nodeName is a prod-worker-* node. Otherwise, with no nodeName, either:
#   * spec.nodeSelector sets platform.devantler.tech/baseline-worker: "true"
#     (nodeSelector is ANDed with affinity, so it is sufficient on its own); or
#   * the Pod has at least one required nodeSelectorTerm, and EVERY term
#     carries one of:
#       - platform.devantler.tech/baseline-worker In ["true"] — the positive
#         label stamped by label-baseline-workers; or
#       - kubernetes.io/hostname In [...] with every value prod-worker-* — for
#         OpenBao, which deploys before the label policies exist on a rebuilt
#         cluster.
# Terms are ORed, so a single term without the guard fails open; that is why
# every term is checked. A `ksail.io/autoscaled DoesNotExist` rule is NOT a
# guard: measured on prod 2026-09-13, autoscaler nodes do not carry that label.
# The `prod-worker-` prefix is the same name discriminator label-baseline-workers
# uses; a Hetzner cluster with another name needs both policies changed together.
#
# WHAT COUNTS AS AN hcloud VOLUME: a persistentVolumeClaim whose claim has
# storageClassName hcloud (looked up from the API), or a generic ephemeral
# volume that names hcloud directly. The cluster default class is Longhorn,
# so an ephemeral volume without a class is out of scope.
#
# KNOWN LIMITS:
#   * Kyverno's webhook skips the kube-system and kyverno namespaces, so Pods
#     there are not checked.
#   * A claim bound by volumeName to a pre-created hcloud PV without naming the
#     hcloud class is not recognised. Only the `hcloud` class exists today.
#   * A claim that does not exist yet when its Pod is created cannot be judged.
#     The StatefulSet controller, Flux and Helm all create claims before Pods.
#
# HOW CLAIMS ARE READ: each policy lists the Pod's namespace's claims once
# (resource.List) and matches the mounted claims by name. A claim missing from
# that list is not judged by the Deny policy; report-hcloud-claim-lookup-failure
# reports it instead, because refusing on it would turn a race or an API hiccup
# into an outage. A list call that fails (RBAC, API timeout) is a policy error,
# which failurePolicy Ignore admits and the policy report records. Kyverno's
# admission, background and reports controllers are bound to the built-in view
# role, which grants the list.
#
# The check reads only the Pod spec, never node labels, so it cannot deadlock
# a rebuild waiting for a label to appear.
#
# Pods only: autogen is off. A controller whose Pod is refused surfaces as a
# FailedCreate event.
#
# FAILURE POLICY: Ignore. With Fail, a Kyverno outage would reject every Pod,
# including the ones needed to bring Kyverno back.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-baseline-workers-for-hcloud-volumes
  annotations:
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/title: Require Baseline Workers for hcloud Volumes
    policies.kyverno.io/category: Scheduling, Storage
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Refuses a Pod that mounts an hcloud volume unless it is pinned to the
      static baseline workers, by the platform.devantler.tech/baseline-worker
      label (nodeSelector, or in every required nodeSelectorTerm) or by
      prod-worker-* hostnames. hcloud volumes are not force-detached when
      their node departs, so a volume on an autoscaler node strands when the
      node is reclaimed.
spec:
  validationActions:
    - Deny
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: mounts-a-claim
      expression: >-
        object.spec.?volumes.orValue([]).exists(v,
          has(v.persistentVolumeClaim) || has(v.ephemeral))
  variables:
    - name: claims
      expression: >-
        object.spec.?volumes.orValue([]).exists(v, has(v.persistentVolumeClaim))
          ? dyn(resource.List("v1", "persistentvolumeclaims",
              object.metadata.?namespace.orValue('')).?items.orValue([]))
          : []
    - name: hcloudClaimNames
      expression: >-
        variables.claims
          .filter(c, c.?spec.?storageClassName.orValue('') == 'hcloud')
          .map(c, c.metadata.name)
    - name: mountsHcloud
      expression: >-
        object.spec.?volumes.orValue([]).exists(v,
          (has(v.persistentVolumeClaim) &&
            v.persistentVolumeClaim.claimName in variables.hcloudClaimNames) ||
          (has(v.ephemeral) &&
            v.ephemeral.?volumeClaimTemplate.?spec.?storageClassName.orValue('') == 'hcloud'))
    - name: nodeName
      expression: object.spec.?nodeName.orValue('')
    - name: nodeSelectorTerms
      expression: >-
        object.spec.?affinity.?nodeAffinity
          .?requiredDuringSchedulingIgnoredDuringExecution
          .?nodeSelectorTerms.orValue([])
    - name: baselineWorkerOnly
      expression: >-
        variables.nodeName != ''
          ? variables.nodeName.startsWith('prod-worker-')
          : (object.spec.?nodeSelector[?'platform.devantler.tech/baseline-worker'].orValue('') == 'true' ||
            (size(variables.nodeSelectorTerms) > 0 &&
              variables.nodeSelectorTerms.all(t,
                t.?matchExpressions.orValue([]).exists(e,
                  (e.key == 'platform.devantler.tech/baseline-worker' &&
                    e.operator == 'In' && e.?values.orValue([]) == ['true']) ||
                  (e.key == 'kubernetes.io/hostname' && e.operator == 'In' &&
                    size(e.?values.orValue([])) > 0 &&
                    e.values.all(h, h.startsWith('prod-worker-')))))))
  validations:
    - expression: "!variables.mountsHcloud || variables.baselineWorkerOnly"
      messageExpression: >-
        'Pod ' + object.metadata.?namespace.orValue('') + '/' + object.metadata.name +
        ' mounts an hcloud volume but is not pinned to the static baseline' +
        ' workers, so the volume strands if an autoscaler node that runs it is' +
        ' reclaimed. Fix: set nodeSelector platform.devantler.tech/baseline-worker' +
        ' "true", or a required node affinity where every nodeSelectorTerm' +
        ' includes platform.devantler.tech/baseline-worker In ["true"] (or, for' +
        ' workloads that deploy before that label exists,' +
        ' kubernetes.io/hostname In prod-worker-* only). See platform#3287.'
---
# Audit-only companion: a mounted claim that is missing from its namespace's
# claim list was not judged by require-baseline-workers-for-hcloud-volumes.
# Report it so a lookup gap is visible.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: report-hcloud-claim-lookup-failure
  annotations:
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/title: Report hcloud Claim Lookup Failure
    policies.kyverno.io/category: Scheduling, Storage
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Reports a Pod whose mounted claim could not be found in its namespace,
      so require-baseline-workers-for-hcloud-volumes could not judge it.
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: mounts-a-persistent-claim
      expression: >-
        object.spec.?volumes.orValue([]).exists(v, has(v.persistentVolumeClaim))
  variables:
    - name: claimNames
      expression: >-
        dyn(resource.List("v1", "persistentvolumeclaims",
          object.metadata.?namespace.orValue('')).?items.orValue([]))
          .map(c, c.metadata.name)
  validations:
    - expression: >-
        object.spec.?volumes.orValue([]).all(v,
          !has(v.persistentVolumeClaim) ||
          v.persistentVolumeClaim.claimName in variables.claimNames)
      messageExpression: >-
        'The storage class of a claim mounted by Pod ' +
        object.metadata.?namespace.orValue('') + '/' + object.metadata.name +
        ' could not be read, so require-baseline-workers-for-hcloud-volumes' +
        ' could not judge it. Check that Kyverno can list PersistentVolumeClaims' +
        ' and that the claim exists. See platform#3287.'
