# Prod-only: database instances share the storage scheduling tier. An hcloud
# workload must not preempt a Longhorn-backed database merely because its
# storage class is different (platform#4649). Equal priority protects both
# primaries and replicas; it does not change failover or disruption budgets.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prioritise-database-pods
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Prioritise Database Instances
    policies.kyverno.io/category: Scheduling, Storage
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Gives CloudNativePG instances with persistent claims the same priority
      as hcloud volume consumers, preventing storage scheduling from preempting
      a database. Explicit priority classes are preserved.
spec:
  background: false
  failurePolicy: Ignore
  rules:
    - name: prioritise-database-instances
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: cloudnative-pg
                  cnpg.io/podRole: instance
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      preconditions:
        all:
          - key: "{{ request.object.spec.priorityClassName || '' }}"
            operator: Equals
            value: ""
          - key: "{{ length(request.object.spec.volumes[?persistentVolumeClaim] || `[]`) }}"
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: hcloud-volume-workload
            priority: 1000
