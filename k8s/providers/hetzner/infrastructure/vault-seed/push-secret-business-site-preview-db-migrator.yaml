apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-business-site-preview-db-migrator
  namespace: openbao
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-business-site-preview-db-migrator
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: apps/business-site-dev/portal-migrator
          property: password
