# Bounded resources for the AWS SES v2 provider runtime pod (the same bounds as
# the IAM provider; AWS_REGION is the region SES resources default to).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-sesv2
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # validate-pod-security's require-seccomp-profile asserts the POD-level
          # path, and Crossplane's package manager creates this Deployment
          # directly, so the container-level value below does not satisfy it and
          # the create is denied by the fail-closed webhook. add-security-context
          # cannot fill the gap either: its match/exclude carry pod selectors, so
          # Kyverno generates no pod-controller rules for it and it never sees a
          # Deployment. The DRC therefore has to state this itself.
          #
          # The package manager applies its pod-level defaults only when the DRC
          # provides no securityContext at all, so this block has to restate
          # them verbatim (runAsNonRoot/runAsUser/runAsGroup = Crossplane's
          # documented 2000) — adding seccompProfile alone would drop the uid
          # the provider images run as.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              # The provider validates credentials through STS before each
              # reconciliation. Pin that call to the account's region, where
              # the SES resources also live, so the runtime and its exact-host
              # egress policy stay aligned instead of falling back to us-east-1.
              env:
                - name: AWS_REGION
                  value: eu-central-1
                - name: AWS_STS_REGIONAL_ENDPOINTS
                  value: regional
              # Kubescape C-0017 (immutable container filesystem) + the hardening
              # set Kyverno injects at admission (Kubescape scans this stored spec,
              # not the live pod). The upjet runtime writes Terraform workspaces to
              # /tmp/<uuid>, so a writable /tmp emptyDir keeps the read-only root
              # from breaking reconciliation of the SES resources.
              # runAsUser/runAsGroup left to Crossplane's package-manager default
              # (2000).
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
                seLinuxOptions: {}
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
