# Serve the tenant-owned ascoachingogvaner.dk domain on the shared platform
# Gateway. SNI picks the most specific listener, so these terminate TLS with
# the domain's own certificate while every other hostname keeps hitting the
# hostname-less `https` listener with the ${domain} wildcard cert. JSON patch
# (not strategic merge) because Gateway is a CRD — a strategic-merge patch
# would replace the whole listeners list instead of appending.
#
# The certificateRefs point CROSS-NAMESPACE at the tenant-owned Secret
# (ascoachingogvaner/ascoachingogvaner-dk-tls): the certificate and its DNS01
# solver credential live entirely in the tenant's deploy/ (a namespaced Issuer +
# Certificate), and the tenant ships a ReferenceGrant authorising this Gateway to
# read that Secret. Until the cert issues the listener simply stays
# ResolvedRefs=False (Gateway still Programmed) — it never gates reconciliation.
#
# Both listeners pin `allowedRoutes.kinds` to HTTPRoute, matching the base
# Gateway's listeners — see k8s/bases/infrastructure/gateway/gateway.yaml for
# why an unpinned HTTPS listener is a hostname-claiming gap.
- op: add
  path: /spec/listeners/-
  value:
    name: https-ascoachingogvaner-dk
    hostname: ascoachingogvaner.dk
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          group: ""
          namespace: ascoachingogvaner
          name: ascoachingogvaner-dk-tls
    allowedRoutes:
      namespaces:
        from: All
      kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
- op: add
  path: /spec/listeners/-
  value:
    name: https-www-ascoachingogvaner-dk
    hostname: www.ascoachingogvaner.dk
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          group: ""
          namespace: ascoachingogvaner
          name: ascoachingogvaner-dk-tls
    allowedRoutes:
      namespaces:
        from: All
      kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
