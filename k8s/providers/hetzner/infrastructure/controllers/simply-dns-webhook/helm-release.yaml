apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: simply-dns-webhook
  namespace: cert-manager
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 2m
  timeout: 10m
  chart:
    spec:
      chart: simply-dns-webhook
      # 1.9.0 is the newest *published* chart: v1.10.0 is tagged upstream but
      # its Pages index was never redeployed, so the 1.10.0 tgz 404s. Bump
      # once it actually resolves.
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: simply-dns-webhook
  # https://github.com/RunnerM/simply-dns-webhook/blob/master/deploy/simply-dns-webhook/values.yaml
  values:
    # Run 2 replicas (HA) so the drain-safe PDB (pod-disruption-budget.yaml)
    # keeps the DNS01 solver available through a node drain, and to satisfy the
    # validate-replica-floor policy (it was the one workload still flagged). The
    # solver is a stateless Go webhook — cert-manager calls it via its Service
    # during ACME DNS01 challenges — so extra replicas just load-balance, no
    # coordination needed. Hardcoded (not the ${..._replicas} cluster-config
    # pattern) because this controller is hetzner/prod-only with no other
    # environment to tune it for.
    replicaCount: 2
    # The chart supports affinity directly. Match its app/release pod labels so
    # a worker failure cannot take down both DNS-01 solver replicas.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: simply-dns-webhook
                release: simply-dns-webhook
    # Don't override groupName: the chart's challenge-management ClusterRole
    # hardcodes this group, so a custom one breaks the solver's RBAC.
    groupName: com.github.runnerm.cert-manager-simply-webhook
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
  postRenderers:
    # The chart renders no securityContext at all (and offers no values knob),
    # which fails the validate-container-security Kyverno baseline. The solver
    # is a static Go binary serving HTTPS on :443, so it needs
    # NET_BIND_SERVICE to bind a privileged port as non-root (the one
    # capability the restricted profile permits adding).
    # fsGroupChangePolicy and seLinuxOptions are the C-0211 baseline context:
    # cert-manager is excluded from add-security-context's pod and container
    # rules, and the scan reads the stored Deployment template rather than the
    # mutated pod (#3239). OnRootMismatch only skips a recursive ownership
    # change when the volume root already matches, and the empty seLinuxOptions
    # object leaves SELinux type and MCS category selection to the runtime.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: simply-dns-webhook
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: simply-dns-webhook
              spec:
                # Hard anti-affinity leaves no room for a surge pod when only
                # two workers are eligible. Replace one pod at a time instead.
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxUnavailable: 1
                    maxSurge: 0
                template:
                  spec:
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      fsGroupChangePolicy: OnRootMismatch
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: simply-dns-webhook
                        securityContext:
                          privileged: false
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          seLinuxOptions: {}
                          capabilities:
                            drop: ["ALL"]
                            add: ["NET_BIND_SERVICE"]
