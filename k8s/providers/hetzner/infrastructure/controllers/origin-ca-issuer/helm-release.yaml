apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: origin-ca-issuer
  namespace: cert-manager
spec:
  dependsOn:
    - name: cert-manager
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: origin-ca-issuer
      version: 0.6.4
      sourceRef:
        kind: HelmRepository
        name: origin-ca-issuer
  # https://github.com/cloudflare/origin-ca-issuer/blob/trunk/deploy/charts/origin-ca-issuer/values.yaml
  values:
    replicaCount: ${origin_ca_issuer_replicas:=2}
  # Chart hardcodes 1 CPU / 512Mi without templating; override via
  # postRenderers since values.resources is not wired in the chart.
  # The same patch supplies the C-0211 baseline context: cert-manager is
  # excluded from add-security-context's pod and container rules, and the scan
  # reads the stored Deployment template rather than the mutated pod (#3239).
  # Both fields are inert here: the pod mounts no volume, and the empty
  # seLinuxOptions object leaves SELinux type and MCS category selection to the
  # runtime. The chart renders no securityContext, so strategic merge adds only
  # these two fields.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: origin-ca-issuer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: origin-ca-issuer
              spec:
                template:
                  spec:
                    securityContext:
                      fsGroupChangePolicy: OnRootMismatch
                    containers:
                      - name: origin-ca-issuer
                        securityContext:
                          seLinuxOptions: {}
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 128Mi
