---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.36.0
      sourceRef:
        kind: HelmRepository
        name: hcloud
  interval: 10m0s
  timeout: 10m
  # https://github.com/hetznercloud/hcloud-cloud-controller-manager/blob/main/chart/values.yaml
  values:
    networking:
      enabled: true
      clusterCIDR: 10.244.0.0/16
    replicaCount: ${hcloud_ccm_replicas:=2}
    # CPU limit declared in the template so it no longer depends on the kube-system
    # LimitRange admitting the pod (#3789). The requests restate the chart's defaults:
    # auto-vpa controls requests AND limits and keeps their ratio, so the declared
    # 100m:2 pair reproduces exactly the live values the LimitRange produces today.
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: "2"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hcloud-cloud-controller-manager
                  app.kubernetes.io/instance: hcloud-cloud-controller-manager
