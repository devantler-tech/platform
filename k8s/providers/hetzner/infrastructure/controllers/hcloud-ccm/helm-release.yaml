---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.36.0
      sourceRef:
        kind: HelmRepository
        name: hcloud
  interval: 10m0s
  timeout: 10m
  # https://github.com/hetznercloud/hcloud-cloud-controller-manager/blob/main/chart/values.yaml
  values:
    networking:
      enabled: true
      clusterCIDR: 10.244.0.0/16
    replicaCount: ${hcloud_ccm_replicas:=2}
    # The CPU limit is declared in the template, so it does not depend on the
    # kube-system LimitRange admitting the pod (#3789). The requests restate the
    # chart's defaults. The static prod VPAs (../../vertical-pod-autoscalers/)
    # control requests AND limits and keep their ratio, so this 100m:2 pair gives the
    # same live values as the LimitRange-admitted pair.
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: "2"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hcloud-cloud-controller-manager
                  app.kubernetes.io/instance: hcloud-cloud-controller-manager
