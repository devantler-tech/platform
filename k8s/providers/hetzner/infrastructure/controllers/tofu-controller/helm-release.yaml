apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
spec:
  interval: 10m
  timeout: 10m
  releaseName: tofu-controller
  chart:
    spec:
      chart: tofu-controller
      version: 0.16.5
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
  install:
    # The chart ships the `Terraform` (infra.contrib.fluxcd.io) CRD; let Flux
    # own its lifecycle so upgrades pick up schema changes.
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Runs in flux-system alongside the other Flux controllers. Runner pods are
  # spawned per-Terraform-CR in the target namespace (here: `unifi`), which must
  # provide a `tf-runner` ServiceAccount + RBAC and a NetworkPolicy allowing the
  # controller<->runner gRPC on :30000 (see providers/hetzner/unifi/).
  # https://github.com/flux-iac/tofu-controller
  values:
    # Reconcile drift continuously; the per-Terraform-CR `approvePlan` governs
    # whether a detected drift is auto-applied or held for manual approval.
    runner:
      grpc:
        port: 30000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  # Add the gid to match the uid the chart already sets, so Kubescape C-0013
  # (non-root containers) passes on its own terms rather than through an
  # exception. This controller is the one workload in flux-system that already
  # carries runAsUser (65532, from the chart), so only runAsGroup is missing —
  # which is also why it is the one that would have survived a naive
  # runAsGroup-only patch where the other five would not.
  #
  # 65532 is measured, not chosen: ghcr.io/flux-iac/tofu-controller declares
  # USER 65532:65532 in its image config (read from the registry 2026-08-29),
  # matching the runAsUser already in the rendered spec. The four controllers
  # the FluxInstance renders are ghcr.io/fluxcd/* and declare 65534 — same
  # namespace, different image family, different uid.
  #
  # The `op: test` guard asserts the container name before writing, so a chart
  # that renames or reorders containers fails the patch loudly instead of
  # writing a gid onto the wrong one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tofu-controller
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: tofu-controller
              - op: add
                path: /spec/template/spec/containers/0/securityContext/runAsGroup
                value: 65532
