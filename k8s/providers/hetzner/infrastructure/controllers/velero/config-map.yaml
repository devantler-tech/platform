# Velero Volume Policy (prod/hetzner only) — routes each PVC to the right backup
# method by StorageClass. Referenced by name from the daily-full schedule's
# spec.resourcePolicy (see patches/enable-csi-snapshots.yaml).
#
# Why a policy instead of per-pod annotations: it is declarative (by
# StorageClass, not volume name), and fail-safe — any volume that does NOT match
# a rule falls back to the legacy behaviour, which here is
# defaultVolumesToFsBackup: true (Kopia FSB). So new/unmatched PVCs are always
# backed up; nothing is silently skipped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-volume-policies
  namespace: velero
  labels:
    # Conventional marker for Velero resource-policy ConfigMaps; the binding
    # that actually applies the policy is the schedule's resourcePolicy.name.
    velero.io/volume-policy: "true"
data:
  policy.yaml: |
    version: v1
    volumePolicies:
      # Hetzner block-storage volume data -> skip. The only hcloud PVC is
      # openbao/vault-snapshots, whose CronJob mirrors every raft snapshot
      # directly to R2. It is unmounted during Velero's 02:17 window, so FSB
      # cannot read it; hcloud-csi also has no snapshot capability or matching
      # VolumeSnapshotClass. The contract test refuses another hcloud PVC until
      # its backup path is reviewed instead of silently inheriting this skip.
      - conditions:
          storageClass:
            - hcloud
        action:
          type: skip
      # Longhorn PVCs → CSI snapshot. The base schedule's snapshotMoveData:true
      # makes Velero's data mover (Kopia, via the node-agent) copy the snapshot
      # to the R2 BackupStorageLocation, so it is restorable on another cluster/
      # provider. The longhorn-snapshot-vsc VolumeSnapshotClass (labelled
      # velero.io/csi-volumesnapshot-class) is auto-selected for this driver.
      - conditions:
          storageClass:
            - longhorn
        action:
          type: snapshot
      # emptyDir pod volumes → skip. emptyDir never survives pod recreation, so
      # backing it up has zero restore value — yet defaultVolumesToFsBackup was
      # spawning a VGDP micro-pod for every agent scratch dir (kubescape
      # node-agent clamav dirs, coroot-node-agent tmp, CNPG shm/scratch-data,
      # openbao tmp/home, homepage config/logs). On memory-saturated nodes those
      # micro-pods end up pod-phase Failed and each stuck PodVolumeBackup holds
      # the nightly backup open until the 4h timeout (PartiallyFailed). Real
      # data is unaffected: PVCs never match volumeTypes: emptyDir.
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
      # Any other or future StorageClass remains unmatched and falls back to
      # defaultVolumesToFsBackup: true, so unknown PVCs are still backed up.
