apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  values:
    configuration:
      # Keep CSI available for backups that explicitly select it.
      features: EnableCSI
    schedules:
      daily-full:
        template:
          # Velero applies the volume policy before the filesystem backup
          # default. The policy routes legacy Longhorn to Kopia and the default
          # backs up any other mounted PVC that has no matching rule.
          resourcePolicy:
            kind: configmap
            name: velero-volume-policies
      # OpenBao needs its recovery keys even when a volume upload makes the
      # full backup incomplete. This schedule uses the existing R2 destination.
      openbao-recovery-keys:
        disabled: false
        schedule: "10 6 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: "336h"
          storageLocation: default
          includedNamespaces:
            - openbao
          includedResources:
            - secrets
          includeClusterResources: false
          snapshotVolumes: false
          snapshotMoveData: false
          defaultVolumesToFsBackup: false
