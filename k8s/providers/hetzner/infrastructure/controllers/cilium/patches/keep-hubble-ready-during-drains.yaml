---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  values:
    hubble:
      ui:
        replicas: 2
        # Use the three reserved migration workers while the V2 instance
        # managers establish their memory budget. Retire with #6432.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: storage.platform.devantler.tech/migration-pool
                      operator: In
                      values: [v1, v2]
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            minDomains: 2
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                k8s-app: hubble-ui
