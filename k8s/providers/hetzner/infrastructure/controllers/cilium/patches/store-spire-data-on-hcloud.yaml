---
# Dormant prod-only SPIRE storage values. Cilium authentication and SPIRE are
# disabled in the base while no required-authentication policy consumes them,
# so this patch does not currently install a server or create a volume. If a
# narrow policy consumer re-enables SPIRE, these values put its datastore on
# Hetzner Cloud block storage (hcloud-csi) instead of Longhorn, breaking a
# circular dependency that can wedge the whole cluster.
#
# Keep the SPIRE datastore independent from the cluster-default Longhorn
# StorageClass. Longhorn's own control plane is pod-to-pod traffic
# (longhorn-csi-plugin -> longhorn-backend:9500 -> instance-managers), so using
# hcloud-csi avoids coupling SPIRE recovery to Longhorn recovery during node
# rolls or storage incidents.
#
# hcloud-csi asks the Hetzner API to attach/detach a persistent cloud volume
# without depending on Longhorn's pod-to-pod control plane. Recovery after a
# node dies still depends on the hcloud-csi controller and Hetzner API being
# available, the replacement node satisfying volume topology/compliance, and a
# successful detach/attach. With the current single-replica SPIRE StatefulSet,
# the volume serves one spire-server attachment at a time; verify detach,
# reattachment, and datastore recovery during node-loss testing. WireGuard still
# encrypts pod-to-pod traffic on the wire — this changes only WHERE spire-server
# keeps its SQLite datastore.
#
# size: 10Gi is the Hetzner Cloud Volume minimum (the SPIRE datastore needs
# ~1Gi; the chart default 1Gi is rejected by csi.hetzner.cloud). The `hcloud`
# StorageClass is WaitForFirstConsumer, so the volume is created in the same
# location as the node spire-server schedules onto (no topology mismatch).
#
# PROD/HETZNER ONLY: SPIRE is disabled in the docker overlay (no spire-server
# StatefulSet is rendered) and the `hcloud` StorageClass does not exist locally,
# so this override lives in the hetzner patch, not the base.
#
# OPERATIONAL NOTE (StatefulSet volumeClaimTemplate is immutable): if SPIRE is
# re-enabled while an old spire-server StatefulSet still exists with another
# StorageClass/size, the Helm upgrade cannot change it in place. Verify its PVC
# state before activation and recreate the StatefulSet deliberately so Flux can
# apply hcloud-csi; do not assume the dormant values migrated any existing PVC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  values:
    authentication:
      mutual:
        spire:
          install:
            server:
              dataStorage:
                storageClass: hcloud
                size: 10Gi
