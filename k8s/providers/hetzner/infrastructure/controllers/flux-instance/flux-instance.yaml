# Overrides the KSail-bootstrapped FluxInstance to pin the distribution and
# tune the controllers. KSail creates the initial FluxInstance during
# `ksail cluster create`; this resource is reconciled by the
# flux-instance Flux Kustomization post-bootstrap, ahead of
# infrastructure-controllers, in the Hetzner (prod) environment only. Tenant
# apps update via native OCIRepository semver selection, so the
# image-reflector/image-automation controllers are not installed.
---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    # Never garbage-collect: deleting the FluxInstance uninstalls Flux. This was
    # live one deployed revision before the FluxInstance moved to its own Flux
    # Kustomization (platform#5184), so no layer could prune it in the hand-over.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    # Keep the distribution reversible to current main. Only helm-controller
    # advances to the adjacent-minor image/CRD pair verified by the native test.
    version: "2.9.6"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    size: large
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          - op: test
            path: /spec/template/spec/containers/0/name
            value: manager
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
          # The production image-verification handoff deliberately restarts this
          # Deployment so no pre-suspension policy execution survives the
          # credential boundary. The listener needs a few seconds to bind after
          # process start; probing immediately creates a connect-refused event
          # even though the controller becomes Ready normally. Keep the
          # security restart and delay only its readiness observation.
          - op: add
            path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
            value: 5
          # The handoff terminates the old leader after its replacement starts.
          # Without a pre-stop grace period the process exits before kube-proxy
          # removes the terminating endpoint, and kubelet records a transient
          # readiness connection refusal. Keep the listener alive long enough
          # for endpoint propagation; Kubernetes sends SIGTERM after this sleep.
          - op: add
            path: /spec/template/spec/containers/0/lifecycle
            value:
              preStop:
                sleep:
                  seconds: 10
          - op: replace
            path: /spec/replicas
            value: 2
          # The policy handoff restarts this Deployment, then flux-operator
          # removes the imperative restartedAt annotation in a cleanup rollout.
          # Require each replacement to stay Ready across Coroot's observation
          # interval before retiring an old replica. This preserves two stable
          # instances during both rollouts instead of hiding the transient risk;
          # two 30-second stages remain inside the handoff's two-minute timeout.
          - op: add
            path: /spec/minReadySeconds
            value: 30
          - op: add
            path: /spec/template/spec/affinity
            value:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: kustomize-controller
                    topologyKey: kubernetes.io/hostname
      # Run kustomize-/helm-/notification-controller active/standby (HA) for
      # node-failure resilience: each binary runs --enable-leader-election and
      # holds a coordination.k8s.io Lease, so a 2nd replica is a warm standby (one
      # active leader, one standby that takes the Lease within its TTL when the
      # leader's node fails). Upstream ships replicas: 1, which is why Coroot flags
      # each as "single instance - not resilient to node failure"; bumping these
      # three to 2 clears that.
      # Each replicated controller also gets the same 30-second readiness floor.
      # Besides the policy-handoff restart above, this makes every Flux-managed
      # rollout prove a replacement is stably Ready before an old replica leaves.
      #
      # PATCH BY NAME, and DELIBERATELY DO NOT patch source-controller.
      # source-controller is the one controller that cannot run a ready warm
      # standby: its readiness probe targets the artifact file server on :9090, a
      # leader-election runnable that only starts on the active leader, so the
      # standby blocks in "attempting to acquire leader lease", never opens :9090,
      # and stays 0/1 — wedging the Deployment at 1/2, the FluxInstance at
      # "source-controller status: InProgress", and the infrastructure-controllers
      # health-check into a 25m timeout that FREEZES all GitOps delivery.
      # An earlier attempt used a label-selector replicas:2 over all
      # part-of=flux controllers + a name-targeted replicas:1 override for
      # source-controller. That did NOT work: raw `kustomize build` honours patch
      # order and yields 1, but flux-operator resolves the overlapping label- and
      # name-targeted patches the other way, so source-controller stayed at 2
      # (verified live via a forced FluxInstance reconcile). A controller must
      # also have exactly one name-targeted patch: flux-operator only applied the
      # first of two duplicate kustomize-controller targets, which silently left
      # it at one replica. Deployment patch targets must also omit `namespace`:
      # flux-operator applies component patches before the namespace transformer,
      # so a namespaced Deployment selector silently matches nothing. The robust
      # fix is therefore one unnamespaced patch per HA controller and no
      # source-controller replicas patch, so source-controller keeps the base
      # manifest's single replica with zero ambiguity. (topologySpread + ndots
      # below still target the whole part-of=flux set by label — those don't
      # conflict and are safe at 1 replica.) flux-operator itself stays
      # single-replica: its chart exposes no replicas/leaderElection (0.50.0), so
      # it relies on reschedule.
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: replace
            path: /spec/replicas
            value: 2
          - op: add
            path: /spec/minReadySeconds
            value: 30
          - op: add
            path: /spec/template/spec/affinity
            value:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: helm-controller
                    topologyKey: kubernetes.io/hostname
          - op: test
            path: /spec/template/spec/containers/0/name
            value: manager
          - op: test
            path: /spec/template/spec/containers/0/image
            value: fluxcd/helm-controller:v1.6.5
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: ghcr.io/fluxcd/helm-controller:v1.7.1@sha256:54526cc6ed1202d71d44c310676448065664f3255ad671d9a69ac26f904e617a
      - target:
          kind: Deployment
          name: notification-controller
        patch: |
          - op: replace
            path: /spec/replicas
            value: 2
          - op: add
            path: /spec/minReadySeconds
            value: 30
          - op: add
            path: /spec/template/spec/affinity
            value:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: notification-controller
                    topologyKey: kubernetes.io/hostname
      # Spread the four Flux controllers across worker nodes. The three
      # replicated controller patches above require each active/standby pair to
      # use different hostnames. This additional aggregate spread distributes
      # the whole controller set with skew <= 1.
      # On 2026-05-28 kustomize-controller landed on prod-worker-2 when that
      # node's Cilium ClusterIP datapath degraded after an OOMKill; it then
      # crash-looped on "dial tcp 10.96.0.1:443: i/o timeout" and GitOps
      # reconciliation stalled — so the fix for the underlying OOM could not be
      # applied (a deadlock GitOps cannot self-heal from). Keeping the
      # controllers spread means a single bad worker cannot decapitate
      # reconciliation. The aggregate rule is soft (ScheduleAnyway); the
      # same-controller anti-affinity above is the required HA guarantee.
      - target:
          kind: Deployment
          labelSelector: app.kubernetes.io/part-of=flux
        patch: |
          - op: add
            path: /spec/template/spec/topologySpreadConstraints
            value:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: flux
      # The Flux controllers poll external endpoints on every interval —
      # source-controller fetches ghcr.io OCI artifacts + Helm repo indexes,
      # kustomize-controller and helm-controller pull OCI artifacts/charts from
      # external registries, and notification-controller posts to external
      # webhook receivers. With the default ndots:5 each external (dotted) name
      # is tried against the four-entry cluster search path FIRST, producing
      # thousands of guaranteed-NXDOMAIN queries per hour against CoreDNS
      # (Coroot flags this as a DNS warning on these apps). ndots:1 makes any
      # dotted name resolve absolute-first; the search path remains a fallback.
      # This is safe for in-cluster controller-to-controller traffic because
      # Flux addresses its own services by trailing-dot absolute FQDN
      # (source-controller advertises itself via
      # --storage-adv-addr=source-controller.flux-system.svc.cluster.local.),
      # which bypasses search-path expansion at any ndots value — so nothing
      # relies on it.
      #
      # Applied to the whole controller set via the shared
      # app.kubernetes.io/part-of=flux label (same selector as the topology
      # spread above) rather than per-controller, so every current and future
      # Flux controller inherits it. The image-reflector/image-automation
      # controllers are not installed (see header), so this covers the four
      # listed components.
      - target:
          kind: Deployment
          labelSelector: app.kubernetes.io/part-of=flux
        patch: |
          - op: add
            path: /spec/template/spec/dnsConfig
            value:
              options:
                - name: ndots
                  value: "1"
      # Give every Flux controller container the uid AND gid its own image
      # already declares, so Kubescape C-0013 (non-root containers) passes on
      # its own terms rather than through an exception.
      #
      # 🔴 SET BOTH FIELDS, NEVER runAsGroup ALONE. None of the four
      # controllers sets runAsUser at container or pod level — only
      # runAsNonRoot: true — so adding just runAsGroup leaves the OCI spec with
      # an empty uid and a group ("":65534), which containerd refuses, and the
      # patch meant to close a posture gap stops the controller starting
      # instead. That failure mode is documented in add-security-context.yaml
      # and it lands on kustomize-/source-controller, i.e. the components a
      # revert would have to run through.
      #
      # 65534 is measured, not chosen: ghcr.io/fluxcd/{source,kustomize,helm,
      # notification}-controller all declare USER 65534:65534 in their image
      # config (read from the registry 2026-08-29). Do NOT reuse 65532 here —
      # that is the flux-operator image family's uid, and it is patched at its
      # own HelmRelease.
      #
      # Targeted by the shared app.kubernetes.io/part-of=flux label, the same
      # selector the topology-spread and ndots patches use, so it covers the
      # four installed components and any future one from the same family. The
      # `op: test` guard asserts container 0 is `manager` before writing, so a
      # future chart that reorders containers fails the patch loudly instead of
      # writing a uid onto the wrong container.
      - target:
          kind: Deployment
          labelSelector: app.kubernetes.io/part-of=flux
        patch: |
          - op: test
            path: /spec/template/spec/containers/0/name
            value: manager
          - op: add
            path: /spec/template/spec/containers/0/securityContext/runAsUser
            value: 65534
          - op: add
            path: /spec/template/spec/containers/0/securityContext/runAsGroup
            value: 65534
      # Supply the two NON-PRIVILEGE C-0211 fields that the cluster-wide
      # add-security-context mutation cannot reach here. That policy excludes
      # flux-system, and correctly so — the exclusion protects privilege, user
      # and group fields on a namespace whose controllers need elevated access.
      # fsGroupChangePolicy and seLinuxOptions are neither: the first only
      # governs ownership-relabel behaviour on volume mount, and the second is a
      # documented no-op on this AppArmor cluster (runc ignores SELinux labels
      # when SELinux is not the active LSM), retained as CIS-5.7.3
      # defence-in-depth. The values are kept identical to
      # add-security-context.yaml so a workload does not read differently
      # depending on which surface supplied the field.
      #
      # 🔴 PATCHED HERE RATHER THAN BY NAMESPACE OPT-IN, and that is the whole
      # point. The mutation runs on Pod CREATE, so it only ever reaches the
      # running pod; Kubescape scores the STORED WORKLOAD SPEC, which no pod
      # mutation ever touches. Measured on velero (#3239): it is opted in, all
      # 56 of its pods carry both fields, and its Deployment template carries
      # neither. A kustomize patch writes the template itself, so it moves both
      # surfaces at once — the only route here that does.
      #
      # Same app.kubernetes.io/part-of=flux selector as the three patches above,
      # which resolves to exactly the four installed controllers (measured live
      # 2026-09-03: helm-, kustomize-, notification- and source-controller, each
      # with one container and zero initContainers). flux-operator and
      # tofu-controller do NOT carry that label and are deliberately untouched —
      # the first is patched at its own HelmRelease, and the second is the
      # documented tf-runner exemption in add-security-context.yaml.
      #
      # Pod-level securityContext already exists on all four (fsGroup: 1337,
      # read live 2026-09-03), so `add` writes into an existing object rather
      # than failing on a missing parent. The `op: test` guard matches the
      # runAsUser/runAsGroup patch above: if a future chart reorders containers,
      # this fails loudly instead of writing onto the wrong one.
      - target:
          kind: Deployment
          labelSelector: app.kubernetes.io/part-of=flux
        patch: |
          - op: test
            path: /spec/template/spec/containers/0/name
            value: manager
          - op: add
            path: /spec/template/spec/securityContext/fsGroupChangePolicy
            value: OnRootMismatch
          - op: add
            path: /spec/template/spec/containers/0/securityContext/seLinuxOptions
            value: {}
      # Enforce cosign signature verification on the ROOT source — the
      # flux-system OCIRepository every controller, tenant binding and policy
      # arrives through. Without this the root artifact is pulled from a mutable
      # tag with nothing checking who produced it.
      #
      # PATCH THROUGH THE OPERATOR, not from the cluster config and not from a
      # hand-written OCIRepository override. flux-operator generates this
      # resource and is its Apply field manager, owning
      # url/ref/interval/provider/secretRef. Two consequences, both measured
      # live: KSail's spec.workload.flux.verify (ksail.prod.yaml) is applied
      # only on the bootstrap path — on a routine deploy KSail writes no spec
      # key on this resource at all, so that setting never reaches an existing
      # cluster; and a full in-repo override would contend with the operator for
      # those five fields on the root source, where losing the reconcile fight
      # stops all GitOps delivery. A kustomize patch avoids both: the operator
      # itself writes the field, so it lands under the manager that already owns
      # the resource — no second writer, no field contention, no SSA pruning
      # question. This is flux-operator's documented route for exactly this
      # case ("OCI sync with Cosign verification").
      #
      # The subjects are pinned to the three workflows that legitimately publish
      # this artifact, on the refs they publish from, rather than `@.+` — so a
      # signature these same workflows produce on any other ref is not trusted:
      #   ci.yaml on the merge-queue ref  — automatic deploy on merge
      #   cd.yaml on main                 — manual workflow_dispatch deploy
      #   dr-rebuild.yaml on main         — disaster recovery, which republishes
      #                                     this artifact while rebuilding prod
      #                                     from zero; omitting it would leave a
      #                                     recovery producing a correctly-signed
      #                                     artifact that Flux still refuses.
      # They are kept identical to spec.workload.flux.verify in ksail.prod.yaml,
      # which covers the bootstrap path; scripts/validate-flux-verify asserts
      # both halves on every pull request.
      #
      # ⚠️ A MISTARGETED KUSTOMIZE PATCH RENDERS NOTHING, EXITS 0 AND WARNS
      # NOBODY (measured with kubectl kustomize on this file). A typo in the
      # target below yields a security control that is present here, absent from
      # the cluster, and green in CI. scripts/validate-flux-verify checks the
      # target, and the effect is confirmed by reading the live resource back:
      #   kubectl get ocirepository/flux-system -n flux-system -o yaml | grep -A5 verify
      - target:
          kind: OCIRepository
          name: flux-system
          namespace: flux-system
        patch: |
          - op: add
            path: /spec/verify
            value:
              provider: cosign
              # 🔴 EXACTLY ONE ENTRY. cosign's keyless verification rejects a
              # multi-entry matchOIDCIdentity outright — "unsupported: multiple
              # identities are not supported at this time" — and it fails CLOSED
              # for the whole set, so a list verifies nothing while looking
              # stricter than a single matcher. Flux documents the field as an
              # OR'd list and the schema accepts one, so a list is both
              # docs-valid and schema-valid and still refuses every artifact.
              # Alternation therefore lives INSIDE the subject regex.
              # The three trusted signers, in order: ci.yaml (automatic prod
              # deploy, signs under the merge-queue ref), cd.yaml (manual
              # workflow_dispatch from main), dr-rebuild.yaml (disaster recovery
              # from main, which republishes this same artifact).
              # scripts/validate-flux-verify fails the build on any list longer
              # than one, so this cannot regress silently.
              matchOIDCIdentity:
                - issuer: '^https://token\.actions\.githubusercontent\.com$'
                  subject: '^https://github\.com/devantler-tech/platform/\.github/workflows/(ci\.yaml@refs/heads/gh-readonly-queue/main/.+|(cd|dr-rebuild)\.yaml@refs/heads/main)$'
      # Generated by flux-operator 0.62.1 for helm-controller 1.7.1;
      # preserve these operations and the GVK/v2 input guards together.
      - patch: |+
          - op: test
            path: /kind
            value: CustomResourceDefinition
          - op: test
            path: /metadata/name
            value: helmreleases.helm.toolkit.fluxcd.io
          - op: test
            path: /spec/group
            value: helm.toolkit.fluxcd.io
          - op: test
            path: /spec/names/kind
            value: HelmRelease
          - op: test
            path: /spec/versions/0/name
            value: v2
          - op: test
            path: /spec/versions/0/served
            value: true
          - op: test
            path: /spec/versions/0/storage
            value: true
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/description
            value: |-
              Chart defines the template of the source object that should be
              created for this HelmRelease. The Kind field determines whether a
              sourcev1.HelmChart or sourcev1.OCIRepository is created.
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/kind
            value:
              description: |-
                Kind is the kind of the source object generated from this template. Valid values:
                  - HelmChart (default): generates a source.toolkit.fluxcd.io/v1 HelmChart from
                    the HelmChartSpec-compatible fields under .spec.chart.spec. In particular,
                    .spec.chart.spec.chart and .spec.chart.spec.sourceRef are required.
                  - OCIRepository: generates a source.toolkit.fluxcd.io/v1 OCIRepository from
                    the OCIRepositorySpec fields under .spec.chart.spec. In particular,
                    .spec.chart.spec.url is required, and .spec.chart.spec.interval defaults
                    to .spec.interval (interval is required in a plain OCIRepository).
                Use OCIRepository for charts hosted in OCI registries; use HelmChart for
                HelmRepository, GitRepository or Bucket sources.
              enum:
              - HelmChart
              - OCIRepository
              type: string
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/description
            value: Spec holds the spec of the object generated for this HelmRelease.
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/certSecretRef
            value:
              description: |-
                CertSecretRef can be given the name of a Secret containing
                either or both of

                - a PEM-encoded client certificate (`tls.crt`) and private
                key (`tls.key`);
                - a PEM-encoded CA certificate (`ca.crt`)

                and whichever are supplied, will be used for connecting to the
                registry. The client cert and key are useful if you are
                authenticating with a certificate; the CA cert is useful if
                you are using a self-signed server certificate. The Secret must
                be of type `Opaque` or `kubernetes.io/tls`.
              properties:
                name:
                  description: Name of the referent.
                  type: string
              required:
              - name
              type: object
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/ignore
            value:
              description: |-
                Ignore overrides the set of excluded patterns in the .sourceignore format
                (which is the same as .gitignore). If not provided, a default will be used,
                consult the documentation for your version to find out what those are.
              type: string
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/insecure
            value:
              description: Insecure allows connecting to a non-TLS HTTP container registry.
              type: boolean
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/interval/description
            value: |-
              Interval at which the OCIRepository URL is checked for updates.
              This interval is approximate and may be subject to jitter to ensure
              efficient use of resources.
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/layerSelector
            value:
              description: |-
                LayerSelector specifies which layer should be extracted from the OCI artifact.
                When not specified, the first layer found in the artifact is selected.
              properties:
                mediaType:
                  description: |-
                    MediaType specifies the OCI media type of the layer
                    which should be extracted from the OCI Artifact. The
                    first layer matching this type is selected.
                  type: string
                operation:
                  description: |-
                    Operation specifies how the selected layer should be processed.
                    By default, the layer compressed content is extracted to storage.
                    When the operation is set to 'copy', the layer compressed content
                    is persisted to storage as it is.
                  enum:
                  - extract
                  - copy
                  type: string
              type: object
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/provider
            value:
              description: |-
                The provider used for authentication, can be 'aws', 'azure', 'gcp' or 'generic'.
                When not specified, defaults to 'generic'.
              enum:
              - generic
              - aws
              - azure
              - gcp
              type: string
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/proxySecretRef
            value:
              description: |-
                ProxySecretRef specifies the Secret containing the proxy configuration
                to use while communicating with the container registry.
              properties:
                name:
                  description: Name of the referent.
                  type: string
              required:
              - name
              type: object
          - op: remove
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/reconcileStrategy/default
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/ref
            value:
              description: |-
                The OCI reference to pull and monitor for changes,
                defaults to the latest tag.
              properties:
                digest:
                  description: |-
                    Digest is the image digest to pull, takes precedence over SemVer.
                    The value should be in the format 'sha256:<HASH>'.
                  type: string
                semver:
                  description: |-
                    SemVer is the range of tags to pull selecting the latest within
                    the range, takes precedence over Tag.
                  type: string
                semverFilter:
                  description: SemverFilter is a regex pattern to filter the tags within the
                    SemVer range.
                  type: string
                tag:
                  description: Tag is the image tag to pull, defaults to latest.
                  type: string
              type: object
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/secretRef
            value:
              description: |-
                SecretRef contains the secret name containing the registry login
                credentials to resolve image metadata.
                The secret must be of type kubernetes.io/dockerconfigjson.
              properties:
                name:
                  description: Name of the referent.
                  type: string
              required:
              - name
              type: object
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/serviceAccountName
            value:
              description: |-
                ServiceAccountName is the name of the Kubernetes ServiceAccount used to authenticate
                the image pull, either with the pull secrets attached to the service account or with
                an object identity.
                For more information about object identity:
                https://fluxcd.io/flux/integrations/object-identity/
                For more information about image pull secrets:
                https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#add-imagepullsecrets-to-a-service-account
              type: string
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/suspend
            value:
              description: This flag tells the controller to suspend the reconciliation of this
                source.
              type: boolean
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/timeout
            value:
              description: The timeout for remote OCI Repository operations like pulling, defaults
                to 60s.
              pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m))+$
              type: string
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/url
            value:
              description: |-
                URL is a reference to an OCI artifact repository hosted
                on a remote container registry.
              pattern: ^oci://.*$
              type: string
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/verify/description
            value: |-
              Verify contains the secret name containing the trusted public keys
              used to verify the signature and specifies which provider to use to check
              whether OCI image is authentic.
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/verify/properties/matchOIDCIdentity
            value:
              description: |-
                MatchOIDCIdentity specifies the identity matching criteria to use
                while verifying an OCI artifact which was signed using Cosign keyless
                signing. The artifact's identity is deemed to be verified if any of the
                specified matchers match against the identity.
              items:
                description: |-
                  OIDCIdentityMatch specifies options for verifying the certificate identity,
                  i.e. the issuer and the subject of the certificate.
                properties:
                  issuer:
                    description: |-
                      Issuer specifies the regex pattern to match against to verify
                      the OIDC issuer in the Fulcio certificate. The pattern must be a
                      valid Go regular expression.
                    type: string
                  subject:
                    description: |-
                      Subject specifies the regex pattern to match against to verify
                      the identity subject in the Fulcio certificate. The pattern must
                      be a valid Go regular expression.
                    type: string
                required:
                - issuer
                - subject
                type: object
              type: array
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/verify/properties/provider/description
            value: Provider specifies the technology used to sign the OCI Artifact.
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/verify/properties/trustedRootSecretRef
            value:
              description: |-
                TrustedRootSecretRef specifies the Kubernetes Secret containing a
                Sigstore trusted_root.json file. This enables verification against
                self-hosted Sigstore infrastructure (custom Fulcio CA, self-hosted
                Rekor instance). The Secret must contain a key named "trusted_root.json".
              properties:
                name:
                  description: Name of the referent.
                  type: string
              required:
              - name
              type: object
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/properties/version
            value:
              description: |-
                Version semver expression, ignored for charts from v1.GitRepository and
                v1beta2.Bucket sources. Defaults to latest when omitted i.e. to '*'.
              type: string
          - op: remove
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/properties/spec/required
          - op: add
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/chart/x-kubernetes-validations
            value:
            - message: chart.spec.url must be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || (has(self.spec.url)
                && size(self.spec.url) > 0)'
            - message: 'chart.spec.url requires chart.kind: ''OCIRepository''; for a HelmChart
                template set spec.chart and spec.sourceRef instead'
              rule: '!has(self.spec.url) || (has(self.kind) && self.kind == ''OCIRepository'')'
            - message: chart.spec.chart and chart.spec.sourceRef must be set when chart.kind
                is not 'OCIRepository'
              rule: (has(self.kind) && self.kind == 'OCIRepository') || (has(self.spec.chart)
                && has(self.spec.sourceRef))
            - message: chart.spec.chart cannot be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.chart)'
            - message: chart.spec.version cannot be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.version)
                || self.spec.version == ''*'''
            - message: chart.spec.sourceRef cannot be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.sourceRef)'
            - message: chart.spec.reconcileStrategy cannot be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.reconcileStrategy)
                || self.spec.reconcileStrategy == ''ChartVersion'''
            - message: chart.spec.valuesFiles cannot be set when chart.kind is 'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.valuesFiles)'
            - message: chart.spec.ignoreMissingValuesFiles cannot be set when chart.kind is
                'OCIRepository'
              rule: '!has(self.kind) || self.kind != ''OCIRepository'' || !has(self.spec.ignoreMissingValuesFiles)'
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/kubeConfig/description
            value: |-
              KubeConfig for reconciling the HelmRelease on a remote cluster.
              When used in combination with HelmReleaseSpec.ServiceAccountName,
              forces the controller to act on behalf of that Service Account at the
              target cluster.
              If the --default-service-account flag is set, its value will be used as
              the default for HelmReleaseSpec.ServiceAccountName when it is empty.
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/kubeConfig/properties/configMapRef/description
            value: |-
              ConfigMapRef holds an optional name of a ConfigMap that contains
              the following keys:

              - `provider`: the provider to use. One of `aws`, `azure`, `gcp`, or
                 `generic`. Required.
              - `cluster`: the fully qualified resource name of the Kubernetes
                 cluster in the cloud provider API. Not used by the `generic`
                 provider. Required when one of `address` or `ca.crt` is not set.
              - `address`: the address of the Kubernetes API server. Required
                 for `generic`. For the other providers, if not specified, the
                 first address in the cluster resource will be used, and if
                 specified, it must match one of the addresses in the cluster
                 resource.
                 If audiences is not set, will be used as the audience for the
                 `generic` provider.
              - `ca.crt`: the optional PEM-encoded CA certificate for the
                 Kubernetes API server. If not set, the controller will use the
                 CA certificate from the cluster resource.
              -  `serviceAccountName`: the optional name of the Kubernetes
                 ServiceAccount in the same namespace that should be used
                 for authentication. If not specified, the controller
                 ServiceAccount will be used.
              - `audiences`: the optional audiences as a list of string separated by
                 commas and/or whitespaces/newlines for the Kubernetes ServiceAccount
                 token. Defaults to the `address` for the `generic` provider, or
                 to specific values for the other providers depending on the
                 provider.

              Mutually exclusive with SecretRef.
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/kubeConfig/x-kubernetes-validations
            value:
            - message: exactly one of spec.kubeConfig.configMapRef or spec.kubeConfig.secretRef
                must be specified
              rule: has(self.configMapRef) != has(self.secretRef)
          - op: replace
            path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/helmChart/description
            value: |-
              HelmChart is the namespaced name of the HelmChart resource created by
              the controller for the HelmRelease, in the format '<namespace>/<name>',
              or the typed and namespaced name of the OCIRepository resource, in the
              format '<kind>/<namespace>/<name>'.

        target:
          kind: CustomResourceDefinition
          name: helmreleases.helm.toolkit.fluxcd.io
