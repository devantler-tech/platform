# Additional -config listeners append; Raft, audit, unseal and the legacy
# listener stay in the base. This patch replaces the earlier post-renderer list,
# so it repeats the OnDelete strategy from patches/standby-oidc-canary.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
              namespace: openbao
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
                namespace: openbao
              spec:
                updateStrategy:
                  type: OnDelete
                  rollingUpdate: null
                template:
                  metadata:
                    labels:
                      platform.devantler.tech/arc-transport: tls
                  spec:
                    automountServiceAccountToken: false
  values:
    server:
      extraArgs: -config=/openbao/arc-transport/listener.hcl
      extraPorts:
        - name: arc-tls
          containerPort: 8204
          protocol: TCP
      # Helm values lists replace rather than merge; retain both base mounts.
      volumes:
        - name: unseal-keys
          secret:
            secretName: openbao-unseal
            optional: true
        - name: tmp
          emptyDir: {}
        - name: arc-transport
          configMap:
            name: arc-openbao-listener
        - name: arc-tls
          secret:
            secretName: arc-openbao-server-tls
            defaultMode: 0440
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      volumeMounts:
        - name: unseal-keys
          mountPath: /openbao/unseal
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: arc-transport
          mountPath: /openbao/arc-transport
          readOnly: true
        - name: arc-tls
          mountPath: /openbao/arc-tls
          readOnly: true
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      # OpenBao 2.6 reloads TLS certificates on SIGHUP. A same-identity
      # sidecar signals only the one server process; no API credentials,
      # private-key mount, extra Linux capability or host namespace is used.
      shareProcessNamespace: true
      extraContainers:
        - name: arc-tls-reload
          image: quay.io/openbao/openbao:2.6.3
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while sleep 300; do
                server_pid=""
                for proc in /proc/[0-9]*/comm; do
                  [ "$(cat "$proc" 2>/dev/null)" = "bao" ] || continue
                  candidate="$(basename "$(dirname "$proc")")"
                  command="$(tr '\000' ' ' < "/proc/$candidate/cmdline")"
                  case "$command" in
                    "bao server "*|"/usr/local/bin/bao server "*)
                      [ -z "$server_pid" ] || exit 1
                      server_pid="$candidate"
                      ;;
                  esac
                done
                [ -n "$server_pid" ] || continue
                wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true' || continue
                kill -HUP "$server_pid"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 2m
              memory: 8Mi
            limits:
              memory: 32Mi
