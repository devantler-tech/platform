apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: arc-openbao-ca
spec:
  sources:
    - secret:
        name: arc-openbao-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: arc-runners
