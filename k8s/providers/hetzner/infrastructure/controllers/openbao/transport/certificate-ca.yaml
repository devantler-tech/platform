apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arc-openbao-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: arc-openbao-ca
  secretName: arc-openbao-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: arc-openbao-selfsigned
    kind: Issuer
    group: cert-manager.io
