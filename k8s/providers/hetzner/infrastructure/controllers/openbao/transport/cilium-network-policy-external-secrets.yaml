apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-arc-openbao-tls
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toServices:
        - k8sService:
            serviceName: openbao-arc
            namespace: openbao
      toPorts:
        - ports:
            - port: "8204"
              protocol: TCP
