apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arc-openbao-server-tls
  namespace: openbao
spec:
  secretName: arc-openbao-server-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - openbao-arc.openbao.svc.cluster.local
  issuerRef:
    name: arc-openbao-ca
    kind: ClusterIssuer
    group: cert-manager.io
