# Retain the repaired canary without automatically replacing another replica.
# The bootstrap readiness probe accepts sealed servers, so a partition advance
# cannot guarantee that the canary still participates in Raft quorum (#4391).
# Further replacement requires a separately reviewed, fail-closed health gate.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
              namespace: openbao
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
                namespace: openbao
              spec:
                updateStrategy:
                  type: OnDelete
