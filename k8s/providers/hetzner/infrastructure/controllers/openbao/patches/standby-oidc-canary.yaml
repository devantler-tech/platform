# Retain the running repaired canary without advancing any other replica.
# The bootstrap readiness probe accepts sealed servers, so a partition advance
# cannot guarantee that the canary still participates in Raft quorum (#4391).
# Freeze all three ordinals: a deleted/evicted pod returns at the old revision,
# including the canary if it is lost. OnDelete would instead promote its replacement.
# Further promotion requires a separately reviewed, fail-closed health gate.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
              namespace: openbao
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
                namespace: openbao
              spec:
                updateStrategy:
                  type: RollingUpdate
                  rollingUpdate:
                    partition: 3
