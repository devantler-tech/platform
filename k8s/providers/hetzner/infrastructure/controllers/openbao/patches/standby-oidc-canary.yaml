# Deliver the standby OIDC repair to the next ordinal after healthy canary readback.
# Keep ordinal 0 on its current revision while the second replica is replaced.
# Advancing this partition requires a separate reviewed change and
# deployment readback (#4391); the base/local chart retains OnDelete.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: openbao
              namespace: openbao
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: openbao
                namespace: openbao
              spec:
                updateStrategy:
                  type: RollingUpdate
                  rollingUpdate:
                    partition: 1
