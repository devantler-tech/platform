apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
spec:
  # Matches the base interval so this patch is a no-op on that field once merged.
  interval: 10m
  values:
    alertCRD:
      # Install the chart's rule definitions for the initial runtime-detection
      # baseline (#4968). The appended retain-port-forward-baseline post-renderer retains
      # and binds only R2001, the profile-independent pod port-forward rule. It does not
      # activate the chart's anomaly bindings while profiles remain incomplete.
      #
      # The switch adds only the Rules and binding objects: RBAC, workloads,
      # CRDs, scanned namespaces and existing alert routes stay unchanged.
      # Binding by ID also avoids the chart's mismatched "Port forward" name
      # (#4978). Broader rule coverage still needs its own measured rollout.
      #
      # Keep the value explicit. scripts/tests/test-kubescape-runtime-rules-switch.sh
      # fails when it is absent, renders the pinned chart in both states, and
      # requires the on state to bind exactly the supported R2001 baseline.
      installDefault: true
