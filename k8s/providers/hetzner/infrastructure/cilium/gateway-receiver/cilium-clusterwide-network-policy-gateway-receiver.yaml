apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gateway-receiver
spec:
  description: Bind application ingress to its declared provider connection.
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromCIDRSet:
        - cidr: ${gateway_receiver_source_cidr}
    # The existing native diagnostic has a separate HTTP-only route. Its
    # three synthetic names never select an application HTTPS route.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - host: ^control[.]externalauth-probe[.]invalid$
                method: GET
                path: ^/$
              - host: ^authz[.]externalauth-probe[.]invalid$
                method: GET
                path: ^/$
              - host: ^unrouted[.]externalauth-probe[.]invalid$
                method: GET
                path: ^/$
