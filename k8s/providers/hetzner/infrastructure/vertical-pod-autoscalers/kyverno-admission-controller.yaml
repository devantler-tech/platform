# VPA target for the Kyverno admission controller (shared policy applied via
# kustomization.yaml patches). Its patch manages requests only and keeps both the
# request ceiling and the authored Helm limit at 1Gi, preserving the fail-closed
# admission safety boundary while VPA right-sizes steady-state requests.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-admission-controller
  namespace: kyverno
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-admission-controller
