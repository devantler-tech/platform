---
# Leaf health signal for Crossplane Providers and CloudNativePG Clusters
# (platform#6269). Its path applies only one inert ConfigMap; the Kustomization
# exists to evaluate the health of objects the infrastructure, apps and tenant
# layers own. A failed check makes THIS Kustomization NotReady, which emits a
# Flux error event that the platform-reconciliation Alert delivers.
#
# It must never gate a deploy:
# - Nothing may `dependsOn` it, so a degraded Provider or database never blocks
#   the infrastructure → apps chain.
# - `ksail workload reconcile` (the deploy's convergence wait) skips it through
#   the reconcile-exclude annotation, so a degraded database pages instead of
#   evicting the merge queue.
#
# The timeout plays the role of the CronJobs' 900 s grace: an object that is
# not healthy within 15 minutes fails the check. Health checks name objects
# explicitly, so a new Provider or CNPG Cluster must be added here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-health
  namespace: flux-system
  annotations:
    ksail.devantler.tech/reconcile-exclude: "true"
spec:
  interval: 30m
  timeout: 15m
  path: providers/__PROVIDER__/health
  sourceRef:
    kind: OCIRepository
    name: flux-system
  prune: true
  # Platform Flux layers never force-recreate (persistence safety).
  force: false
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-aws-iam
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-upjet-github
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-upjet-unifi
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: upbound-provider-aws-sesv2
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: upbound-provider-family-aws
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: coroot-db
      namespace: observability
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: kagent-db
      namespace: kagent
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: substrate-db
      namespace: ate-system
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: umami-db
      namespace: umami
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: wedding-db
      namespace: wedding-app
  healthCheckExprs:
    # Same predicate as the crossplane-provider-unhealthy-alert CronJob: the
    # Provider's Healthy condition is True.
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
    # Same predicate as the cnpg-degraded-alert CronJob, and stricter than the
    # infrastructure/apps "serving" gate: every desired instance ready, Ready
    # True, and, when a WAL archiver is configured, ContinuousArchiving True
    # (the 2026-09-09 wedding-db shape, where all instances stayed Ready).
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') &&
        has(status.readyInstances) && status.readyInstances >= spec.instances &&
        (!((has(spec.plugins) && spec.plugins.exists(p,
              (!has(p.enabled) || p.enabled) && has(p.isWALArchiver) && p.isWALArchiver)) ||
           (has(spec.backup) && has(spec.backup.barmanObjectStore))) ||
         status.conditions.exists(c, c.type == 'ContinuousArchiving' && c.status == 'True'))
