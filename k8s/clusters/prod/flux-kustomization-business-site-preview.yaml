---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: business-site-preview
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  path: ./practice
  sourceRef:
    kind: OCIRepository
    name: business-site
    namespace: business-site
  serviceAccountName: business-site-practice
  # Apps waits for the database primary and its ExternalSecret projections.
  # Keep the Job in its own inventory so that rebuilds wait for the database.
  dependsOn:
    - name: apps
    - name: business-site-practice-permissions
  wait: true
  prune: true
  force: false
