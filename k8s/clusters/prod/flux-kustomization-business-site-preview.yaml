---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: business-site-preview
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  path: providers/__PROVIDER__/business-site-preview-workload
  sourceRef:
    kind: OCIRepository
    name: flux-system
  # Apps waits for the database primary and its ExternalSecret projections.
  # Keep the Job out of that inventory so a rebuild waits before creating it.
  dependsOn:
    - name: apps
  wait: true
  prune: true
  force: false
