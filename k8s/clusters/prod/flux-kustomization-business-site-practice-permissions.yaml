---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: business-site-practice-permissions
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  path: providers/__PROVIDER__/business-site-practice-permissions
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: apps
  wait: true
  prune: true
