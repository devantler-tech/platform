---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 60m
  # Give the retained Umami bootstrap Job a full recovery window for its first
  # Lease-aware rollout. Controller-level startup failures remain retryable
  # across later reconciliations instead of becoming a permanently Failed Job;
  # the retry interval below re-enters the health wait after a timeout.
  timeout: 30m
  retryInterval: 2m
  path: providers/__PROVIDER__/apps
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      # Per-Flux docs, later entries override earlier ones, so the base
      # (defaults) come first and the per-cluster overrides come last.
      # Only ConfigMaps: there is no variables-base Secret to substitute from.
      - kind: ConfigMap
        name: variables-base
      - kind: ConfigMap
        name: variables-cluster
      - kind: Secret
        name: variables-cluster
  wait: true
  # kstatus (used by `wait: true`) marks a CNPG `Cluster` NotReady for the whole
  # of any rolling update — and CNPG rolls every instance whenever the operator,
  # the barman-cloud plugin sidecar, or the PostgreSQL image changes, which
  # Renovate does routinely (plugin v0.13.0 → v0.14.0 in #2971 restarted every
  # instance of all four clusters). A database that is merely rolling, or
  # serving on 2 of 3 instances, therefore fails this Kustomization's health
  # check, times out the deploy, and evicts every PR from the merge queue:
  # wedding-db 2026-06-19, coroot-db 2026-07-14 (#2639), umami-db twice on
  # 2026-08-05. Gate on "the database is SERVING" instead — a primary is elected
  # and at least one instance is ready.
  # A degraded-but-serving cluster is a paging concern, not a deploy failure;
  # the cnpg-degraded-alert CronJob owns that signal and is deliberately
  # independent of this gate, so relaxing the gate removes no coverage. A
  # cluster with no ready instance still matches no `current` expression, stays
  # InProgress, and still fails the deploy.
  healthCheckExprs:
    # The storage-only mail stages have no consumer: WFFC is correctly Pending.
    # Their serving bundles remove this marker and must wait for Bound. Preserve
    # normal binding waits for every other claim and for started provisioning.
    - apiVersion: v1
      kind: PersistentVolumeClaim
      failed: has(status.phase) && status.phase == 'Lost'
      current: >-
        !has(metadata.deletionTimestamp) && has(status.phase) &&
        (status.phase == 'Bound' ||
          (status.phase == 'Pending' && metadata.namespace == 'private-mail' &&
           has(metadata.labels) && 'platform.devantler.tech/storage-stage' in metadata.labels &&
           metadata.labels['platform.devantler.tech/storage-stage'] == 'prepared' &&
           has(spec.storageClassName) &&
           ((metadata.name == 'private-mail-data' && spec.storageClassName == 'longhorn-wffc') ||
            (metadata.name == 'email-data-encrypted' && spec.storageClassName == 'email-encrypted') ||
            (metadata.name == 'email-data-encrypted-v2' && spec.storageClassName == 'email-encrypted-v2')) &&
           !has(spec.volumeName) &&
           (!has(metadata.annotations) || !('volume.kubernetes.io/selected-node' in metadata.annotations))))
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary) && status.currentPrimary != ''
    # Tenants own their health (ADR 0019, monorepo#5094). Every Flux
    # Kustomization this layer applies belongs to a tenant: the product's own
    # release, reconciled in its own namespace. Tenants follow their release
    # tags, so a broken tenant release must not fail `apps` and, through it,
    # the platform's merge-queue deploys. Tenant Kustomizations, and the
    # sources labelled `platform.devantler.tech/tenant-source`, count as
    # healthy once they exist. A failing release keeps the tenant on its last
    # good revision (Flux refuses an unsigned artifact and dry-runs the whole
    # package first), and the flux-notifications alert reports the tenant's
    # own error events. Platform chart sources (no label) keep the usual Flux
    # readiness: in progress until observed at their generation, failed when
    # stalled, healthy when Ready. HelmReleases keep their normal check.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      current: "true"
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      inProgress: >-
        !(has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) &&
        (!has(status.observedGeneration) || status.observedGeneration != metadata.generation ||
        (has(status.conditions) && status.conditions.exists(c, c.type == 'Reconciling' && c.status == 'True')))
      failed: >-
        !(has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) &&
        has(status.conditions) && status.conditions.exists(c, c.type == 'Stalled' && c.status == 'True')
      current: >-
        (has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) ||
        (has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True'))
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      inProgress: >-
        !(has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) &&
        (!has(status.observedGeneration) || status.observedGeneration != metadata.generation ||
        (has(status.conditions) && status.conditions.exists(c, c.type == 'Reconciling' && c.status == 'True')))
      failed: >-
        !(has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) &&
        has(status.conditions) && status.conditions.exists(c, c.type == 'Stalled' && c.status == 'True')
      current: >-
        (has(metadata.labels) && 'platform.devantler.tech/tenant-source' in metadata.labels) ||
        (has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True'))
  prune: true
  # Immutable conflicts require an operator plan; individual Jobs opt into recreation.
  force: false
