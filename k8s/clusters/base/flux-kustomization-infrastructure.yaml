---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  path: providers/__PROVIDER__/infrastructure
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      # Per-Flux docs, later entries override earlier ones, so the base
      # (defaults) come first and the per-cluster overrides come last.
      # The variables-base SECRET is deliberately absent: its only remaining
      # key (ghcr_dockerconfigjson) is seed-only (vault-seed PushSecrets read
      # the Secret object directly) — no manifest substitutes from it.
      - kind: ConfigMap
        name: variables-base
      - kind: ConfigMap
        name: variables-cluster
      - kind: Secret
        name: variables-cluster
  wait: true
  # kstatus (used by `wait: true`) has no built-in readiness rule for KRO's
  # ResourceGraphDefinition, so it stays InProgress forever and the whole
  # infrastructure reconcile times out (the Tenant RGD added here).
  # KRO reports readiness via `status.state: Active|Inactive`, so teach Flux to
  # health-check RGDs by that field via a CEL expression.
  healthCheckExprs:
    - apiVersion: kro.run/v1alpha1
      kind: ResourceGraphDefinition
      current: status.state == 'Active'
    # coroot-db lives in this layer. kstatus marks a CNPG `Cluster` NotReady for
    # the whole of any rolling update — and CNPG rolls every instance whenever
    # the operator, the barman-cloud plugin sidecar, or the PostgreSQL image
    # changes, which Renovate does routinely. That failed this Kustomization's
    # health check and evicted every PR from the merge queue on 2026-07-14
    # (#2639). Gate on "the database is SERVING" instead — a primary is elected
    # and at least one instance is ready. A degraded-but-serving cluster is a
    # paging concern, not a deploy failure; the cnpg-degraded-alert CronJob owns
    # that signal independently of this gate. A cluster with no ready instance
    # matches no `current` expression, stays InProgress, and still fails.
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary) && status.currentPrimary != ''
  prune: true
  force: true
