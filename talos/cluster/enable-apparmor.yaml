machine:
  install:
    extraKernelArgs:
      # Keep Talos v1.13.10's compiled modules, but select AppArmor before
      # SELinux: these major LSMs are exclusive, so only the first activates.
      # AppArmor must also precede BPF, whose audit-context hook otherwise
      # takes precedence and causes "audit: error in audit_log_subj_ctx".
      # See Linux security/security.c and CachyOS/linux-cachyos#878.
      - lsm=yama,apparmor,selinux,loadpin,safesetid,integrity,bpf,lockdown,landlock
    # KSail folds this native Talos declaration into the Image Factory
    # schematic, clears the deprecated rendered extraKernelArgs field, and pins
    # grubUseUKICmdline=true so the baked-in arguments take effect. The canonical
    # registration body in talos/factory-schematic.yaml is contract-tested
    # against this source declaration and registered before production publish.
