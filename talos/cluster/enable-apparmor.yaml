machine:
  install:
    extraKernelArgs:
      # Preserve Talos v1.13.10's complete upstream CONFIG_LSM order while
      # explicitly enabling AppArmor. Linux 6.18 no longer reliably supplies an audit
      # subject context when the legacy security=apparmor selector is used;
      # every affected audit record then emits
      # "audit: error in audit_log_subj_ctx". An explicit lsm= list keeps the
      # other compiled hardening modules active and restores that context.
      - lsm=yama,selinux,loadpin,safesetid,integrity,bpf,apparmor,lockdown,landlock
    # KSail folds this native Talos declaration into the Image Factory
    # schematic, clears the deprecated rendered extraKernelArgs field, and pins
    # grubUseUKICmdline=true so the baked-in arguments take effect. The canonical
    # registration body in talos/factory-schematic.yaml is contract-tested
    # against this source declaration and registered before production publish.
