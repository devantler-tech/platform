# Substrate, the sandbox runtime under kagent 1.0's Claude Code harness
# (devantler-tech/monorepo#4866, devantler-tech/platform#5892), gives each
# workload its identity as a Pod Certificate and publishes its CAs as
# ClusterTrustBundles. Kubernetes 1.36 ships both APIs as beta and off by
# default, so the API server must serve certificates.k8s.io/v1beta1, and every
# component that creates, signs or mounts them needs the same gates, as in
# Substrate's own reference cluster.
#
# No other patch sets these flags, and KSail adds its own API server
# feature-gates only for Calico clusters. Talos merges extraArgs key by key, so
# a second `feature-gates` value in another patch would replace this one:
# extend this file instead.
---
cluster:
  apiServer:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
      runtime-config: certificates.k8s.io/v1beta1=true
  controllerManager:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
  scheduler:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
machine:
  kubelet:
    extraConfig:
      featureGates:
        ClusterTrustBundle: true
        ClusterTrustBundleProjection: true
        PodCertificateRequest: true
