# Kubelet node-labels for Talos workers.
#
# All node-labels must be combined in this single file: Talos strategic
# merge overwrites map keys, so if multiple worker patches set
# kubelet.extraArgs.node-labels the last one wins.
#
# Labels set here are applied at kubelet registration time, so DaemonSets
# (e.g. Longhorn) can match nodes immediately on first boot. Labels set
# via machine.nodeLabels are applied later by NodeApplyController and
# would race with registration-time scheduling.
machine:
  # Reconcile existing Node objects too; kubelet registration arguments alone
  # do not prove that an already registered node has adopted the new label.
  nodeLabels:
    node.longhorn.io/create-default-disk: config
  kubelet:
    extraArgs:
      node-labels: "node.longhorn.io/create-default-disk=config"
  nodeAnnotations:
    # Talos unlocks this encrypted raw partition under a stable mapper name.
    # Existing V1 disks are unchanged: Longhorn reads these defaults only for a
    # node with this label and no disks. KSail removes the label from autoscaler
    # nodes, so they stay without a default disk. A permanent worker rebuilt from
    # this config gets the V2 disk, not a V1 one (#5582).
    node.longhorn.io/default-disks-config: >-
      [{"name":"longhorn-v2","path":"/dev/mapper/luks2-r-longhorn","diskType":"block","diskDriver":"aio","allowScheduling":true,"storageReserved":4294967296}]
