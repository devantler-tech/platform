apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wedding-db
  namespace: wedding-app
spec:
  instances: 3
  storage:
    size: 1Gi
    storageClass: longhorn-wffc
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: dedicated-backups
