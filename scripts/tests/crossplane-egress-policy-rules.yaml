       has(object.spec.matchConstraints.resourceRules[0].apiGroups) &&
       object.spec.matchConstraints.resourceRules[0].apiGroups == ['apps'] &&
       has(object.spec.matchConstraints.resourceRules[0].apiVersions) &&
       object.spec.matchConstraints.resourceRules[0].apiVersions == ['v1'] &&
       has(object.spec.matchConstraints.resourceRules[0].operations) &&
       object.spec.matchConstraints.resourceRules[0].operations == ['CREATE', 'UPDATE'] &&
       has(object.spec.matchConstraints.resourceRules[0].resources) &&
       object.spec.matchConstraints.resourceRules[0].resources.size() == 1 &&
