             target.kind == '*' ||
             target.kind.matches('^cilium[.]io/[^/]+/CiliumClusterwideNetworkPolicy$') ||
             (target.kind == 'CiliumClusterwideNetworkPolicy' &&
              (!has(target.apiVersion) ||
               target.apiVersion == 'cilium.io/v2')) ||
             ((target.kind.matches('^cilium[.]io/[^/]+/CiliumNetworkPolicy$') ||
               target.kind.matches('^networking[.]k8s[.]io/[^/]+/NetworkPolicy$') ||
               (target.kind == 'CiliumNetworkPolicy' &&
                (!has(target.apiVersion) ||
                 target.apiVersion == 'cilium.io/v2')) ||
               (target.kind == 'NetworkPolicy' &&
                (!has(target.apiVersion) ||
                 target.apiVersion == 'networking.k8s.io/v1'))) &&
              (!has(target.namespace) ||
