    message: >-
      Helm-rendered Kyverno policies must not mutate network-policy resources
    severity: error

  - name: reject-kyverno-cleanup-policy-producers
    expression: >-
      !has(object.apiVersion) ||
      !object.apiVersion.startsWith('kyverno.io/') ||
      !(object.kind in ['CleanupPolicy', 'ClusterCleanupPolicy'])
    message: >-
      Helm-rendered cleanup policies require explicit effective-policy review
      before deployment
    severity: error

  # Three reviewed exceptions; every other GeneratingPolicy, MutatingPolicy and
  # DeletingPolicy stays rejected.
  #
  # #2573: a DeletingPolicy whose every resource rule names only the
  # wgpolicyk8s.io group and only policy-report resources. Kyverno report
  # objects cannot carry or restore network egress, so such a policy cannot
  # delete allow-crossplane. Any other group, a wildcard, or a rule missing
  # either list keeps the policy rejected.
  #
  # #5096: a MutatingPolicy whose every resource rule names only Flux
  # HelmReleases, that mutates no existing object, and whose every mutation is
  # a JSON patch that adds or replaces only the HelmRelease CRD strategy
  # (/spec/install, /spec/upgrade and their crds fields). A HelmRelease is not
  # a network policy, and those paths cannot reach its chart values. The
  # patch expression is read as text: each `path` and `op` must be followed
  # by one of those string literals, so a computed path, another field, or a
  # move/copy/remove keeps the policy rejected. A leading '#' keeps the text
  # before the first match from ever reading as an approved literal.
  # Its spec holds only the match constraints (resource rules naming only their
  # four selection fields, and an object selector, a label selector that is not
  # CEL), exactly one match condition that reads the incoming object's
  # helm.toolkit.fluxcd.io/crds label exactly as the reviewed policy does, and
  # exactly one mutation whose expression equals the reviewed one once spaces,
  # tabs and line breaks are removed (under the same no-whitespace-in-literals
  # rule as the auto-vpa expressions below). Every other field is refused,
  # because variables, conditions and patch values are CEL that can read or
  # write the cluster (#5106). The same condition pattern and expression are
  # pinned in scripts/guard-consumer-discovery-conservation.sh.
  #
  # #5102: the shared catalog's auto-vpa
  # (devantler-tech/kyverno-policies
  # policies/best-practices/auto-vpa-generating-policy.yaml): a
  # GeneratingPolicy whose spec holds only evaluation settings, one apps
  # resource rule (apiGroups, apiVersions, operations, resources) naming one
  # deployments, daemonsets or statefulsets resource, optionally (#5125) a
  # namespaceSelector whose only field is matchExpressions, each
  # kubernetes.io/metadata.name NotIn a list of names (a label selector is not
  # CEL and can only narrow which workloads trigger it), and one generate
  # expression that equals the catalog's expression for that resource once
  # spaces, tabs and line breaks are removed from both. Every other spec field
  # is refused, because variables and matchConditions are CEL that can read or
  # write the cluster. That expression builds only a VerticalPodAutoscaler for
  # the triggering workload, in its own namespace; a VerticalPodAutoscaler is
  # not a network policy. Whitespace is removed only to tolerate formatting
  # between tokens: the expression must also hold no backslash and no
  # double-quoted literal containing whitespace, so removing it can never turn
  # a different key or value ("update Policy") into a reviewed one. The
  # same three expressions are pinned in
  # scripts/guard-consumer-discovery-conservation.sh; a catalog change is
  # refused by both until it is reviewed here.
  # #5357 adds only the two closed Helm-default specs. Their fixed patches
  # may vary token whitespace, never quoted literal whitespace or escapes.
  # Added variables, selectors or evaluation fields remain unreviewed.
  - name: reject-cel-policy-producers
    expression: >-
      !has(object.apiVersion) ||
      !object.apiVersion.startsWith('policies.kyverno.io/') ||
      !(object.kind in [
        'GeneratingPolicy', 'MutatingPolicy', 'DeletingPolicy'
      ]) ||
      (object.kind == 'DeletingPolicy' &&
       has(object.spec) &&
       has(object.spec.matchConstraints) &&
       has(object.spec.matchConstraints.resourceRules) &&
       object.spec.matchConstraints.resourceRules.size() > 0 &&
       object.spec.matchConstraints.resourceRules.all(rule,
         has(rule.apiGroups) && rule.apiGroups == ['wgpolicyk8s.io'] &&
         has(rule.resources) && rule.resources.size() > 0 &&
         rule.resources.all(resource,
           resource in ['policyreports', 'clusterpolicyreports']))) ||
      (object.apiVersion == 'policies.kyverno.io/v1' &&
       object.kind == 'MutatingPolicy' &&
       has(object.spec) && has(object.spec.mutations) &&
       object.spec.mutations.size() == 1 &&
       has(object.spec.mutations[0].jsonPatch) &&
       has(object.spec.mutations[0].jsonPatch.expression) &&
       type(object.spec.mutations[0].jsonPatch.expression) == string &&
       object.spec.mutations[0].jsonPatch.expression.matches(
         '^[^"\\x5c]*("[^"\\x5c\\s]*"[^"\\x5c]*)*$') &&
       [{"label":"helm.toolkit.fluxcd.io/helm-test","conditionName":"tests-enabled-on-incoming-object","conditionExpression":"has(object.metadata.labels) && 'helm.toolkit.fluxcd.io/helm-test' in object.metadata.labels && object.metadata.labels['helm.toolkit.fluxcd.io/helm-test'] == 'enabled'","patch":"(has(object.spec.test)&&object.spec.test!=null?[]:[JSONPatch{op:\"add\",path:\"/spec/test\",value:{}}])+[JSONPatch{op:\"add\",path:\"/spec/test/enable\",value:true}]"},{"label":"helm.toolkit.fluxcd.io/remediation","conditionName":"remediation-enabled-on-incoming-object","conditionExpression":"has(object.metadata.labels) && 'helm.toolkit.fluxcd.io/remediation' in object.metadata.labels && object.metadata.labels['helm.toolkit.fluxcd.io/remediation'] == 'enabled'","patch":"(has(object.spec.install)&&object.spec.install!=null?[]:[JSONPatch{op:\"add\",path:\"/spec/install\",value:{}}])+(has(object.spec.install)&&object.spec.install!=null&&has(object.spec.install.remediation)&&object.spec.install.remediation!=null?[]:[JSONPatch{op:\"add\",path:\"/spec/install/remediation\",value:{}}])+[JSONPatch{op:\"add\",path:\"/spec/install/remediation/retries\",value:3},JSONPatch{op:\"add\",path:\"/spec/install/remediation/remediateLastFailure\",value:true}]+(has(object.spec.upgrade)&&object.spec.upgrade!=null?[]:[JSONPatch{op:\"add\",path:\"/spec/upgrade\",value:{}}])+(has(object.spec.upgrade)&&object.spec.upgrade!=null&&has(object.spec.upgrade.remediation)&&object.spec.upgrade.remediation!=null?[]:[JSONPatch{op:\"add\",path:\"/spec/upgrade/remediation\",value:{}}])+[JSONPatch{op:\"add\",path:\"/spec/upgrade/remediation/retries\",value:3},JSONPatch{op:\"add\",path:\"/spec/upgrade/remediation/remediateLastFailure\",value:true}]"}].exists(approved,
         object.spec.mutations[0].jsonPatch.expression.replace(' ', '').replace('\n', '').replace('\t', '').replace('\r', '') == approved.patch &&
         object.spec == {
           'failurePolicy': 'Fail',
           'matchConstraints': {
             'objectSelector': {'matchLabels': {approved.label: 'enabled'}},
             'resourceRules': [{
               'apiGroups': ['*'], 'apiVersions': ['*'],
               'operations': ['CREATE', 'UPDATE'], 'resources': ['*']
             }]
           },
           'matchConditions': [
             {'name': 'helm-release-kind', 'expression': "object.kind == 'HelmRelease'"},
             {'name': approved.conditionName, 'expression': approved.conditionExpression}
           ],
           'mutations': [{
             'patchType': 'JSONPatch',
             'jsonPatch': {'expression': object.spec.mutations[0].jsonPatch.expression}
           }]
         })) ||
      (object.kind == 'MutatingPolicy' &&
       has(object.spec) &&
       !has(object.spec.targetMatchConstraints) &&
       object.spec.all(key, key in ['matchConstraints', 'matchConditions', 'mutations']) &&
       has(object.spec.matchConditions) &&
       object.spec.matchConditions.size() == 1 &&
       object.spec.matchConditions.all(condition,
         condition.all(key, key in ['name', 'expression']) &&
         has(condition.expression) && type(condition.expression) == string &&
         condition.expression.matches(
           "^\\s*has\\(object\\.metadata\\.labels\\)\\s*&&\\s*'helm\\.toolkit\\.fluxcd\\.io/crds'\\s+in\\s+object\\.metadata\\.labels\\s*&&\\s*object\\.metadata\\.labels\\['helm\\.toolkit\\.fluxcd\\.io/crds'\\]\\s*==\\s*'enabled'\\s*$")) &&
       (!has(object.spec.evaluation) ||
        !has(object.spec.evaluation.mutateExisting)) &&
       has(object.spec.matchConstraints) &&
       object.spec.matchConstraints.all(key,
         key in ['resourceRules', 'objectSelector']) &&
       has(object.spec.matchConstraints.resourceRules) &&
       object.spec.matchConstraints.resourceRules.size() > 0 &&
       object.spec.matchConstraints.resourceRules.all(rule,
         rule.all(key, key in ['apiGroups', 'apiVersions', 'operations', 'resources']) &&
         has(rule.apiGroups) && rule.apiGroups == ['helm.toolkit.fluxcd.io'] &&
         has(rule.resources) && rule.resources == ['helmreleases']) &&
       has(object.spec.mutations) &&
       object.spec.mutations.size() == 1 &&
       object.spec.mutations.all(mutation,
         mutation.all(key, key in ['patchType', 'jsonPatch']) &&
         has(mutation.patchType) && mutation.patchType == 'JSONPatch' &&
         !has(mutation.applyConfiguration) &&
         has(mutation.jsonPatch) &&
         mutation.jsonPatch.all(key, key == 'expression') &&
         has(mutation.jsonPatch.expression) &&
         type(mutation.jsonPatch.expression) == string &&
         mutation.jsonPatch.expression.matches(
           '^[^"\\x5c]*("[^"\\x5c\\s]*"[^"\\x5c]*)*$') &&
         mutation.jsonPatch.expression.replace(' ', '').replace('\n', '').replace('\t', '').replace('\r', '') ==
           '(has(object.spec.install)?[]:[JSONPatch{op:"add",path:"/spec/install",value:{}}])+[JSONPatch{op:"add",path:"/spec/install/crds",value:"CreateReplace"}]+(has(object.spec.upgrade)?[]:[JSONPatch{op:"add",path:"/spec/upgrade",value:{}}])+[JSONPatch{op:"add",path:"/spec/upgrade/crds",value:"CreateReplace"}]' &&
         ('#' + mutation.jsonPatch.expression).split('path').size() > 1 &&
         ('#' + mutation.jsonPatch.expression).split('path').filter(part,
           !part.matches(
             '^\\s*:\\s*"/spec/(install|upgrade)(/crds)?"\\s*[,}]')
         ).size() == 1 &&
         ('#' + mutation.jsonPatch.expression).split('op').filter(part,
           !part.matches('^\\s*:\\s*"(add|replace)"\\s*[,}]')
         ).size() == 1)) ||
      (object.kind == 'GeneratingPolicy' &&
       has(object.spec) &&
       object.spec.all(key, key in ['evaluation', 'matchConstraints', 'generate']) &&
       (!has(object.spec.evaluation) ||
        object.spec.evaluation.all(key, key in [
          'admission', 'generateExisting', 'synchronize',
          'orphanDownstreamOnPolicyDelete'])) &&
       has(object.spec.matchConstraints) &&
       object.spec.matchConstraints.all(key,
         key in ['resourceRules', 'namespaceSelector']) &&
       (!has(object.spec.matchConstraints.namespaceSelector) ||
        (object.spec.matchConstraints.namespaceSelector.all(key,
           key == 'matchExpressions') &&
         has(object.spec.matchConstraints.namespaceSelector.matchExpressions) &&
         object.spec.matchConstraints.namespaceSelector.matchExpressions.size() > 0 &&
         object.spec.matchConstraints.namespaceSelector.matchExpressions.all(expression,
           expression.all(key, key in ['key', 'operator', 'values']) &&
           has(expression.key) &&
           expression.key == 'kubernetes.io/metadata.name' &&
           has(expression.operator) && expression.operator == 'NotIn' &&
           has(expression.values) && expression.values.size() > 0 &&
           expression.values.all(value, type(value) == string)))) &&
       has(object.spec.matchConstraints.resourceRules) &&
       object.spec.matchConstraints.resourceRules.size() == 1 &&
       object.spec.matchConstraints.resourceRules[0].all(key, key in [
