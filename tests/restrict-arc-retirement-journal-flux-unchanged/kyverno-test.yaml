# Pins the preserve-retirement-journal rule before the ValidatingPolicy rewrite
# (#4995): a controller without system:masters may update the Namespace when the journal is unchanged.
# values.yaml supplies the previous Namespace and user-info.yaml the requester;
# each case needs its own directory because all three are the one Namespace.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-arc-retirement-journal-flux-unchanged
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-arc-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-arc-retirement
    rule: preserve-retirement-journal
    resources:
      - arc-runners
    kind: Namespace
    result: pass
