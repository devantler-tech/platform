---
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
globalValues:
  request.operation: UPDATE
policies:
  - name: restrict-arc-retirement
    resources:
      - name: arc-runners
        values:
          request.oldObject:
            metadata:
              name: arc-runners
              annotations:
                platform.devantler.tech/arc-retirement: '{"phase":"drained"}'
