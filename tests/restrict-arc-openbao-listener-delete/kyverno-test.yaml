# Pins the ClusterPolicy's behaviour before its ValidatingPolicy rewrite (#4995).
# The audited listener in openbao passes; the same name anywhere else fails; a
# ConfigMap with another name is outside the rule. Changed content in openbao is
# covered by the -extra-data, -binary-data and -changed-listener fixtures, which
# need their own directory because every case shares one namespace and name.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-arc-openbao-listener-delete
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-arc-openbao-listener.yaml
resources:
  - ../restrict-arc-openbao-listener/resources.yaml
variables: ../restrict-arc-openbao-listener-delete/values.yaml
results:
  - policy: restrict-arc-openbao-listener
    rule: public-listener-settings-only
    resources:
      - openbao/arc-openbao-listener
    kind: ConfigMap
    result: pass
  - policy: restrict-arc-openbao-listener
    rule: public-listener-settings-only
    resources:
      - arc-runners/arc-openbao-listener
    kind: ConfigMap
    result: fail
  - policy: restrict-arc-openbao-listener
    rule: public-listener-settings-only
    resources:
      - openbao/openbao-config
    kind: ConfigMap
    result: skip
