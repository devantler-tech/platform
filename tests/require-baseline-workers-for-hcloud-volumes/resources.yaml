---
apiVersion: v1
kind: Pod
metadata:
  name: guarded-by-label
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-guarded-by-label
---
apiVersion: v1
kind: Pod
metadata:
  name: guarded-by-hostname
  namespace: openbao
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["prod-worker-1", "prod-worker-2", "prod-worker-3"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-openbao-0
---
apiVersion: v1
kind: Pod
metadata:
  name: guarded-by-label-in-every-term
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true"]
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["fsn1"]
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-guarded-by-label-in-every-term
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-hcloud-guarded
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            storageClassName: hcloud
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: no-affinity
  namespace: observability
spec:
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-no-affinity
---
apiVersion: v1
kind: Pod
metadata:
  name: extra-unguarded-or-term
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true"]
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values: ["linux"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-extra-unguarded-or-term
---
apiVersion: v1
kind: Pod
metadata:
  name: label-value-false
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: platform.devantler.tech/baseline-worker
                operator: In
                values: ["true", "false"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-label-value-false
---
apiVersion: v1
kind: Pod
metadata:
  name: negative-autoscaled-guard
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: ksail.io/autoscaled
                operator: DoesNotExist
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-negative-autoscaled-guard
---
apiVersion: v1
kind: Pod
metadata:
  name: hostname-includes-autoscaler
  namespace: openbao
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["prod-worker-1", "autoscale-cx43-59ee3c84869749a0"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-hostname-includes-autoscaler
---
apiVersion: v1
kind: Pod
metadata:
  name: hostname-operator-notin
  namespace: openbao
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["prod-worker-1"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-hostname-operator-notin
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-hcloud-unguarded
  namespace: observability
spec:
  containers:
    - name: app
      image: busybox
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            storageClassName: hcloud
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-default-class-unguarded
  namespace: observability
spec:
  containers:
    - name: app
      image: busybox
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: no-claims
  namespace: observability
spec:
  containers:
    - name: app
      image: busybox
  volumes:
    - name: cache
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: guarded-by-node-selector
  namespace: observability
spec:
  nodeSelector:
    platform.devantler.tech/baseline-worker: "true"
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-guarded-by-node-selector
---
apiVersion: v1
kind: Pod
metadata:
  name: node-selector-wrong-value
  namespace: observability
spec:
  nodeSelector:
    platform.devantler.tech/baseline-worker: "false"
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-node-selector-wrong-value
---
apiVersion: v1
kind: Pod
metadata:
  name: match-fields-only-term
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchFields:
              - key: metadata.name
                operator: In
                values: ["prod-worker-1"]
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-match-fields-only-term
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-term
  namespace: observability
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - {}
  containers:
    - name: app
      image: busybox
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-empty-term
