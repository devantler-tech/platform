# The Kyverno CLI has no API server, so the claims the policies list are
# supplied here. Every claim a Pod in resources.yaml mounts uses the hcloud
# class; the sibling longhorn-claim/ fixture proves a non-hcloud claim is not
# caught, and missing-claim/ proves an absent claim is reported.
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-guarded-by-label
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-openbao-0
        namespace: openbao
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-guarded-by-label-in-every-term
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-no-affinity
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-extra-unguarded-or-term
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-label-value-false
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-negative-autoscaled-guard
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-hostname-includes-autoscaler
        namespace: openbao
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-hostname-operator-notin
        namespace: openbao
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-guarded-by-node-selector
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-node-selector-wrong-value
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-match-fields-only-term
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-empty-term
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-node-name-autoscaler-overrides-selector
        namespace: observability
      spec:
        storageClassName: hcloud
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data-node-name-baseline-worker
        namespace: observability
      spec:
        storageClassName: hcloud
