---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-baseline-workers-for-hcloud-volumes-longhorn-claim
policies:
  - >-
    ../../../k8s/providers/hetzner/infrastructure/cluster-policies/require-baseline-workers-for-hcloud-volumes.yaml
resources:
  - resources.yaml
# The claim uses the cluster default Longhorn class. Longhorn replicates across
# nodes and is guarded separately, so an unpinned Pod is not caught. The audit
# companion passing proves the listed claim was found, so this fixture cannot
# pass because the lookup returned nothing.
context: context.yaml
results:
  - policy: require-baseline-workers-for-hcloud-volumes
    resources:
      - observability/longhorn-claim-unguarded
    kind: Pod
    result: pass
  - policy: report-hcloud-claim-lookup-failure
    resources:
      - observability/longhorn-claim-unguarded
    kind: Pod
    result: pass
