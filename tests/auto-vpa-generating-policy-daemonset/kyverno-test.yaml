---
# The platform's copy of the catalog's auto-vpa-daemonset GeneratingPolicy (#5130).
# The expected VPA is the catalog's own fixture (tests/auto-vpa/generated-daemonset-vpa.yaml
# at 44ed118), moved to a non-system namespace: the platform copy must generate
# exactly what the catalog does there. System-namespace exclusion and its
# selector-removal generation control are pinned by
# scripts/tests/test-auto-vpa-generating-policy-exclusion.sh.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auto-vpa-generating-policy-daemonset
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/auto-vpa-daemonset.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: auto-vpa-daemonset
    rule: auto-vpa-daemonset
    resources:
      - apps-ns/shared
    generatedResource: generated-vpa.yaml
    kind: DaemonSet
    result: pass
