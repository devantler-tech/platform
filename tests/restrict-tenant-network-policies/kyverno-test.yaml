    kind: CiliumNetworkPolicy
    result: pass
    resources:
      - other-tenant/allow-other-tenant-egress-named-service
      - tenant-ns/allow-all-own-pods-from-api
      - tenant-ns/allow-api-to-web
      - tenant-ns/allow-web-egress-db
