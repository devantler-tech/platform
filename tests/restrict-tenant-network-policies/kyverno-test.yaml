      - tenant-ns/allow-web-egress-k8s-prefixed-labels
      - tenant-ns/allow-web-egress-named-fqdn
      - tenant-ns/allow-web-egress-named-service
      - tenant-ns/allow-web-egress-outside-protected-ranges
      - tenant-ns/allow-web-egress-public-v6
      - tenant-ns/allow-web-egress-selected-service
      - tenant-ns/allow-web-egress-selected-service-expression
      - tenant-ns/allow-web-egress-specific-cidr
      - tenant-ns/allow-web-egress-subdomain-fqdn
      - tenant-ns/allow-web-egress-to-kube-apiserver-selector
