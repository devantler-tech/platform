---
# One row per resource: fail when any check refuses it. Which check refuses it is
# in per-check.yaml, which scripts/tests/test-restrict-tenant-network-policies.sh
# runs. The policy reads namespace labels through namespaceObject in matchConditions,
# so the CLI needs the namespace labels declared explicitly.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-tenant-network-policies
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-tenant-network-policies.yaml
resources:
  - resources.yaml
  - node-group-resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-tenant-network-policies
    kind: CiliumNetworkPolicy
    result: fail
    resources:
      - tenant-ns/allow-cnpg-operator
      - tenant-ns/allow-dns
      - tenant-ns/attack-cidr-cgnat-egress
      - tenant-ns/attack-cidr-every-slash16-v4-egress
      - tenant-ns/attack-cidr-every-slash16-v6-egress
      - tenant-ns/attack-cidr-ipv4-mapped-v6-egress
      - tenant-ns/attack-cidr-link-local-metadata-egress
      - tenant-ns/attack-cidr-link-local-v6-ingress
      - tenant-ns/attack-cidr-loopback-egress
      - tenant-ns/attack-cidr-multicast-egress
      - tenant-ns/attack-cidr-node-private-network-ingress
      - tenant-ns/attack-cidr-pod-network-egress
      - tenant-ns/attack-cidr-prefix-floor-slash8
      - tenant-ns/attack-cidr-private-172-cidrset-egress
      - tenant-ns/attack-cidr-reserved-beside-legitimate-egress
      - tenant-ns/attack-cidr-six-to-four-egress
      - tenant-ns/attack-cidr-ula-v6-egress
      - tenant-ns/attack-cidr-ula-v6-uppercase-egress
      - tenant-ns/attack-cidr-zero-padded-prefix
      - tenant-ns/attack-cidrset-group-ref-beside-cidr-egress
      - tenant-ns/attack-cidrset-group-ref-beside-cidr-ingress
      - tenant-ns/attack-cidrset-group-ref-egress
      - tenant-ns/attack-cidrset-group-ref-ingress
      - tenant-ns/attack-cidrset-group-selector-beside-cidr-egress
      - tenant-ns/attack-cidrset-group-selector-beside-cidr-ingress
      - tenant-ns/attack-cidrset-group-selector-egress
      - tenant-ns/attack-fqdn-wildcard-depths
      - tenant-ns/attack-fromgroups-empty-list
      - tenant-ns/attack-fromgroups-empty-selector
      - tenant-ns/attack-fromgroups-null
      - tenant-ns/attack-fromgroups-populated-selector
      - tenant-ns/attack-fromnodes-empty-list
      - tenant-ns/attack-fromnodes-empty-selector
      - tenant-ns/attack-fromnodes-null
      - tenant-ns/attack-fromnodes-populated-selector
      - tenant-ns/attack-selector-any-host-egress
      - tenant-ns/attack-selector-bare-namespace-ingress
      - tenant-ns/attack-selector-bare-world-egress
      - tenant-ns/attack-selector-cluster-name-egress
      - tenant-ns/attack-selector-cross-namespace-egress
      - tenant-ns/attack-selector-cross-namespace-expression-egress
      - tenant-ns/attack-selector-cross-namespace-ingress
      - tenant-ns/attack-selector-exists-universal
      - tenant-ns/attack-selector-namespace-labels-egress
      - tenant-ns/attack-selector-reserved-beside-constrained-egress
      - tenant-ns/attack-selector-reserved-does-not-exist-egress
      - tenant-ns/attack-selector-reserved-expression-egress
      - tenant-ns/attack-selector-reserved-host-ingress
      - tenant-ns/attack-selector-reserved-not-in-ingress
      - tenant-ns/attack-selector-reserved-world-egress
      - tenant-ns/attack-specs-container-egress-world
      - tenant-ns/attack-togroups-empty-list
