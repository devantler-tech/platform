---
# One row per resource: fail when any check refuses it. Which check refuses it is
# in per-check.yaml, which scripts/tests/test-restrict-tenant-network-policies.sh
# runs. The policy uses a namespaceSelector, so the CLI needs the namespace labels
# declared explicitly.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-tenant-network-policies-platform-author
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-tenant-network-policies.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-tenant-network-policies
    kind: CiliumNetworkPolicy
    result: skip
    resources:
      - tenant-ns/platform-allow-observability
