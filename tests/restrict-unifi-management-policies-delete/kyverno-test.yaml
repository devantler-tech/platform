---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-unifi-management-policies-delete
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-unifi-management-policies.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/retained
      - unifi/observing
    kind: Record
    result: pass
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/never-patched
    kind: Client
    result: fail
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/delete-restored
    kind: TrafficRoute
    result: fail
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/empty
      - unifi/null-list
    kind: Record
    result: fail
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/beta-wildcard
    kind: Client
    result: fail
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - unifi/wrong-group
    kind: Client
    result: skip
  - policy: restrict-unifi-management-policies
    rule: prune-only-without-delete
    resources:
      - other/other-namespace
    kind: Record
    result: skip
