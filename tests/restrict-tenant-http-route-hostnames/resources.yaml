---
# The escalation the boundary exists to stop: a tenant HTTPRoute claiming
# another platform service's hostname on the shared wildcard-cert listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-claims-other-host
  namespace: wedding-app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.platform.devantler.tech
  rules:
    - backendRefs:
        - name: wedding-app
          port: 80
---
# hostnames omitted entirely. The Gateway listener is hostname-less, so a route
# with no hostnames matches EVERY host reaching it — the widest possible claim,
# and the case an allow-list alone would miss (an empty list has no element
# outside the allow-list).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-omits-hostnames
  namespace: wedding-app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: wedding-app
          port: 80
---
# Smuggling: one approved hostname alongside a rogue one. A rule checking only
# the first entry, or merely that SOME hostname is approved, would admit this.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-mixes-approved-and-rogue
  namespace: wedding-app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - wedding.platform.devantler.tech
    - vault.platform.devantler.tech
  rules:
    - backendRefs:
        - name: wedding-app
          port: 80
---
# The paved road: the tenant's own approved public hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-approved-host
  namespace: wedding-app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - wedding.platform.devantler.tech
  rules:
    - backendRefs:
        - name: wedding-app
          port: 80
---
# Both approved hostnames at once (prod domain + the local .lan name).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-approved-both-hosts
  namespace: wedding-app
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - wedding.platform.devantler.tech
    - wedding.platform.lan
  rules:
    - backendRefs:
        - name: wedding-app
          port: 80
---
# The second tenant, claiming a hostname belonging to the first. Proves the
# per-tenant allow-lists are not pooled into one shared set.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ascoachingogvaner-claims-other-tenant-host
  namespace: ascoachingogvaner
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - wedding.platform.devantler.tech
  rules:
    - backendRefs:
        - name: ascoachingogvaner
          port: 80
---
# The second tenant's paved road, on its own custom domain.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ascoachingogvaner-approved-host
  namespace: ascoachingogvaner
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - ascoachingogvaner.dk
    - www.ascoachingogvaner.dk
  rules:
    - backendRefs:
        - name: ascoachingogvaner
          port: 80
---
# Out of scope: a platform-owned route in a platform namespace keeps its own
# hostname. Confirms the policy is scoped to tenant namespaces and is not a
# cluster-wide hostname allow-list.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-gateway-route
  namespace: kube-system
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.platform.devantler.tech
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
---
# The third tenant's paved road. Its rule was missing entirely until the
# default-deny rule was added alongside it, leaving this namespace free to
# claim any hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doggy-approved-host
  namespace: doggy-countdown
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - simba.platform.devantler.tech
  rules:
    - backendRefs:
        - name: doggy-countdown
          port: 80
---
# The third tenant claiming a platform hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doggy-claims-other-host
  namespace: doggy-countdown
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.platform.devantler.tech
  rules:
    - backendRefs:
        - name: doggy-countdown
          port: 80
---
# A tenant onboarded with NO hostname rule of its own. Before the default-deny
# rule this was admitted unconditionally — the fail-open gap.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unlisted-tenant-route
  namespace: new-tenant
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - vault.platform.devantler.tech
  rules:
    - backendRefs:
        - name: new-tenant
          port: 80
