---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-tenant-http-route-hostnames
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-tenant-http-route-hostnames.yaml
resources:
  - resources.yaml
# The policy matches namespaces by NAME (not a namespaceSelector), so unlike the
# restrict-tenant-issuer-refs fixture no Values file is needed to avoid vacuous
# "Excluded" results.
results:
  # The escalation the boundary exists to stop, plus the two ways around a naive
  # allow-list: omitting hostnames entirely, and smuggling a rogue hostname in
  # beside an approved one.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - wedding-app/wedding-claims-other-host
      - wedding-app/wedding-omits-hostnames
      - wedding-app/wedding-mixes-approved-and-rogue
    kind: HTTPRoute
    result: fail
  # The paved road must stay open — single approved hostname and both at once.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - wedding-app/wedding-approved-host
      - wedding-app/wedding-approved-both-hosts
    kind: HTTPRoute
    result: pass
  # Per-tenant allow-lists are not pooled: the other tenant's hostname is still
  # a rogue claim here.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-ascoachingogvaner-hostnames
    resources:
      - ascoachingogvaner/ascoachingogvaner-claims-other-tenant-host
    kind: HTTPRoute
    result: fail
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-ascoachingogvaner-hostnames
    resources:
      - ascoachingogvaner/ascoachingogvaner-approved-host
    kind: HTTPRoute
    result: pass
  # Out of scope: platform namespaces are untouched by the tenant boundary.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - kube-system/platform-gateway-route
    kind: HTTPRoute
    result: skip
