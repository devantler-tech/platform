---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-tenant-http-route-hostnames
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-tenant-http-route-hostnames.yaml
resources:
  - resources.yaml
# Declares the namespace labels the default-deny rule's namespaceSelector matches
# on. Without it that rule reports "Excluded" for every resource and its fail
# case passes vacuously.
variables: values.yaml
results:
  # The escalation the boundary exists to stop, plus the two ways around a naive
  # allow-list: omitting hostnames entirely, and smuggling a rogue hostname in
  # beside an approved one.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - wedding-app/wedding-claims-other-host
      - wedding-app/wedding-omits-hostnames
      - wedding-app/wedding-mixes-approved-and-rogue
    kind: HTTPRoute
    result: fail
  # The paved road must stay open — single approved hostname and both at once.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - wedding-app/wedding-approved-host
      - wedding-app/wedding-approved-both-hosts
    kind: HTTPRoute
    result: pass
  # Per-tenant allow-lists are not pooled: the other tenant's hostname is still
  # a rogue claim here.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-ascoachingogvaner-hostnames
    resources:
      - ascoachingogvaner/ascoachingogvaner-claims-other-tenant-host
    kind: HTTPRoute
    result: fail
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-ascoachingogvaner-hostnames
    resources:
      - ascoachingogvaner/ascoachingogvaner-approved-host
    kind: HTTPRoute
    result: pass
  # The third tenant, whose rule was missing entirely.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-doggy-countdown-hostnames
    resources:
      - doggy-countdown/doggy-claims-other-host
    kind: HTTPRoute
    result: fail
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-doggy-countdown-hostnames
    resources:
      - doggy-countdown/doggy-approved-host
    kind: HTTPRoute
    result: pass
  # The fail-open class: a tenant namespace with no allow-list of its own is
  # denied by default instead of being silently unrestricted.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-unlisted-tenant-hostnames
    resources:
      - new-tenant/unlisted-tenant-route
    kind: HTTPRoute
    result: fail
  # ...and the default-deny must NOT catch the tenants that do have one, or it
  # would break every listed tenant's paved road.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-unlisted-tenant-hostnames
    resources:
      - wedding-app/wedding-approved-host
      - ascoachingogvaner/ascoachingogvaner-approved-host
      - doggy-countdown/doggy-approved-host
    kind: HTTPRoute
    result: skip
  # Out of scope: platform namespaces are untouched by the tenant boundary —
  # by the per-tenant rules and by the default-deny alike.
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-wedding-app-hostnames
    resources:
      - kube-system/platform-gateway-route
    kind: HTTPRoute
    result: skip
  - policy: restrict-tenant-http-route-hostnames
    rule: restrict-unlisted-tenant-hostnames
    resources:
      - kube-system/platform-gateway-route
    kind: HTTPRoute
    result: skip
