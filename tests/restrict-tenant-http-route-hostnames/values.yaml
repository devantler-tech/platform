---
# The default-deny rule (restrict-unlisted-tenant-hostnames) matches on a
# namespaceSelector, and the Kyverno CLI does not read namespace labels from
# Namespace objects in resources.yaml. Without this file that rule is reported
# "Excluded" for every resource and the fail case passes vacuously — the same
# trap documented in tests/restrict-tenant-issuer-refs/values.yaml.
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
namespaceSelector:
  # The three tenants with an explicit hostname allow-list.
  - name: wedding-app
    labels:
      app.kubernetes.io/managed-by: ksail
  - name: ascoachingogvaner
    labels:
      app.kubernetes.io/managed-by: ksail
  - name: doggy-countdown
    labels:
      app.kubernetes.io/managed-by: ksail
  # A tenant onboarded WITHOUT a hostname rule — the fail-open case the
  # default-deny rule exists to close.
  - name: new-tenant
    labels:
      app.kubernetes.io/managed-by: ksail
  # A platform namespace: no ksail label, so the tenant boundary never applies.
  - name: kube-system
    labels: {}
