---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-applied-secret-store
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
