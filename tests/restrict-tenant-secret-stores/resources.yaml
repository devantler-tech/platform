---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shared-controller-role
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: implicit-controller-service-account
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cross-namespace-service-account
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant
          serviceAccountRef:
            name: tenant
            namespace: another-tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-role-implicit-namespace
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant
          serviceAccountRef:
            name: tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-role-explicit-namespace
  namespace: tenant-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant
          serviceAccountRef:
            name: tenant
            namespace: tenant-ns
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-secret-store
  namespace: platform-ns
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-store-ref
  namespace: tenant-ns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: token
      remoteRef:
        key: apps/tenant-ns/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-source-cluster-store
  namespace: tenant-ns
spec:
  secretStoreRef:
    kind: SecretStore
    name: tenant
  data:
    - secretKey: token
      remoteRef:
        key: apps/tenant-ns/app
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datafrom-source-cluster-store
  namespace: tenant-ns
spec:
  secretStoreRef:
    kind: SecretStore
    name: tenant
  dataFrom:
    - extract:
        key: apps/tenant-ns/app
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: namespaced-store-ref
  namespace: tenant-ns
spec:
  secretStoreRef:
    kind: SecretStore
    name: tenant
  data:
    - secretKey: token
      remoteRef:
        key: apps/tenant-ns/app
      sourceRef:
        storeRef:
          kind: SecretStore
          name: tenant
  dataFrom:
    - extract:
        key: apps/tenant-ns/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-cluster-store-ref
  namespace: platform-ns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  data:
    - secretKey: token
      remoteRef:
        key: infrastructure/app
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-cluster-store
  namespace: tenant-ns
spec:
  secretStoreRefs:
    - kind: SecretStore
      name: tenant
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: app
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-namespaced-store
  namespace: tenant-ns
spec:
  secretStoreRefs:
    - kind: SecretStore
      name: tenant
  selector:
    secret:
      name: app
