# --- derived link is the site root, or an explicit href is set: pass ---------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: root-prefix-first
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api
      backendRefs:
        - name: whoami-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exact-root-first
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
# The API server defaults an omitted match list to `PathPrefix /`; the CLI
# applies no defaults, so this is the pre-defaulting shape of a catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omitted-matches
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omitted-path
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - headers:
            - name: x-canary
              value: "true"
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subpath-first-with-href
  namespace: observability
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://observability.platform.lan
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - observability.platform.lan
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: coroot-mcp
          port: 8080
    - backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
---
# The API server defaults an omitted rule list to one `PathPrefix /` rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omitted-rules
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
---
# The cases below would have no usable derived link, and an href fixes each.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-hostname-with-href
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://whoami.platform.lan
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - "*.platform.lan"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-matches-with-href
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://whoami.platform.lan
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches: []
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-parent-refs-with-href
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://whoami.platform.lan
spec:
  hostnames:
    - whoami.platform.lan
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
# --- derived link is a sub-path or missing, and no href: fail ----------------
# The Coroot route as platform#5881 shipped it: the card linked to /mcp.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subpath-first-without-href
  namespace: observability
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - observability.platform.lan
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: coroot-mcp
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefix-subpath-first
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: whoami-api
          port: 80
---
# A second match on the first rule does not count: Homepage reads matches[0].
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: root-is-second-match
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
# Homepage builds no link for a RegularExpression path, even one matching "/".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: regex-root-first
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-hostnames
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
# Homepage treats an empty href as unset and falls back to the derived link.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-href
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: ""
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: whoami-api
          port: 80
---
# Homepage would link to https://*.platform.lan/, which no browser can open.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-hostname
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - "*.platform.lan"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
# An explicitly empty list is not defaulted: Homepage fails reading matches[0].
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-matches
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches: []
      backendRefs:
        - name: whoami
          port: 80
---
# Likewise for an explicitly empty rule list: Homepage fails reading rules[0].
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-rules
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules: []
---
# Homepage reads parentRefs[0] for the scheme and throws when there is none.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-parent-refs
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  hostnames:
    - whoami.platform.lan
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-parent-refs
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "true"
spec:
  parentRefs: []
  hostnames:
    - whoami.platform.lan
  rules:
    - backendRefs:
        - name: whoami
          port: 80
---
# --- the precondition's negative control: routes that never opted in --------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: not-opted-in
  namespace: whoami
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: discovery-disabled
  namespace: whoami
  annotations:
    gethomepage.dev/enabled: "false"
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: https
  hostnames:
    - whoami.platform.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/send
      backendRefs:
        - name: whoami
          port: 80
