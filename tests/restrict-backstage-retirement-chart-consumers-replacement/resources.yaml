# Recreated backstage HelmRelease whose UID differs from the recorded target,
# consuming the captured chart: denied.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000050
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
