---
# What the platform's patch produces.
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: retained
  namespace: unifi
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  forProvider: {}
---
# A source transformer that ran after the patch and put Delete back.
apiVersion: vpn.unifi.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: delete-restored
  namespace: unifi
spec:
  managementPolicies: [Observe, Create, Update, Delete, LateInitialize]
  forProvider: {}
---
apiVersion: route.unifi.m.crossplane.io/v1alpha1
kind: TrafficRoute
metadata:
  name: wildcard
  namespace: unifi
spec:
  managementPolicies: ["*"]
  forProvider: {}
---
# No list at all: the CRD defaults it to "*".
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: omitted
  namespace: unifi
spec:
  forProvider: {}
---
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: observing
  namespace: unifi
  annotations:
    platform.devantler.tech/unifi-management: observe-only
spec:
  managementPolicies: [Observe]
  forProvider: {}
---
# The annotation added by the source's commonAnnotations after the patches ran.
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: observe-only-widened
  namespace: unifi
  annotations:
    platform.devantler.tech/unifi-management: observe-only
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  forProvider: {}
---
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: observe-only-empty
  namespace: unifi
  annotations:
    platform.devantler.tech/unifi-management: observe-only
spec:
  managementPolicies: []
  forProvider: {}
---
# Both empty and null lists keep the existing conservative default.
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: empty
  namespace: unifi
spec:
  managementPolicies: []
  forProvider: {}
---
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: null-list
  namespace: unifi
spec:
  managementPolicies: null
  forProvider: {}
---
# A supported kind/version remains protected when its served version changes.
apiVersion: dns.unifi.m.crossplane.io/v1beta1
kind: Record
metadata:
  name: beta-wildcard
  namespace: unifi
spec:
  managementPolicies: ["*"]
  forProvider: {}
---
# Group and kind are a pair, not a cross-product of the three allowed lists.
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: wrong-group
  namespace: unifi
spec:
  managementPolicies: ["*"]
  forProvider: {}
---
apiVersion: dns.unifi.m.crossplane.io/v1alpha1
kind: Record
metadata:
  name: other-namespace
  namespace: other
spec:
  managementPolicies: ["*"]
  forProvider: {}
