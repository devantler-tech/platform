apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
  name: enabled-empty
  namespace: controllers
spec:
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  install:
    remediation:
      remediateLastFailure: true
      retries: 3
  interval: 1h
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    helm.toolkit.fluxcd.io/remediation: enabled
  name: enabled-existing
  namespace: controllers
spec:
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  install:
    remediation:
      ignoreTestFailures: true
      remediateLastFailure: true
      retries: 3
    timeout: 2m
  interval: 1h
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
---
