# Pins the CA bundle writer exceptions of the preserve-retained-identities rule
# before the ValidatingPolicy rewrite (#4996). values.yaml supplies the parsed
# retirement journal, the request identity and the previous object per
# resource; a changed field differs by value, never by a key only one side
# has. Under a bound journal three controllers may each refresh the one
# retained ConfigMap whose profile the journal records for it: the root CA
# publisher its cluster CA bundle, trust-manager its trust bundle with a hash
# annotation naming the new content, and the CNPG operator its monitoring
# queries stamped with the expected operator version. The cases that deny the
# same refreshes for the wrong writer, a stale hash or another operator version
# are in restrict-backstage-retirement-ca-bundle-writers-denied, and those for a
# ConfigMap recorded with another profile or none in
# restrict-backstage-retirement-ca-bundle-writers-unprofiled.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-ca-bundle-writers
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/kube-root-ca.crt
      - backstage/cloudflare-origin-ca
      - backstage/cnpg-default-monitoring
    kind: ConfigMap
    result: pass
