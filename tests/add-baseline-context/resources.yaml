---
# Opted-in namespace, nothing preset: both fields must be injected.
apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace with both fields already set to NON-default values. The
# conditional anchors must preserve them; a regression to +() would overwrite.
apiVersion: v1
kind: Pod
metadata:
  name: preset
  namespace: velero
spec:
  securityContext:
    fsGroupChangePolicy: Always
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions:
          level: s9
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions:
          level: s9
---
# Excluded namespace WITHOUT the opt-in label: the default-off control. Nothing
# may be injected here, or the rule is not default-off.
apiVersion: v1
kind: Pod
metadata:
  name: unlabelled
  namespace: chaos-mesh
spec:
  containers:
    - name: app
      image: chaos-mesh/chaos-daemon:v1.0.0
---
# Opted-in namespace with NO initContainers — the common shape. The foreach over
# `spec.initContainers[]` must tolerate the field being absent rather than
# erroring, so the pod-level and container mutations still land.
apiVersion: v1
kind: Pod
metadata:
  name: no-init
  namespace: velero
spec:
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace whose container already carries a PARTIAL seLinuxOptions —
# some other field set, `level` absent. A conditional anchor on the whole object
# (`+(seLinuxOptions)`) sees it present and skips, leaving `level` unset while
# still reporting the rule as applied. Anchoring the leaf (`+(level)`) instead
# fills in the missing field and preserves the sibling. Measured 2026-08-29:
# with the object-level anchor this pod came back `{user: system_u}` — no level.
apiVersion: v1
kind: Pod
metadata:
  name: partial
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
---
# Opted-in namespace whose POD-level securityContext already declares SELinux
# options, with a container carrying none of its own. A container-level
# seLinuxOptions REPLACES the pod-level struct wholesale (kubelet
# DetermineEffectiveSecurityContext), so injecting `level` here would override
# the operator's level AND silently drop the sibling `user` for that container.
# Measured 2026-08-29 before the foreach precondition existed: this pod declared
# `{user: system_u, level: s9}` and its container came back `{level: s0}`.
# The container mutation must therefore not fire at all for this shape.
apiVersion: v1
kind: Pod
metadata:
  name: podlevel
  namespace: velero
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
      level: s9
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace whose POD-level securityContext declares a PARTIAL SELinux
# object — a sibling field set, `level` absent — with containers carrying none of
# their own. The container foreach must still skip (a container-level object
# would replace the pod struct wholesale and drop `user`), so nothing below the
# pod can supply the missing field; without a pod-scope fill the containers
# inherit a level-less object and C-0211 stays unmet while every rule reports
# success. This is the shape `podlevel` does not cover: that one is already
# complete (`level: s9`).
apiVersion: v1
kind: Pod
metadata:
  name: podlevel-partial
  namespace: velero
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# The shape the observability namespace actually presents, measured against live
# prod on 2026-09-02 before opting it in: 31 running pods, ALL 31 with no
# pod-level securityContext.fsGroupChangePolicy, and all 44 containers and
# initContainers carrying no seLinuxOptions at all — no pod-level SELinux object
# anywhere in the namespace.
#
# That is the plain shape, so the two straightforward rules do all the work and
# add-baseline-context-optin-pod-selinux-level cannot fire (it requires a
# pre-existing pod-level object). Pinned as its own case rather than leaning on
# velero/plain because the issue's guardrail is explicit that a rollout proves
# each namespace rather than assuming the previous one generalises — and because
# this fixture records WHICH shape was onboarded, so a future namespace
# presenting a different one is not silently assumed covered.
#
# hostPID and the hostPath volume are coroot's node-agent (eBPF collection); no
# rule reads them, they are here so the fixture is recognisably the real workload.
apiVersion: v1
kind: Pod
metadata:
  name: coroot-node-agent
  namespace: observability
spec:
  hostPID: true
  volumes:
    - name: host-sys
      hostPath:
        path: /sys
  initContainers:
    - name: init
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
  containers:
    - name: node-agent
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
# --- Controller kinds ---------------------------------------------------------
# The stored controller spec is what Kubescape scores, and the pod rules above
# never reach it (this policy has no autogen rules). Each shape the pod fixtures
# pin is pinned again at the controller object, on the kinds the residual
# population actually consists of: operator-written Deployments, StatefulSets
# and DaemonSets, plus a CronJob for the jobTemplate path.
---
# The plain shape an operator writes: no securityContext anywhere. Both fields
# must land in the pod template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-deploy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: operator-deploy
  template:
    metadata:
      labels:
        app: operator-deploy
    spec:
      initContainers:
        - name: init
          image: ghcr.io/coroot/coroot-operator:1.9.5
      containers:
        - name: operator
          image: ghcr.io/coroot/coroot-operator:1.9.5
---
# A StatefulSet with no initContainers — the foreach over
# `spec.template.spec.initContainers[]` must tolerate the absent field.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: server-sts
  namespace: observability
spec:
  serviceName: server-sts
  selector:
    matchLabels:
      app: server-sts
  template:
    metadata:
      labels:
        app: server-sts
    spec:
      containers:
        - name: server
          image: ghcr.io/coroot/coroot:1.22.2
---
# A privileged DaemonSet, the shape Longhorn's manager and CSI plugin run.
# Privilege is untouched; only the two fields are supplied.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: manager-ds
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: manager-ds
  template:
    metadata:
      labels:
        app: manager-ds
    spec:
      containers:
        - name: manager
          image: longhornio/longhorn-manager:v1.9.0
          securityContext:
            privileged: true
---
# The jobTemplate path.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cronjob
  namespace: observability
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: init
              image: ghcr.io/coroot/coroot:1.22.2
          containers:
            - name: job
              image: ghcr.io/coroot/coroot:1.22.2
---
# OFF state: no opt-in label, so no controller rule may touch it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unlabelled-deploy
  namespace: chaos-mesh
spec:
  selector:
    matchLabels:
      app: unlabelled-deploy
  template:
    metadata:
      labels:
        app: unlabelled-deploy
    spec:
      containers:
        - name: app
          image: ghcr.io/chaos-mesh/chaos-mesh:v2.7.0
---
# Anchor preservation: a controller that already sets both fields to
# non-default values keeps them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preset-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: preset-deploy
  template:
    metadata:
      labels:
        app: preset-deploy
    spec:
      securityContext:
        fsGroupChangePolicy: Always
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
          securityContext:
            seLinuxOptions:
              level: s9
      containers:
        - name: velero
          image: velero/velero:v1.16.0
          securityContext:
            seLinuxOptions:
              level: s9
---
# A complete pod-level SELinux object with containers carrying none: the
# container foreach must stay out (a container-level object would replace the
# pod struct wholesale), the pod-scope fill must not fire (level present), and
# fsGroupChangePolicy still lands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlevel-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: podlevel-deploy
  template:
    metadata:
      labels:
        app: podlevel-deploy
    spec:
      securityContext:
        seLinuxOptions:
          user: system_u
          level: s9
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
      containers:
        - name: velero
          image: velero/velero:v1.16.0
---
# A pod-level SELinux object that EXISTS but has no `level`: only the pod-scope
# fill may supply it, preserving the sibling `user`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlevel-partial-deploy
  namespace: velero
spec:
  selector:
    matchLabels:
      app: podlevel-partial-deploy
  template:
    metadata:
      labels:
        app: podlevel-partial-deploy
    spec:
      securityContext:
        seLinuxOptions:
          user: system_u
      initContainers:
        - name: init
          image: velero/velero:v1.16.0
      containers:
        - name: velero
          image: velero/velero:v1.16.0
---
# A standalone Job without initContainers (CREATE-only kind).
apiVersion: batch/v1
kind: Job
metadata:
  name: oneshot-job
  namespace: observability
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: ghcr.io/coroot/coroot:1.22.2
---
# A CronJob whose pod-level SELinux object exists but has no `level`: only the
# jobTemplate pod-scope fill may supply it, preserving the sibling `user`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podlevel-partial-cronjob
  namespace: velero
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seLinuxOptions:
              user: system_u
          initContainers:
            - name: init
              image: velero/velero:v1.16.0
          containers:
            - name: velero
              image: velero/velero:v1.16.0
---
# A CronJob with a complete pod-level SELinux object: the container foreach and
# the pod-scope fill both stay out; fsGroupChangePolicy still lands.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podlevel-cronjob
  namespace: velero
spec:
  schedule: "0 5 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seLinuxOptions:
              user: system_u
              level: s9
          containers:
            - name: velero
              image: velero/velero:v1.16.0
---
# The pod-rule label ALONE (kubescape carries `baseline-context` but not
# `baseline-context-controllers`): no controller rule may touch this, or the
# separate rollout gate is not a gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podlabel-only-deploy
  namespace: kubescape
spec:
  selector:
    matchLabels:
      app: podlabel-only-deploy
  template:
    metadata:
      labels:
        app: podlabel-only-deploy
    spec:
      containers:
        - name: app
          image: quay.io/kubescape/operator:v0.2.0
