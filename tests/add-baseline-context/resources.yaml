---
# Opted-in namespace, nothing preset: both fields must be injected.
apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace with both fields already set to NON-default values. The
# conditional anchors must preserve them; a regression to +() would overwrite.
apiVersion: v1
kind: Pod
metadata:
  name: preset
  namespace: velero
spec:
  securityContext:
    fsGroupChangePolicy: Always
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions:
          level: s9
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions:
          level: s9
---
# Excluded namespace WITHOUT the opt-in label: the default-off control. Nothing
# may be injected here, or the rule is not default-off.
apiVersion: v1
kind: Pod
metadata:
  name: unlabelled
  namespace: chaos-mesh
spec:
  containers:
    - name: app
      image: chaos-mesh/chaos-daemon:v1.0.0
---
# Opted-in namespace with NO initContainers — the common shape. The foreach over
# `spec.initContainers[]` must tolerate the field being absent rather than
# erroring, so the pod-level and container mutations still land.
apiVersion: v1
kind: Pod
metadata:
  name: no-init
  namespace: velero
spec:
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace whose container already carries a PARTIAL seLinuxOptions —
# some other field set, `level` absent. A conditional anchor on the whole object
# (`+(seLinuxOptions)`) sees it present and skips, leaving `level` unset while
# still reporting the rule as applied. Anchoring the leaf (`+(level)`) instead
# fills in the missing field and preserves the sibling. Measured 2026-08-29:
# with the object-level anchor this pod came back `{user: system_u}` — no level.
apiVersion: v1
kind: Pod
metadata:
  name: partial
  namespace: velero
spec:
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
  containers:
    - name: app
      image: velero/velero:v1.0.0
      securityContext:
        seLinuxOptions:
          user: system_u
---
# Opted-in namespace whose POD-level securityContext already declares SELinux
# options, with a container carrying none of its own. A container-level
# seLinuxOptions REPLACES the pod-level struct wholesale (kubelet
# DetermineEffectiveSecurityContext), so injecting `level` here would override
# the operator's level AND silently drop the sibling `user` for that container.
# Measured 2026-08-29 before the foreach precondition existed: this pod declared
# `{user: system_u, level: s9}` and its container came back `{level: s0}`.
# The container mutation must therefore not fire at all for this shape.
apiVersion: v1
kind: Pod
metadata:
  name: podlevel
  namespace: velero
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
      level: s9
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# Opted-in namespace whose POD-level securityContext declares a PARTIAL SELinux
# object — a sibling field set, `level` absent — with containers carrying none of
# their own. The container foreach must still skip (a container-level object
# would replace the pod struct wholesale and drop `user`), so nothing below the
# pod can supply the missing field; without a pod-scope fill the containers
# inherit a level-less object and C-0211 stays unmet while every rule reports
# success. This is the shape `podlevel` does not cover: that one is already
# complete (`level: s9`).
apiVersion: v1
kind: Pod
metadata:
  name: podlevel-partial
  namespace: velero
spec:
  securityContext:
    seLinuxOptions:
      user: system_u
  initContainers:
    - name: init
      image: velero/velero-plugin:v1.0.0
  containers:
    - name: app
      image: velero/velero:v1.0.0
---
# The shape the observability namespace actually presents, measured against live
# prod on 2026-09-02 before opting it in: 31 running pods, ALL 31 with no
# pod-level securityContext.fsGroupChangePolicy, and all 44 containers and
# initContainers carrying no seLinuxOptions at all — no pod-level SELinux object
# anywhere in the namespace.
#
# That is the plain shape, so the two straightforward rules do all the work and
# add-baseline-context-optin-pod-selinux-level cannot fire (it requires a
# pre-existing pod-level object). Pinned as its own case rather than leaning on
# velero/plain because the issue's guardrail is explicit that a rollout proves
# each namespace rather than assuming the previous one generalises — and because
# this fixture records WHICH shape was onboarded, so a future namespace
# presenting a different one is not silently assumed covered.
#
# hostPID and the hostPath volume are coroot's node-agent (eBPF collection); no
# rule reads them, they are here so the fixture is recognisably the real workload.
apiVersion: v1
kind: Pod
metadata:
  name: coroot-node-agent
  namespace: observability
spec:
  hostPID: true
  volumes:
    - name: host-sys
      hostPath:
        path: /sys
  initContainers:
    - name: init
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
  containers:
    - name: node-agent
      image: ghcr.io/coroot/coroot-node-agent:v1.0.0
