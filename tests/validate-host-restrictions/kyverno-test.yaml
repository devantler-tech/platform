---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-host-restrictions
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/validate-host-restrictions.yaml
resources:
  - resources.yaml
# Declares the namespace labels the namespaceSelector matches on. Without it the
# CLI reports every resource "Excluded" and the fixture passes vacuously.
variables: values.yaml
results:
  - policy: validate-host-restrictions
    rule: disallow-host-path
    resources:
      - userns-absent/ordinary-pod
      - userns-absent/explicit-false
    kind: Pod
    result: pass
  - policy: validate-host-restrictions
    rule: disallow-host-path
    resources:
      - userns-absent/host-path
      - userns-absent/helper-pod-create-pvc
      - observability-app/namespace-lookalike
    kind: Pod
    result: fail
  - policy: validate-host-restrictions
    rule: disallow-host-path
    resources:
      - observability/infrastructure-pod
    kind: Pod
    result: skip
  - policy: validate-host-restrictions
    rule: disallow-host-namespaces
    resources:
      - userns-absent/ordinary-pod
      - userns-absent/explicit-false
    kind: Pod
    result: pass
  - policy: validate-host-restrictions
    rule: disallow-host-namespaces
    resources:
      - userns-absent/host-network
      - userns-absent/host-pid
      - userns-absent/host-ipc
      - userns-absent/helper-pod-create-pvc
      - observability-app/namespace-lookalike
    kind: Pod
    result: fail
  - policy: validate-host-restrictions
    rule: disallow-host-namespaces
    resources:
      - observability/infrastructure-pod
    kind: Pod
    result: skip
  # The cnpg label selector disables autogen for the entire current policy.
  # These are genuine exclusions of the declared Pod rules, not invented
  # autogen-* rows (which the CLI can misleadingly count as passing).
  - policy: validate-host-restrictions
    rule: disallow-host-path
    resources:
      - userns-absent/ordinary-deployment
      - userns-absent/host-access-deployment
      - observability/infrastructure-deployment
    kind: Deployment
    result: skip
  - policy: validate-host-restrictions
    rule: disallow-host-namespaces
    resources:
      - userns-absent/ordinary-deployment
      - userns-absent/host-access-deployment
      - observability/infrastructure-deployment
    kind: Deployment
    result: skip
  # The regression the mutate rule's conditional anchor cannot catch.
  - policy: validate-host-restrictions
    rule: disallow-host-users
    resources:
      - userns-enabled/explicit-host-users
    kind: Pod
    result: fail
  # Absent inherits the mutated default; explicit false is already correct.
  - policy: validate-host-restrictions
    rule: disallow-host-users
    resources:
      - userns-enabled/explicit-unshared
      - userns-enabled/host-users-absent
    kind: Pod
    result: pass
  # CNPG pods are excluded, and namespaces without the opt-in label are out of scope.
  - policy: validate-host-restrictions
    rule: disallow-host-users
    resources:
      - userns-enabled/cnpg-instance
      - userns-absent/unscoped-host-users
    kind: Pod
    result: skip
