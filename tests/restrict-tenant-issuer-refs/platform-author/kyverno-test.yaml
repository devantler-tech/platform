---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-tenant-issuer-refs-platform-author
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-tenant-issuer-refs.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  # The apps-layer controller keeps the paved road for platform-owned
  # certificates placed in a managed tenant namespace.
  - policy: restrict-tenant-issuer-refs
    resources:
      - tenant-ns/cluster-issuer-certificate
    kind: Certificate
    result: skip
  - policy: restrict-tenant-issuer-refs
    resources:
      - tenant-ns/cluster-issuer-request
    kind: CertificateRequest
    result: skip
