# Pins the Helm history exception of the preserve-retained-identities rule
# before the ValidatingPolicy rewrite (#4996). values.yaml supplies the parsed
# retirement journal, the request identity and the previous object per
# resource; a changed field differs by value, never by a key only one side
# has. Under a bound journal only the recorded Helm controller may move the
# retained latest Backstage release forward from deployed to uninstalling to
# uninstalled, changing only its status and modifiedAt labels and its content.
# Any other writer, a backwards move, another label change, or a history
# revision the journal does not retain is denied.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-helm-history
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v3
    kind: Secret
    result: pass
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v4
    kind: Secret
    result: pass
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v5
    kind: Secret
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v6
    kind: Secret
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v7
    kind: Secret
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/sh.helm.release.v1.backstage.v2
    kind: Secret
    result: fail
