# Pins the fence-credential-recreation rule before the ValidatingPolicy rewrite
# (#4995): past the baseline phase (here "drained"), an update that leaves its spec unchanged is allowed on
# the ARC credential-sync ExternalSecret. values.yaml supplies the journal the
# policy reads by API call and the previous object; each case needs its own
# directory because the rule matches one ExternalSecret name.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-arc-retirement-credential-sync-unchanged
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-arc-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-arc-retirement
    rule: fence-credential-recreation
    resources:
      - arc-runners/arc-github-app
    kind: ExternalSecret
    result: pass
