---
# One row per resource: fail when any check refuses it. Which check refuses it is
# in per-check.yaml, which scripts/tests/test-github-team-management-checks.sh runs.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-github-team-management-literal-comparison
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-github-team-management.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-github-team-management
    kind: Team
    result: fail
    resources:
      - github-config/display-name-question
      - github-config/display-name-star
      - github-config/init-display-name-question
      - github-config/init-display-name-star
  - policy: restrict-github-team-management
    kind: TeamMembership
    result: fail
    resources:
      - github-config/init-only-username-star
      - github-config/init-ref-name-question
      - github-config/init-ref-name-star
      - github-config/init-ref-namespace-foreign
      - github-config/init-ref-namespace-question
      - github-config/init-ref-namespace-star
      - github-config/init-role-question
      - github-config/init-role-star
      - github-config/init-selector-beside-reference
      - github-config/init-team-id-question
      - github-config/init-team-id-star
      - github-config/init-username-star
      - github-config/ref-name-question
      - github-config/ref-name-star
      - github-config/ref-namespace-foreign
      - github-config/ref-namespace-question
      - github-config/ref-namespace-star
      - github-config/resolve-question
      - github-config/resolve-star
      - github-config/role-question
      - github-config/role-star
      - github-config/selector-beside-reference
      - github-config/username-question
      - github-config/username-star
  - policy: restrict-github-team-management
    kind: TeamMembership
    result: pass
    resources:
      - github-config/ref-namespace-empty
      - github-config/ref-namespace-own
  - policy: restrict-github-team-management
    kind: TeamRepository
    result: fail
    resources:
      - github-config/capped-init-permission-star
      - github-config/capped-permission-question
      - github-config/capped-permission-star
      - github-config/capped-wildcard-team-admin
      - github-config/init-permission-star
      - github-config/permission-question
      - github-config/permission-star
      - github-config/repo-init-ref-name-star
      - github-config/repo-init-ref-namespace-foreign
      - github-config/repo-init-ref-namespace-question
      - github-config/repo-init-ref-namespace-star
      - github-config/repo-init-selector-beside-reference
      - github-config/repo-init-team-id-star
      - github-config/repo-ref-name-question
      - github-config/repo-ref-name-star
      - github-config/repo-ref-namespace-foreign
      - github-config/repo-ref-namespace-star
      - github-config/repo-resolve-star
      - github-config/repo-selector-beside-reference
  - policy: restrict-github-team-management
    kind: TeamRepository
    result: pass
    resources:
      - github-config/repo-ref-namespace-empty
      - github-config/repo-ref-namespace-own
