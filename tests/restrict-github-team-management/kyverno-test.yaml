---
# One row per resource: fail when any check refuses it. Which check refuses it is
# in per-check.yaml, which scripts/tests/test-github-team-management-checks.sh runs.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-github-team-management
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-github-team-management.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-github-team-management
    kind: Team
    result: fail
    resources:
      - github-config/attacker-team
  - policy: restrict-github-team-management
    kind: Team
    result: pass
    resources:
      - github-config/admins
      - github-config/maintainers
  - policy: restrict-github-team-management
    kind: TeamMembership
    result: fail
    resources:
      - github-config/arbitrary-username
      - github-config/direct-team-id
      - github-config/ifnotpresent-reference
      - github-config/initprovider-arbitrary-username
      - github-config/initprovider-foreign-team
      - github-config/initprovider-only-arbitrary-username
      - github-config/initprovider-unknown-role
      - github-config/initprovider-unknown-role-behind-valid-forprovider
      - github-config/non-allow-listed-reference
      - github-config/selector-reference
      - github-config/unknown-role
      - github-config/unresolved-reference
  - policy: restrict-github-team-management
    kind: TeamMembership
    result: pass
    resources:
      - github-config/admins-member
      - github-config/allow-listed-maintainer
      - github-config/initprovider-only-allow-listed-username
      - github-config/mixed-case-username
  - policy: restrict-github-team-management
    kind: TeamRepository
    result: fail
    resources:
      - github-config/maintainers-escalated
      - github-config/maintainers-escalated-initprovider
      - github-config/maintainers-escalated-initprovider-only
      - github-config/unresolved-reference-repo
  - policy: restrict-github-team-management
    kind: TeamRepository
    result: pass
    resources:
      - github-config/admins-repo
      - github-config/admins-repo-admin
      - github-config/initprovider-admin-grant
      - github-config/maintain-grant
      - github-config/maintainers-repo
