---
# One row per resource: fail when any check refuses it. Which check refuses it is
# in per-check.yaml, which scripts/tests/test-github-team-management-checks.sh runs.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-github-team-management-nested-or-directory-linked
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-github-team-management.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-github-team-management
    kind: Team
    result: fail
    resources:
      - github-config/admins
      # Its name is not allow-listed, whatever its empty spec says.
      - github-config/no-spec
      - github-config/forprovider-ldapdn
      - github-config/forprovider-parentteamid
      - github-config/forprovider-parentteamreadid
      - github-config/forprovider-parentteamreadslug
      - github-config/initprovider-ldapdn
      - github-config/initprovider-parentteamid
      - github-config/initprovider-parentteamreadid
      - github-config/initprovider-parentteamreadslug
      - github-config/typed-empty-list
      - github-config/typed-false
      - github-config/whitespace
      - github-config/wildcard-question
      - github-config/wildcard-star
  - policy: restrict-github-team-management
    kind: Team
    result: pass
    resources:
      - github-config/maintainers
