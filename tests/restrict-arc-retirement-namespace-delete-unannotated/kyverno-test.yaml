# Allowed control for the preserve-retiring-namespace fixture beside it (#4995):
# with no retirement journal annotation, deleting arc-runners is allowed. It
# needs its own directory because both cases are the one arc-runners Namespace.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-arc-retirement-namespace-delete-unannotated
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-arc-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-arc-retirement
    rule: preserve-retiring-namespace
    resources:
      - arc-runners
    kind: Namespace
    result: pass
