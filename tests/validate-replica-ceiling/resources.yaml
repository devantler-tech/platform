---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: four-replicas-exempt
  namespace: apps
  labels:
    platform.devantler.tech/replica-ceiling: exempt
spec:
  replicas: 4
  selector:
    matchLabels:
      app: four-replicas-exempt
  template:
    metadata:
      labels:
        app: four-replicas-exempt
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: four-replicas-template-exempt
  namespace: apps
spec:
  replicas: 4
  selector:
    matchLabels:
      app: four-replicas-template-exempt
  template:
    metadata:
      labels:
        app: four-replicas-template-exempt
        platform.devantler.tech/replica-ceiling: exempt
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-max-three
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: three-replicas
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-max-ten
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: three-replicas
  minReplicas: 1
  maxReplicas: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-max-ten-exempt
  namespace: apps
  labels:
    platform.devantler.tech/replica-ceiling: exempt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: three-replicas
  minReplicas: 1
  maxReplicas: 10
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: scaledobject-max-three
  namespace: apps
spec:
  scaleTargetRef:
    name: three-replicas
  maxReplicaCount: 3
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
---
