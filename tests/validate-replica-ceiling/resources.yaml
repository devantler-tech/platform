apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-replicas
  namespace: apps
spec:
  replicas: 3
  selector:
    matchLabels:
      app: three-replicas
  template:
    metadata:
      labels:
        app: three-replicas
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unset-replicas
  namespace: apps
spec:
  selector:
    matchLabels:
      app: unset-replicas
  template:
    metadata:
      labels:
        app: unset-replicas
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:1.2.3
---
apiVersion: apps/v1
