# The recorded CNPG operator renews the retained CA: only the public
# certificate changes, the private key stays: allowed.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-ca
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000051
type: Opaque
data:
  ca.crt: bmV3LWNh
  ca.key: Y2Eta2V5
---
# The recorded CNPG operator renews a retained leaf certificate: only the
# public certificate changes, the private key stays: allowed.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-server
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000052
type: kubernetes.io/tls
data:
  tls.crt: bmV3LXNlcnZlcg==
  tls.key: c2VydmVyLWtleQ==
---
# The recorded CNPG operator replaces a retained leaf certificate together with
# its private key: denied.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-replication
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000053
type: kubernetes.io/tls
data:
  tls.crt: bmV3LXJlcGxpY2F0aW9u
  tls.key: bmV3LXJlcGxpY2F0aW9uLWtleQ==
---
# The recorded CNPG operator moves a retained volume claim from primary to
# replica, with both role labels agreeing: allowed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-1
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000021
  labels:
    cnpg.io/cluster: backstage-db
    role: replica
    cnpg.io/instanceRole: replica
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes
---
# The recorded CNPG operator sets the two role labels of a retained volume
# claim to different values: denied.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-2
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000022
  labels:
    cnpg.io/cluster: backstage-db
    role: primary
    cnpg.io/instanceRole: replica
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes
