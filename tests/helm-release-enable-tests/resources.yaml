---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: enabled-empty
  namespace: controllers
  labels:
    helm.toolkit.fluxcd.io/helm-test: enabled
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: enabled-existing
  namespace: controllers
  labels:
    helm.toolkit.fluxcd.io/helm-test: enabled
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  test:
    enable: false
    ignoreFailures: true
  values:
    retained: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
