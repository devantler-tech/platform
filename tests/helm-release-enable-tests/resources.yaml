  namespace: controllers
  labels:
    helm.toolkit.fluxcd.io/helm-test: enabled
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  test:
    ignoreFailures: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: enabled-null-parents
  namespace: controllers
  labels:
    helm.toolkit.fluxcd.io/helm-test: enabled
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  test: null
---
apiVersion: other.example/v1
