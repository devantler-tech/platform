# Pin the legacy output before migrating this policy (#4997).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: helm-release-enable-tests
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/flux/helm-release-enable-tests.yaml
resources:
  - resources.yaml
results:
  - policy: helm-release-enable-tests
    rule: enable-helm-tests
    resources:
      - controllers/enabled-empty
      - controllers/enabled-existing
      - controllers/enabled-one-parent
      - controllers/enabled-null-parents
    kind: HelmRelease
    result: pass
    patchedResources: patched-resources.yaml
  - policy: helm-release-enable-tests
    rule: enable-helm-tests
    resources:
      - controllers/unlabelled
      - controllers/disabled
    kind: HelmRelease
    result: skip
  - policy: helm-release-enable-tests
    rule: enable-helm-tests
    resources:
      - controllers/wrong-kind
    kind: ConfigMap
    result: skip
