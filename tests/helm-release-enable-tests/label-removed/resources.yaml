---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: removed
  namespace: controllers
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  test:
    enable: false
    ignoreFailures: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: disabled
  namespace: controllers
  labels:
    helm.toolkit.fluxcd.io/helm-test: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: example
      sourceRef:
        kind: HelmRepository
        name: example
  test:
    enable: false
    ignoreFailures: true
