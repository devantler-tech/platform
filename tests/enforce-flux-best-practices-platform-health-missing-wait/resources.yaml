---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-health
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 5m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-aws-iam
