# A CA renewal that would be allowed, made by an operator identity the
# journal did not record: denied.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-ca
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000051
type: Opaque
data:
  ca.crt: bmV3LWNh
  ca.key: Y2Eta2V5
---
# A leaf renewal by the recorded operator, but the journal records this
# Secret with the CA profile: denied.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-server
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000052
type: kubernetes.io/tls
data:
  tls.crt: bmV3LXNlcnZlcg==
  tls.key: c2VydmVyLWtleQ==
---
# The recorded operator moves the role labels and also changes another label:
# denied.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-1
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000021
  labels:
    cnpg.io/cluster: another-cluster
    role: replica
    cnpg.io/instanceRole: replica
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes
---
# A role move by the recorded operator that would be allowed, on a volume claim
# the journal records with no controller profile: denied.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-2
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000022
  labels:
    cnpg.io/cluster: backstage-db
    role: primary
    cnpg.io/instanceRole: primary
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes
