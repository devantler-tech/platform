# Pins the limits of the CNPG operator exceptions of the
# preserve-retained-identities rule before the ValidatingPolicy rewrite
# (#4996). Each change here is one the operator may make in
# restrict-backstage-retirement-cnpg-writer, except for one difference: the
# writer is not the identity the journal recorded, the journal records the
# Secret with the other certificate profile, another label changes beside the
# role labels, or the journal records the volume claim with no controller
# profile. Every one is denied. values.yaml supplies the parsed retirement
# journal, the request identity and the previous object per resource.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-cnpg-writer-denied
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/backstage-db-ca
      - backstage/backstage-db-server
    kind: Secret
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/backstage-db-1
      - backstage/backstage-db-2
    kind: PersistentVolumeClaim
    result: fail
