---

apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: approved
  namespace: external-dns
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: tenant-namespace
  namespace: wedding-app
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
---
apiVersion: externaldns.k8s.io/v1alpha1
