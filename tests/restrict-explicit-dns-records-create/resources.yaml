      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
