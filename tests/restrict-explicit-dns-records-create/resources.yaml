      recordTTL: 300
      recordType: A
      targets:
        - 192.0.2.1
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: extra-endpoint
  namespace: external-dns
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: other.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
