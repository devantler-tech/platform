apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: company-mail-ses
  namespace: aws
spec:
  endpoints:
    - dnsName: bounce.devantler.tech
      recordTTL: 300
      recordType: MX
      targets:
        - 10 feedback-smtp.eu-central-1.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: bounce.devantler.tech
      recordTTL: 300
      recordType: TXT
      targets:
        - v=spf1 include:amazonses.com ~all
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: svxhyimgvhbtlrpbuivbx6ievcg5iwiw._domainkey.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - svxhyimgvhbtlrpbuivbx6ievcg5iwiw.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: frps4kqaz6dyvptmesuiwlaendicjq5v._domainkey.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - frps4kqaz6dyvptmesuiwlaendicjq5v.dkim.amazonses.com
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
    - dnsName: caa46ibjaox7qooavcfri6ha3xbxxjld._domainkey.devantler.tech
