  namespace: external-dns
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: proxied
  namespace: external-dns
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
