---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: missing-endpoints
  namespace: external-dns
spec: {}
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: weighted-record
  namespace: external-dns
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordTTL: 300
      recordType: CNAME
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
      setIdentifier: weighted
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
