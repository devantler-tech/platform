# The second half of restrict-backstage-retirement-writer-conjuncts (#4996): a
# CA renewal that replaces the private key, a leaf renewal on a Secret of the
# wrong type, a root CA refresh with a second data key and a trust bundle
# refresh that edits another annotation are denied. A monitoring refresh that
# keeps the expected operator version is allowed, so a rewrite cannot require
# the version to change on every refresh. values.yaml supplies the parsed
# retirement journal, the request identity and the previous object per
# resource.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-writer-conjuncts-2
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/backstage-db-ca
      - backstage/backstage-db-server
    kind: Secret
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/kube-root-ca.crt
      - backstage/cloudflare-origin-ca
    kind: ConfigMap
    result: fail
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/cnpg-default-monitoring
    kind: ConfigMap
    result: pass
