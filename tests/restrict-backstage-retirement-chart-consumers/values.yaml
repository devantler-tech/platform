apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
globalValues:
  request.operation: UPDATE
policies:
  - name: restrict-backstage-retirement
    resources:
      - name: backstage
        values:
          retirement: &bound
            present: true
            namespaceUID: 00000000-0000-4000-8000-000000000001
            record:
              version: 1
              phase: fenced
              namespaceUID: 00000000-0000-4000-8000-000000000001
              sourceSHA: 0123456789abcdef0123456789abcdef01234567
              revision: latest@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              run: "123"
              latestHistoryUID: 00000000-0000-4000-8000-000000000020
              targets:
                - {kind: Deployment, name: backstage, uid: 00000000-0000-4000-8000-000000000011}
                - {kind: Service, name: backstage, uid: 00000000-0000-4000-8000-000000000012}
                - {kind: ConfigMap, name: backstage-app-config, uid: 00000000-0000-4000-8000-000000000013}
                - {kind: HelmRelease, name: backstage, uid: 00000000-0000-4000-8000-000000000014}
                - {kind: HelmChart, name: backstage-backstage, uid: 00000000-0000-4000-8000-000000000015}
              retiringUIDs:
                - 00000000-0000-4000-8000-000000000011
                - 00000000-0000-4000-8000-000000000012
                - 00000000-0000-4000-8000-000000000013
                - 00000000-0000-4000-8000-000000000014
                - 00000000-0000-4000-8000-000000000015
              retained:
                - {kind: PersistentVolumeClaim, name: backstage-db-1, uid: 00000000-0000-4000-8000-000000000021}
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: backstage
              namespace: backstage
              uid: 00000000-0000-4000-8000-000000000014
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: backstage-backstage
                namespace: backstage
              # kyverno test overlays this map on the resource, so an absent
              # field would inherit the new value; null makes it absent here.
              uninstall: null
      - name: chart-consumer
        values:
          request.operation: CREATE
          retirement: *bound
      - name: status-consumer
        values:
          retirement: *bound
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: status-consumer
              namespace: apps
              uid: 00000000-0000-4000-8000-000000000040
            spec:
              interval: 1h
              chart:
                spec:
                  chart: backstage
                  sourceRef:
                    kind: HelmRepository
                    name: backstage
            status:
              helmChart: backstage/backstage-backstage
      - name: backstage-replaced
        values:
          retirement: *bound
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: backstage-replaced
              namespace: backstage
              uid: 00000000-0000-4000-8000-000000000041
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: backstage-backstage
      - name: backstage-pending
        values:
          retirement:
            present: true
            namespaceUID: 00000000-0000-4000-8000-000000000001
            record:
              version: 1
              phase: capturing
              namespaceUID: 00000000-0000-4000-8000-000000000001
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: backstage-pending
              namespace: backstage
              uid: 00000000-0000-4000-8000-000000000042
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: backstage-backstage
                namespace: backstage
      - name: unrelated
        values:
          retirement: *bound
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: unrelated
              namespace: apps
              uid: 00000000-0000-4000-8000-000000000043
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: other-chart
                namespace: apps
      - name: absent-consumer
        values:
          retirement:
            present: false
            record: {}
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: absent-consumer
              namespace: apps
              uid: 00000000-0000-4000-8000-000000000044
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: backstage-backstage
                namespace: backstage
      - name: local-chart
        values:
          retirement: *bound
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: local-chart
              namespace: apps
              uid: 00000000-0000-4000-8000-000000000045
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: backstage-backstage
      - name: switching-consumer
        values:
          retirement: *bound
          request.oldObject:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: switching-consumer
              namespace: apps
              uid: 00000000-0000-4000-8000-000000000046
            spec:
              interval: 1h
              chartRef:
                kind: HelmChart
                name: other-chart
                namespace: apps
