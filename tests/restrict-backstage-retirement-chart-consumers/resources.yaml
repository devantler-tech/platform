# Captured HelmRelease, recorded identity, consuming the captured chart, given
# the uninstall options the retirement driver adds: allowed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000014
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
  uninstall:
    keepHistory: true
    disableHooks: true
    disableWait: false
    deletionPropagation: foreground
    timeout: 5m
---
# New HelmRelease in another namespace that references the captured chart: denied.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chart-consumer
  namespace: apps
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
---
# HelmRelease whose status names the captured chart, updated: denied.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: status-consumer
  namespace: apps
  uid: 00000000-0000-4000-8000-000000000040
spec:
  interval: 1h
  chart:
    spec:
      chart: backstage
      sourceRef:
        kind: HelmRepository
        name: backstage
status:
  helmChart: backstage/backstage-backstage
---
# HelmRelease in the namespace that references the captured chart by local name: denied.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-replaced
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000041
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
---
# Consumer updated while the journal is present but not yet bound: denied.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage-pending
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000042
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
---
# HelmRelease that consumes a different chart: out of scope.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unrelated
  namespace: apps
  uid: 00000000-0000-4000-8000-000000000043
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: other-chart
    namespace: apps
---
# Consumer updated while no journal is present: out of scope.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: absent-consumer
  namespace: apps
  uid: 00000000-0000-4000-8000-000000000044
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
---
# HelmRelease in another namespace referencing its own local chart of the same
# name (chartRef namespace omitted): out of scope, because the captured chart
# is identified by namespace as well as kind and name.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-chart
  namespace: apps
  uid: 00000000-0000-4000-8000-000000000045
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
---
# Existing HelmRelease switched from another chart to the captured chart:
# denied, because the new object decides whether it consumes the chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: switching-consumer
  namespace: apps
  uid: 00000000-0000-4000-8000-000000000046
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: backstage-backstage
    namespace: backstage
