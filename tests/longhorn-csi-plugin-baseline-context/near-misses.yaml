# NEAR MISS: the same DaemonSet name in another namespace.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-csi-plugin
  namespace: tenant-control
spec:
  selector:
    matchLabels:
      app: longhorn-csi-plugin
  template:
    metadata:
      labels:
        app: longhorn-csi-plugin
    spec:
      containers:
        - name: longhorn-csi-plugin
          image: longhorn-manager:v1
---
# NEAR MISS: an engine-image DaemonSet in longhorn-system. Engine images are
# storage plane and stay on #3918's volume-reference sequencing.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: engine-image-ei-493e04e7
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: engine-image
  template:
    metadata:
      labels:
        app: engine-image
    spec:
      containers:
        - name: engine-image
          image: longhorn-engine:v1
