# Pins the policy's behaviour across its ValidatingPolicy rewrite (#4996).
# A maxUnavailable PDB passes and a minAvailable PDB fails. Each exclusion is
# pinned: a CloudNativePG-labelled PDB, a KSail-installed PDB by name, and a
# Longhorn-managed PDB, which is exempt only inside longhorn-system.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-pdb-drain-safe
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/validate-pdb-drain-safe.yaml
resources:
  - resources.yaml
results:
  - policy: validate-pdb-drain-safe
    resources:
      - apps/max-unavailable
    kind: PodDisruptionBudget
    result: pass
  - policy: validate-pdb-drain-safe
    resources:
      - apps/min-available
      - apps/instance-manager-outside-longhorn
    kind: PodDisruptionBudget
    result: fail
  - policy: validate-pdb-drain-safe
    resources:
      - apps/cnpg-cluster
      - cert-manager/cert-manager
      - longhorn-system/instance-manager-abc123
      - longhorn-system/csi-attacher
    kind: PodDisruptionBudget
    result: skip
