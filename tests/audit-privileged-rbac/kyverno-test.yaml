---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: audit-privileged-rbac
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/audit-privileged-rbac.yaml
resources:
  - resources.yaml
results:
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: ClusterRole
    result: pass
    resources:
      - read-only-rbac
      - application-manager
      - read-all
      - inert-custom-group-verb
      - inert-resource-verb
      - read-users
      - read-auth-metadata
      - aggregate-not-yet-populated
      - null-rules
      - non-resource-health-reader
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: ClusterRole
    result: fail
    resources:
      - triple-wildcard
      - wildcard-with-extra-values
      - bind-role
      - escalate-clusterrole
      - rbac-wildcard-verbs
      - rbac-wildcard-resources
      - rbac-wildcard-group
      - impersonate-users
      - impersonate-groups
      - impersonate-wildcard-verbs
      - impersonate-wildcard-group
      - impersonate-wildcard-resources
      - impersonate-uids
      - impersonate-extras
      - impersonate-extras-subresource-wildcard
      - impersonate-auth-wildcard-verbs
      - impersonate-auth-wildcard-resources
      - resource-name-constrained
      # A name that only extends an excluded name is not excluded.
      - crossplane-rbac-manager-lookalike
      # A Role exclusion never exempts a ClusterRole of the same name.
      - velero-server
  # An excluded ClusterRole is skipped by name, whatever it grants. kyverno test also
  # reports a rule that never matched as skip, so these rows alone cannot tell
  # "excluded" from "not evaluated": the exact census in
  # scripts/tests/test-audit-privileged-rbac.sh is what proves the exclusion applies.
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: ClusterRole
    result: skip
    resources:
      - crossplane-rbac-manager
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: Role
    result: pass
    resources:
      - sample/namespaced-reader
      - sample/namespaced-null-rules
      - sample/inert-namespaced-user-impersonation
      - sample/inert-namespaced-auth-impersonation
      - sample/inert-namespaced-clusterrole-escalation
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: Role
    result: fail
    resources:
      - sample/namespaced-wildcard
      - sample/impersonate-serviceaccounts
      - sample/namespaced-clusterrole-bind
      # An excluded Role name in another namespace is not excluded.
      - sample/velero-server
  # An excluded Role is skipped only in its own namespace.
  - policy: audit-privileged-rbac
    rule: privileged-rules
    kind: Role
    result: skip
    resources:
      - velero/velero-server
