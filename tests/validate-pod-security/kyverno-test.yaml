---
# Pins what validate-pod-security decides today, rule by rule, so the policy's
# rewrite for #4996 must keep every decision. Resources are in resources.yaml;
# each one's comment there says what it exercises. Every controller kind the
# generated rules judge has a compliant, an insecure and an Unconfined-override
# template, so each generated rule is pinned in both directions.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-pod-security
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/validate-pod-security.yaml
resources:
  - resources.yaml
results:
  - policy: validate-pod-security
    rule: autogen-cronjob-deny-container-seccomp-unconfined
    kind: CronJob
    result: fail
    resources:
      - unconfined-cronjob
  - policy: validate-pod-security
    rule: autogen-cronjob-deny-container-seccomp-unconfined
    kind: CronJob
    result: pass
    resources:
      - compliant-cronjob
      - insecure-cronjob
  - policy: validate-pod-security
    rule: autogen-cronjob-require-seccomp-profile
