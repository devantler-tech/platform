---
# Pins what validate-pod-security decides today, rule by rule, so the policy's
# rewrite for #4996 must keep every decision. Resources are in resources.yaml;
# each one's comment there says what it exercises.
#
# The container matrix applies each securityContext change to the first and a
# later regular, init and ephemeral container, so a rewrite that checks only one
# position or one collection fails here. Every controller kind the generated
# rules judge has a compliant, an insecure and an Unconfined-override template.
#
# Recorded as today's behaviour, not as intent: an empty `capabilities.drop`
# list passes (`*-drop-empty`). Tightening that is a separate policy change.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-pod-security
policies:
  - >-
    ../../k8s/bases/infrastructure/cluster-policies/best-practices/validate-pod-security.yaml
resources:
  - resources.yaml
results:
  - policy: validate-pod-security
    rule: autogen-cronjob-deny-container-seccomp-unconfined
    kind: CronJob
    result: fail
    resources:
      - unconfined-cronjob
  - policy: validate-pod-security
    rule: autogen-cronjob-deny-container-seccomp-unconfined
