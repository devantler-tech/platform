# An insecure Deployment template is refused when the Deployment itself is applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-deployment
  namespace: workloads
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: true
---
