# Fixtures for validate-pod-security. They pin what the policy decides today, so
# a rewrite of the policy (#4996) has to keep every decision below.
#
# The container matrix: every container securityContext change below is applied,
# one at a time, to each position a container can hold: the first and a later
# regular container, the first and a later init container, and the first and a
# later ephemeral container. Every other container in the Pod stays hardened, so
# each Pod isolates exactly one change in exactly one place.
---
# Matrix: secure on the regular container at index 0.
apiVersion: v1
kind: Pod
metadata:
  name: container-0-secure
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: target
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
