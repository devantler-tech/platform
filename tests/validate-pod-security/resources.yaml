  name: ephemeral-0-caps-missing
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hardened
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
