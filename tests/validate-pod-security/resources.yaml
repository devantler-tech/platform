# Fixtures for validate-pod-security. They pin what the policy decides today, so
# a rewrite of the policy (#4996) has to keep every decision below.
---
# Every check satisfied: pod-level RuntimeDefault, hardened container.
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# A Localhost pod-level profile is accepted as well as RuntimeDefault.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-localhost
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/app.json
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# privileged may be set, but only to false.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-false
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
        privileged: false
---
# privileged: true is refused.
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
        privileged: true
---
# allowPrivilegeEscalation must be set to false, not left out.
apiVersion: v1
kind: Pod
metadata:
  name: missing-privilege-escalation
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# allowPrivilegeEscalation: true is refused.
apiVersion: v1
kind: Pod
metadata:
  name: privilege-escalation
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# runAsNonRoot is required on each container; the pod-level value does not count.
apiVersion: v1
kind: Pod
metadata:
  name: non-root-at-pod-level-only
  namespace: workloads
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
# A container with no securityContext at all is refused.
apiVersion: v1
kind: Pod
metadata:
  name: no-security-context
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
# Dropping a single capability instead of ALL is refused.
apiVersion: v1
