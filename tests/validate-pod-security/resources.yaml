---
# A Localhost pod-level profile is accepted as well as RuntimeDefault.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-localhost
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/app.json
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# runAsNonRoot is required on each container; the pod-level value does not count.
apiVersion: v1
kind: Pod
metadata:
  name: non-root-at-pod-level-only
  namespace: workloads
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
# A pod with no pod-level seccomp profile is refused, even with hardened containers.
apiVersion: v1
kind: Pod
metadata:
  name: no-pod-seccomp
  namespace: workloads
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# A container-level profile does not stand in for the pod-level one.
apiVersion: v1
kind: Pod
metadata:
  name: container-seccomp-only
  namespace: workloads
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
---
# An Unconfined pod-level profile is refused.
apiVersion: v1
kind: Pod
metadata:
  name: pod-seccomp-unconfined
  namespace: workloads
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
---
# Fails every check. Its twins below sit in exempt namespaces.
apiVersion: v1
kind: Pod
metadata:
  name: insecure
  namespace: workloads
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        privileged: true
        seccompProfile:
          type: Unconfined
---
# The same Pod in the exempt namespace kube-system: no check applies.
