---
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
globalValues:
  request.operation: UPDATE
# kyverno test presents an update with the previous object equal to the new
# one. The values below are merged into the previous object, so the row tests a
# change.
policies:
  - name: restrict-github-team-external-identity
    resources:
      - name: admins
        values:
          request.oldObject:
            metadata:
              name: admins
              namespace: github-config
              annotations:
                crossplane.io/external-name: "18573307"
      - name: other
        values:
          request.oldObject:
            metadata:
              name: other
              namespace: github-config
              annotations:
                # The values are merged into the previous object, so "no identity"
                # has to be stated as an empty one.
                crossplane.io/external-name: ""
      - name: maintainers
        values:
          request.oldObject:
            metadata:
              name: maintainers
              namespace: github-config
              annotations:
                crossplane.io/external-name: "99999999"
