---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-github-team-external-identity-members-update
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-github-team-external-identity.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-github-team-external-identity
    rule: teammemberships-external-name-matches-declared-member
    resources:
      - github-config/unchanged-unusual
      - github-config/cleared
      - github-config/set-approved
    kind: TeamMembership
    result: pass
  - policy: restrict-github-team-external-identity
    rule: teammemberships-external-name-matches-declared-member
    resources:
      - github-config/changed
      - github-config/retargeted-team
      - github-config/retargeted-subject
      - github-config/from-wildcard
      - github-config/unchanged-init-provider-subject
      - github-config/cleared-retargeted-team
      - github-config/cleared-retargeted-subject
    kind: TeamMembership
    result: fail
