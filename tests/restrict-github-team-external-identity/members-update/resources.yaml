---
# An identity the provider recorded in a shape this rule would not approve is left as it is by the next apply, which must not be refused.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: unchanged-unusual
  namespace: github-config
  annotations:
    crossplane.io/external-name: "18573307:devantler-as-recorded"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
---
# Removing the identity makes the provider create the declared one again.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: cleared
  namespace: github-config
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
---
# Stating the approved identity on an object that had none.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: set-approved
  namespace: github-config
  annotations:
    crossplane.io/external-name: "17046606:devantler"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: maintainers
      policy:
        resolve: Always
---
# The identity moves to another team.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: changed
  namespace: github-config
  annotations:
    crossplane.io/external-name: "99999999:devantler"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: maintainers
      policy:
        resolve: Always
---
# The identity stays, the team reference moves to admins.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: retargeted-team
  namespace: github-config
  annotations:
    crossplane.io/external-name: "17046606:devantler"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
---
# The identity stays, the declared username moves.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: retargeted-subject
  namespace: github-config
  annotations:
    crossplane.io/external-name: "17046606:devantler"
spec:
  forProvider:
    username: someone-else
    teamIdRef:
      name: maintainers
      policy:
        resolve: Always
---
# A wildcard as the previous identity does not make every new one unchanged.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: from-wildcard
  namespace: github-config
  annotations:
    crossplane.io/external-name: "99999999:devantler"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
---
# Unchanged identity, but the username is stated under initProvider, where it could be moved unseen.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: unchanged-init-provider-subject
  namespace: github-config
  annotations:
    crossplane.io/external-name: "18573307:devantler"
spec:
  forProvider:
    teamIdRef:
      name: admins
      policy:
        resolve: Always
  initProvider:
    username: someone-else
---
# Removing the stored identity while pointing the object somewhere else: the provider
# may write the old identity back onto an object that now declares another team.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: cleared-retargeted-team
  namespace: github-config
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
---
# Removing the stored identity while pointing the object somewhere else: the provider
# may write the old identity back onto an object that now declares another subject.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: cleared-retargeted-subject
  namespace: github-config
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
