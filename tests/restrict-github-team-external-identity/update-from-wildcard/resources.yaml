---
# A previous identity of * must not make every later value count as unchanged. The dependent TeamMembership and TeamRepository resources accept a team slug, so a slug here is a foreign team like any other.
apiVersion: team.github.m.upbound.io/v1beta1
kind: Team
metadata:
  name: admins
  namespace: github-config
  annotations:
    crossplane.io/external-name: "security-admins"
spec:
  forProvider:
    privacy: closed
