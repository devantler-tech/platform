---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-github-team-external-identity-members-create
policies:
  - >-
    ../../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-github-team-external-identity.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user-info.yaml
results:
  - policy: restrict-github-team-external-identity
    rule: teammemberships-external-name-matches-declared-member
    resources:
      - github-config/admins-approved
      - github-config/maintainers-approved
      - github-config/unset
    kind: TeamMembership
    result: pass
  - policy: restrict-github-team-external-identity
    rule: teammemberships-external-name-matches-declared-member
    resources:
      - github-config/swapped-team
      - github-config/swapped-team-reverse
      - github-config/other-subject
      - github-config/foreign-team
      - github-config/slug-identity
      - github-config/wildcard
      - github-config/wildcard-subject
      - github-config/longer-subject
      - github-config/undeclared-subject
    kind: TeamMembership
    result: fail
