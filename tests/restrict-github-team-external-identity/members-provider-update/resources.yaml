---
# The provider records whatever GitHub returned; it is exempt.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamMembership
metadata:
  name: provider-recorded
  namespace: github-config
  annotations:
    crossplane.io/external-name: "99999999:devantler"
spec:
  forProvider:
    username: devantler
    teamIdRef:
      name: admins
      policy:
        resolve: Always
