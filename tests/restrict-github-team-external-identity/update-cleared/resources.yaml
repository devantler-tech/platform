---
# Removing the identity points the object at no team at all, which the name
# binding in restrict-github-team-management already covers. It is accepted so
# an artifact that stops stating an identity is not wedged.
apiVersion: team.github.m.upbound.io/v1beta1
kind: Team
metadata:
  name: maintainers
  namespace: github-config
spec:
  forProvider:
    privacy: closed
