# Pins the fence-native-targets rule before the ValidatingPolicy rewrite
# (#4996). The retirement journal is read from the backstage Namespace through
# an API call, which kyverno test cannot make, so values.yaml supplies the
# parsed journal and the previous object per resource. kyverno test merges
# that previous object into the resource, so a changed field differs by value,
# never by a key only one side has. Under a bound journal a captured target
# may be updated only without changing its identity, metadata or spec; any
# other update, or any update while the journal is not bound, is denied.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-native-targets
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: fence-native-targets
    resources:
      - backstage/backstage
    kind: Deployment
    result: pass
  - policy: restrict-backstage-retirement
    rule: fence-native-targets
    resources:
      - backstage/backstage-app-config
    kind: ConfigMap
    result: fail
  - policy: restrict-backstage-retirement
    rule: fence-native-targets
    resources:
      - backstage/backstage-backstage
    kind: HelmChart
    result: fail
