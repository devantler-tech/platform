---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: longhorn-benchmark-retirement-runtime
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/set-longhorn-benchmark-retirement-context.yaml
resources:
  - resources.yaml
results:
  - policy: set-longhorn-benchmark-retirement-context
    rule: use-host-runtime-identity
    resources:
      - instance-manager-retirement
    kind: Pod
    result: pass
    patchedResources: patched-resources.yaml
