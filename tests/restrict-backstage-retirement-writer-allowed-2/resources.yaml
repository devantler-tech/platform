# The recorded operator renews the replication leaf certificate and keeps
# its private key: allowed.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-replication
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000053
type: kubernetes.io/tls
data:
  tls.crt: bmV3LXJlcGxpY2F0aW9u
  tls.key: cmVwbGljYXRpb24ta2V5
---
# The recorded operator promotes a retained replica claim to primary, with
# both role labels agreeing: allowed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-2
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000022
  labels:
    cnpg.io/cluster: backstage-db
    role: primary
    cnpg.io/instanceRole: primary
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: hcloud-volumes
---
# The recorded root CA publisher replaces a non-canonical description with
# the canonical text and leaves the CA unchanged: allowed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-root-ca.crt
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000061
  annotations:
    kubernetes.io/description: Contains a CA bundle that can be used to verify the kube-apiserver when using internal endpoints such as the internal service IP or kubernetes.default.svc. No other usage is guaranteed across distributions of Kubernetes clusters.
data:
  ca.crt: root-ca
---
# The recorded operator upgrades monitoring queries captured at the audited
# 1.29.1 version to 1.30.1: allowed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-default-monitoring
  namespace: backstage
  uid: 00000000-0000-4000-8000-000000000063
  annotations:
    cnpg.io/operatorVersion: "1.30.1"
data:
  queries: new-queries
