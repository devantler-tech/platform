# Pins the routine controller writes the writer exceptions of the
# preserve-retained-identities rule allow beyond
# restrict-backstage-retirement-cnpg-writer and -ca-bundle-writers (#4996): a
# replication certificate renewal, a replica promoted to primary, a root CA
# description corrected to the canonical text, and monitoring queries upgraded
# from the audited 1.29.1 version. values.yaml supplies the parsed retirement
# journal, the request identity and the previous object per resource.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-writer-allowed-2
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/backstage-db-replication
    kind: Secret
    result: pass
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/backstage-db-2
    kind: PersistentVolumeClaim
    result: pass
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/kube-root-ca.crt
    kind: ConfigMap
    result: pass
  - policy: restrict-backstage-retirement
    rule: preserve-retained-identities
    resources:
      - backstage/cnpg-default-monitoring
    kind: ConfigMap
    result: pass
