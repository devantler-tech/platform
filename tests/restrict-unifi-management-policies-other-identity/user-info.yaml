---
# The provider's own identity: Crossplane's writes are never the source's.
apiVersion: cli.kyverno.io/v1alpha1
kind: UserInfo
metadata:
  name: unifi-provider
userInfo:
  username: system:serviceaccount:crossplane-system:provider-upjet-unifi
  groups:
    - system:serviceaccounts
    - system:serviceaccounts:crossplane-system
    - system:authenticated
