apiVersion: v1
kind: Namespace
metadata:
  name: prune-test
---
# Its team-label result becomes stale once require-team-label excludes it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: excluded-later
  namespace: prune-test
data: {}
---
# Excluded from both policies, so every result in its report goes stale and no
# scan writes a current one. This stands in for a report the background scan
# never revisits (a filtered kind or namespace): its failures must survive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: never-rescanned
  namespace: prune-test
data: {}
---
# Control: every result stays current, so its report must never be deleted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: always-current
  namespace: prune-test
data: {}
---
# The chart's default filters keep kube-system out of background scans. The
# proof seeds PolicyReports for these two real resources after creation so the
# cleanup policy can prove its one reviewed filtered-namespace exception.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-hetzner-cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app: filtered-exempt
  template:
    metadata:
      labels:
        app: filtered-exempt
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-lookalike
  namespace: kube-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app: filtered-lookalike
  template:
    metadata:
      labels:
        app: filtered-lookalike
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: team-label
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [prune-test]
      validate:
        message: team label required
        pattern:
          metadata:
            labels:
              team: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-owner-label
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: owner-label
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [prune-test]
      validate:
        message: owner label required
        pattern:
          metadata:
            labels:
              owner: "?*"
