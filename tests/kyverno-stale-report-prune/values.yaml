# Production's report settings (k8s/bases/infrastructure/controllers/kyverno/helm-release.yaml)
# with a one-minute scan so the proof finishes in minutes.
features:
  backgroundScan:
    skipResourceFilters: false
    backgroundScanInterval: 1m
config:
  matchConditions:
    - name: exclude-already-filtered-auth-reviews
      expression: >-
        !((request.resource.group == "authentication.k8s.io" &&
        request.resource.resource == "tokenreviews") ||
        (request.resource.group == "authorization.k8s.io" &&
        request.resource.resource in ["subjectaccessreviews", "selfsubjectaccessreviews"]))
  resourceFiltersInclude:
    - "[Lease,*,*]"
    - "[PolicyReport,*,*]"
    - "[ClusterPolicyReport,*,*]"
    - "[AdmissionReport,*,*]"
    - "[ClusterAdmissionReport,*,*]"
    - "[BackgroundScanReport,*,*]"
    - "[ClusterBackgroundScanReport,*,*]"
  resourceFiltersExclude:
    - "[Node,*,*]"
    - "[*/*,kube-system,*]"
    - "[*/*,kube-public,*]"
    - "[*/*,kube-node-lease,*]"
