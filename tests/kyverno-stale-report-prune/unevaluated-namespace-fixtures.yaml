# #3155, #4234: a policy that matches a ConfigMap in each system namespace, and one
# such ConfigMap per namespace. kube-system, kube-public and kube-node-lease are
# dropped from the resource filters, so each must get a report. kyverno stays in
# the filters, which background scans honour (skipResourceFilters: false), so it
# must get none. The proof checks both before docs/policy-reports.md relies on
# them. unevaluated-control is the positive control: an ordinary namespace where
# the same policy must produce a report.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-owner-label-unevaluated
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: owner-label
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [kube-system, kube-public, kube-node-lease, kyverno, unevaluated-control]
      validate:
        message: owner label required
        pattern:
          metadata:
            labels:
              owner: "?*"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unevaluated-probe
  namespace: kube-system
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unevaluated-probe
  namespace: kube-public
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unevaluated-probe
  namespace: kube-node-lease
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unevaluated-probe
  namespace: kyverno
data: {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: unevaluated-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unevaluated-probe
  namespace: unevaluated-control
data: {}
