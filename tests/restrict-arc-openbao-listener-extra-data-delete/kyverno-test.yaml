# Pins the ClusterPolicy's behaviour before its ValidatingPolicy rewrite (#4995):
# a second data key beside listener.hcl is denied.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-arc-openbao-listener-extra-data-delete
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/restrict-arc-openbao-listener-settings.yaml
resources:
  - ../restrict-arc-openbao-listener-extra-data/resources.yaml
variables: ../restrict-arc-openbao-listener-delete/values.yaml
results:
  - policy: restrict-arc-openbao-listener-settings
    resources:
      - openbao/arc-openbao-listener
    kind: ConfigMap
    result: fail
