---
# The platform's copy of the catalog's auto-vpa-statefulset GeneratingPolicy (#5130).
# The baseline catalog fixture at 44ed118 is moved to a non-system namespace
# and includes the ownership backport from reviewed 8a36995. The Platform keeps
# its existing naming and resource behavior. System-namespace exclusion and its
# selector-removal generation control are pinned by
# scripts/tests/test-auto-vpa-generating-policy-exclusion.sh.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auto-vpa-generating-policy-statefulset
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/auto-vpa-statefulset.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: auto-vpa-statefulset
    rule: auto-vpa-statefulset
    resources:
      - apps-ns/shared
    generatedResource: generated-vpa.yaml
    kind: StatefulSet
    result: pass
