# Pins the policy's behaviour across its ValidatingPolicy rewrite (#4996).
# A versioned tag, a tag+digest and a digest alone pass, with or without a
# registry port; a registry port is not a tag; ':latest' fails, as does a tagless
# image, in a regular, init or ephemeral container; the same tagless image in an
# excluded infrastructure namespace is out of scope. Workload controllers are
# judged through the rules Kyverno generates: a `:latest` or tagless Deployment
# or Job fails in an ordinary namespace, and a Deployment or CronJob in an
# infrastructure namespace is skipped, the same as a Pod (#5168).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/disallow-latest-tag.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    resources:
      - default/versioned-tag
      - default/tag-and-digest
      - default/digest-only
      - default/registry-port-versioned-tag
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources:
      - default/tagless
      - default/tagless-init-container
      - default/latest-tag
      - default/latest-tag-init-container
      - default/latest-tag-ephemeral-container
      - default/tagless-ephemeral-container
      - default/registry-port-tagless
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - kube-system/tagless
    kind: Pod
    result: skip
  - policy: disallow-latest-tag
    resources:
      - default/versioned-tag-deployment
    kind: Deployment
    result: pass
  - policy: disallow-latest-tag
    resources:
      - default/latest-tag-deployment
      - default/tagless-deployment
    kind: Deployment
    result: fail
  - policy: disallow-latest-tag
    resources:
      - default/latest-tag-job
    kind: Job
    result: fail
  - policy: disallow-latest-tag
    resources:
      - observability/latest-tag-deployment
      - observability/tagless-deployment
    kind: Deployment
    result: skip
  - policy: disallow-latest-tag
    resources:
      - kube-system/latest-tag-cronjob
    kind: CronJob
    result: skip
