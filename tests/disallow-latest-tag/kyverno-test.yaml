# Pins the ClusterPolicy's behaviour before its ValidatingPolicy rewrite (#4996).
# A versioned tag and a tag+digest pass both rules; ':latest' fails only the
# latest-tag rule; a tagless image fails only the tag-required rule; the same
# tagless image in an excluded infrastructure namespace is out of scope.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../../k8s/bases/infrastructure/cluster-policies/best-practices/disallow-latest-tag.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - default/versioned-tag
      - default/tag-and-digest
      - default/latest-tag
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - default/tagless
      - default/tagless-init-container
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - default/versioned-tag
      - default/tag-and-digest
      - default/tagless
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - default/latest-tag
      - default/latest-tag-init-container
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - kube-system/tagless
    kind: Pod
    result: skip
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resources:
      - kube-system/tagless
    kind: Pod
    result: skip
