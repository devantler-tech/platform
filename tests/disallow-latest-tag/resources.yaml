  namespace: default
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init
  containers:
    - name: app
      image: ghcr.io/example/app:1.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag-init-container
  namespace: default
spec:
  initContainers:
    - name: init
      image: ghcr.io/example/init:latest
