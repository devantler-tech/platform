    result: pass
    patchedResources: patched-resources.yaml
  - policy: restrict-storage-to-baseline-workers
    rule: disable-replica-scheduling-on-autoscale-nodes
    resources:
      - autoscale-longhorn-v1-1123456789abcdef
      - autoscale-longhorn-v2-2123456789abcdef
      - prod-worker-1
    kind: Node
    result: skip
