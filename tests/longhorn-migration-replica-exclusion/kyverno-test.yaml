apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: longhorn-migration-replica-exclusion
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-storage-to-baseline-workers.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-storage-to-baseline-workers
    rule: disable-replica-scheduling-on-autoscale-nodes
