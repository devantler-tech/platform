---
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: values
# The policy uses a namespaceSelector, so the CLI needs the namespace labels
# declared explicitly or every case is reported as Excluded.
namespaceSelector:
  - name: wedding-app
    labels:
      app.kubernetes.io/managed-by: ksail
  - name: ascoachingogvaner
    labels:
      app.kubernetes.io/managed-by: ksail
  - name: business-site
    labels:
      app.kubernetes.io/managed-by: kro
  - name: future-tenant
    labels:
      app.kubernetes.io/managed-by: ksail
  - name: platform-ns
    labels: {}
