apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hr-compliant
  namespace: tenant
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: app
      sourceRef:
        kind: HelmRepository
        name: app
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
---
