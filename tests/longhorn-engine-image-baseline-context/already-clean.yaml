# CONVERGENCE: the target after the retrofit has applied once. Every
# precondition must be false, so a second pass produces no patch at all.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: engine-image-ei-493e04e7
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      longhorn.io/engine-image: ei-493e04e7
  template:
    metadata:
      labels:
        longhorn.io/engine-image: ei-493e04e7
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: engine-image-ei-493e04e7
          image: longhorn-engine:v1.12.1
          securityContext:
            privileged: true
            seLinuxOptions: {}
