---
apiVersion: v1
kind: Pod
metadata:
  name: hcloud-claim
  namespace: observability
spec:
  priorityClassName: hcloud-volume-workload
  priority: 1000
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-hcloud
  namespace: observability
spec:
  priorityClassName: hcloud-volume-workload
  priority: 1000
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            storageClassName: hcloud
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
