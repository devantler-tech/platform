# Pins the fence-retiring-dependencies rule before the ValidatingPolicy
# rewrite (#4996). The retirement journal is read from the backstage Namespace
# through an API call, which kyverno test cannot make, so values.yaml supplies
# the parsed journal and the previous object per resource. Under a bound
# journal, a captured retiring object owned by another retiring object may be
# updated only while its identity and owner references stay the same; nothing
# else may be created or updated as a dependent of a retiring owner. While the
# journal is present but not bound, every create or update in the namespace is
# denied. A resource with no retiring owner under a bound journal, or any
# resource while no journal is present, is out of scope.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-backstage-retirement-retiring-dependencies
policies:
  - ../../k8s/providers/hetzner/infrastructure/cluster-policies/restrict-backstage-retirement.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-5d8f9
    kind: ReplicaSet
    result: pass
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-7c9a1
    kind: ReplicaSet
    result: fail
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-dependent
      - backstage/backstage-pending
    kind: ConfigMap
    result: fail
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-5d8f9-new
    kind: Pod
    result: fail
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-unrelated
      - backstage/backstage-absent
    kind: ConfigMap
    result: skip
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - apps/apps-dependent
    kind: ConfigMap
    result: skip
  - policy: restrict-backstage-retirement
    rule: fence-retiring-dependencies
    resources:
      - backstage/backstage-5d8f9-captured
    kind: Pod
    result: skip
