# Betterleaks configuration. MegaLinter's REPOSITORY_BETTERLEAKS extends this file, and this file
# extends the upstream default ruleset. Each allowlist below names one rule and one shape that is
# not secret material, so a real credential anywhere else, or of another shape, still fails.
# Test fixtures that can carry a comment use an inline `betterleaks:allow` instead.

[extend]
useDefault = true

[[allowlists]]
description = "Container identities: `docker run --user <uid>:<gid>` near a curl call is a numeric user, not a curl credential."
targetRules = ["curl-auth-user"]
regexes = ['''^[0-9]+:[0-9]+$''']

[[allowlists]]
description = "Disposable test accounts: the mail-server tests sign in as `fixture` to a throwaway local container."
targetRules = ["curl-auth-user"]
regexes = ['''^fixture:[a-z-]+$''']

[[allowlists]]
description = "Go module checksums: an `h1:` go.sum line, as quoted in a vendored go.sum diff, is a public hash."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^[+ -]?\S+ v\S+ h1:[A-Za-z0-9+/]{43}=$''']
